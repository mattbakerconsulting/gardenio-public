  # Edge sign-in check for every public host on the public-edge nginx (plan
  # ziti-to-keycloak, S2a gd-hRltljHGon), and for gardenio.clonk.tv today
  # (gd-WJ09iJNvFM, owner decision gd-bn2XZleUVw: oauth2-proxy in front of the
  # viewer, no HMAC edge envelope). In-cluster only: no Traefik route, ever.
  # nginx calls /oauth2/auth?allowed_groups=/gardenio-admins per host and
  # overwrites the identity headers it forwards, including the signed-in
  # user's own Keycloak access token, which viewer-authproxy (8097) hands the
  # viewer so kbeads accepts an escalation approve/reject. viewer-authproxy's
  # own sign-in check (its ziti 8443 front door) and its 8095 break-glass went
  # with ziti (gd-xNMLrsgajy).
  # Cookies are host-only (cookieDomain: ""): one sign-in cookie per host, the
  # callback derived per host from X-Forwarded-Host (no --redirect-url).
  # Needs the gardenio-forwardauth-secrets Secret (client-secret,
  # cookie-secret); see the prerequisite block at the top of this section.
  forwardAuth:
    enabled: true
    replicaCount: 1
    # No PDB at one replica. The chart's minAvailable: 1 is maxUnavailable: 0
    # here: the eviction API refuses the pod forever, so the cluster-autoscaler
    # can never empty the node it sits on (it is unpinned, so often a spot node)
    # and a drain wedges (gd-TEP4ygX3dq). Same reasoning as pdb-singletons.yaml.
    podDisruptionBudget: {enabled: false}
    oidcIssuerUrl: "https://auth.clonk.tv/auth/realms/gardenio"
    clientId: "gardenio-traefik-forwardauth"
    cookieDomain: ""          # host-only cookies; one sign-in cookie per host
    whitelistDomains: [auth.clonk.tv, grafana.clonk.tv, gardenio.clonk.tv, mux.clonk.tv, dashboard.clonk.tv]
    trustForwardHeader: false
    ingress: {enabled: false}           # never a Traefik route
    # No "groups" scope: this realm has no client scope of that name, so
    # requesting it fails sign-in with invalid_scope. The groups claim (full
    # path, /gardenio-admins) comes from this client's own groups mapper,
    # into the ID token, access token and userinfo (see clients: above).
    scope: "openid email profile"
    # Server-side sessions (gd-C2Sl6ClxAY). With the default cookie store the
    # whole session rides in ~4KB cookie chunks, and two concurrent refreshes
    # (the viewer polls every ~15s) each Set-Cookie their own chunks; the
    # browser keeps a mix, every request then fails "cookie signature not valid"
    # -> 401 -> /oauth2/start, and an in-flight write was lost. Redis makes the
    # cookie a small ticket and the refresh one atomic write. The Redis has no
    # persistence: a restart just forces a silent SSO re-sign-in.
    sessionStore:
      type: redis
      redis:
        deploy:
          image:
            registry: docker.io        # the chart default registry is the GitLab mirror
            repository: library/redis
            tag: "7.4-alpine"
    extraArgs:
      - "--cookie-csrf-per-request-limit=4"
      - "--skip-jwt-bearer-tokens=true"   # API host: verify bearer JWT sig/iss/aud
      - "--oidc-groups-claim=groups"

  # Second factor for gardenio-admin users: a passkey. Owner 2026-10-18: "turn
  # off mfa for passcode enabled devices, just use passcodes going forward"
  # (S4b gd-wO9MDjpz13). A passkey sign-in needs nothing more; a password
  # sign-in by a gardenio-admin must add a passkey. It does NOT enrol: an admin
  # with no passkey is refused, so every admin enrols in the account console
  # first (gardenio/docs/keycloak-passkeys-runbook.md). Non-admin users are
  # unaffected. TOTP is retired (S4c gd-GiZfavru5G deleted the TOTP
  # credentials); factor "totp" stays a last-resort rollback only, after which
  # every admin enrols a second factor again at the next sign-in.
  mfa: {enabled: true, factor: "passkey"}

  # GitHub sign-in (7.3, gd-Ju9z2X57Qw). OAuth app "Gardenio" in the
  # mattbakerconsulting org (id 3973147), callback
  # https://auth.clonk.tv/auth/realms/gardenio/broker/github/endpoint.
  # The client secret is the K8s Secret gardenio-github-idp (key
  # client-secret), created by hand from SM gardenio/github-idp-client-secret
  # before the roll; values hold only the public Client ID.
  githubIdp:
    enabled: true
    clientId: "Ov23lizMghgtklAT8eg8"

# --- TLS: ONE cert-manager Certificate, for hooks.clonk.tv only ---
# Everything else is reached over OpenZiti to ClusterIP Services and has no
# ingress TLS. The single public route (triggerEngine.ingress below, decision
# gd-Bz9rkZg5Q0) needs a trusted cert. mode=wildcard with a NON-wildcard
# domainName renders one Certificate (named <release>-wildcard-tls) whose only
# dnsName is hooks.clonk.tv, issued by the existing letsencrypt-dns01
# ClusterIssuer (Route53 DNS-01, helm/gardenio-ziti). No ClusterIssuer and no
# DNSEndpoint are rendered (clusterIssuer.create / dns.target stay off).
tls:
  enabled: true
  mode: wildcard
  domainName: hooks.clonk.tv
  issuer: letsencrypt-dns01

# --- backing services: postgres only ---
postgres:
  enabled: true
  # postgres_exporter sidecar for the "Postgres efficiency" dashboard
  # (gd-cawNAc0iU7). Enabling it rolls postgres once.
  exporter:
    enabled: true
    # Tasks for budget breaches go under the Postgres efficiency epic.
    report:
      parentEpic: "gd-PkZRCb0BuB"
  # 2026-10-15: at the chart's 1-core limit postgres was CPU-throttled in 63% of
  # CFS periods (cpu.stat), the bead list query (COUNT(*) OVER()) always on CPU,
  # and every viewer page / kd call slow. Its node (2 vCPU) had ~650m spare.
  # Stopgap while the query/caching work lands (see the perf task).
  # Memory request 256Mi -> 512Mi (gd-TEP4ygX3dq): live use was 412Mi, over the
  # request, which made the database a node-pressure eviction candidate. CPU
  # request (750m) and the 1Gi limit unchanged.
  #
  # 2026-10-31: kbeads p50 3 s and the viewer farm never loaded; postgres sat
  # at the 128MB default shared_buffers with a 19 GB beads DB (history tables
  # pruned to 3.8 GB the same day) and its node at 99% CPU. Memory 1Gi/3Gi and
  # shared_buffers 768MB were applied live at 17:09Z and 17:45Z; p50 fell to
  # ~1.7 s. These values keep them across rolls.
  resources:
    requests:
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  settings:
    shared_buffers: 768MB
    effective_cache_size: 2GB
  persistence:
    # Retain, so the DB survives a chart uninstall.
    storageClass: "local-path-retain"
    size: 10Gi
  # local-path is node-local, so postgres is pinned to whichever node binds it.
  # Pin it deliberately at the on-demand node instead of letting a spot node
  # claim the volume and take the database with it on reclaim. Same reasoning
  # as server_on_demand_base=1 for the beads Dolt volume.
  #
  # BOTH labels are required. gardenio.io/lifecycle=on-demand alone also
  # matches the on-demand k3s SERVER (an etcd member, currently
  # ip-10-90-5-163), which is a t3.small already carrying etcd, traefik and the
  # beads Dolt StatefulSet. role=platform confines this to the gardenio agent
  # pool.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform

  # DURABILITY GAP (gd-vekJWxnNGG) — read before putting anything you care
  # about in here. The nodeSelector above selects a CLASS of node, not a
  # specific one. "on-demand" means "not reclaimed by the spot market"; it
  # does not mean permanent. An instance refresh, AMI roll or AZ event still
  # takes the node, and delete_on_termination=true takes the root volume with
  # it. The local-path PV carries a nodeAffinity to that exact node, so the
  # PVC stays Bound to a PV naming a node that no longer exists and postgres
  # goes Pending forever — better than starting empty, but a hard outage with
  # no automatic recovery.
  #
  # postgres.backup below is NOT the answer on its own: it is a pg_dump
  # CronJob writing to another local-path PVC, which binds on the same node
  # class and dies in the same event. It protects against logical corruption,
  # not node loss.
  #
  # DONE: off-node backup via postgres.s3Backup below — a pg_dumpall CronJob
  # (no PVC) that ships hourly to
  # s3://gardenio-hq-backups-360190250083/k3s-postgres/, mirroring the beads
  # Dolt pattern (gardenio/helm/beads/dolt-backup-cronjob.yaml). The node
  # role's S3 grant for this prefix lives in terraform
  # (composition/gardenio/main.tf `extra_backup_prefixes`). Manually proven
  # once already (pgdumpall-20260920T224858Z.sql.gz, restored into a scratch
  # DB with matching row counts — see gd-vekJWxnNGG comment history); this
  # CronJob automates that same drill going forward. Restore runbook:
  # gardenio/docs/postgres-backup-restore.md.
  s3Backup:
    enabled: true
    # 2026-10-24 00:50Z: every 2 h, not hourly. After shape A put the whole
    # service stack on the postgres node (2026-10-23 21:46Z) the dump, which
    # took 46 min for 3.9 GB gzipped at 16:17Z, no longer finishes inside the
    # 50 min deadline: the 22:17Z and 23:17Z runs both died DeadlineExceeded
    # (postgres logs "connection to client lost" at +50:00). Hourly cannot hold
    # when one dump takes > 50 min (concurrencyPolicy: Forbid), so: 2-hourly
    # with a 110 min deadline. The real fixes are the beads bloat
    # (gd-R4Rs0dJBC5: beads DB 7.5 GB) and faster compression in the chart's
    # s3-backup-cronjob.yaml (gzip -1 / zstd); restore hourly once a dump is
    # back under ~30 min. The live CronJob was patched the same way at 00:50Z.
    schedule: "17 */2 * * *"
    # 2026-10-20: the beads DB reached 3.2 GB (trigger state churn, gd-R4Rs0dJBC5)
    # and pg_dumpall took >15 min, so every run hit the chart's 900 s deadline
    # and no backup succeeded for 16 h. 50 min keeps headroom under the hourly
    # schedule (concurrencyPolicy: Forbid). Revisit once gd-R4Rs0dJBC5 shrinks it.
    activeDeadlineSeconds: 6600
    bucket: gardenio-hq-backups-360190250083
    prefix: k3s-postgres
    # 2026-10-25 (gd-RbR8vI9K5e): the B1 preferred same-node affinity did not
    # hold. With Shape A filling the postgres node (ip-10-90-30-213, 1b), runs
    # landed in 1a and streamed the uncompressed dump (~33 GB) across the AZ,
    # about $0.66 per run and ~65% of DataTransfer-Regional on 10-24. So the
    # zone is now required. The selector drops lifecycle=on-demand, so the 1b
    # spot platform nodes can take a run when 30-213 is full; a spot reclaim
    # mid-run fails one run, and the next slot is 2 h later.
    # Fallback: if 2 runs in a row fail while still Pending (about 4 h with no
    # new dump), set requireSameZone: false. That goes back to B1's
    # preference, so a run may cross the AZ again but never waits.
    requireSameZone: true
    nodeSelector:
      gardenio.io/role: platform
      kubernetes.io/arch: amd64

postgresExternal: {enabled: false}   # no RDS in this account
# NATS, the event bus. Enabled 2026-09-19.
#
# READ THIS BEFORE CHANGING ANY OF IT. When nats.enabled is true the CONTROLLER
# Deployment gains a `nats-stream-init` initContainer
# (templates/controller/deployment.yaml:52) that waits for NATS and runs
# `nats stream add`. If NATS is unreachable, or refuses the connection, that
# initContainer fails and THE CONTROLLER NEVER ROLLS OUT — and the controller is
# what runs every crew agent. The failure presents as a stuck rollout with
# nothing obviously pointing at NATS.
#
# The specific landmine: with nats.auth.subjectIsolation.enabled true, the
# init container needs NATS_USER/NATS_PASSWORD from the
# gardenio-nats-infra-creds Secret. Without it the chart's own comment says it
# "connects anonymously and is refused, wedging the controller rollout".
# Since 2026-11-04 (gd-XieCvZHhKN, escalation gd-qs3vsB2BhO) that Secret and
# gardenio-nats-agent-creds EXIST and are operator-created (key `token`,
# 64 hex chars each, no ESO on k3s; durable copies in Secrets Manager under
# gardenio/<secret-name>). existingSecrets: true below tells the chart to
# render NEITHER Secret, so the passwords never land in values or the helm
# release. Never set it false here: an older chart, or this one without the
# flag, renders its own empty-token Secrets under the same names, helm refuses
# because the Secrets exist without helm ownership, and --atomic rolls back.
# Rotation: replace the value in the Secret (and in Secrets Manager; nothing
# syncs them), then `kubectl rollout restart` nats, the platform clients and
# the agents. The chart's checksum annotations do not track these Secrets.
#
# Safety net that made this safe to try: the controller Deployment is
# maxUnavailable:0 / maxSurge:1, so a wedged init container leaves the OLD
# controller pod serving while the new one fails to start. Recoverable.
nats:
  enabled: true
  # Was 300m / 512Mi; live 3m / 59Mi (gd-TEP4ygX3dq). Memory keeps room for
  # the 256M JetStream memory store. Limit 500m / 1Gi unchanged.
  resources:
    requests: {cpu: 50m, memory: 256Mi}
  auth:
    enabled: true
    subjectIsolation:
      enabled: true
      # Operator-created gardenio-nats-infra-creds / gardenio-nats-agent-creds
      # (key token, no ESO on k3s), gd-XieCvZHhKN. See the note above.
      existingSecrets: true
  persistence:
    enabled: true
    size: 2Gi
    storageClass: "local-path"
  # JetStream data is node-local on local-path, so pin it the same way postgres
  # is pinned — both labels, because lifecycle alone also matches the on-demand
  # etcd server (a t3.small already carrying traefik and the beads Dolt volume).
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
# In-box object store — this is what makes agent session RESUME work.
#
# Until this was enabled, agents.s3.bucket was "" (see the agents block below),
# which disabled resume end-to-end: the controller never set COOP_S3_BUCKET on
# agent pods, so gb init's s3ResumeIntended() returned false, so every launch ran
# cleanAllSessionLogs() and DELETED the prior transcript, and coop had no S3
# prefix to restore from. Every restart cold-started and threw its work away —
# 500/500 session beads reported resumed:false. Epic gd-hPVftSASd3.
#
# MinIO rather than AWS S3 because this cluster has no IRSA. The IRSA render
# guard (templates/validate-irsa.yaml:23) explicitly exempts endpoint mode for
# exactly this reason: an in-cluster store authenticates with static keys from a
# Secret. So setting an endpoint satisfies the guard the empty bucket was dodging.
#
# Root credentials are operator-seeded, not baked into values:
# scripts/deploy-byo.sh seeds gardenio-minio-credentials create-if-missing.
#
# CAPACITY: MinIO shares a node disk with postgres, and local-path does not
# enforce the 20Gi PVC size. On 2026-09-23 ip-10-90-29-1 had 13Gi free of 57Gi,
# and kubelet evicts at ~10% free (~5.7Gi), leaving ~7Gi of real margin.
# bucketQuota is the hard cap (uploads fail past it; postgres is not evicted);
# ilmExpiryDays keeps the archive under it. Re-measure before raising either.
# Re-measured 2026-10-18: the 4GiB cap filled 8 days after the 10-10 revival
# (~0.55 GB/day, 2316 sessions), so uploads and session archives failed with
# "Bucket quota exceeded"; 14 days at that rate is ~7.7 GB. MinIO's node
# (ip-10-90-2-170) had 20G free of 58G, so 10GiB keeps >8G above eviction.
# Re-measured 2026-10-22 (gd-DLPKn50ly5): the 10GiB cap filled again, at
# 1.3-1.85 GB/day over the last 4 days with the fleet busier; 14 and even 7
# days overflow it. The node had 10.2G free of 57G (eviction ~5.7G), so the
# cap stays and retention drops to 5 days (~7.5 GB at that rate). Objects
# older than 5 days were pruned by hand the same day (10.0 -> 6.4 GiB).
# Re-measured 2026-10-30 (gd-Uzjub11Jc9): full again at 10GiB with 5-day expiry
# (57,423 objects, ~2 GiB/day), so gb image upload failed. The node had 22G free
# of 58G (eviction ~5.8G), so the cap went to 14GiB (+4G, ~12G above eviction)
# and retention stays 5 days; growth cause is gd-lSqP7bpDv1.
# Re-measured 2026-11-05 (gd-ufturXMyej): full again, 13GiB / 70,490 objects
# at 5 days (~2.6 GiB/day, all of it coop/sessions/<bead>/ archives; the images
# prefix the ask named is 83MiB). The node had 12G free of 58G (80% used), so
# the cap stays at 14GiB and retention drops to 4 days (~10.5 GiB steady,
# ~3.5 GiB headroom). Applied live the same day (mc ilm rule edit); this value
# keeps it across rolls. A separate images bucket or quota is the owner's
# decision gd-NPlx6B9fpF.
objectStore:
  enabled: true
  bucket: "gardenio-sessions"   # MUST match agents.s3.bucket below
  # Was 100m; live <5m (gd-TEP4ygX3dq). Memory request and 512Mi limit as before.
  resources:
    requests: {cpu: 25m, memory: 256Mi}
  persistence:
    size: 20Gi
    storageClass: "local-path"
  ilmExpiryDays: 4
  bucketQuota: "14GiB"
  # Commons attachments: own bucket, no expiry, 5GiB (10 + 5 of the 20Gi PV).
  commonsFiles:
    bucket: "gardenio-commons-files"
    quota: "5GiB"
  # Session images (gd-CmjVAU3vgd, decision gd-NPlx6B9fpF): own bucket, so the
  # archive filling bucketQuota no longer fails gb image upload (gd-DLPKn50ly5,
  # gd-Uzjub11Jc9, gd-ufturXMyej). Measured 11-05: ~20 MB/day of images, so a
  # 90-day expiry holds ~1.8 GB under a 3GiB quota. The three quotas (14 + 5 + 3)
  # exceed the 20Gi PV, which local-path does not enforce; the node disk is the
  # real bound, and the archive rarely sits at its quota for long (4-day ILM).
  images:
    bucket: "gardenio-images"
    quota: "3GiB"
    ilmExpiryDays: 90
  # Read-only MinIO user for the beads daemon (escalation gd-k3GmLJKW8R, plan
  # gd-hmwSI9lwKe): the land door's decision evidence route serves
  # gardenio-sessions/coop/sessions/images/* with s3:GetObject and nothing
  # else. This cluster has no IRSA, so the AWS-side IAM role the escalation
  # describes does not apply. Secret gardenio-minio-beads-credentials was
  # operator-seeded 2026-11-04 (durable copy: AWS Secrets Manager
  # gardenio/gardenio-minio-beads-credentials) and the MinIO user + policy
  # gardenio-beads-evidence created by hand ahead of the roll, as the runbook
  # asks; the bootstrap Job re-applies both on every upgrade.
  beadsCredentials:
    enabled: true
  # local-path is node-local, so pin MinIO like postgres/nats: both labels,
  # because lifecycle alone also matches the on-demand etcd server. Unpinned,
  # the PV can bind on a spot agent node (3 of 5 are spot) and a reclaim strands
  # MinIO Pending forever.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  # Pull MinIO from pgsty (the maintained community fork), pinned by digest.
  # Upstream stopped publishing: docker.io/minio/minio answered 401 on
  # 2026-09-23 and its Hub repo is 404 since; quay.io/minio/{minio,mc} answered
  # 401 on 2026-10-10, stranding the revival in ImagePullBackOff. pgsty/minio
  # keeps the upstream entrypoint (docker-entrypoint.sh, cmd minio), so the
  # chart's `server /data` args work unchanged; pgsty/mc publishes only latest.
  image:
    registry: docker.io
    repository: pgsty/minio
    tag: "RELEASE.2026-08-04T00-00-00Z"
    digest: "sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372"
  mcImage:
    registry: docker.io
    repository: pgsty/mc
    tag: "latest"
    digest: "sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd"
# LiteLLM — the cost-tracking proxy. Enabled 2026-09-19.
#
# WHAT THIS DOES AND DOES NOT DO ON ITS OWN.
# Enabling litellm starts the proxy and lets the controller's spend-sync loop
# query it. It does NOT by itself route any agent traffic through it, so it does
# NOT yet track anything. ANTHROPIC_BASE_URL is set only by applyAccountConfig
# (cmd/controller/podspec.go:2113), which runs when an agent is bound to an
# ACCOUNT bead — and there are currently zero account beads. Agents talk to
# api.anthropic.com directly today.
#
# To actually capture spend you need an account bead whose agents resolve a base
# URL to this service. That is a deliberate second step, not an oversight:
# pointing agents at a proxy means their Anthropic OAuth token is forwarded
# through it (forwardClientHeaders: true). This proxy is ours, in our cluster —
# but "ANTHROPIC_BASE_URL pointing at a proxy" is exactly the shape that should
# always be checked rather than assumed benign, so it gets an explicit decision.
#
# replicaCount 2 (gd-qpfnvWuLlx, epic gd-StII9fmzym H2/H4). Was pinned to 1
# because litellm sat on the scarce on-demand pair and a surge/second replica
# there would have starved gardener scheduling. That headroom picture changed
# 2026-09-23: PR #136 (gd-cTobdw0kAL) moved litellm to a SOFT spot
# nodeAffinity below, so it no longer competes for on-demand capacity, and
# replicaCount>1 flips the Deployment strategy from Recreate to
# RollingUpdate maxSurge=1/maxUnavailable=0 (templates/litellm/deployment.yaml),
# which is the actual point: a single-replica Recreate rollout is a fleet-wide
# LiteLLM outage for every crew/gardener pod (ANTHROPIC_BASE_URL points here),
# measured at 7 rollouts / 75 min with one ~20 min gap on 2026-09-23.
#
# CAVEAT for whoever applies this: the second replica's spot preference lands
# it on the `gardenio-k3s-agents` ASG's spot capacity, same pool gardeners'
# required on-demand affinity draws from. PR #138 (autoscaler tags for that
# ASG, gd-q6e62AXt3y) is still OPEN as of this change — until it merges, that
# pool's size is a hand-set desired_capacity, not autoscaled. The nodeAffinity
# below is soft (preferred), so if spot is briefly full the second replica can
# still land on-demand rather than queue Pending; watch gardener scheduling
# after applying this until #138 lands.
#
# podAntiAffinity + pdb are now on to match: two replicas that can land on the
# same node buy nothing (a node death still takes both), and the PDB
# (maxUnavailable:1, chart default) protects the pair on drains. Both render
# as inert no-ops if replicaCount is ever reverted to 1, so this is safe to
# roll back.
litellm:
  enabled: true
  # 2 -> 1 on 2026-10-24 14:35Z (shape A headroom lever, gd-U6bZDnLwG6): the
  # on-demand pair was full by requests and an owner thread crew (required
  # on-demand, 500m/1Gi) sat Pending with no node group able to take it. litellm
  # carries no traffic, so the second replica bought nothing. Restore to 2 when
  # the pair grows (gd-U6bZDnLwG6) or once thread crews can fall back to spot
  # (gd-OyAk6iA5C6).
  replicaCount: 1
  # Was 500m / 2Gi each, then 50m / 1.5Gi (gd-TEP4ygX3dq, when it carried no
  # traffic). Every agent's model calls go through it now, and at 50m it lost
  # the CPU fight: on 2026-11-03 two thread agents on its platform node burst
  # to ~1.6 cores, litellm could not start inside its startup probe, crash-
  # looped 7 times, and every agent got ECONNREFUSED for ~35 minutes
  # (gd-cI0IZN41aW). 1 core was resized in live at 17:55Z and fixed it.
  # Memory stays above live use: resident proxy state, not a burst. Limit
  # 2 / 4Gi unchanged.
  resources:
    requests: {cpu: "1", memory: 1536Mi}
  podAntiAffinity: {enabled: true}
  pdb: {enabled: true}
  # gd-cTobdw0kAL: litellm was UNPINNED (arch:amd64 only) and landed on the
  # on-demand platform pair "by scheduler luck," holding 500m of its scarcest
  # CPU — the exact difference between a gardener scheduling and Pending. Move
  # it off explicitly with a soft (preferred, not required) spot preference:
  # litellm has no PVC, so a spot reclaim costs a pod restart, not data, but a
  # HARD anti-on-demand constraint could strand it Pending if spot is briefly
  # tight (the same reasoning as podAntiAffinity/topologySpreadConstraints
  # elsewhere in this file). The operator ruled on gd-elHmahKGB9 (2026-09-23):
  # take this $0 fix over the $110/mo on-demand instance upsize.
  #
  # FLIPPED to prefer on-demand on 2026-10-23 (gd-TEP4ygX3dq). Both reasons
  # above are gone: the CPU request is now 50m, and gardeners no longer need
  # on-demand room (gd-Fyz3w0tOnf). With the spot pool's floor at 0 the spot
  # preference now works against us: a litellm pod (1.5Gi) on a spot node
  # holds it near the autoscaler's 0.3 memory threshold, so the node cannot be
  # removed when its crew exits. Still preferred, not required, so litellm can
  # spill to spot if on-demand is full.
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: gardenio.io/lifecycle
              operator: In
              values: [on-demand]
  masterKeySecret: "litellm-master-key"
  # dbInit creates the `litellm` database inside the in-cluster postgres.
  database: litellm
  dbInit: {enabled: true}
  # The controller reads lifetime per-tag spend only from
  # LiteLLM_DailyTagSpend (tagSpendSource: daily), which the spend-log cleanup
  # leaves intact, so pruning LiteLLM_SpendLogs no longer moves
  # gardenio_tag_cost_usd or the session reconciler's baselines. Spend logs
  # are kept 7d, pruned daily at 03:17Z; the cron overrides the interval
  # (gd-7W2qGx8Waw, gd-FGD4OdAR8f). Retention is set only here: the chart
  # refuses maximum_spend_logs_retention_period in extraGeneralSettings as
  # well. Prompts are never stored in spend logs.
  tagSpendSource: daily
  spendLogsRetention:
    period: "7d"
    cron: "17 3 * * *"
  extraGeneralSettings:
    store_prompts_in_spend_logs: false

  # replicaCount above is INERT while an HPA exists — templates/litellm/
  # deployment.yaml deliberately omits `replicas` so the HPA owns it, and
  # templates/litellm/hpa.yaml defaults to minReplicas 2 / maxReplicas 6.
  # On three t3.large nodes with limits already overcommitted, letting an idle
  # proxy scale to six pods is how the OOM killer finds you. The chart's HA
  # floor of >=2 is written for a fleet, not for this.
  #
  # Turned OFF rather than tuned: with no account bead, litellm currently
  # carries zero traffic, so CPU-target autoscaling has nothing to measure.
  # Revisit when agents actually route through it.
  autoscaling:
    enabled: false
# The terminal multiplexer. Agents log "mux not available, will retry
# periodically  mux: http://127.0.0.1:9800" without it — they run fine, but
# there is no way to attach to a live agent's terminal, which is the whole
# point of having it.
#
# Refuses to start unless COOP_CREDENTIAL_KEY is set (W1 secrets hardening),
# so coop-credential-key must exist first:
#   kubectl -n gardenio create secret generic coop-credential-key \
#     --from-literal=key="$(openssl rand -hex 32)"
#
# persistence stays off: the credential store then lives on a 16Mi tmpfs, so
# credentials never touch node disk. The cost is that they are re-pushed by the
# controller after a restart rather than surviving it — the right trade on a
# spot cluster with node-local storage.
coopmux:
  enabled: true
  # Tenant lands' per-land coopmux bearers (gd-6vUzU7Fhpy, PR #1917).
  landTokens:
    enabled: true
  # Shape A (2026-10-24, gd-qS0Jg4q0Vk): prefer the on-demand pair. Unpinned,
  # this pod lands wherever a helm roll's surge finds room; at the 2026.297.1
  # roll nine service pods landed on the spot node a cron crew had just
  # spawned, held it above the autoscaler's 0.3 CPU threshold, and had to be
  # recycled by hand. Preferred, not required: it may still spill to spot when
  # the pair is full, but it no longer stays there once room frees up.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]
  # Was 100m; live <5m (gd-TEP4ygX3dq). Interactive (terminal attach), so it
  # keeps 0.1 of a crew's CPU weight. Limit 500m / 512Mi unchanged.
  resources:
    requests: {cpu: 50m, memory: 256Mi}
  # P7 Task 2: agent-facing coopmux token, NOT kd-beads-token. Created by the
  # operator (no ExternalSecret): kubectl create secret generic coopmux-agent-token
  # --from-literal=token=<random 32 bytes hex>. Agents get it as COOP_MUX_TOKEN /
  # COOP_BROKER_TOKEN; coopmux's own daemon bearer stays the beads token.
  coopmuxTokenSecret: "coopmux-agent-token"
  credentialKey:
    secretName: "coop-credential-key"
    secretKey: "key"
  # Account-bead write (status=exhausted on failover) as coopmux's own machine
  # principal (gd-Wcu0DOkHfN; the coopmux half of the controller's
  # agents.machinePrincipal above). clientId/secretName keep the chart defaults
  # (gardenio-coopmux / gardenio-machine-gardenio-coopmux); the Secret is
  # operator-created and the mount is optional, so coopmux starts without it
  # and only that one write fails closed. Rollback: set this false and roll —
  # back on the single static client (where the write is denied), no data lost.
  machinePrincipal:
    enabled: true
  # Out-of-chart callers of :9800. The chart default also admits app: ziti-host
  # (the ziti tunnel host); ziti is off (gd-xNMLrsgajy), so only the mux.clonk.tv
  # proxy remains. A list replaces the default rather than merging with it.
  networkPolicy:
    extraFrom:
      - app: viewer-authproxy
  # HA phase 1 (gd-kU2wuaNHMJ): same reasoning as the agents/beads blocks —
  # co-located with the controller on the one spot node that took the whole
  # control plane down together. persistence stays off (see the comment
  # above), so this is capacity bin-packing, not storage pinning: losing the
  # node loses live terminal sessions and pushed credentials either way, but
  # the pod itself reschedules.
  #
  # nodeSelector PINNING DEFERRED to gd-JIhzxaq3pJ (after gd-tuiGnrzxMR lands)
  # — see the keycloak.runtime comment above for the coordinator's capacity
  # math on why this and agents/beads/keycloak.runtime don't move yet.

# The beads-viewer's per-agent terminal link. coopmuxTerminalURL
# (cmd/beads-viewer/agents.go:1910) returns "" when COOPMUX_PUBLIC_URL is
# unset, so with no value here the Agents page simply has NO terminal link —
# which is exactly how it presented. The chart derives the env via
# gardenio.link.coopmuxPublicURL, whose FIRST branch is this explicit
# override; the later branches need unifiedHost or coopmux.ingress.host,
# neither of which exists on a ziti-only deployment.
#
# The helper reads this value whether or not slackBridge is enabled.
#
# WHY ITS OWN HOSTNAME. coopmux is reached at mux.clonk.tv, not as a path
# under gardenio.clonk.tv, because the viewer ALSO serves /api/v1/ routes
# (/api/v1/query_range — the vmsingle proxy behind every chart and the cost
# explorer — plus /api/v1/charts* and /api/v1/inbox/*). One hostname means
# one of the two shadows the other, and the viewer-side failure mode is
# charts silently going blank. See helm/gardenio-ziti/viewer-authproxy.yaml.
#
# A bare link cannot work without a proxy: coopmux requires a bearer token on
# EVERY route including the dashboard HTML (GET /mux unauthenticated is 401).
# viewer-authproxy injects it from the COOP_MUX_AUTH_TOKEN secret, so the
# browser never holds the token, and /api/v1/credentials/* is refused at the
# edge so the injected admin token cannot be used to manage credentials.
#
# SLACK (2026-09-22). Workspace gardenioworkspace.slack.com (T0C3MBQND1U), app
# "gardenio" A0C3JFVFEMB created from gardenio/slack/manifest.json minus its
# user scopes (the bridge never uses an xoxp token) and the placeholder unfurl
# domain. Socket Mode only: the bridge dials OUT to Slack, so there is no
# inbound endpoint and no IngressRoute — it fits the ziti-only model as-is.
#
# The Secret is created by hand (externalSecrets is off here):
#   kubectl -n gardenio create secret generic slack-bridge \
#     --from-literal=bot-token=xoxb-… --from-literal=app-token=xapp-…
# signing-secret is deliberately absent: the chart mounts it optional:true
# and only webhook mode (no app token) requires it.
#
# #gardenio could not be used as the channel: Slack reports name_taken
# because the bot user is itself called "gardenio".
#
# Two more hand-made Secrets the bridge needs:
#   bridge-tokens: keys slack-bridge=<T> and fleet-map=<T>:slack-bridge. The
#     bridge authenticates to beads with <T>, and beads loads fleet-map at
#     STARTUP (optional:true), so restart gardenio-beads after changing it.
#   slack-bridge-agent-token: key token. Without it the bridge logs "/api/* is
#     OPEN" and any pod in the cluster (crew pods included) can drive it.
#     The controller injects the same token into agent pods.
slackBridge:
  enabled: true
  # Background writes (config seed, dm delivery) as machine:gardenio-slack-bridge
  # (gd-Hc34EENbO9 component 4). clientId / secretName keep the chart defaults;
  # the Secret is operator-created and the mount is optional. No relay: a
  # person's Slack writes ride their own token (accountLink). Rollback:
  # enabled: false and roll, back on the bridge's fleet token for these writes.
  # FIRST ROLL ships enabled: false: the KeycloakClient and the two
  # gardenio-machine-slack-* realm roles (rendered regardless of this flag)
  # reconcile and kbeads loads the new grants first. The operator flips this to
  # true in a second, values-only roll once those are OK.
  # 2026-10-15: flipped after 2026.288.5 (rev 151) reconciled the client and
  # both roles and a fresh client_credentials token carried them.
  machinePrincipal:
    enabled: true
  coopmuxPublicURL: "https://mux.clonk.tv/mux"
  # BEADS_VIEWER_URL. Without this, gardenio.link.beadsViewerURL falls through
  # all three tiers to empty: unifiedHost is off, beadsViewer.avaIngress and
  # beadsViewer.ingress are both disabled (ziti-only, see the beadsViewer block
  # below), so the chart never derives a viewer host on its own. The result
  # was every Slack bead mention/decision/escalation rendering as plain text
  # instead of a link — this is that "give it an explicit host" override,
  # same pattern as coopmuxPublicURL above. gardenio.clonk.tv is already the
  # beads-viewer's public ziti hostname: viewer-authproxy's TLS front door
  # (helm/gardenio-ziti/viewer-authproxy.yaml) proxies the root path straight
  # to gardenio-beads-viewer, so no path suffix is needed (unlike coopmux,
  # which lives under /mux on its own hostname).
  beadsViewerURL: "https://gardenio.clonk.tv"
  agentTokenSecret: "slack-bridge-agent-token"
  slack:
    secretName: "slack-bridge"
    channel: "C0C3RH33A81"   # #gardenio-agents
    # Enable bead preview cards (SLACK_LINK_UNFURL_CHANNELS, see link_unfurl.go)
    # in #gardenio-agents: a pasted gardenio.clonk.tv/<id> link draws a rich
    # Block Kit card (type, status, assignee, snippet) instead of plain text.
    # Requested by Matt Baker 2026-10-10; chart default is "" (off everywhere,
    # per his 2026-07-16 "too noisy always-on" call — this flips it on for just
    # this one channel, the "enable per channel once the card is refined" path).
    linkUnfurlChannels: "C0C3RH33A81"
    # Bead-link hydration (SLACK_LINK_HYDRATE_ENABLED, slack_link_hydrate.go):
    # bare bead ids in outgoing Slack text become `<glyph> <link|short name>`
    # and messages naming 3+ beads get a References footer. Chart default is
    # off; PR #229 shipped it dark, and this was held until the merge-desk
    # follow-ups (bounded cache, Block Kit limits) landed. Any daemon error
    # falls back to the old id-labelled links. gd-jciXhNJYAu.
    linkHydrate: true
  # The chart default is now empty; this pin predates that, when the default was
  # a placeholder channel id that does not exist in this workspace.
  scifGateAlert:
    channel: ""
  # Two projects exist (gardenio, gascity), so DM spawns need a tie-break. The
  # setting is global, not per user; the user is the only human in the workspace.
  defaultDMProject: "gardenio"
  # Slack account linking (gd-OZJ6H2S3xx): human Slack writes carry the linked
  # person's own Keycloak token; unlinked users get the link button. The
  # public route is helm/gardenio-ziti/public-edge.yaml `location ^~
  # /slack/link/` (no auth_request; on viewer-authproxy's ziti 8443 until
  # gd-xNMLrsgajy). OPERATOR before enabling: create Secrets
  # gardenio-slack-link (key clientSecret, the Keycloak client secret) and
  # gardenio-slack-link-key (key key, `openssl rand -base64 32`), roll the
  # keycloak client above, roll viewer-authproxy, then roll the bridge.
  accountLink:
    enabled: true
    publicURL: "https://gardenio.clonk.tv"
    issuerURL: "https://auth.clonk.tv/auth/realms/gardenio"
    clientId: gardenio-slack-link
    clientSecretName: gardenio-slack-link
    keySecretName: gardenio-slack-link-key
  # Commons card actions (gd-na5unRTCaP, #729/#734/#747): the viewer forwards
  # the signed-in person's forwardAuth bearer to the bridge's POST
  # /api/conversation/inbound; SLACK_BRIDGE_OIDC_COMMONS_ONLY keeps every other
  # /api/* route closed. Issuer + audience derive to the realm issuer and
  # keycloak.oidcAudience (gardenio-traefik-forwardauth), as kbeads. Needs a
  # release containing 77da56b1 (2026.294.2+). Rollback: enabled: false, roll.
  commonsActions:
    enabled: true
  # Tenant support (Lands 11.1, gd-UBeJ3kVicQ, #846; escalation gd-fSLU7vQJlR):
  # a tenant land's #support post files a `support` bead there and DMs this
  # operator (resolved to a Slack identity by the bridge). Empty pointerChannel
  # = SLACK_CHANNEL, and it gets only a bead id, never tenant text. Needs a
  # release containing 991a608f. Verify: slack-bridge logs "lands support
  # watcher registered operator_set=true". Rollback: operator: "" and roll.
  landsSupport:
    operator: "matthewbaker1110@gmail.com"
    pointerChannel: ""
  # The state PVC (slack-bridge-state.json) is local-path, so the pod is pinned
  # to the on-demand platform nodes like vmsingle and postgres. Unpinned, it
  # landed on a spot node; on 2026-10-12 the autoscaler terminated that node,
  # the PV went with it, and the bridge sat Pending for ~4.5h until the PVC was
  # recreated by hand. BOTH labels: lifecycle=on-demand alone also matches the
  # k3s server. The gardenio.agent toleration comes from global.tolerations.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform

# --- observability: ONLY the two pieces the cost explorer needs ---
#
# WHY THESE TWO ARE ON. /costs/rollup (the "Cost explorer") queries vmsingle
# directly — cmd/beads-viewer/costs_rollup.go builds a PromQL instant query
# against s.metricsUpstream, which defaults to the in-cluster gardenio-vmsingle
# Service (metrics_proxy.go, overridable via VMSINGLE_QUERY_URL). With no
# vmsingle deployed the page renders "Metrics temporarily unavailable — try
# refresh." forever, which is exactly how this cluster presented.
#
# The rest of the pipeline was already intact and needed no changes: the
# controller's tag_spend_sync.go polls LiteLLM GET /spend/tags and publishes
# gardenio_tag_cost_usd{dim,value} on :9092, and the controller pod already
# carries prometheus.io/scrape=true + prometheus.io/port=9092. vmagent
# discovers exactly that annotation in its own namespace and remote-writes to
# vmsingle (remoteWriteURL empty => auto-wired in-chart). So enabling these two
# closes the last gap between "LiteLLM knows the spend" and "the page shows it".
#
# vtsingle stays off deliberately: it is traces, which the cost explorer does
# not read. vmalert and alertmanager are on (see their blocks below). vlsingle
# (logs) is on since 2026-10-16 for the k3s audit log; see its block below.
# Grafana is the exception — see its block below.
vmsingle:
  enabled: true
  # Was 300m; live 8m (gd-TEP4ygX3dq). Limit 500m / 1Gi unchanged.
  resources:
    requests: {cpu: 50m, memory: 512Mi}
  # 30d, not the chart's 90d: the explorer's widest range selector is "last
  # 30d", so anything older is storage we can never query through this UI.
  retentionPeriod: "30d"
  persistence:
    enabled: true
    size: 5Gi
  # local-path is node-local, so vmsingle is pinned to the on-demand platform
  # node for the same reason postgres is — a spot reclaim would otherwise take
  # the volume. BOTH labels are required; lifecycle=on-demand alone also matches
  # the t3.small k3s server. See the postgres block above for the full rationale
  # and the durability gap that pinning does NOT solve.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  tolerations:
    - key: "gardenio.agent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  # ACCEPTED DATA-LOSS TRADEOFF: this PVC is plain local-path (not
  # -retain), so losing the node loses the metrics history. That is survivable
  # precisely because vmsingle is NOT the system of record for spend — LiteLLM's
  # Postgres-backed LiteLLM_SpendLogs is, and the controller re-derives the
  # gauge from /spend/tags on every poll. Losing this volume costs dashboard
  # history, not billing truth.

vmagent:
  enabled: true
  # Shape A (2026-10-24, gd-qS0Jg4q0Vk): prefer the on-demand pair. Unpinned,
  # this pod lands wherever a helm roll's surge finds room; at the 2026.297.1
  # roll nine service pods landed on the spot node a cron crew had just
  # spawned, held it above the autoscaler's 0.3 CPU threshold, and had to be
  # recycled by hand. Preferred, not required: it may still spill to spot when
  # the pair is full, but it no longer stays there once room frees up.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]
  # Lands 10.8 (gd-rqtbyqCMZJ): scrape the off-cluster uptime prober's public
  # metrics file (terraform output uptime_metrics_url, applied 2026-10-21).
  uptimeProbeScrape:
    enabled: true
    url: "https://gardenio-status-360190250083.s3.us-east-1.amazonaws.com/metrics"
    scrapeInterval: 60s
  # Empty => auto-wires remote-write to the in-chart vmsingle above.
  remoteWriteURL: ""
  tolerations:
    - key: "gardenio.agent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

# vlsingle: logs. On for the k3s API audit log (task gd-ZrPUxj8wyU, decision
# gd-bNVBdrmIo5 "ship30", escalation gd-C3dGiANocD): 30d retention, ~435 MB/day
# raw is ~1.3 GB compressed per 30d, inside the 10Gi PVC. Pinned like vmsingle
# (local-path is node-local). Turning it on also fixes `gb logs` for crews
# (gd-q0Sy8rdaLc): the controller wires GARDENIO_LOGS_URL to it. The shipper
# DaemonSet itself is NOT chart-rendered; it is applied by hand from
# gardenio/helm/k3s-audit-shipper/ (see its README).
vlsingle:
  enabled: true
  # Was 100m; live <5m (gd-TEP4ygX3dq). Limit 500m / 512Mi unchanged.
  resources:
    requests: {cpu: 25m, memory: 256Mi}
  retentionPeriod: "30d"
  persistence:
    enabled: true
    size: 10Gi
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  tolerations:
    - key: "gardenio.agent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
vtsingle:     {enabled: false}   # traces — not read by the cost explorer
# vmalert evaluates the Lands SLIs (10.8, gd-vZxsDofKLG) and the gap alerts.
# Until 2026-10-25 it ran with notifierBlackhole, so no alert reached anyone;
# the 2026-10-20 postgres backup gap went 16 h unseen. Decision gd-gMjUuvb3DT
# (option slack, gd-YmPhRPJIfp) turned the in-chart Alertmanager on, and
# alertmanager.enabled auto-wires vmalert's -notifier.url to it
# (gardenio.vmalert.effectiveNotifierURL), so notifierBlackhole is gone.
vmalert:
  enabled: true
  # Shape A (2026-10-24, gd-qS0Jg4q0Vk): prefer the on-demand pair. Unpinned,
  # this pod lands wherever a helm roll's surge finds room; at the 2026.297.1
  # roll nine service pods landed on the spot node a cron crew had just
  # spawned, held it above the autoscaler's 0.3 CPU threshold, and had to be
  # recycled by hand. Preferred, not required: it may still spill to spot when
  # the pair is full, but it no longer stays there once room frees up.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]

# One small Alertmanager, no HA pair (decision gd-gMjUuvb3DT): vmalert POSTs
# here and it posts to a Slack INCOMING WEBHOOK directly. The path never
# touches the slack-bridge pod, so a dead bridge still pages (gd-rGmdUS0cxw
# rides this). One replica is the chart's only supported shape: no gossip mesh
# is wired, so two replicas would double every message.
#
# The webhook Secret is seeded BY HAND (no ESO on k3s; externalSecrets is off
# above), the chart's documented break-glass path:
#   kubectl -n gardenio create secret generic alertmanager-slack-webhook \
#     --from-literal=url='https://hooks.slack.com/services/...'
# Then `kubectl -n gardenio rollout restart deploy/gardenio-alertmanager` if
# the pod started first. The volume is optional, so a missing Secret does not
# crashloop the pod: Alertmanager stays Ready and logs each failed send. The
# webhook is channel-locked, so `channel` below is cosmetic.
#
# The Watchdog (severity=watchdog, always firing) posts once a day. It is the
# first message after a roll, and its arrival is the delivery test.
alertmanager:
  enabled: true
  # Default storage is an emptyDir: silences and the notification log reset on
  # a reschedule. Acceptable at this size; a restart at worst re-sends a firing
  # alert once.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Same on-demand preference as vmalert above (Shape A, gd-qS0Jg4q0Vk), so
  # the pod does not hold a spot node up.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]

# Grafana IS on as of the grafana-enablement plan
# (docs/superpowers/plans/2026-09-21-grafana-enablement.md). vmalert and
# alertmanager are on since 2026-10-25 (gd-gMjUuvb3DT, blocks above).
# vtsingle (traces) remains off. vlsingle is on since 2026-10-16,
# which also fixed gd-q0Sy8rdaLc (gb logs failing for crews).
grafana:
  enabled: true
  # Was 100m + 50m sidecar (below); live 5m for the pod (gd-TEP4ygX3dq).
  # Limits unchanged.
  resources:
    requests: {cpu: 25m, memory: 256Mi}

  # MANDATORY, not cosmetic. readOnlyRootFilesystem is true and the
  # /var/lib/grafana volume renders only when persistence (or a plugin path) is
  # set, so without this Grafana cannot create grafana.db. Accepted tradeoff:
  # local-path is node-local, so losing the node loses Grafana's own state
  # (users, prefs, ad-hoc boards). That is survivable because the 26 dashboards
  # are provisioned from the grafana-bridge, not authored here, and the metrics
  # live in vmsingle.
  persistence:
    enabled: true
    size: 1Gi

  # Pinned to the on-demand platform pair for the same reason vmsingle and
  # postgres are: a spot reclaim would take the volume. BOTH labels required —
  # lifecycle=on-demand alone also matches the t3.small k3s server.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  tolerations:
    - key: "gardenio.agent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  # Operator pre-creates this Secret with key exactly 'admin-password'
  # (templates/grafana/deployment.yaml:359). Without it Grafana falls back to
  # built-in admin/admin. This account stays as BREAK-GLASS only once OIDC
  # lands in phase 3.
  adminPasswordSecret: "gardenio-grafana-admin"

  # Dashboards are NOT shipped by the chart — it renders no dashboard
  # ConfigMaps because ~200KB per revision overflowed the 1 MiB release-Secret
  # limit (values.yaml:11732-11734). The 26 JSONs under
  # gardenio/helm/gardenio/dashboards/ are baked into the grafana-bridge image
  # and reach Grafana as runtime ConfigMaps that this sidecar watches. Turning
  # it on also renders the grafana ServiceAccount/Role/RoleBinding (gated on
  # sidecar.enabled) and the dashboards.yaml provisioning entry.
  sidecar:
    enabled: true
    resources:
      requests: {cpu: 10m, memory: 64Mi}

  # No Traefik route, ever: Traefik's 443 is the GitHub-hooks route. Grafana
  # is published by the public-edge nginx (gardenio/helm/gardenio-ziti/
  # public-edge.yaml), which checks the Keycloak sign-in (/gardenio-admins)
  # before proxying to the gardenio-grafana Service (plan ziti-to-keycloak S3,
  # gd-iS4Uxv9tfN). The ziti name gardenio.grafana.ziti:3000 went with ziti
  # (gd-xNMLrsgajy).
  ingress:
    enabled: false

  # The public name the browser uses (grafana.clonk.tv behind the edge), so
  # it is the base of every link Grafana generates.
  rootURL: https://grafana.clonk.tv
  auth:
    # Header auth-proxy trusting the edge (gd-RUhOpXWwmz), replacing Grafana's
    # own Keycloak login (Phase 3, gd-LMHmuLp48L). The edge has already checked
    # the Keycloak sign-in (/gardenio-admins) and stamps X-Auth-Request-Email
    # on every grafana.clonk.tv request, overwriting any client copy
    # (gardenio-ziti/public-edge.yaml). The OIDC login broke the /costs
    # iframes: four frames each started their own OAuth dance and clobbered
    # one another's state cookie, so every panel showed Grafana's login page
    # (owner, 2026-10-19 08:00Z). With the header there is no dance and no
    # Grafana session to race over.
    #
    # Break-glass: a request without the header (in-cluster port-forward)
    # still gets the local admin form, so it stays visible.
    disableLoginForm: false
    # Admin is acceptable ONLY because the edge admits /gardenio-admins and
    # nobody else to grafana.clonk.tv, so every header-authenticated user is
    # an admin. If the edge ever admits another group, this setting silently
    # makes its members Grafana Admins: change this first. A Role header
    # would need the edge to stamp (and blank) a new header; the default role
    # does the same job with no edge change. Applies to users Grafana creates
    # from the header; the users the OIDC login already created keep their
    # mapped role (gardenio-admin -> Admin).
    defaultOrgRole: Admin
    proxy:
      enabled: true
      headerName: X-Auth-Request-Email
      # The header carries the Keycloak email, and the users the OIDC login
      # created are matched by email.
      headerProperty: email
      autoSignUp: true
      # No extra mappings. The chart default maps Groups to
      # X-Auth-Request-Groups, which the edge neither stamps nor blanks, so a
      # client could set it; Grafana OSS does nothing with Groups anyway.
      headers: ""
      # Defence in depth only. The boundary is the edge-grafana NetworkPolicy
      # (edgeBackends below): only the public-edge namespace and
      # the platform pods in edgeBackends.grafanaCallers reach port 3000, and
      # none of them is agent-controlled. Grafana checks the TCP peer, not
      # X-Forwarded-For. The edge nginx is a pod (hostPort, not hostNetwork),
      # so it connects from the k3s pod CIDR 10.42.0.0/16 (k3s default;
      # node.sh.tftpl sets no --cluster-cidr), and the VPC 10.90.0.0/16 covers
      # a hop SNATed to a node address. Any pod inside these ranges that
      # could reach 3000 could claim a user, which is why agents are not
      # allowed there (agentPath below).
      whitelist: "10.42.0.0/16,10.90.0.0/16"
      # Agents reach Grafana on 3001 through a sidecar that blanks every
      # identity header (gd-RUhOpXWwmz, operator review gd-BcNoQUPKcM). They
      # get GRAFANA_URL on that port and no GRAFANA_AUTH_PROXY_HEADER, and
      # land as Grafana's anonymous Viewer, enough for `gb grafana render`.
      # Anonymous is server-wide, so a header-less request on 3000 is an
      # anonymous Viewer too; only the pods admitted there can send one, and
      # the edge always stamps the header. Needs the chart from PR #622.
      agentPath:
        enabled: true
        anonymousRole: Viewer
    # OFF: the chart refuses oidc and proxy together. The block stays filled
    # in so a rollback is one flip back to enabled: true. The 'grafana'
    # KeycloakClient stays declared under keycloak.clients (harmless unused).
    oidc:
      enabled: false
      # Realm 'gardenio' client 'grafana', confidential, standard flow only,
      # PKCE S256. It carries its own realm-roles mapper with userinfo ON,
      # because the realm's shared 'roles' scope does not add realm_access to
      # userinfo and roleAttributePath reads userinfo. Created by hand
      # 2026-10-12, now declared in keycloak.clients above (gd-DAy1iWvO4y);
      # the KeycloakClient syncs its secret from the Secret named below.
      clientId: grafana
      # Key 'client-secret'; durable copy in Secrets Manager
      # gardenio/gardenio-grafana-oidc.
      clientSecretSecret: gardenio-grafana-oidc
      # authURL is followed by the BROWSER (public edge); token and userinfo
      # are Grafana's back-channel calls to the in-cluster Service.
      authURL: https://auth.clonk.tv/auth/realms/gardenio/protocol/openid-connect/auth
      tokenURL: http://gardenio-keycloak-runtime:8080/auth/realms/gardenio/protocol/openid-connect/token
      apiURL: http://gardenio-keycloak-runtime:8080/auth/realms/gardenio/protocol/openid-connect/userinfo
      # Grafana 11 does not link a Keycloak login to a pre-created user by
      # email unless oauth_allow_insecure_email_lookup is set, which the chart
      # cannot render, so sign-up stays on. Role comes from roleAttributePath:
      # gardenio-admin -> Admin, everyone else -> Viewer.
      allowSignUp: true
      # autoLogin made /login go straight to Keycloak inside an iframe, which
      # worked for one frame and raced with four (see auth above).
      autoLogin: false

# The producer half of dashboard delivery (spec G8): on first start the bridge
# imports the 26 baked-in dashboard JSONs as `dashboard` beads (idempotent on
# uid) and writes each as a grafana_dashboard="1" ConfigMap for the sidecar
# above. Without backfill it starts, imports nothing, and Grafana shows zero
# dashboards.
#
# Deliberately NOT set (G7): externalSecret.enabled — there is no ESO here, it
# renders a CRD that does not exist and fails the install. grafana.url is also
# left empty, so the bridge runs write-only (beads -> ConfigMap); read-back
# would need a Grafana token Secret that does not exist.
#
# The image resolves per-component tag > global.imageTag > Chart.AppVersion. No
# tag is pinned here, matching every other component: roll out with
# `--set global.imageTag=<calver>` (release-deploy.sh always passes it). The
# grafana-bridge image is published for every calver tag (images.yml builds it
# on tag push; verified for 2026.284.9).
grafanaBridge:
  enabled: true
  # Shape A (2026-10-24, gd-qS0Jg4q0Vk): prefer the on-demand pair. Unpinned,
  # this pod lands wherever a helm roll's surge finds room; at the 2026.297.1
  # roll nine service pods landed on the spot node a cron crew had just
  # spawned, held it above the autoscaler's 0.3 CPU threshold, and had to be
  # recycled by hand. Preferred, not required: it may still spill to spot when
  # the pair is full, but it no longer stays there once room frees up.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]
  backfill:
    enabled: true
  # All writes as machine:gardenio-grafana-bridge (gd-Hc34EENbO9). clientId /
  # secretName keep the chart defaults; the Secret is operator-created and the
  # mount is optional. Rollback: enabled: false and roll — back on the shared
  # static token, no data lost.
  machinePrincipal:
    enabled: true
# github-bridge: the gardenio-io App's webhook receiver (wake-on-CI gd-AUdgkFSB1f,
# ready gate gd-9bZLp41p5K; runbook docs/runbooks/github-bridge.md "Enabling it
# on k3s"). Needs the hand-seeded Secrets gardenio-github-webhook-secret and
# gardenio-github-app-private-key (no ESO here). Rollback: enabled: false and
# roll; repoint the App webhook at trigger-engine. CI waits fall back to the
# 25-minute timer.
githubBridge:
  enabled: true
  # Convert a crew PR opened as ready (head agent/*, base main) back to a draft
  # until `gb pr ready`. Acts only once the App sends pull_request events and
  # holds pull_requests: write. Rollback: false and roll.
  draftAgentPRs: true
  # Every daemon call and the SSE stream as machine:gardenio-github-bridge
  # (release writes gd-305kriuXdT, the rest gd-tCMXlS9fXW); the chart then
  # renders no BEADS_DAEMON_TOKEN. clientId / secretName keep the chart
  # defaults; the Secret is operator-created and the mount is optional.
  machinePrincipal:
    enabled: true
  # The gardenio-io agents App (5029022), installed on mattbakerconsulting.
  # Mints the tokens for the CI-wait poll fallback and the draft conversion.
  githubApp:
    # installationId per `gh api /orgs/mattbakerconsulting/installations`
    # (gardenio-io = 171079859); 170295668 mints 404 (conflict scan, 308.2).
    appId: "5029022"
    installationId: "171079859"
  # PR conflict scanner (gd-xrDytQgUfR, docs/pr-conflicts.md). Measured on a
  # cold blobless mirror of this repo, 2195 PR refs and 17 open PRs: fetch peaks
  # at 37 MiB RSS, a full merge-tree scan at 48 MiB, and the mirror holds
  # 111 MB on disk. Request = the old 64Mi plus that git peak; the limit leaves
  # room for the mirror's page cache. Rollback: repo "" and roll.
  conflictScanner:
    repo: mattbakerconsulting/gardenio
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  # Same host, wildcard certificate and node security group as
  # triggerEngine.ingress. The routes do not overlap: trigger-engine owns
  # PathPrefix(/webhooks/), this is Path(/webhook) only. ipWhitelist stays off
  # for the same reason (ServiceLB SNAT).
  ingress:
    enabled: true
    host: hooks.clonk.tv
    entryPoints: [websecure]
monitoring:
  # Stays false: this gates VMServiceScrape/VMRule CRDs owned by the
  # VictoriaMetrics OPERATOR, which is not installed on this cluster (helm would
  # fail "no matches for kind"). vmagent does not need it — it discovers targets
  # from its own prometheus.io/scrape scrape_configs, not from CRDs.
  victoriaMetrics: {enabled: false}
  # The namespaced kube-state-metrics, for the postgres S3 backup alerts
  # (vmalert PostgresS3BackupStale/Unmonitored, gd-Li0fBnupv2). It watches only
  # cronjobs and emits one family, about one series per CronJob, so it adds no
  # per-pod series to vmsingle's 1y retention. The chart adds cronjobs to
  # resourceScope itself because postgres.s3Backup is on.
  podStateMetrics:
    enabled: true
    # Platform placement, like grafana: the on-demand pair, not spot.
    nodeSelector: {gardenio.io/lifecycle: on-demand, gardenio.io/role: platform}
    resourceScope: []
    metricAllowlist: [kube_cronjob_status_last_successful_time]

# --- the workloads we actually want ---
agents:                                    # == the gardenio controller
  # Decision gd-lUsRL07kKO (escalation gd-7b4NQnKsAd): render the granted
  # read-only Roles (rolebindings, ingresses, networkpolicies here; keycloakclients
  # in operators). The SA, ClusterRole and binding were hand-applied 2026-09-21 with
  # Helm adoption annotations and match the chart render exactly (checked 10-31).
  infraReader:
    enabled: true
    # ARC runner-set reads for CI-stall checks (gd-6FEbhRnAkd).
    arcRunnersNamespace: arc-runners
  # Crews' read-only kubectl (P9.2, gd-6ujfeTZfNL): the infra-reader roles
  # on a gardenio-verifier SA; the crew role bead mounts it.
  verifier:
    enabled: true
  enabled: true
  # Was 100m; live <5m (gd-TEP4ygX3dq). Limit 500m / 1Gi unchanged.
  resources:
    requests: {cpu: 50m, memory: 256Mi}
  # Same zone as the beads daemon (cost plan 2026-10-21 B4, gd-vMCMziHy7p).
  # Preferred, never required. Replaces the chart's computed affinity, which
  # is only a hostname anti-affinity at replicaCount > 1 (this runs 1).
  # Targets postgres, where beads.affinity puts the daemon, not the daemon
  # itself: preferred podAffinity is scored both ways, so a client term
  # matching the daemon pulls the DAEMON toward the client's zone and, at
  # 4 clients x 80, outvoted its own postgres term (gd-0MMQxzYeRR).
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels: {app.kubernetes.io/component: postgres, app.kubernetes.io/instance: gardenio}
  # Lands 10.8 SLOs (gd-rqtbyqCMZJ): the SLI recording + burn-rate rules, via
  # the vmalert ConfigMap path (vmalert above). Targets are provisional (10.9).
  metrics:
    prometheusRule:
      landsSLO:
        enabled: true
        # No prometheus-operator CRDs on k3s: vmalert ConfigMap path only.
        prometheusRule: false
  # Lands mailer (gate 5, gd-j0YpZFfoK7): applicant and land mail over SES v2
  # as lands@lands.clonk.tv. The default AWS chain here is the MinIO keys, so
  # it signs with its own static keys from Secret gardenio-mailer-ses (IAM user
  # gardenio-lands-mailer, ses:SendEmail as that one From address only; minted
  # out of band 2026-10-28, simulator send OK, other From denied). Needs a
  # controller with PR #1295 (62d3f8f5b). SES is in the sandbox: recipients must
  # be verified until production access is granted.
  mailer:
    enabled: true
    from: "Gardenio Lands <lands@lands.clonk.tv>"
    baseUrl: "https://gardenio.clonk.tv"
    sesRegion: us-east-1
    credentialsSecret:
      name: gardenio-mailer-ses
      accessKeyIdKey: access-key-id
      secretAccessKeyKey: secret-access-key
  # Lands purge sweep (8.11, gd-xw3t0xyCnJ, escalation gd-ULsgNonoSd): hourly
  # deletes a closed land's beads and coop sessions after retentionDays. The
  # retentions equal the published privacy policy
  # (gardenio/docs/lands/legal/privacy.md section 5); change both together.
  # Session deletes use the in-box MinIO keys the controller already holds
  # (objectStore below). Inert until a controller built with PR #738 runs.
  lands:
    # Spawn wall (8.3): tenant lands may spawn agents. ON from 2026-11-05 on the
    # owner's go: every condition of the 10.14 sign-off (gd-VQCGKL4ztd) has
    # merged, the P0 gd-bRLiEzvMsy, the P1s gd-kwJ0jPMdNY, gd-a2s0GZExxr,
    # gd-PtbbUxKWds, gd-WdnPW8TLPq and the P2s gd-Ymdaxee0sX, gd-gaGdksntAG,
    # gd-URd8GBIXvL (gardenio/docs/security/lands-threat-model.md "Sign-off
    # (10.14)"); this is 11.7's "tenantSpawns on for test lands" step
    # (gd-RCemZ1XjE8), first on lands-smoke. Tenant agents run in the
    # lands-tenant tier, inside the land namespace, stopped by the purse, the
    # per-land freeze and the lands-pause gate. Off again = false here + roll.
    tenantSpawns: true
    # Agents one tenant land may start per hour; 6 per gd-KOAoUELMWo (a).
    spawnsPerHour: "6"
    # The Lands home's "See a live plan" link (gd-DHuckb9YIK): window
    # gd-mcDimmjk9v on Lands part 2 (gd-HaSDZM9EML), read-only, expires
    # 2026-11-28. Clear this before then, or when the window is revoked.
    livePlanURL: /w/gw_j5gwCsBrwUvFuy0dVEK8Qg
    purge:
      enabled: true
      # First live sweeps log only; flip to false in its own roll after
      # reading the dry-run log (laptop-claude, 10-20).
      dryRun: true
      retentionDays: 30
      recordsRetentionDays: 730
      applicationRetentionDays: 90
    # Lands provisioner (8.6, gardenio/docs/lands/provisioner.md), turned on
    # for the 8.10 Deed check-in (gd-EJzG5HbgXc). The chart render FAILS while
    # githubApp.appId is empty; that is deliberate, so this cannot roll
    # half-filled. githubApp.appId is the gardenio-lands App (gd-KZ2Jhkr5Mi),
    # registered 2026-10-25 by the owner; the same value is SSM
    # /gardenio/github-app/lands/app-id, and its key + client secret are the
    # Secret gardenio-lands-github-app (created from SSM the same day).
    # keycloak.url is left unset ON PURPOSE: the chart derives the in-cluster
    # https Service URL https://gardenio-keycloak-runtime.gardenio.svc.cluster.
    # local:8443/auth from keycloak.runtime.tls above and mounts its CA
    # (gd-XRsosVFAau). The http URL pinned here before (decision gd-F060vJkxoM,
    # PR #951) is refused now: keycloakadmin is https-only again.
    # accountTemplate is the TITLE (not the id) of the account bead whose
    # provider, base_url, credential and model each lands-<land> purse copies
    # (provision.go ensureAccount; never its key). lands-template must exist
    # before the roll, unlabeled and status=disabled (spec on gd-EJzG5HbgXc),
    # or the purse step fails with "account template not found".
    # Secrets (mounted read-only, optional): gardenio-lands-provisioner (key
    # clientSecret, made for gd-YjL6XkDlqU) and gardenio-lands-github-app (key
    # private-key). The namespace step also needs landNamespaces.enabled
    # (gd-bmZ0WWWcDf), and this window must run the land-scopes VAP checks in
    # gd-EXIoC2EQs3. Rollback: enabled: false and roll.
    provisioner:
      enabled: true
      accountTemplate: lands-template
      # keycloak.url / keycloak.realm: unset = the in-cluster https Service
      # URL and keycloak.realm.name (gardenio).
      githubApp:
        appId: "5467849"
    # Operator-owned GitHub orgs a Lands land may never pin or mint on
    # (gd-72m3STiqya, #783). This list REPLACES the chart's, so it repeats both
    # defaults. ClaimLayer lives in mattbakerconsulting (no org of its own);
    # gardenio-io is the operator org that hosts the agents GitHub App.
    operatorGithubOrgs:
      - mattbakerconsulting
      - joyousaversion
      - gardenio-io
  # P7 Task 2 (spec D1): every agent pod gets its own project-scoped beads
  # token named after the agent; the primary token leaves agent pods.
  perAgentTokens: true
  # Per-agent GitHub tokens from the gardenio-io agents App (5029022), live
  # since 2026.307.1 (gd-Rq4qekWWgb). Rolls 307.1 and 307.2 set this by hand;
  # carrying it here lets the release-deployer roll a tag without turning the
  # App off. Rollback: enabled: false and roll (agents fall back to the
  # shared git credentials).
  githubApp:
    enabled: true
    appId: "5029022"
  agentStorageClass: "local-path"

  # Every URL gb emits — bundle links, viewer links, escalation links — is
  # derived from this host. It defaults to the chart's placeholder host
  # (gardenio.example.com), so without it a gardener's decision bead or a
  # crew's bundle link is a 404 for whoever receives it. Bare host, no scheme
  # and no path: gb appends /beads and derives cli.<host> itself.
  defaultGardenioHost: "gardenio.clonk.tv"

  # Unset the haiku pin. The chart default is "anthropic/claude-haiku-4-5",
  # which is a LITELLM MODEL GROUP name — the values comment upstream says so
  # explicitly: it exists to pin the harness `haiku` alias to a group the
  # fleet's LiteLLM virtual key allows, because the real dated id
  # claude-haiku-4-5-20251001 was rejected by that key's ACL.
  #
  # Here agents are NOT routed through LiteLLM (no account bead is labelled, so
  # no ANTHROPIC_BASE_URL is injected and they call api.anthropic.com direct).
  # A provider-prefixed group name sent to the real API is not a valid model id,
  # so EVERY harness small-model path fails: WebFetch and WebSearch
  # summarisation, Agent-tool model:"haiku", --model=haiku, haiku-pinned crews
  # and formulas. Observed as a model-routing error naming
  # anthropic/claude-haiku-4-5 on the summarizer step, with the network fine.
  #
  # Empty means the controller omits ANTHROPIC_DEFAULT_HAIKU_MODEL entirely
  # (cmd/controller/podspec.go:1217) and the harness resolves `haiku` through
  # its own bundled catalog to the correct dated snapshot.
  #
  # RESTORE THE PIN if agents are ever routed through LiteLLM — at that point
  # the group name becomes correct and the dated id becomes wrong. The two are
  # mutually exclusive and this comment is the pairing.
  defaultHaikuModel: ""

  # The Secrets project, role and account beads may mount into agent pods
  # (gd-q8nBnOP65d). Taken from the live beads on 2026-10-20: project gardenio
  # mounts gardenio-git-credentials, role infra mounts infra-aws-readonly, and
  # the claude accounts use claude-oauth and gardenio-claude-oauth-<account>
  # (the codex account's Secret is mounted by its own path, not this one).
  # Project matt-clanker also mounts matt-clanker-youtube (the YouTube upload
  # OAuth client, gd-JxfEHn2INg; added 2026-10-27 after the #751 review).
  # Every other Secret in the namespace (gardenio-machine-*, the Keycloak admin
  # and forwardauth secrets, the App keys) is controller-only. A new project or
  # role Secret, or an account credential under another name, needs an entry
  # here or the pod comes up without it.
  secretAllowlist:
    - "*-git-credentials"
    - infra-aws-readonly
    - claude-oauth
    - gardenio-claude-oauth-*
    - matt-clanker-youtube
    # The land-door verifier's test owner (gd-Hq1PnUVOUC), crew role bead.
    - crew-land-verifier

  # Escalation routing Task 15 C5 (gd-yT5xAPB0uJ): the one machine client a
  # role bead's machine_client may mount, for the in-cluster coordinator:cluster
  # runner. It is mounted from Secret gardenio-machine-gardenio-cluster-coordinator
  # (key clientSecret), which the OPERATOR creates in-cluster; this Secret is not
  # in secretAllowlist above and needs no entry there. Until a role bead names it
  # (Step 5, gd-8gfzBvgFrO), no pod mounts it.
  machineClientMounts:
    - gardenio-cluster-coordinator

  # Without this the controller logs, at every boot: "controller API auth
  # DISABLED — CONTROLLER_API_TOKEN unset; /api/v1/pool/assign,
  # /api/v1/freeze/interrupt and /api/v1/microvm/resume are reachable
  # unauthenticated by any pod on the agents Service." Those are mutating
  # endpoints. networkPolicies are off in this overlay, so "any pod in the
  # cluster" is the real blast radius, including CI runner pods. The secret is
  # a self-generated 32-byte hex value — no external dependency, so there is no
  # reason to run without it.
  controllerApi:
    tokenSecret: "gardenio-controller-api"

  # claudeOAuthSecret is unset (chart default ""), so agent pods mount no
  # fleet-wide ~/.claude/.credentials.json. The old "claude-oauth" Secret was
  # built from the matthewbaker1110 subscription, which ended 2026-11-02
  # (probe 403, account bead gd-XOnJ3PSDsn closed). Agents authenticate via
  # their pool account's LiteLLM key instead.
  serviceAccount:      {annotations: {}}   # no eks.amazonaws.com/role-arn
  agentServiceAccount: {annotations: {}}
  # Session persistence, pointed at the in-box MinIO above rather than AWS S3.
  #
  # This was previously `{bucket: ""}` with the comment "Empty bucket keeps
  # templates/validate-irsa.yaml from hard-failing the render demanding an IRSA
  # role ARN" — true, but it silently disabled resume for the whole stack. The
  # endpoint override is the supported way to satisfy that guard without IRSA
  # (validate-irsa.yaml:23 skips the check entirely when an endpoint is set).
  #
  # region is cosmetic for MinIO but the SDK still signs with it, so keep it set.
  # endpoint assumes release name "gardenio" — override if installed otherwise.
  s3:
    bucket: "gardenio-sessions"
    prefix: "coop/sessions"
    region: "us-east-1"
    endpoint: "http://gardenio-minio:9000"

  # HA phase 1 (gd-kU2wuaNHMJ): the controller, the beads daemon and coopmux
  # were all co-located on the same SPOT node (ip-10-90-22-236) — one spot
  # reclaim there took down the API, the mux and the controller together.
  # Pin the control plane onto the on-demand platform pair instead. BOTH
  # labels are required — lifecycle=on-demand alone also matches the
  # on-demand k3s SERVER (etcd + traefik + the beads Dolt volume); see the
  # postgres block above for the full reasoning.
  #
  # This is a CPU/memory bin-packing choice, not a storage one (unlike
  # postgres/nats/vmsingle) — the controller has no PVC, so it reschedules
  # freely if a node is lost, capacity permitting. Phase-0 capacity check
  # (gd-1BTxjn7942) found the steady-state placement fits with headroom, but
  # a single on-demand node does NOT have room to absorb every pinned
  # workload if the other on-demand node is lost — see the PR description
  # for the Pending-pods failure mode and how to detect it.
  #
  # nodeSelector PINNING DEFERRED to gd-JIhzxaq3pJ (after gd-tuiGnrzxMR
  # lands) — see the keycloak.runtime comment above for the coordinator's
  # capacity math on why this and beads/coopmux/keycloak.runtime don't move
  # yet. The controller stays on whatever node it lands on (spot included)
  # until then.

  # HA Phase 3 drill 1 (gd-JCLx5RLG1I, epic gd-StII9fmzym): flips on the
  # dedicated gardenio-ha-drill-operator ServiceAccount + narrow node/pod
  # RBAC added by PR #140 (chart default stays disabled —
  # gardenio/helm/gardenio/values.yaml's agents.haDrillOperator.enabled is
  # false; this overlay is what actually turns it on for this cluster).
  # Node get/list/watch/patch (cordon/uncordon, no delete) + namespaced
  # pods get/list and pods/eviction create in this release's namespace only
  # — see templates/controller/ha-drill-rbac.yaml for the full grant.
  #
  # Enabling this alone does not hand the token to any pod: it only reaches
  # a pod whose ROLE bead sets needs_k8s_api=true and
  # service_account=gardenio-ha-drill-operator (gd-JCLx5RLG1I follow-up
  # step 2 wires that role bead).
  haDrillOperator:
    enabled: true

  # Admin infra identity (plan gd-xiV5hyhPrG P6): the gardenio-infra-admin
  # ServiceAccount + a ClusterRoleBinding to the built-in cluster-admin
  # ClusterRole (chart default stays disabled). See
  # gardenio/docs/infra-admin-role-design.md for what cluster-admin includes.
  #
  # Enabling this alone does not hand the token to any pod: it only reaches
  # a pod whose ROLE bead sets needs_k8s_api=true and
  # service_account=gardenio-infra-admin, and every spawn of that role is
  # approved by an OIDC human (never an auto rule; kbeads enforces it).
  # The release deployer cannot create a binding to cluster-admin (no
  # bind/escalate, by design), so the roll that creates it is an OPERATOR
  # roll. Rollback: set this false and roll (the binding is deleted).
  infraAdmin:
    enabled: true

  # The controller's own machine principal (gd-s7aPIf0Bgp — the /costs fix,
  # gd-5NvJpCOlMC; default client, gd-BDirD4F7Iq). clientId/secretName keep
  # the chart defaults (gardenio-controller / gardenio-machine-gardenio-controller);
  # the Secret is operator-created and the mount is optional, so the controller
  # starts without it and every daemon call fails closed. With this on the
  # controller pod carries no BEADS_DAEMON_TOKEN. Roll the new realm roles
  # (client gardenio-controller above) and confirm the KeycloakClient reports
  # OK BEFORE rolling a controller image that reads them. Rollback: set this
  # false and roll — back on the static token, no data lost.
  machinePrincipal:
    enabled: true

# kbeads (templates/beads/). Everything else is chart default.
beads:
  # Memory was 2Gi; live 31Mi (gd-TEP4ygX3dq). CPU stays 400m (live 284m).
  # Limit 500m / 2Gi unchanged, so a large query can still use the 2Gi.
  resources:
    requests: {cpu: 400m, memory: 256Mi}
  # Short-titles Task 10: refuse agent/bridge/service creates with no short_title (decision gd-zxxBPsh3Y8 = A).
  shortTitleGate: enforce
  # P7.4b: refuse escalations whose operation_type is not registered (gd-fkK6y5Vh9a).
  # Evidence: 0 of the 39 escalations filed since 2026.307.1 went live used an unregistered type.
  operationTypeGate: enforce
  # Escalation routing T13 (gd-WxmVN15PQe). The laptop session's machine
  # client acts in the coordinator:laptop lane (the policy bead maps the lane
  # to machine:gardenio-laptop-operator). gardenio-cluster-coordinator is the
  # coordinator:cluster lane (Task 15, gd-yT5xAPB0uJ); it holds no work until
  # Step 5's policy rule names the lane. escalationResultMachines is empty on
  # purpose: no live machine witnesses merges (the GitLab reaper is off, and
  # GitHub merges are closed by the merge desk, which approves first), plan
  # Contract Issue 4. Task 14 Step 6 (gd-VJ7Pti7c5q) turned the /result gate on
  # (owner decision gd-pE9jCsvIJO): a result is refused until the escalation is
  # approved and the caller is its execute_by lane (D6), except a requester's
  # own withdrawal (D6(c)).
  escalationCoordinatorClients: "gardenio-laptop-operator,gardenio-cluster-coordinator"
  escalationResultMachines: ""
  escalationResultRequiresApproval: true
  # Machine-principal registry (BEADS_MACHINE_CLIENTS): every keycloak.clients
  # entry above with serviceAccount.enabled. A client missing here takes the
  # HUMAN OIDC path for its tokens — list it no later than the moment it gets
  # the audience mapper (PR #290 security review, rollout order).
  machineClients:
    - gardenio-controller
    - gardenio-coopmux
    - gardenio-authz-canary
    - gardenio-beads-viewer
    - gardenio-grafana-bridge
    - gardenio-github-bridge
    - gardenio-trigger-engine
    - gardenio-slack-bridge
    - gardenio-release-deployer
    - gardenio-laptop-operator
    - gardenio-cluster-coordinator
  # Plan gd-xiV5hyhPrG P1: spawn-policy evaluator on. Inert until a
  # type:spawn_policy bead exists (P2 writes the first, for role infra).
  spawnPolicyEnabled: true
  # Spawn permission snapshot probe (gd-4F8id9YEyO, escalation gd-8wcLd2Kg3H):
  # the daemon gets its own ServiceAccount bound to the get/list-only
  # <beads>-rbac-reader ClusterRole on the four RBAC kinds (#1203). Lit only
  # after an ADMIN roll of a tag carrying #1231 (release-deployer holds the
  # same get/list grant); before that the deployer's roll fails escalation
  # prevention, as in helm revs 74-101.
  rbacProbe:
    enabled: true
  # Slack account linking (gd-OZJ6H2S3xx): tokens minted through
  # gardenio-slack-link are capped at operator (Slack never carries admin,
  # gd-8PT2Qr2gEo) and cannot approve escalations (only the page session
  # does, gd-4mEAhIE01U).
  clientRoleCeiling: "gardenio-slack-link=gardenio-operator"
  # Same zone as postgres (pinned to its local-PV node): every daemon read
  # crossed an AZ whenever a roll put the daemon in the other zone (cost plan
  # 2026-10-21 B4, gd-vMCMziHy7p). Preferred, never required. Needs the
  # topology.kubernetes.io/zone node label (PR #843); inert without it.
  #
  # Two preferred terms, because one lost (gd-0MMQxzYeRR, rev 217: daemon in
  # 1a, postgres-0 in 1b). Default kube-scheduler scoring is min-max
  # normalised per plugin and then weighted (NodeAffinity x2, InterPodAffinity
  # x2, LeastAllocated/BalancedAllocation/ImageLocality x1), so a term's
  # weight only matters against other terms of the SAME plugin:
  #  - podAffinity -> postgres: InterPodAffinity, worth 200 to postgres's zone,
  #    as long as no other pod pulls the daemon elsewhere (see the clients'
  #    terms on agents, beadsViewer and triggerEngine: they point at postgres,
  #    not at the daemon, for exactly this reason).
  #  - nodeAffinity -> us-east-1b: NodeAffinity, another 200 to the same zone.
  # 400 to postgres's zone beats the 300 the resource and image plugins can
  # give at most (the system-default topology spread adds a few points at one
  # replica), without a required term that would leave the daemon Pending if
  # 1b is full.
  #
  # us-east-1b IS postgres-0's zone: its local-path PV is pinned (PV
  # nodeAffinity) to ip-10-90-30-213, a us-east-1b node. If that PV is ever
  # re-created on a node in another zone (node loss + restore, see the
  # postgres comment above), change this value with it; the podAffinity term
  # follows postgres by itself, this one does not.
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: [us-east-1b]
        # Shape A (2026-10-24): and prefer the on-demand pair, see beadsViewer.
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels: {app.kubernetes.io/component: postgres, app.kubernetes.io/instance: gardenio}
  # The public runner listener (local-agents spec §4.3, gd-T4eL6P5OtC) is the
  # nginx public edge's runners.clonk.tv block (gardenio-ziti/public-edge.yaml):
  # Traefik is not internet-facing here, so the chart's route stays off and
  # only the URL the slack-bridge quotes in /runner invites is set.
  ingress:
    runnerRoute:
      publicURL: https://runners.clonk.tv

beadsViewer:
  enabled: true
  # Lands front door for the first tenant (gd-YlRzQJU9PF; owner goal 11-01:
  # fimbaz@gmail.com onboards in the browser). /lands/apply takes the plot
  # application (PR #1619); approvals are decisions addressed to the owner.
  landsApply:
    enabled: true
    approver: "oidc:matthewbaker1110@gmail.com"
  # The gardenio-lands App's setup leg (/lands/github/setup). Public ids from
  # SSM /gardenio/github-app/lands/*; the key and client secret are files
  # mounted from Secret gardenio-lands-github-app.
  landsGithubApp:
    enabled: true
    appId: "5467849"
    clientId: "Iv23lih8ESIKkuaKCJky"

  # Bird captions (plan gd-jMl4oF2cJO). Haiku fallback key (gd-TBAYacR31x):
  # scoped LiteLLM virtual key (claude-haiku-4-5 only, $3/day budget, rpm 30),
  # Secret created by the operator from SM gardenio/beads-viewer-litellm-key.
  # haiku.enabled turns FARM_CAPTION_HAIKU on (step 10, gd-FOzMlrXga6); the
  # chart's bounds (30/min, 4 at once, 3s, 5000/day) stay at their defaults.
  # Kill switches: haiku.enabled=false (deterministic captions only) or
  # captions.enabled=false (no captions at all, the wire before captions).
  #
  # 2026-10-31: Haiku OFF (owner). Every call failed with Anthropic 401
  # "x-api-key header is required": the LiteLLM routes forward the caller's
  # own Claude login and the viewer has none. 24 h before the switch: 12,236
  # captions from the agent's own Bash description, 461 from paths/hosts/
  # builtins, 1,115 blank, 0 from Haiku. The blank 8% is closed by asking
  # agents to describe every Bash call, not by a second model.
  captions:
    haiku:
      enabled: false
      secretName: gardenio-beads-viewer-litellm

  # CPU REQUEST RAISED 50m -> 400m. This is a user-facing service sharing
  # nodes with agent pods, and 50m was starving it.
  #
  # Observed 2026-09-20: the operator's PHONE could not load the viewer while
  # the laptop mostly could. Cause was not ziti, authz or the viewer itself —
  # ziti-host showed the phone dialling gardenio-frontdoor fine, and the
  # viewer was using only 47m. Its NODE was at 99% CPU because two crew agents
  # on it were burning 962m and 678m of 2000m. viewer-authproxy logged
  # "upstream timed out while reading upstream" and a run of 499s (client gave
  # up before the server answered) — which is exactly what a phone timing out
  # looks like from the server side.
  #
  # Under CFS a pod's CPU share is proportional to its REQUEST, so a 50m
  # request against neighbours requesting 500m each means the viewer loses
  # every time the node is busy. The limit already allowed 500m; it simply
  # never got scheduled that much. Raising the request both reserves real
  # capacity at schedule time and raises its cgroup weight under contention.
  #
  # This is a mitigation, not the fix. The real problem is that agent pods and
  # user-facing services share the same nodes (everything is role=platform) —
  # see gd-yZcr1vYhpw. Until they are separated, any interactive service here
  # needs a request big enough to survive a bursting neighbour.
  #
  # LOWERED 400m -> 200m on 2026-10-23 (gd-TEP4ygX3dq): two replicas at 400m
  # held 800m for a pod using ~20m, and helped keep a spot node above the
  # autoscaler's scale-down threshold. 200m keeps the weight that matters: on
  # a 2-CPU node with two crews at 500m both bursting, the viewer's CFS share
  # is 200/1200 of the node, ~330m on demand, against ~95m at the 50m that
  # starved it (and ~570m at 400m). Still 0.4 of a crew's weight.
  # Memory goes UP 512Mi -> 768Mi: live use was 631-640Mi, over the request,
  # which puts the viewer first in line for a node-pressure eviction.
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # AUTHENTICATION IS DISABLED ON THE VIEWER. Read this before changing any
  # value in this block.
  #
  # beads-viewer fails CLOSED: with neither OIDC nor an AVA trust signer it
  # refuses to start at all ("OIDC_ISSUER_URL and OIDC_CLIENT_ID are required
  # when AVA_TRUST_SIGNER is unset (no basic-auth fallback)"). It will not
  # silently serve unauthenticated. Our three options were Keycloak (needs the
  # EDP operator we deliberately do not run), AWS Verified Access (not
  # available off EKS), or this bypass.
  #
  # This is safe ONLY because the viewer has no route into it: ingress,
  # edgeService and avaIngress are all false below, so it is a ClusterIP
  # reachable over OpenZiti or `kubectl port-forward` and nothing else. The
  # chart's own comment on this flag says "POC/Ziti only — never publicly
  # routed". The pod also sets automountServiceAccountToken:false, which is
  # what keeps dev_auth.go from forcing LISTEN_ADDR to loopback.
  #
  # HARD RULE: never set devAuthBypass together with any of the three route
  # toggles below. Turning on an ingress here publishes an unauthenticated
  # view of every bead to whoever can reach it.
  devAuthBypass: true
  # Edge shared secret (gd-kRyMsWiDNZ, PR #309): promote X-Auth-Request-Email
  # only when viewer-authproxy's X-Authproxy-Secret matches, so a pod dialing
  # the viewer Service directly gets no identity. Secret and authproxy rolled
  # 2026-10-14 (Secrets Manager copy gardenio/viewer-authproxy-secret).
  devAuthProxySecret:
    secretName: viewer-authproxy-secret

  # Human writes as the human (gd-Hc34EENbO9, decision gd-ZsfxvXRiyv). The
  # edge sign-in at gardenio.clonk.tv (gardenio-ziti/public-edge.yaml, then
  # viewer-authproxy 8097) forwards the signed-in user's own Keycloak access
  # token on every request (X-Auth-Request-Access-Token + Authorization), so
  # every mutating daemon call goes out with THAT token and kbeads authorizes
  # and attributes it as oidc:<user>. A write with no bearer fails closed in
  # the viewer (never sent). The plain 8095 ziti listener, which forwarded no
  # bearer and so was read-only, went with ziti (gd-xNMLrsgajy).
  requireUserBearerForWrites: true
  # Reads as the human too (gd-akDjTS2eh7, Phase 3 Task 7): every viewer daemon
  # read goes out on the signed-in user's token, so kbeads' project scoping
  # applies. DRAFT / merge-desk:hold until Task 8 (route classification) has
  # merged and Task 12 rolls it: with this on, an unclassified route fails for
  # the admin too. Rollback: false and roll.
  requireUserBearerForReads: true
  # No static daemon credential: with humans on their own bearer and everything
  # else (reactors, SSE streams, system reads, health/charts proxies, gb prime)
  # on the machine principal below, the viewer holds no bridge token
  # (gd-glMVEH8phE), and the chart never injects BEADS_DAEMON_TOKEN into it
  # (gd-j9uB0cduHA): the shared-token rollback path is gone.
  # The viewer's background reactors (plan-label auto-bind, plan-step nudge)
  # as machine:gardenio-beads-viewer. clientId/secretName keep the chart
  # defaults; the Secret is operator-created and the mount is optional.
  # Do not set enabled: false: with no static token behind it the viewer's
  # system reads and SSE streams would go out with no credential. Rollback of
  # the token removal is reverting gd-j9uB0cduHA's chart change.
  machinePrincipal:
    enabled: true

  oidc:        {enabled: false}   # no Keycloak issuer to point at
  edgeService: {enabled: false}   # AWS NLB + ACM cert
  avaIngress:  {enabled: false}   # AWS Verified Access
  ingress:     {enabled: false}   # reached over ziti / port-forward

  # /claude-config resolves project-scoped claude-settings beads against this
  # value; without it the page silently hides every project-scoped bead.
  project: gardenio

  # Where the browser reaches Grafana (public name, same as grafana.rootURL).
  # Drives the "Open in Grafana" link and each /charts card's full-board
  # deep link. Without it /charts renders bare link cards for the 26
  # dashboards. https, so the link is no longer mixed content from the https
  # viewer. It is also the base of every /costs and /garden Grafana iframe:
  # grafana.clonk.tv inside gardenio.clonk.tv is cross-origin but same-site,
  # so the edge's Lax sign-in cookie rides the frame (docs/garden-grafana-panels.md,
  # pinned by tests/grafana_garden_embedding_test.go). Keep grafana.allowEmbedding on.
  grafanaBaseURL: https://grafana.clonk.tv

  # HA phase 2 (gd-bOJa10GcA6, epic gd-StII9fmzym): 2 replicas for the
  # stateless edge, floating across the whole gardenio-k3s-agents ASG (2
  # on-demand + spot, desired 4/max 5) rather than being pinned to the
  # 2-node on-demand platform pair — that ASG is exactly the pool this
  # epic's spot churn targets, so the chart's default topologySpreadConstraints
  # stays ScheduleAnyway (see values.yaml beadsViewer.topologySpreadConstraints):
  # DoNotSchedule risks a Pending second replica during the very spot reclaim
  # this is meant to survive. The chart already gates PDB/spread/
  # anti-affinity on replicaCount > 1 (gd-27vcHmrurh).
  #
  # nodeAffinity added below (gd-cTobdw0kAL): "floating" in practice meant
  # landing on the on-demand pair by scheduler luck and holding 400m of its
  # scarcest CPU there — a UI with no PVC has no reason to compete with
  # postgres/nats/vmsingle/gardeners for that capacity. Soft (preferred, not
  # required) for the same Pending-risk reason as the spread above; layers
  # onto the default podAntiAffinity rather than replacing it (see
  # templates/beads-viewer/deployment.yaml). Operator ruling gd-elHmahKGB9
  # (2026-09-23): take this $0 fix over the $110/mo on-demand instance upsize.
  #
  # Same zone as the beads daemon (cost plan 2026-10-21 B4, gd-vMCMziHy7p):
  # the viewers are the daemon's heaviest readers and every byte across an AZ
  # costs $0.02/GB. The term targets postgres's zone, where beads.affinity
  # puts the daemon; a term on the daemon itself pulled the daemon toward
  # the viewers instead (gd-0MMQxzYeRR, see beads.affinity). An explicit
  # affinity REPLACES the chart's computed one
  # (templates/beads-viewer/deployment.yaml), so the spot preference above
  # and the default replica spread are carried in here; the separate
  # nodeAffinity key is gone because the chart would ignore it.
  # FLIPPED spot -> on-demand on 2026-10-24 (shape A, gd-qS0Jg4q0Vk): with the
  # spot pool's floor at 0 a spot preference pulls both viewers (768Mi each)
  # onto whatever spot node a crew spawned and keeps it from being removed
  # when the crew exits; at the 2026.297.1 roll both landed there and were
  # recycled by hand. The on-demand pair has the room since #988. Still
  # preferred, not required (same Pending-risk reasoning as above).
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: gardenio.io/lifecycle
                operator: In
                values: [on-demand]
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels: {app.kubernetes.io/component: postgres, app.kubernetes.io/instance: gardenio}
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: {app.kubernetes.io/name: gardenio, app.kubernetes.io/instance: gardenio, app.kubernetes.io/component: beads-viewer}
  #
  # The homepage's cold-render cache (gd-JISOIbVJb7) is a per-process
  # in-memory map (sync.Mutex-guarded, no shared/external store — see
  # plans_project_cache.go, gardener_owner_cache.go, dashboard_hub.go et al.
  # in cmd/beads-viewer), so it does not depend on a single pod: each
  # replica warms its own cache independently from the beads daemon, and
  # killing either one leaves the survivor serving from whatever it has
  # already warmed. A freshly (re)started replica still pays its own cold
  # render on first hit — that's the pre-existing gd-JISOIbVJb7 latency
  # issue, not a failure, and is unaffected by this change either way.
  # 2 -> 1 on 2026-10-24 14:35Z (same incident as litellm.replicaCount): the
  # second viewer (200m/768Mi) was the difference between an owner thread crew
  # scheduling and sitting Pending on the full on-demand pair. One replica means
  # a short UI gap per roll; the chart gates PDB/spread/anti-affinity on
  # replicaCount > 1.
  replicaCount: 1

# The trigger-engine. Without this, trigger beads are inert: `gb gardener start`
# writes a perfectly good trigger bead, `gb gardener status` reports it healthy
# because it only reads the blob, and NOTHING EVER FIRES. Four gardeners were
# authored at 04:18 and had still never run at 16:00 — last_fired empty, zero
# trigger lines in the controller log, because the controller does not evaluate
# triggers at all. A separate deployment does
# (controller/cmd/trigger-engine), and it only exists when this is true.
#
# defaultOperator is pinned deliberately. The chart default is
# a placeholder address — and the daemon
# fails CLOSED on write attribution: it refuses any write whose operator is not
# a resolvable human (`oidc:<email>` or `slack:U…`), returning
# "operator could not be resolved". Leaving the default would make every
# engine-originated write fail in a way that looks like a trigger bug.
triggerEngine:
  enabled: true
  # gardenio's ONE public endpoint (decision gd-Bz9rkZg5Q0, escalation
  # gd-fyCexuAP9d): GitHub App workflow_run webhooks. The chart routes only
  # Host(hooks.clonk.tv) && PathPrefix(/webhooks/), TLS-only, rate-limited,
  # and every delivery must pass the trigger bead's HMAC check.
  # ipWhitelist is OFF on purpose: the GitHub-IP allowlist is enforced at the
  # node security group (web_ingress_cidrs, composition/gardenio main.tf).
  # ServiceLB SNATs to the ClusterIP (externalTrafficPolicy: Cluster), so
  # Traefik only sees 10.42.x addresses and an ipWhiteList could never match.
  ingress:
    enabled: true
    host: hooks.clonk.tv
    ipWhitelist: {enabled: false}
  defaultOperator: "oidc:matthewbaker1110@gmail.com"
  # All daemon writes as machine:gardenio-trigger-engine (gd-Hc34EENbO9,
  # decision gd-dI7PfsFlvr "lineage"). clientId / secretName keep the chart
  # defaults; the Secret is operator-created and the mount is optional.
  # Rollback: enabled: false and roll — back on the shared static token, no
  # data lost.
  machinePrincipal:
    enabled: true
  pollInterval: "30s"
  # HA phase 1 (gd-kU2wuaNHMJ): trigger-engine is single-instance by design
  # (see the epic's known multi-replica hazards) and was on the same spot
  # node as the rest of the control plane. Pin it alongside agents/beads/
  # coopmux for the same reason.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  # Same zone as the beads daemon (cost plan 2026-10-21 B4, gd-vMCMziHy7p).
  # Preferred, never required. Targets postgres's zone, where beads.affinity
  # puts the daemon, not the daemon itself (gd-0MMQxzYeRR, see agents.affinity).
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          podAffinityTerm:
            topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels: {app.kubernetes.io/component: postgres, app.kubernetes.io/instance: gardenio}

# --- everything EKS/AWS-shaped stays off ---
gvisor:         {enabled: false}   # Karpenter NodePool + EC2NodeClass CRDs
vpaRightSizing: {enabled: false}   # autoscaling.k8s.io VPA CRD
edgeAuth:
  enabled: false
  # Lands 6.3d (gd-4HWvqrxCdH, owner ruling gd-P2Ybp03DPh relay-only): seed only the
  # Glass relay key; edge-auth itself stays OFF. beads-viewer signs, coopmux verifies.
  hmacKey: {secretKeyRelay: hmac-key-relay}
unifiedHost:           {enabled: false}
# P7 Task 6: IMDS deny. Label the legitimate IMDS users first
# (ecr-token-refresh, postgres-s3-backup, dolt-backup) and confirm the label on
# a live pod before this ships (operator step). The ziti namespace (and
# ziti-controller, the fourth user) is gone with ziti (gd-xNMLrsgajy): a listed
# namespace that does not exist fails every helm upgrade, so it is not listed.
# Turning ziti back on adds ziti to both lists again.
# cert-manager is deliberately absent: ClusterIssuer letsencrypt-dns01 uses
# Route53 via the node role over IMDS (no keys/IRSA), so denying it would break
# certificate renewals (first due 2026-11-17). Re-add it once IRSA/keys exist.
imdsDeny:
  enabled: true
  namespaces: [gardenio, arc-runners, arc-systems, beads, gc-dogfood, operators, default, headlamp, public-edge]
  exemptLabelNamespaces: [gardenio, beads]
networkPolicies:       {enabled: false}
# The public front door at https://clonk.tv (plan gd-tLxfoaw366, route
# gd-Z3eh4eEJ87, gd-gQ8hZLd4AQ): the splash baked into the gardenio landing
# image (gardenio/images/landing), which rides the release tag like every
# gardenio image (global.imageTag via release-deploy.sh). The public edge
# (gardenio-ziti/public-edge.yaml) proxies clonk.tv straight to the Service,
# so there is no Traefik route; public: no sign-in in front of it.
landing:
  enabled: true
  public: true
  page: image
  ingress:
    enabled: false
# Ingress fences for the apps that have no auth of their own (plan
# ziti-to-keycloak S2a): forwardauth <- public-edge only; grafana and the
# viewer <- edge/authproxy and the in-cluster callers listed below.
# Independent of networkPolicies above. Ziti is off (gd-xNMLrsgajy):
# zitiHostSelector null drops the ziti-host peer, and viewer-authproxy is no
# longer a forwardauth caller (its 8443 sign-in check went with ziti). null,
# NOT {}: helm merges a {} into the chart default {app: ziti-host} and the
# peer stays (rendered and checked).
edgeBackends:
  enabled: true
  zitiHostSelector: null
  # Grafana's trusted port (3000, header auth-proxy): platform pods only.
  # They authenticate with tokens (mcp-grafana, grafana-bridge) or stamp the
  # header only from a verified session (beads-viewer). Agent pods are NOT
  # here: with the auth-proxy on, a pod on 3000 can claim any user
  # (gd-BcNoQUPKcM). The chart refuses to render the agent path while this
  # list names gardenio.io/agent.
  grafanaCallers:
    - matchLabels: {app.kubernetes.io/component: beads-viewer}
    - matchLabels: {app.kubernetes.io/component: mcp-grafana}
    - matchLabels: {app.kubernetes.io/component: mcp-grafana-write}
    - matchLabels: {app.kubernetes.io/component: grafana-bridge}
  # Grafana's header-stripping agent port (grafana.auth.proxy.agentPath).
  grafanaAgentCallers:
    - matchExpressions:
        - {key: gardenio.io/agent, operator: Exists}

# Lands gate 3 (gd-fs41dZ0fK7, task gd-bmsQ7FT3oj): per-land namespaces
# land-<name> with quota, default-deny NetworkPolicy (k3s enforces it: checked
# 2026-10-28 01:0xZ) and the three admission policies (lands-namespaces,
# land-agent-manager-binding, land-pods: the land RuntimeClass, land-agent,
# no token, no hostPath). Inert until a tenant land is provisioned. Tenant
# pods run on runc (runtimeClassName "", owner ruling gd-iyZom5u11A), kept
# off fleet-agent, platform and control-plane nodes (gd-NDJIOutLsv).
# Rollback: enabled: false (the provisioner then fails lands at its
# namespace step).
landNamespaces:
  enabled: true

# landgate v0 (gd-ParwLpmgID; runbook gardenio/helm/gardenio-ziti/README.md
# "landgate: the land door's second wall"), first land scopetest
# (gd-gRtlkXO2kQ). Needs a tag with #848 (the landgate image): 2026.294.11
# predates it. Roll this, wait for deploy/gardenio-landgate-scopetest Ready,
# THEN apply public-edge.yaml (its map line sends scopetest here).
# crewDeny.edgeCIDRs: edge node ip-10-90-160-232's EIP and InternalIP /32 and
# its podCIDR (re-read 2026-10-22 after the C8 edge move to edge subnet 1a). Agent pods lose these and the public-edge
# namespace, so also auth/grafana/api.clonk.tv. Recheck if the edge node is
# replaced: a new node brings a new private IP and podCIDR.
# Rollback: drop the scopetest map line and re-apply the edge first, then
# enabled: false.
landgate:
  enabled: true
  # Shape A (2026-10-24, gd-qS0Jg4q0Vk): the landgate template has no affinity
  # knob, so pin the 20m/32Mi gate to the on-demand pair outright (BOTH labels:
  # lifecycle=on-demand alone also matches the on-demand etcd server).
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  lands: [scopetest]
  crewDeny:
    edgeCIDRs: [32.199.110.32/32, 10.90.160.232/32, 10.42.237.0/24]
  # Crews reach scopetest's landgate (not the edge) to run the land-door
  # checks as its test owner (gd-Hq1PnUVOUC, gardenio/scripts/land-door-verify.sh).
  verifier:
    lands: [scopetest]
    roles: [crew]

# Per-project infra role for ClaimLayer (plan:agent-infra-access, P9
# gd-IYY1dxukfR; design gardenio/docs/project-infra-role-design.md). An agent
# escalated to role `claimlayer-infra` runs as SA gardenio/claimlayer-infra and
# may roll out and read logs for the demo in ns claimlayer-demo, and nothing
# else: no Secrets, no pods/exec, no RBAC, nothing in ns gardenio or kube-system.
#
# NOT rendered here, on purpose: the namespace (the project's own deploy owns
# it), its gardenio.io/project label (OPERATOR step), and the project's hand-applied
# ingress policies and the `ecr-token-refresh` Role/RoleBinding. None of the
# objects below exist live today, so there is nothing to adopt. Do NOT list
# claimlayer-demo in imdsDeny.namespaces: those policies are additive and would
# re-open egress (design s2).
#
# The role and spawn_policy beads are admin-gated and written by the OPERATOR.
# Rollback: set grants.claimlayer-infra.enabled and the SA's enabled to false.
projectInfraServiceAccounts:
  claimlayer-infra: {enabled: true, project: claimlayer}
projectNamespaceRbac:
  enabled: true
  grants:
    claimlayer-infra:
      enabled: true
      namespace: claimlayer-demo
      project: claimlayer
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments", "replicasets", "statefulsets"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["batch"]
          resources: ["jobs", "cronjobs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["pods", "configmaps", "services"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
        - apiGroups: ["", "events.k8s.io"]
          resources: ["events"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["networking.k8s.io"]
          resources: ["networkpolicies"]
          verbs: ["get", "list", "watch"]
      subjects:
        - kind: ServiceAccount
          name: claimlayer-infra
          namespace: gardenio
      # The demo is two Deployments at 10m/32Mi with a 128Mi limit; this leaves
      # headroom for agent test pods and still bounds a compromised agent.
      resourceQuota:
        hard:
          pods: "10"
          requests.cpu: "2"
          requests.memory: 4Gi
          limits.memory: 8Gi
      # Required: the quota on limits.memory rejects any pod that sets no limit.
      limitRange:
        limits:
          - type: Container
            default: {memory: 256Mi}
            defaultRequest: {cpu: 100m, memory: 128Mi}
      agentInfra:
        enabled: true
        serviceAccount: claimlayer-infra
        egress:
          keycloakRuntime: true     # oauth2-proxy -> gardenio-keycloak-runtime:8080
        admissionPolicy:
          enabled: true
          workloadServiceAccounts: ["default"]



# Autonomous rollout (plan:opus55-release, T6/T7). Every 15 min the CronJob
# resolves the newest calver tag and runs that tag's release-deploy.sh.
# Pause: `kubectl -n gardenio create configmap release-deployer-pause`, an
# emergency lever only; delete it when the emergency ends. A laptop roll does
# not re-pause (P-R4 gd-iK8RnuLG3W, gardenio/docs/release-pipeline.md).
# Rule 3b (values drift, PR #1993): the live helm values are compared with
# THIS file as it was at the previously deployed tag. A reviewed change here
# applies on the next roll; only a hand edit of the live values (helm upgrade
# --set or -f with another file) parks it until an operator rolls with
# `helm upgrade -f deploy-values/gardenio-k3s.yaml`. If that tag's copy
# cannot be read, it falls back to comparing with this file.
releaseDeployer:
  enabled: true
  # Role in ns public-edge for release-deploy.sh rule 4c (gd-t6Re9igBAj).
  # First install of it is an admin roll.
  edgeNamespace: public-edge
  # 2026-10-23 (shape A, spot pool min 0): the deployer runs every 15 min for
  # ~5 min with no placement rule, so the scheduler kept dropping it on the
  # emptiest node -- the lone spot node -- and the cluster-autoscaler's 10 min
  # unneeded window never completed, so the spot pool never drained. BOTH
  # labels, as elsewhere in this file: lifecycle alone also matches the
  # tainted edge and server nodes. The live CronJob was patched the same way
  # at 22:40Z; this keeps the next roll in step.
  nodeSelector:
    gardenio.io/lifecycle: on-demand
    gardenio.io/role: platform
  # 2026-10-23 22:58Z: the pinned pod then went Pending (the postgres node had
  # 90m CPU left after shape A). It is a shell script plus one helm upgrade;
  # 50m / 256Mi is plenty. Limits stay at the chart default (1 CPU / 1Gi).
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  # gd-5QYwXtV7IA: flip machinePrincipal.enabled to true in a SECOND roll, only
  # after (1) Secret gardenio-machine-gardenio-release-deployer exists, (2) the
  # gardenio-release-deployer KeycloakClient reconciled OK, and (3) the newest
  # calver tag contains the release-deploy.sh that fetches the token (the
  # deployer runs the TAGGED script, so an older tag would send no bearer).
  # Until then it keeps the legacy KD_TOKEN path.
  # All three held on 2026-10-17: Secret created, KeycloakClient OK in
  # 2026.290.6, and a probe from this CronJob's template fetched a token and
  # created a bead as machine:gardenio-release-deployer.
  machinePrincipal:
    enabled: true

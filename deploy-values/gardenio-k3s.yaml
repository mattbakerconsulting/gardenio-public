# gardenio on the self-managed k3s cluster (AWS spot, account 360190250083).
#
# Rebuilt 2026-09-18. The original deploy-values/ directory was stripped by the
# redacted export (it is not gitignored — it was simply not carried over), so
# scripts/deploy-byo.sh had no values file to read. This is that file, targeted
# at the k3s cluster rather than the generic BYO case.
#
# Renders: controller (agents) + kbeads + beads-viewer + in-cluster postgres.
# Zero AWS APIs at runtime. The only CRDs used are traefik.io/v1alpha1, which
# k3s bundles.
#
# Cluster facts this file is written against (verified 2026-09-18):
#   - ONE StorageClass: local-path (rancher.io/local-path), RWO only, no CSI.
#     PVs are node-local: a pod with a PVC is pinned to the node that bound it
#     and the data dies with that node.
#   - No External Secrets Operator, and IRSA is impossible (the k3s API server
#     issuer is https://kubernetes.default.svc.cluster.local, which AWS STS
#     cannot fetch). Pods reach AWS via the node instance role through IMDS.
#   - Nodes self-label gardenio.io/lifecycle={spot,on-demand} from IMDS at boot.
#   - The gardenio node pool is tainted gardenio.agent=true:NoSchedule.
#
# Prerequisites (see the header of scripts/deploy-byo.sh for ensure_secret):
#   kubectl -n gardenio create secret generic gardenio-postgres-password \
#     --from-literal=password="$(openssl rand -hex 24)"
#   (kd-beads-token is no longer a prerequisite of the daemon: kbeads stopped
#   accepting the shared static token, gd-ke6PC7bRto. No workload on this
#   overlay mounts it: the controller and coopmux are on machine principals,
#   gd-BDirD4F7Iq / gd-in7EZvvd3T.)
#   kubectl -n gardenio create secret docker-registry ghcr \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>

# Images are pulled through the in-region ECR pull-through cache (prefix `ghcr`
# -> ghcr.io), not from ghcr directly. Faster on a scale-to-zero spot pool where
# every new node re-pulls, and it decouples us from ghcr availability and rate
# limits. NOT a cost saving: data INTO EC2 is free.
#
# Both secrets are listed deliberately. `ecr` is the live path, rewritten every
# 8h by the ecr-token-refresh CronJob from the node role via IMDS (ECR tokens
# last 12h), so no long-lived registry credential exists in the cluster. `ghcr`
# is kept as a fallback: if the cache rule, its credential secret or the refresh
# CronJob ever break, the kubelet tries the next secret and pulls still work
# against the ghcr paths. Harmless while ECR is healthy.
imagePullSecrets:
  - name: ecr
  - name: ghcr

global:
  # CI pushes every gardenio image to this account's ECR (images.yml, plan
  # 2026-10-21-aws-cost-cuts): <acct>.dkr.ecr.<region>.amazonaws.com/gardenio/<c>.
  # The node role pulls it (EcrReadGardenio); the `ecr` pull secret comes from
  # the ecr-token-refresh CronJob. The ghcr pull-through rule is kept for the
  # pinned old tags and as the rollback path.
  imageRegistry: "360190250083.dkr.ecr.us-east-1.amazonaws.com/gardenio"
  # Live since helm rev 38 (2026-09-22), set there by --set only. The chart
  # default is false, so an upgrade from this overlay alone would DELETE the
  # PriorityClass that postgres/nats/vmsingle/beads reference. Keep it here.
  systemPriorityClass:
    create: true

  # was "gp2" (EBS CSI, absent here)
  storageClass: "local-path"

  # RETIRED 2026-09-20. The reason this was ever true no longer holds: CI now
  # publishes calver tags, 2026.263.2 is the first real one, and Chart.AppVersion
  # matches it (gd-ljoVmxrW8O; release.sh was fixed in #21 so the tag and the
  # chart bump can no longer diverge — tag 2026.263.1 was cut with Chart.yaml
  # never bumped, which is what that fix closed). With latestMode off, the
  # chart resolves per-component tag > global.imageTag > Chart.AppVersion, so
  # every image pins to the released calver tag with no further knobs.
  #
  # WHY THIS IS A CORRECTNESS FIX, NOT TIDINESS. `latest` is mutable, and this
  # cluster pulls through an ECR pull-through cache which served a FIVE-HOUR-STALE
  # :latest on 2026-09-20 while ghcr's was already correct. `kubectl rollout
  # restart` reported success and the pod came back running the SAME commit,
  # still carrying a known privilege bypass. Nothing in the rollout's output
  # said so; only reading `kd version` out of the pod did. An immutable calver
  # tag removes that failure mode entirely — a given tag is one image forever,
  # so a cache can be stale about nothing.
  #
  # Consequence to expect: pullPolicy is no longer forced to Always. That is
  # correct for an immutable tag and is the point — there is nothing to re-pull.
  latestMode: false

  # The gardenio pool carries gardenio.agent=true:NoSchedule. Agent pods
  # generated by the controller already tolerate this key by default
  # (internal/podmanager/defaults.go:206-212); the four control-plane pods do
  # not, so they need it here. Toleration WITHOUT a matching nodeSelector is
  # deliberate — the scheduler fills untainted nodes first and spills onto the
  # tainted pool, which is the pattern this chart already documents.
  tolerations:
    - key: "gardenio.agent"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  # The lone ReadWriteMany PVC in the chart. local-path cannot bind it.
  coverage:
    enabled: false

# LimitRange defaults are sized for EKS/Karpenter: 2 CPU / 16Gi requested for
# any container that omits requests. On 2 vCPU / 8 GiB nodes that makes every
# such pod unschedulable. Trimmed to the gardenio-in-a-box figures.
limitRange:
  enabled: true
  default:
    cpu: "2"
    memory: "4Gi"
  defaultRequest:
    cpu: "250m"
    memory: "512Mi"
  max:
    cpu: "2"
    memory: "6Gi"

# REQUESTS RIGHT-SIZED 2026-10-23 (gd-TEP4ygX3dq). Shape A set the spot pool's
# floor to 0, but the cluster-autoscaler could not remove a spot node ("cpu
# requested (68.5% of allocatable) is above the scale-down utilization
# threshold", 0.3 in helm/ci/autoscaler-values.yaml). Measured 17:27Z, kubectl
# top vs requests, whole cluster minus CI runners: ~7 CPU requested and ~1.5
# used; 54 GiB memory requested, 16.7 GiB used. Services are cut to about 2x
# live use so the platform fits on the two on-demand agents and the spot pool
# empties when no crew runs. Only REQUESTS change; every limit stays, so a
# service can still burst. Postgres and the kbeads CPU are left as they were.
#
# CPU weight. Under CFS a pod's share of a busy node follows its REQUEST (see
# beadsViewer below). Crew and gardener pods request 500m (the gardenio project
# bead's cpu_request), so a user-facing service keeps a request that is a
# real fraction of that: viewer 200m (0.4 of a crew), keycloak-runtime 150m
# (0.3), coopmux 50m (0.1), slack-bridge 50m (0.1, unchanged). Background
# services (litellm, nats, vmsingle, grafana, minio, vlsingle) go to 25-50m.
# Per-component values sit beside each block and say what they were.

# --- AWS storage objects: never create (all ebs.csi.aws.com) ---
storageClass:          {create: false}
storageClassImmediate: {create: false}
volumeSnapshotClass:   {create: false}

# A Retain-policy local-path class, so `helm uninstall` does not erase the
# database. k3s's stock local-path is reclaimPolicy: Delete.
storageClassRetain:
  create: true

# --- no External Secrets Operator / AWS Secrets Manager ---
# Every secret is pre-created by hand (see the header). Nothing in the chart
# reaches AWS.
externalSecrets: {enabled: false}
registrySecrets:  {enabled: false}

# --- Keycloak: self-hosted in-cluster realm + OIDC client for the front ---
# --- door's forwardAuth (decision gd-zudIB5TDVI: keycloak-self-hosted; ---
# --- task gd-EE85TdkFDV). ---
#
# PREREQUISITE 1 — DONE 2026-09-19. The EDP keycloak-operator
# (v1.edp.epam.com CRDs) is installed: chart epamedp/keycloak-operator
# 1.32.0 into namespace "operators" per scripts/bootstrap-ec2.sh, with
# clusterReconciliationEnabled=true and WATCH_NAMESPACE empty so it
# reconciles CRs in THIS namespace. Verified: 14 *.edp.epam.com CRDs
# present, operator pod Running. Without it `helm upgrade` with
# keycloak.enabled: true fails "no matches for kind", which is what the
# previous version of this comment block described.
#
# PREREQUISITE 2 — DONE 2026-09-19: Secret gardenio-forwardauth-secrets
# exists in this namespace with client-secret (48 chars) and cookie-secret
# (32 bytes), carrying Helm ownership metadata + resource-policy: keep, so
# the later forwardAuth upgrade adopts rather than collides with it. The
# reasoning for why it had to be hand-made is preserved below because the
# underlying CHART DEFECT is still unfixed.
#
# The original note: hand-create the Secret
# `gardenio-forwardauth-secrets` (keys client-secret + cookie-secret) in the
# release namespace BEFORE this upgrade. Reason, and it is a real trap:
# templates/keycloak/clients.yaml stamps
# `secret: "$gardenio-forwardauth-secrets:client-secret"` onto the
# gardenio-traefik-forwardauth KeycloakClient whenever
# keycloak.forwardAuth.clientSecretRef.name/key are set (they are, by chart
# default) — that special case is NOT gated on forwardAuth.enabled. The
# template that actually CREATES that Secret,
# templates/forwardauth/secrets.yaml, IS gated on it
# (`and .Values.keycloak.enabled .Values.keycloak.forwardAuth.enabled ...`).
# Because this file deliberately leaves forwardAuth off (see SCOPE below),
# the KeycloakClient CR references a Secret the chart never renders, and the
# EDP operator cannot resolve `$name:key` — the client silently never
# reconciles and BOTH of this task's acceptance criteria fail. Verified by
# rendering: `helm template -f this-file` emits the KeycloakClient with that
# secret reference and no gardenio-forwardauth-secrets Secret anywhere.
#
# Create it with Helm's ownership metadata so the later forwardAuth-enabling
# upgrade (gd-epq9jTtIxV) ADOPTS it instead of failing on "invalid ownership
# metadata", and so it keeps the same value: that template seeds via
# `gardenio.inbox.seededValue`, which does a live `lookup` and reuses an
# existing key rather than re-randomising. Lengths match the chart (48-char
# client-secret; cookie-secret MUST be 16/24/32 bytes — the chart uses 32).
# The exact kubectl is in escalation gd-AiHQi0mWMF's execution_script.
#
# The clean fix is a one-line chart change — render that Secret whenever the
# KeycloakClient references it, not only when forwardAuth is enabled — but
# gardenio/helm/** is the namespace owner's lane, not a crew's, so it is
# written up on gd-EE85TdkFDV rather than done here.
#
# SCOPE, deliberately narrow (this task is gd-EE85TdkFDV, "deploy the realm
# and OIDC client" — NOT "wire up live forwardAuth traffic gating", which is
# the separate, still-blocked gd-epq9jTtIxV):
#   - keycloak.runtime.ingress.enabled stays false. The chart's own
#     forwardAuth fail-fast (templates/forwardauth/deployment.yaml, audit
#     ka-0000007912) requires an https:// issuer, and the ONLY way this
#     chart ever gets Keycloak reachable over https is Traefik terminating
#     TLS in front of it (keycloak.runtime.ingress.enabled: true renders the
#     FIRST Traefik IngressRoute this cluster would ever have — see the file
#     header: "no public DNS record, no Ingress, no LoadBalancer" is the
#     epic's whole starting trust boundary). Flipping that on is exactly the
#     exposure decision gd-4bu0CHgWQr (stand up BrowZer front door) and
#     gd-xZOjaRfA9P (publish first public DNS record) exist to make
#     carefully, with the "other six services still return nothing to an
#     unauthenticated probe" check — not a side effect of this task.
#   - keycloak.forwardAuth.enabled stays false for the same reason (its
#     default ingress.enabled: true would render a second new IngressRoute,
#     and even without its own ingress, oauth2-proxy can't satisfy the
#     https-issuer fail-fast until runtime.ingress above is on). Flipping it
#     on is gd-epq9jTtIxV's job, once BrowZer/DNS have landed.
#     UPDATE 2026-10-13 (gd-WJ09iJNvFM): forwardAuth is now ON for the viewer
#     host only, issuer https://auth.clonk.tv (the public edge); see the
#     forwardAuth block at the end of this keycloak section.
# This task's two acceptance criteria don't need either: the discovery doc
# is reachable in-cluster over plain HTTP (no TLS needed for that), and the
# authorization-code flow can be driven straight against Keycloak's own
# /realms/gardenio/protocol/openid-connect/auth endpoint through a
# port-forward, using the client registered below.
keycloak:
  enabled: true

  # REQUIRED WHENEVER keycloak.enabled IS TRUE, or the beads daemon will not
  # boot. templates/beads/deployment.yaml renders BEADS_OIDC_ISSUER_URL from
  # the derived Keycloak issuer as soon as keycloak.enabled is set, but it
  # renders BEADS_OIDC_AUDIENCE only `if .Values.keycloak.oidcAudience` —
  # which defaults to "". kbeads then refuses to start:
  #   Error: BEADS_OIDC_AUDIENCE is required when OIDC is enabled
  #   (BEADS_OIDC_ISSUER_URL or BEADS_OIDC_ISSUER_URLS is set)
  # and the new ReplicaSet CrashLoopBackOffs. Observed here: enabling Keycloak
  # wedged the beads rollout (the previous pod kept serving, so it presented
  # as a stuck rollout rather than an outage).
  #
  # Value is the audience beads expects in a browser-user JWT's `aud` claim.
  # It is the OIDC client those tokens are issued for — the one client this
  # deployment registers, gardenio-traefik-forwardauth (see clients: below).
  # Nothing mints such tokens yet because forwardAuth is off, so this is
  # currently inert; it must stay correct for when gd-epq9jTtIxV turns
  # forwardAuth on. In-cluster agents are unaffected either way — they
  # authenticate with BEADS_DAEMON_TOKEN, an independent path.
  oidcAudience: "gardenio-traefik-forwardauth"

  runtime:
    enabled: true
    # In-cluster TLS (gd-XRsosVFAau, owner decision gd-F060vJkxoM's option B
    # follow-up): Keycloak also serves https on 8443 with a cert-manager cert
    # from a namespaced CA, and the Lands provisioner dials it there, trusting
    # the CA. Rollback: enabled: false here AND set
    # agents.lands.provisioner.keycloak.url to an https URL (keycloakadmin no
    # longer accepts http), or turn the provisioner off; then roll.
    # inClusterClients (gd-lYPZlslOM7): the other in-cluster clients dial 8443
    # too and trust the CA: every machine-principal token fetch (controller,
    # bridges, viewer, trigger-engine, coopmux, release-deployer), the beads
    # daemon's OIDC discovery and the first-admin kcadm Job. http 8080 stays
    # for Traefik (TLS ends at the edge) and the EDP operator. Rollback for
    # just those clients: inClusterClients: false and roll.
    tls:
      enabled: true
      inClusterClients: true
    # Was 250m / 1Gi; live 6m / 485Mi (gd-TEP4ygX3dq). The sign-in path, so
    # the CPU stays at 0.3 of a crew's weight. Limit 2 / 2Gi unchanged (the
    # JVM's start-up burst and heap sizing follow the limit, not the request).
    resources:
      requests: {cpu: 150m, memory: 768Mi}
    # Gardenio login theme (plan gd-QXq1fjYuRD S1f, gd-ktJdfGG7tI): mounts the
    # chart's theme ConfigMap at /opt/keycloak/themes/gardenio. Pairs with
    # keycloak.realm.themes.loginTheme below. Cosmetic only. Rollback: set
    # realm.themes.loginTheme back to "keycloak" (optionally enabled: false)
    # and roll.
    theme:
      enabled: true
      name: gardenio
    # Realm brute-force detection, applied by the first-admin hook with kcadm
    # (the KeycloakRealm CRD has no such field). Needed before the realm is the
    # only door to public hosts (gd-DAy1iWvO4y). Rollback: set false and roll.
    realmHardening:
      bruteForce:
        enabled: true
      # WebAuthn Passwordless policy for passkeys (gd-h9M9eTTun8, plan
      # gd-QXq1fjYuRD S3a). RP ID defaults to the host of hostnameUrl below
      # (auth.clonk.tv). keycloak.mfa.factor "passkey" below needs it: do not
      # set it false while that factor is live.
      passkeys:
        enabled: true
    # No persistence override: the chart default (emptyDir) applies to
    # /opt/keycloak/data, which holds only caches and temp files. The realm
    # itself (users, credentials, passkeys, sessions) lives in Postgres
    # (KC_DB=postgres, database keycloak on gardenio-postgres: a Retain PVC,
    # pg_dumpall to S3 every 2 h), so a restart loses none of it. The old
    # PVC pinned the pod to ip-10-90-0-187, which no longer exists, so every
    # release failed on the first-admin hook (rev 41). Moved off it
    # 2026-09-22 via gd-GRGMP20rQ1: delete the sts with --cascade=orphan, then
    # upgrade. Setting persistence back to true needs the same dance, because
    # k8s forbids changing volumeClaimTemplates in place.
    # No ingress in front (see SCOPE above), so this only has to resolve
    # in-cluster. KC_HOSTNAME renders the issuer/discovery-doc URLs from
    # this value; using the Service FQDN keeps them matching what a
    # port-forward or in-cluster curl actually reaches. Re-point at the
    # real public host in the same task that publishes the public DNS
    # record (gd-xZOjaRfA9P) and re-anchor the client redirectUris/
    # webOrigins below to match at the same time.
    host: "gardenio-keycloak-runtime.gardenio.svc.cluster.local"
    # Browser-facing frontend (decision gd-GbIgemW3dt, gd-ZbqAlzulHK):
    # auth.clonk.tv is served by the public-edge nginx
    # (helm/gardenio-ziti/public-edge.yaml), which exposes ONLY
    # /auth/realms/gardenio/ and /auth/resources/. The issuer and login pages
    # use it; backchannel-dynamic keeps in-cluster callers (the EDP operator,
    # oauth2-proxy's redeem/jwks, kcadm) on the Service URL. This changes the
    # issuer for EVERY realm-gardenio client: the consumer audit and the
    # post-roll acceptance live in gd-awxRiPyRC5 (no verifier depended on the
    # old issuer on 2026-10-11). Rollback: comment both lines out and roll.
    hostnameUrl: "https://auth.clonk.tv/auth"
    hostnameBackchannelDynamic: true
    db:
      # Reuse this file's in-cluster postgres (postgres.enabled: true
      # below) instead of requiring a separate hand-created DB secret.
      autoWire: true
    clusterKeycloak:
      # Matches scripts/bootstrap-ec2.sh's OPERATORS_NAMESPACE default —
      # without this the operator can never read the admin Secret (it
      # resolves ClusterKeycloak.spec.secret in its OWN namespace, not
      # .Release.Namespace) and ClusterKeycloak stays connected:false.
      operatorNamespace: "operators"
      # The ClusterKeycloak dials https:8443 and trusts the runtime CA from a
      # ConfigMap in operators (gd-PhU6jPtSxa). The roll that first turns
      # this on MUST be an admin roll: it creates that ConfigMap and adds the
      # deployer's get/update/patch on it, neither of which the deployer can
      # do itself. Rollback: false and roll (the ConfigMap is kept).
      tls: true
    ingress:
      enabled: false # see SCOPE above — deliberately not this task's call
    # Prometheus-operator CRD, NOT installed on this cluster. Chart default
    # is true, and leaving it on fails the upgrade outright:
    #   resource mapping not found for name: "gardenio-keycloak-runtime":
    #   no matches for kind "ServiceMonitor" in version monitoring.coreos.com/v1
    # Same class as monitoring.victoriaMetrics (VMServiceScrape CRDs, owned by
    # the VictoriaMetrics operator) — this deployment scrapes with vmagent's
    # own prometheus.io/scrape discovery instead of any operator CRD, so
    # nothing is lost by turning it off. Caught by --dry-run=server; a plain
    # client-side lint does NOT catch it, because the mapping only fails
    # against a live API server.
    serviceMonitor:
      enabled: false

    # HA phase 1 (gd-kU2wuaNHMJ): this StatefulSet's `data` PVC is local-path
    # (node-local) and it has NO on-demand nodeSelector at all today — it is
    # running on a SPOT node (ip-10-90-0-187) with no selector to keep it
    # there, so a reclaim would take its data with it.
    #
    # PINNING DEFERRED, not dropped: the coordinator's review of this PR
    # (PR #50) measured this + agents/beads/coopmux together adding enough
    # platform request load to the on-demand pair to cut gardener scheduling
    # slots from ~2 to <=1 (the root cause of gd-n9jrfS0jt6's overnight
    # gardener deaths) — 250m of this StatefulSet's own request is the single
    # largest piece of that. Sequenced to land after gd-tuiGnrzxMR (the
    # on-demand instance upsize) as the follow-up task gd-JIhzxaq3pJ, same
    # nodeSelector shape as below. Only the smaller, non-platform-baseline
    # movers (triggerEngine, ziti-host, viewer-authproxy) land in this PR.
    #
    # Pinning alone does not fix the durability gap (an instance refresh or
    # AZ event still takes the node and the volume with it) — that is
    # tracked separately as gd-85rqxsPPoM (PR #51 removes the PVC entirely,
    # which would make this moot once merged).

  # SAME SCHEMA MISMATCH, different CRD: the chart renders .spec.description
  # on every KeycloakRealmGroup, and the KeycloakRealmGroup CRD in
  # keycloak-operator 1.32.0 does not declare it —
  #   .spec.description: field not declared in schema
  # — which fails the apply for all five groups. The field is gated on being
  # present (`{{- if .description }}`), so the fix is to redeclare the group
  # list without descriptions.
  #
  # A Helm list OVERRIDE REPLACES the whole list rather than merging, so all
  # seven chart groups are reproduced here verbatim. Only the cosmetic
  # description string is dropped: `realmRoles` is what actually carries
  # authorization, and every role below is byte-identical to the chart
  # default (gardenio-admin / gardenio-operator / gardenio-viewer /
  # gardenio-mention / escalation-approver / gardenio-project-member for
  # lands-tenants; invited holds none). Dropping a group, or dropping a
  # realmRole, WOULD be a privilege change — this is not.
  #
  # Remove this override once the operator is upgraded to a version whose
  # KeycloakRealmGroup CRD declares description.
  groups:
    - name: gardenio-admins
      realmRoles:
        - gardenio-admin
      # Literal impersonation V1 (gd-X2xwS9MoBP), as the chart default: the
      # admin console's Impersonate button. Realm events (chart default
      # keycloak.realm.events) record each impersonation.
      clientRoles:
        - clientId: realm-management
          roles: [impersonation, view-users]
    - name: gardenio-operators
      realmRoles:
        - gardenio-operator
    - name: gardenio-viewers
      realmRoles:
        - gardenio-viewer
    - name: gardenio-mentioners
      realmRoles:
        - gardenio-mention
    - name: gardenio-escalation-approvers
      realmRoles:
        - escalation-approver
    # Project-scoped access (gd-zuV3EfwrzB): members see only claimlayer.
    # Declared here (not via keycloak.projectGroups) because this list
    # override already drops the chart's, and the rendered group carries no
    # description, which this operator's CRD rejects.
    - name: project-claimlayer
      realmRoles:
        - gardenio-project-member
    # Test land: the land-door verifier's fixture (gd-Hq1PnUVOUC), kept past
    # gd-llFKMS8Pkc's Task 12 step 8. Its /owners subgroup is runtime state
    # (see realmUsers below).
    - name: project-scopetest
      realmRoles:
        - gardenio-project-member
    # Every Lands tenant (Track B step 7.8): the chart's lands-tenants group,
    # reproduced because this list replaces the chart's. The viewer edge
    # admits it; it carries gardenio-project-member only and names no project.
    - name: lands-tenants
      realmRoles:
        - gardenio-project-member
    # Everyone whose sign-in invite was claimed (gd-ycE484kLyk): the chart's
    # invited group, reproduced for the same reason. The viewer edge's
    # /lands/ check admits it; it carries no role.
    - name: invited

  # Per-land audience scopes (gd-eAfptUBh9Z) for the lands whose groups are
  # declared above rather than in keycloak.projectGroups; runtime lands get
  # theirs from the Lands provisioner.
  landScopes:
    - claimlayer
    - scopetest   # test land, kept for the land-door verifier (gd-Hq1PnUVOUC)
  # The clients that may request a land-<name> scope: the chart's default plus
  # the land-door verifier's password-grant client.
  landScopeClients:
    - gardenio-cli
    - gardenio-land-verifier

  # The owner's admin account, declared so a Keycloak rebuild (a fresh
  # keycloak database, e.g. restored from an older dump) re-creates it with
  # gardenio-admin (gardenio-admins carries that role). Canonical identity per
  # the owner, 2026-10-11 (gd-MBsUUXpJZB, epic gd-00NASU92b2). NO credential
  # here: the owner sets their own password on first sign-in (an admin issues a
  # temporary one, or reset-credentials); the 2026-10-11 stopgap user and its
  # one-time Secret gardenio/gardenio-owner-initial-password are adopted by
  # username, not replaced.
  realmUsers:
    - username: "matthewbaker1110@gmail.com"
      firstName: "Matthew"
      lastName: "Baker"
      groups:
        - gardenio-admins
    # The land-door verifier's test owner of land scopetest (gd-Hq1PnUVOUC).
    # Its password is key `password` of Secret crew-land-verifier, which the
    # crew role bead mounts (from AWS SM gardenio/crew-land-verifier). No
    # groups here: the operator matches groups by bare name, and "owners"
    # could hit another land's /owners. Its /project-scopetest/owners
    # membership was set once, by path (escalation on gd-Hq1PnUVOUC);
    # addOnly never removes it. gardenio-land-verifier is the role the
    # gardenio-land-verifier client's password grant requires; nobody else
    # holds it.
    - username: "land-verifier-scopetest@lands.clonk.tv"
      firstName: "Land"
      lastName: "Verifier"
      passwordSecret:
        name: crew-land-verifier
        key: password
      roles:
        - gardenio-land-verifier
    # No teammate entry: akashdixit@gmail.com signs in with GitHub through a
    # sign-in invite (owner decision gd-Iyj3cmi7lJ, route a). A realm user
    # declared here would hold his email, and the GitHub first-login flow
    # refuses an email that already has an account (auth-flow-github.yaml).

  realm:
    # Stable name — "prod owns gardenio" per the chart's own comment.
    name: "gardenio"
    clusterKeycloakRef: "gardenio-keycloak-runtime"
    # Only a login theme ships (files/keycloak-theme/gardenio/login); account
    # and email themes stay on the Keycloak defaults.
    themes:
      loginTheme: "gardenio"
    # Realm SMTP for VERIFY_EMAIL / reset-password mail (gd-hTlQPf59qf, chart
    # #795). Identity lands.clonk.tv + IAM user gardenio-keycloak-smtp come from
    # Terraform module.ses_lands (#797; one SendRawEmail policy pinned to that
    # identity and From). The access key is hand-minted, never in TF state; the
    # Secret gardenio-keycloak-smtp holds username (AKIA id) + password (SigV4
    # SES SMTP password). SES is in the SANDBOX until the owner gets production
    # access, so mail only reaches verified addresses until then.
    smtp:
      enabled: true
      host: "email-smtp.us-east-1.amazonaws.com"
      port: 587
      starttls: true
      ssl: false
      from: "lands@lands.clonk.tv"
      fromDisplayName: "gardenio"
      auth:
        enabled: true
        secretName: "gardenio-keycloak-smtp"
    # CHART/OPERATOR SCHEMA MISMATCH — must be empty on operator 1.32.0.
    # The chart renders .spec.defaultGroups on KeycloakRealm, but the CRD
    # shipped by keycloak-operator 1.32.0 does not declare that field, so
    # server-side apply rejects the whole object:
    #   failed to create typed patch object (gardenio/gardenio-realm):
    #   .spec.defaultGroups: field not declared in schema
    # Every OTHER field the chart renders (displayName, keycloakRef, login,
    # passwordPolicy, realmName, sessions, themes, tokenSettings) IS declared
    # — this is the only offender, verified by diffing the rendered spec keys
    # against the live CRD schema.
    #
    # SECURITY NOTE, because the chart default exists for a real reason
    # (values.yaml "First-admin bootstrap"): defaultGroups:[gardenio-viewers]
    # is what makes a newly auto-provisioned OIDC user land READ-ONLY. With
    # it empty, a new user joins NO group and therefore carries no
    # gardenio-viewer role — that is fail-CLOSED (less access, not more), so
    # it is safe to ship this way. It is safe TODAY for two further reasons:
    # login.userRegistration is false, so nobody can self-provision, and
    # forwardAuth is off, so there is no live OIDC login path into the viewer
    # at all. The first-admin bootstrap hook is unaffected — it joins its
    # admin user to gardenio-admins explicitly rather than via defaultGroups.
    #
    # REVISIT WHEN forwardAuth LANDS (gd-epq9jTtIxV): at that point real users
    # start logging in, and with no default group they will authenticate
    # successfully and then see nothing until an admin assigns them a group by
    # hand. Either upgrade the operator to a version whose KeycloakRealm CRD
    # declares defaultGroups, or assign gardenio-viewers through a
    # KeycloakRealmGroup/role-mapping path the installed CRDs do support.
    defaultGroups: []


  # Chart default enables a GitLab SSO broker (real gitlab.com endpoints,
  # placeholder clientId, empty clientSecret — keycloak.gitlabIdpClientSecret
  # is unset here) aimed at cloud/prod environments. Out of this task's
  # scope entirely — this environment has no GitLab OAuth app registered —
  # so switch it off rather than stand up an unreviewed external SSO
  # relationship as a side effect of enabling keycloak.enabled.
  identityProviders: []

  # Only the client this environment actually needs today: forwardAuth in
  # front of beads-viewer (the file header's "Renders: controller + kbeads +
  # beads-viewer"). The chart's other default clients (coopmux,
  # landing, ios, escalation, beads-api, admin-api) are for chart
  # features this k3s deployment does not run — they still exist as chart
  # defaults for other environments; omitted here rather than registered
  # pointed at made-up hosts. gd-epq9jTtIxV wires this clientId into
  # keycloak.forwardAuth.clientId once forwardAuth itself is turned on.
  clients:
    - clientId: gardenio-traefik-forwardauth
      name: "Traefik ForwardAuth"
      public: false
      # SECURITY: anchored to the one real host this install will answer to
      # once gd-4bu0CHgWQr/gd-xZOjaRfA9P land (audit ka-0000004369 F2 — no
      # wildcarded hosts). Until then, verify the auth-code flow through a
      # port-forward with a local /etc/hosts entry or curl --resolve for
      # this host, rather than adding a second, throwaway localhost
      # redirect URI here.
      redirectUris:
        - "https://gardenio.clonk.tv/oauth2/callback"
        # One oauth2-proxy callback per planned public host (gd-DAy1iWvO4y),
        # each anchored to its exact host; registered ahead of the hosts going
        # live so no later Keycloak change gates a host's launch.
        - "https://grafana.clonk.tv/oauth2/callback"
        - "https://mux.clonk.tv/oauth2/callback"
        - "https://dashboard.clonk.tv/oauth2/callback"
        # The edge sign-in check in front of the gardenio realm admin console
        # on auth.clonk.tv (decision gd-papvgFfwMf, admin impersonation V1).
        - "https://auth.clonk.tv/oauth2/callback"
      webOrigins:
        - "https://gardenio.clonk.tv"
        - "https://grafana.clonk.tv"
        - "https://mux.clonk.tv"
        - "https://dashboard.clonk.tv"
      attributes:
        # The impersonation banner's Stop (plan gd-0SUIdKXWV3 step 4) ends the
        # Become session at Keycloak's end-session with this client_id and
        # post_logout_redirect_uri=https://gardenio.clonk.tv/garden. "+" (the
        # redirect URIs, all /oauth2/callback) does not allow it. The callbacks
        # "+" allowed are listed beside it instead of a "+" entry, so the list
        # means the same whichever way Keycloak reads "+" next to other URIs
        # ("##" is Keycloak's multivalued attribute separator).
        post.logout.redirect.uris: "https://gardenio.clonk.tv/garden##https://gardenio.clonk.tv/oauth2/callback##https://grafana.clonk.tv/oauth2/callback##https://mux.clonk.tv/oauth2/callback##https://dashboard.clonk.tv/oauth2/callback##https://auth.clonk.tv/oauth2/callback"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        # kbeads verifies tokens with aud = keycloak.oidcAudience (this client).
        # An ID token has it already; a Keycloak ACCESS token only does with this
        # mapper. Roles reach kbeads via realm_roles above (ExtractRoles reads it
        # next to realm_access.roles). gd-l1Jh9aFEXY.
        - name: audience-self
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: gardenio-traefik-forwardauth
            id.token.claim: "false"
            access.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        # Who is acting behind an impersonated session (one-click Become,
        # gd-rbML2txvGG). Keycloak sets these session notes only when an admin
        # impersonates a user, so on any other session both claims are absent.
        # beads-viewer and kbeads already verify this client's access token,
        # so they read the claim with no oauth2-proxy change.
        - name: impersonator
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          config:
            user.session.note: IMPERSONATOR_USERNAME
            claim.name: impersonator
            jsonType.label: String
            id.token.claim: "true"
            access.token.claim: "true"
        - name: impersonator-id
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          config:
            user.session.note: IMPERSONATOR_ID
            claim.name: impersonator_id
            jsonType.label: String
            id.token.claim: "true"
            access.token.claim: "true"

    # One-click Become (plan gd-0SUIdKXWV3, gd-rbML2txvGG): the page at
    # auth.clonk.tv/gardenio/become/ signs the admin in through this PUBLIC
    # client (standard flow, PKCE S256, no password grant, no service account)
    # and calls the admin API's impersonation endpoint with the token.
    # fullScopeAllowed false: the token carries only the three realm-management
    # roles mapped below, and only when the admin already holds them (today
    # gardenio-admins: impersonation + view-users, and view-users is a
    # composite holding query-users). Keycloak's admin API checks both: the
    # user holds the role AND this client has it in scope. The CRD has no
    # scope-mapping field, so the first-admin hook adds them (step 2d).
    # Admin permissions v2 cannot be set from here (KeycloakRealm 1.32.0 has
    # no adminPermissionsEnabled), so impersonation is not limited to
    # lands-tenants in Keycloak; the Become page refuses admins itself.
    - clientId: gardenio-become
      name: "Gardenio Become (one-click impersonation)"
      public: true
      standardFlowEnabled: true
      directAccess: false
      fullScopeAllowed: false
      redirectUris:
        - "https://auth.clonk.tv/gardenio/become/*"
      webOrigins:
        - "https://auth.clonk.tv"
      attributes:
        pkce.code.challenge.method: S256
      scopeMappings:
        - clientId: realm-management
          roles: [impersonation, view-users, query-users]

    # The CLI sign-in path (gd-bFFquoScHy): `kd login` runs the OAuth device
    # authorization grant against this PUBLIC client so the owner can make
    # admin-gated kbeads writes from a terminal. The person completes the
    # sign-in in their own browser; no password passes through kd. Device grant
    # ONLY: no browser redirect flow (standardFlowEnabled false, so no
    # redirectUris to anchor) and no password grant (directAccess false).
    # Tokens carry what kbeads verifies: aud = keycloak.oidcAudience via
    # audience-self (same reason as the forwardauth client above) and the
    # person's roles via realm_roles, so the daemon sees gardenio-admin.
    - clientId: gardenio-cli
      name: "Gardenio CLI (kd login)"
      public: true
      standardFlowEnabled: false
      directAccess: false
      attributes:
        oauth2.device.authorization.grant.enabled: "true"
        # Keycloak's own default is 600s; stated so the grant's lifetime is
        # reviewable here.
        oauth2.device.code.lifespan: "600"
        # A device-code sign-in can be started from anywhere kd runs, including
        # an agent pod that shows the owner a code to confirm (gd-bFFquoScHy
        # merge-desk review). Bound what such a token is worth: the access
        # token lives 5 minutes, and the refresh token dies after 8h idle or 7d
        # total. Owner decision gd-lpQFvBIWZ0 (2026-10-16, "7d", match the
        # browser SSO max) raised these from 1h idle / 8h total: the 1h idle
        # ended the session whenever the laptop slept. 8h idle is the realm's
        # SSO idle (keycloak.realm.sessions.ssoSessionIdleTimeout), which
        # Keycloak caps a client's idle at anyway. A sign-in the owner did not
        # mean to grant is still bounded and visible (Keycloak sessions), and
        # `kd login` stays the owner's weekly re-consent.
        # kbeads refuses escalation approve from this client whatever these
        # lifetimes are: only the page session (the forward-auth client)
        # approves (P10.B, gd-4mEAhIE01U).
        access.token.lifespan: "300"
        client.session.idle.timeout: "28800"
        client.session.max.lifespan: "604800"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: audience-self
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: gardenio-traefik-forwardauth
            id.token.claim: "false"
            access.token.claim: "true"
        # `kd login` tokens carry the person's group paths (e.g.
        # /gardenio-admins), the claim the edge on api.clonk.tv gates on
        # (gd-DAy1iWvO4y). Same mapper as the forwardauth client; full.path
        # "true" keeps the leading slash the edge's allowed_groups compares.
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    # The land-door verifier's sign-in (gd-Hq1PnUVOUC, owner ruling on
    # gd-ER4PMJ3vcP). gardenio/scripts/land-door-verify.sh signs in the test
    # owner of land scopetest with the password grant against the in-cluster
    # Keycloak and asks for scope land-scopetest. Password grant ONLY: no
    # browser flow, no device grant. It is the only client here with
    # directAccess.
    #
    # Who may sign in: only holders of the realm role gardenio-land-verifier,
    # which only the test owner's realmUsers entry carries. directGrantRole
    # binds the password grant to a flow that refuses everyone else before
    # the password is checked (templates/keycloak/auth-flow-direct-grant.yaml).
    # The client is public and Keycloak's default direct grant runs no passkey,
    # so without that flow anyone holding any realm user's password, the
    # owner's included, would get this client's bearer.
    #
    # What the token carries: fullScopeAllowed false, so no realm role the user
    # holds reaches it (never gardenio-admin). The one role it needs,
    # gardenio-project-member (kbeads and landgate admit only it on a land
    # token), comes from a hardcoded-role mapper: KeycloakClient has no realm
    # scope-mapping field. Plus aud = keycloak.oidcAudience and group paths,
    # as on gardenio-cli.
    - clientId: gardenio-land-verifier
      name: "Gardenio land-door verifier"
      public: true
      standardFlowEnabled: false
      directAccess: true
      directGrantRole: gardenio-land-verifier
      fullScopeAllowed: false
      attributes:
        access.token.lifespan: "300"
        client.session.idle.timeout: "600"
        client.session.max.lifespan: "600"
      protocolMappers:
        - name: project-member
          protocol: openid-connect
          protocolMapper: oidc-hardcoded-role-mapper
          config:
            role: gardenio-project-member
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: audience-self
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: gardenio-traefik-forwardauth
            id.token.claim: "false"
            access.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    # Captured from the hand-made clients so the realm is rebuildable from code
    # (gd-DAy1iWvO4y). Both mirror the operator's 2026-10-14 live export of
    # realm gardenio (task comment 6925) field for field, plus the one intended
    # addition below. Secrets are never inlined: each is a "$<secret>:<key>"
    # reference and the EDP operator syncs the client secret FROM that Secret,
    # so the live secrets do not change.
    #
    # Grafana: confidential, standard flow only, PKCE S256. Secret is the
    # existing gardenio/gardenio-grafana-oidc (key client-secret). name and
    # description are kept exactly as live (they still say "ziti only"; a
    # cosmetic rewrite can follow).
    - clientId: grafana
      name: "Grafana (gardenio-k3s, ziti only)"
      description: "Grafana generic_oauth login. Hand-created 2026-10-12 for gd-LMHmuLp48L; not yet in chart."
      public: false
      standardFlowEnabled: true
      directAccess: false
      secret: "$gardenio-grafana-oidc:client-secret"
      # grafana.clonk.tv only: the ziti name gardenio.grafana.ziti:3000 went
      # with ziti (gd-xNMLrsgajy), as redirect URI, web origin and post-logout
      # URI. Turning ziti back on needs them back here.
      redirectUris:
        - "https://grafana.clonk.tv/login/generic_oauth"
      webOrigins:
        - "https://grafana.clonk.tv"
      attributes:
        backchannel.logout.session.required: "true"
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: "https://grafana.clonk.tv/*"
      defaultClientScopes: [web-origins, acr, roles, profile, basic, email]
      optionalClientScopes: [address, phone, offline_access, organization, microprofile-jwt]
      protocolMappers:
        - name: grafana-audience
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: grafana
            id.token.claim: "false"
            access.token.claim: "true"
        # Grafana's roleAttributePath reads realm_access.roles from USERINFO,
        # and the realm's shared 'roles' scope does not put realm_access in
        # userinfo, so this client carries its own mapper with userinfo ON.
        - name: realm-roles-userinfo
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_access.roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    # ClaimLayer demo, behind oauth2-proxy at claimlayer.clonk.tv. The live
    # clientId is claimlayer-demo (not "claimlayer"); keep it. Its secret is
    # gardenio/claimlayer-keycloak-client (key client-secret), copied by the
    # operator from the claimlayer-demo namespace. Nothing about how the client
    # behaves changes.
    - clientId: claimlayer-demo
      name: "ClaimLayer demo"
      public: false
      standardFlowEnabled: true
      directAccess: false
      secret: "$claimlayer-keycloak-client:client-secret"
      webUrl: "https://claimlayer.clonk.tv"
      redirectUris:
        - "https://claimlayer.clonk.tv/oauth2/callback"
      webOrigins:
        - "https://claimlayer.clonk.tv"
      attributes:
        backchannel.logout.session.required: "true"
        pkce.code.challenge.method: S256
        post.logout.redirect.uris: "https://claimlayer.clonk.tv/"
      defaultClientScopes: [web-origins, acr, roles, profile, basic, email]
      optionalClientScopes: [address, phone, offline_access, organization, microprofile-jwt]
      protocolMappers:
        - name: claimlayer-demo-audience
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: claimlayer-demo
            id.token.claim: "false"
            access.token.claim: "true"

    # Slack account linking (gd-OZJ6H2S3xx, decision gd-uPHB7YcHuI, option A).
    # A person links their Slack account ONCE by signing in here from the
    # "Link your gardenio account" button; slack-bridge keeps the offline
    # refresh token (encrypted, bridge-only key) and acts for that person with
    # their OWN access token per write. No service account: the bridge never
    # holds a credential of its own on this client. offline_access is OPTIONAL
    # (requested by the link flow only); PKCE S256 is enforced on top of the
    # client secret; access tokens live 5 minutes. kbeads caps this client's
    # tokens at gardenio-operator (beads.clientRoleCeiling); they cannot
    # approve escalations (only the page session does, gd-4mEAhIE01U).
    # The OPERATOR creates Secret gardenio-slack-link (key clientSecret) and
    # gardenio-slack-link-key (key key, `openssl rand -base64 32`).
    - clientId: gardenio-slack-link
      name: "Gardenio Slack account link"
      public: false
      standardFlowEnabled: true
      directAccess: false
      secret: "$gardenio-slack-link:clientSecret"
      redirectUris:
        - "https://gardenio.clonk.tv/slack/link/callback"
      webOrigins:
        - "https://gardenio.clonk.tv"
      attributes:
        access.token.lifespan: "300"
        pkce.code.challenge.method: "S256"
      optionalClientScopes:
        - offline_access
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "false"
            access.token.claim: "true"
            userinfo.token.claim: "false"
        - name: audience-self
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: gardenio-traefik-forwardauth
            id.token.claim: "false"
            access.token.claim: "true"

    # Machine principals (gd-s7aPIf0Bgp, design
    # gardenio/docs/machine-principal-design.md). Confidential clients whose
    # SERVICE ACCOUNT a platform component authenticates as (client-credentials
    # grant against the in-cluster token endpoint, never the public edge). No
    # browser flow, no device grant, no password grant: the only way to get a
    # token is the client secret, which lives in a Secret the operator creates
    # by hand (gardenio-machine-<clientId>, key clientSecret — see the task's
    # OPERATOR steps) and the EDP operator imports via the "$<secret>:<key>"
    # reference. Tokens carry aud = keycloak.oidcAudience (audience-self) and
    # the service account's realm roles (realm-roles, multivalued) so kbeads
    # classifies the caller as machine:<clientId> and admits exactly the
    # writes its gardenio-machine-* roles grant. Each client listed here MUST
    # also be in beads.machineClients below (rollout order, PR #290 review).
    - clientId: gardenio-controller
      name: "Gardenio controller (machine principal)"
      public: false
      standardFlowEnabled: false
      directAccess: false
      secret: "$gardenio-machine-gardenio-controller:clientSecret"
      attributes:
        # Half-life refresh in the controller => a fetch every ~15 min.
        access.token.lifespan: "1800"
      serviceAccount:
        enabled: true
        realmRoles:
          - gardenio-operator
          - gardenio-machine-accounts
          - gardenio-machine-token-mint
          - gardenio-machine-controller-ownership
          - gardenio-machine-controller-config-seed
          # The Lands provisioner (internal/lands/provision, step 8.6):
          # inert until LANDS_PROVISION_ENABLED.
          - gardenio-machine-lands-provisioner
          # The release reconciler (cmd/controller/release_reconciler.go,
          # plan gd-UZKZ9H25UD step 4): records the observed deployment when
          # what runs on prod differs from the newest one.
          - gardenio-machine-release-deploy
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "false"
            access.token.claim: "true"
            userinfo.token.claim: "false"
        - name: audience-self
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: gardenio-traefik-forwardauth
            id.token.claim: "false"
            access.token.claim: "true"
    # coopmux (gd-Wcu0DOkHfN, inventory item 8): its one account-bead write —
    # status=exhausted + cooldown_until on the throttled account during a
    # failover (coop/crates/mux/src/credential/failover.rs) — needs only
    # gardenio-machine-accounts. No token minting, so no token-mint role.
    # Consumed by coopmux.machinePrincipal below; Secret

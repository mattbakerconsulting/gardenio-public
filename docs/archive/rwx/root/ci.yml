      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x gardenio/tests/e2e/scripts/test-skip-visibility-lint.sh
      bash gardenio/tests/e2e/scripts/test-skip-visibility-lint.sh
    outputs:
      filesystem: false

  # ── freeze→thaw rung-classifier GATE (Rig R1, ka-0000005639) ─────────
  # Hermetic, cluster-free GATE for the freeze→thaw assertion-ladder classifier
  # (scripts/gvisor/freeze-thaw-rungs.sh). The classifier maps the FT_* sentinel
  # stream the freeze+thaw node scripts emit into 7 named rungs with stable
  # FT_RUNG_* markers + FT_FIRST_FAILED_RUNG ("first failing rung = classified
  # mode"), consumed by R2 (forensic capture) and R3 (auto-file bug). Drives the
  # classifier with synthetic sentinel streams — the load-bearing case is the
  # FT_ROOT_RC overload: a lo-only netns re-emits FT_ROOT_RC=128 after a
  # successful barrier, so rung 2 keys on FT_RESTORED_PID (not FT_ROOT_RC) to
  # classify it as a netns (rung 3), not restore (rung 2), fault. Plus shellcheck
  # -x on both files. No daemon, node, kd/gb, or network — gates every MR/main push.
  - key: test-gvisor-freeze-thaw-rungs
    use: code
    filter:
      - "scripts/gvisor/freeze-thaw-rungs.sh"
      - "scripts/gvisor/freeze-thaw-rungs_test.sh"
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/gvisor/freeze-thaw-rungs.sh \
                    scripts/gvisor/freeze-thaw-rungs_test.sh
      bash scripts/gvisor/freeze-thaw-rungs_test.sh
    outputs:
      filesystem: false

  # ── sentry-egress verdict-ladder GATE (bug ka-0000000514 / task ka-0000008207) ──
  # Hermetic, cluster-free GATE for the zero-canary on-node SENTRY-EGRESS check
  # (scripts/gvisor/sentry-egress-check.sh) that proves a restored gVisor SENTRY
  # netstack is routable + can egress BEFORE the scarce canary is re-driven. The LIVE
  # half — the count-gated barrier restore + the in-sentry runsc-exec probe — needs a
  # privileged prod gVisor node and CANNOT run in CI; it stays an operator on-node run.
  # What CI CAN gate, and does here with real non-zero-exit teeth, is the script's PURE
  # core: the routable=>PASS / link-only=>FAIL / network-unreachable-dial=>FAIL /
  # flaked-exec=>INCONCLUSIVE verdict ladder (seg_verdict) + the per-dial errno
  # classifier (seg_dial_verdict) — the OFFLINE mirror of the controller thaw [6c]
  # in-sentry egress assertion (freezethaw_node.go). A refactor that silently
  # re-breaks the link-only classification or the refused/timeout-vs-network-unreachable
  # discrimination fails HERE on every MR/main push, not days later on a burned canary.
  - key: test-gvisor-sentry-egress
    use: code
    filter:
      - "scripts/gvisor/sentry-egress-check.sh"
      - "scripts/gvisor/sentry-egress-check_test.sh"
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/gvisor/sentry-egress-check.sh \
                    scripts/gvisor/sentry-egress-check_test.sh
      bash scripts/gvisor/sentry-egress-check_test.sh
    outputs:
      filesystem: false

  # ── discriminating-restore verdict-ladder GATE (ka-0000002792 / ka-0000000357) ─
  # Hermetic, cluster-free GATE for the zero-canary on-node discriminating restore
  # check (scripts/gvisor/discriminating-restore-check.sh). The LIVE half — the
  # count-gated barrier `runsc restore` of a persisted dir-medium freeze bundle —
  # needs a privileged prod gVisor node and CANNOT run in CI; it stays an operator
  # on-node run (discriminating-restore-check.md "What CI covers vs. on-node"). What
  # CI CAN gate, and does here with REAL non-zero-exit teeth (no silent skip), is the
  # script's PURE core: the PRE-FIX=FAIL / skeleton-only=HOLLOW / skeleton+stacking
  # =PASS verdict ladder (drc_verdict) and the DEFECT-A `.overlay-opts` parser
  # (build_lowers), exercised by discriminating-restore-check_test.sh with synthetic
  # measurements (no runsc/mount/kubectl/node/network). A refactor that silently
  # re-breaks the classification, the parser, or the PASS-only-exit-0 contract fails
  # HERE on every MR/main push — not five days later on a burned canary. Plus:
  #   - shellcheck -x on the script + its test (the script newly passes clean — a
  #     prior SC2154 false-positive on the cleanup trap had kept it out of any gate);
  #   - a drift check that re-runs gen-drc-job.sh and `git diff --exit-code`, so the
  #     embedded one-apply Job manifest (discriminating-check-job.yaml) can never
  #     silently diverge from its source-of-truth script.
  - key: test-gvisor-discriminating-restore
    use: code
    filter:
      - "scripts/gvisor/discriminating-restore-check.sh"
      - "scripts/gvisor/discriminating-restore-check_test.sh"
      - "scripts/gvisor/gen-drc-job.sh"
      - "gardenio/poc/gvisor-runsc-cr/discriminating-check-job.yaml"
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/gvisor/discriminating-restore-check.sh \
                    scripts/gvisor/discriminating-restore-check_test.sh \
                    scripts/gvisor/gen-drc-job.sh
      bash scripts/gvisor/discriminating-restore-check_test.sh
      # Drift gate: the embedded Job manifest is GENERATED from the script — regenerate
      # and fail (non-zero exit) if the committed copy is stale. Done with a copy-first
      # `diff` (not `git diff`) so it stays fully hermetic: `use: code` + `filter:` only
      # stages the four listed files, so we must NOT assume a full git working tree.
      JOB=gardenio/poc/gvisor-runsc-cr/discriminating-check-job.yaml
      cp "$JOB" /tmp/drc-job-committed.yaml
      scripts/gvisor/gen-drc-job.sh
      diff -u /tmp/drc-job-committed.yaml "$JOB" \
        || { echo "ERROR: $JOB is stale — run scripts/gvisor/gen-drc-job.sh and commit both." >&2; exit 1; }
    outputs:
      filesystem: false

  # ── beads-viewer e2e: npm deps + browsers (cached by lockfile) ──────
  # Both npm deps AND the Playwright browser binaries are installed in THIS
  # single task, on purpose (ka-0000002325).
  #
  # ROOT CAUSE of the all-234-specs failure this replaces: a separate
  # browsers task ran `npx playwright install` under a narrow
  # `filter: [package-lock.json]`. That filter stripped the deps layer's
  # node_modules from the task, so `npx` could not see the pinned local
  # Playwright and bootstrapped a FRESH, UNPINNED copy into the HOME npx
  # cache — installing browsers into ~/.npm/_npx/*/…/.local-browsers (and
  # by default ~/.cache/ms-playwright). RWX only carries a task's WORKSPACE
  # tree + declared outputs across the `use:` seam; those HOME-dir files are
  # never captured, so the downstream test task inherited node_modules but
  # NOT the browsers and every spec died at `browserType.launch: Executable
  # doesn't exist at ~/.cache/ms-playwright/...`.
  #
  # Installing browsers in the SAME task that runs `npm ci` guarantees the
  # pinned local Playwright (node_modules/.bin/playwright) is present, and
  # PLAYWRIGHT_BROWSERS_PATH=0 places the binaries INSIDE
  # node_modules/playwright-core/.local-browsers — the very node_modules the
  # deps layer carries forward, matched by the downstream
  # `gardenio/tests/beads-viewer-e2e/**` filter. The test task sets the SAME
  # env so Playwright resolves them at launch time.
  #
  # `--with-deps` is intentionally NOT used: it apt-installs the browser
  # SYSTEM libraries (libnss3, libgbm, …) into /usr, which likewise does not
  # cross the `use:` seam into the filtered test container. Those libs are
  # installed in the test task itself. This task only downloads the
  # (transferable) binaries. Firefox is scoped at the playwright.config.js
  # level to only run the constellation popover spec — the one place native
  # SVG <title> tooltip behavior is browser-dependent (ka-0000006763 polish,
  # design doc docs/design/beads-viewer/constellation-popover.md §Risks).
  - key: beads-viewer-e2e-deps
    use: [code, node]
    filter:
      - gardenio/tests/beads-viewer-e2e/package.json
      - gardenio/tests/beads-viewer-e2e/package-lock.json
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
    run: |
      set -euo pipefail
      cd gardenio/tests/beads-viewer-e2e
      npm ci --no-audit --no-fund
      # Use the pinned local binary explicitly (never `npx`, which would
      # bootstrap an unpinned copy into the HOME npx cache — the original
      # bug). PLAYWRIGHT_BROWSERS_PATH=0 installs into
      # node_modules/playwright-core/.local-browsers.
      node_modules/.bin/playwright install chromium firefox
      # Fail LOUD at install time if the pinned headless-shell binary did
      # not materialize where the runtime will look — beats every spec
      # dying silently at browserType.launch in the downstream task.
      shell="$(find node_modules/playwright-core/.local-browsers \
        -name chrome-headless-shell -type f 2>/dev/null | head -1 || true)"
      if [ -z "$shell" ] || [ ! -x "$shell" ]; then
        echo "FATAL: playwright install did not place an executable" >&2
        echo "  chrome-headless-shell under" >&2
        echo "  node_modules/playwright-core/.local-browsers — listing:" >&2
        ls -la node_modules/playwright-core/.local-browsers 2>&1 >&2 || true
        exit 1
      fi
      echo "OK: chrome-headless-shell at $shell"

  # ── beads-viewer e2e: behavioral Playwright suite ────────────────────
  # Phase 8 of epic ka-0000004611 (T18, ka-0000002677). Runs the suite at
  # gardenio/tests/beads-viewer-e2e against a hermetic stack:
  #   apt postgresql-16 + pgvector → kd serve (daemon) → beads-viewer
  #   (auto-boot by Playwright `webServer:`).
  # RWX runners have no Docker daemon, so postgres is installed via apt
  # (noble ships postgresql-16 + postgresql-16-pgvector by default).
  # Cache hits (task skipped) when nothing under the viewer source, the test
  # dir, or this CI yaml changed — so most MRs incur zero wall time.
  - key: test-beads-viewer-e2e
    use: [gardenio-deps, kbeads-deps, beads-viewer-e2e-deps]
    timeout: 10m
    # `filter:` restricts the filesystem RWX presents to the task — not
    # just cache invalidation. Files not listed here are absent on disk
    # even when an upstream `use:` task fetched them. The viewer build
    # below uses Go workspace mode, so go.work / go.work.sum AND every
    # module referenced by go.work must be present — at minimum the
    # module's go.mod (Go's workspace loader stat()s each `use` dir's
    # go.mod even if the build only touches one of them). Missing any
    # of these gives either `reading go.work: no such file or directory`
    # or `cannot load module … listed in go.work file` (ka-0000000500).
    filter:
      - "gardenio/controller/cmd/beads-viewer/**"
      - "gardenio/controller/internal/**"
      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
      - "gardenio/tests/beads-viewer-e2e/**"
      - "kbeads/**"
      # go.work lists ./gardenio/clicreds, and the kd CLI built/seeded here
      # imports it (replace => ../gardenio/clicreds). The workspace loader
      # stat()s its go.mod and the build needs its source, else `go build`
      # FATALs "replacement directory ../gardenio/clicreds does not exist"
      # (ka-0000003839).
      - "gardenio/clicreds/**"
      - scripts/build-dictation-corpus/go.mod
      - scripts/wer-eval/go.mod
      - go.work
      - go.work.sum
      - .rwx/ci.yml
    run: |
      set -euo pipefail

      # 1. Postgres + pgvector via apt. The kbeads daemon's migrate
      # preflight refuses to start without the `vector` extension — see
      # kbeads/internal/store/postgres/migrate_preflight.go.
      #
      # Also install the Playwright browser SYSTEM libraries here. The
      # beads-viewer-e2e-deps task downloads the browser BINARIES into the
      # workspace node_modules (PLAYWRIGHT_BROWSERS_PATH=0) so they cross the
      # RWX `use:` seam, but the browser system libs (libnss3/libgbm/…) land
      # in /usr, which does NOT cross into this filtered task. `playwright
      # install-deps` apt-installs exactly the set the pinned browsers need;
      # without it chrome-headless-shell fails to launch on a missing shared
      # library even though the binary is present (ka-0000002325).
      sudo apt-get update -qq
      sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
        postgresql-16 postgresql-16-pgvector >/dev/null
      # `install-deps` self-escalates via sudo internally. Invoke the pinned
      # local binary (carried across in node_modules) directly — NOT `npx`,
      # which can bootstrap an unpinned copy. This apt-installs the browser
      # system libs into /usr for THIS container.
      ( cd gardenio/tests/beads-viewer-e2e \
        && DEBIAN_FRONTEND=noninteractive \
           node_modules/.bin/playwright install-deps chromium firefox )
      sudo pg_ctlcluster 16 main start
      for i in $(seq 1 30); do
        if sudo -u postgres pg_isready -q; then break; fi
        sleep 1
      done
      sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL' >/dev/null
      CREATE USER beads WITH SUPERUSER PASSWORD 'beads';
      CREATE DATABASE beads OWNER beads;
      \connect beads
      CREATE EXTENSION IF NOT EXISTS vector;
      SQL

      # 2. Build kd, install on PATH (seed.mjs shells out to `kd`).
      (cd kbeads && GOWORK=off CGO_ENABLED=0 go build -o /tmp/kd ./cmd/kd/)
      sudo install /tmp/kd /usr/local/bin/kd

      # 3. Start kd serve in the background. Auth ENABLED with a static
      # primary token (ka-0000006262): the daemon derives comment.Author from
      # the auth identity, honoring the X-Actor override ONLY for
      # primary-static-token callers (kbeads interceptors.go). With auth off
      # (the pre-2026-08 default) every viewer-driven write stored Author=""
      # so comment_write.spec.js could not assert the human author. The same
      # token doubles as the bearer the seed's `kd` sends (defaultToken reads
      # BEADS_AUTH_TOKEN) and, exported below, the viewer's BEADS_DAEMON_TOKEN
      # — so all three authenticate as the SAME primary static identity. It is
      # a throwaway hermetic-CI value, not a real credential.
      #
      # Rate limit off so the seed's 50+ rapid kd calls don't get 429'd
      # (static-token callers are limiter-exempt anyway, but keep it explicit).
      export BEADS_AUTH_TOKEN="e2e-primary-static-token"
      export BEADS_DATABASE_URL="postgres://beads:beads@localhost:5432/beads?sslmode=disable"
      export BEADS_HTTP_ADDR=":8080"
      export BEADS_GRPC_ADDR=":9090"
      export BEADS_METRICS_ADDR=":9091"
      export BEADS_RATE_LIMIT_ENABLED=false
      # Defensive: kd serve fails-closed if BEADS_NATS_URL points at an
      # unreachable NATS (see kbeads/cmd/kd/serve.go). Empty = no events.
      unset BEADS_NATS_URL || true
      kd serve > /tmp/kd-serve.log 2>&1 &
      KD_PID=$!
      # On exit (success or failure), surface the daemon log so 5xx root
      # causes are visible from the RWX run page. writeServerError sanitizes
      # response bodies, so the wrapped "http 5xx root cause" WARN slog line
      # only lives in /tmp/kd-serve.log — copy it into the artifact dir too.
      trap '
        echo "=== kd-serve.log ===";
        cat /tmp/kd-serve.log 2>/dev/null || true;
        mkdir -p gardenio/tests/beads-viewer-e2e/test-results;
        cp -f /tmp/kd-serve.log gardenio/tests/beads-viewer-e2e/test-results/kd-serve.log 2>/dev/null || true;
        kill "$KD_PID" 2>/dev/null || true;
        sudo pg_ctlcluster 16 main stop --mode=immediate >/dev/null 2>&1 || true
      ' EXIT
      # Poll the daemon's real, auth-EXEMPT liveness endpoint. The daemon has
      # no /healthz route (it 404s, or 401s once auth is on), so the old poll
      # never returned 200 — it silently ran the full 60 iterations every run.
      # /v1/health/live is the cheap process-liveness probe (ka-0000001764) and
      # is exempt from the auth middleware, so it returns 200 as soon as the
      # daemon is up regardless of BEADS_AUTH_TOKEN.
      for i in $(seq 1 60); do
        if curl -sf http://localhost:8080/v1/health/live >/dev/null 2>&1; then
          break
        fi
        if ! kill -0 "$KD_PID" 2>/dev/null; then
          echo "kd serve exited early; log:"
          cat /tmp/kd-serve.log
          exit 1
        fi
        sleep 1
      done

      # 4. Pre-build beads-viewer with workspace mode active, then point
      # the Playwright webServer at the resulting binary via
      # BEADS_VIEWER_BIN. Earlier we relied on `go run ./...` from the
      # webServer block with a pinned GOWORK env, but the GOWORK pin
      # was not surviving the playwright.spawn boundary in CI (workspace
      # mode failing to find go.work at runtime). Building up-front is
      # cheaper too — webServer boot drops from cold-compile to exec.
      if [ ! -f go.work ]; then
        echo "FATAL: go.work missing from $(pwd); listing:" >&2
        ls -la >&2
        exit 1
      fi
      GOWORK="$(pwd)/go.work" CGO_ENABLED=0 \
        go build -o /tmp/beads-viewer ./gardenio/controller/cmd/beads-viewer
      export BEADS_VIEWER_BIN=/tmp/beads-viewer

      # 5. Run the suite. The Playwright config's webServer block auto-boots
      # the prebuilt binary (or falls back to `go run` if BEADS_VIEWER_BIN
      # is unset, e.g. local dev), and globalSetup.mjs seeds the canonical
      # fixtures via the kd CLI.
      cd gardenio/tests/beads-viewer-e2e
      # CLI uses BEADS_HTTP_ADDR as a URL; the daemon used it as a listen
      # spec above. Override here for the seed + tests.
      export BEADS_HTTP_ADDR=http://localhost:8080
      # The viewer authenticates to the daemon with BEADS_DAEMON_TOKEN. Point
      # it at the SAME primary static token the daemon loaded as
      # BEADS_AUTH_TOKEN (exported in step 3) so viewer→daemon writes present
      # the primary-static identity — the only auth branch on which the daemon
      # honors the X-Actor override the viewer stamps for comment authorship
      # (ka-0000006262). Playwright's webServer merges process.env under its
      # own env block, so this export reaches the viewer subprocess the same
      # way BEADS_VIEWER_BIN does.
      export BEADS_DAEMON_TOKEN="$BEADS_AUTH_TOKEN"
      # Stamp a human-shape operator on every kd CLI call so the seed's
      # writes pass the resolver's R3 sanitizer (ka-0000002601). The seed's
      # `kd` now authenticates with BEADS_AUTH_TOKEN (defaultToken reads it)
      # as the primary static token; that branch still honors X-Operated-By
      # for operator attribution, so this remains required — without it
      # seed.mjs's first kd create returns HTTP 400 "operator could not be
      # resolved".
      export BEADS_OPERATED_BY=oidc:e2e-fixture@example.com
      export CI=1
      # Resolve the browser binaries from node_modules, where the
      # beads-viewer-e2e-deps task installed them (matching that task's
      # PLAYWRIGHT_BROWSERS_PATH=0). The default ~/.cache/ms-playwright is
      # outside the workspace and does NOT survive the RWX output-layer
      # seam, so without this every spec dies at browserType.launch
      # "Executable doesn't exist" (ka-0000002325).
      export PLAYWRIGHT_BROWSERS_PATH=0
      npm test
    outputs:
      filesystem: false
      artifacts:
        # On failure, the Playwright HTML report + per-test traces / screenshots
        # land here for download from the RWX run page.
        - key: beads-viewer-e2e-report
          path: gardenio/tests/beads-viewer-e2e/test-results/

  # ── Helm lint ────────────────────────────────────────────────────────
  - key: lint-helm
    use: code
    filter:
      - "gardenio/helm/**"
    run: |
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      helm lint gardenio/helm/gardenio/
    outputs:
      filesystem: false

  # ── Helm chart render tests (ka-0000002330) ──────────────────────────
  # The Go test package gardenio/helm/tests (dir gardenio/helm/gardenio/tests)
  # renders the chart with `helm template ... --set ...` and asserts on the
  # emitted manifests. It is NOT in go.work and — before this task — was run
  # by NO CI job (lint-helm only `helm lint`s). So chart-template drift landed
  # on main silently: two regressions (ka-0000002553 stale prod-overlay refs,
  # ka-0000003495 an env-dependent release-namespace assertion) were only caught
  # by an agent running the suite by hand. This task closes that gap — every MR
  # and main push now renders the chart and runs the full assertion suite.
  #
  # Hermeticity (ka-0000003495 note): the suite is self-contained — every
  # namespace-sensitive test pins --namespace via the helmTemplateNS helper
  # (MR !5721), so it passes with NO ambient kube context (verified: green with
  # HELM_NAMESPACE/KUBECONFIG unset). We do NOT export HELM_NAMESPACE here; the
  # RWX runner has no kube context and the tests must not depend on one.
  #
  # Tooling: `helm` renders; `yq`+`promtool` are additionally needed by the ONE
  # fsm-composite firing-proof test (TestFSMCompositeAlert_SyntheticOOMRestartFires),
  # which pipes `helm template | yq` into `promtool test rules`. That test
  # t.Skip()s when any of the three is absent — installing all three keeps the
  # firing proof running at full fidelity instead of silently skipping in CI.
  # Versions mirror the agent image (images/agent/install/versions.env HELM_VERSION,
  # YQ_VERSION) so CI and local agent runs render with the same helm.
  #
  # GOWORK=off: the package is a standalone module (its own go.mod, not in
  # go.work), matching how the other GOWORK=off test tasks build.
  #
  # Filter (RWX content-filter caveat): `filter:` restricts the filesystem RWX
  # presents to the task — files not listed are ABSENT on disk, not merely
  # cache-neutral. Several overlay tests layer external values files via
  # `helm template -f` that live OUTSIDE the chart dir: the root-level
  # deploy-values/*.yaml overlays (gardenio-inbox, gardenio-rwx, …) and the
  # phase32 day0-wiring values (slo-metrics/alertmanager/assistant-pane). Both
  # trees MUST be in the filter or those renders fail "open …: no such file or
  # directory" (a local `go test` passes because the whole worktree is present;
  # only the filtered CI task exposes the gap). deploy-values/*.yaml mirrors the
  # lint-deploy-values glob; the day0-wiring glob is scoped to that one dir.
  #
  # Same caveat, terraform edge (ka-0000002847): the EKS-API sensitive-verb
  # oracle (eks_api_intrusion_sensitive_verb_test.go, ka-0000002508) os.ReadFiles
  # the LIVE prod metric-filter pattern + tfvars from
  # gardenio/terraform/composition/canonical-prod/{eks_audit_metric_filters.tf,
  # prod-real.tfvars} so the proof can never drift from the deployed filter. That
  # tree MUST be in the filter or the test t.Fatalf's "read terraform: … no such
  # file or directory" — the fleet-wide CI regression that made this task exist.
  # Scoping to canonical-prod/** is also the correct lockstep contract: a change
  # to that terraform SHOULD re-run the helm oracle that mirrors it.
  - key: test-helm
    use: [code, go]
    timeout: 15m
    filter:
      - "gardenio/helm/**"
      - "deploy-values/*.yaml"
      - "gardenio/scripts/phase32-load-harness/day0-wiring/*.yaml"
      - "gardenio/terraform/composition/canonical-prod/**"
    run: |
      set -euo pipefail
      ARCH=amd64
      HELM_VERSION=3.20.2
      YQ_VERSION=4.53.2
      PROMETHEUS_VERSION=3.1.0
      BINDIR="$PWD/.ci-bin"
      mkdir -p "$BINDIR"
      # helm — pinned binary tarball (same source as the agent image)
      curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${ARCH}.tar.gz" \
        | tar -xz --strip-components=1 -C "$BINDIR" "linux-${ARCH}/helm"
      # yq — pinned (mikefarah); used by the fsm firing-proof test
      curl -fsSL -o "$BINDIR/yq" \
        "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_${ARCH}"
      # promtool — pinned prometheus release; used by the fsm firing-proof test
      curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-${ARCH}.tar.gz" \
        | tar -xz --strip-components=1 -C "$BINDIR" "prometheus-${PROMETHEUS_VERSION}.linux-${ARCH}/promtool"
      chmod +x "$BINDIR"/*
      export PATH="$BINDIR:$PATH"
      helm version --short
      yq --version
      promtool --version
      cd gardenio/helm/gardenio/tests
      GOWORK=off go test -count=1 .
    outputs:
      filesystem: false

  # ── Duplicate-YAML-key guard for deploy overlays (ka-0000007430) ──────
  # A duplicate mapping key silently last-key-wins in every YAML parser
  # (helm/yq/PyYAML), so a bad "keep both" merge resolution can neutralize a
  # security control without any tool complaining — this nearly defeated the
  # C7 grafana-llm-app toolset allow-list (a CA key collision). yamllint's
  # key-duplicates rule is the only available detector that fails LOUDLY
  # (mikefarah yq does NOT — it last-key-wins). shellcheck the guard + its
  # self-test, then run both. ubuntu:24.04 → install shellcheck + yamllint via
  # apt (mirrors the test-no-agent-frontier-secret shellcheck task above; the
  # RWX runner has no `pip` on PATH, so a bare `pip install` exits 127).
  - key: lint-deploy-values
    use: code
    filter:
      - "deploy-values/*.yaml"
      - "scripts/check-deploy-values-dup-keys.sh"
      - "scripts/check-deploy-values-dup-keys_test.sh"
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      command -v yamllint >/dev/null 2>&1 || python3 -m yamllint --version >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q yamllint; }
      shellcheck -x scripts/check-deploy-values-dup-keys.sh \
                    scripts/check-deploy-values-dup-keys_test.sh
      bash scripts/check-deploy-values-dup-keys_test.sh
      bash scripts/check-deploy-values-dup-keys.sh
    outputs:
      filesystem: false

  # ── OIDC realm self-consistency guard for deploy overlays (ka-0000007361) ──
  # Within one deploy-values overlay, every OIDC issuer that names a realm
  # (.../auth/realms/<name>) MUST name the realm that same overlay creates
  # (keycloak.realm.name). A consumer pointed at a realm the overlay does NOT
  # stand up deploys to a Keycloak 404 (Realm does not exist), CrashLoops the
  # auth pods, and fails the deploy BEFORE any e2e module runs — so no cluster
  # test can see it. This exact one-line mismatch broke release tag 2026.218.26
  # (ka-0000000829): the ephemeral-prod overlay created realm ${RELEASE_NAME}
  # but its beadsViewer/forwardAuth consumers hardcoded literal realm `gardenio`.
  # The guard renders the *.tmpl overlays with render-rwx-values.sh (so
  # ${RELEASE_NAME} is compared post-expansion) and reads consumer segments from
  # PARSED string leaves via yq (comments never false-positive). shellcheck the
  # guard + its self-test, then run both. yq is pinned via curl (same source as
  # test-helm; the RWX runner has no yq preinstalled); shellcheck via apt.
  - key: lint-deploy-values-realm-consistency
    use: code
    filter:
      - "deploy-values/*.yaml"
      - "deploy-values/*.yaml.tmpl"
      - "scripts/render-rwx-values.sh"
      - "scripts/check-deploy-values-realm-consistency.sh"
      - "scripts/check-deploy-values-realm-consistency_test.sh"
    run: |
      set -euo pipefail
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      if ! command -v yq >/dev/null 2>&1; then
        ARCH=amd64
        YQ_VERSION=4.53.2
        BINDIR="$PWD/.ci-bin"
        mkdir -p "$BINDIR"
        curl -fsSL -o "$BINDIR/yq" \
          "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_${ARCH}"
        chmod +x "$BINDIR/yq"
        export PATH="$BINDIR:$PATH"
      fi
      yq --version
      shellcheck -x scripts/check-deploy-values-realm-consistency.sh \
                    scripts/check-deploy-values-realm-consistency_test.sh
      bash scripts/check-deploy-values-realm-consistency_test.sh
      bash scripts/check-deploy-values-realm-consistency.sh
    outputs:
      filesystem: false

  # ── large-tracked-file guard (ka-0000000431) ─────────────────────────
  # Fails the build if any tracked blob exceeds the cold-start clone budget.
  # Machine-generated UI-audit media + a stray compiled binary ballooned the
  # shallow-clone tip tree to 1.5GB and crash-looped agent pods on slow-egress
  # clusters. `use: code` gives the task a full checkout so `git ls-files` sees
  # the whole tree; no `filter:` — a large file added ANYWHERE must red this.
  - key: lint-large-files
    use: code
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/check-large-tracked-files.sh \
                    scripts/check-large-tracked-files_test.sh
      bash scripts/check-large-tracked-files_test.sh
      bash scripts/check-large-tracked-files.sh
    outputs:
      filesystem: false

  # ── golangci-lint pin-drift guard (ka-0000000665) ────────────────────
  # The agent image pinned golangci-lint 1.64.8 while this file hard-coded a
  # v2.11.2 install and both .golangci.yml declare `version: "2"`. Across the
  # v1/v2 boundary the mismatch is not "slightly different linters": the v1
  # binary in the agent pod cannot LOAD a v2 config at all, so `make lint` was
  # unrunnable for agents and CI/Lint was the only place the Go lint gate ran.
  # `use: code` for a full checkout; no `filter:` — a drifted pin added
  # ANYWHERE must red this.
  - key: lint-golangci-pin
    use: code
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/check-golangci-pin.sh \
                    scripts/check-golangci-pin_test.sh
      bash scripts/check-golangci-pin_test.sh
      bash scripts/check-golangci-pin.sh
    outputs:
      filesystem: false

  # ── go.work module-coverage guard (ka-0000008045) ────────────────────
  # `gardenio/helm/gardenio/tests` is its own module and is absent from go.work,
  # so in workspace mode a repo-root `go test ./...` reports SUCCESS having
  # never compiled the chart/dashboard suite. An agent ran the controller suite
  # green, pushed, and CI came back red on `test-helm` with 6 failures. Two
  # other modules sit in the same blind spot, so the guard asserts that every
  # go.mod in the tree is either a go.work member or registered against a make
  # target under `make test-out-of-workspace`.
  # `use: code` for a full checkout; no `filter:` — a new module added ANYWHERE
  # must red this, which is the whole point.
  - key: lint-go-module-coverage
    use: code
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/check-go-module-coverage.sh \
                    scripts/check-go-module-coverage_test.sh
      bash scripts/check-go-module-coverage_test.sh
      bash scripts/check-go-module-coverage.sh
    outputs:
      filesystem: false

  # ── Claude Code currency guard — TEST ONLY (ka-0000007531) ───────────
  # Runs the HERMETIC unit suite (synthetic versions.env fixtures + injected
  # upstream, no network) and shellchecks both files.
  #
  # It deliberately does NOT run the live `check-claude-code-currency.sh` with a
  # real registry read. Upstream Claude Code ships several times a week, so a
  # live currency check as a BUILD gate would red every MR in the repo the day
  # after a release — a change to coop or kbeads is not wrong because npm moved.
  # Currency is a RELEASE-CADENCE concern, not a per-MR one: the release-owner
  # captain runs the live check every cycle (doc ka-0000000327 Step 2.5) and
  # files a bump task on drift. This task only pins that the checker itself
  # still works.
  - key: lint-claude-code-currency-guard
    use: code
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/check-claude-code-currency.sh \
                    scripts/check-claude-code-currency_test.sh
      bash scripts/check-claude-code-currency_test.sh
    outputs:
      filesystem: false

  # ── merge-conflict-marker guard (ka-0000001064) ──────────────────────
  # Fails the build if any tracked file carries an unresolved Git conflict
  # marker (<<<<<<< / >>>>>>>). A botched resolution landed the marker triad
  # inside a *comment* in deploy-values/gardenio-rwx-ephemeral-{prod,poc}
  # overlays (be105c652) — invisible in review, but at tag-cut time helm parses
  # the rendered overlay and the marker lines are invalid YAML, hard-failing
  # deploy-ephemeral and skip-cascading e2e on every tag after it landed
  # (.29/.30/.31). The realm-consistency guard could not catch it: yq cannot
  # parse a marker-corrupted file, so it silently SKIPed the overlay. `use:
  # code` gives a full checkout so `git ls-files` sees the whole tree; no
  # `filter:` — a marker added ANYWHERE must red this.
  - key: lint-merge-conflict-markers
    use: code
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/check-merge-conflict-markers.sh \
                    scripts/check-merge-conflict-markers_test.sh
      bash scripts/check-merge-conflict-markers_test.sh
      bash scripts/check-merge-conflict-markers.sh
    outputs:
      filesystem: false

  # ── Preflight target-list derivation guard (ka-0000004412) ───────────
  # `make preflight` and the release-preflight gate in scripts/release.sh no
  # longer carry a target list: scripts/preflight-targets.sh DERIVES it from the
  # `CI / Build` + `CI / Lint` + `CI / Test` status checks defined at the top of
  # THIS file. Both used to hand-enumerate the same 11 tasks while those checks
  # bundle 51 — the two agreed with each other, so the Makefile's "mirrors
  # release.sh" comment read as true while BOTH under-approximated CI by 40
  # tasks. A chart-only MR (!8093, 11 dashboard JSON files) therefore passed the
  # documented pre-push gate and reddened `CI / Test` in `test-helm`.
  #
  # shellcheck the generator + its suite, then run the suite. Its real-repo cases
  # read the LIVE .rwx/ci.yml, Makefile and scripts/release.sh, so this task reds
  # on: a parser change that silently narrows the derived set, a status check
  # naming a task that does not exist, github/gitlab required-check drift, or a
  # literal `--target test-…` list creeping back into either consumer. `use:
  # code` for a full checkout; no `filter:` — it reads files any MR may touch.
  - key: lint-preflight-targets
    use: code
    run: |
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/preflight-targets.sh \
                    scripts/preflight-targets_test.sh
      bash scripts/preflight-targets_test.sh
    outputs:
      filesystem: false

  # ── gitleaks binary (cached — rebuilt only when the pin changes) ─────
  # The version is now pinned in .rwx/security-tools.lock (the single source of
  # truth for every security-scanner version — ka-0000007861), extracted from
  # the previously inline `VERSION=8.21.2` here. `gb mr security-gate` parses the
  # same lock, so the Security-Scan: MR block's recorded gitleaks version and
  # this installed binary can never silently diverge.
  - key: gitleaks-bin
    use: [code]
    filter:
      - .rwx/security-tools.lock
    run: |
      set -euo pipefail
      # shellcheck disable=SC1091
      . .rwx/security-tools.lock
      curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
        | sudo tar -xz -C /usr/local/bin gitleaks
      sudo chmod +x /usr/local/bin/gitleaks
      gitleaks version

  # ── gitleaks (scan full history for leaked secrets) ──────────────────
  # code-git (preserved .git, FULL non-shallow fetch) is REQUIRED — NOT the
  # shallow, .git-less `code` clone. `gitleaks detect` (no --no-git) walks git
  # history and needs every blob; on a checkout where that walk cannot complete
  # gitleaks prints an error line and STILL EXITS 0 ("no leaks found"), so the
  # secret gate green-washed every MR while proving nothing about history
  # (ka-0000001621). The `code` clone does `rm -rf .git`, which is precisely
  # that silent no-op: gitleaks emitted `failed to scan Git repository` and
  # exited 0. Same missing-.git root cause as coverage-patch / osv-scan /
  # internal-strings-audit, all fixed by switching to code-git (ka-0000002355).
  # The wrapper below makes coverage LOAD-BEARING: it refuses a shallow/absent
  # .git, trips on gitleaks' git-walk-error line regardless of exit code, and
  # asserts the reported scanned-commit count against a floor of the non-merge
  # reachable-commit count — a partial-coverage run can never read as a pass.
  #
  # ROLLOUT (advisory→enforce, ka-0000001621): the wrapper exits 2 on a COVERAGE
  # failure and 1 on a gitleaks FINDING. Coverage is HARD-enforced from day one
  # (exit 2 reds the job) — that is the actual bug this bead fixes. Findings are
  # ADVISORY for the initial rollout: fixing the silent no-op turned the gate
  # real for the first time and it immediately surfaced ~89 PRE-EXISTING history
  # findings (mostly *_test.sh secret-pattern fixtures + already-escalated live
  # creds). Reddening every MR on debt this MR did not introduce is the wrong
  # move — mirrors the go-vuln/osv-scan/cargo advisory ramp. The findings'
  # disposition (allowlist fixtures / rotate live / squash) is owned by the
  # parent OSS-sanitization epic ka-0000007393; enforcement flips on (drop the
  # `[ "$rc" = 1 ] && exit 0`) once that debt is triaged.
  - key: gitleaks
    use: [code-git, gitleaks-bin]
    run: |
      # set +e: reach the advisory handling even when the wrapper returns non-
      # zero (RWX runs the block under errexit; ka-0000004694).
      set +e
      bash scripts/security/gitleaks-history.sh
      rc=$?
      if [ "$rc" = "2" ]; then
        echo "[gitleaks] COVERAGE FAILURE (rc=2) — history was not provably scanned. Hard-failing (ka-0000001621)." >&2
        exit 1
      fi
      if [ "$rc" = "1" ]; then
        echo "[gitleaks] ⚠ ADVISORY: gitleaks found secret(s) in history (would BLOCK once enforced). Pre-existing debt triaged under epic ka-0000007393."
        exit 0
      fi
      echo "[gitleaks] clean — history provably scanned, no leaks."
      exit "$rc"
    outputs:
      filesystem: false

  # ── govulncheck binary (cached — pinned in security-tools.lock) ──────
  - key: govulncheck-bin
    use: [code, go]
    filter:
      - .rwx/security-tools.lock
    run: |
      set -euo pipefail
      # shellcheck disable=SC1091
      . .rwx/security-tools.lock
      # Installs to $(go env GOPATH)/bin, which golang/install already adds to
      # PATH (same pattern as the gotestsum/gcov2lcov tasks). GOWORK=off so the
      # repo go.work does not force workspace mode during the install build.
      GOWORK=off go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
      govulncheck -version

  # ── CI / Go-Vuln: govulncheck reachability-diff (ka-0000007861) ──────
  # Runs `govulncheck -json ./...` on gardenio/controller + kbeads at HEAD and at
  # the upstream-main merge-base, and computes the DIFF: a critical/high vuln
  # that is REACHABLE (a call-graph path to the vulnerable symbol) on HEAD and
  # was NOT reachable at the baseline. Reachability, not the raw advisory count,
  # is the signal — the 2026-04-19 controller-go audit found 1 of 118 vulns
  # reachable, so a count gate would be pure churn. Pure decision + hermetic unit
  # suite: scripts/security/govulncheck-diff.py(+_test.py). code-git (preserved
  # .git) is needed for the merge-base worktree scan.
  #
  # ADVISORY for the initial rollout (advisory→enforce, coverage-patch precedent,
  # bundle ka-0000005053 §2.3): the task REPORTS the reachability-diff verdict but
  # always exits 0, so a NEW reachable finding surfaces loudly in the log without
  # blocking the MR while the fleet soaks the gate. Enforcement (fail exit) flips
  # on via the operator-owned branch-protection toggle once soaked. The diff
  # exit-3 verdict is preserved in the log line + the Security-Scan block, and
  # `gb mr security-gate` enforces it for anyone who opts in.
  - key: go-vuln
    use: [code-git, go, govulncheck-bin]
    timeout: 25m
    # 16 GB runner (ka-0000006329): govulncheck's -json whole-program call-graph
    # analysis of gardenio/controller peaks at ~6.0 GB RSS (measured GOMAXPROCS=2,
    # cold cache). The default 8 GB runner reserves 2 GB for RWX internals →
    # only 6 GB usable, so the scan OOM-terminated the task container mid-scan
    # (RWX AbortedSubStatus: terminated) on EVERY MR — the log always died right
    # after "scanning HEAD: gardenio/controller", before the advisory `exit 0`
    # could run, reddening "CI / Go-Vuln" fleet-wide. Note this is an OOM of the
    # task, NOT the reachability gate firing (the task always exits 0). 16 GB
    # (14 GB usable) gives ~2.3× headroom over the measured peak.
    runner:
      cpus: 2
      memory: 16gb
    env:
      TARGET_BRANCH: ${{ init.target-branch }}
    run: |
      # set +e: RWX runs the block under errexit, which `set -uo pipefail` does
      # NOT clear — an advisory task MUST reach its `exit 0` even when the scan
      # returns non-zero (ka-0000004694). Without +e a non-zero scan aborts here.
      set +e -uo pipefail
      export PATH="$(go env GOPATH)/bin:$PATH"
      for mod in gardenio/controller kbeads; do
        echo "== CI / Go-Vuln: $mod =="
        GOWORK=off scripts/security/govulncheck-baseline.sh "$mod" "${TARGET_BRANCH:-}"
        rc=$?
        if [ "$rc" = "3" ]; then
          echo "[go-vuln] ⚠ ADVISORY: $mod has NEW reachable critical/high vs baseline (would BLOCK once enforced)"
        elif [ "$rc" != "0" ]; then
          echo "[go-vuln] $mod scan errored (rc=$rc) — non-gating (fail-open)"
        fi
      done
      echo "[go-vuln] advisory rollout — reporting only, not blocking (see task comment)."
      exit 0
    outputs:
      filesystem: false

  # ── osv-scanner binary (cached — pinned in security-tools.lock) ──────
  - key: osv-scanner-bin
    filter:
      - .rwx/security-tools.lock
    use: [code]
    run: |
      set -euo pipefail
      # shellcheck disable=SC1091
      . .rwx/security-tools.lock
      curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
        -o /tmp/osv-scanner
      sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
      osv-scanner --version

  # ── CI / OSV-Scan: bun.lock surfaces, NEW-vs-baseline (ka-0000007861) ─
  # OSV manifest/lockfile scan of the repo's bun.lock files (the JS/TS surface
  # govulncheck does not cover). Computes the DIFF: a vuln id present on HEAD not
  # present at the merge-base baseline. The repo's bun.lock files already carry
  # pre-existing advisories, so a raw-count gate would red every MR — NEW-vs-
  # baseline is the "did THIS MR make it worse" signal, mirroring Go-Vuln.
  # code-git (preserved .git) is REQUIRED for the merge-base worktree scan.
  # Pure decision + hermetic suite: scripts/security/osv-diff.py(+_test.py).
  # ADVISORY for the initial rollout (see the go-vuln task comment): osv-baseline
  # already exits 0 on a clean/no-new diff; here we also swallow the exit-3
  # NEW-vuln verdict into a loud log line so a finding surfaces without blocking
  # while the gate soaks. `gb mr security-gate` enforces it for opt-in callers.
  - key: osv-scan
    use: [code-git, osv-scanner-bin]
    timeout: 15m
    env:
      TARGET_BRANCH: ${{ init.target-branch }}
    run: |
      # set +e: reach `exit 0` even on a non-zero scan (RWX errexit; ka-0000004694).
      set +e -uo pipefail
      scripts/security/osv-baseline.sh "${TARGET_BRANCH:-}"
      rc=$?
      if [ "$rc" = "3" ]; then
        echo "[osv-scan] ⚠ ADVISORY: NEW OSV vulnerabilities vs baseline (would BLOCK once enforced)"
      elif [ "$rc" != "0" ]; then
        echo "[osv-scan] scan errored (rc=$rc) — non-gating (fail-open)"
      fi
      echo "[osv-scan] advisory rollout — reporting only, not blocking."
      exit 0
    outputs:
      filesystem: false

  # ── Rust security-scanner binaries (cached — pinned in the lock) ─────
  # cargo-audit + cargo-deny were coop CLI-only tasks (coop/.rwx/ci.yml: manual,
  # no MR trigger, no status check — so pre-existing findings were never surfaced
  # by an automated gate). Promoted here to named status checks CI / Cargo-Audit
  # + CI / Cargo-Deny (ka-0000007861), version-pinned in security-tools.lock.
  # `use: [code, rust]` — the `rust` toolchain task does NOT clone the repo, so
  # the lock file is only present when `code` is also composed in.
  - key: cargo-sec-bin
    use: [code, rust]
    filter:
      - .rwx/security-tools.lock
    run: |
      set -euo pipefail
      . "$HOME/.cargo/env"
      # shellcheck disable=SC1091
      . .rwx/security-tools.lock
      cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked
      cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked
      cargo audit --version
      cargo deny --version

  # ── CI / Cargo-Audit: RustSec advisory scan (ka-0000007861) ──────────
  # ADVISORY for the initial rollout (advisory→enforce, coverage-patch precedent):
  # coop's CI was manual-only, so these run against pre-existing debt for the
  # first time. Report findings loudly, exit 0 while the gate soaks. Enforcement
  # flips on via the operator-owned branch-protection toggle once triaged.
  - key: cargo-audit
    use: [coop-deps, cargo-sec-bin]
    run: |
      # set +e: reach `exit 0` even when cargo audit exits non-zero on a finding
      # (RWX errexit is NOT cleared by `set -uo pipefail`; ka-0000004694).
      set +e -uo pipefail
      . "$HOME/.cargo/env"
      cd coop && cargo audit
      rc=$?
      if [ "$rc" != "0" ]; then
        echo "[cargo-audit] ⚠ ADVISORY: findings above (rc=$rc; would BLOCK once enforced)"
      fi
      echo "[cargo-audit] advisory rollout — reporting only, not blocking."
      exit 0
    outputs:
      filesystem: false

  # ── CI / Cargo-Deny: license/bans/sources policy (ka-0000007861) ─────
  # ADVISORY for the initial rollout (see cargo-audit). coop's dep tree currently
  # carries a pre-existing `bans` violation (duplicate webpki-roots 0.26/1.0 via
  # async-nats), which this surfaces for the first time — reported, not blocking.
  - key: cargo-deny
    use: [coop-deps, cargo-sec-bin]
    run: |
      # set +e: reach `exit 0` even when cargo deny exits non-zero on a policy
      # violation (RWX errexit; ka-0000004694). The pre-existing webpki-roots dup
      # returns exit 2, which under inherited -e aborted before this exit 0.
      set +e -uo pipefail
      . "$HOME/.cargo/env"
      cd coop && cargo deny check licenses bans sources
      rc=$?
      if [ "$rc" != "0" ]; then
        echo "[cargo-deny] ⚠ ADVISORY: policy violation above (rc=$rc; would BLOCK once enforced)"
      fi
      echo "[cargo-deny] advisory rollout — reporting only, not blocking."
      exit 0
    outputs:
      filesystem: false

  # ── security scripts unit suites (hermetic, ka-0000007861) ───────────
  # The pure reachability-diff decision function + the Security-Scan: trailer
  # generator. Hermetic — python3 + bash + shellcheck only, no network/scanners.
  - key: test-security-scripts
    use: [code]
    filter:
      - "scripts/security/govulncheck-diff.py"
      - "scripts/security/govulncheck-diff_test.py"
      - "scripts/security/govulncheck-baseline.sh"
      - "scripts/security/osv-diff.py"
      - "scripts/security/osv-diff_test.py"
      - "scripts/security/osv-baseline.sh"
      - "scripts/security/security-scan-block.sh"
      - "scripts/security/security-scan-block_test.sh"
    run: |
      set -euo pipefail
      command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
      shellcheck -x scripts/security/govulncheck-baseline.sh \
                    scripts/security/osv-baseline.sh \
                    scripts/security/security-scan-block.sh \
                    scripts/security/security-scan-block_test.sh
      python3 scripts/security/govulncheck-diff_test.py
      python3 scripts/security/osv-diff_test.py
      bash scripts/security/security-scan-block_test.sh
    outputs:
      filesystem: false

  # ── CI / Security-Poison: scanners-are-wired self-test (ka-0000007861)
  # The captain-poison-module pattern applied to the security bar: plant a known
  # bad input, assert the gate goes RED. Proves gitleaks actually detects secrets
  # (not just that the binary exists) and that the Go-Vuln reachability-diff
  # gates a reachable critical while NOT gating an imported-but-not-called one.
  # Defends against false-negative complacency (a silently-broken scanner green-
  # washing every MR).
  - key: security-poison
    use: [code, gitleaks-bin]
    filter:
      - "scripts/security/**"
    run: |
      set -euo pipefail
      POISON_REQUIRE_GITLEAKS=1 bash scripts/security/security-poison-selftest.sh
    outputs:
      filesystem: false

  # ── internal-strings audit (OSS-readiness early-warning) ─────────────
  # Diff-scoped advisory run of scripts/sanitize/no-internal-strings.sh:
  # reports any *newly introduced* internal reference (internal hosts,
  # registry/GitLab paths, AWS account ids, IAM ARNs, operator PII, etc.)
  # in an MR's changed files, so a future leak surfaces at review time.
  #
  # ADVISORY by design — it always exits 0. The internal `main` tree
  # legitimately contains internal strings (the public OSS repo is a
  # *sanitized projection* of main, re-derived by scripts/sanitize/, not a
  # raw mirror — see gardenio/docs/lol-sync-runbook.md). The hard,
  # zero-tolerance enforcement of this gate runs on the public/sanitized
  # branch, where surviving hits MUST fail. Here we only want a heads-up
  # that an MR is adding new internal references to track for the next
  # sanitize cycle. Not added to status-checks; never blocks a merge.
  - key: internal-strings-audit
    # code-git (preserved .git) is REQUIRED: this task's merge-base + `git diff`
    # need real git history. With the shallow, .git-less `code` clone the
    # audit silently skipped ("could not compute merge-base") on every MR —
    # the same missing-.git root cause as the coverage-patch gate (ka-0000002355).
    use: code-git
    run: |
      set -uo pipefail
      base="${{ init.target-branch }}"
      echo "== internal-strings audit (advisory; never blocks) =="
      if [ -z "$base" ]; then
        echo "no target branch in context (push/tag build) — skipping diff-scoped audit."
        exit 0
      fi
      git fetch --no-tags --depth=200 origin "$base" || git fetch --no-tags origin "$base" || true
      mergebase="$(git merge-base "origin/$base" HEAD 2>/dev/null || echo '')"
      if [ -z "$mergebase" ]; then
        echo "could not compute merge-base against origin/$base — skipping."
        exit 0
      fi
      mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$mergebase"...HEAD)
      if [ "${#changed[@]}" -eq 0 ]; then
        echo "no changed files vs origin/$base — clean."
        exit 0
      fi
      echo "scanning ${#changed[@]} changed file(s) for newly introduced internal strings..."
      # paths mode + JSON; the script exits 1 on hard hits, but this job is
      # advisory, so we capture the count and always exit 0.
      scripts/sanitize/no-internal-strings.sh --json -- "${changed[@]}" > /tmp/audit.json 2>/dev/null || true
      hard="$(python3 -c 'import json;print(json.load(open("/tmp/audit.json"))["hard_hits"])' 2>/dev/null || echo '?')"
      if [ "$hard" = "0" ]; then
        echo "✓ no new internal strings in this MR's changed files."
      else
        echo "⚠ $hard internal-string hit(s) in changed files (advisory — does not block):"
        scripts/sanitize/no-internal-strings.sh -- "${changed[@]}" 2>/dev/null || true
        echo
        echo "These are fine on internal main, but will be redacted by scripts/sanitize/"
        echo "before they reach the public OSS repo. If a NEW category of internal"
        echo "string appears, add a hunt pattern to scripts/sanitize/patterns.txt."
      fi
      exit 0
    outputs:
      filesystem: false

  # ── Quench binary (cached — only rebuilt when ci.yml changes) ────────
  - key: quench-bin
    use: rust
    filter:
      - .rwx/ci.yml
    run: |
      . "$HOME/.cargo/env"
      sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev zlib1g-dev
      # PINNED (ka-0000006853): --tag keeps quench at a known-good release so an
      # unrelated ci.yml edit can't float the ratchet to a stricter upstream HEAD
      # and red the build on pre-existing code the MR never touched. v0.4.3 is the
      # current latest release (== main HEAD 0aefcba as of 2026-08-18). To adopt a
      # newer quench, bump this tag deliberately in its own MR after verifying
      # `quench check --ci` still passes on clean main-HEAD.
      cargo install quench --git https://github.com/alfredjeanlab/quench --tag v0.4.3

  # ── Quench (repo-wide quality checks) ───────────────────────────────
  - key: quench
    use: [code, gardenio-deps, quench-bin]
    cache: false
    run: |
      . "$HOME/.cargo/env"
      # --ci activates the ratchet (ka-0000002621): it loads the committed
      # baseline .quench/baseline.json and fails the build if UNJUSTIFIED
      # escape hatches exceed the frozen ceiling. The baseline is a committed
      # file (not git notes), so no notes fetch is needed — it travels with the
      # single-commit `code` clone. The docs check (toc + links) runs at WARN
      # (ka-0000006098, Phase 2.2): --no-docs is dropped so broken-toc and
      # broken-link findings surface in CI output without failing the build;
      # diagram-heavy trees are scoped out in quench.toml [check.docs.toc].
      # cloc now runs as a repo-wide ERROR gate (Phase 2.1, ka-0000002511):
      # realistic ceiling 1500 src / 1200 test, pre-existing offenders
      # grandfathered by explicit exclude in quench.toml [check.cloc]. New files
      # over the ceiling fail the build. Run `make lint` locally for the
      # byte-identical gate.
      quench check --ci
    outputs:
      filesystem: false

  # ── Post test results as GitLab MR comment ─────────────────────────
  # NOTE: Disabled because cached tasks are removed from the expression context,
  # causing "does not exist" errors when referencing build-*/lint-*/test-* tasks.
  # Individual CI status checks (CI/Build, CI/Lint, CI/Test, CI/Quench) already
  # report results to GitLab. TODO: Rewrite using tasks context for null-safe refs.
  - key: comment-mr
    if: ${{ false }}
    after: ${{ quench.succeeded || quench.failed }}
    cache: false
    run: |
      status_icon() {
        case "$1" in
          true)  echo "✅" ;;
          false) echo "❌" ;;
          *)     echo "⏭️" ;;
        esac
      }

      status_text() {
        case "$1" in
          true)  echo "passed" ;;
          false) echo "**failed**" ;;
          *)     echo "skipped" ;;
        esac
      }

      # Determine overall status
      ALL_PASSED=true
      for var in BUILD_GARDENIO BUILD_KBEADS BUILD_COOP \
                 LINT_GARDENIO LINT_KBEADS LINT_COOP LINT_HELM \
                 TEST_GARDENIO TEST_KBEADS TEST_COOP QUENCH; do
        val=$(eval echo "\$$var")
        if [ "$val" = "false" ]; then
          ALL_PASSED=false
          break
        fi
      done

      if [ "$ALL_PASSED" = "true" ]; then
        HEADER="### ✅ RWX CI — all checks passed"
      else
        HEADER="### ❌ RWX CI — some checks failed"
      fi

      BODY="${HEADER}

      | Check | Status |
      |---|---|
      | $(status_icon "$BUILD_GARDENIO") Build gardenio | $(status_text "$BUILD_GARDENIO") |
      | $(status_icon "$BUILD_KBEADS") Build kbeads | $(status_text "$BUILD_KBEADS") |
      | $(status_icon "$BUILD_COOP") Build coop | $(status_text "$BUILD_COOP") |
      | $(status_icon "$LINT_GARDENIO") Lint gardenio | $(status_text "$LINT_GARDENIO") |
      | $(status_icon "$LINT_KBEADS") Lint kbeads | $(status_text "$LINT_KBEADS") |
      | $(status_icon "$LINT_COOP") Lint coop | $(status_text "$LINT_COOP") |
      | $(status_icon "$LINT_HELM") Lint helm | $(status_text "$LINT_HELM") |
      | $(status_icon "$TEST_GARDENIO") Test gardenio | $(status_text "$TEST_GARDENIO") |
      | $(status_icon "$TEST_KBEADS") Test kbeads | $(status_text "$TEST_KBEADS") |
      | $(status_icon "$TEST_COOP") Test coop | $(status_text "$TEST_COOP") |
      | $(status_icon "$QUENCH") Quench | $(status_text "$QUENCH") |

      [View full results on RWX](https://cloud.rwx.com)

      ---
      *Posted by RWX CI*"

      # URL-encode the project path
      PROJECT_ENCODED=$(echo "$PROJECT_PATH" | sed 's|/|%2F|g')

      # Try to update existing bot comment, otherwise create new one
      EXISTING=$(curl -sf \
        -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
        "https://gitlab.com/api/v4/projects/${PROJECT_ENCODED}/merge_requests/${MR_IID}/notes?per_page=100" \
        | python3 -c "
      import json, sys
      notes = json.load(sys.stdin)
      for n in notes:
          if 'Posted by RWX CI' in n.get('body', '') and n.get('system', False) == False:
              print(n['id'])
              break
      " 2>/dev/null || echo "")

      if [ -n "$EXISTING" ]; then
        curl -sf -X PUT \
          -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "https://gitlab.com/api/v4/projects/${PROJECT_ENCODED}/merge_requests/${MR_IID}/notes/${EXISTING}" \
          --data-urlencode "body=${BODY}" > /dev/null
        echo "Updated existing MR comment (note $EXISTING)"
      else
        curl -sf -X POST \
          -H "PRIVATE-TOKEN: $GITLAB_TOKEN" \
          "https://gitlab.com/api/v4/projects/${PROJECT_ENCODED}/merge_requests/${MR_IID}/notes" \
          --data-urlencode "body=${BODY}" > /dev/null
        echo "Created new MR comment"
      fi
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_CLONE_TOKEN }}
      MR_IID: ${{ init.mr-iid }}
      PROJECT_PATH: ${{ init.project-path }}
      BUILD_GARDENIO: ${{ build-gardenio.succeeded }}
      BUILD_KBEADS: ${{ build-kbeads.succeeded }}
      BUILD_COOP: ${{ build-coop.succeeded }}
      LINT_GARDENIO: ${{ lint-gardenio.succeeded }}
      LINT_KBEADS: ${{ lint-kbeads.succeeded }}
      LINT_COOP: ${{ lint-coop.succeeded }}
      LINT_HELM: ${{ lint-helm.succeeded }}
      TEST_GARDENIO: ${{ test-gardenio.succeeded }}
      TEST_KBEADS: ${{ test-kbeads.succeeded }}
      TEST_COOP: ${{ test-coop.succeeded }}
      QUENCH: ${{ quench.succeeded }}

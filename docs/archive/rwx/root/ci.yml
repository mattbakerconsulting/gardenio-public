  # ── Test coop with LCOV coverage emission (W1-Rust, ka-0000003976) ───
  # Separate task from `test-coop` because cargo-llvm-cov rebuilds with
  # `-C instrument-coverage`, which would poison the build cache shared with
  # `build-coop` / `test-coop`. The artifact (.coverage/unit/coop.lcov) is
  # consumed by the Phase-2a coverage merge job (sibling task).
  # Spec: docs/research/coverage-2a-w1-rust-coop.md.
  - key: test-coop-coverage
    use: [code, rust, coop-system-deps, coop-deps]
    filter:
      - "coop/crates/**"
      - "coop/tests/**"
      - "coop/proto/**"
      - "coop/Cargo.toml"
      - "coop/Cargo.lock"
      - "coop/rust-toolchain.toml"
      - .rwx/ci.yml
    run: |
      . "$HOME/.cargo/env"
      if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
        cargo install cargo-llvm-cov --version "^0.6" --locked
      fi
      mkdir -p .coverage/unit
      cd coop && cargo llvm-cov --workspace --lcov \
          --output-path "$(pwd)/../.coverage/unit/coop.lcov" \
          -- --skip claude_ --skip attach_ --skip coop_vs_tmux_
    outputs:
      filesystem: false
      artifacts:
        - key: coop-unit-lcov
          path: .coverage/unit/coop.lcov


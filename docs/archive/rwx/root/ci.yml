# Unified CI — all components in one pipeline.
# Run manually: rwx run .rwx/ci.yml --init commit-sha=$(git rev-parse HEAD) --wait
on:
  github:
    push:
      if: ${{ event.git.branch == 'main' || starts-with(event.git.tag, '20') }}
      init:
        commit-sha: ${{ event.git.sha }}
        mr-iid: ""
        project-path: ""
        target-branch: ""
      status-checks:
        name: CI
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        mr-iid: ""
        project-path: ""
        target-branch: ""
      status-checks:
        - tasks: [build-gardenio, build-kbeads, build-coop]
          name: CI / Build
        - tasks: [lint-gardenio, lint-kbeads, lint-coop, lint-helm, lint-deploy-values, lint-deploy-values-realm-consistency, lint-large-files, lint-merge-conflict-markers, lint-golangci-pin, lint-go-module-coverage, lint-claude-code-currency-guard, lint-preflight-targets]
          name: CI / Lint
        # INVARIANT (ka-0000000622): every `test-*` task in this file must be
        # named here. A task in no named status check is reported ONLY by the
        # aggregate `RWX: ci.yml (merge-request)` run check, and — since
        # `make preflight` derives its target list from these status checks —
        # is in no local pre-push gate at all. The single deliberate exception
        # is `test-coop-coverage`: it is the COVERAGE=1 variant of `test-coop`
        # (whose failures already red `CI / Test`) and is an `after:` dependency
        # of `coverage-patch`, so its failures red `Coverage / Patch`. Keeping it
        # out also keeps the heavy cargo-llvm-cov build out of `make preflight`.
        - tasks: [test-gardenio, test-kbeads, test-coop, test-helm, test-beads-viewer-e2e, test-mirror-sync, test-gitlab-dark-backup, test-disable-cicd, test-rebase-captain, test-e2e-scope, test-verify-topology, test-pre-receive, test-dark-secret-patterns, test-dark-credential-boundary, test-peel-verify, test-standalone-slice-build, test-peel-extract, test-peel-captain, test-peel-deps, test-peel-trailer, test-peel-prov-verify, test-drift-metrics, test-frontier-hmac, test-no-agent-frontier-secret, test-monorepo-protect-tf, test-edge-auth-secret-guard, test-backup-destination-vault-tf, test-verify-image-signatures, test-outbox-shape, test-shard-isolation, test-skip-visibility, test-gvisor-freeze-thaw-rungs, test-gvisor-discriminating-restore, test-gvisor-sentry-egress, test-security-scripts, test-terraform-prewarm-contract, test-terraform-roots, test-release-closure-excludes-control-plane, test-eks-secrets-kms-tf, test-scripts, test-dictation-corpus, test-shard-budget-guard, test-gvisor-node-lib, test-gvisor-forensics-lib]
          name: CI / Test
        - tasks: [bench-gardenio]
          name: CI / Bench
        - tasks: [quench]
          name: CI / Quench
        - tasks: [gitleaks]
          name: CI / Gitleaks
        - tasks: [go-vuln]
          name: CI / Go-Vuln
        - tasks: [osv-scan]
          name: CI / OSV-Scan
        - tasks: [cargo-audit]
          name: CI / Cargo-Audit
        - tasks: [cargo-deny]
          name: CI / Cargo-Deny
        - tasks: [security-poison]
          name: CI / Security-Poison
  gitlab:
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        mr-iid: ""
        project-path: ""
        target-branch: ""
      # Disable default status check: without `false`, RWX still posts
      # "RWX: ci.yml (push)" even with no status-checks block.
      status-checks: false
    tag-push:
      if: ${{ starts-with(event.git.ref, 'refs/tags/20') }}
      init:
        commit-sha: ${{ event.git.sha }}
        mr-iid: ""
        project-path: ""
        target-branch: ""
      status-checks: false
    merge-request:
      init:
        commit-sha: ${{ event.git.sha }}
        mr-iid: ${{ event.gitlab.merge-request.object_attributes.iid }}
        project-path: ${{ event.gitlab.merge-request.project.path_with_namespace }}
        target-branch: ${{ event.gitlab.merge-request.object_attributes.target_branch }}
      status-checks:
        - tasks: [build-gardenio, build-kbeads, build-coop]
          name: CI / Build
        - tasks: [lint-gardenio, lint-kbeads, lint-coop, lint-helm, lint-deploy-values, lint-deploy-values-realm-consistency, lint-large-files, lint-merge-conflict-markers, lint-golangci-pin, lint-go-module-coverage, lint-claude-code-currency-guard, lint-preflight-targets]
          name: CI / Lint
        # INVARIANT (ka-0000000622): every `test-*` task in this file must be
        # named here. A task in no named status check is reported ONLY by the
        # aggregate `RWX: ci.yml (merge-request)` run check, and — since
        # `make preflight` derives its target list from these status checks —
        # is in no local pre-push gate at all. The single deliberate exception
        # is `test-coop-coverage`: it is the COVERAGE=1 variant of `test-coop`
        # (whose failures already red `CI / Test`) and is an `after:` dependency
        # of `coverage-patch`, so its failures red `Coverage / Patch`. Keeping it
        # out also keeps the heavy cargo-llvm-cov build out of `make preflight`.
        - tasks: [test-gardenio, test-kbeads, test-coop, test-helm, test-beads-viewer-e2e, test-mirror-sync, test-gitlab-dark-backup, test-disable-cicd, test-rebase-captain, test-e2e-scope, test-verify-topology, test-pre-receive, test-dark-secret-patterns, test-dark-credential-boundary, test-peel-verify, test-standalone-slice-build, test-peel-extract, test-peel-captain, test-peel-deps, test-peel-trailer, test-peel-prov-verify, test-drift-metrics, test-frontier-hmac, test-no-agent-frontier-secret, test-monorepo-protect-tf, test-edge-auth-secret-guard, test-backup-destination-vault-tf, test-verify-image-signatures, test-outbox-shape, test-shard-isolation, test-skip-visibility, test-gvisor-freeze-thaw-rungs, test-gvisor-discriminating-restore, test-gvisor-sentry-egress, test-security-scripts, test-terraform-prewarm-contract, test-terraform-roots, test-release-closure-excludes-control-plane, test-eks-secrets-kms-tf, test-scripts, test-dictation-corpus, test-shard-budget-guard, test-gvisor-node-lib, test-gvisor-forensics-lib]
          name: CI / Test
        - tasks: [bench-gardenio]
          name: CI / Bench
        - tasks: [quench]
          name: CI / Quench
        - tasks: [gitleaks]
          name: CI / Gitleaks
        # Security bar (bundle ka-0000005053 §2.3; task ka-0000007861).
        # Advisory→enforce rollout mirrors coverage-patch: the named status
        # checks are wired here; the operator-owned GitLab branch-protection
        # "required" toggle (Settings → Repository → Protected branches → main)
        # is the last mile. SOAK before flipping any to required.
        - tasks: [go-vuln]
          name: CI / Go-Vuln
        - tasks: [osv-scan]
          name: CI / OSV-Scan
        - tasks: [cargo-audit]
          name: CI / Cargo-Audit
        - tasks: [cargo-deny]
          name: CI / Cargo-Deny
        - tasks: [security-poison]
          name: CI / Security-Poison
        # Internal-strings audit — advisory OSS-readiness early-warning.
        # Always passes (the task exits 0); surfaces newly introduced
        # internal references in an MR for the next sanitize cycle.
        - tasks: [internal-strings-audit]
          name: CI / Internal-Strings Audit
        # Coverage / Patch (W2b-2, ka-0000006156) — patch-coverage gate.
        # Spec: docs/research/coverage-phase2b-design.md §4. Phase-1
        # advisory rollout: the named status check is wired in here, but
        # the GitLab branch-protection toggle (Settings → Repository →
        # Protected branches → main → "Coverage / Patch" required) is
        # operator-owned. SOAK ≥3 main pushes + ≥3 MRs before flipping.
        - tasks: [coverage-patch]
          name: Coverage / Patch
        # Trickle / Bar (ka-0000001182; bundle ka-0000005053 §5) — the trickle-
        # eligibility gate. It is NOT wired inline here: it runs against DARK MRs
        # on the in-cluster dark GitLab (monorepo-dark has no CI runners — §6.16),
        # so its status is posted by the `gardenio-trickle-gate` RWX DISPATCH
        # (.rwx/trickle-gate.yml, `title: Trickle / Bar`) that the dark FE captain
        # fires per dark MR, not by a task in this real-monorepo pipeline. Same
        # advisory→enforce rollout as Coverage / Patch: the named status posts the
        # gate verdict, but the GitLab branch-protection "Trickle / Bar" required
        # toggle (on the DARK instance) is operator-owned. SOAK ≥3 dark MRs first.
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      mr-iid: ""
      project-path: ""
      target-branch: ""

# ── Cancel superseded MR CI runs (ka-0000002755) ──────────────────────
# CI-burn feedback (Sky Bennett): under high agent MR throughput, an agent
# re-pushing to an open MR used to leave the PRIOR commit's full build/lint/
# test fanout (build ×3 + lint ×8 + test ×30 + bench/quench/gitleaks/coverage)
# running to completion alongside the new one — pure wasted CI minutes, since
# only the newest commit can merge. This pool keys on the MR iid so every push
# to the SAME MR shares one pool; capacity:1 + cancel-running cancels the older
# in-flight run the moment a newer push starts (RWX's canonical feature-branch
# pattern, https://www.rwx.com/docs/rwx/concurrency-pools).
#
# Scoped to MR events ONLY (`init.mr-iid != ""`): push (main), tag-push, and
# cli triggers all pass mr-iid="" and are EXCLUDED, so main/tag/cli CI never
# shares a pool and is never cancelled — main must always run to completion for
# the release/scheduled gate. Two distinct MRs have distinct iids → distinct
# pools → they run fully in parallel; only re-pushes to the same MR supersede.
concurrency-pools:
  - id: Acme/Platform/gardenio:ci-mr-${{ init.mr-iid }}
    if: ${{ init.mr-iid != "" }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  # ── Clone ──────────────────────────────────────────────────────────────
  - key: code
    # ── Retry-wrapped shallow clone (ka-0000001787 / ka-0000004454) ─────────
    # Hand-rolled shallow clone with a bounded retry loop instead of
    # `call: git/clone` — the pattern proven in docker.yml (ka-0000007550) and
    # the release-DAG workflows (!7031). The stock package (through 2.0.8) has
    # NO retry and RWX has no task-level auto-retry, so a single transient
    # gitlab.com blip during fetch-pack (`Connection to gitlab.com closed by
    # remote host`, exit 128) fails the whole run.
    #
    # Parity with `git/clone` DEFAULTS (all this task used): shallow `--depth=1`
    # fetch of the exact ref, detached checkout, `.git` stripped afterwards
    # (cleanup-git-dir default) for identical downstream cache keys, no
    # submodules, no LFS. Token auth stays in the repository URL.
    run: |
      set -eu
      : "${GITLAB_CLONE_TOKEN:?GITLAB_CLONE_TOKEN is required}"
      REPO="https://oauth2:${GITLAB_CLONE_TOKEN}@gitlab.com/Acme/Platform/gardenio.git"
      SHA="${COMMIT_SHA}"
      MAX_ATTEMPTS=5

      # Redact the token from any tracing/output; never echo $REPO.
      git init -q -b main
      git remote add origin "$REPO"
      git config --local maintenance.auto false
      git config --local gc.auto 0

      attempt=1
      while :; do
        echo "git-clone attempt ${attempt}/${MAX_ATTEMPTS} for ${SHA}"
        if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-auto-gc --depth=1 origin "+${SHA}:refs/rwx/git-clone/checkout"; then
          echo "git-clone: fetch succeeded on attempt ${attempt}"
          break
        else
          rc=$?
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "git-clone: fetch FAILED after ${MAX_ATTEMPTS} attempts (last exit ${rc})" >&2
            exit "$rc"
          fi
          # Exponential backoff: 5s, 10s, 20s, 40s.
          sleep_s=$((5 * (1 << (attempt - 1))))
          echo "git-clone: fetch failed (exit ${rc}); retrying in ${sleep_s}s" >&2
          sleep "$sleep_s"
          attempt=$((attempt + 1))
        fi
      done

      git checkout -q --detach "$(git rev-parse refs/rwx/git-clone/checkout^{commit})"
      git clean -fdq
      echo "Checked out git repository at $(git rev-parse HEAD)"

      # Strip .git for cache-key parity with git/clone's cleanup-git-dir default.
      rm -rf .git
    env:
      GITLAB_CLONE_TOKEN:
        value: ${{ secrets.GITLAB_CLONE_TOKEN }}
        cache-key: excluded
      COMMIT_SHA: ${{ init.commit-sha }}

  # ── Clone (full history + .git) ─────────────────────────────────────────
  # Same repo/ref as `code`, but with `fetch-full-depth` + `preserve-git-dir`
  # so consumers can `git merge-base` / `git diff` against the MR target
  # branch. The default `code` clone above is a SHALLOW clone that DISCARDS
  # the `.git` directory after checkout (preserve-git-dir defaults false), so
  # every `git` invocation in a task that `use: code` dies with "fatal: not a
  # git repository". That silently turned the coverage-patch gate into a
  # permanent no-op — it hit its `missing-merge-base` synthetic-bypass on
  # EVERY MR and passed without ever evaluating patch coverage (ka-0000002355).
  # Kept as a SEPARATE task from `code` so the many build/lint/test tasks that
  # don't need history keep their fast shallow clone. Mirrors the `code` task
  # in the standalone .rwx/coverage-patch.yml and .rwx/coverage.yml.
  - key: code-git
    # ── Retry-wrapped FULL clone, preserve .git (ka-0000001787 / ka-0000004454)
    # Hand-rolled full-history clone with a bounded retry loop instead of
    # `call: git/clone ... fetch-full-depth+preserve-git-dir` — the retry
    # pattern proven in docker.yml (ka-0000007550). The stock package (through
    # 2.0.8) has NO retry, so a single transient gitlab.com blip (exit 128)
    # fails the whole run.
    #
    # Parity with `git/clone` fetch-full-depth:true + preserve-git-dir:true:
    # NON-shallow fetch of the exact SHA (full ancestry, so `git merge-base`
    # against origin/<target> resolves) and `.git` KEPT (consumers self-fetch
    # origin/<target> and run merge-base/diff — ka-0000002355). No submodules/LFS.
    run: |
      set -eu
      : "${GITLAB_CLONE_TOKEN:?GITLAB_CLONE_TOKEN is required}"
      REPO="https://oauth2:${GITLAB_CLONE_TOKEN}@gitlab.com/Acme/Platform/gardenio.git"
      SHA="${COMMIT_SHA}"
      MAX_ATTEMPTS=5

      # Redact the token from any tracing/output; never echo $REPO.
      git init -q -b main
      git remote add origin "$REPO"
      git config --local maintenance.auto false
      git config --local gc.auto 0

      attempt=1
      while :; do
        echo "git-clone attempt ${attempt}/${MAX_ATTEMPTS} for ${SHA}"
        if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-auto-gc origin "+${SHA}:refs/rwx/git-clone/checkout"; then
          echo "git-clone: fetch succeeded on attempt ${attempt}"
          break
        else
          rc=$?
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "git-clone: fetch FAILED after ${MAX_ATTEMPTS} attempts (last exit ${rc})" >&2
            exit "$rc"
          fi
          # Exponential backoff: 5s, 10s, 20s, 40s.
          sleep_s=$((5 * (1 << (attempt - 1))))
          echo "git-clone: fetch failed (exit ${rc}); retrying in ${sleep_s}s" >&2
          sleep "$sleep_s"
          attempt=$((attempt + 1))
        fi
      done

      git checkout -q --detach "$(git rev-parse refs/rwx/git-clone/checkout^{commit})"
      git clean -fdq
      echo "Checked out git repository at $(git rev-parse HEAD)"

      # preserve-git-dir parity: KEEP .git so downstream `git merge-base` /
      # `git diff` against the MR target branch resolve (ka-0000002355).
    env:
      GITLAB_CLONE_TOKEN:
        value: ${{ secrets.GITLAB_CLONE_TOKEN }}
        cache-key: excluded
      COMMIT_SHA: ${{ init.commit-sha }}

  # ── Go toolchain ──────────────────────────────────────────────────────
  - key: go
    call: golang/install 1.2.1
    with:
      go-version: "1.25"

  # ── golangci-lint ────────────────────────────────────────────────────
  # Version + sha256 are SOURCED from the agent image's pin files, never
  # hard-coded here — same single-source-of-truth pattern as the Node/Go pins
  # in docker.yml and the Claude pin in e2e.yml. That is deliberate: this task
  # used to hard-code `v2.11.2` while the agent image pinned 1.64.8 in
  # versions.env, so an agent's local `golangci-lint run` could not even LOAD
  # the v2-schema .golangci.yml ("can't load config: the Go language version
  # (go1.24) used to build golangci-lint is lower than the targeted Go version")
  # and CI/Lint was the only place the gate actually ran (ka-0000000665).
  # Sourcing the pins makes that drift unrepresentable: one bump moves both.
  #
  # Fetch is a sha-verified release tarball rather than the upstream
  # `curl … install.sh | sh` pipe, which executes whatever
  # raw.githubusercontent serves at HEAD (same hardening the agent image took
  # in install/go-tools.sh, AUDIT.md §H3).
  - key: golangci-lint
    use: [code, go]
    filter:
      - .rwx/ci.yml
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
    run: |
      set -euo pipefail
      source gardenio/images/agent/install/versions.env
      source gardenio/images/agent/install/checksums.env
      DIR="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
      curl -fsSL -o /tmp/golangci-lint.tar.gz \
        "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${DIR}.tar.gz"
      echo "${GOLANGCI_LINT_SHA256_AMD64}  /tmp/golangci-lint.tar.gz" | sha256sum -c -
      mkdir -p "$(go env GOPATH)/bin"
      tar -xzf /tmp/golangci-lint.tar.gz --strip-components=1 \
        -C "$(go env GOPATH)/bin" "${DIR}/golangci-lint"
      rm -f /tmp/golangci-lint.tar.gz
      golangci-lint --version

  # ── gotestsum (structured Go test output) ──────────────────────────
  - key: gotestsum
    use: go
    filter:
      - .rwx/ci.yml
    run: go install gotest.tools/gotestsum@v1.13.0

  # ── Rust toolchain (for coop + quench) ───────────────────────────────
  - key: rust
    filter:
      - .rwx/ci.yml
      - coop/rust-toolchain.toml
    run: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0 -c rustfmt -c clippy -c llvm-tools
      . "$HOME/.cargo/env"
      rustc --version

  # ── Node.js (for beads-viewer-e2e) ───────────────────────────────────
  - key: node
    call: nodejs/install 1.1.13
    with:
      node-version: 22.12.0

  # ── Go deps: gardenio/controller ──────────────────────────────────────
  - key: gardenio-deps
    use: [code, go]
    run: cd gardenio/controller && GOWORK=off go mod download
    filter:
      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
      # controller go.mod has `replace gardenio/clicreds =>
      # ../clicreds`; the RWX filter must materialize the local module's
      # go.mod/go.sum or `go mod download` FATALs on the missing path
      # (ka-0000003839).
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum

  # ── Go deps: kbeads ──────────────────────────────────────────────────
  - key: kbeads-deps
    use: [code, go]
    run: cd kbeads && GOWORK=off go mod download
    filter:
      - kbeads/go.mod
      - kbeads/go.sum
      # kbeads go.mod has `replace gardenio/clicreds =>
      # ../gardenio/clicreds` (ka-0000003839).
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum

  # ── gcov2lcov: Go cover-profile → LCOV converter ─────────────────────
  # Pinned per W1 Appendix A (docs/research/coverage-tooling-per-language.md).
  # Used by scripts/coverage/go-to-lcov.sh + emit-go-lcov.sh.
  - key: gcov2lcov
    use: go
    filter:
      - .rwx/ci.yml
    run: GOWORK=off go install github.com/jandelgado/gcov2lcov@v1.1.1

  # ── System deps for Rust builds (protobuf, ssl, tmux) ───────────────
  - key: coop-system-deps
    filter:
      - .rwx/ci.yml
    run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev tmux

  # ── Rust deps: coop ─────────────────────────────────────────────────
  - key: coop-deps
    use: [code, rust, coop-system-deps]
    run: |
      . "$HOME/.cargo/env"
      cd coop && cargo fetch
    filter:
      - coop/Cargo.lock
      - coop/Cargo.toml
      - coop/crates/*/Cargo.toml
      - coop/crates/*/src/lib.rs
      - coop/crates/*/src/main.rs
      - coop/tests/*/Cargo.toml
      - coop/tests/*/src/lib.rs

  # ── Build gardenio binaries (parallel) ────────────────────────────────
  - key: build-gardenio
    use: gardenio-deps
    filter:
      - "gardenio/controller/**"
      # controller imports the local clicreds module (replace => ../clicreds);
      # its source must be materialized or `go build` FATALs (ka-0000003839).
      - "gardenio/clicreds/**"
    run: |
      cd gardenio/controller
      mkdir -p bin
      # Single go build invocation — Go parallelizes compilation internally
      GOWORK=off CGO_ENABLED=0 go build -v -o bin/ ./cmd/...
    outputs:
      filesystem: false

  # ── Build kbeads ─────────────────────────────────────────────────────
  - key: build-kbeads
    use: kbeads-deps
    filter:
      - "kbeads/**"
      # kbeads imports the local clicreds module (replace => ../gardenio/clicreds);
      # its source must be materialized or `go build` FATALs (ka-0000003839).
      - "gardenio/clicreds/**"
    run: |
      cd kbeads
      GOWORK=off CGO_ENABLED=0 go build -v -o bin/kd ./cmd/kd/
    outputs:
      filesystem: false

  # ── Build coop ───────────────────────────────────────────────────────
  - key: build-coop
    use: coop-deps
    filter:
      - "coop/crates/**"
      - "coop/tests/**"
      - "coop/proto/**"
      - "coop/Cargo.toml"
      - "coop/Cargo.lock"
    run: |
      . "$HOME/.cargo/env"
      cd coop && cargo build --workspace

  # ── Lint gardenio ─────────────────────────────────────────────────────
  - key: lint-gardenio
    use: [gardenio-deps, golangci-lint]
    # Cold golangci-lint on the controller tree is ~all type-check/compile
    # time, and that tree has grown past the old 5m ceiling: a clean run
    # (0 issues) was measured at 5m17s on HEAD 486d2aac, tripping the guard and
    # reding preflight fleet-wide (ka-0000004865). Same cold-compile-growth
    # reason test-gardenio carries an explicit timeout. Raise the RWX task
    # ceiling above the 10m default (otherwise a >10m run SIGKILLs, exit 137,
    # before golangci's own timeout fires), and set golangci --timeout below it
    # so a genuine overrun reports a clean lint-timeout instead of a raw kill.
    timeout: 20m
    filter:
      - "gardenio/controller/**"
      # clicreds source needed to typecheck the controller (ka-0000003839).
      - "gardenio/clicreds/**"
    run: |
      cd gardenio/controller
      GOWORK=off golangci-lint run --timeout=15m ./...
      ./scripts/lint-bridge-bead-ids.sh
    outputs:
      filesystem: false
      problems:
        - matcher: golangci-lint

  # ── Lint kbeads ──────────────────────────────────────────────────────
  - key: lint-kbeads
    use: [kbeads-deps, golangci-lint]
    filter:
      - "kbeads/**"
      # clicreds source needed to typecheck kbeads (ka-0000003839).
      - "gardenio/clicreds/**"
    run: cd kbeads && GOWORK=off golangci-lint run --timeout=5m ./...
    outputs:
      filesystem: false
      problems:
        - matcher: golangci-lint

  # ── Lint coop ────────────────────────────────────────────────────────
  - key: lint-coop
    use: coop-deps
    filter:
      - "coop/crates/**"
      - "coop/tests/**"
      - "coop/proto/**"
      - "coop/Cargo.toml"
      - "coop/Cargo.lock"
      - "coop/rustfmt.toml"
    run: |
      . "$HOME/.cargo/env"
      cd coop
      # fmt check first — instant, fails fast on formatting issues
      cargo fmt --check
      cargo clippy --workspace -- -D warnings
    outputs:
      filesystem: false
      problems:
        - matcher: clippy

  # ── Test gardenio ─────────────────────────────────────────────────────
  # Coverage flags (Phase-2a W1-Go, ka-0000001270):
  #   -covermode=atomic    — required wherever goroutines race counters; consistent
  #                           with the E2E -cover build path.
  #   -coverpkg=./...      — instrument every package in the module so cross-package
  #                           call paths are visible to the W3 merge step.
  # Profile lands at gardenio/controller/coverage/unit.out — same module-relative
  # scheme used by the local `make test` target.
  - key: test-gardenio
    use: [gardenio-deps, gotestsum]
    # The full `./...` run (slow cmd/beads-viewer package included) overruns
    # the RWX default 10m task timeout under load and SIGKILLs (exit 137),
    # reporting `CI / Test` failed fleet-wide even though every package passes
    # (ka-0000004988). Raise the ceiling so the whole suite completes.
    timeout: 20m
    filter:
      - "gardenio/controller/**"
      # clicreds source needed to compile the controller test binary (ka-0000003839).
      - "gardenio/clicreds/**"
      # TestCostsTrustFloorsMatchValuesYAML (cmd/beads-viewer/costs_trust_lockstep_test.go)
      # reads ../../../helm/gardenio/values.yaml to lockstep the C6 trust-strip
      # drift floors against the C5 alert thresholds; materialize it or the test
      # t.Fatalfs "no such file or directory" (ka-0000000434).
      - "gardenio/helm/gardenio/values.yaml"
      # TestGitLabWebhookDeadmanE2E_ServedNamesMatchShippedAlertExpr
      # (internal/bridge/gitlab_webhook_deadman_e2e_test.go, ka-0000005729) reads
      # the shipped PrometheusRule template to prove the emitted metric names still
      # match the alert expr — the rename-either-side-silently-unfires guard.
      # Materialize it or the test t.Fatalfs "no such file or directory". Scoping
      # to this one template is also the correct lockstep contract: a change to the
      # alert expr SHOULD re-run the test that couples it to the Go metric names.
      - "gardenio/helm/gardenio/templates/gitlab-bridge/webhook-deadman-alert.yaml"
      # TestSlackBridgeRespawnPhaseE2E_ServedNamesMatchShippedAlertExpr
      # (internal/bridge/respawn_phase_e2e_test.go, ka-0000003422) reads the shipped
      # vmalert configmap to prove the emitted respawn-phase metric names still match
      # the SlackBridgeRespawnPhaseSlow alert expr — the same rename-either-side-
      # silently-unfires guard as the deadman line above. Materialize it so the
      # coupling hard-gates on every MR (the test SKIPs LOUD if absent). Scoping to
      # this template is the correct lockstep: a change to the alert expr SHOULD
      # re-run the test that couples it to the Go metric names.
      - "gardenio/helm/gardenio/templates/vmalert/configmap.yaml"
      # TestEmptyBranchScan_* (internal/grafanagrade/dashboards_scan_test.go,
      # ka-0000004423) scans every chart-shipped dashboard for stat panels whose
      # empty-result branch cannot tell a real zero from a blind emitter. Without
      # the boards in the layer the glob matches nothing and the ratchet goes
      # silently vacuous — passing green while a new masked-zero panel lands
      # (ka-0000001628). TestEmptyBranchScan_DashboardTreePresent hard-fails
      # under CI if this line is ever dropped. Scoping to the dashboards is also
      # the right lockstep: editing a board SHOULD re-run the guard on it.
      - "gardenio/helm/gardenio/dashboards/*.json"
      # TestClaudeMDDirectiveDensityBudget (cmd/gb/claude_md_directive_density_budget_test.go)
      # reads the four harness-injected CLAUDE.md files off disk via
      # findRepoRootForSizing() and t.Fatalfs if any is missing — the guard
      # measures nothing if the file is absent, so it must NOT be softened to a
      # skip. Materialize all four plus go.work: findRepoRootForSizing walks up
      # for a go.work/.git marker, but the shallow `code` clone discards .git, so
      # without go.work in the layer it falls back to the test CWD (.../cmd/gb)
      # and reads .../cmd/gb/CLAUDE.md (nonexistent). go.work is only a location
      # marker here — the run is GOWORK=off, so materializing it does not change
      # the build (ka-0000003785 / MR !7017).
      - "go.work"
      - "CLAUDE.md"
      - "gardenio/CLAUDE.md"
      - "coop/CLAUDE.md"
      - "kbeads/CLAUDE.md"
    run: |
      cd gardenio/controller
      mkdir -p coverage
      GOWORK=off CGO_ENABLED=0 gotestsum \
        --jsonfile test-results.json \
        --format pkgname \
        -- -short -parallel 8 \
           -covermode=atomic -coverpkg=./... \
           -coverprofile=coverage/unit.out ./...
    outputs:
      filesystem: false
      artifacts:
        - key: gardenio-coverage
          path: gardenio/controller/coverage/unit.out
      test-results:
        - path: gardenio/controller/test-results.json

  # ── Bench gardenio (perf measurement) ─────────────────────────────────
  # Phase-1 perf-regression detection (ka-bench001). Runs the package-
  # level benchmarks added under cmd/beads-viewer/perf_bench_test.go —
  # rich-report widget hydration, captain-mentor task fetch, /agents
  # render, and the /captains owner-resolution N+1 guard (ka-0000003665) —
  # against the in-package fakeDaemon.
  #
  # The /captains owner-resolution path additionally has a HARD call-count
  # gate (TestHandleCaptains_OwnerResolution* in test-gardenio) that fails
  # the build if the per-row alias-lookup / operator-directory-scan N+1
  # returns; this advisory bench is the ns/op companion to that gate.
  #
  # Why these benchmarks: each one targets a former N+1 / serial-RTT
  # hotspot we removed in the parallelization sweep (perf/listbeads-
  # projections-opt-in branch). A regression that re-serializes the
  # fan-out shows up as ns/op multiplying by the fan-out cap.
  #
  # Why advisory (continue-on-error): benchmark numbers are noisy on
  # shared CI hardware. Phase 1 just publishes the results as an
  # artifact. Phase 2 (later) will compare main-branch baseline using
  # benchstat once we've collected ~10 main-pushes worth of data.
  #
  # benchtime=300ms keeps wall-time bounded (~3-4s total). -benchmem
  # surfaces allocation regressions which are also a useful regression
  # signal on these handlers.
  - key: bench-gardenio
    use: [gardenio-deps]
    # Materialize the whole controller tree, not just cmd/beads-viewer +
    # beadsapi: the benchmarked package transitively imports many other
    # internal/* packages (oidcauth, bridge, coopmuxapi, scheduler, ...). With a
    # narrow filter those packages are absent from the layer and `go test`
    # FAILs at compile with "package ... is not in std [setup failed]" for any
    # MR touching beads-viewer (ka-0000006625). Mirror test-gardenio's filter so
    # the bench binary always compiles.
    filter:
      - "gardenio/controller/**"
      # controller imports the local clicreds module (replace => ../clicreds);
      # its source must be materialized or GOWORK=off `go test` FATALs
      # (ka-0000003839).
      - "gardenio/clicreds/**"
    run: |
      cd gardenio/controller
      mkdir -p bench
      # `set -o pipefail` so a benchmark panic surfaces even with the tee.
      set -o pipefail
      GOWORK=off CGO_ENABLED=0 go test \
        -run='^$' -bench='.' -benchtime=300ms -benchmem \
        ./cmd/beads-viewer/ 2>&1 | tee bench/bench.txt
      echo "---"
      echo "Benchmark complete. See bench/bench.txt for full results."
    outputs:
      filesystem: false
      artifacts:
        - key: gardenio-bench
          path: gardenio/controller/bench/bench.txt

  # ── Test kbeads ──────────────────────────────────────────────────────
  - key: test-kbeads
    use: [kbeads-deps, gotestsum]
    filter:
      - "kbeads/**"
      # clicreds source needed to compile the kbeads test binary (ka-0000003839).
      - "gardenio/clicreds/**"
      # config_driftguard_test.go parses the controller's ProjectInfo/RoleInfo
      # parser SOURCE across the module boundary (../../../gardenio/controller/
      # internal/beadsapi/{projects,roles}.go). RWX content-filtering only
      # stages declared paths, so without these the test t.Fatal-s with
      # "no such file or directory" and fails every gardenio MR pipeline
      # (ka-0000006006). Read-only test inputs, not compiled into the binary.
      - "gardenio/controller/internal/beadsapi/projects.go"
      - "gardenio/controller/internal/beadsapi/roles.go"
      # config_bridge_subset_guard_test.go parses the bridge's schema-declaration
      # SOURCE across the module boundary (../../../gardenio/controller/internal/
      # bridge/init.go) and asserts every bridge-declared field for a guarded
      # type (agent/project/role) also exists in the daemon builtin — a
      # bridge-only field writes a config bead resolveTypeConfig never reads, so
      # every typed PATCH carrying it 400s (ka-0000000811, ka-0000001549).
      # Without staging this file the test t.Skips as "sibling not checked out"
      # and reads green — the exact vacuity that let the incident ship
      # (ka-0000001411). Combined with CI_STRICT_BRIDGE_GUARD below, that skip is
      # now a hard fail. Read-only test input, not compiled into the binary.
      - "gardenio/controller/internal/bridge/init.go"
      # config_seed_shadow_test.go GLOBS every e2e script across the module
      # boundary (../../../gardenio/tests/e2e/scripts/*.sh) and asserts none re-adds
      # a `PUT /v1/configs/type:<T>` schema that shadows+drifts a daemon builtin
      # (ka-0000003677, generalized across all scripts in ka-0000000407 — 8 scripts
      # besides the seed were shadowing builtins, incl. test-trigger-system.sh
      # dropping the `captain` blob). Same staging requirement as above — the test
      # SKIPS cleanly when the glob matches nothing, so staging only
      # seed-types-and-users.sh would make the guard VACUOUS in CI (blind to the
      # other scripts, which is the exact defect it exists to catch). Stage the
      # whole scripts dir so the guard actually runs against every module here.
      # Read-only test inputs, not compiled into the binary.
      - "gardenio/tests/e2e/scripts/*.sh"
      # charts_grafana_dashboard_uid_disjoint_test.go GLOBS every chart-shipped
      # dashboard JSON across the module boundary
      # (../../../gardenio/helm/gardenio/dashboards/*.json) and asserts no catalog
      # dashboard uid collides with a chart-bundle-owned uid (ka-0000002712 —
      # fef109705 had the kbeads catalog and the chart JSON both claim
      # `gardenio-perf-traces`). Same staging requirement as above: the test SKIPS
      # cleanly when the glob matches nothing, so without this the disjointness
      # guard would be VACUOUS in the isolated test-kbeads task. Read-only test
      # inputs, not compiled into the binary.
      - "gardenio/helm/gardenio/dashboards/*.json"
      # scif_approval_authz_test.go parses the acme-scif approval portal's Gate-1
      # stamp SOURCE across the module boundary
      # (../../../gardenio/controller/cmd/scif-portal/*.go) and asserts the field
      # keys decideRequestCore writes are EXACTLY the server-side allowlist
      # scifApprovalStampFields — the divergence that 403'd every Gate-1
      # approval (ka-0000001628), and the second instance of the ka-0000004245
      # class. Same staging requirement as the guards above: the test SKIPS
      # cleanly when the sibling is absent, so without this the drift guard
      # would be VACUOUS in the isolated test-kbeads task — decorative, which is
      # exactly how the previous divergences shipped. CI_STRICT_SCIF_PORTAL_GUARD
      # below promotes that skip to a hard fail. The glob (not a single file)
      # also feeds TestScifPortalHasNoOtherBeadWrites, which must see the WHOLE
      # portal package to prove the Gate-1 stamp is its only bead write.
      # Read-only test inputs, not compiled into the binary.
      - "gardenio/controller/cmd/scif-portal/*.go"
    # CI_STRICT_BRIDGE_GUARD promotes the bridge-subset guard's "sibling source
    # not checked out" branch from t.Skip to t.Fatal. Because we now stage
    # bridge/init.go above, that branch should never trigger here — if it does,
    # the filter drifted and the guard silently went vacuous again, exactly the
    # failure ka-0000001411 exists to prevent. Fail loudly instead (ka-0000001411).
    # CI_STRICT_SCIF_PORTAL_GUARD does the same for the acme-scif Gate-1
    # approval-stamp drift guard: we stage cmd/scif-portal/*.go above, so its
    # "sibling source not checked out" branch must never trigger here. If it
    # does, the filter drifted and the guard went vacuous (ka-0000001628).
    # CI_STRICT_DRIFT_GUARD, CI_STRICT_SEED_SHADOW_GUARD and
    # CI_STRICT_CHART_UID_GUARD extend the SAME anti-vacuity net to the other
    # three cross-module drift guards, all of which read gardenio sibling paths
    # staged above and otherwise SKIP (silently green) when those paths are
    # absent — the G2 audit found they had no strict-mode net (ka-0000000322):
    #   - config_driftguard_test.go       -> beadsapi/{projects,roles}.go
    #   - config_seed_shadow_test.go      -> tests/e2e/scripts/*.sh (empty glob)
    #   - charts_grafana_dashboard_uid_disjoint_test.go -> helm dashboards/*.json
    # In test-kbeads those siblings ARE staged, so each guard's skip branch must
    # never trigger; if it does the filter drifted and the guard went vacuous.
    env:
      CI_STRICT_BRIDGE_GUARD: "1"
      CI_STRICT_SCIF_PORTAL_GUARD: "1"
      CI_STRICT_DRIFT_GUARD: "1"
      CI_STRICT_SEED_SHADOW_GUARD: "1"
      CI_STRICT_CHART_UID_GUARD: "1"
    run: |
      cd kbeads
      mkdir -p coverage
      GOWORK=off CGO_ENABLED=0 gotestsum \
        --jsonfile test-results.json \
        --format pkgname \
        -- -short -parallel 8 \
           -covermode=atomic -coverpkg=./... \
           -coverprofile=coverage/unit.out ./...
    outputs:
      filesystem: false
      artifacts:
        - key: kbeads-coverage
          path: kbeads/coverage/unit.out
      test-results:
        - path: kbeads/test-results.json

  # ── Coverage / Patch gate (W2b-2, ka-0000006156) ─────────────────────
  # Spec: docs/research/coverage-phase2b-design.md §4. Consumes:
  #   • coverage.merged.lcov  ← merged in-task from per-component unit LCOVs
  #     (lcov-go gardenio-controller-lcov + kbeads-lcov, test-coop-coverage
  #     coop-unit-lcov). MR-event runs are unit-only; the e2e provenance
  #     is empty — `scripts/coverage/merge.sh` graceful-degrades to
  #     unit-only per W4 exit-criterion #4.
  #   • baselines.json          ← W2b-6 publishes to GitLab generic package
  #                               registry coverage-baselines/latest.
  #   • mr.diff                 ← git diff --unified=0 <merge-base>...HEAD.
  #   • commits.json            ← MR commits via GitLab API (for the
  #                               Coverage-Bypass trailer parser, W2b-5).
  #
  # Deviation from §4.3 spec letter: the spec describes a dispatch wrapper
  # that delegates to .rwx/coverage-patch.yml. We run the gate inline
  # because the per-component LCOVs already exist as artifacts in this
  # very RWX run — dispatching to a sibling RWX run would re-clone, re-
  # toolchain, and re-test the entire repo for no signal gain. The
  # standalone .rwx/coverage-patch.yml workflow remains as the debug /
  # `rwx run` entry point. Same Go binary, same algorithm, same JSON
  # contract for the W2b-3 bot.
  #
  # §4.5 failure-mode handling: every "couldn't compute" branch invokes
  # the binary with --synthetic-bypass=tooling-broken so the gate exits 0
  # while still surfacing the failure in patch-cov-result.json. Missing
  # baselines.json is the one hard-fail case (operator must re-run W2b-6).
  - key: build-coverage-patch
    use: [code, go]
    filter:
      - gardenio/controller/cmd/coverage-patch/**
      - gardenio/controller/internal/coverage/**
      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
    run: |
      set -euo pipefail
      cd gardenio/controller
      GOWORK=off CGO_ENABLED=0 go build -o "$PWD/../../coverage-patch-bin" ./cmd/coverage-patch/
    outputs:
      filesystem: false
      artifacts:
        - key: coverage-patch-bin
          path: coverage-patch-bin

  - key: coverage-patch-merge-tooling
    filter:
      - .rwx/ci.yml
    run: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends lcov
      lcov --version

  - key: coverage-patch
    # code-git (full history + preserved .git) is REQUIRED here: the merge-base
    # + `git diff` steps below need real git history. The shallow, .git-less
    # `code` clone made every run hit the `missing-merge-base` synthetic bypass
    # and pass without evaluating patch coverage (ka-0000002355).
    use: [code-git, coverage-patch-merge-tooling]
    after: [build-coverage-patch, lcov-go, test-coop-coverage]
    cache: false
    env:
      BIN: ${{ tasks.build-coverage-patch.artifacts.coverage-patch-bin }}
      GARDENIO_LCOV: ${{ tasks.lcov-go.artifacts.gardenio-controller-lcov }}
      KBEADS_LCOV: ${{ tasks.lcov-go.artifacts.kbeads-lcov }}
      COOP_LCOV: ${{ tasks.test-coop-coverage.artifacts.coop-unit-lcov }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_CLONE_TOKEN }}
      GITLAB_PROJECT_ID: "12345678"
      COMMIT_SHA: ${{ init.commit-sha }}
      MR_IID: ${{ init.mr-iid }}
      TARGET_BRANCH: ${{ init.target-branch }}
    run: |
      # Keep errexit OFF in this compose-step so a mid-script tooling failure
      # falls through to a synthetic-bypass instead of aborting the task red.
      # NOTE: `set -uo pipefail` does NOT clear an inherited -e — RWX runs the
      # block under errexit, which is why the old `chmod +x "$BIN"` failure
      # aborted in ~3ms before any bypass branch ran (ka-0000004694). Disable
      # it explicitly.
      set +e -uo pipefail
      # The artifact lands on a READ-ONLY mount (/var/mint-artifacts), so an
      # in-place `chmod +x "$BIN"` fails with "Read-only file system". Under
      # RWX's run-block errexit that aborted the whole task in ~3ms — BEFORE
      # any synthetic-bypass branch could run — turning every MR red regardless
      # of the gate result (ka-0000004694). Copy into the writable workspace and
      # make the copy executable instead.
      BIN_RUN="$PWD/coverage-patch-run-bin"
      cp "$BIN" "$BIN_RUN"
      chmod +x "$BIN_RUN"
      BIN="$BIN_RUN"
      API="https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}"
      AUTH=(-H "PRIVATE-TOKEN: ${GITLAB_TOKEN}")

      # ── 1. Stage per-component LCOVs and merge into coverage.merged.lcov ──
      mkdir -p .coverage-raw coverage-out
      cp "$GARDENIO_LCOV" .coverage-raw/controller-unit.lcov
      cp "$KBEADS_LCOV"  .coverage-raw/kbeads-unit.lcov
      cp "$COOP_LCOV"    .coverage-raw/coop-unit.lcov

      LCOV_REASON=""
      if ! ./scripts/coverage/merge.sh \
          --input-dir .coverage-raw \
          --output-dir coverage-out \
          --workspace-root "$PWD" 2>&1 | tee /tmp/merge.log; then
        LCOV_REASON="merge-failed"
      fi
      MERGED="coverage-out/coverage.merged.lcov"
      if [ -z "$LCOV_REASON" ] && { [ ! -s "$MERGED" ] || ! grep -q '^SF:' "$MERGED"; }; then
        LCOV_REASON="empty-merged-lcov"
      fi

      # ── 2. Compute merge-base + diff ──────────────────────────────────
      DIFF_REASON=""
      tb="${TARGET_BRANCH:-main}"
      git fetch --no-tags origin "$tb" 2>/dev/null || true
      MB=$(git merge-base "origin/${tb}" "$COMMIT_SHA" 2>/dev/null || true)
      if [ -z "$MB" ]; then
        DIFF_REASON="missing-merge-base"
        : > mr.diff
      else
        echo "merge-base: $MB"
        if ! git diff --unified=0 "${MB}...${COMMIT_SHA}" > mr.diff 2>/tmp/diff.err; then
          DIFF_REASON="git-diff-failed"
          cat /tmp/diff.err
          : > mr.diff
        fi
      fi

      # ── 3. Fetch MR commits (for bypass-trailer parser) ──────────────
      if [ -n "${MR_IID:-}" ]; then
        if ! curl -sf "${AUTH[@]}" \
              "${API}/merge_requests/${MR_IID}/commits?per_page=100" \
              > commits.json 2>/tmp/commits.err; then
          echo "fetch commits failed (non-fatal): $(cat /tmp/commits.err)"
          echo "[]" > commits.json
        fi
      else
        echo "[]" > commits.json
      fi

      # ── 4. Fetch baselines.json (HARD FAIL on miss per §4.5) ─────────
      BASELINES_URL="${API}/packages/generic/coverage-baselines/latest/baselines.json"
      http_code=$(curl -sS -o baselines.json -w "%{http_code}" "${AUTH[@]}" "$BASELINES_URL")
      if [ "$http_code" != "200" ]; then
        echo "ERROR: baselines.json missing at $BASELINES_URL (HTTP $http_code)"
        echo "       W2b-6 (.rwx/coverage-baselines.yml) must run first."
        rm -f baselines.json
        # Still emit a result.json so the bot can tell the operator what
        # happened. Hard-fail exit 1 below.
        cat > patch-cov-result.json <<'EOF'
      {"schema_version":1,"pass":false,"components":[],"files":[],
       "bypass":null,"error":"baselines.json missing — re-run W2b-6"}
      EOF
        exit 1
      fi

      # ── 5. Run the gate ──────────────────────────────────────────────
      if [ -n "$LCOV_REASON" ] || [ -n "$DIFF_REASON" ]; then
        DETAIL="diff=${DIFF_REASON:-ok} lcov=${LCOV_REASON:-ok}"
        echo "coverage-patch: synthetic bypass — $DETAIL"
        "$BIN" \
          --synthetic-bypass tooling-broken \
          --synthetic-detail "$DETAIL" \
          --output patch-cov-result.json
        exit 0
      fi

      "$BIN" \
        --lcov "$MERGED" \
        --diff mr.diff \
        --baselines baselines.json \
        --commits-json commits.json \
        --output patch-cov-result.json
    outputs:
      artifacts:
        - key: patch-cov-result
          path: patch-cov-result.json
        - key: coverage-merged-lcov-mr
          path: coverage-out/coverage.merged.lcov

  # ── LCOV: Go unit cover profiles → LCOV ──────────────────────────────
  # Consumes the per-module .out artifacts from test-gardenio / test-kbeads,
  # writes per-module .lcov files for the W3 merge job (ka-0000007391) to
  # ingest. Path normalization (SF: prefix rewriting) is the merge job's
  # responsibility, not this task's — see
  # docs/research/coverage-2a-w1-go-emission.md §5.
  - key: lcov-go
    use: [code, gcov2lcov]
    after: [test-gardenio, test-kbeads]
    filter:
      - "scripts/coverage/**"
      - .rwx/ci.yml
    env:
      GARDENIO_COVERAGE_OUT: ${{ tasks.test-gardenio.artifacts.gardenio-coverage }}
      KBEADS_COVERAGE_OUT: ${{ tasks.test-kbeads.artifacts.kbeads-coverage }}
    run: |
      mkdir -p .coverage/unit
      cp "$GARDENIO_COVERAGE_OUT" .coverage/unit/gardenio-controller.out
      cp "$KBEADS_COVERAGE_OUT"  .coverage/unit/kbeads.out
      ./scripts/coverage/emit-go-lcov.sh
    outputs:
      filesystem: false
      artifacts:
        - key: gardenio-controller-lcov
          path: .coverage/unit/gardenio-controller.lcov
        - key: kbeads-lcov
          path: .coverage/unit/kbeads.lcov


  # ── Test + build dictation-corpus tool ───────────────────────────────
  # Small Go tool under scripts/build-dictation-corpus/ — no external deps
  # beyond the stdlib, so this task covers both build and unit tests.
  - key: test-dictation-corpus
    use: [code, go]
    filter:
      - "scripts/build-dictation-corpus/**"
    run: |
      cd scripts/build-dictation-corpus
      GOWORK=off go vet ./...
      GOWORK=off go test -count=1 ./...
      GOWORK=off CGO_ENABLED=0 go build -v ./...
    outputs:
      filesystem: false

  # ── Test coop ────────────────────────────────────────────────────────
  # Reuse compiled artifacts from build-coop so cargo test only compiles
  # test harnesses instead of rebuilding every crate from scratch (~3min saved).
  - key: test-coop
    use: build-coop
    filter:

  # ── terraform validate + fmt-check catch-all GATE (ka-0000002920) ──────────
  # Hermetic, credless, cluster-free per-MR gate over EVERY terraform root under
  # gardenio/terraform/. The sibling *-tf gates below are targeted (specific
  # modules, with `terraform test`); this is the broad belt that (a) `fmt -check`
  # -recursive the whole tree so no unformatted HCL lands, and (b) discovers
  # every directory containing .tf files DYNAMICALLY and runs
  # `terraform init -backend=false && terraform validate` on each — so a new
  # root/module added later is covered automatically, no CI edit required.
  #
  # `init -backend=false` downloads providers from the public registry but
  # contacts no backend and no AWS/GitLab; `validate` proves the HCL, variable
  # validations, and provider requirements compile. No plan, no apply, no creds.
  # A shared TF_PLUGIN_CACHE_DIR downloads each provider once and reuses it
  # across all roots within the run.
  #
  # Child modules that declare `configuration_aliases` (e.g. modules/s3-replication,
  # which needs the caller to pass an aliased `aws.dr` provider) CANNOT be
  # validated in isolation — terraform errors "Provider configuration not
  # present". They are skipped here and instead validated transitively through
  # the composition that instantiates them (canonical-prod passes them the
  # aliased provider and is validated as a root above).
  - key: test-terraform-roots
    use: code
    filter:
      - "gardenio/terraform/**"
    run: |
      if ! command -v terraform >/dev/null 2>&1; then
        curl -fsSL https://releases.hashicorp.com/terraform/1.11.3/terraform_1.11.3_linux_amd64.zip -o /tmp/tf.zip
        sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
      fi
      export TF_PLUGIN_CACHE_DIR="$PWD/.tf-plugin-cache"
      mkdir -p "$TF_PLUGIN_CACHE_DIR"
      # (a) formatting — one recursive pass over the entire tree.
      terraform fmt -check -recursive gardenio/terraform
      # (b) validate every root (dir with .tf files), skipping child modules that
      #     declare configuration_aliases (validated via their caller composition).
      fail=0
      while IFS= read -r d; do
        if grep -lq 'configuration_aliases' "$d"/*.tf 2>/dev/null; then
          echo "SKIP (configuration_aliases; validated via caller): $d"
          continue
        fi
        echo "== validate: $d =="
        if ! ( cd "$d" && terraform init -backend=false -input=false -no-color >/dev/null && terraform validate -no-color ); then
          echo "VALIDATE FAILED: $d"
          fail=1
        fi
      done < <(find gardenio/terraform -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u)
      if [ "$fail" -ne 0 ]; then
        echo "terraform validate failed for one or more roots" >&2
        exit 1
      fi
    outputs:
      filesystem: false

  # ── release-closure control-plane EXCLUSION GATE (bug ka-0000007293) ────────
  # Structural gate: `module.eks.aws_eks_cluster.this` (and the nodegroup, the
  # managed addons, the OIDC provider) MUST NOT be reachable from the release
  # deploy's `-target=module.gardenio` seeds on composition/canonical-prod.
  #
  # WHY THIS EXISTS. `-target` applies the targeted objects AND EVERYTHING THEY
  # DEPEND ON, and terraform builds those edges from STATIC references — so a
  # single `module.eks.cluster_endpoint` wired into a provider block silently
  # drags the whole prod control plane into the unattended release apply, where
  # every argument of it (log types, access_config, public-access CIDRs,
  # encryption, upgrade policy, tags) is reconciled with nobody watching. That
  # was the live shape until ka-0000007293: eks_identity.tf now reads those
  # attributes back through `data.aws_eks_cluster.identity`, keyed on the
  # pure-var-derived cluster NAME. MEASURED with `terraform graph`: the closure
  # went 89 nodes / 63 managed resources with the cluster IN, to 79 / 56 with the
  # whole control plane OUT.
  #
  # Nothing in the type system keeps it that way — the regression is one
  # innocuous-looking reference away and produces no error, just a bigger
  # closure. So re-measure it per MR. The graph is derived from the CODE, so
  # this needs no plan and no AWS credentials — but unlike `terraform validate`,
  # `terraform graph` refuses to run against an uninitialized backend, and this
  # root declares `backend "s3" {}`. A throwaway `*_override.tf` swaps in the
  # local backend for the duration of the task (override files MERGE over the
  # config, so nothing in the repo changes) — no S3, no DynamoDB, no state read.
  # The classifier exits 4 if any asserted address is inside the closure.
  - key: test-release-closure-excludes-control-plane
    use: code
    filter:
      - "gardenio/terraform/composition/canonical-prod/**"
      - "gardenio/terraform/modules/**"
      - "scripts/classify-release-closure-drift.py"
    run: |
      if ! command -v terraform >/dev/null 2>&1; then
        curl -fsSL https://releases.hashicorp.com/terraform/1.11.3/terraform_1.11.3_linux_amd64.zip -o /tmp/tf.zip
        sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
      fi
      REPO_ROOT="$PWD"
      cd gardenio/terraform/composition/canonical-prod
      printf 'terraform {\n  backend "local" {}\n}\n' > zz_ci_backend_override.tf
      trap 'rm -f "$REPO_ROOT/gardenio/terraform/composition/canonical-prod/zz_ci_backend_override.tf"' EXIT
      terraform init -reconfigure -input=false -no-color >/dev/null
      terraform graph -no-color > /tmp/canonical-prod.dot
      cd "$REPO_ROOT"
      python3 scripts/classify-release-closure-drift.py \
        --graph /tmp/canonical-prod.dot \
        --target module.gardenio \
        --assert-outside module.eks.aws_eks_cluster.this \
        --assert-outside module.eks.aws_eks_node_group.this \
        --assert-outside module.eks.aws_eks_addon.this \
        --assert-outside module.eks.aws_eks_addon.network \
        --assert-outside module.eks.aws_iam_openid_connect_provider.this
    outputs:
      filesystem: false


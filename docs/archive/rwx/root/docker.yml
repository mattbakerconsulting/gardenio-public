      crane mutate "${REPO}@${DIGEST}" --entrypoint /grafana-bridge --user nobody --label "org.opencontainers.image.revision=${COMMIT_SHA}" --label "org.opencontainers.image.ref.name=${REF_NAME}" -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG}"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}


  # ── Build grafana-assistant-plugin dist (C4 ka-0000007568, Path C) ──
  # Compile the custom in-repo Grafana app plugin
  # (gardenio/grafana-plugins/gardenio-assistant-app) to dist/ here, where npm
  # has network — so the runtime initContainer that seeds it into Grafana's
  # plugins dir is a pure `cp` with zero off-cluster egress. Output a tarball
  # of dist/ that push-grafana-assistant-plugin crane-appends at /plugin.
  - key: build-grafana-assistant-plugin
    use: [code]
    # No `ref-name != 'pr'` guard: compile the plugin dist on PRs/MRs too, so a
    # broken webpack/tsc/eslint OR Go build is caught pre-merge (like
    # build-go-binaries/-coop/-kd) rather than only red-lining the main-push
    # pipeline. The PUSH task below stays gated off PRs — PRs validate the build
    # but publish nothing.
    if: ${{ init.build-target == 'all' }}
    # npm install (~1300 packages) + a Go cross-compile of the SDK-backed plugin
    # backend (ka-0000000293) on a cold module cache need more than the old 15m.
    timeout: 25m
    # npm install is a heavy data mover; the Go build adds the SDK module graph.
    agent:
      cpus: 4
      memory: 8gb
    filter:
      - gardenio/grafana-plugins/gardenio-assistant-app
      # Source the same Node pin as the runtime agent image so a bump in
      # versions.env/checksums.env propagates here too (no silent drift).
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
    run: |
      set -ex
      # Pin Node 24 to match the plugin's verified toolchain (engines.node>=22,
      # packageManager npm@11.12.1). Source the SAME pin files the runtime
      # agent image uses (gardenio/images/agent/install/node.sh sources these
      # too), so the CI plugin builder and the agent image stay byte-locked on
      # Node version + sha256 — no duplicate literals that could silently drift
      # on a future bump. Still self-contained: no cross-task dependency on the
      # agent-install-node layer (we read the env files, not its install
      # output). Checksum verification before unpack hardens against an
      # out-of-band swap of the upstream tarball (ka-0000006289 finding 4).
      # The runtime egress envelope is untouched — this only hardens the
      # ephemeral CI-builder lane.
      source gardenio/images/agent/install/versions.env
      source gardenio/images/agent/install/checksums.env
      curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v${NODE_FULL_VERSION}/node-v${NODE_FULL_VERSION}-linux-x64.tar.xz"
      echo "${NODE_SHA256_X64}  /tmp/node.tar.xz" | sha256sum -c -
      sudo tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      rm -f /tmp/node.tar.xz
      node --version && npm --version

      # Go toolchain for the plugin BACKEND (ka-0000000293). Reuse GO_FULL_VERSION
      # from versions.env (sourced above) so the CI builder stays byte-locked on
      # the same Go pin the agent image uses — no duplicate literal to drift. The
      # backend is a tiny MCP reverse-proxy built with mage (the Grafana SDK build
      # target), exactly as plugin.json's `executable` expects.
      curl -fsSL -o /tmp/go.tar.gz "https://go.dev/dl/go${GO_FULL_VERSION}.linux-amd64.tar.gz"
      sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tar.gz
      rm -f /tmp/go.tar.gz
      export PATH="/usr/local/go/bin:${PATH}"
      go version

      cd gardenio/grafana-plugins/gardenio-assistant-app
      # .npmrc pins ignore-scripts=true (supply-chain hardening); npm honours it.
      npm ci
      npm run build
      # plugin.json is what Grafana keys plugin discovery on — fail loudly if the
      # build did not emit it rather than ship an empty layer.
      test -f dist/plugin.json

      # Build the Go backend into dist/ (mage build:linux -> amd64, matching the
      # prod grafana nodeSelector). GOWORK=off keeps this an isolated module
      # build (the repo go.work would otherwise pull it into the workspace).
      GOWORK=off go run github.com/magefile/mage@v1.15.0 build:linux
      # The arch-suffixed gpx_ binary is what Grafana spawns as the plugin
      # backend; the chart initContainer asserts it before seeding, so fail the
      # build here if mage did not emit it.
      test -f dist/gpx_gardenio_assistant_app_linux_amd64

      tar -czf /tmp/assistant-plugin-dist.tar.gz -C dist .
    outputs:
      artifacts:
        - key: assistant-plugin-dist
          path: /tmp/assistant-plugin-dist.tar.gz

  # ── Push grafana-assistant-plugin (C4 ka-0000007568, Path C) ────────
  # Dist-only artifact image: ships the compiled plugin at /plugin on a
  # shell-bearing ubuntu base so the Grafana pod's copy-only initContainer
  # (sh -c 'cp -r /plugin/. ...') can seed it. No entrypoint — never run as a
  # server. The image carries the standard provenance label so promote.yml's
  # build-vs-tag gate covers it like every other gardenio image.
  - key: push-grafana-assistant-plugin
    use: [build-grafana-assistant-plugin, install-crane]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    cache: false
    run: |
      set -ex
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"
      else
        TAG="${REF_NAME}"
      fi

      mkdir -p /tmp/layer/plugin
      tar -xzf ${{ tasks.build-grafana-assistant-plugin.artifacts.assistant-plugin-dist }} -C /tmp/layer/plugin
      # Sanity: the layer must carry plugin.json AND the gpx_ backend binary
      # (matches the initContainer's pre-copy assertions + the Dockerfile RUN
      # test). The backend is load-bearing — without it the chat box falls back
      # to the broken embedded MCP path (ka-0000000293).
      test -f /tmp/layer/plugin/plugin.json
      test -f /tmp/layer/plugin/gpx_gardenio_assistant_app_linux_amd64
      tar -cf /tmp/layer.tar -C /tmp/layer .

      REPO="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}/grafana-assistant-plugin"
      crane append --base ubuntu:24.04 --new_tag "${REPO}:${TAG}" --new_layer /tmp/layer.tar --platform linux/amd64
      DIGEST=$(crane digest "${REPO}:${TAG}")
      crane mutate "${REPO}@${DIGEST}" --user nobody --label "org.opencontainers.image.revision=${COMMIT_SHA}" --label "org.opencontainers.image.ref.name=${REF_NAME}" -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG}"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}


  # ── Build grafana-llm-app-plugin dist (C6/prod prereq ka-0000007541) ─
  # Download + CHECKSUM-VERIFY the PINNED grafana-llm-app foundation plugin here,
  # where the builder has network — so the runtime initContainer that seeds it
  # into Grafana's plugins dir is a pure `cp` with ZERO off-cluster egress. This
  # is what lets PROD run with grafana.plugins.allowCatalogEgress:FALSE under
  # default-deny-egress (boot-time catalog install would otherwise force a
  # 0.0.0.0/0:443 hole on the grafana-egress NetworkPolicy). Output a tarball of
  # the dist that push-grafana-llm-app-plugin crane-appends at /plugin. Mirrors
  # build-grafana-assistant-plugin (C4); difference: pinned UPSTREAM artifact
  # (download + verify) rather than an in-repo compile.
  - key: build-grafana-llm-app-plugin
    use: [code]
    # No `ref-name != 'pr'` guard: download + verify on PRs/MRs too, so a broken
    # pin (404 / checksum drift) is caught pre-merge rather than only red-lining
    # the main-push pipeline. The PUSH task below stays gated off PRs.
    if: ${{ init.build-target == 'all' }}
    timeout: 10m

  # ═══════════════════════════════════════════════════════════════════════
  # Agent image — 8 parallel cached install tasks + 1 assembly task.
  # Each install task filters on its own .rwx/agent-*.lock file so only
  # the relevant cache is busted when a version changes.
  #
  # MONOREPO CHANGE: coop and kd come from build-coop and build-kd tasks
  # (built from source) instead of download-coop and download-kd
  # (downloaded from GitHub releases).
  # ═══════════════════════════════════════════════════════════════════════

  # ── System packages: apt-get + dpkg copy + shared libs ──────────────
  - key: agent-install-syspackages
    use: [code]
    timeout: 10m
    # Heavy data mover: apt-get + dpkg unpack of ~150 packages, then a sweep
    # over /usr/lib to collect transitive shared libs. Bigger agent + tmpfs
    # makes the apt unpack and copy loop noticeably faster.
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/.rwx/agent-syspackages.lock
      - gardenio/images/agent/install/versions.env
    run: |
      set -e
      export DEBIAN_FRONTEND=noninteractive
      source gardenio/images/agent/install/versions.env

      OUT=/tmp/syspackages
      mkdir -p $OUT/usr/local/bin $OUT/usr/bin $OUT/etc

      # Snapshot pre-install state for auto-resolution of transitive deps
      dpkg-query -W -f '${Package}\n' | sort > /tmp/before.txt

      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends $BASE_PACKAGES $AGENT_PACKAGES

      # Auto-resolve: capture newly installed packages (transitive deps like
      # postgresql-client-16 that aren't listed explicitly).
      dpkg-query -W -f '${Package}\n' | sort > /tmp/after.txt
      TRANSITIVE_PACKAGES=$(comm -13 /tmp/before.txt /tmp/after.txt)

      # Build complete package list: explicit packages + transitive deps.
      # CRITICAL: The RWX runner may have some packages pre-installed (git,
      # curl, jq, sudo, etc.) — these won't appear in the before/after diff
      # but MUST be copied since the ubuntu:24.04 base image lacks them.
      ALL_PACKAGES=$(echo "$BASE_PACKAGES $AGENT_PACKAGES $TRANSITIVE_PACKAGES" | tr ' ' '\n' | sort -u)

      # Extract all files from all required packages
      for pkg in $ALL_PACKAGES; do
        dpkg -L "$pkg" 2>/dev/null | while read -r f; do
          [ -e "$f" ] || continue
          [ -d "$f" ] && { mkdir -p "$OUT$f"; continue; }
          mkdir -p "$OUT$(dirname "$f")" && cp -a "$f" "$OUT${f}" 2>/dev/null || true
        done || true
      done

      # Resolve shared library deps for all binaries via ldd
      for pkg in $ALL_PACKAGES; do
        dpkg -L "$pkg" 2>/dev/null | grep -E '^/usr/(s?bin|local/bin)/' | while read -r bin; do
          [ -f "$bin" ] && [ -x "$bin" ] || continue
          ldd "$bin" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read -r lib; do
            [ -f "$lib" ] || continue
            mkdir -p "$OUT$(dirname "$lib")"
            cp -n "$lib" "$OUT${lib}" 2>/dev/null || true
          done || true
        done || true
      done

      # gcc internals
      find /usr/libexec/gcc -name 'cc1*' -o -name 'lto1' 2>/dev/null | while read -r bin; do
        ldd "$bin" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read -r lib; do
          [ -f "$lib" ] || continue
          mkdir -p "$OUT$(dirname "$lib")"
          cp -n "$lib" "$OUT${lib}" 2>/dev/null || true
        done || true
      done || true

      # ICU, headers, misc libs
      find /usr/lib/x86_64-linux-gnu -name 'libicu*.so*' 2>/dev/null | while read -r f; do
        mkdir -p "$OUT$(dirname "$f")" && cp -a "$f" "$OUT${f}" 2>/dev/null || true
      done || true
      [ -d /usr/include/unicode ] && mkdir -p $OUT/usr/include/unicode && cp -a /usr/include/unicode/* $OUT/usr/include/unicode/ 2>/dev/null || true
      for d in /usr/include/c++/14 /usr/include/c++/13; do
        if [ -d "$d" ]; then
          mkdir -p "$OUT$d" && cp -a "$d"/* "$OUT$d/" 2>/dev/null || true
          td="/usr/include/x86_64-linux-gnu/c++/$(basename $d)"
          [ -d "$td" ] && mkdir -p "$OUT$td" && cp -a "$td"/* "$OUT$td/" 2>/dev/null || true
          break
        fi
      done
      find /usr/lib/x86_64-linux-gnu/pkgconfig -name 'icu*.pc' 2>/dev/null | while read -r f; do
        mkdir -p "$OUT$(dirname "$f")" && cp "$f" "$OUT${f}" 2>/dev/null || true
      done || true
      cp -r /usr/lib/git-core $OUT/usr/lib/ 2>/dev/null || true
      [ -d /usr/libexec/gcc ] && mkdir -p $OUT/usr/libexec && cp -r /usr/libexec/gcc $OUT/usr/libexec/ 2>/dev/null || true
      for bin in /usr/bin/x86_64-linux-gnu-as /usr/bin/x86_64-linux-gnu-ld /usr/bin/as /usr/bin/ld; do
        [ -f "$bin" ] || continue
        ldd "$bin" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read -r lib; do
          [ -f "$lib" ] || continue
          mkdir -p "$OUT$(dirname "$lib")" && cp -n "$lib" "$OUT${lib}" 2>/dev/null || true
        done || true
      done
      for script in /usr/lib/x86_64-linux-gnu/libc.so /usr/lib/x86_64-linux-gnu/libm.so; do
        [ -f "$script" ] || continue
        grep -oP '/lib/x86_64-linux-gnu/\S+' "$script" 2>/dev/null | tr -d ')' | while read -r ref; do
          [ -f "$OUT$ref" ] && continue
          src="/usr${ref}"; [ -f "$src" ] || src="$ref"; [ -f "$src" ] || continue
          mkdir -p "$OUT$(dirname "$ref")" && cp "$src" "$OUT$ref" 2>/dev/null || true
        done || true
      done
      find /usr/lib/x86_64-linux-gnu -name 'libcurl-gnutls*' 2>/dev/null | while read -r f; do
        mkdir -p "$OUT$(dirname "$f")" && cp -a "$f" "$OUT${f}" 2>/dev/null || true
      done || true
      ln -sf python3 $OUT/usr/bin/python
      ln -sf gcc $OUT/usr/bin/cc

      # Compilation support files: CRT objects, static archives, and linker scripts.
      # These are NOT binaries so ldd sweeps miss them, and dpkg -L may skip them
      # if the package was pre-installed on the RWX runner. Copy them explicitly.
      echo "=== Copying compilation support files ==="
      LIBDIR=/usr/lib/x86_64-linux-gnu
      for f in $LIBDIR/crt1.o $LIBDIR/crti.o $LIBDIR/crtn.o $LIBDIR/Scrt1.o \
               $LIBDIR/libc_nonshared.a $LIBDIR/libmvec_nonshared.a \
               $LIBDIR/libpthread_nonshared.a $LIBDIR/libc.so $LIBDIR/libm.so; do
        if [ -f "$f" ]; then
          mkdir -p "$OUT$(dirname "$f")" && cp -a "$f" "$OUT$f"
          echo "  copied: $f"
        fi
      done
      # GCC support files (crtbegin.o, crtend.o, libgcc*.a, specs, etc.)
      for d in /usr/lib/gcc/x86_64-linux-gnu/14 /usr/lib/gcc/x86_64-linux-gnu/13; do
        if [ -d "$d" ]; then
          mkdir -p "$OUT$d" && cp -a "$d"/* "$OUT$d/"
          echo "  copied: $d/* (gcc support)"
          break
        fi
      done

      # Verify critical linker files are present
      LINK_FAILURES=0
      for f in crt1.o crti.o crtn.o libc.so libc_nonshared.a; do
        if [ ! -f "$OUT$LIBDIR/$f" ]; then
          echo "FAIL: missing linker file $LIBDIR/$f"
          LINK_FAILURES=$((LINK_FAILURES + 1))
        fi
      done
      for f in crtbegin.o crtend.o libgcc.a; do
        found=""
        for d in $OUT/usr/lib/gcc/x86_64-linux-gnu/14 $OUT/usr/lib/gcc/x86_64-linux-gnu/13; do
          [ -f "$d/$f" ] && found=1 && break
        done
        if [ -z "$found" ]; then
          echo "FAIL: missing gcc file $f"
          LINK_FAILURES=$((LINK_FAILURES + 1))
        fi
      done
      if [ "$LINK_FAILURES" -gt 0 ]; then
        echo "FATAL: $LINK_FAILURES linker support files missing — cannot produce working image"
        exit 1
      fi
      echo "  all linker support files present"

      # CA certificates: dpkg -L misses files generated by post-install hooks.
      # Include the generated bundle, individual cert symlinks, and config.
      mkdir -p "$OUT/etc/ssl/certs" "$OUT/usr/local/share/ca-certificates"
      cp -a /etc/ssl/certs/ca-certificates.crt "$OUT/etc/ssl/certs/" 2>/dev/null || true
      cp -a /etc/ssl/certs/*.pem "$OUT/etc/ssl/certs/" 2>/dev/null || true
      cp -a /etc/ca-certificates.conf "$OUT/etc/" 2>/dev/null || true

      sudo tar -czf syspackages.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer — validate-agent and push-agent unpack
      # syspackages.tar.gz directly, never touch this task's filesystem.
      filesystem: false
      artifacts:
        - key: syspackages-tar
          path: syspackages.tar.gz

  # ── Node.js + Claude Code (agent layer) ────────────────────────────
  - key: agent-install-node
    use: [code]
    timeout: 10m
    # Heavy data mover: downloads Node + npm-installs Claude Code.
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/images/agent/install/node.sh
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
      - gardenio/images/agent/install/lib.sh
      - gardenio/.rwx/agent-node.lock
    run: |
      set -e
      OUT=/tmp/node-layer
      mkdir -p $OUT/usr/local

      INSTALL_PREFIX=$OUT/usr/local TARGETARCH=amd64 \
        bash gardenio/images/agent/install/node.sh

      tar -czf node.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer (see syspackages note).
      filesystem: false
      artifacts:
        - key: node-tar
          path: node.tar.gz

  # ── Playwright + Chromium + Chrome + system deps (cached separately) ──
  # NOTE: installs its own Node.js to avoid depending on agent-install-node,
  # which would serialize these two tasks. This saves ~2-3 min on the critical path.
  - key: agent-install-playwright
    use: [code]
    timeout: 10m
    # Heavy data mover: downloads Chromium (~150MB), Chrome (~120MB), and
    # writes ~500MB of browser bundle data into the layer dir.
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/images/agent/install/playwright.sh
      - gardenio/images/agent/install/node.sh
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
      - gardenio/images/agent/install/lib.sh
      - gardenio/.rwx/agent-playwright.lock
    run: |
      set -e
      export DEBIAN_FRONTEND=noninteractive
      source gardenio/images/agent/install/versions.env
      OUT=/tmp/playwright-layer

      # Install our own Node.js (avoids sequential dep on agent-install-node)
      mkdir -p /tmp/node-root/usr/local
      INSTALL_PREFIX=/tmp/node-root/usr/local TARGETARCH=amd64 \
        bash gardenio/images/agent/install/node.sh
      export PATH="/tmp/node-root/usr/local/bin:$PATH"

      mkdir -p $OUT/usr/local

      # Playwright + MCP server (version from versions.env)
      npm install -g --prefix $OUT/usr/local playwright@${PLAYWRIGHT_VERSION} @playwright/mcp

      # Playwright system deps (from versions.env)
      # Snapshot pre-install state for auto-resolution
      dpkg-query -W -f '${Package}\n' | sort > /tmp/pw-before.txt
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends $PLAYWRIGHT_SYSTEM_DEPS
      dpkg-query -W -f '${Package}\n' | sort > /tmp/pw-after.txt
      PW_NEW_PACKAGES=$(comm -13 /tmp/pw-before.txt /tmp/pw-after.txt)

      # Auto-resolve: copy all files from newly installed packages
      for pkg in $PW_NEW_PACKAGES; do
        dpkg -L "$pkg" 2>/dev/null | while read -r f; do
          [ -e "$f" ] || continue
          [ -d "$f" ] && { mkdir -p "$OUT$f"; continue; }
          mkdir -p "$OUT$(dirname "$f")" && cp -a "$f" "$OUT${f}" 2>/dev/null || true
        done || true
      done
      # Explicit glob for Chromium-critical .so files (symlinks + versioned targets)
      for pattern in libnspr4 libnss3 libnssutil3 libsmime3 libssl3 libplc4 libplds4 \
          libasound libatk-1 libatk-bridge libatspi libcairo libcups libdbus-1 \
          libdrm libgbm libglib-2 libgobject-2 libpango-1 libX11 libxcb \
          libXcomposite libXdamage libXext libXfixes libxkbcommon libXrandr \
          libfontconfig libfreetype libsqlite3 libavahi; do
        for f in /usr/lib/x86_64-linux-gnu/${pattern}*; do
          [ -e "$f" ] || continue
          mkdir -p "$OUT$(dirname "$f")"
          cp -a "$f" "$OUT$f" 2>/dev/null || true
        done
      done
      # Transitive deps via ldd on key shared libraries.
      # Use cp -L (dereference symlinks) so we copy the actual .so file, not a
      # symlink whose target (e.g. libgssapi_krb5.so.2.2) may not be in this layer.
      # Without -L, dangling symlinks overwrite the real file from syspackages
      # during assembly, breaking curl (and thus entrypoint nudges).
      for bin in /usr/lib/x86_64-linux-gnu/libcairo.so* /usr/lib/x86_64-linux-gnu/libpango*.so* \
          /usr/lib/x86_64-linux-gnu/libgdk*.so* /usr/lib/x86_64-linux-gnu/libgtk*.so* \
          /usr/lib/x86_64-linux-gnu/libnss3.so* /usr/lib/x86_64-linux-gnu/libcups.so*; do
        [ -f "$bin" ] || continue
        ldd "$bin" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read -r lib; do
          [ -e "$lib" ] || continue
          mkdir -p "$OUT$(dirname "$lib")" && cp -L "$lib" "$OUT${lib}" 2>/dev/null || true
        done || true
      done

      # Install Chromium browser (managed by Playwright).
      # Install for both the standalone playwright and the @playwright/mcp bundled
      # version — they may expect different chromium revisions.
      PLAYWRIGHT_BROWSERS_PATH=$OUT/ms-playwright npx playwright install chromium
      PLAYWRIGHT_BROWSERS_PATH=$OUT/ms-playwright npx --package=@playwright/mcp playwright install chromium
      chmod -R 777 $OUT/ms-playwright

      # Install Google Chrome Stable (system browser at /opt/google/chrome/chrome).
      # This is required for playwright-mcp --browser chrome --headless.
      curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
        | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
      echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
        | sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
      sudo apt-get -y update
      sudo apt-get -y install --no-install-recommends google-chrome-stable
      # Copy Chrome and its dpkg-installed files to the layer
      dpkg -L google-chrome-stable 2>/dev/null | while read -r f; do
        [ -e "$f" ] || continue
        [ -d "$f" ] && { mkdir -p "$OUT$f"; continue; }
        mkdir -p "$OUT$(dirname "$f")" && cp -a "$f" "$OUT${f}" 2>/dev/null || true
      done || true

      # Final ldd sweep: resolve ALL shared libs needed by installed browser binaries.
      # Use cp -L to dereference symlinks (same rationale as the transitive deps sweep).
      for bin in $(find $OUT/ms-playwright -name chrome -type f -executable 2>/dev/null) \
                 /opt/google/chrome/chrome; do
        [ -f "$bin" ] || continue
        ldd "$bin" 2>/dev/null | grep "=> /" | awk '{print $3}' | while read -r lib; do
          [ -e "$lib" ] || continue
          [ -e "$OUT$lib" ] && continue
          mkdir -p "$OUT$(dirname "$lib")" && cp -L "$lib" "$OUT${lib}" 2>/dev/null || true
        done || true
      done

      # Build fontconfig cache so chromium can discover fonts at runtime.
      # dpkg -L copies fonts.conf and conf.d/ but not the generated cache.
      FONTCONFIG_SYSROOT=$OUT fc-cache -f 2>/dev/null || true

      tar -czf playwright.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer (see syspackages note). Big win here — the
      # Chromium install adds ~500MB to the layer that nobody reads.
      filesystem: false
      artifacts:
        - key: playwright-tar
          path: playwright.tar.gz

  # ── Go toolchain (agent layer) ─────────────────────────────────────
  - key: agent-install-go
    use: [code]
    timeout: 10m
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/images/agent/install/go-tools.sh
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
      - gardenio/images/agent/install/lib.sh
      - gardenio/.rwx/agent-go.lock
    run: |
      set -e
      OUT=/tmp/go-layer
      mkdir -p $OUT/usr/local/bin

      INSTALL_PREFIX=$OUT/usr/local TARGETARCH=amd64 \
        bash gardenio/images/agent/install/go-tools.sh

      # Strip debug symbols from Go toolchain binaries — saves ~50MB
      find $OUT -type f -executable | xargs strip --strip-debug 2>/dev/null || true
      tar -czf go.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer (see syspackages note).
      filesystem: false
      artifacts:
        - key: go-tar
          path: go.tar.gz

  # ── Rust toolchain (agent layer) ───────────────────────────────────
  - key: agent-install-rust
    use: [code]
    timeout: 10m
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/images/agent/install/rust-tools.sh
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
      - gardenio/images/agent/install/lib.sh
      - gardenio/.rwx/agent-rust.lock
    run: |
      set -e
      OUT=/tmp/rust-layer
      mkdir -p $OUT/usr/local/bin

      sudo apt-get update && sudo apt-get install -y gcc libc6-dev pkg-config libssl-dev

      INSTALL_PREFIX=$OUT/usr/local \
        bash gardenio/images/agent/install/rust-tools.sh

      # Strip debug symbols from Rust toolchain:
      #   binaries (rustc, cargo, etc.) — saves ~50MB
      #   stdlib rlibs — DWARF debug info in each .rlib, saves ~200-300MB
      find $OUT/usr/local/bin $OUT/usr/local/cargo/bin -type f -executable \
        | xargs strip --strip-debug 2>/dev/null || true
      find $OUT -name '*.rlib' | xargs strip --strip-debug 2>/dev/null || true
      tar -czf rust.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer (see syspackages note).
      filesystem: false
      artifacts:
        - key: rust-tar
          path: rust.tar.gz

  # ── CLI tools (agent layer) — downloads only, no heavy compilation ─
  - key: agent-install-clis
    use: [code]
    timeout: 10m
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/images/agent/install/clis.sh
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
      - gardenio/images/agent/install/lib.sh
      - gardenio/.rwx/agent-clis.lock
    run: |
      set -e
      OUT=/tmp/clis-layer
      mkdir -p $OUT/usr/local/bin $OUT/opt

      # Skip whisper-cli here — it builds in agent-install-whisper (parallel).
      # PG17_DEST pins the baked pg17 client under $OUT/opt/pg17 so it is
      # captured by `tar -C $OUT` and lands at /opt/pg17 in the final image —
      # matching the Dockerfile's `COPY --from=cli-tools /opt/`. Without this
      # override clis.sh would write to the absolute /opt/pg17 on the runner,
      # which this artifact-only task does not capture (ka-0000003862).
      SKIP_WHISPER=1 INSTALL_PREFIX=$OUT/usr/local PG17_DEST=$OUT/opt/pg17 TARGETARCH=amd64 \
        bash gardenio/images/agent/install/clis.sh

      # AWS CLI installs to /opt by default, move to output if needed
      if [ -d /opt/aws-cli ] && [ ! -d "$OUT/opt/aws-cli" ]; then
        cp -r /opt/aws-cli $OUT/opt/
      fi

      sudo tar -czf clis.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer (see syspackages note).
      filesystem: false
      artifacts:
        - key: clis-tar
          path: clis.tar.gz

  # ── whisper-cli (cmake compilation, isolated parallel task) ────────
  - key: agent-install-whisper
    use: [code]
    timeout: 10m
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
      - gardenio/images/agent/install/lib.sh
      - gardenio/.rwx/agent-clis.lock
    run: |
      set -e
      source gardenio/images/agent/install/versions.env
      source gardenio/images/agent/install/checksums.env
      source gardenio/images/agent/install/lib.sh
      OUT=/tmp/whisper-layer
      mkdir -p $OUT/usr/local/bin

      sudo apt-get update && sudo apt-get install -y cmake gcc g++ make

      fetch_verify_stdout \
        "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v${WHISPER_CPP_VERSION}.tar.gz" \
        "${WHISPER_CPP_SHA256}" \
        | tar -xz -C /tmp
      cmake -S "/tmp/whisper.cpp-${WHISPER_CPP_VERSION}" -B /tmp/whisper-build \
        -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
      cmake --build /tmp/whisper-build --config Release -j"$(nproc)" --target whisper-cli
      cp /tmp/whisper-build/bin/whisper-cli $OUT/usr/local/bin/whisper-cli
      rm -rf /tmp/whisper.cpp-* /tmp/whisper-build

      tar -czf whisper.tar.gz -C $OUT .
    outputs:
      # Artifact-only producer (see syspackages note).
      filesystem: false
      artifacts:
        - key: whisper-tar
          path: whisper.tar.gz

  # ── Terraform provider cache (pre-downloaded providers) ───────────────
  - key: agent-install-terraform-providers
    use: [code, agent-install-clis]
    timeout: 5m
    filter:
      - gardenio/images/agent/install/terraform-providers.sh
      - gardenio/images/agent/install/versions.env
      - gardenio/.rwx/agent-terraform-providers.lock
      # The prewarm sanity check runs inline below; re-trigger the layer build
      # when the check itself changes so a regression in it can't go unexercised.
      - gardenio/tests/e2e/scripts/test-terraform-prewarm-cache.sh
    run: |
      set -e
      OUT=/tmp/tf-providers-layer
      mkdir -p $OUT/opt/terraform-plugin-cache $OUT/opt/terragrunt-cache

      # Unpack clis layer to get the terraform binary
      CLIS_DIR=/tmp/clis-extract
      mkdir -p $CLIS_DIR
      tar -xzf ${{ tasks.agent-install-clis.artifacts.clis-tar }} -C $CLIS_DIR

      # Run the provider cache script using the extracted terraform
      TERRAFORM_BIN=$CLIS_DIR/usr/local/bin/terraform \
      TF_PLUGIN_CACHE_DIR=$OUT/opt/terraform-plugin-cache \
        bash gardenio/images/agent/install/terraform-providers.sh

      # ── PREWARM sanity check (ka-0000002834) ──────────────────────────────
      # The prewarm exists so a `terragrunt init` during EKS provisioning finds
      # ~700 MB of providers already on disk instead of re-fetching them. Assert
      # here — the one place a terraform binary AND the freshly-built cache both
      # exist — that the cache is non-empty, has one binary per declared provider
      # at the versions.env-pinned version, clears a size floor, AND is actually
      # CONSUMED (terraform serves a provider "from the shared cache directory").
      # This catches the silent-empty-cache regression class the bead flagged
      # BEFORE the layer is tarred into the agent image. Hard gate: `set -e`
      # above fails the build if the test exits non-zero.
      PREWARM_CACHE_DIR=$OUT/opt/terraform-plugin-cache \
      TERRAFORM_BIN=$CLIS_DIR/usr/local/bin/terraform \
        bash gardenio/tests/e2e/scripts/test-terraform-prewarm-cache.sh

      # Install boto3 into the layer's local site-packages. Ubuntu 24.04's
      # minimal python3 has no pip and no ensurepip module, so install
      # python3-pip via apt. The target path matches Python 3.12's default
      # sys.path entry (/usr/local/lib/python3.12/dist-packages) so boto3
      # is importable after the layer is appended to the agent image.
      sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pip
      pip3 install --target=$OUT/usr/local/lib/python3.12/dist-packages --no-cache-dir boto3

      tar -czf terraform-providers.tar.gz -C $OUT .
      rm -rf $CLIS_DIR
    outputs:
      filesystem: false
      artifacts:
        - key: terraform-providers-tar
          path: terraform-providers.tar.gz

  # ═══════════════════════════════════════════════════════════════════════
  # Agent base image — cached layer with all 8 agent-install layers + system config.
  # Only rebuilds when install scripts or lockfiles change. This is the
  # heavy ~1.8 GB image that changes rarely. push-agent then appends a
  # thin overlay (~50-100 MB) with project binaries built from source.
  # ═══════════════════════════════════════════════════════════════════════
  - key: push-agent-base
    use: [code, install-crane]
    if: ${{ init.ref-name != 'pr' && (init.build-target == 'all' || init.build-target == 'agent') }}
    timeout: 30m
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    # Combined filters from all agent-install-* tasks. When none of these
    # files change, RWX skips this task entirely — the existing agent-base
    # image in the registry is still valid.
    filter:
      - gardenio/.rwx/agent-syspackages.lock
      - gardenio/.rwx/agent-node.lock
      - gardenio/.rwx/agent-playwright.lock
      - gardenio/.rwx/agent-go.lock
      - gardenio/.rwx/agent-rust.lock
      - gardenio/.rwx/agent-clis.lock
      - gardenio/.rwx/agent-terraform-providers.lock
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/node.sh
      - gardenio/images/agent/install/playwright.sh
      - gardenio/images/agent/install/go-tools.sh
      - gardenio/images/agent/install/rust-tools.sh
      - gardenio/images/agent/install/clis.sh
      - gardenio/images/agent/install/terraform-providers.sh
    run: |
      set -e
      T0=$(date +%s)
      TAG="latest"

      LAYER=/tmp/layer
      mkdir -p $LAYER

      # Unpack all 8 agent-install layers sequentially — parallel extraction
      # races on shared directories like /usr/lib/x86_64-linux-gnu/.
      T_UNPACK=$(date +%s)
      echo "=== Unpacking layers (sequential — parallel races on shared dirs) ==="
      sudo tar -xzf ${{ tasks.agent-install-syspackages.artifacts.syspackages-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-playwright.artifacts.playwright-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-node.artifacts.node-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-go.artifacts.go-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-rust.artifacts.rust-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-clis.artifacts.clis-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-whisper.artifacts.whisper-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-terraform-providers.artifacts.terraform-providers-tar }} -C $LAYER
      echo "=== All layers unpacked in $(($(date +%s) - T_UNPACK))s ==="

      # Restore usrmerge symlinks.
      # ubuntu:24.04 base has /lib -> usr/lib, /bin -> usr/bin, /sbin -> usr/sbin.
      # The layer tars create real /lib/, /bin/, /sbin/ directories (from ldd copy
      # loops that follow the symlinks), which clobber the base image's symlinks
      # when crane-appended as a flat layer.
      echo "=== Restoring usrmerge symlinks ==="
      for dir in lib bin sbin; do
        if [ -d "$LAYER/$dir" ] && ! [ -L "$LAYER/$dir" ]; then
          sudo cp -a "$LAYER/$dir/"* "$LAYER/usr/$dir/" 2>/dev/null || true
          sudo rm -rf "$LAYER/$dir"
          ln -s "usr/$dir" "$LAYER/$dir"
          echo "  $dir/ -> usr/$dir (merged $(find $LAYER/usr/$dir -type f 2>/dev/null | wc -l) files)"
        fi
      done

      # CA certs + system config
      mkdir -p $LAYER/etc/ssl/certs
      cp /etc/ssl/certs/ca-certificates.crt $LAYER/etc/ssl/certs/

      # Agent runs unprivileged — no sudoers, no NOPASSWD. The Dockerfile
      # (commit 498dfa93, H2) removed the NOPASSWD sudoers entry and dropped
      # sudo from BASE_PACKAGES. This CI base image path has to match; baking
      # sudoers.d/agent into the base layer would reintroduce NOPASSWD every
      # time an agent pod starts, silently reverting the security fix.

      # Agent user (rename ubuntu→agent, UID 1000)
      cp /etc/passwd $LAYER/etc/passwd
      sed -i "s/^ubuntu:/agent:/" $LAYER/etc/passwd
      sed -i "s|/home/ubuntu|/home/agent|" $LAYER/etc/passwd
      sed -i "s|/bin/sh|/bin/bash|" $LAYER/etc/passwd
      sudo cp /etc/shadow $LAYER/etc/shadow
      sudo sed -i "s/^ubuntu:/agent:/" $LAYER/etc/shadow
      cp /etc/group $LAYER/etc/group
      sed -i "s/^ubuntu:/agent:/" $LAYER/etc/group
      mkdir -p $LAYER/home/agent/workspace $LAYER/home/agent/.ssh

      # SSH known hosts
      ssh-keyscan -t ed25519,ecdsa,rsa github.com gitlab.com \
        > $LAYER/home/agent/.ssh/known_hosts 2>/dev/null || true
      chmod 700 $LAYER/home/agent/.ssh
      chmod 644 $LAYER/home/agent/.ssh/known_hosts 2>/dev/null || true

      # Partial-clone git defaults (system-wide /etc/gitconfig). Must stay in
      # sync with images/agent/Dockerfile (ka-0000000463). Agent workspaces are
      # blobless partial clones (git clone --filter=blob:none, see controller
      # initclone.go), so the agent's own git operations lazily backfill file
      # contents on demand. fetch.writeCommitGraph keeps ancestry walks fast;
      # gc.cruftPacks sweeps the loose objects a --filter backfill leaves behind.
      # The promisor remote is auto-configured by the --filter clone, so there
      # is nothing to set for it here. Written as a static file (no git binary
      # in this RWX task) in the system gitconfig format.
      mkdir -p $LAYER/etc
      printf '[fetch]\n\twriteCommitGraph = true\n[gc]\n\tcruftPacks = true\n' \
        > $LAYER/etc/gitconfig
      chmod 644 $LAYER/etc/gitconfig

      # Fix ownership
      sudo chown -R 1000:1000 $LAYER/home/agent

      # ── Validation (catches issues before pushing ~1.8 GB) ───────────
      T_VALIDATE=$(date +%s)
      echo "=== Validate: shared libs ==="
      FAILURES=0
      LIBDIR=usr/lib/x86_64-linux-gnu
      for lib in libgssapi_krb5.so.2 libcurl.so.4 libssl.so.3 libnss3.so libnspr4.so; do
        f="$LAYER/$LIBDIR/$lib"
        if [ -L "$f" ]; then
          target=$(readlink "$f")
          [ -e "$LAYER/$LIBDIR/$target" ] && echo "  OK: $lib" || { echo "FAIL: dangling $lib -> $target"; FAILURES=$((FAILURES + 1)); }
        elif [ -f "$f" ]; then
          echo "  OK: $lib"
        else
          echo "FAIL: missing $lib"; FAILURES=$((FAILURES + 1))
        fi
      done

      echo "=== Validate: system binaries ==="
      # sudo was removed from BASE_PACKAGES in commit 498dfa93 (H2, unprivileged agent).
      # ffprobe is the metadata half of the ffmpeg toolchain (ships in the same
      # apt package) and the `video` skill's Phase 1 hard-depends on it
      # (`ffprobe -show_format -show_streams`); guard it alongside ffmpeg so an
      # ffmpeg build that dropped ffprobe can never ship green (ka-0000001850).
      for bin in git curl jq ssh make gcc g++ unzip python3 screen tmux psql ffmpeg ffprobe cmake shellcheck protoc; do
        [ -f "$LAYER/usr/bin/$bin" ] || [ -L "$LAYER/usr/bin/$bin" ] && echo "  OK: $bin" || { echo "FAIL: $bin missing"; FAILURES=$((FAILURES + 1)); }
      done

      echo "=== Validate: tool binaries ==="
      STATIC_BINS="coop kd gb go gopls golangci-lint task quench claudeless hadolint stern yq terraform terragrunt rustc cargo"
      BIN_DIRS="usr/local/bin usr/local/cargo/bin usr/local/go/bin"
      for bin in claude node npm npx go gopls golangci-lint rustc cargo \
                kubectl gh glab docker helm terraform terragrunt uv bun \
                quench whisper-cli yq stern hadolint claudeless rwx poetry task; do
        found=""
        for dir in $BIN_DIRS; do
          [ -f "$LAYER/$dir/$bin" ] || [ -L "$LAYER/$dir/$bin" ] && { found="/$dir/$bin"; break; }
        done
        if [ -n "$found" ]; then
          echo "  OK: $found"
        else
          echo "FAIL: $bin not found"; FAILURES=$((FAILURES + 1))
        fi
      done

      echo "=== Validate: playwright ==="
      chromium=$(find "$LAYER/ms-playwright" -name chrome -type f -executable 2>/dev/null | head -1)
      [ -n "$chromium" ] && echo "  OK: chromium" \
        || { echo "FAIL: chromium missing"; FAILURES=$((FAILURES + 1)); }

      echo "=== Validate: baked pg17 client (P4.4 cutover, ka-0000003862) ==="
      # The pg17 bake is a backgrounded subshell in clis.sh; a partial/failed
      # bake must NOT ship a green image. Hard-check both binaries are present.
      for f in pg_dump pg_restore; do
        if [ -x "$LAYER/opt/pg17/usr/lib/postgresql/17/bin/$f" ]; then
          echo "  OK: /opt/pg17/.../$f"
        else
          echo "FAIL: baked pg17 $f missing (/opt/pg17/usr/lib/postgresql/17/bin/$f)"; FAILURES=$((FAILURES + 1))
        fi
      done

      echo "=== Validate: linker support files ==="
      LIBDIR_FULL="$LAYER/usr/lib/x86_64-linux-gnu"
      for f in crt1.o crti.o crtn.o libc.so libc_nonshared.a; do
        if [ -f "$LIBDIR_FULL/$f" ]; then
          echo "  OK: $f"
        else
          echo "FAIL: missing $f"; FAILURES=$((FAILURES + 1))
        fi
      done
      GCC_DIR=""
      for d in "$LAYER/usr/lib/gcc/x86_64-linux-gnu/14" "$LAYER/usr/lib/gcc/x86_64-linux-gnu/13"; do
        [ -d "$d" ] && GCC_DIR="$d" && break
      done
      if [ -n "$GCC_DIR" ]; then
        for f in crtbegin.o crtend.o libgcc.a; do
          [ -f "$GCC_DIR/$f" ] && echo "  OK: gcc/$f" || { echo "FAIL: missing $f in $GCC_DIR"; FAILURES=$((FAILURES + 1)); }
        done
      else
        echo "FAIL: no gcc support directory found"; FAILURES=$((FAILURES + 1))
      fi

      echo "=== Validate: entrypoint assets ==="
      [ -d "$LAYER/usr/lib/git-core" ] && echo "  OK: git-core" || { echo "FAIL: git-core"; FAILURES=$((FAILURES + 1)); }
      for hdr in linux/errno.h linux/limits.h linux/types.h; do
        [ -f "$LAYER/usr/include/$hdr" ] || { echo "FAIL: $hdr"; FAILURES=$((FAILURES + 1)); }
      done

      if [ "$FAILURES" -gt 0 ]; then
        echo ""; echo "FAILED: $FAILURES static validation errors — NOT pushing"; exit 1
      fi
      echo "=== Static validation passed in $(($(date +%s) - T_VALIDATE))s ==="

      # ── Compilation smoke tests (merged with ubuntu:24.04 base) ──────
      # These verify the toolchains in the base layer can actually compile
      # code, not just that binaries exist. Moved from push-agent so they
      # only run when the base layer changes.
      echo "=== Creating layer tar (gzip -1 for speed) ==="
      T_TAR=$(date +%s)
      sudo tar --use-compress-program='gzip -1' -cf /tmp/agent-base-layer.tar.gz -C $LAYER .
      echo "Layer: $(du -h /tmp/agent-base-layer.tar.gz | cut -f1) in $(($(date +%s) - T_TAR))s"

      echo "=== Building merged rootfs for compilation smoke tests ==="
      ROOTFS=/tmp/rootfs
      sudo mkdir -p "$ROOTFS"
      crane export ubuntu:24.04 - | sudo tar -xf - -C "$ROOTFS"
      sudo tar -xzf /tmp/agent-base-layer.tar.gz -C "$ROOTFS"
      sudo mount -t proc proc "$ROOTFS/proc"

      echo "=== Validate: compilation smoke tests (merged image) ==="
      # Test 1: protoc
      printf 'syntax = "proto3";\npackage test;\nmessage Ping { string id = 1; }\n' | sudo tee "$ROOTFS/tmp/test.proto" >/dev/null
      if sudo chroot "$ROOTFS" protoc --proto_path=/tmp --cpp_out=/tmp /tmp/test.proto 2>&1; then
        echo "  OK: protoc compiles .proto"
      elif sudo chroot "$ROOTFS" protoc --version 2>&1; then
        echo "  OK: protoc --version (compilation test skipped)"
      else
        echo "FAIL: protoc cannot run"; FAILURES=$((FAILURES + 1))
      fi
      # Test 2: gcc
      printf '#include <stdio.h>\nint main() { printf("gcc ok\\n"); return 0; }\n' | sudo tee "$ROOTFS/tmp/smoke_test.c" > /dev/null
      if sudo chroot "$ROOTFS" /usr/bin/gcc -o /tmp/smoke_test /tmp/smoke_test.c 2>&1; then
        smoke_out=$(sudo chroot "$ROOTFS" /tmp/smoke_test 2>&1 || true)
        if echo "$smoke_out" | grep -q "gcc ok"; then
          echo "  OK: gcc compiles and links C program"
        else
          echo "  OK: gcc compiles C program (binary produced, could not verify output in chroot)"
        fi
      else
        echo "FAIL: gcc cannot compile a simple C program"; FAILURES=$((FAILURES + 1))
      fi
      # Test 3: rustc
      printf 'fn main() { println!("rustc ok"); }\n' | sudo tee "$ROOTFS/tmp/smoke_test.rs" > /dev/null
      if sudo chroot "$ROOTFS" env RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo /usr/local/cargo/bin/rustc -o /tmp/smoke_test_rs /tmp/smoke_test.rs 2>&1; then
        echo "  OK: rustc compiles and links Rust program"
      else
        echo "FAIL: rustc cannot compile a simple Rust program"; FAILURES=$((FAILURES + 1))
      fi
      # Test 4: cargo (non-fatal)
      if sudo chroot "$ROOTFS" /bin/bash -c '
        export HOME=/tmp
        export RUSTUP_HOME=/usr/local/rustup
        export CARGO_HOME=/usr/local/cargo
        export PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin
        cd /tmp && mkdir -p cargo_smoke && cd cargo_smoke &&
        /usr/local/cargo/bin/cargo init --name smoke 2>&1 &&
        /usr/local/cargo/bin/cargo build 2>&1
      '; then
        echo "  OK: cargo init + build succeeds"
      else
        echo "  WARN: cargo build failed in chroot (non-fatal — direct rustc compilation verified in test 3)"
      fi

      sudo umount "$ROOTFS/proc" 2>/dev/null || sudo umount -l "$ROOTFS/proc" 2>/dev/null || true
      sudo rm -rf "$ROOTFS" 2>/dev/null || true

      if [ "$FAILURES" -gt 0 ]; then
        echo ""; echo "FAILED: $FAILURES compilation smoke test errors — NOT pushing"; exit 1
      fi
      echo "=== All compilation smoke tests passed ==="

      # ── Push to registry ─────────────────────────────────────────────
      T_PUSH=$(date +%s)
      REPO="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}/agent-base"
      for attempt in 1 2 3; do
        if crane append --base ubuntu:24.04 --new_tag "${REPO}:${TAG}" \
             --new_layer /tmp/agent-base-layer.tar.gz --platform linux/amd64; then
          break
        fi
        [ "$attempt" = "3" ] && { echo "FAIL: crane append failed after 3 attempts"; exit 1; }
        echo "WARN: crane append attempt $attempt failed — retrying in 30s"
        sleep 30
      done
      APPEND_DIGEST=$(crane digest "${REPO}:${TAG}")
      crane mutate "${REPO}@${APPEND_DIGEST}" \
        --user 1000 --workdir /home/agent/workspace \
        --env PATH="/usr/local/bun/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
        --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
        --env RUSTUP_HOME=/usr/local/rustup --env CARGO_HOME=/usr/local/cargo \
        --env BUN_INSTALL=/usr/local/bun --env HELM_PLUGINS=/usr/local/share/helm/plugins \
        -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG} in $(($(date +%s) - T_PUSH))s (push) / $(($(date +%s) - T0))s (total)"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}

  # ── Validate agent image (PRs only — no push, full compilation tests) ──
  # Assembles the agent layer + merges with ubuntu:24.04 base locally,
  # then runs the full compilation smoke test suite via chroot. This
  # catches broken toolchains before merging to main.
  # NOTE on `use:`: artifact references like
  #   ${{ tasks.agent-install-syspackages.artifacts.syspackages-tar }}
  # implicitly create a task dependency (RWX waits for the producer and mounts
  # its artifact at the path the expression resolves to). We DON'T need to
  # `use:` those producers — that would also pull in their full filesystem
  # layers (multi-GB of toolchains, browsers, apt caches) just so we can read
  # one tar.gz. Per Tommy Graves (RWX): keeping `use:` to `[code, install-crane]`
  # cut almost all of validate-agent's setup time.
  - key: validate-agent
    use: [code, install-crane]
    if: ${{ init.ref-name == 'pr' }}
    cache: false
    timeout: 15m
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    # validate-agent is a PR-only leaf task — nothing depends on its
    # filesystem. Skipping the upload saves ~15s + several GB on every
    # PR run (the merged rootfs accumulates ~7 GiB).
    outputs:
      filesystem: false
    run: |
      set -e
      T0=$(date +%s)
      LAYER=/tmp/layer
      mkdir -p $LAYER

      # ── Unpack layers (same as push-agent-base) ──────────────────
      T_UNPACK=$(date +%s)
      echo "=== Unpacking layers (sequential — parallel races on shared dirs) ==="
      sudo tar -xzf ${{ tasks.agent-install-syspackages.artifacts.syspackages-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-playwright.artifacts.playwright-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-node.artifacts.node-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-go.artifacts.go-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-rust.artifacts.rust-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-clis.artifacts.clis-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-whisper.artifacts.whisper-tar }} -C $LAYER
      sudo tar -xzf ${{ tasks.agent-install-terraform-providers.artifacts.terraform-providers-tar }} -C $LAYER
      echo "=== All layers unpacked in $(($(date +%s) - T_UNPACK))s ==="

      # Gardenio channel
      export PATH="$LAYER/usr/local/bun/bin:$LAYER/usr/local/bin:$PATH"
      export LD_LIBRARY_PATH="$LAYER/usr/lib/x86_64-linux-gnu:$LAYER/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
      mkdir -p $LAYER/channel
      cp gardenio/images/agent/channel/gardenio-channel.ts $LAYER/channel/
      cp gardenio/images/agent/channel/package.json $LAYER/channel/
      cp gardenio/images/agent/channel/bun.lock $LAYER/channel/
      (cd $LAYER/channel && bun install --frozen-lockfile 2>&1) || (cd $LAYER/channel && bun install 2>&1)

      # Restore usrmerge symlinks
      for dir in lib bin sbin; do
        if [ -d "$LAYER/$dir" ] && ! [ -L "$LAYER/$dir" ]; then
          sudo cp -a "$LAYER/$dir/"* "$LAYER/usr/$dir/" 2>/dev/null || true
          sudo rm -rf "$LAYER/$dir"
          ln -s "usr/$dir" "$LAYER/$dir"
        fi
      done

      # Project binaries — real kd at kd-bin, wrapper at kd (ka-0000006731).
      cp ${{ tasks.build-go-binaries.artifacts.go-binaries }}/gb $LAYER/usr/local/bin/gb
      cp ${{ tasks.build-coop.artifacts.coop-binaries }}/coop $LAYER/usr/local/bin/coop
      cp ${{ tasks.build-kd.artifacts.kd-binaries }}/kd $LAYER/usr/local/bin/kd-bin
      cp gardenio/images/agent/kd-wrapper.sh $LAYER/usr/local/bin/kd
      chmod +x $LAYER/usr/local/bin/gb $LAYER/usr/local/bin/coop $LAYER/usr/local/bin/kd $LAYER/usr/local/bin/kd-bin

      # Entrypoint + hooks
      mkdir -p $LAYER/hooks $LAYER/scenarios
      cp gardenio/images/agent/hooks/*.sh $LAYER/hooks/
      chmod +x $LAYER/hooks/*.sh
      cp gardenio/images/agent/scenarios/*.toml $LAYER/scenarios/
      cp gardenio/images/agent/entrypoint.sh $LAYER/entrypoint.sh
      cp gardenio/images/agent/resolve-auth.sh $LAYER/resolve-auth.sh
      chmod +x $LAYER/entrypoint.sh $LAYER/resolve-auth.sh

      # ── Build local rootfs (base + layer, no push) ────────────────
      echo "=== Building merged rootfs for validation ==="
      T_TAR=$(date +%s)
      sudo tar --use-compress-program='gzip -1' -cf /tmp/agent-layer.tar.gz -C $LAYER .
      echo "Layer: $(du -h /tmp/agent-layer.tar.gz | cut -f1) in $(($(date +%s) - T_TAR))s"

      ROOTFS=/tmp/rootfs
      sudo mkdir -p "$ROOTFS"
      # Export ubuntu:24.04 base as the rootfs foundation.
      crane export ubuntu:24.04 - | sudo tar -xf - -C "$ROOTFS"
      # Overlay our layer on top.
      sudo tar -xzf /tmp/agent-layer.tar.gz -C "$ROOTFS"
      echo "Rootfs ready in $(($(date +%s) - T_TAR))s"

      # ── Compilation smoke tests ────────────────────────────────────
      # Mount /proc inside the rootfs — rustc needs /proc/self/exe to
      # locate its own binary (sysroot discovery).
      sudo mount -t proc proc "$ROOTFS/proc"

      echo "=== Validate: compilation smoke tests (merged rootfs) ==="
      FAILURES=0

      # Test 1: protoc compilation
      printf 'syntax = "proto3";\npackage test;\nmessage Ping { string id = 1; }\n' | sudo tee "$ROOTFS/tmp/test.proto" >/dev/null
      if sudo chroot "$ROOTFS" protoc --proto_path=/tmp --cpp_out=/tmp /tmp/test.proto 2>&1; then
        echo "  OK: protoc compiles .proto"
      elif sudo chroot "$ROOTFS" protoc --version 2>&1; then
        echo "  OK: protoc --version (compilation test skipped)"
      else
        echo "FAIL: protoc cannot run"; FAILURES=$((FAILURES + 1))
      fi

      # Test 2: C compilation with gcc
      printf '#include <stdio.h>\nint main() { printf("gcc ok\\n"); return 0; }\n' | sudo tee "$ROOTFS/tmp/smoke_test.c" > /dev/null
      if sudo chroot "$ROOTFS" /usr/bin/gcc -o /tmp/smoke_test /tmp/smoke_test.c 2>&1; then
        smoke_out=$(sudo chroot "$ROOTFS" /tmp/smoke_test 2>&1 || true)
        if echo "$smoke_out" | grep -q "gcc ok"; then
          echo "  OK: gcc compiles and links C program"
        else
          echo "  OK: gcc compiles C program (binary produced, could not verify output in chroot)"
        fi
      else
        echo "FAIL: gcc cannot compile a simple C program"
        FAILURES=$((FAILURES + 1))
      fi

      # Test 3: Rust compilation with rustc
      printf 'fn main() { println!("rustc ok"); }\n' | sudo tee "$ROOTFS/tmp/smoke_test.rs" > /dev/null
      if sudo chroot "$ROOTFS" env RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo /usr/local/cargo/bin/rustc -o /tmp/smoke_test_rs /tmp/smoke_test.rs 2>&1; then
        echo "  OK: rustc compiles and links Rust program"
      else
        echo "FAIL: rustc cannot compile a simple Rust program"
        FAILURES=$((FAILURES + 1))
      fi

      # Test 4: cargo init + build
      # Non-fatal: cargo's fork+exec of child rustc fails in chroot
      # environments (ENOENT despite binary existing) due to missing
      # /dev, incomplete namespace, or seccomp restrictions. Tests 1-3
      # already validate that protoc, gcc, and rustc compile correctly.
      if sudo chroot "$ROOTFS" /bin/bash -c '
        export HOME=/tmp
        export RUSTUP_HOME=/usr/local/rustup
        export CARGO_HOME=/usr/local/cargo
        export PATH=/usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin
        cd /tmp && mkdir -p cargo_smoke && cd cargo_smoke &&
        /usr/local/cargo/bin/cargo init --name smoke 2>&1 &&
        /usr/local/cargo/bin/cargo build 2>&1
      '; then
        echo "  OK: cargo init + build succeeds"
      else
        echo "  WARN: cargo build failed in chroot (non-fatal — direct rustc compilation verified in test 3)"
      fi

      # Clean up: umount proc before checking results to avoid rm failures
      sudo umount "$ROOTFS/proc" 2>/dev/null || sudo umount -l "$ROOTFS/proc" 2>/dev/null || true
      sudo rm -rf "$ROOTFS" 2>/dev/null || true

      if [ "$FAILURES" -gt 0 ]; then
        echo ""; echo "FAILED: $FAILURES compilation smoke test errors"; exit 1
      fi
      echo "=== All validation passed in $(($(date +%s) - T0))s ==="

  # ── Push agent overlay (thin layer on agent-base) ──────────────────
  # push-agent now uses agent-base:latest as its base image instead of
  # ubuntu:24.04. This means it only uploads project binaries, hooks,
  # config, and channel (~50-100 MB) instead of the full ~1.9 GB.
  # Compilation smoke tests live in push-agent-base since they test the
  # base toolchains, not the project binaries.
  #
  # NOTE on artifact references: references like
  #   ${{ tasks.build-go-binaries.artifacts.go-binaries }}
  # implicitly create task dependencies without pulling in filesystems.
  - key: push-agent
    use: [code, install-crane, push-agent-base]
    if: ${{ init.ref-name != 'pr' && (init.build-target == 'all' || init.build-target == 'agent') }}
    cache: false
    timeout: 15m
    run: |
      set -e
      T0=$(date +%s)
      # Tag strategy: main → main-<sha>, tag → <calver>-rc, other → as-is
      # (mutable :latest retired — F7 ka-0000006416; main-<sha> is per-commit
      # immutable, deploy paths pin <calver>/<calver>-rc, nothing pulls :latest)
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"
      else
        TAG="${REF_NAME}"
      fi

      REGISTRY="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}"
      BASE_REPO="${REGISTRY}/agent-base"
      REPO="${REGISTRY}/agent"

      # Resolve the base image. push-agent-base pushes agent-base:latest
      # when install scripts/lockfiles change (filter-cached). When the
      # base exists in the registry, we use it. If it doesn't exist yet
      # (first-ever run or registry wipe), fall back to a full monolithic
      # build via the old path.
      if crane manifest "${BASE_REPO}:latest" >/dev/null 2>&1; then
        BASE="${BASE_REPO}:latest"
        echo "=== Using cached agent-base: ${BASE} ==="
      else
        echo "WARN: agent-base:latest not found in registry — falling back to ubuntu:24.04"
        echo "This is expected on the first run. push-agent-base will create it."
        BASE="ubuntu:24.04"
      fi

      LAYER=/tmp/agent-overlay
      mkdir -p $LAYER

      if [ "$BASE" = "ubuntu:24.04" ]; then
        # ── Full monolithic build (fallback when agent-base doesn't exist) ──
        echo "=== FALLBACK: full monolithic build ==="
        sudo tar -xzf ${{ tasks.agent-install-syspackages.artifacts.syspackages-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-playwright.artifacts.playwright-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-node.artifacts.node-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-go.artifacts.go-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-rust.artifacts.rust-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-clis.artifacts.clis-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-whisper.artifacts.whisper-tar }} -C $LAYER
        sudo tar -xzf ${{ tasks.agent-install-terraform-providers.artifacts.terraform-providers-tar }} -C $LAYER
        # Restore usrmerge symlinks
        for dir in lib bin sbin; do
          if [ -d "$LAYER/$dir" ] && ! [ -L "$LAYER/$dir" ]; then
            sudo cp -a "$LAYER/$dir/"* "$LAYER/usr/$dir/" 2>/dev/null || true
            sudo rm -rf "$LAYER/$dir"
            ln -s "usr/$dir" "$LAYER/$dir"
          fi
        done
        # System config (normally in agent-base). Agent runs unprivileged —
        # no sudoers, no NOPASSWD (see commit 498dfa93, H2 security fix).
        mkdir -p $LAYER/etc/ssl/certs
        cp /etc/ssl/certs/ca-certificates.crt $LAYER/etc/ssl/certs/
        cp /etc/passwd $LAYER/etc/passwd
        sed -i "s/^ubuntu:/agent:/" $LAYER/etc/passwd
        sed -i "s|/home/ubuntu|/home/agent|" $LAYER/etc/passwd
        sed -i "s|/bin/sh|/bin/bash|" $LAYER/etc/passwd
        sudo cp /etc/shadow $LAYER/etc/shadow
        sudo sed -i "s/^ubuntu:/agent:/" $LAYER/etc/shadow
        cp /etc/group $LAYER/etc/group
        sed -i "s/^ubuntu:/agent:/" $LAYER/etc/group
        mkdir -p $LAYER/home/agent/workspace $LAYER/home/agent/.ssh
        ssh-keyscan -t ed25519,ecdsa,rsa github.com gitlab.com \
          > $LAYER/home/agent/.ssh/known_hosts 2>/dev/null || true
        chmod 700 $LAYER/home/agent/.ssh
        chmod 644 $LAYER/home/agent/.ssh/known_hosts 2>/dev/null || true
      fi

      # ── Gardenio channel (MCP nudge delivery) ─────────────────────────
      # Download bun directly to avoid depending on unpacked base layer.
      echo "=== Installing gardenio channel ==="
      BUN_DIR=/tmp/bun-install
      curl -fsSL https://bun.sh/install | BUN_INSTALL=$BUN_DIR bash 2>&1 || true
      export PATH="$BUN_DIR/bin:$PATH"
      mkdir -p $LAYER/channel
      cp gardenio/images/agent/channel/gardenio-channel.ts $LAYER/channel/
      cp gardenio/images/agent/channel/package.json $LAYER/channel/
      cp gardenio/images/agent/channel/bun.lock $LAYER/channel/
      (cd $LAYER/channel && bun install --frozen-lockfile 2>&1) || (cd $LAYER/channel && bun install 2>&1)
      echo "  channel: $(ls $LAYER/channel/node_modules 2>/dev/null | wc -l) packages installed"

      # ── Project binaries — ALL FROM SOURCE (monorepo advantage) ──────
      # Real kd at kd-bin, wrapper at kd to intercept exit code 64
      # (operator-refusal sentinel; see ka-0000006731).
      echo "=== Adding project binaries (built from source) ==="
      mkdir -p $LAYER/usr/local/bin
      cp ${{ tasks.build-go-binaries.artifacts.go-binaries }}/gb $LAYER/usr/local/bin/gb
      cp ${{ tasks.build-coop.artifacts.coop-binaries }}/coop $LAYER/usr/local/bin/coop
      cp ${{ tasks.build-kd.artifacts.kd-binaries }}/kd $LAYER/usr/local/bin/kd-bin
      cp gardenio/images/agent/kd-wrapper.sh $LAYER/usr/local/bin/kd
      chmod +x $LAYER/usr/local/bin/gb $LAYER/usr/local/bin/coop $LAYER/usr/local/bin/kd $LAYER/usr/local/bin/kd-bin

      # Hook scripts, scenarios, entrypoint
      mkdir -p $LAYER/hooks $LAYER/scenarios
      cp gardenio/images/agent/hooks/*.sh $LAYER/hooks/
      chmod +x $LAYER/hooks/*.sh
      cp gardenio/images/agent/scenarios/*.toml $LAYER/scenarios/
      cp gardenio/images/agent/entrypoint.sh $LAYER/entrypoint.sh
      cp gardenio/images/agent/resolve-auth.sh $LAYER/resolve-auth.sh
      chmod +x $LAYER/entrypoint.sh $LAYER/resolve-auth.sh

      # Version metadata
      mkdir -p $LAYER/etc
      echo "${TAG}" > $LAYER/etc/gardenio-version

      # Fix ownership for overlay files
      sudo chown -R 1000:1000 $LAYER/home/agent 2>/dev/null || true

      # ── Validation (overlay binaries) ────────────────────────────────
      T_VALIDATE=$(date +%s)
      echo "=== Validate: overlay contents ==="
      FAILURES=0
      for bin in gb kd coop; do
        [ -f "$LAYER/usr/local/bin/$bin" ] && echo "  OK: $bin" || { echo "FAIL: $bin missing"; FAILURES=$((FAILURES + 1)); }
      done
      [ -x "$LAYER/entrypoint.sh" ] && echo "  OK: entrypoint.sh" || { echo "FAIL: entrypoint.sh"; FAILURES=$((FAILURES + 1)); }
      [ -x "$LAYER/resolve-auth.sh" ] && echo "  OK: resolve-auth.sh" || { echo "FAIL: resolve-auth.sh"; FAILURES=$((FAILURES + 1)); }
      [ -d "$LAYER/channel/node_modules" ] && echo "  OK: channel" || { echo "FAIL: channel"; FAILURES=$((FAILURES + 1)); }
      [ -d "$LAYER/hooks" ] && echo "  OK: hooks/" || { echo "FAIL: hooks/"; FAILURES=$((FAILURES + 1)); }

      if [ "$FAILURES" -gt 0 ]; then
        echo ""; echo "FAILED: $FAILURES validation errors — NOT pushing"; exit 1
      fi
      echo "=== Validation passed in $(($(date +%s) - T_VALIDATE))s ==="

      # ── Create tar + push ──────────────────────────────────────────
      T_TAR=$(date +%s)
      echo "=== Creating overlay tar (gzip -1 for speed) ==="
      sudo tar --use-compress-program='gzip -1' -cf /tmp/agent-overlay.tar.gz -C $LAYER .
      LAYER_SIZE=$(du -h /tmp/agent-overlay.tar.gz | cut -f1)
      echo "Overlay layer: ${LAYER_SIZE} in $(($(date +%s) - T_TAR))s"

      T_PUSH=$(date +%s)
      # crane append only uploads the new layer — base layers stay in the
      # registry. With agent-base as base, this uploads ~50-100 MB instead
      # of ~1.9 GB (a ~15 min savings).
      for attempt in 1 2 3; do
        if crane append --base "${BASE}" --new_tag "${REPO}:${TAG}" \
             --new_layer /tmp/agent-overlay.tar.gz --platform linux/amd64; then
          break
        fi
        [ "$attempt" = "3" ] && { echo "FAIL: crane append failed after 3 attempts"; exit 1; }
        echo "WARN: crane append attempt $attempt failed — retrying in 30s"
        sleep 30
      done
      # Use digest-based reference for mutate to avoid race conditions when
      # multiple triggers (GitHub + GitLab) push to the same tag concurrently.
      APPEND_DIGEST=$(crane digest "${REPO}:${TAG}")
      crane mutate "${REPO}@${APPEND_DIGEST}" \
        --entrypoint /entrypoint.sh --user 1000 --workdir /home/agent/workspace \
        --env PATH="/usr/local/bun/bin:/usr/local/cargo/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
        --env PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
        --env RUSTUP_HOME=/usr/local/rustup --env CARGO_HOME=/usr/local/cargo \
        --env BUN_INSTALL=/usr/local/bun --env HELM_PLUGINS=/usr/local/share/helm/plugins \
        --env TF_PLUGIN_CACHE_DIR=/opt/terraform-plugin-cache \
        --env TG_DOWNLOAD_DIR=/opt/terragrunt-cache \
        --env TERRAGRUNT_TFPATH=/usr/local/bin/terraform \
        --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
        --label "org.opencontainers.image.ref.name=${REF_NAME}" \
        -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG} in $(($(date +%s) - T_PUSH))s (push) / $(($(date +%s) - T0))s (total)"

      # Verify the pushed image has the correct entrypoint metadata.
      PUSHED_EP=$(crane config "${REPO}:${TAG}" 2>/dev/null \
        | python3 -c "import sys,json; print(json.load(sys.stdin).get('config',{}).get('Entrypoint') or '')" 2>/dev/null)
      if [ -z "$PUSHED_EP" ]; then
        echo "FATAL: ${REPO}:${TAG} has no Entrypoint after crane mutate — aborting"
        exit 1
      fi
      echo "Verified: ${REPO}:${TAG} has Entrypoint=${PUSHED_EP}"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}


  # NOTE: promote-images moved to .rwx/promote.yml (ka-0000008209).
  # GitLab CI dispatches gardenio-promote after rwx-e2e succeeds, before
  # rwx-deploy-prod and create-release. The previous event-triggered
  # promote-images here was gated on a redundant in-file e2e-rwx task
  # (also deleted) and ran in parallel with prod deploy — racing prod.

  # Agent image is now split: push-agent-base (cached ~1.8 GB base) +
  # push-agent (thin ~50-100 MB overlay). validate-agent still does full
  # assembly for PR validation.

  # ═══════════════════════════════════════════════════════════════════════
  # CI runner image — pre-baked deploy/E2E tools (helm, kubectl, AWS CLI, Go)
  # Used as base image for deploy.yml and e2e.yml standalone pipelines.
  # Also built here so deploy-rwx and e2e-rwx can install tools from cache.
  # ═══════════════════════════════════════════════════════════════════════

  - key: push-ci-runner
    use: [code, install-crane]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    cache: false
    timeout: 10m
    run: |
      set -ex
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"
      else
        TAG="${REF_NAME}"
      fi

      # Install tools into a layer directory
      LAYER=/tmp/ci-runner-layer
      mkdir -p $LAYER/usr/local/bin $LAYER/usr/local/go

      # kubectl
      KUBE_VERSION=$(curl -sSfL https://dl.k8s.io/release/stable.txt)
      curl -sSfL "https://dl.k8s.io/release/${KUBE_VERSION}/bin/linux/amd64/kubectl" \
        -o $LAYER/usr/local/bin/kubectl
      chmod +x $LAYER/usr/local/bin/kubectl

      # Helm
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 \
        | PATH="$LAYER/usr/local/bin:$PATH" HELM_INSTALL_DIR="$LAYER/usr/local/bin" USE_SUDO=false bash

      # AWS CLI
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
      (cd /tmp && unzip -q awscli.zip)
      /tmp/aws/install --install-dir $LAYER/opt/aws-cli --bin-dir $LAYER/usr/local/bin
      rm -rf /tmp/awscli.zip /tmp/aws

      # Go 1.25
      curl -fsSL "https://go.dev/dl/go1.25.9.linux-amd64.tar.gz" | tar -C $LAYER/usr/local -xz

      # crane
      curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
        | tar xz -C $LAYER/usr/local/bin crane

      # jq (not in base ubuntu:24.04)
      sudo apt-get update && sudo apt-get install -y -q jq
      cp $(which jq) $LAYER/usr/local/bin/jq

      tar -cf /tmp/ci-runner-layer.tar -C $LAYER .

      REPO="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}/ci-runner"
      crane append --base ubuntu:24.04 --new_tag "${REPO}:${TAG}" --new_layer /tmp/ci-runner-layer.tar --platform linux/amd64
      DIGEST=$(crane digest "${REPO}:${TAG}")
      crane mutate "${REPO}@${DIGEST}" \
        --env "PATH=/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin" \
        --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
        --label "org.opencontainers.image.ref.name=${REF_NAME}" \
        -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG}"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}
    outputs:
      filesystem: false

    filter:
      - gardenio/images/ci-runner/Dockerfile

  # ═══════════════════════════════════════════════════════════════════════
  # NOTE: e2e-rwx, install-deploy-tools, and promote-helm-chart moved out
  # ═══════════════════════════════════════════════════════════════════════
  #
  # Per ka-0000008209: the in-file e2e-rwx ran on every main+tag push, with
  # promote-images and promote-helm-chart gated on it via `use:`. This
  # raced .gitlab-ci.yml's rwx-deploy-prod job (which only needed rwx-e2e),
  # so prod could helm-upgrade against -rc-only images.
  #
  # Now: GitLab CI's rwx-e2e job (.rwx/e2e.yml) is the sole E2E gate, and
  # promotion is dispatched by GitLab CI's `promote` job (.rwx/promote.yml)
  # before rwx-deploy-prod and create-release. Main pushes are covered by
  # rwx-smoke (.rwx/smoke-rwx.yml). install-deploy-tools had no other
  # consumers in this file.


  # NOTE: Production deploy is now driven by GitLab CI's `rwx-deploy-prod`
  # job (.gitlab-ci.yml), which dispatches gardenio-deploy --param target=prod
  # after rwx-e2e passes. The previous gate-prod-deploy task was removed in
  # ka-0000001296 so prod deploys produce a native GitLab job status, not
  # an RWX-side fire-and-forget dispatch.

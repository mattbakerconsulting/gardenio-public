  # ── Build geo-table dist (edge IDP L1b enrichment, ka-0000005851) ────
  # Fetch the upstream iptoasn ip2asn+country dump and range->CIDR convert it to
  # the FULL CIDR->{ASN,country} table the edge/audit L1 resolver consumes
  # (auditxform.ParseGeoTable). This runs where the builder HAS network so the
  # runtime initContainer that seeds the table into the shipper's emptyDir is a
  # pure `cp` with ZERO off-cluster egress — the same zero-egress posture the
  # grafana plugin prebakes rely on (default-deny-egress friendly).
  #
  # WHY AN IMAGE, NOT A ConfigMap: the full table is ~1M CIDRs / ~26 MiB
  # (--no-description), vastly over the 1 MiB etcd cap on BOTH ConfigMap and
  # Secret — so the chart's geoTable.data ConfigMap mount cannot carry a global
  # table. See gardenio/images/geo-table/Dockerfile for the full design rationale
  # (why not filter/allowlist/coarsen). --no-description halves the table
  # (~49.5 -> ~26.4 MiB); the resolver ignores that column.
  #
  # NON-DETERMINISM IS INTENTIONAL (no pinned checksum, unlike the plugin
  # prebakes): iptoasn republishes ~daily and we WANT fresh geo data at each
  # release build. The >1000-entry sanity floor (shared with build-geo-table.py +
  # .rwx/geo-table-mirror.yml) fails a truncated/format-changed fetch loudly.
  #
  # No `ref-name != 'pr'` guard: fetch + convert on PRs/MRs too, so a broken
  # upstream (404 / format drift) reds the MR pipeline pre-merge rather than only
  # the main-push. The PUSH task below stays gated off PRs.
  - key: build-geo-table
    use: [code]
    if: ${{ init.build-target == 'all' }}
    cache: false
    timeout: 10m
    run: |
      set -ex
      UPSTREAM="${GEO_UPSTREAM_URL:-https://iptoasn.com/data/ip2asn-combined.tsv.gz}"
      echo "=== fetching $UPSTREAM ==="
      # --retry-all-errors so a mid-stream HTTP/2 reset (curl 92, seen in CI on
      # the iptoasn mirror) is retried like a transport error, not treated as a
      # hard failure — --retry alone does NOT retry a partially-transferred body.
      curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$UPSTREAM" -o /tmp/ip2asn.tsv.gz
      echo "=== converting range dump -> CIDR geo table (no-description) ==="
      mkdir -p /tmp/geo-dist
      # pipefail: a converter non-zero (e.g. all-AS0) fails the whole task — never
      # publish a partial/empty table. --no-description drops the column the
      # resolver ignores, halving the table so the shipper's pull stays small.
      zcat /tmp/ip2asn.tsv.gz | python3 scripts/build-geo-table.py --no-description > /tmp/geo-dist/geo-table.txt
      LINES=$(grep -cv '^#' /tmp/geo-dist/geo-table.txt || true)
      echo "=== geo-table.txt: ${LINES} CIDR entries ==="
      head -5 /tmp/geo-dist/geo-table.txt
      # Sanity floor: a healthy combined dump is >100k prefixes. A tiny result
      # means a truncated fetch or an upstream format change — fail loudly rather
      # than ship a table that blinds the console.
      if [ "${LINES:-0}" -lt 1000 ]; then
        echo "ERROR: only ${LINES} entries — upstream fetch/format looks broken" >&2
        exit 1
      fi
      tar -czf /tmp/geo-table-dist.tar.gz -C /tmp/geo-dist .
    outputs:
      artifacts:
        - key: geo-table-dist
          path: /tmp/geo-table-dist.tar.gz


  # into the image (ka-0000002799). The dashboards are NO LONGER shipped in the
  # Helm chart (they used to render into grafana_dashboard ConfigMaps, stored
  # twice per revision in the release-history Secret — the ~200KB double-store
  # that overflowed the K8s 1 MiB Secret limit and stranded prod, ka-0000003724).
  # They now ride in this image at /dashboards; the bridge backfills them into
  # type=dashboard beads on startup (idempotent on uid) and provisions the live
  # ConfigMaps at runtime. See gardenio/docs/dashboard-sync.md.
  - key: push-grafana-bridge
    use: [code, build-go-binaries, install-crane]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    cache: false
    run: |
      set -ex
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"

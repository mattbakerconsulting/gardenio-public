# OCI image builds for gardenio monorepo — crane-based push to container registry.
#
# Architecture:
#   build-* tasks     -> compile binaries as artifacts (cached by filters)
#   agent-install-*   -> 8 parallel cached agent layer installs
#   push-agent-base   -> cached base image from agent-install-* layers (~1.8 GB)
#   push-*  tasks     -> crane-append layers to base images, push to $IMAGE_REGISTRY
#   promote-images    -> promote RC tags to final calver (after E2E; :latest retired)
#
# Agent image optimization:
#   The agent image is split into two layers to avoid uploading ~1.9 GB on every commit:
#   1. agent-base — contains all 8 agent-install layers + system config (cached by filter)
#   2. agent     — thin overlay with project binaries, hooks, config (~50-100 MB)
#   On typical commits (no install script changes), push-agent uploads only the overlay,
#   reducing push time from ~17 min to ~1-2 min.
#
# Registry target defaults to registry.gitlab.com/acme/platform/gardenio via
# bash ${:-} defaults, with GHCR fallback for auth if REGISTRY_USER/TOKEN not set.
# Vault secrets: IMAGE_REGISTRY, REGISTRY_USER, REGISTRY_TOKEN.
#
# Images produced (all under $IMAGE_REGISTRY/):
#   push-controller     -> controller
#   push-agent-base     -> agent-base (7 install layers, cached, ~1.8 GB)
#   push-agent          -> agent (thin overlay on agent-base, ~50-100 MB)
#   push-slack-bridge   -> slack-bridge
#   push-jira-bridge    -> jira-bridge
#   push-gitlab-bridge  -> gitlab-bridge
#   push-roles-server   -> roles-server
#   push-claudemore     -> claudemore (Phase1 MVP, Messages-API proxy fronting litellm)
#   push-beads-viewer   -> beads-viewer
#   push-repro-cockpit  -> repro-cockpit (read-only repro-run observation UI)
#   push-trigger-engine -> trigger-engine
#   push-edge-auth      -> edge-auth (Stage 3 CLI auth-shim)
#   push-scif-portal    -> scif-portal (acme-scif v1.1 Phase D approval portal)
#   push-grafana-bridge -> grafana-bridge (Phase1 W2, beads↔Grafana)
#   push-grafana-assistant-plugin -> grafana-assistant-plugin (C4, Path C chat-box dist)
#   push-grafana-llm-app-plugin -> grafana-llm-app-plugin (C6 prereq, pinned LLM-app dist)
#   push-grafana-vl-datasource-plugin -> grafana-vl-datasource-plugin (Phase-2 forensics, pinned VictoriaLogs datasource dist)
#   push-geo-table      -> geo-table (edge-IDP L1b, full CIDR->{ASN,country} geo table for the shipper enrichment)
#   push-alertmanager-bridge -> alertmanager-bridge (Phase1 W3, beads↔alerts)
#   push-idp-log-shipper -> idp-log-shipper (IDP Phase-2 CloudWatch->VictoriaLogs transport)
#   push-ava-log-shipper -> ava-log-shipper (edge-IDP apex AVA-OCSF-accesslog->VictoriaLogs transport)
#   push-traefik-log-shipper -> traefik-log-shipper (edge-IDP L0 Traefik-accesslog->VictoriaLogs transport)
#   push-bridge-log-shipper -> bridge-log-shipper (non-AVA webhook-audit: jira/gitlab-bridge stdout->VictoriaLogs)
#   push-core-log-shipper -> core-log-shipper (gb logs WRITE side: controller/slack-bridge/trigger-engine/grafana-bridge stdout->VictoriaLogs, redacted)
#   push-kbeads         -> kbeads
#   push-coop           -> coop (coopmux)
#   push-ci-runner      -> ci-runner (deploy/E2E tools: helm, kubectl, AWS CLI, Go)
#
# Image tag strategy (mutable :latest retired — F7 ka-0000006416):
#   Main push:  main-<short-sha>             (unique per commit, always pullable)
#   Tag push:   <calver>-rc                  (release candidate, pre-validation)
#   Promote:    <calver>-rc → <calver>       (after all pushes / E2E gate; the
#                                             immutable digest is recorded so the
#                                             release deploys/pins by digest)
#   CLI build:  cli                          (feature branch agent-only)
#   No first-party image is retagged :latest anymore — a floating :latest is a
#   registry-write attack surface and no deploy path consumes it. The build-cache
#   base agent-base:latest (push-agent-base) is unrelated and intentionally kept.
#
# Key monorepo improvement: coop and kd are built FROM SOURCE, not downloaded
# from GitHub releases. No cross-repo dispatch needed.
#
# Feature branch builds (agent-only):
#   rwx run .rwx/docker.yml --init build-target=agent
#   Builds and pushes only the agent image, tagged "cli".

on:
  # Event triggers in this file are scoped to image builds + ungated PR/MR
  # fanout. The GitLab-CI dispatch chain in .gitlab-ci.yml (epic
  # ka-0000000408) is the single source of truth for *gated* stages on
  # main/tag refs (build → dispatch deploy-rwx → dispatch smoke/e2e,
  # each a native GitLab job with native commit status). docker.yml only
  # produces image artifacts for those refs — no status-checks, no
  # smoke-rwx, no promote-images gating from the trigger here.
  #
  # `status-checks: false` on push + tag-push is load-bearing: RWX posts a
  # DEFAULT status check ("RWX: docker.yml (push/tag-push)") unless you
  # explicitly disable it. Without this, a transient image-push flake (e.g.
  # a registry BLOB_UPLOAD_UNKNOWN on one of ~50 push-* tasks) reddens the
  # whole GitLab pipeline for main/tag even though the gated dispatch chain
  # is fine — a false release-blocker (ka-0000006462, pipeline 2720727317).
  #
  # Path A from ka-0000000395 / decision ka-0000004455 (ka-0000000927):
  # restore on.gitlab.push + on.gitlab.tag-push for image builds, drop
  # on.github.push entirely so the (12-days-stale) groblegark/gardenio
  # mirror is no longer load-bearing for releases. GitHub PR fanout
  # remains because PRs originate on the GitHub side of the mirror.
  gitlab:
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
        build-target: all
        cover: ""
        force-deploy: ""
        # mr-iid keys the per-MR cancel-running concurrency pool below.
        # "" on non-MR triggers → they never join a pool (ka-0000002755).
        mr-iid: ""
      # Image builds only — the .gitlab-ci.yml dispatch chain gates main.
      status-checks: false
    tag-push:
      if: ${{ starts-with(event.git.tag, '20') }}
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: ${{ event.git.ref }}
        build-target: all
        cover: ""
        force-deploy: ""
        mr-iid: ""
      # Image builds only — the .gitlab-ci.yml dispatch chain gates tags.
      status-checks: false
    merge-request:
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: pr
        build-target: all
        cover: ""
        force-deploy: ""
        # Populated only here → GitLab MR re-pushes supersede (ka-0000002755).
        mr-iid: ${{ event.gitlab.merge-request.object_attributes.iid }}
      status-checks:
        - tasks: [build-go-binaries, build-coop, build-kd, validate-agent, build-grafana-assistant-plugin, build-grafana-llm-app-plugin, build-grafana-vl-datasource-plugin]
          name: Docker
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        ref-name: pr
        build-target: all
        cover: ""
        force-deploy: ""
        # GitHub PRs stay OUT of the pool (mr-iid="") — a GitLab MR iid and an
        # unrelated GitHub PR number could collide on the same small integer
        # and cross-cancel. The agent-throughput burn is GitLab MRs; scope the
        # supersede there only (ka-0000002755).
        mr-iid: ""
      status-checks:
        - tasks: [build-go-binaries, build-coop, build-kd, validate-agent, build-grafana-assistant-plugin, build-grafana-llm-app-plugin, build-grafana-vl-datasource-plugin]
          name: Docker
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      ref-name: cli
      build-target: all
      cover: ""
      force-deploy: ""
      mr-iid: ""

  # Coverage build: rwx run .rwx/docker.yml --init cover=1
  # Produces coverage-instrumented binaries that write profiling data at runtime.
  # Go binaries: set GOCOVERDIR=/path/to/dir before running.
  # Rust binaries: set LLVM_PROFILE_FILE=/path/to/%p-%m.profraw before running.

# ── Cancel superseded MR image builds (ka-0000002755) ─────────────────
# Same CI-burn lever as ci.yml's per-MR pool: the 7 image-build tasks
# (build-go-binaries, build-coop, build-kd, validate-agent, 3× grafana
# plugins) are the heaviest per-push cost, and an agent re-pushing to an
# open MR left the prior commit's whole fanout building to completion for
# a commit that can never merge. Key on the GitLab MR iid so re-pushes to
# the SAME MR share one pool; capacity:1 + cancel-running cancels the older
# in-flight build when a newer push starts (RWX feature-branch pattern,
# https://www.rwx.com/docs/rwx/concurrency-pools).
#
# Scoped to GitLab MR events ONLY (`init.mr-iid != ""`): main push, tag-push,
# GitHub PR, and cli all pass mr-iid="" and are EXCLUDED — main/tag image
# builds must always run to completion (the release/deploy chain pulls those
# tags), and GitHub PR numbers are kept out to avoid a small-integer collision
# with a GitLab MR iid.
concurrency-pools:
  - id: Acme/Platform/gardenio:docker-mr-${{ init.mr-iid }}
    if: ${{ init.mr-iid != "" }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

# Incremental build cache for tasks that opt in via `tool-cache: <task-key>`.
# Vault is unlocked on protected branches (main, tags) so they populate the
# cache; feature branches read from it but don't write back. See:
# https://www.rwx.com/docs/tool-caches
tool-cache:
  vault: gardenio-main

tasks:
  # ═══════════════════════════════════════════════════════════════════════
  # Build tasks — compile all binaries in parallel, output artifacts
  # ═══════════════════════════════════════════════════════════════════════

  # ── Clone gardenio monorepo (retry-wrapped) ─────────────────────────
  # Hand-rolled shallow clone with a bounded retry loop instead of
  # `call: git/clone`. The stock package (through 2.0.8) has NO retry and
  # RWX has no task-level auto-retry, so a single transient gitlab.com blip
  # during fetch-pack (`Connection to gitlab.com closed by remote host`,
  # exit 128) fails the whole run and cascades into verify-images →
  # promotion blocks (ka-0000003035 / ka-0000007550).
  #
  # The fetch also carries http.lowSpeedLimit/lowSpeedTime (ka-0000007824):
  # the retry loop only fires on a fetch that FAILS, so a connection that
  # STALLS mid-fetch (no bytes, no EOF) would otherwise hang until the RWX
  # task timeout with no retry. lowSpeedLimit=1000 bytes/s over
  # lowSpeedTime=20s aborts a stalled fetch with a non-zero exit, converting
  # the stall variant of the transient-EOF class into a retriable failure.
  #
  # Parity with `git/clone` DEFAULTS (which is all this task used):
  #   * shallow `--depth=1` fetch of the exact SHA (init.commit-sha is a
  #     40-hex commit, so no ls-remote ref resolution is needed)
  #   * detached checkout at that SHA
  #   * `.git` stripped afterwards (cleanup-git-dir default) so downstream
  #     content-filtered tasks keep identical cache keys / build times
  #   * no submodules (repo has none), no LFS (repo uses none).
  # Token auth stays in the repository URL (oauth2:${GITLAB_CLONE_TOKEN}),
  # exactly as before — no ssh-key plumbing (the May task note is stale).
  #
  # This task ALSO emits the resolved COMMIT sha as a task value (sha). A
  # hand-rolled clone does NOT provide git/clone's RWX_GIT_COMMIT_SHA, so
  # resolve-commit — which used to read that var — reads tasks.code.values.sha
  # instead. The peel-to-commit must happen here, the only task where `.git`
  # still exists (it is stripped below). Without this, the var'less clone left
  # resolve-commit reading an unset RWX_GIT_COMMIT_SHA, aborting every
  # tag/main release build under `set -eu` with
  # `RWX_GIT_COMMIT_SHA: unbound variable`, cascading to verify-images /
  # deploy-ephemeral (ka-0000007563, regression from ka-0000007550).
  - key: code
    run: |
      set -eu
      : "${GITLAB_CLONE_TOKEN:?GITLAB_CLONE_TOKEN is required}"
      REPO="https://oauth2:${GITLAB_CLONE_TOKEN}@gitlab.com/Acme/Platform/gardenio.git"
      SHA="${COMMIT_SHA}"
      MAX_ATTEMPTS=5

      # Redact the token from any tracing/output; never echo $REPO.
      git init -q -b main
      git remote add origin "$REPO"
      git config --local maintenance.auto false
      git config --local gc.auto 0

      attempt=1
      while :; do
        echo "git-clone attempt ${attempt}/${MAX_ATTEMPTS} for ${SHA}"
        if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=20 fetch --no-auto-gc --depth=1 origin "+${SHA}:refs/rwx/git-clone/checkout"; then
          echo "git-clone: fetch succeeded on attempt ${attempt}"
          break
        else
          rc=$?
          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "git-clone: fetch FAILED after ${MAX_ATTEMPTS} attempts (last exit ${rc})" >&2
            exit "$rc"
          fi
          # Exponential backoff: 5s, 10s, 20s, 40s.
          sleep_s=$((5 * (1 << (attempt - 1))))
          echo "git-clone: fetch failed (exit ${rc}); retrying in ${sleep_s}s" >&2
          sleep "$sleep_s"
          attempt=$((attempt + 1))
        fi
      done

      git checkout -q --detach "$(git rev-parse refs/rwx/git-clone/checkout^{commit})"
      git clean -fdq
      echo "Checked out git repository at $(git rev-parse HEAD)"

      # Emit the resolved COMMIT sha for resolve-commit / downstream image
      # labels. `HEAD` is the peeled commit (the fetch/checkout above already
      # dereferenced any annotated/signed tag via ^{commit}), so this is the
      # correct OCI image.revision on every ref shape — lightweight tag,
      # annotated/signed tag, branch, PR (ka-0000007563 / ka-0000004286).
      git rev-parse HEAD > "$RWX_VALUES/sha"

      # Strip .git for cache-key parity with git/clone's cleanup-git-dir default.
      rm -rf .git
    env:
      GITLAB_CLONE_TOKEN:
        value: ${{ secrets.GITLAB_CLONE_TOKEN }}
        cache-key: excluded
      COMMIT_SHA: ${{ init.commit-sha }}

  # ── Resolve the pushed ref to its underlying COMMIT sha ──────────────
  # The `code` task's tasks.code.values.sha is the *resolved commit*: for an
  # ANNOTATED tag its fetch/checkout dereferences the tag object to the
  # commit it points at (git rev-parse <tag>^{commit}), and it emits HEAD.
  # init.commit-sha (= event.git.sha) is instead the pushed ref object
  # itself — for an annotated tag that is the ANNOTATED TAG OBJECT sha, NOT
  # a commit (git rev-parse <tag> vs <tag>^{commit}).
  #
  # Stamping the tag-object sha into org.opencontainers.image.revision
  # made every -rc image mismatch the promote-time release-integrity gate
  # (ka-0000004203 in .rwx/promote.yml), which asserts each -rc image's
  # revision == the tag's COMMIT (the gate is dispatched with --ref $TAG,
  # so RWX resolves it to the commit). Tags 2026.219.9 / .10 failed@promote
  # for exactly this — they are the first ANNOTATED (signed) release tags,
  # a regression from e0d37b8db (fix/ka-0000005321, "SSH-sign release
  # commit + tag"; -m/-s makes the tag annotated even unsigned). Every
  # prior release tag was lightweight, so tag-object == commit and the
  # label happened to match.
  #
  # Re-emit the resolved commit (from tasks.code.values.sha) as this task's
  # own value so the ~37 downstream image/build tasks keep consuming a
  # single stable ref (tasks.resolve-commit.values.sha) unchanged. This used
  # to read git/clone's RWX_GIT_COMMIT_SHA; the retry-wrapped hand-rolled
  # clone (ka-0000007550) no longer provides that var, so resolve-commit
  # aborted under `set -eu` with `RWX_GIT_COMMIT_SHA: unbound variable`,
  # cascading to verify-images / deploy-ephemeral (ka-0000007563). For
  # branch / PR / cli refs the pushed ref is already a commit, so this
  # equals init.commit-sha — no behavior change off the tag path.
  # ka-0000004286.
  - key: resolve-commit
    use: [code]
    cache: false
    run: |
      set -eu
      : "${CODE_SHA:?resolve-commit: tasks.code.values.sha is empty}"
      printf '%s' "$CODE_SHA" > "$RWX_VALUES/sha"
      echo "resolved commit sha=${CODE_SHA} (pushed ref init.commit-sha=${INIT_COMMIT_SHA})"
    env:
      CODE_SHA: ${{ tasks.code.values.sha }}
      INIT_COMMIT_SHA: ${{ init.commit-sha }}

  # ── Go toolchain ───────────────────────────────────────────────────
  - key: go
    call: golang/install 1.2.1
    with:
      go-version: "1.25"

  # ── Rust toolchain (for coop) ──────────────────────────────────────
  # Pin version to match coop/rust-toolchain.toml and ci.yml.
  # Without pinning, every Rust stable release changes the rustc binary
  # hash, invalidating all Cargo fingerprints in coop-precompiled cache.
  #
  # No `filter:` — the previous filter pinned cache keys to two files but RWX
  # already cache-busts a task when the run script (i.e. the rustup version
  # string) changes, so the filter was redundant and Tommy flagged it as wrong
  # cache pinning that prevented the toolchain layer from being shared cleanly.
  - key: rust
    run: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.93.0 -c rustfmt -c clippy -c llvm-tools
      . "$HOME/.cargo/env"
      rustc --version
      sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config libssl-dev

  # ── Controller Go mod download (cached) ─────────────────────────────
  - key: gardenio-deps
    use: [code, go]
    run: |
      cd gardenio/controller && GOWORK=off go mod download
    filter:
      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
      # controller go.mod has `replace gardenio/clicreds =>
      # ../clicreds`; without the local module's go.mod/go.sum in the task
      # workspace the RWX filter drops it and `go mod download` FATALs
      # "open .../gardenio/clicreds/go.mod: no such file or directory", so no
      # images get pushed (ka-0000003839).
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum

  # ── kbeads Go mod download (cached) ─────────────────────────────────
  - key: kbeads-deps
    use: [code, go]
    run: cd kbeads && go mod download
    filter:
      - kbeads/go.mod
      - kbeads/go.sum
      # kbeads go.mod has `replace gardenio/clicreds =>
      # ../gardenio/clicreds` — same local-module materialization need as
      # gardenio-deps above (ka-0000003839).
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum

  # ── Coop pre-compiled external deps ─────────────────────────────────
  # Stubs out workspace crate sources (fn main(){} / empty lib) so only
  # external deps are compiled and cached. Re-runs only when Cargo.lock,
  # Cargo.toml files, or proto definitions change — not on every .rs edit.
  - key: coop-precompiled
    use: [code, rust]
    timeout: 25m
    # Heavy data mover: cargo fetches and compiles ~600 external crates,
    # producing ~3GB of intermediate artifacts that we tar into precompiled-tar.
    # Bigger agent + tmpfs keeps the workspace in RAM (no spill to disk).
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - coop/Cargo.lock
      - coop/**/Cargo.toml
      - coop/proto/**
      - coop/rust-toolchain.toml
      - .rwx/coop-precompiled.epoch
    run: |
      . "$HOME/.cargo/env"
      export RUSTC_WRAPPER=""
      cd coop
      # Remove tests/specs from the workspace before any cargo command.
      # Cargo requires src/lib.rs to exist to auto-discover targets, but .rs
      # files aren't in our filter so the file is absent in this task.
      # Back up Cargo.toml, then remove tests/specs from the workspace.
      # Cargo requires src/lib.rs to exist to auto-discover targets, but .rs
      # files aren't in our filter so the file is absent in this task.
      cp Cargo.toml Cargo.toml.orig
      sed -i '/"tests\/specs"/d' Cargo.toml
      cargo fetch
      # Stub workspace crate sources — valid Rust, no cross-workspace deps.
      # src/ dirs don't exist (no .rs files in filter), so mkdir -p first.
      mkdir -p crates/cli/src crates/mux/src
      printf 'fn main() {}\n' > crates/cli/src/main.rs
      printf ''               > crates/cli/src/lib.rs
      printf 'fn main() {}\n' > crates/mux/src/main.rs
      printf ''               > crates/mux/src/lib.rs
      CARGO_TARGET_DIR=/tmp/coop-target cargo build --release --workspace
      # Restore original files so they don't leak into the layer and
      # overwrite real sources/config in downstream tasks that `use` this task.
      mv Cargo.toml.orig Cargo.toml
      rm -f crates/cli/src/main.rs crates/cli/src/lib.rs \
            crates/mux/src/main.rs crates/mux/src/lib.rs
      cd ..
      # Purge ALL workspace crate artifacts so build-coop is forced to
      # recompile the real workspace crates. This includes:
      #   - stub binaries (coop, coopmux)
      #   - stub .rlib/.rmeta/.d files in deps/
      #   - fingerprints that would tell cargo the stubs are up-to-date
      rm -f /tmp/coop-target/release/coop /tmp/coop-target/release/coopmux
      rm -rf /tmp/coop-target/release/.fingerprint/coop-* \
             /tmp/coop-target/release/.fingerprint/coopmux-*
      rm -f /tmp/coop-target/release/deps/coop-* \
            /tmp/coop-target/release/deps/coopmux-* \
            /tmp/coop-target/release/deps/libcoop-* \
            /tmp/coop-target/release/deps/libcoopmux-*
      # Only pack the three subdirs that Cargo uses for incremental reuse:
      #   deps/        — compiled .rlib / .rmeta files (external deps only)
      #   build/       — build-script outputs (bindgen, protobuf, etc.)
      #   .fingerprint — change-detection records (workspace crates excluded)
      # This skips the stub binaries and per-crate incremental data, reducing
      # artifact size from ~3 GB uncompressed to ~200-400 MB compressed.
      tar -czf coop-precompiled.tar.gz \
        -C /tmp/coop-target/release \
        deps build .fingerprint
    outputs:
      # Skip uploading the filesystem layer — consumers (build-coop) only ever
      # read the precompiled-tar artifact, never raw files from the layer.
      # Eliminates teardown time for this multi-GB target/ tree.
      filesystem: false
      artifacts:
        - key: precompiled-tar
          path: coop-precompiled.tar.gz

  # ── Build all Go binaries → single artifact directory ───────────────
  # Consolidates 6 separate build tasks into one. Sequential builds in a
  # single task share Go's build cache, so shared packages are compiled
  # once instead of 6 times. Saves ~2-3 minutes total build time.
  - key: build-go-binaries
    use: gardenio-deps
    # Reuse Go's incremental build cache between runs (see top-level
    # tool-cache vault). Most touches don't recompile the full DAG, so this
    # is a big win on the critical path.
    tool-cache: build-go-binaries
    run: |
      cd gardenio/controller
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      VERSION_LDFLAGS="-s -w -X main.version=${REF_NAME} -X main.commit=${COMMIT_SHA}"
      # gb reports its build via `gb version`/`gb --version` and drives the
      # version-skew signal (ka-0000002965), so it needs version/commit (which
      # it previously did NOT get — BARE_LDFLAGS was the root cause of the stale
      # laptop-binary friction report) plus branch + build date.
      GB_LDFLAGS="${VERSION_LDFLAGS} -X gardenio/controller/internal/buildinfo.Branch=${REF_NAME} -X gardenio/controller/internal/buildinfo.Date=${BUILD_DATE}"
      # Coverage instrumentation: pass --init cover=1 to enable.
      COVER_FLAGS=""
      if [ "${COVER}" = "1" ]; then
        COVER_FLAGS="-cover -coverpkg=./..."
        echo "=== Coverage instrumentation ENABLED ==="
      fi
      mkdir -p ../../go-binaries
      T0=$(date +%s)
      echo "=== Building 14 Go binaries (shared build cache) ==="
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/controller ./cmd/controller/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${GB_LDFLAGS}" -o ../../go-binaries/gb ./cmd/gb/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/slack-bridge ./cmd/slack-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/jira-bridge ./cmd/jira-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/gitlab-bridge ./cmd/gitlab-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/roles-server ./cmd/roles-server/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/claudemore ./cmd/claudemore/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/beads-viewer ./cmd/beads-viewer/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/repro-cockpit ./cmd/repro-cockpit/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/trigger-engine ./cmd/trigger-engine/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/edge-auth ./cmd/edge-auth/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/scif-portal ./cmd/scif-portal/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/grafana-bridge ./cmd/grafana-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/alertmanager-bridge ./cmd/alertmanager-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/idp-log-shipper ./cmd/idp-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/ava-log-shipper ./cmd/ava-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/traefik-log-shipper ./cmd/traefik-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/bridge-log-shipper ./cmd/bridge-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries/core-log-shipper ./cmd/core-log-shipper/
      T1=$(date +%s)
      echo "=== All Go binaries built in $((T1-T0))s ==="
      ls -la ../../go-binaries/
    env:
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}
      REF_NAME: ${{ init.ref-name }}

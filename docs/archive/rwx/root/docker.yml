      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
      # controller imports the local clicreds module via `replace =>
      # ../clicreds`; the build needs its full source, not just go.mod, or
      # `go build` FATALs on the missing local module (ka-0000003839).
      - gardenio/clicreds/**/*.go
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum
    outputs:
      artifacts:
        - key: go-binaries
          path: go-binaries

  # ── Build coop from source → artifact ───────────────────────────────
  # External deps are pre-compiled by coop-precompiled; this task only
  # compiles the two workspace crates (coop + coopmux), which is fast.
  # `rust` must be in the use list — coop-precompiled's layer is a delta
  # that doesn't include the Rust toolchain itself. Without it, build-coop
  # downloads a fresh rustc whose binary hash doesn't match the fingerprints
  # in the precompiled cache, causing Cargo to recompile all deps.
  - key: build-coop
    use: [code, rust, coop-precompiled]
    # Reuse Cargo's incremental build cache between runs (see top-level
    # tool-cache vault). Complements coop-precompiled (which caches external
    # crates) by also caching workspace-crate compilations across runs.
    tool-cache: build-coop
    timeout: 10m
    filter:
      - coop/**/*.rs
      - coop/**/*.toml
      - coop/proto/**
      - coop/Cargo.lock
      - coop/crates/web/dist/**
      - .rwx/coop-precompiled.epoch
    run: |
      . "$HOME/.cargo/env"
      export RUSTC_WRAPPER=""
      mkdir -p /tmp/coop-target/release
      echo "=== build-coop: extracting precompiled deps ==="
      T0=$(date +%s)
      tar -xzf ${{ tasks.coop-precompiled.artifacts.precompiled-tar }} -C /tmp/coop-target/release
      T1=$(date +%s)
      echo "  extract: $((T1-T0))s"
      echo "  precompiled deps: $(find /tmp/coop-target/release/deps -name '*.rlib' 2>/dev/null | wc -l) rlibs"
      cd coop
      # Coverage instrumentation: pass --init cover=1 to enable.
      if [ "${COVER}" = "1" ]; then
        export RUSTFLAGS="-C instrument-coverage"
        echo "=== Coverage instrumentation ENABLED ==="
      fi
      echo "=== build-coop: cargo build (workspace crates only if cache works) ==="
      CARGO_TARGET_DIR=/tmp/coop-target cargo build --release \
        --workspace --exclude coop-specs
      T2=$(date +%s)
      echo "  cargo build: $((T2-T1))s"
      mkdir -p ../coop-bin
      cp /tmp/coop-target/release/coop ../coop-bin/coop
      cp /tmp/coop-target/release/coopmux ../coop-bin/coopmux
      strip --strip-debug ../coop-bin/coop ../coop-bin/coopmux 2>/dev/null || true
      ls -la ../coop-bin/
      echo "=== build-coop total: $((T2-T0))s ==="
      # Sanity check: real binaries are >1MB; stubs are ~300KB.
      for bin in ../coop-bin/coop ../coop-bin/coopmux; do
        size=$(stat -c%s "$bin")
        if [ "$size" -lt 1000000 ]; then
          echo "FATAL: $bin is only ${size} bytes — likely a stub binary" >&2
          exit 1
        fi
      done
    env:
      COVER: ${{ init.cover }}
    outputs:
      artifacts:
        - key: coop-binaries
          path: coop-bin

  # ── Build kd from source → artifact (MONOREPO: no more download) ───
  - key: build-kd
    use: kbeads-deps
    # Reuse Go's incremental build cache between runs (see top-level
    # tool-cache vault).
    tool-cache: build-kd
    run: |
      cd kbeads
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # kd reports its build via `kd version`/`kd --version`, and the SAME
      # binary runs the daemon (`kd serve`) whose X-Kbeads-Version header drives
      # the version-skew signal (ka-0000002965). Inject version/commit/branch/date.
      KD_LDFLAGS="-s -w -X main.Version=${REF_NAME} -X main.Commit=${COMMIT_SHA} -X gardenio/kbeads/internal/buildinfo.Branch=${REF_NAME} -X gardenio/kbeads/internal/buildinfo.Date=${BUILD_DATE}"
      # Coverage instrumentation: pass --init cover=1 to enable.
      COVER_FLAGS=""
      if [ "${COVER}" = "1" ]; then
        COVER_FLAGS="-cover -coverpkg=./..."
        echo "=== Coverage instrumentation ENABLED ==="
      fi
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${KD_LDFLAGS}" \
        -o ../kd-bin/kd ./cmd/kd/
      ls -la ../kd-bin/
    env:
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}
      COVER: ${{ init.cover }}
    filter:
      - kbeads/**/*.go
      - kbeads/**/*.sql
      - kbeads/go.mod
      - kbeads/go.sum
      # kbeads imports the local clicreds module via `replace =>
      # ../gardenio/clicreds`; the build needs its full source materialized
      # or `go build` FATALs on the missing local module (ka-0000003839).
      - gardenio/clicreds/**/*.go
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum
    outputs:
      artifacts:
        - key: kd-binaries
          path: kd-bin

  # ═══════════════════════════════════════════════════════════════════════
  # Coverage-instrumented build tasks (W2, ka-0000005395)
  # Always-on parallel siblings of the non-cover builds. Always compile
  # with coverage instrumentation, regardless of init.cover. Output to
  # *-cover artifacts so the *-cover push tasks have a stable input.
  # The chart's gardenio.imageRef helper appends "-cover" to the repo name
  # when global.coverage.enabled=true, pulling these images instead.
  # PR builds skip these to keep CI fast.
  # ═══════════════════════════════════════════════════════════════════════

  # ── Build cover-instrumented Go binaries → artifact ────────────────
  - key: build-go-binaries-cover
    use: gardenio-deps
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    tool-cache: build-go-binaries-cover
    run: |
      cd gardenio/controller
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      VERSION_LDFLAGS="-s -w -X main.version=${REF_NAME} -X main.commit=${COMMIT_SHA}"
      # See the non-cover build block above: gb needs version/commit/branch/date
      # for `gb version` + the skew signal (ka-0000002965).
      GB_LDFLAGS="${VERSION_LDFLAGS} -X gardenio/controller/internal/buildinfo.Branch=${REF_NAME} -X gardenio/controller/internal/buildinfo.Date=${BUILD_DATE}"
      COVER_FLAGS="-cover -coverpkg=./..."
      mkdir -p ../../go-binaries-cover
      T0=$(date +%s)
      echo "=== Building 11 Go binaries (COVER ON) ==="
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/controller ./cmd/controller/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${GB_LDFLAGS}" -o ../../go-binaries-cover/gb ./cmd/gb/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/slack-bridge ./cmd/slack-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/jira-bridge ./cmd/jira-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/gitlab-bridge ./cmd/gitlab-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/roles-server ./cmd/roles-server/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/claudemore ./cmd/claudemore/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/beads-viewer ./cmd/beads-viewer/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/repro-cockpit ./cmd/repro-cockpit/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/trigger-engine ./cmd/trigger-engine/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/grafana-bridge ./cmd/grafana-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/alertmanager-bridge ./cmd/alertmanager-bridge/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/idp-log-shipper ./cmd/idp-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/ava-log-shipper ./cmd/ava-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/traefik-log-shipper ./cmd/traefik-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/bridge-log-shipper ./cmd/bridge-log-shipper/
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${VERSION_LDFLAGS}" -o ../../go-binaries-cover/core-log-shipper ./cmd/core-log-shipper/
      T1=$(date +%s)
      echo "=== All cover Go binaries built in $((T1-T0))s ==="
      ls -la ../../go-binaries-cover/
    env:
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}
      REF_NAME: ${{ init.ref-name }}
    filter:
      - gardenio/controller/**/*.go
      - gardenio/controller/**/*.html
      - gardenio/controller/**/*.md
      - gardenio/controller/**/*.js
      - gardenio/controller/**/*.css
      - gardenio/controller/**/web/**
      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
      # See build-go-binaries — controller's `replace => ../clicreds` needs
      # the local module source materialized for the cover build too
      # (ka-0000003839).
      - gardenio/clicreds/**/*.go
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum
    outputs:
      artifacts:
        - key: go-binaries-cover
          path: go-binaries-cover

  # ── Build cover-instrumented coop/coopmux → artifact ───────────────
  - key: build-coop-cover
    use: [code, rust, coop-precompiled]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    tool-cache: build-coop-cover
    timeout: 15m
    # Rust + LTO + -C instrument-coverage on the workspace blows the default
    # agent memory budget (SIGKILL during rustc), see ka-0000001251. Match the
    # coop-precompiled tier so the cover build has headroom.
    agent:
      cpus: 4
      memory: 16gb
      tmpfs: true
    filter:
      - coop/**/*.rs
      - coop/**/*.toml
      - coop/proto/**
      - coop/Cargo.lock
      - coop/crates/web/dist/**
      - .rwx/coop-precompiled.epoch
    run: |
      . "$HOME/.cargo/env"
      export RUSTC_WRAPPER=""
      mkdir -p /tmp/coop-target-cover/release
      tar -xzf ${{ tasks.coop-precompiled.artifacts.precompiled-tar }} -C /tmp/coop-target-cover/release
      cd coop
      export RUSTFLAGS="-C instrument-coverage"
      echo "=== build-coop-cover: cargo build with instrument-coverage ==="
      CARGO_TARGET_DIR=/tmp/coop-target-cover cargo build --release \
        --workspace --exclude coop-specs
      mkdir -p ../coop-bin-cover
      cp /tmp/coop-target-cover/release/coop ../coop-bin-cover/coop
      cp /tmp/coop-target-cover/release/coopmux ../coop-bin-cover/coopmux
      # Do NOT strip — coverage profiles need symbol info.
      ls -la ../coop-bin-cover/
      for bin in ../coop-bin-cover/coop ../coop-bin-cover/coopmux; do
        size=$(stat -c%s "$bin")
        if [ "$size" -lt 1000000 ]; then
          echo "FATAL: $bin is only ${size} bytes — likely a stub binary" >&2
          exit 1
        fi
      done
    outputs:
      artifacts:
        - key: coop-binaries-cover
          path: coop-bin-cover

  # ── Build cover-instrumented kd → artifact ─────────────────────────
  - key: build-kd-cover
    use: kbeads-deps
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    tool-cache: build-kd-cover
    run: |
      cd kbeads
      REF_NAME="${REF_NAME#refs/tags/}"
      REF_NAME="${REF_NAME#refs/heads/}"
      BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # See build-kd: version/commit/branch/date for `kd version` + skew signal.
      KD_LDFLAGS="-s -w -X main.Version=${REF_NAME} -X main.Commit=${COMMIT_SHA} -X gardenio/kbeads/internal/buildinfo.Branch=${REF_NAME} -X gardenio/kbeads/internal/buildinfo.Date=${BUILD_DATE}"
      COVER_FLAGS="-cover -coverpkg=./..."
      mkdir -p ../kd-bin-cover
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ${COVER_FLAGS} \
        -ldflags="${KD_LDFLAGS}" \
        -o ../kd-bin-cover/kd ./cmd/kd/
      ls -la ../kd-bin-cover/
    env:
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}
    filter:
      - kbeads/**/*.go
      - kbeads/**/*.sql
      - kbeads/go.mod
      - kbeads/go.sum
      # See build-kd — kbeads' `replace => ../gardenio/clicreds` needs the
      # local module source materialized for the cover build too
      # (ka-0000003839).
      - gardenio/clicreds/**/*.go
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum
    outputs:
      artifacts:
        - key: kd-binaries-cover
          path: kd-bin-cover

  # ═══════════════════════════════════════════════════════════════════════
  # Push tasks — crane-append layers to ubuntu:24.04, push to $IMAGE_REGISTRY.
  # ═══════════════════════════════════════════════════════════════════════

  # ── Shared crane install + registry login ─────────────────────────────
  # Auth: uses REGISTRY_USER + REGISTRY_TOKEN from vault, falls back to
  # GHCR_TOKEN + GITHUB_USER for legacy compatibility.
  - key: install-crane
    cache: false
    run: |
      set -ex
      curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
        | tar xz -C /tmp crane
      sudo mv /tmp/crane /usr/local/bin/
      IMAGE_REGISTRY="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}"
      REGISTRY_HOST="${IMAGE_REGISTRY%%/*}"
      REG_USER="${REGISTRY_USER:-$GITHUB_USER}"
      REG_TOKEN="${REGISTRY_TOKEN:-$GHCR_TOKEN}"
      set +x  # never xtrace the token into the log (ka-0000002171)
      echo "$REG_TOKEN" | crane auth login "$REGISTRY_HOST" -u "$REG_USER" --password-stdin
      set -x
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GITHUB_USER: ${{ secrets.GITHUB_USER }}

  # ── Push controller ─────────────────────────────────────────────────
  - key: push-controller
    use: [code, build-go-binaries, install-crane]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    cache: false
    run: |
      set -ex
      # Tag strategy: main → main-<sha>, tag → <calver>-rc, other → as-is
      # (mutable :latest retired — F7 ka-0000006416; main-<sha> is per-commit
      # immutable, deploy paths pin <calver>/<calver>-rc, nothing pulls :latest)
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"
      else
        TAG="${REF_NAME}"
      fi

      mkdir -p /tmp/layer/etc/ssl/certs
      cp ${{ tasks.build-go-binaries.artifacts.go-binaries }}/controller /tmp/layer/controller
      chmod 755 /tmp/layer/controller
      cp /etc/ssl/certs/ca-certificates.crt /tmp/layer/etc/ssl/certs/
      tar -cf /tmp/layer.tar -C /tmp/layer .

      REPO="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}/controller"
      crane append --base ubuntu:24.04 --new_tag "${REPO}:${TAG}" --new_layer /tmp/layer.tar --platform linux/amd64
      DIGEST=$(crane digest "${REPO}:${TAG}")
      crane mutate "${REPO}@${DIGEST}" --entrypoint /controller --user nobody --label "org.opencontainers.image.revision=${COMMIT_SHA}" --label "org.opencontainers.image.ref.name=${REF_NAME}" -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG}"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}


  # ── Push slack-bridge ───────────────────────────────────────────────
  - key: push-slack-bridge
    use: [code, build-go-binaries, install-crane]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    cache: false
    run: |
      set -ex
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"
      else
        TAG="${REF_NAME}"
      fi

      mkdir -p /tmp/layer/etc/ssl/certs
      cp ${{ tasks.build-go-binaries.artifacts.go-binaries }}/slack-bridge /tmp/layer/slack-bridge
      chmod 755 /tmp/layer/slack-bridge
      cp /etc/ssl/certs/ca-certificates.crt /tmp/layer/etc/ssl/certs/
      tar -cf /tmp/layer.tar -C /tmp/layer .

      REPO="${IMAGE_REGISTRY:-registry.gitlab.com/acme/platform/gardenio}/slack-bridge"
      crane append --base ubuntu:24.04 --new_tag "${REPO}:${TAG}" --new_layer /tmp/layer.tar --platform linux/amd64
      DIGEST=$(crane digest "${REPO}:${TAG}")
      crane mutate "${REPO}@${DIGEST}" --entrypoint /slack-bridge --user nobody --label "org.opencontainers.image.revision=${COMMIT_SHA}" --label "org.opencontainers.image.ref.name=${REF_NAME}" -t "${REPO}:${TAG}"
      echo "Pushed ${REPO}:${TAG}"
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REF_NAME: ${{ init.ref-name }}
      COMMIT_SHA: ${{ tasks.resolve-commit.values.sha }}


  # ── Push jira-bridge ────────────────────────────────────────────────
  - key: push-jira-bridge
    use: [build-go-binaries, install-crane]
    if: ${{ init.ref-name != 'pr' && init.build-target == 'all' }}
    cache: false
    run: |
      set -ex
      if [[ "$REF_NAME" == refs/tags/20* ]]; then
        TAG="${REF_NAME#refs/tags/}-rc"
      elif [[ "$REF_NAME" == refs/heads/* ]]; then
        TAG="main-${COMMIT_SHA:0:7}"
      else
        TAG="${REF_NAME}"
      fi

      mkdir -p /tmp/layer/etc/ssl/certs
      cp ${{ tasks.build-go-binaries.artifacts.go-binaries }}/jira-bridge /tmp/layer/jira-bridge
      chmod 755 /tmp/layer/jira-bridge
      cp /etc/ssl/certs/ca-certificates.crt /tmp/layer/etc/ssl/certs/
      tar -cf /tmp/layer.tar -C /tmp/layer .


  # ── Install coop + claudeless for the local-mode e2e module ────────
  # test-local-mode.sh (the `local-mode` shard module) exercises
  # `gb agent start --local`, which spawns coop wrapping a claudeless
  # scenario. Without these on PATH the script exits 0 with SKIP.
  #
  # Source choices:
  #   coop       — extracted from the registry image gardenio/coop. The tag
  #                is derived to match the rest of the release pipeline:
  #                  - explicit --param version=<calver>     -> <calver>-rc
  #                  - else bare or refs/tags/<calver> (20*) -> <calver>-rc
  #                  - else (main-push, schedule, CLI run)   -> main-<sha7>
  #                This mirrors the derivation in .rwx/deploy-rwx.yml's
  #                verify-images task. On tag pipelines this fixes the race
  #                where the per-tag docker.yml has published <calver>-rc
  #                but the main-push docker.yml has not yet published
  #                main-<sha7>, leaving install-coop-claudeless with no
  #                image to pull (ka-0000000436). Caching by `:latest` is
  #                still avoided so coop fixes are not masked
  #                (ka-0000006549).
  #   claudeless — pinned upstream release, mirrors coop/.rwx/ci.yml's
  #                install-claudeless task to keep behavior consistent.
  #
  # cache: false — coop binary must reflect the dispatch commit, so we
  # always re-extract. The task is small (≈15s) so the savings from
  # caching are minimal.
  - key: install-coop-claudeless
    cache: false
    run: |
      set -ex
      # crane pulls the coop binary out of the registry image without
      # needing a docker daemon.
      curl -fsSL \
        "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
        | tar xz -C /tmp crane
      sudo mv /tmp/crane /usr/local/bin/crane

      REGISTRY_HOST="${IMAGE_REGISTRY%%/*}"
      set +x  # never xtrace the token into the log (ka-0000002171)
      echo "$REGISTRY_TOKEN" \
        | crane auth login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
      set -x

      # Derive coop image tag — same logic as deploy-rwx.yml verify-images.
      BARE_REF="${REF_NAME#refs/tags/}"
      BARE_REF="${BARE_REF#refs/heads/}"
      if [ -n "$VERSION" ]; then
        COOP_TAG="${VERSION}-rc"
      elif [[ "$BARE_REF" == 20* ]]; then
        COOP_TAG="${BARE_REF}-rc"
      else
        COOP_TAG="main-${COMMIT_SHA:0:7}"
      fi
      echo "Resolved coop tag: $COOP_TAG (version=${VERSION:-} ref-name=${REF_NAME:-} sha=${COMMIT_SHA:0:7})"

      # Poll the registry — the tag pipeline depends on docker.yml having
      # already published the chosen tag. deploy-rwx.yml/verify-images
      # already gates on the controller image; coop is built in the same
      # docker.yml run, so it should be present by the time e2e runs. The
      # short poll absorbs any per-image push skew (ka-0000000436).
      WAIT_TIMEOUT_SEC="${WAIT_TIMEOUT_SEC:-300}"   # 5 min cap
      WAIT_INTERVAL_SEC="${WAIT_INTERVAL_SEC:-15}"
      DEADLINE=$(( $(date +%s) + WAIT_TIMEOUT_SEC ))
      ATTEMPT=0
      while true; do
        ATTEMPT=$((ATTEMPT + 1))
        if crane manifest "${IMAGE_REGISTRY}/coop:${COOP_TAG}" >/dev/null 2>&1; then
          echo "OK: ${IMAGE_REGISTRY}/coop:${COOP_TAG} exists (attempt ${ATTEMPT})"
          break
        fi
        NOW=$(date +%s)
        if [ "$NOW" -ge "$DEADLINE" ]; then
          echo "FATAL: ${IMAGE_REGISTRY}/coop:${COOP_TAG} not in registry after ${WAIT_TIMEOUT_SEC}s (${ATTEMPT} attempts)."
          echo "       Verify .rwx/docker.yml for commit ${COMMIT_SHA:0:7} succeeded — see https://cloud.rwx.com/mint/acme (filter on docker.yml)."
          exit 1
        fi
        REMAINING=$((DEADLINE - NOW))
        echo "Image ${IMAGE_REGISTRY}/coop:${COOP_TAG} not yet pushed; retry in ${WAIT_INTERVAL_SEC}s (attempt ${ATTEMPT}, ${REMAINING}s remaining)..."
        sleep "$WAIT_INTERVAL_SEC"
      done

      mkdir -p /tmp/coop-extract
      crane export "${IMAGE_REGISTRY}/coop:${COOP_TAG}" - \
        | tar -xC /tmp/coop-extract usr/local/bin/coop
      sudo install /tmp/coop-extract/usr/local/bin/coop /usr/local/bin/coop
      coop --version || coop --help 2>&1 | head -1

      # claudeless from upstream release (matches coop/.rwx/ci.yml v0.4.0).
      curl -fsSL -o /tmp/claudeless.tar.gz \
        https://github.com/alfredjeanlab/claudeless/releases/download/v0.4.0/claudeless-linux-x86_64.tar.gz
      sudo tar -xzf /tmp/claudeless.tar.gz -C /usr/local/bin
      sudo chmod +x /usr/local/bin/claudeless
      claudeless --version
    env:
      IMAGE_REGISTRY: ${{ secrets.IMAGE_REGISTRY }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      COMMIT_SHA: ${{ init.commit-sha }}
      VERSION: ${{ init.version }}
      REF_NAME: ${{ init.ref-name }}

  # ── Install pinned Claude Code CLI (shard 0 only) ────────────────────
  # The claudemore-REPLAY tier (claudemore-hooks, ka-0000004452) drives the
  # REAL `claude` binary through claudemore at $0. Without a `claude` on PATH
  # test-claudemore-hooks.sh SKIP-cleans on its first preflight, so the module
  # counted green-by-skip on EVERY run (0 assertions) — the exact defect
  # decision ka-0000004333 exists to close. This installs a pinned,
  # integrity-checked claude so the module RUNS. Only shard 0 needs it (both
  # claudemore modules are pinned to shard 0 in run-shard.sh), so it rides
  # ONLY e2e-shard-0's use: list, mirroring install-coop-claudeless's shape.
  #
  # The npm meta package (@anthropic-ai/claude-code) is a ~20KB WRAPPER whose
  # postinstall copies the platform-native binary over a stub — a meta-only
  # install yields a NON-WORKING claude. The real ELF is `package/claude` in
  # the per-arch package (@anthropic-ai/claude-code-linux-x64), a self-contained
  # glibc binary that runs with no node/npm on the ubuntu:24.04 base. We extract
  # it directly (like install-coop-claudeless extracts the coop/claudeless
  # binaries) rather than doing an offline `npm install -g` — keeping the sha512
  # integrity check meaningful without pulling node onto the runner. RWX runners
  # are x86_64, so the x64 tarball is authoritative; VERSION + digest are SOURCED
  # from the pin files (never hard-coded here) so there is a single source of
  # truth and no drift — same pattern as .rwx/microvm-image.yml's fetch-claude-code.
  - key: install-claude
    use: code
    filter:
      - gardenio/images/agent/install/versions.env
      - gardenio/images/agent/install/checksums.env
    run: |
      set -ex
      source gardenio/images/agent/install/versions.env
      source gardenio/images/agent/install/checksums.env
      curl -fsSL -o /tmp/claude-code-linux-x64.tgz \
        "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
      printf '%s  %s\n' "${CLAUDE_CODE_X64_SHA512}" /tmp/claude-code-linux-x64.tgz | sha512sum -c -
      # The native tarball's top-level `package/claude` is the standalone ELF.
      tar -xzf /tmp/claude-code-linux-x64.tgz -C /tmp --strip-components=1 package/claude
      sudo install /tmp/claude /usr/local/bin/claude
      rm -f /tmp/claude-code-linux-x64.tgz /tmp/claude
      claude --version

  # ── Verify cluster access ────────────────────────────────────────────
  - key: verify-cluster
    use: kubeconfig
    run: |
      # E2: derive per-instance namespace. Order: explicit `namespace` param
      # (legacy override) → gardenio-rwx-<instance-id> → fall back to
      # gardenio-rwx-<short-sha> for back-compat with bare CLI dispatches.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      BEADS_SVC="${BEADS_SVC:-${NAMESPACE}-beads}"
      echo "Verifying cluster access in namespace: $NAMESPACE (svc: $BEADS_SVC)"
      kubectl -n "$NAMESPACE" get svc "$BEADS_SVC"
      echo "Cluster access verified"
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}

  # ── Load beads token from K8s secret ─────────────────────────────────
  - key: load-token
    use: verify-cluster
    run: |
      # E2: derive per-instance namespace. Order: explicit `namespace` param
      # (legacy override) → gardenio-rwx-<instance-id> → fall back to
      # gardenio-rwx-<short-sha> for back-compat with bare CLI dispatches.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      TOKEN=$(kubectl -n "$NAMESPACE" get secret kd-beads-token \
        -o jsonpath='{.data.token}' | base64 -d)
      if [ -z "$TOKEN" ]; then
        echo "ERROR: Could not load beads token from secret kd-beads-token"
        exit 1
      fi
      echo "Token loaded from kd-beads-token secret"
      # Write token to file for downstream tasks
      echo "$TOKEN" > /tmp/beads-token
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}

  # ── E2E setup (one-shot fixture seeding, shared by all shards) ──────
  # Seeds type configs + test user beads once, before any shard runs.
  # This avoids 4 shards racing on idempotent-but-noisy PUTs/POSTs.
  - key: e2e-setup
    use: [build-gb, build-kd, load-token]
    # 10m wraps the wait-for-stack-ready.sh readiness gate (STACK_READY_TIMEOUT_S
    # default 420s, raised from 300s in ka-0000005545 to absorb POC cold-start)
    # plus the context banner + reaper-lease refresh, with margin so the task
    # timeout never fires BEFORE the gate's own diagnostic dump.
    timeout: 10m
    run: |
      # E2: derive per-instance namespace. Order: explicit `namespace` param
      # (legacy override) → gardenio-rwx-<instance-id> → fall back to
      # gardenio-rwx-<short-sha> for back-compat with bare CLI dispatches.
      # Exported so wait-for-stack-ready.sh below sees the per-instance
      # namespace and does not fall through to its `gardenio-rwx` (singleton)
      # default — see ka-0000002410.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      export NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      BEADS_SVC="${BEADS_SVC:-${NAMESPACE}-beads}"

      # Gate: the main-push pipeline runs deploy-rwx and this e2e pipeline
      # as two uncoordinated RWX runs. Block here until the stack has
      # settled so shards don't see services flicker mid-test. ka-0000005539.
      ./gardenio/tests/e2e/scripts/wait-for-stack-ready.sh

      # Per-instance ephemeral namespaces (gardenio-rwx-<instance-id>) mean
      # concurrent deploy + e2e dispatches cannot collide on shared state —
      # there is no cross-run lock to acquire. ka-0000003189.

      # ── E2E test context banner ──────────────────────────────────────
      # This dispatch tests DEPLOYED app code with CURRENT test scripts.
      # To test new app code: cut a release (-rc) or let main-push CI run
      # deploy-rwx. See advice kd-<see-rollout-memory>.
      #
      # Banner is informational only — wrap in a subshell with relaxed
      # shell strictness so any failure here can NEVER kill the e2e task.
      ( set +e; set +o pipefail
      echo ""
      echo "════════════════════════════════════════════════════════════════════"
      echo "  E2E TEST CONTEXT"
      echo "════════════════════════════════════════════════════════════════════"
      DEPLOYED_IMAGE=$(kubectl -n "$NAMESPACE" get deploy "${NAMESPACE}-beads" \
        -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "unknown")
      DEPLOYED_TAG="${DEPLOYED_IMAGE##*:}"
      # .git is not present in this task (we `use: build-gb build-kd load-token`,
      # not `code`), so fall back to the init-injected commit-sha env var.
      CURRENT_SHA="${INIT_COMMIT_SHA:-$(git rev-parse HEAD 2>/dev/null || echo "unknown")}"
      TAG_ON_SHA=$(git tag --points-at "$CURRENT_SHA" 2>/dev/null | awk '/^20[0-9]{2}\./ { print; exit }')
      if [ -n "$TAG_ON_SHA" ]; then
        EXPECTED_TAG="${TAG_ON_SHA}-rc"
      else
        EXPECTED_TAG="main-${CURRENT_SHA:0:7}"
      fi

      echo "  gardenio-rwx running:    $DEPLOYED_TAG"
      echo "  this dispatch targets:  $EXPECTED_TAG  (commit ${CURRENT_SHA:0:7})"
      echo ""
      if [ "$DEPLOYED_TAG" = "$EXPECTED_TAG" ]; then
        echo "  ✓ APP CODE MATCHES — tests exercise exactly what this commit builds."
      else
        echo "  ⚠ APP CODE DOES NOT MATCH THIS DISPATCH."
        echo ""
        echo "  Tests will run against APP CODE from: $DEPLOYED_TAG"
        echo "  Tests use TEST SCRIPTS from:          $EXPECTED_TAG  ($CURRENT_SHA)"
        echo ""

        # Try to resolve deployed tag to a commit we can log from
        DEPLOYED_SHA=""
        if [[ "$DEPLOYED_TAG" == main-* ]]; then
          DEPLOYED_SHA=$(git rev-parse "${DEPLOYED_TAG#main-}" 2>/dev/null || true)
        elif [[ "$DEPLOYED_TAG" == 20[0-9][0-9].*-rc ]]; then
          DEPLOYED_SHA=$(git rev-parse "${DEPLOYED_TAG%-rc}" 2>/dev/null || true)
        fi

        if [ -n "$DEPLOYED_SHA" ]; then
          AHEAD=$(git rev-list --count "$DEPLOYED_SHA..$CURRENT_SHA" 2>/dev/null || echo "?")
          if [ "$AHEAD" != "?" ] && [ "$AHEAD" != "0" ]; then
            echo "  UNTESTED CHANGES IN THIS RUN ($AHEAD commits since $DEPLOYED_TAG):"
            git log --oneline "$DEPLOYED_SHA..$CURRENT_SHA" 2>/dev/null | head -20 | sed 's/^/    /'
            TOTAL=$(git log --oneline "$DEPLOYED_SHA..$CURRENT_SHA" 2>/dev/null | wc -l | tr -d ' ')
            if [ "$TOTAL" -gt 20 ]; then
              echo "    ... ($(($TOTAL - 20)) more commits, truncated)"
            fi
            echo ""
          fi
        else
          echo "  (could not resolve $DEPLOYED_TAG to a commit for diff — shallow clone or unknown tag)"
          echo ""
        fi

        echo "  To actually test new app code in gardenio-rwx:"
        echo "    - Cut a release tag:  ./scripts/release.sh     (triggers deploy-rwx + e2e-rwx)"
        echo "    - Or merge to main:   the main-push pipeline runs deploy-rwx automatically"
        echo "  Ad-hoc rwx dispatch .rwx/e2e.yml does NOT redeploy. It is still useful for:"
        echo "    - Retrying flaky test modules against the current deploy"
        echo "    - Running new/updated test scripts against the existing app code"
      fi
      echo "════════════════════════════════════════════════════════════════════"
      echo ""
      true ) || true

      kubectl -n "$NAMESPACE" port-forward "svc/${BEADS_SVC}" 19090:8080 &
      PF_PID=$!
      sleep 3
      export BEADS_TOKEN="$(cat /tmp/beads-token 2>/dev/null || echo "")"
      export BEADS_HTTP_URL="http://localhost:19090"
      ./gardenio/tests/e2e/scripts/seed-types-and-users.sh
      kill "$PF_PID" 2>/dev/null || true
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      INIT_COMMIT_SHA: ${{ init.commit-sha }}
      COMMIT_SHA: ${{ init.commit-sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}
    outputs:
      filesystem: false

  # ── E2E shards (4-way parallel) ──────────────────────────────────────
  # Each shard runs a subset of modules determined by shard_for() in
  # run-shard.sh. Pinned heavy modules + cksum(name)%4 hash for the rest.
  # Balanced by MEASURED RUNTIME, not module count (ka-0000001993): the pins
  # bin-pack per-module wall-clock (max across five 2026-08-04 release RCs) so
  # each shard's base p95 sits at ~8.9–9.5m and worst-case + a full heaviest-
  # module retry stays ≤15m — comfortably under the 25m task budget below.
  # Module COUNTS are now uneven (39/26/30/41) BY DESIGN: shards 0/3 carry more
  # sub-5s hash-tail modules to offset shards 1/2 each owning one 280–360s heavy
  # (cred-rotation-resume / pool-assign-attribution). The prior count-balance
  # (36/35/37/28) hid a 5× runtime spread (836s vs 166s) that timed shard 1 out
  # on a single retry. Constraints preserved: config-*→shard3, slack-*→shard2,
  # from-source Go probes→shard0 (their build-*-probe use: lists, below).
  - key: e2e-shard-0
    use: [build-gb, build-kd, build-beads-viewer, build-trigger-engine, build-trigger-probe, build-jira-conv-probe, build-jira-syncback-probe, build-gitlab-prov-probe, build-gitlab-pipeline-trigger-probe, build-gitlab-pipeline-minduration-probe, build-grafana-bridge-probe, build-mr-reopen-probe, build-agent-feedback-probe, load-token, install-coop-claudeless, install-claude, install-captain, e2e-setup]
    # 25m task budget (all four shards share it). History: 15m→20m after the
    # ka-0000006868 count-rebalance; 20m→25m (ka-0000008024) for cold-POC-EBS
    # first-touch I/O. The ka-0000001993 runtime-weight rebalance drops shard-0
    # base to ~8.9m (from ~12.8m), but the 25m budget is RETAINED as headroom
    # for cold-cache RCs + the 1-retry tax. run-shard.sh's SHARD_BUDGET_SECONDS
    # default is bumped to 1500 in lockstep — keep the two in sync.
    timeout: 25m
    run: |
      # Captain wraps run-shard.sh so retries, quarantine, and the failure
      # summary go through .captain/config.yml. JUnit lands at
      # junit-results-${E2E_SHARD}/e2e-summary.xml; we override --test-results
      # so per-shard captain invocations see the right file. ka-0000004315.
      #
      # --language Python --framework unittest activates Captain's targeted
      # retry templating (ka-0000000510). Python+unittest is the cleanest
      # match for our generic-JUnit XML: PythonUnitTestParser accepts our
      # <testsuites><testsuite><testcase classname=... name=.../> shape
      # unchanged, and PythonUnitTestSubstitution templates {{ tests }} as
      # a single space-delimited list of `'<classname>.<name>'` tokens —
      # captain-retry.sh strips the dotted classname prefix to recover the
      # bare module name for ONLY=. These flags are NOT yaml-bindable in
      # captain v2 — they must be on the CLI.
      #
      # --intermediate-artifacts-path preserves per-attempt e2e-summary.xml
      # (run-shard.sh overwrites the same path on each retry, so without
      # this the original-attempt XML would be clobbered).
      # E2: derive per-instance namespace if not explicitly set.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      export NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      export E2E_SHARD=0 TOTAL_SHARDS=4
      captain run --suite-id=gardenio-e2e \
        --language Python --framework unittest \
        --test-results="junit-results-${E2E_SHARD}/e2e-summary.xml" \
        --intermediate-artifacts-path="junit-results-${E2E_SHARD}/captain-intermediate" \
        -- ./gardenio/tests/e2e/scripts/run-shard.sh
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      KEEP_NAMESPACE: ${{ init.keep }}
      ONLY: ${{ init.only }}
      SKIP: ${{ init.skip }}
      # Fail-loud outbox rig knob (ka-0000007489): dormant (empty) by default, so
      # the live outbox matrix skip-PASSES an absent rig exactly as before. When a
      # scheduled readiness dispatch sets require-outbox-rig=true (AFTER the sandbox
      # creds are provisioned into this namespace), outbox_rig_guard turns an absent
      # rig/seat into a hard NO-GO FAIL in the shard that owns jira-outbox-*.
      REQUIRE_OUTBOX_RIG: ${{ init.require-outbox-rig }}
      CAPTAIN_POISON_MODULE: ${{ init.captain-poison-module }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}
    outputs:
      artifacts:
        - key: junit-results-0
          path: junit-results-0

  - key: e2e-shard-1
    # install-victoria-logs arms the idp-audit-fieldcontract gate (ka-0000004993):
    # the module is pinned to shard 1 in run-shard.sh's shard_for(), so ONLY this
    # shard's use: list carries the chart-pinned victoria-logs-prod binary that
    # turns its LOUD-SKIP into a HARD gate.
    use: [build-gb, build-kd, build-trigger-engine, build-trigger-probe, install-victoria-logs, load-token, install-coop-claudeless, install-captain, e2e-setup]
    # 25m task budget (see shard 0). Under ka-0000001993 shard 1 owns the two
    # heaviest cred modules (cred-rotation-resume 283s + credential-rotation
    # 225s) on just 26 modules; base ~9.5m, worst-case + retry ~14.2m. The old
    # count-balance made shard 1 the heaviest at 836s (13.9m) and one retry away
    # from the timeout — the 134.2/134.3 class of failures (ka-0000007944).
    timeout: 25m
    run: |
      # E2: derive per-instance namespace if not explicitly set.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      export NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      export E2E_SHARD=1 TOTAL_SHARDS=4
      captain run --suite-id=gardenio-e2e \
        --language Python --framework unittest \
        --test-results="junit-results-${E2E_SHARD}/e2e-summary.xml" \
        --intermediate-artifacts-path="junit-results-${E2E_SHARD}/captain-intermediate" \
        -- ./gardenio/tests/e2e/scripts/run-shard.sh
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      KEEP_NAMESPACE: ${{ init.keep }}
      ONLY: ${{ init.only }}
      SKIP: ${{ init.skip }}
      # Fail-loud outbox rig knob (ka-0000007489): dormant (empty) by default, so
      # the live outbox matrix skip-PASSES an absent rig exactly as before. When a
      # scheduled readiness dispatch sets require-outbox-rig=true (AFTER the sandbox
      # creds are provisioned into this namespace), outbox_rig_guard turns an absent
      # rig/seat into a hard NO-GO FAIL in the shard that owns jira-outbox-*.
      REQUIRE_OUTBOX_RIG: ${{ init.require-outbox-rig }}
      CAPTAIN_POISON_MODULE: ${{ init.captain-poison-module }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}
    outputs:
      artifacts:
        - key: junit-results-1
          path: junit-results-1

  - key: e2e-shard-2
    use: [build-gb, build-kd, build-trigger-engine, build-trigger-probe, load-token, install-coop-claudeless, install-captain, e2e-setup]
    # Bumped 15m → 20m for parity with sibling shards (ka-0000007944).
    # Bumped 20m → 25m (ka-0000008024) for cold-POC-EBS I/O margin; see shard 0.
    timeout: 25m
    run: |
      # E2: derive per-instance namespace if not explicitly set.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      export NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      export E2E_SHARD=2 TOTAL_SHARDS=4
      captain run --suite-id=gardenio-e2e \
        --language Python --framework unittest \
        --test-results="junit-results-${E2E_SHARD}/e2e-summary.xml" \
        --intermediate-artifacts-path="junit-results-${E2E_SHARD}/captain-intermediate" \
        -- ./gardenio/tests/e2e/scripts/run-shard.sh
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      KEEP_NAMESPACE: ${{ init.keep }}
      ONLY: ${{ init.only }}
      SKIP: ${{ init.skip }}
      # Fail-loud outbox rig knob (ka-0000007489): dormant (empty) by default, so
      # the live outbox matrix skip-PASSES an absent rig exactly as before. When a
      # scheduled readiness dispatch sets require-outbox-rig=true (AFTER the sandbox
      # creds are provisioned into this namespace), outbox_rig_guard turns an absent
      # rig/seat into a hard NO-GO FAIL in the shard that owns jira-outbox-*.
      REQUIRE_OUTBOX_RIG: ${{ init.require-outbox-rig }}
      # Fail-loud slack-ui knob (ka-0000006398): dormant (empty) by default, so
      # the real-user Slack module SKIP-passes an absent rig. Threaded onto shard
      # 2 only — slack-ui pins there with the rest of the slack cluster (see
      # shard_for in run-shard.sh). When a scheduled readiness dispatch sets
      # require-slack-ui=true (AFTER the test-Slack secrets are provisioned into
      # this namespace), test-slack-ui.sh turns an absent storageState secret /
      # scaffold / bridge into a hard FAIL instead of a silent skip.
      SLACK_UI_REQUIRE: ${{ init.require-slack-ui }}
      CAPTAIN_POISON_MODULE: ${{ init.captain-poison-module }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}
    outputs:
      artifacts:
        - key: junit-results-2
          path: junit-results-2

  - key: e2e-shard-3
    use: [build-gb, build-kd, build-trigger-engine, build-trigger-probe, load-token, install-coop-claudeless, install-captain, e2e-setup]
    # Shard 3 carries the serialized config-*/credential/escalation cluster
    # (24 pinned modules + ~7 hash-fallback). 15m was insufficient after the
    # 5785f46c config-* pin grew the cluster — ka-0000006868 observed SIGKILL
    # at 15m. Bumped to 20m to give captain-retry headroom.
    # Bumped 20m → 25m (ka-0000008024) for cold-POC-EBS I/O margin; see shard 0.
    timeout: 25m
    run: |
      # E2: derive per-instance namespace if not explicitly set.
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      export NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      export E2E_SHARD=3 TOTAL_SHARDS=4
      captain run --suite-id=gardenio-e2e \
        --language Python --framework unittest \
        --test-results="junit-results-${E2E_SHARD}/e2e-summary.xml" \
        --intermediate-artifacts-path="junit-results-${E2E_SHARD}/captain-intermediate" \
        -- ./gardenio/tests/e2e/scripts/run-shard.sh
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      KEEP_NAMESPACE: ${{ init.keep }}
      ONLY: ${{ init.only }}
      SKIP: ${{ init.skip }}
      # Fail-loud outbox rig knob (ka-0000007489): dormant (empty) by default, so
      # the live outbox matrix skip-PASSES an absent rig exactly as before. When a
      # scheduled readiness dispatch sets require-outbox-rig=true (AFTER the sandbox
      # creds are provisioned into this namespace), outbox_rig_guard turns an absent
      # rig/seat into a hard NO-GO FAIL in the shard that owns jira-outbox-*.
      REQUIRE_OUTBOX_RIG: ${{ init.require-outbox-rig }}
      CAPTAIN_POISON_MODULE: ${{ init.captain-poison-module }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}
    outputs:
      artifacts:
        - key: junit-results-3
          path: junit-results-3

  # ── Aggregate per-shard JSONL results into a single junit-results/ ───
  # HARDENED against aborted/timed-out shards (ka-0000001389). History of
  # the two dead-ends this task walked, so nobody re-treads them:
  #
  #   1. `${{ tasks.<shard>.artifacts.junit-results-N }}` ENV REFS
  #      (pre-ka-0000007944): a timed-out shard's task context has NO
  #      `artifacts` key (only .succeeded/.failed/.aborted/.timed-out/.id/…),
  #      so RWX rejected the whole config with "Invalid reference to a task"
  #      — masking the real timeout as a config error (2026.134.2/.3).
  #   2. `use: [e2e-shard-0..3]` (ka-0000007944): inheriting the shard
  #      filesystems dodged the artifacts ref, BUT a `use:` dep that
  #      times out is treated as failed, so RWX SKIPS this task entirely
  #      (verified: a timed-out `use:` dep → downstream `no_result`/skipped).
  #      The graceful partial-merge below then never ran, and downstream saw
  #      a missing junit-results artifact instead of a partial one.
  #
  # FIX (candidate #2 from the bead): resolve each shard's artifact at
  # RUNTIME via `rwx artifacts download <task-id>`, gated on an
  # `after:` that fires whether the shard SUCCEEDED or FAILED. Each shard's
  # `.id` IS present in its task context even when timed out (unlike
  # `.artifacts`), so the config always resolves; a missing artifact (the
  # timed-out shard never published one) is a clean, catchable
  # "Artifact … not found" (exit 1), not a config error. This is the same
  # runtime-download pattern used by fetch-e2e-tarball (.rwx/coverage.yml)
  # and release-gate (.rwx/release.yml). The candidate #1 short-circuit
  # (`succeeded && artifacts.X`) is IMPOSSIBLE: RWX `&&` requires two
  # booleans and rejects a string operand ("does not compare two booleans").
  - key: e2e-aggregate
    use: code
    after: ${{ (e2e-shard-0.succeeded || e2e-shard-0.failed) && (e2e-shard-1.succeeded || e2e-shard-1.failed) && (e2e-shard-2.succeeded || e2e-shard-2.failed) && (e2e-shard-3.succeeded || e2e-shard-3.failed) }}
    cache: false
    timeout: 10m
    env:
      RWX_ACCESS_TOKEN: ${{ secrets.RWX_ACCESS_TOKEN }}
      # Per-shard task IDs — present in the task context even when a shard
      # times out (only `.artifacts` is absent), so this config always
      # resolves. RWX_RUN_ID is auto-injected but download-by-task-id needs
      # no run id.
      SHARD_0_ID: ${{ tasks.e2e-shard-0.id }}
      SHARD_1_ID: ${{ tasks.e2e-shard-1.id }}
      SHARD_2_ID: ${{ tasks.e2e-shard-2.id }}
      SHARD_3_ID: ${{ tasks.e2e-shard-3.id }}
    run: |
      set -uo pipefail
      # Bootstrap the rwx CLI if the base image doesn't ship it. Pin v3.13.2
      # to match .gitlab-ci.yml / .rwx/release.yml (ka-0000006447).
      if ! command -v rwx >/dev/null 2>&1; then
        # Verify exact bytes before install (ka-0000001204 / F3). Digest source
        # + update procedure: docs/ci-toolchain-checksums.md.
        RWX_SHA256=ef4afcad5ed9a6e7d24190050753f35cf1a6d609f07b949a1caa83074c16507e
        curl -fsSL --retry 3 --retry-delay 3 \
          https://github.com/rwx-cloud/rwx/releases/download/v3.13.2/rwx-linux-x86_64-static \
          -o /tmp/rwx
        echo "${RWX_SHA256}  /tmp/rwx" | sha256sum -c -
        sudo install -m 0755 /tmp/rwx /usr/local/bin/rwx && rm -f /tmp/rwx
      fi
      rwx --version || true

      # Download each shard's junit-results-N directory artifact by task-id.
      # A shard that timed out / was aborted never published its artifact —
      # `download` then exits 1 with "Artifact … not found", which we absorb
      # so the partial aggregation still runs (graceful degradation).
      for i in 0 1 2 3; do
        eval "TID=\${SHARD_${i}_ID:-}"
        if [ -z "$TID" ]; then
          echo "WARN: shard ${i} task-id unset — skipping download"
          continue
        fi
        if rwx artifacts download "$TID" "junit-results-${i}" \
              --auto-extract --output-dir "junit-results-${i}" 2>/tmp/rwx-art-${i}.err; then
          echo "Downloaded shard ${i} artifact (junit-results-${i})"
        else
          echo "WARN: shard ${i} artifact junit-results-${i} unavailable (shard aborted/timed-out?):"
          sed 's/^/    /' /tmp/rwx-art-${i}.err || true
        fi
      done

      # Merge whatever landed. Absent per-shard dirs are expected when a
      # shard aborted — the merge degrades to the shards that did produce
      # results rather than failing the aggregate.
      mkdir -p junit-results
      : > junit-results/e2e-results.jsonl
      for i in 0 1 2 3; do
        SRC="junit-results-${i}/e2e-results.jsonl"
        if [ -f "$SRC" ]; then
          cat "$SRC" >> junit-results/e2e-results.jsonl
          echo "Merged shard ${i} ($(wc -l < "$SRC") rows)"
        else
          echo "WARN: shard ${i} results missing ($SRC)"
        fi
      done
      # Combine per-shard junit XMLs as well (best-effort)
      for i in 0 1 2 3; do
        if [ -d "junit-results-${i}" ]; then
          find "junit-results-${i}" -name '*.xml' -exec cp -v {} junit-results/ \; 2>/dev/null || true
        fi
      done
      echo "Aggregated results: $(wc -l < junit-results/e2e-results.jsonl) rows"
    outputs:
      artifacts:
        - key: junit-results
          path: junit-results

  # ── Drain runtime coverage profiles from instrumented pods ──────────
  # W2 coverage collection (ka-0000005395). Runs only when the deploy was
  # opted into coverage instrumentation — controlled by the `coverage`
  # init param surfaced by .rwx/deploy-rwx.yml. Steps:
  #   1. Rollout-restart instrumented deployments. SIGTERM triggers the
  #      deferred covflush.Flush() in each Go binary, writing GOCOVERDIR
  #      counters into the shared coverage PVC.
  #   2. Wait for rollouts to complete so the old pods have actually exited
  #      and flushed (rollout status only returns when the new ReplicaSet
  #      is fully ready, which means the old one has terminated).
  #   3. Spawn an ephemeral helper pod that mounts the coverage PVC
  #      read-only, tars the contents, and streams to stdout.
  #   4. Capture the tar as an RWX artifact.
  # Runs even when shards fail so we collect coverage from the shard run
  # we just did. Best-effort: failures here MUST NOT mark the suite
  # failed (`true) || true`).
  - key: e2e-coverage
    use: [code, kubeconfig]
    after: ${{ (e2e-shard-0.succeeded || e2e-shard-0.failed) && (e2e-shard-1.succeeded || e2e-shard-1.failed) && (e2e-shard-2.succeeded || e2e-shard-2.failed) && (e2e-shard-3.succeeded || e2e-shard-3.failed) }}
    cache: false
    timeout: 10m
    run: |
      set +e
      # POC cred routing (ka-0000005509) — match the creds the inherited
      # kubeconfig's `aws eks get-token` exec needs. See the kubeconfig task.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY" ;;
      esac
      # E2: derive per-instance namespace. Order: explicit `namespace` param
      # (legacy override) → gardenio-rwx-<instance-id> → fall back to
      # gardenio-rwx-<short-sha> for back-compat with bare CLI dispatches.
      NAMESPACE="${NAMESPACE:-gardenio-rwx-${INIT_INSTANCE_ID:-${COMMIT_SHA:0:8}}}"
      mkdir -p coverage-artifacts

      # Skip cleanly if coverage PVC isn't present (deploy did not opt in).
      PVC_NAME="${NAMESPACE}-agents-coverage"
      if ! kubectl -n "$NAMESPACE" get pvc "$PVC_NAME" >/dev/null 2>&1; then
        echo "Coverage PVC $PVC_NAME not found in $NAMESPACE — coverage opt-in is off, skipping."
        echo "skipped" > coverage-artifacts/SKIPPED
        exit 0
      fi

      echo "=== Triggering pre-shutdown coverage flush via rollout restart ==="
      # All long-running daemons that wire covflush.Flush() — see W2.
      INSTRUMENTED_DEPLOYS=(
        controller
        beads-viewer
        slack-bridge
        jira-bridge
        gitlab-bridge
        push-bridge
        wl-bridge
        grafana-bridge
        alertmanager-bridge
        trigger-engine
        roles-server
      )
      for name in "${INSTRUMENTED_DEPLOYS[@]}"; do
        DEPLOY="${NAMESPACE}-${name}"
        if kubectl -n "$NAMESPACE" get deploy "$DEPLOY" >/dev/null 2>&1; then
          echo "  rollout restart $DEPLOY"
          kubectl -n "$NAMESPACE" rollout restart deploy "$DEPLOY"
        fi
      done

      echo "=== Waiting for restarts to complete (covflush runs in defer on SIGTERM) ==="
      for name in "${INSTRUMENTED_DEPLOYS[@]}"; do
        DEPLOY="${NAMESPACE}-${name}"
        if kubectl -n "$NAMESPACE" get deploy "$DEPLOY" >/dev/null 2>&1; then
          kubectl -n "$NAMESPACE" rollout status deploy "$DEPLOY" --timeout=4m || true
        fi
      done

      echo "=== Draining coverage PVC via helper pod ==="
      HELPER=coverage-drain-${RWX_RUN_ID:-$$}
      kubectl -n "$NAMESPACE" delete pod "$HELPER" --ignore-not-found --grace-period=0 --force >/dev/null 2>&1 || true

      cat <<EOF | kubectl -n "$NAMESPACE" apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: ${HELPER}
        labels:
          app.kubernetes.io/component: coverage-drain
          app.kubernetes.io/managed-by: rwx-e2e
      spec:
        restartPolicy: Never
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          fsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        containers:
          - name: drain
            image: alpine:3.20
            command: ["sh", "-c", "sleep 600"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
              - name: coverage
                mountPath: /coverage
                readOnly: true
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: coverage
            persistentVolumeClaim:
              claimName: ${PVC_NAME}
              readOnly: true
          - name: tmp
            emptyDir: {}
      EOF

      kubectl -n "$NAMESPACE" wait --for=condition=Ready "pod/${HELPER}" --timeout=2m || true

      echo "=== Coverage PVC contents ==="
      kubectl -n "$NAMESPACE" exec "$HELPER" -- sh -c 'ls -laR /coverage 2>/dev/null | head -200' || true

      echo "=== Tarring /coverage from PVC ==="
      kubectl -n "$NAMESPACE" exec "$HELPER" -- sh -c 'tar -C /coverage -czf /tmp/coverage.tar.gz . 2>/dev/null && ls -la /tmp/coverage.tar.gz' || true
      kubectl -n "$NAMESPACE" cp "${HELPER}:/tmp/coverage.tar.gz" coverage-artifacts/coverage.tar.gz || true

      if [ -s coverage-artifacts/coverage.tar.gz ]; then
        echo "Coverage tarball captured: $(stat -c%s coverage-artifacts/coverage.tar.gz) bytes"
        tar -tzf coverage-artifacts/coverage.tar.gz | head -50 > coverage-artifacts/MANIFEST.txt || true
      else
        echo "WARN: no coverage data captured (coverage.tar.gz missing or empty)"
      fi

      echo "=== Cleaning up helper pod ==="
      kubectl -n "$NAMESPACE" delete pod "$HELPER" --ignore-not-found --grace-period=10 || true

      true
    env:
      NAMESPACE: ${{ init.namespace }}
      INIT_INSTANCE_ID: ${{ init.instance-id }}
      COMMIT_SHA: ${{ init.commit-sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}
    outputs:
      artifacts:
        - key: coverage-artifacts
          path: coverage-artifacts

  # ── gVisor PRODUCTION-READINESS substrate gate (ka-0000002867) ───────
  # The FIRST gate of the gardenio-gvisor-readiness dispatch: stands up / asserts
  # the gvisor-poc substrate so the lifecycle modules below run against a real
  # node instead of self-skipping into a meaningless green. Provokes Karpenter
  # (schedules a privileged probe to force a gvisor=poc node), then runs the
  # shared warm-node gate (runsc present + /var/tmp writable + state root
  # reachable). Under REQUIRE_SUBSTRATE=1 (the go/no-go) an absent/cold substrate
  # is a NO-GO HARD FAIL; otherwise it self-skips clean. It is a fast no-op on the
  # normal gardenio-e2e / per-feature dispatches (require-substrate=false), so it
  # adds no cost there.
  - key: gvisor-substrate-ready
    use: [code, kubeconfig]
    cache: false
    timeout: 10m
    run: |
      # GVISOR_E2E=1 selects the gate; REQUIRE_SUBSTRATE (from init) decides
      # whether an absent substrate is a NO-GO hard-fail or a clean skip.
      export GVISOR_E2E=1
      ./gardenio/tests/e2e/scripts/test-gvisor-substrate-ready.sh
    env:
      REQUIRE_SUBSTRATE: ${{ init.require-substrate }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

  # ── gVisor runsc freeze/thaw state-fidelity (opt-in) ─────────────────
  # ka-0000001895 / Phase 2 epic ka-0000002167. Proves runsc
  # checkpoint/restore preserves agent state (file + in-RAM token) and the
  # agent RESUMES on thaw, plus the failure path (thaw under a non-runsc
  # runtime => clear error, not silent corruption). Self-contained: it only
  # needs kubectl against the live cluster — no beads/coop/token. The module
  # schedules its own privileged probe onto the gvisor-poc node pool and
  # drives runsc directly (reusing the ka-0000000300 PoC mechanism, MR !3464).
  #
  # Only runs under the dedicated `gardenio-gvisor-freeze-thaw` dispatch — it
  # is NOT wired into the gardenio-e2e shard fan-out because the standard
  # gardenio-rwx cluster has no gVisor node pool. GVISOR_E2E=1 flips the
  # module from self-SKIP to assert; the test still SKIPs cleanly if the
  # runsc RuntimeClass / gvisor-poc create-pods perms are absent.
  - key: gvisor-freeze-thaw
    use: [code, kubeconfig]
    cache: false
    timeout: 12m
    # NON-BLOCKING — ka-0000000847 (operator: Matt Baker, slack:U0OPERATOR1),
    # generalizing the ka-0000003662 mandate that already de-gated the sibling
    # resume-latency / userresponse-latency tasks below. This module targets the
    # ephemeral gvisor-poc node pool, which is often ABSENT at e2e time (Karpenter
    # has not scaled a gvisor=poc node, so the privileged probe pod is NotFound /
    # cannot schedule in 180s) or has a not-yet-warm runsc runtime (checkpoint
    # rc=128 "FetchSpec failed: file does not exist"). Those are PoC-substrate /
    # scheduling flakes, NOT gardenio app regressions, yet this task runs inside
    # the gardenio-e2e fan-out and HARD-GATED promote -> deploy-prod, reddening
    # blocking release-tag pipelines that no MR author owns (ka-0000000847).
    # We absorb a non-zero exit (loud advisory) so a PoC-substrate flake can never
    # red the release suite. A real C/R or substrate regression is still caught by
    # the dedicated `gardenio-gvisor-freeze-thaw` dispatch (rwx-gvisor-e2e job,
    # which is itself allow_failure for the same PoC-maturity reason). Earlier
    # history: ka-0000007698 re-gated this for a one-shot `runsc --version` probe
    # flake (since hardened with bounded retry + stderr capture in the script);
    # the broader gate-placement issue this addresses is structural, not that
    # probe.
    run: |
      export GVISOR_E2E=1
      # GOLDEN-GATE ABSORB (ka-0000007234, ka-0000007326). Under the
      # golden-gating gardenio-e2e dispatch (GOLDEN_GATE=true) this gVisor PoC
      # substrate task is a rotating environmental flake (node-asset-ship,
      # thaw-state-FS, restore-into-B, FREEZE-checkpoint, Pod-B-netns-resolve)
      # — NOT a gardenio product regression — yet it hard-gated golden promotion
      # for ~5 days while all 101 product modules stayed green. Absorb a
      # non-zero exit (loud advisory) like the operator-blessed resume-latency /
      # userresponse-latency gates (ka-0000003662). The dedicated
      # gardenio-gvisor-freeze-thaw dispatch (GOLDEN_GATE=false) still HARD-FAILS,
      # so real C/R regressions are caught there.
      if ./gardenio/tests/e2e/scripts/test-gvisor-freeze-thaw.sh; then
        echo "gvisor-freeze-thaw passed."
      else
        rc=$?
        if [ "${GOLDEN_GATE}" = "true" ]; then
          echo "════════════════════════════════════════════════════════════"
          echo "gvisor-freeze-thaw exited non-zero (rc=$rc) — ABSORBED as"
          echo "NON-BLOCKING under the golden-gating gardenio-e2e dispatch"
          echo "(ka-0000007234). This gVisor PoC substrate gate must never red"
          echo "the release suite or block golden/prod. A real regression is"
          echo "caught by the dedicated gardenio-gvisor-freeze-thaw dispatch."
          echo "════════════════════════════════════════════════════════════"
        else
          echo "gvisor-freeze-thaw FAILED (rc=$rc) — hard-gating (dedicated dispatch)."
          exit $rc
        fi
      fi
    env:
      REQUIRE_SUBSTRATE: ${{ init.require-substrate }}
      GOLDEN_GATE: ${{ init.golden-gate }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

  # ── gVisor N-container sidecar freeze/thaw BARRIER (opt-in) ──────────
  # ka-0000004828 / coverage-gap epic ka-0000000958. freeze-thaw (above) covers a
  # SINGLE-container sandbox; this covers the controller's real MULTI-container
  # path — the COUNT-GATED barrier restore (freezethaw.go:1957 roster capture +
  # count cross-check, freezethaw_node.go:2943 barrier restore) that was UNIT-only.
  # Builds a harness-owned multi-container runsc sandbox (sandbox + agent + dind
  # subs, ONE shared sentry — the sidecar-agent pod shape), checkpoints the whole
  # pod, then proves on the live substrate: container_count==len(subs)+1 baked into
  # the statefile, the barrier HOLDS the guest frozen with N-1 subs restored +
  # RELEASES only when the Nth satisfies the count, both subs' RAM+FILE state survive
  # name-keyed, and an off-roster sub is refused. Self-contained: kubectl only, no
  # beads/coop/token; schedules its own privileged probe on the gvisor-poc pool.
  #
  # Only meaningful under the dedicated `gardenio-gvisor-sidecar-barrier` dispatch —
  # it is NOT wired into the gardenio-e2e shard fan-out (no gVisor on gardenio-rwx).
  # GVISOR_E2E=1 flips the module from self-SKIP to assert; it SKIPs cleanly if the
  # runsc RuntimeClass / gvisor-poc create-pods perms are absent.
  - key: gvisor-sidecar-barrier
    use: [code, kubeconfig]
    cache: false
    timeout: 12m
    # NON-BLOCKING under golden-gating gardenio-e2e — ka-0000000847 / ka-0000003662
    # (operator: Matt Baker). Same ephemeral gvisor-poc substrate as the sibling
    # gvisor-freeze-thaw task: the privileged probe can be NotFound when no
    # gvisor=poc node is scheduled, or runsc can be not-yet-warm. Those are
    # PoC-substrate / scheduling flakes, not gardenio app regressions, so they must
    # never red the release suite. A real N-container barrier regression is still
    # caught by the dedicated `gardenio-gvisor-sidecar-barrier` dispatch below.
    run: |
      export GVISOR_E2E=1
      # GOLDEN-GATE ABSORB (ka-0000007234, ka-0000007326). See gvisor-freeze-thaw
      # above. Non-blocking under golden-gating gardenio-e2e; hard-fails under the
      # dedicated gardenio-gvisor-sidecar-barrier dispatch (golden-gate=false).
      if ./gardenio/tests/e2e/scripts/test-gvisor-sidecar-barrier.sh; then
        echo "gvisor-sidecar-barrier passed."
      else
        rc=$?
        if [ "${GOLDEN_GATE}" = "true" ]; then
          echo "════════════════════════════════════════════════════════════"
          echo "gvisor-sidecar-barrier exited non-zero (rc=$rc) — ABSORBED as"
          echo "NON-BLOCKING under golden-gating gardenio-e2e (ka-0000007234)."
          echo "Real regressions caught by the dedicated"
          echo "gardenio-gvisor-sidecar-barrier dispatch."
          echo "════════════════════════════════════════════════════════════"
        else
          echo "gvisor-sidecar-barrier FAILED (rc=$rc) — hard-gating (dedicated dispatch)."
          exit $rc
        fi
      fi
    env:
      REQUIRE_SUBSTRATE: ${{ init.require-substrate }}
      GOLDEN_GATE: ${{ init.golden-gate }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

  # ── gVisor boot-wedge armed-watcher guard / freeze fail-safe (opt-in) ─
  # ka-0000000584. Asserts the END-TO-END fail-safe path the P0 boot-wedge fix
  # (ka-0000006667, controller watchersArmed + freezethaw_armed_guard_test.go)
  # guarantees on a real runsc sandbox: a live, un-armed sandbox the guard
  # refuses to freeze is LEFT RUNNING (the boot-wedge — an un-thawable snapshot
  # with no live watcher inside — is never minted), and the both-armed positive
  # control proceeds to a real checkpoint that persists a snapshot. The guard's
  # decision reproduces the controller's exact sentinel-filename + probe-shape
  # contract (thawepoch.ArmedName, watchersArmed) on the node, the same blessed
  # reimplement-the-shared-protocol-in-bash pattern gvisor-rehydration uses.
  # Only runs under the dedicated `gardenio-gvisor-armed-guard` dispatch — NOT in
  # the gardenio-e2e shard fan-out (no gVisor on gardenio-rwx). GVISOR_E2E=1 flips
  # the module from self-SKIP to assert; it still SKIPs cleanly if the runsc
  # RuntimeClass / gvisor-poc create-pods perms are absent.
  - key: gvisor-armed-guard
    use: [code, kubeconfig]
    cache: false
    timeout: 12m
    # NON-BLOCKING — ka-0000000847 / ka-0000003662 (operator: Matt Baker). Same
    # ephemeral gvisor-poc substrate as gvisor-freeze-thaw above: the privileged
    # probe pod can be NotFound when no gvisor=poc node is scheduled, or runsc can
    # be not-yet-warm. Those are PoC-substrate / scheduling flakes, not gardenio
    # app regressions, yet this task hard-gated promote -> deploy-prod inside the
    # gardenio-e2e fan-out and reddened blocking release pipelines no MR author
    # owns. Absorb non-zero exit (loud advisory); a real boot-wedge fail-safe
    # regression is caught by the dedicated `gardenio-gvisor-armed-guard` dispatch.
    run: |
      export GVISOR_E2E=1
      # GOLDEN-GATE ABSORB (ka-0000007234, ka-0000007326). See gvisor-freeze-thaw
      # above. Non-blocking under golden-gating gardenio-e2e; hard-fails under the
      # dedicated gardenio-gvisor-armed-guard dispatch.
      if ./gardenio/tests/e2e/scripts/test-gvisor-armed-guard.sh; then
        echo "gvisor-armed-guard passed."
      else
        rc=$?
        if [ "${GOLDEN_GATE}" = "true" ]; then
          echo "════════════════════════════════════════════════════════════"
          echo "gvisor-armed-guard exited non-zero (rc=$rc) — ABSORBED as"
          echo "NON-BLOCKING under golden-gating gardenio-e2e (ka-0000007234)."
          echo "Real regressions caught by the dedicated gardenio-gvisor-armed-guard"
          echo "dispatch."
          echo "════════════════════════════════════════════════════════════"
        else
          echo "gvisor-armed-guard FAILED (rc=$rc) — hard-gating (dedicated dispatch)."
          exit $rc
        fi
      fi
    env:
      REQUIRE_SUBSTRATE: ${{ init.require-substrate }}
      GOLDEN_GATE: ${{ init.golden-gate }}
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

  # ── gVisor multi-cycle freeze→thaw→re-freeze story (opt-in) ──────────
  # ka-0000001878 / production-readiness epic ka-0000004667. Proves on the live
  # gvisor-poc substrate that a THAWED runsc process is itself re-checkpointable
  # (substrate supports multi-cycle — so option (a) is possible in principle and
  # the substrate is not the blocker), that a node-local re-freeze to the
  # controller's deterministic per-agent path DESTROYS the prior snapshot (the
  # single-shot hazard the Snapshot.Consumed guard prevents — runsc refuses to
  # checkpoint into a non-empty path, so the controller's clear-then-checkpoint
  # has no second slot), and that state fidelity holds across both cycles (the
  # in-RAM counter resumes past each freeze). The controller GUARD semantics
  # (Consumed marker → ErrFreezeAlreadyThawed refusal + predicate skipping →
  # clean cold-start degradation) are asserted by the Go unit tests
  # freezethaw_refreeze_guard_test.go; this is their live-substrate companion.
  # Only runs under the dedicated `gardenio-gvisor-multicycle-refreeze` dispatch —
  # NOT in the gardenio-e2e shard fan-out (no gVisor on gardenio-rwx). GVISOR_E2E=1
  # flips the module from self-SKIP to assert; it still SKIPs cleanly if the
  # runsc RuntimeClass / gvisor-poc create-pods perms are absent.
  - key: gvisor-multicycle-refreeze
    use: [code, kubeconfig]
    cache: false
    timeout: 12m
    # NON-BLOCKING — ka-0000000847 / ka-0000003662 (operator: Matt Baker). Same
    # ephemeral gvisor-poc substrate as gvisor-freeze-thaw above: the privileged
    # probe pod can be NotFound when no gvisor=poc node is scheduled, or runsc can
    # be not-yet-warm. Those are PoC-substrate / scheduling flakes, not gardenio
    # app regressions, yet this task would hard-gate promote -> deploy-prod inside
    # the gardenio-e2e fan-out and redden blocking release pipelines no MR author
    # owns. Absorb non-zero exit (loud advisory); a real multi-cycle / guard
    # regression is caught by the dedicated `gardenio-gvisor-multicycle-refreeze`
    # dispatch.

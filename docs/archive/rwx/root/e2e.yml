on:
  dispatch:
    - key: gardenio-e2e
      init:
        commit-sha: ${{ event.git.sha }}
        # golden-gating run: the gVisor PoC substrate tasks (freeze-thaw,
        # armed-guard, rehydration, rehydrate-ack) ABSORB non-zero exits here
        # so a rotating PoC-substrate flake (ka-0000007234) can never red the
        # release suite or block golden promotion / prod deploy. Their real
        # regressions are still caught hard by the dedicated gardenio-gvisor-*
        # dispatches below (golden-gate=false).
        golden-gate: "true"
        # require-substrate=false: an absent gvisor-poc substrate is a clean SKIP
        # here, never a hard fail (ka-0000000847 / ka-0000003662). Only the
        # gardenio-gvisor-readiness dispatch sets this "true" (the go/no-go gate,
        # task ka-0000002867) — there an absent substrate is a NO-GO.
        require-substrate: "false"
        # require-outbox-rig=false: an absent sandbox rig is today's clean skip-PASS
        # for the live outbox security matrix (ka-0000007489). The operator flips it
        # "true" on a SCHEDULED readiness run AFTER provisioning the sandbox creds,
        # turning outbox_rig_guard's absent-rig skip into a hard NO-GO FAIL — the
        # standing regression gate for T-1to1/T-upsert/T-link + T3/T7/T10/T11/T12.
        # DORMANT here (default false) so behaviour is unchanged until armed.
        require-outbox-rig: ${{ event.dispatch.params.require-outbox-rig }}
        # require-slack-ui=false: an absent real-user Slack rig is today's clean
        # skip-PASS for the slack-ui Playwright module (ka-0000006398). The
        # operator flips it "true" on a SCHEDULED readiness run AFTER the
        # test-Slack workspace/app/user + storageState secret are provisioned
        # (escalation ka-0000001279), turning test-slack-ui.sh's absent-rig skip
        # into a hard FAIL so a silent skip can never masquerade as green once
        # the harness is meant to be live. DORMANT here (default false).
        require-slack-ui: ${{ event.dispatch.params.require-slack-ui }}
        namespace: ${{ event.dispatch.params.namespace }}
        instance-id: ${{ event.dispatch.params.instance-id }}
        keep: ${{ event.dispatch.params.keep }}
        only: ${{ event.dispatch.params.only }}
        skip: ${{ event.dispatch.params.skip }}
        captain-poison-module: ${{ event.dispatch.params.captain-poison-module }}
        version: ${{ event.dispatch.params.version }}
        ref-name: ${{ event.dispatch.params.ref-name }}
        host-domain: ${{ event.dispatch.params.host-domain }}
      params:
        - key: instance-id
          name: Ephemeral instance ID
          description: |
            Targets the per-instance ephemeral namespace
            (gardenio-rwx-<instance-id>) deployed by gardenio-deploy-rwx.
            GitLab CI passes $CI_COMMIT_SHORT_SHA. When set, takes
            precedence over the legacy `namespace` param.
          default: ""
          required: false
        - key: namespace
          name: K8s namespace (legacy override)
          description: |
            Direct namespace override. Kept for back-compat with ad-hoc
            dispatches that target a specific namespace by name. Prefer
            instance-id for the standard ephemeral flow. Empty = derive
            from instance-id (or fall back to gardenio-rwx-<short-sha>).
          default: ""
          required: false
        - key: keep
          name: Keep namespace
          description: Keep namespace after tests (for debugging)
          default: "false"
          required: false
        - key: only
          name: Only module
          description: Run only this test module (e.g. decisions-yield, gate-system)
          default: ""
          required: false
        - key: skip
          name: Skip modules
          description: Comma-separated modules to skip
          default: ""
          required: false
        - key: require-outbox-rig
          name: Require outbox sandbox rig (no silent skip)
          description: |
            "true" makes an absent sandbox rig/seat a HARD FAIL in the live
            outbox security matrix (test-jira-outbox-{positive,negative}.sh)
            instead of today's skip-PASS (ka-0000007489). Set only on a
            SCHEDULED readiness run AFTER the sandbox creds are provisioned
            into the E2E namespace. Default "" (dormant → skip-clean).
          default: ""
          required: false
        - key: require-slack-ui
          name: Require real-user Slack rig (no silent skip)
          description: |
            "true" makes an absent real-user Slack rig a HARD FAIL in the
            slack-ui Playwright module (test-slack-ui.sh) instead of today's
            skip-PASS (ka-0000006398). Set only on a SCHEDULED readiness run
            AFTER the test-Slack workspace/app/user + storageState secret are
            provisioned into the E2E namespace (escalation ka-0000001279).
            Default "" (dormant → skip-clean).
          default: ""
          required: false
        - key: captain-poison-module
          name: Captain poison module
          description: |
            Plant a first-attempt failure in the named module to verify Captain's
            targeted-retry path (ka-0000000510). Module fails on first run via a
            sentinel and passes on subsequent runs. Empty = disabled.
          default: ""
          required: false
        - key: version
          name: Calver version (tag pipelines)
          description: |
            Calver (e.g. 2026.124.4) — when set, install-coop-claudeless pulls
            coop:<version>-rc instead of coop:main-<sha7>. Tag-push pipelines
            should pass this so install-coop-claudeless does not race the
            main-push docker.yml build (ka-0000000436).
          default: ""
          required: false
        - key: ref-name
          name: Git ref-name
          description: |
            Bare ref-name ($CI_COMMIT_TAG or $CI_COMMIT_REF_NAME from GitLab CI).
            Calver tags (20*) cause install-coop-claudeless to derive the -rc
            tag automatically when --param version is omitted. Mirrors the
            derivation in .rwx/deploy-rwx.yml verify-images (ka-0000000436).
          default: ""
          required: false
        - key: host-domain
          name: DNS domain suffix
          description: |
            DNS domain the deployed hosts hang off of. Defaults to the legacy
            lab domain (app.e2e.dev.acme.example). Pass aws-poc.gardenio.acme.example to
            route AWS creds/cluster to the POC account (ka-0000005509) — must
            match the host-domain the canary was deployed with.
          default: ""
          required: false
      title: E2E Tests
    # ── Opt-in gVisor freeze/thaw dispatch (ka-0000001895) ───────────────
    # Dedicated dispatch for the runsc checkpoint/restore state-fidelity
    # module. Separate from gardenio-e2e because it targets the gvisor-poc
    # namespace + node pool (not the per-instance gardenio-rwx ns) and needs
    # no beads/coop/token plumbing — just kubectl against the live cluster.
    # Trigger:  rwx dispatch gardenio-gvisor-freeze-thaw --param commit-sha=<sha>
    - key: gardenio-gvisor-freeze-thaw
      init:
        commit-sha: ${{ event.dispatch.params.commit-sha }}
        # Dedicated dispatch: this module HARD-GATES (golden-gate=false) so a
        # real freeze/thaw regression fails the dedicated run (ka-0000007234).
        golden-gate: "false"
        # require-substrate=false: absent substrate → clean SKIP, not a hard
        # fail (ka-0000000847). Per-feature dispatches are not the go/no-go.
        require-substrate: "false"
        # ── Full init key set backfill (ka-0000001304) ──────────────────
        # RWX validates EVERY init.* reference across the WHOLE definition
        # at run start; shared tasks (kubeconfig, verify-cluster, install-
        # coop-claudeless, the outbox/slack-ui + shard matrices) reference
        # the full gardenio-e2e key set, so a dedicated dispatch that omits
        # any of them dies in init before its module ever runs. Declare the
        # whole set with dedicated-dispatch defaults (empty strings +
        # require-*=false). Model: the gardenio-gb-stop-suspend block above.
        require-outbox-rig: "false"
        require-slack-ui: "false"
        namespace: ""
        instance-id: ""
        keep: "false"
        only: ""
        skip: ""
        captain-poison-module: ""
        version: ""
        ref-name: ""
        host-domain: ""
      params:
        - key: commit-sha
          name: Commit SHA
          description: "Full commit SHA to test. Defaults to the dispatched ref's HEAD."
          default: ""
          required: false
      title: gVisor freeze/thaw E2E
    # ── Opt-in gVisor N-container sidecar-barrier dispatch (ka-0000004828) ─
    # Dedicated dispatch for the N-container (sidecar) freeze/thaw COUNT-GATED
    # BARRIER. freeze-thaw covers a SINGLE-container sandbox; this covers the
    # controller's real multi-container path (freezethaw.go:1957 roster capture +
    # count cross-check, freezethaw_node.go:2943 barrier restore) that was UNIT-only.
    # Builds a harness-owned multi-container runsc sandbox (sandbox + agent + dind
    # subs, one shared sentry), checkpoints the whole pod, then proves on the live
    # substrate: container_count==len(subs)+1 baked into the statefile, the barrier
    # HOLDS the guest frozen with N-1 subs restored + RELEASES on the Nth, both subs'
    # RAM+FILE state survive name-keyed, and an off-roster sub is refused. Like
    # freeze-thaw it targets the gvisor-poc ns + node pool and needs only kubectl.
    # Trigger:  rwx dispatch gardenio-gvisor-sidecar-barrier --param commit-sha=<sha>
    - key: gardenio-gvisor-sidecar-barrier
      init:

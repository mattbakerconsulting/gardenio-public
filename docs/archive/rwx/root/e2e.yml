base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    # ── MUST stay `call: git/clone` — captain depends on it (ka-0000005446) ──
    # DO NOT replace this with the hand-rolled retry-wrapped clone used
    # elsewhere (docker.yml `code`, release-DAG workflows). Unlike every
    # other .rwx/*.yml, this run invokes `captain run` (the four e2e-shard-*
    # tasks). Captain determines the git repository from the RUN-LEVEL
    # `RWX_GIT_REPOSITORY_URL` metadata that ONLY the `git/clone` package
    # emits — the hand-rolled `git init && git fetch` clone does not (and
    # cannot) set that run metadata. With it absent, every shard aborts at
    # `captain run` with `Invalid configuration: Missing git repository url`
    # before a single test runs, failing the whole release e2e suite and
    # blocking promote/deploy-prod/create-release.
    #
    # This is exactly what happened when ka-0000001787 ("fan out git-clone
    # retry wrapper to remaining clone sites", commit e7968083c) swapped this
    # task to the hand-rolled clone: the next release pipeline (#2749346849,
    # tag 2026.223.6) reddened all four e2e shards. The retry-wrapper fan-out
    # is correct for the ~24 clone sites that do NOT run captain; e2e.yml is
    # the sole exception and must be excluded from that fan-out.
    call: git/clone 2.0.7
    with:
      repository: https://oauth2:${{ secrets.GITLAB_CLONE_TOKEN }}@gitlab.com/Acme/Platform/gardenio.git
      ref: ${{ init.commit-sha }}

  # ── Install Go toolchain ────────────────────────────────────────────
  - key: go
    call: golang/install 1.2.1
    with:
      go-version: "1.25"

  # ── Install Captain CLI (flaky-test manager) ────────────────────────
  # Captain wraps run-shard.sh per shard to add automatic retries,
  # quarantine semantics, and aggregated failure summaries (ka-0000004315).
  # Configuration lives at .captain/config.yml; quarantine list at
  # .captain/quarantines/gardenio-e2e.yml. See those files for behaviour.
  - key: install-captain
    call: rwx/install-captain 1.1.6

  # ── Install the chart-pinned VictoriaLogs binary ────────────────────
  # Arms the idp-audit-fieldcontract E2E gate (ka-0000004993, parent epic
  # ka-0000007128). test-idp-audit-fieldcontract.sh drives the e2e-tagged
  # auditxform field-cardinality proof against a REAL victoria-logs-prod, but
  # shard containers ship no such binary, so the module LOUD-SKIPs everywhere
  # by default (the require-outbox-rig / require-slack-ui dormant-until-armed
  # shape). This task provisions victoria-logs-prod so the module becomes a HARD
  # gate on the ONE shard whose `use:` list carries it (e2e-shard-1 — the module
  # is pinned to shard 1 in run-shard.sh's shard_for() to match this coupling).
  #
  # The version is SOURCED from the chart pin (helm values.yaml
  # vlsingle.image.tag), never hard-coded here, so there is a single source of
  # truth and the E2E binary can never drift from the version the chart ships —
  # the same discipline install-claude uses for the claude pin. VictoriaLogs
  # ships on its OWN v1.x line, independent of the VM stack (v1.108.1).
  #
  # We fetch the upstream GitHub release tarball (its sole member is exactly
  # `victoria-logs-prod`) rather than `crane export`-ing the mirrored image
  # (.rwx/mirror.yml:133 mirror/victoria-logs:v1.52.0): the release fetch needs
  # no registry creds and no per-image push-skew poll, and this task is cached
  # (filter on e2e-system-deps.lock) so the fetch is off the per-shard critical
  # path — it runs once in the cached deps layer, exactly like install-k8s-tools.
  - key: install-victoria-logs
    use: code
    run: |
      set -euo pipefail
      # Single source of truth: read the pinned tag straight from the chart so
      # this binary always matches vlsingle.image.tag. The awk finds the
      # victoria-logs image block and returns the first `tag:` under it.
      VL_TAG=$(awk '/^ *repository: victoria-logs$/{f=1} f && /tag:/{gsub(/[" ]/,"",$2); print $2; exit}' \
        gardenio/helm/gardenio/values.yaml)
      if [ -z "$VL_TAG" ]; then
        echo "FATAL: could not read victoria-logs tag from gardenio/helm/gardenio/values.yaml"
        exit 1
      fi
      echo "Chart-pinned VictoriaLogs tag: $VL_TAG"

      URL="https://github.com/VictoriaMetrics/VictoriaLogs/releases/download/${VL_TAG}/victoria-logs-linux-amd64-${VL_TAG}.tar.gz"
      echo "Fetching $URL"
      curl -sfL "$URL" -o /tmp/victoria-logs.tar.gz
      # The tarball's sole member is `victoria-logs-prod`.
      sudo tar -xzf /tmp/victoria-logs.tar.gz -C /usr/local/bin victoria-logs-prod
      sudo chmod +x /usr/local/bin/victoria-logs-prod
      rm -f /tmp/victoria-logs.tar.gz

      # Smoke-check: the binary runs AND its self-reported version carries the
      # chart-pinned tag, so a wrong/renamed release asset fails LOUD here in the
      # cached deps layer instead of silently at module time.
      VER=$(/usr/local/bin/victoria-logs-prod --version 2>&1 | head -1)
      echo "victoria-logs-prod --version: $VER"
      case "$VER" in
        *"$VL_TAG"*) echo "OK: victoria-logs-prod matches chart pin $VL_TAG" ;;
        *) echo "FATAL: victoria-logs-prod version '$VER' does not carry chart pin $VL_TAG"; exit 1 ;;
      esac
    filter:
      - .rwx/e2e-system-deps.lock
      - gardenio/helm/gardenio/values.yaml

  # ── Install kubectl + AWS CLI ───────────────────────────────────────
  - key: install-k8s-tools
    run: |
      # kubectl
      KUBE_VERSION=$(curl -sSfL https://dl.k8s.io/release/stable.txt)
      curl -sSfL "https://dl.k8s.io/release/${KUBE_VERSION}/bin/linux/amd64/kubectl" -o /tmp/kubectl
      sudo install /tmp/kubectl /usr/local/bin/kubectl
      kubectl version --client
      # AWS CLI
      curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
      (cd /tmp && unzip -q awscliv2.zip && sudo ./aws/install)
      rm -rf /tmp/awscliv2.zip /tmp/aws
      aws --version
    filter:
      - .rwx/e2e-system-deps.lock

  # ── Configure kubeconfig for EKS ────────────────────────────────────
  - key: kubeconfig
    use: install-k8s-tools
    run: |
      # Phase 2/B acct-133 cred routing (ka-0000005509, decision ka-0000005742 =
      # explicit-override; ka-0000002380). When this e2e run targets the
      # consolidated prod (prod-gardenio-eks) or legacy POC (poc-gardenio-eks)
      # staging cluster, swap the AWS creds + EKS cluster from the gardenio-main
      # vault (POC_*, acct 123456789012) over the default-vault values (legacy
      # america-e2e 234567890123). Both prod and aws-poc live in the SAME acct
      # 133 so they share the gardenio-main creds; only the cluster name differs
      # (prod → prod-gardenio-eks literal; aws-poc → vault POC_EKS_CLUSTER =
      # poc-gardenio-eks). The kubeconfig written here is inherited by the
      # downstream e2e tasks via `use:`, and its `aws eks get-token` exec runs
      # with each task's own AWS_* env — so every cluster-touching task swaps the
      # same way. Gated on host-domain so legacy dispatches are byte-identical.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          if [ -z "${POC_AWS_ACCESS_KEY_ID:-}" ] || [ -z "${POC_AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "ERROR: host-domain=${INIT_HOST_DOMAIN} selects the gardenio-main vault, but POC_* creds are empty — vault not seeded (ka-0000001325/T8)"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$POC_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$POC_AWS_SECRET_ACCESS_KEY"
          if [ "${INIT_HOST_DOMAIN}" = "prod.gardenio.acme.example" ]; then
            EKS_CLUSTER="prod-gardenio-eks"
          else
            if [ -z "${POC_EKS_CLUSTER:-}" ]; then
              echo "ERROR: host-domain=aws-poc but POC_EKS_CLUSTER empty — vault not seeded (ka-0000001325/T8)"
              exit 1
            fi
            EKS_CLUSTER="$POC_EKS_CLUSTER"
          fi
          export EKS_CLUSTER
          echo "=== acct-133 cred routing: gardenio-main vault creds + cluster=$EKS_CLUSTER (host-domain=$INIT_HOST_DOMAIN) ==="
          ;;
      esac

      # ── Host-domain ↔ AWS-account mismatch guard (ka-0000000433) ─────────
      # Assert the AWS creds now active authenticate to the account the
      # host-domain routing expects, so a forgotten/wrong host-domain param
      # HARD-FAILS here instead of quietly running e2e against the WRONG cluster
      # (the retired america-e2e-eks 234567890123 vs the consolidated
      # prod-gardenio-eks 123456789012 — the P4.3b 502 class, ka-0000007004). The
      # kubeconfig written below is inherited by every downstream e2e task via
      # `use:`, so guarding here covers the whole run. Ported from
      # .rwx/migration-acceptance.yml. Empty/legacy host-domains map to 909 (the
      # default-vault E2E_* creds — e.g. the gardenio-gvisor-* dispatches that
      # share this task and pass no host-domain); prod/aws-poc map to 133 (the
      # gardenio-main POC_* creds swapped in above). Only a NON-EMPTY
      # unrecognized value is a hard FATAL.
      case "${INIT_HOST_DOMAIN:-}" in
        prod.gardenio.acme.example|aws-poc.gardenio.acme.example)
          EXPECTED_ACCOUNT="123456789012" ;;
        app.e2e.dev.acme.example|gardenio.app.e2e.dev.acme.example|"")
          EXPECTED_ACCOUNT="234567890123" ;;
        *)
          echo "FATAL: unrecognized host-domain='${INIT_HOST_DOMAIN:-<empty>}'. Accepted: prod.gardenio.acme.example / aws-poc.gardenio.acme.example (acct 123456789012) or app.e2e.dev.acme.example / gardenio.app.e2e.dev.acme.example (acct 234567890123). Refusing to guess a cred/account pairing."
          exit 1 ;;
      esac
      ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
      if [ -z "$ACTUAL_ACCOUNT" ]; then
        echo "FATAL: aws sts get-caller-identity failed — creds not usable (host-domain=${INIT_HOST_DOMAIN:-<empty>})."
        exit 1
      fi
      if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
        echo "FATAL: creds authenticate to account $ACTUAL_ACCOUNT but host-domain=${INIT_HOST_DOMAIN:-<empty>} expects $EXPECTED_ACCOUNT — cred/cluster account mismatch. Refusing to run e2e against the wrong account (ka-0000000433)."
        exit 1
      fi
      echo "=== AWS account verified: $ACTUAL_ACCOUNT (matches host-domain=${INIT_HOST_DOMAIN:-<empty>} routing) ==="

      # claudemore R4-SEC-5 (F7): empty-string vault guard for the real MODEL
      # credential. A vault/secret referenced-but-not-provisioned resolves to the
      # empty string and stays silent until a 401/403 at inference time — deep
      # inside the run, after minutes of setup. This guard fails LOUD at dispatch
      # instead, mirroring the POC_* AWS-cred check above.
      #
      # It is INERT for every run today: CI carries zero model creds, so the
      # opt-in flag CLAUDEMORE_MODEL_CRED_REQUIRED is unset and the block is a
      # no-op — no RWX secret is referenced here, so a claudemore-less dispatch
      # can never break on it. When Phase 1 (ka-0000005323) wires a real model
      # credential, it sets CLAUDEMORE_MODEL_CRED_REQUIRED=1 and passes the cred
      # as CLAUDEMORE_MODEL_CRED (from a provisioned secret) in this task's env;
      # the guard then hard-fails if that secret resolved empty.
      if [ "${CLAUDEMORE_MODEL_CRED_REQUIRED:-}" = "1" ]; then
        if [ -z "${CLAUDEMORE_MODEL_CRED:-}" ]; then
          echo "ERROR: CLAUDEMORE_MODEL_CRED_REQUIRED=1 but CLAUDEMORE_MODEL_CRED is empty — the model-credential vault/secret is referenced but not provisioned (would 401/403 at inference). Seed the secret or unset CLAUDEMORE_MODEL_CRED_REQUIRED (claudemore R4-SEC-5)."
          exit 1
        fi
        echo "=== claudemore model-cred guard: CLAUDEMORE_MODEL_CRED present (len=${#CLAUDEMORE_MODEL_CRED}) ==="
      fi
      aws eks update-kubeconfig --name "$EKS_CLUSTER" --region us-east-1
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      EKS_CLUSTER: ${{ secrets.E2E_EKS_CLUSTER }}
      # Phase 2 POC creds from the non-default gardenio-main vault (ka-0000005509).
      POC_AWS_ACCESS_KEY_ID: ${{ vaults.gardenio-main.secrets.E2E_AWS_ACCESS_KEY_ID }}
      POC_AWS_SECRET_ACCESS_KEY: ${{ vaults.gardenio-main.secrets.E2E_AWS_SECRET_ACCESS_KEY }}
      POC_EKS_CLUSTER: ${{ vaults.gardenio-main.secrets.E2E_EKS_CLUSTER }}
      INIT_HOST_DOMAIN: ${{ init.host-domain }}

  # ── Build gb from source ─────────────────────────────────────────────
  - key: go-deps
    use: [code, go]
    run: cd gardenio/controller && go mod download
    filter:
      - gardenio/controller/go.mod
      - gardenio/controller/go.sum
      # controller replace => ../clicreds local module (ka-0000003839).
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum

  - key: build-gb
    use: go-deps
    run: |
      cd gardenio/controller
      CGO_ENABLED=0 go build -o /tmp/gb ./cmd/gb/
      sudo install /tmp/gb /usr/local/bin/gb
      gb --version || true
    filter:
      - "gardenio/controller/cmd/gb/**/*.go"
      - "gardenio/controller/internal/**/*.go"
      - "gardenio/controller/go.mod"
      - "gardenio/controller/go.sum"
      - "gardenio/controller/**/*.html"
      - "gardenio/controller/**/*.md"
      - "gardenio/controller/**/web/**"
      # cmd/gb imports the local clicreds module (ka-0000003839).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build beads-viewer from source ───────────────────────────────────
  # Pre-built + PATH-installed for the `grafana-directive` shard module
  # (ka-0000007821), which boots the REAL beads-viewer against a stub daemon
  # to assert the :::grafana markdown directive renders an iframe (configured)
  # / degraded note (unconfigured). The shard task's `use:` list carries no Go
  # toolchain, so the module's from-source fallback would skip_all in CI —
  # this task guarantees a binary is present. Module-mode build (GOWORK=off)
  # from the controller dir, exactly like build-gb. The viewer templates +
  # embedded web assets need the same html/md/web globs build-gb uses.
  - key: build-beads-viewer
    use: go-deps
    run: |
      cd gardenio/controller
      CGO_ENABLED=0 go build -o /tmp/beads-viewer ./cmd/beads-viewer/
      sudo install /tmp/beads-viewer /usr/local/bin/beads-viewer
      test -x /usr/local/bin/beads-viewer
    filter:
      - "gardenio/controller/cmd/beads-viewer/**/*.go"
      - "gardenio/controller/cmd/beads-viewer/**/*.html"
      - "gardenio/controller/internal/**/*.go"
      - "gardenio/controller/go.mod"
      - "gardenio/controller/go.sum"
      - "gardenio/controller/**/*.html"
      - "gardenio/controller/**/*.md"
      # templates/static holds .js/.css/.png (pwa icons) with ZERO .html and is
      # NOT under a web/ dir, so none of the globs above match it — RWX would
      # materialize an EMPTY templates/static/ and `//go:embed templates/static`
      # (cmd/beads-viewer/templates.go:8) hard-fails "no matching files found"
      # BEFORE any e2e module runs (ka-0000005865). docker.yml:355-356 +
      # microvm-image.yml:118-119 build the same binary and carry the js/css
      # globs; .png is added here since 5 PWA icons embed too.
      - "gardenio/controller/**/*.js"
      - "gardenio/controller/**/*.css"
      - "gardenio/controller/**/*.png"
      - "gardenio/controller/**/web/**"
      # controller replace => ../clicreds local module (ka-0000003839).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build kd from source ────────────────────────────────────────────
  - key: ka-deps
    use: [code, go]
    run: cd kbeads && go mod download
    filter:
      - kbeads/go.mod
      - kbeads/go.sum
      # kbeads replace => ../gardenio/clicreds local module (ka-0000003839).
      - gardenio/clicreds/go.mod
      - gardenio/clicreds/go.sum

  - key: build-kd
    use: ka-deps
    run: |
      cd kbeads
      CGO_ENABLED=0 go build -o /tmp/kd ./cmd/kd/
      sudo install /tmp/kd /usr/local/bin/kd
      kd --version || true
    filter:
      - "kbeads/cmd/kd/**/*.go"
      - "kbeads/internal/**/*.go"
      - "kbeads/gen/**/*.go"
      - "kbeads/go.mod"
      - "kbeads/go.sum"
      - "kbeads/**/*.sql"
      # cmd/kd imports the local clicreds module (ka-0000003839).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build trigger-engine from source ─────────────────────────────────
  # Used by the trigger-source-* claudeless scenarios (ka-0000002354) which
  # spawn a short-lived trigger-engine subprocess against the in-test beads
  # daemon to drive the real evaluation→action loop end-to-end. The scenarios
  # auto-skip when the binary is missing, but pre-installing it via the shard
  # `use:` lists ensures they actually run on every release.
  - key: build-trigger-engine
    use: go-deps
    run: |
      cd gardenio/controller
      CGO_ENABLED=0 go build -o /tmp/trigger-engine ./cmd/trigger-engine/
      sudo install /tmp/trigger-engine /usr/local/bin/trigger-engine
      # Verify the binary is on PATH without executing it. trigger-engine has
      # no --help flag and starts the engine on any invocation, which hangs
      # waiting for a beads daemon in the build context (ka-0000006573).
      command -v trigger-engine
      test -x /usr/local/bin/trigger-engine
    filter:
      - "gardenio/controller/cmd/trigger-engine/**/*.go"
      - "gardenio/controller/internal/**/*.go"
      - "gardenio/controller/internal/bridge/web/**"
      - "gardenio/controller/go.mod"
      - "gardenio/controller/go.sum"
      # controller replace => ../clicreds local module (ka-0000003839).
      # Without these globs the trigger build tasks omit gardenio/clicreds
      # from their materialized layer and `go build` fails with
      # "replacement directory ../clicreds does not exist" (ka-0000005437).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build trigger-probe from source ──────────────────────────────────
  # Used by the trigger-source-{jira,gitlab,account,slack-reaction}-fires
  # claudeless scenarios (ka-0000003167). Those four sources are not registered
  # in the standalone trigger-engine binary and need an external dependency it
  # cannot supply (a JiraClient/GitLabClient HTTP API, an in-process reaction
  # buffer, or account beads), so trigger-probe wires the REAL source + REAL
  # engine + REAL beadsapi.Client against a stub HTTP server / buffered event and
  # fires exactly one EvaluateSource cycle. The scenarios auto-skip when the
  # binary is missing, but pre-installing it via the shard `use:` lists ensures
  # they run on every release. trigger-probe is test-only — it ships in no
  # release Makefile / Dockerfile target.
  - key: build-trigger-probe
    use: go-deps
    run: |
      cd gardenio/controller
      CGO_ENABLED=0 go build -o /tmp/trigger-probe ./cmd/trigger-probe/
      sudo install /tmp/trigger-probe /usr/local/bin/trigger-probe
      # Confirm flag parsing works without a daemon: missing required flags
      # exits 2 with a usage message rather than hanging.
      # NOTE: capture first rather than piping straight into grep. RWX runs
      # this block under `set -o pipefail`, so `trigger-probe | grep -q` would
      # surface trigger-probe's exit 2 (fatal on missing flags) instead of
      # grep's exit 0 — the || branch fired even when grep matched.
      probe_out=$(/usr/local/bin/trigger-probe 2>&1 || true)
      echo "$probe_out" | grep -q "required" || {
        echo "trigger-probe smoke check failed: $probe_out"; exit 1;
      }
      test -x /usr/local/bin/trigger-probe
    filter:
      - "gardenio/controller/cmd/trigger-probe/**/*.go"
      - "gardenio/controller/internal/**/*.go"
      - "gardenio/controller/internal/bridge/web/**"
      - "gardenio/controller/go.mod"
      - "gardenio/controller/go.sum"
      # controller replace => ../clicreds local module (ka-0000003839).
      # Without these globs the trigger build tasks omit gardenio/clicreds
      # from their materialized layer and `go build` fails with
      # "replacement directory ../clicreds does not exist" (ka-0000005437).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build jira-conv-probe from source ────────────────────────────────
  # Used by the `jira-conversational` shard module (ka-0000003999, epic
  # ka-0000007401) to exercise the jira-bridge CONVERSATIONAL round-trip
  # (mention->spawn->reply->squawk->follow-up + FSM negative) end-to-end WITHOUT
  # a live jira-bridge, a live Jira, or real agent pods. Like trigger-probe it
  # wires the REAL bridge components (JiraWebhookHandler / JiraMentionHandler /
  # JiraReplyAPI / JiraSquawkForwarder / JiraAgentResolver) against a STUB Jira
  # httptest server + an in-process mock daemon, so SpawnAgent is a recorded call
  # and no controller ever mints a pod. The module falls back to an in-shell
  # `go build` if this binary is absent, but pre-installing it via the shard
  # `use:` list keeps the build cached + smoke-checked. trigger-probe-style:
  # test-only, ships in no release Makefile/Dockerfile target.
  - key: build-jira-conv-probe
    use: go-deps
    run: |
      cd gardenio/controller
      CGO_ENABLED=0 go build -o /tmp/jira-conv-probe ./cmd/jira-conv-probe/
      sudo install /tmp/jira-conv-probe /usr/local/bin/jira-conv-probe
      test -x /usr/local/bin/jira-conv-probe
    filter:
      - "gardenio/controller/cmd/jira-conv-probe/**/*.go"
      - "gardenio/controller/internal/**/*.go"
      # internal/bridge/web.go has //go:embed web/* — the HTML assets under
      # web/ are not *.go files, so the internal/**/*.go glob does not
      # materialize them and the controller build fails with
      # "pattern web/*: no matching files found" (ka-0000005393). Mirror
      # build-trigger-engine / build-trigger-probe.
      - "gardenio/controller/internal/bridge/web/**"
      - "gardenio/controller/go.mod"
      - "gardenio/controller/go.sum"
      # controller replace => ../clicreds local module (ka-0000003839).
      # Without these globs the build omits gardenio/clicreds from its
      # materialized layer and `go build` fails with "replacement directory
      # ../clicreds does not exist" (ka-0000005437).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build jira-syncback-probe from source ────────────────────────────
  # Used by the `jira-syncback-denybydefault` shard module (ka-0000005719,
  # coverage-backfill epic ka-0000000958) to exercise the jira-bridge SYNC-BACK
  # write path (JiraSync.handleUpdated/handleClosed) end-to-end WITHOUT a live
  # jira-bridge, a live Jira, or a real daemon. Like jira-conv-probe it wires the
  # REAL bridge.JiraSync (with the SAME config-driven WritePolicy production
  # wires) onto a REAL bridge.SSEStream against a STUB Jira httptest server that
  # records outbound REST per issue key — so "did the sync-back write?" is a
  # recorded call and no controller ever mints a pod. Asserts the deny-by-default
  # project allowlist + the source:jira-dark early-return (ka-0000005143). The
  # module falls back to an in-shell `go build` if this binary is absent, but
  # pre-installing it via the shard `use:` list keeps the build cached +
  # smoke-checked. trigger-probe-style: test-only, ships in no release
  # Makefile/Dockerfile target.
  - key: build-jira-syncback-probe
    use: go-deps
    run: |
      cd gardenio/controller
      CGO_ENABLED=0 go build -o /tmp/jira-syncback-probe ./cmd/jira-syncback-probe/
      sudo install /tmp/jira-syncback-probe /usr/local/bin/jira-syncback-probe
      test -x /usr/local/bin/jira-syncback-probe
    filter:
      - "gardenio/controller/cmd/jira-syncback-probe/**/*.go"
      - "gardenio/controller/internal/**/*.go"
      # internal/bridge/web.go has //go:embed web/* — see build-jira-conv-probe.
      - "gardenio/controller/internal/bridge/web/**"
      - "gardenio/controller/go.mod"
      - "gardenio/controller/go.sum"
      # controller replace => ../clicreds local module (see build-jira-conv-probe).
      - "gardenio/clicreds/**/*.go"
      - "gardenio/clicreds/go.mod"
      - "gardenio/clicreds/go.sum"

  # ── Build gitlab-prov-probe from source ──────────────────────────────
  # Used by the `gitlab-dark-provenance` shard module (ka-0000005448, E-PROV
  # epic) to exercise the forward-provenance stack — GitLabSync host scoping, the
  # upstream webhook merge GATE, the scoped GitLabUpstreamPoller, the
  # UpstreamAcceptanceReconciler, and the MRBacklinkReconciler peel guard —
  # end-to-end WITHOUT a live gitlab-bridge, a live GitLab, or real agent pods.
  # Like trigger-probe / jira-conv-probe it wires the REAL bridge components

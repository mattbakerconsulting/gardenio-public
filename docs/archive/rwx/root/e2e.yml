        # require-*=false). Model: the gardenio-gb-stop-suspend block above.
        require-outbox-rig: "false"
        require-slack-ui: "false"
        namespace: ""
        instance-id: ""
        keep: "false"
        only: ""
        skip: ""
        captain-poison-module: ""
        version: ""
        ref-name: ""
        host-domain: ""
      params:
        - key: commit-sha

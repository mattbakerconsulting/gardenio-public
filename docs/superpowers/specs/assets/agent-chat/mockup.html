<!DOCTYPE html>
<html lang="en" data-skin="baseline">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent chat · mockup</title>
<style>
/* ---- skins: tokens lifted from layout.html baseline / dark-terminal ---- */
html[data-skin="baseline"] { --bg:#fff; --bg-soft:#f6f7f9; --bg-head:#f0f2f5; --card-bg:#fff; --fg:#1a1a1a; --text-muted:#5c5c5c; --text-subtle:#6b6b6b; --accent:#b9851b; --rule:#d7dbe0; --rule-light:#e8ebef; --loud:#a3282a; --sel:rgba(33,150,243,0.06); --sel-border:rgba(33,150,243,0.55); --band:#f4f6f8; --band-user:rgba(33,150,243,0.10); --link:#1a5fb4; }
html[data-skin="dark-terminal"] { --bg:#0d1117; --bg-soft:#10151b; --bg-head:#161b22; --card-bg:#14181d; --fg:#c9d1d9; --text-muted:#9aa0a6; --text-subtle:#8b949e; --accent:#d4a017; --rule:rgba(160,170,185,0.22); --rule-light:rgba(160,170,185,0.12); --loud:#ff8a8a; --sel:rgba(88,166,255,0.08); --sel-border:rgba(88,166,255,0.55); --band:#1b2129; --band-user:rgba(88,166,255,0.12); --link:#58a6ff; }
html[data-skin="dark-terminal"] body { font-family: var(--mono); }

:root { --mono: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
* { box-sizing: border-box; }
body { margin:0; padding:0.6rem 1rem; font-family: sans-serif; background: var(--bg); color: var(--fg); line-height:1.4; font-size:14px; }
a { color: var(--link); }
code { font-family: var(--mono); font-size: 0.72rem; }
nav { display:flex; gap:1rem; align-items:center; border-bottom:1px solid var(--rule); padding-bottom:0.4rem; margin-bottom:0.5rem; font-size:0.9rem; flex-wrap:wrap; }
nav a { text-decoration:underline; }
nav .badge { display:inline-block; min-width:1.2em; padding:0 0.35em; border-radius:999px; background:#c62828; color:#fff; font-size:0.7rem; font-weight:700; text-align:center; margin-left:0.2rem; }
nav .spacer { margin-left:auto; }
.toolbar { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; margin:0.2rem 0 0.6rem; font-size:0.78rem; color:var(--text-subtle); }
.toolbar .seg { display:inline-flex; border:1px solid var(--rule); border-radius:5px; overflow:hidden; }
.toolbar .seg span { padding:0.15rem 0.55rem; border-right:1px solid var(--rule); }
.toolbar .seg span:last-child { border-right:0; }
.toolbar .seg span.on { background:#2563eb; color:#fff; font-weight:600; }
.toolbar input { font:inherit; font-size:0.78rem; padding:0.15rem 0.4rem; border:1px solid var(--rule); border-radius:4px; background:var(--bg); color:inherit; width:16rem; }

/* ---- chips: .plan-card .chip-status compact sizing ---- */
.chip { display:inline-flex; align-items:center; gap:0.25rem; padding:0.1rem 0.5rem; border:1px solid var(--rule); border-radius:999px; font-size:0.72rem; line-height:1.3; text-decoration:none; color:inherit; white-space:nowrap; font-variant-numeric:tabular-nums; }
.chip .age { opacity:0.8; }
.chip-loud, .age-loud { color:var(--loud) !important; font-weight:700; }
.chip-state { border-color:rgba(76,175,80,0.5); background:rgba(76,175,80,0.14); color:#256029; }
.chip-state-idle { border-color:var(--rule); background:transparent; color:var(--text-muted); }
.chip-state-stuck { border-color:rgba(198,40,40,0.5); background:rgba(198,40,40,0.08); color:#a3282a; }
.chip-state-stopped { border-color:var(--rule); background:var(--bg-soft); color:var(--text-muted); }
.chip-state-crashed { border-color:rgba(198,40,40,0.5); background:rgba(198,40,40,0.08); color:#a3282a; }
.chip-state-spawning { border-color:rgba(212,160,23,0.6); background:rgba(212,160,23,0.14); color:#7a5a00; }
.dot { width:0.5rem; height:0.5rem; border-radius:50%; background:#1a7f37; display:inline-block; box-shadow:0 0 0 2px rgba(26,127,55,0.25); animation:pulse 1.6s infinite; }
.dot-stuck { background:#cf222e; box-shadow:0 0 0 2px rgba(207,34,46,0.25); animation:none; }
.dot-off { background:#9aa0a6; box-shadow:none; animation:none; }
.dot-spawn { background:#d4a017; box-shadow:0 0 0 2px rgba(212,160,23,0.3); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
.chip-role { text-transform:uppercase; letter-spacing:0.02em; font-size:0.66rem; font-weight:600; background:rgba(76,175,80,0.16); border-color:rgba(76,175,80,0.55); color:#256029; }
.chip-role-gardener { background:rgba(33,150,243,0.14); border-color:rgba(33,150,243,0.5); color:#0b4f8a; }
.chip-project { background:var(--bg-soft); }
.chip-p0 { color:#fff; background:#c62828; border-color:#c62828; font-weight:700; }
.chip-p1 { color:#a3282a; background:rgba(198,40,40,0.08); border-color:rgba(198,40,40,0.5); font-weight:700; }
.chip-attn { background:rgba(212,160,23,0.18); border-color:rgba(212,160,23,0.6); color:#7a5a00; font-weight:600; }
.chip-esc { background:rgba(207,34,46,0.10); border-color:rgba(207,34,46,0.45); color:#a3282a; font-weight:600; }
.chip-spend { color:var(--text-muted); }
.chip-by { border:0; padding:0; color:var(--text-muted); gap:0.3rem; }
.avatar { display:inline-flex; align-items:center; justify-content:center; width:1.35rem; height:1.35rem; border-radius:4px; background:#e3e8ee; color:#33404d; font-size:0.6rem; font-weight:700; font-family:var(--mono); flex:none; }
.avatar-sm { width:1.05rem; height:1.05rem; font-size:0.52rem; }
.avatar-agent { background:#dbeafe; color:#1e3a8a; }
.avatar-user { background:#fde68a; color:#78350f; }
.mr { display:inline-flex; align-items:center; gap:0.22rem; padding:0.05rem 0.45rem; border:1px solid rgba(31,111,235,0.5); border-radius:999px; color:#1f6feb; font-size:0.7rem; text-decoration:none; max-width:min(100%,15rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.mr .ci-ok { color:#1a7f37; } .mr .ci-fail { color:#cf222e; } .mr .ci-run { color:#d4a017; }
.bead-pill { font-family:var(--mono); font-size:0.66rem; padding:0.02rem 0.4rem; border:1px solid var(--rule); border-radius:4px; background:var(--bg-soft); text-decoration:none; color:inherit; }

/* ---- layout ---- */
.ac-layout { display:grid; grid-template-columns: 22rem minmax(0,1fr); gap:0.9rem; align-items:start; height:calc(100vh - 6.2rem); }
.ac-rail { overflow-y:auto; height:100%; display:flex; flex-direction:column; gap:0.45rem; padding-right:0.2rem; }
.ac-conv { height:100%; display:flex; flex-direction:column; min-width:0; border:1px solid var(--rule); border-radius:10px; background:var(--card-bg); overflow:hidden; }
.ac-conv-head { border-bottom:1px solid var(--rule); background:var(--bg-soft); }
.ac-conv-head .ac-card { border:0; border-radius:0; background:transparent; }
.ac-msgs { flex:1 1 auto; overflow-y:auto; padding:0.6rem 0.9rem; display:flex; flex-direction:column; gap:0.45rem; }
.ac-composer { border-top:1px solid var(--rule); padding:0.5rem 0.7rem; display:flex; gap:0.5rem; align-items:center; background:var(--bg-soft); }
.ac-composer input { flex:1; font:inherit; font-size:0.8rem; padding:0.35rem 0.55rem; border:1px solid var(--rule); border-radius:6px; background:var(--bg); color:inherit; }
.ac-composer input:disabled { opacity:0.6; }
.ac-composer button { font:inherit; font-size:0.78rem; padding:0.3rem 0.7rem; border:1px solid var(--rule); border-radius:6px; background:var(--card-bg); color:inherit; cursor:pointer; }
.ac-composer button.primary { background:#2563eb; color:#fff; border-color:#2563eb; font-weight:600; }
.ac-composer .hint { font-size:0.7rem; color:var(--text-subtle); }
.ac-composer .hint.resume { color:#7a5a00; font-weight:600; }

/* ---- the agent card ---- */
.ac-card { border:1px solid var(--rule); border-radius:10px; padding:0.6rem 0.8rem; background:var(--card-bg); display:flex; flex-direction:column; gap:0.38rem; text-decoration:none; color:inherit; position:relative; }
.ac-card:hover { border-color:var(--accent); }
.ac-card.is-selected { border-color:var(--sel-border); background:var(--sel); }
.ac-card.is-unread::before { content:""; position:absolute; left:-0.05rem; top:0.9rem; width:0.45rem; height:0.45rem; border-radius:50%; background:#2563eb; transform:translateX(-50%); }
.ac-eyebrow { font-size:0.64rem; letter-spacing:0.02em; color:var(--text-subtle); display:flex; gap:0.3rem; align-items:baseline; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:-0.1rem; }
.ac-eyebrow .k { text-transform:uppercase; font-weight:700; opacity:0.75; flex:none; }
.ac-eyebrow a { color:var(--fg); text-decoration:none; font-weight:600; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.ac-eyebrow .step { flex:none; font-variant-numeric:tabular-nums; }
.ac-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:0.45rem; row-gap:0.1rem; }
.ac-name { font-weight:700; font-size:0.8rem; line-height:1.22; flex:1 1 9rem; min-width:0; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; overflow-wrap:anywhere; color:var(--fg); text-decoration:none; }
.agent-link { display:inline-flex; align-items:center; gap:0.25rem; color:var(--text-muted); text-decoration:none; font-size:0.7rem; }
.agent-link:hover { color:var(--link); }
.ac-head-tail { display:flex; align-items:center; gap:0.45rem; flex:0 0 auto; margin-left:auto; font-size:0.7rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.ac-meta { display:flex; flex-wrap:wrap; align-items:center; column-gap:0.3rem; row-gap:0.18rem; }
.ac-band { background:var(--band); border-radius:7px; padding:0.45rem 0.6rem; display:flex; flex-direction:column; gap:0.28rem; border-left:3px solid #2563eb; }
.ac-band-title { font-weight:700; font-size:0.8rem; line-height:1.25; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
.ac-band-title a { color:inherit; text-decoration:none; }
.ac-band-sub { display:flex; flex-wrap:wrap; align-items:center; column-gap:0.35rem; row-gap:0.15rem; font-size:0.72rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.ac-band-sub .crumb { color:var(--text-muted); text-decoration:none; }
.ac-band-sub .crumb b { color:var(--fg); font-weight:600; }
.ac-band.ac-wrapup { border-left-color:#4caf50; }
.ac-band.ac-noreport { border-left-color:#cf222e; background:rgba(207,34,46,0.06); }
.ac-band.ac-noreport .ac-band-title { color:var(--loud); }
.ac-wrap-rows { display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:0.5rem; row-gap:0.12rem; font-size:0.72rem; }
.ac-wrap-rows dt { color:var(--text-subtle); text-transform:uppercase; font-size:0.62rem; letter-spacing:0.03em; padding-top:0.1rem; }
.ac-wrap-rows dd { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-wrap-rows dd .more { color:var(--link); font-size:0.66rem; margin-left:0.2rem; }
.ac-pills { display:flex; flex-wrap:wrap; gap:0.25rem; align-items:center; }
.ac-task-line { font-size:0.72rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ac-task-line a { color:inherit; }
.ac-last { font-size:0.72rem; color:var(--text-muted); display:flex; gap:0.35rem; align-items:baseline; white-space:nowrap; overflow:hidden; }
.ac-last .who { font-weight:600; color:var(--fg); flex:none; }
.ac-last .txt { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.ac-last .g { flex:none; }
.ac-last .age { flex:none; margin-left:auto; font-variant-numeric:tabular-nums; }
.ac-levers { display:flex; gap:0.35rem; flex-wrap:wrap; align-items:center; }
.lever { font:inherit; font-size:0.72rem; padding:0.15rem 0.55rem; border:1px solid var(--rule); border-radius:6px; background:var(--card-bg); color:inherit; cursor:pointer; text-decoration:none; }
.lever.primary { border-color:#2563eb; color:#2563eb; font-weight:600; }
.lever.danger { color:#a3282a; }

/* ---- message cards ---- */
.msg { display:flex; flex-direction:column; gap:0.2rem; max-width:82%; padding:0.4rem 0.6rem; border:1px solid var(--rule-light); border-radius:8px; background:var(--card-bg); font-size:0.78rem; }
.msg.from-agent { align-self:flex-start; }
.msg.from-user { align-self:flex-end; background:var(--band-user); border-color:transparent; }
.msg.kind-decision, .msg.kind-escalation { max-width:100%; align-self:stretch; border-left:3px solid #d4a017; background:rgba(212,160,23,0.06); }
.msg.kind-escalation { border-left-color:#cf222e; background:rgba(207,34,46,0.05); }
.msg.kind-decision.answered { border-left-color:#4caf50; background:transparent; }
.msg.kind-report { border-left:3px solid #6b7280; }
.msg.kind-wrapup { max-width:100%; align-self:stretch; border-left:3px solid #4caf50; }
.msg-head { display:flex; align-items:center; gap:0.35rem; font-size:0.7rem; color:var(--text-muted); flex-wrap:wrap; }
.msg-head .who { font-weight:600; color:var(--fg); }
.msg-head .kind { text-transform:uppercase; font-size:0.6rem; letter-spacing:0.04em; padding:0 0.35rem; border:1px solid currentColor; border-radius:3px; opacity:0.75; }
.msg-head .age { margin-left:auto; font-variant-numeric:tabular-nums; }
.msg-body { line-height:1.35; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
.msg-body p { margin:0; }
.msg-body.open { -webkit-line-clamp:unset; }
.msg-foot { display:flex; gap:0.3rem; flex-wrap:wrap; align-items:center; font-size:0.7rem; color:var(--text-muted); }
.msg .fold { font-size:0.68rem; color:var(--link); cursor:pointer; }
.opts { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:0.15rem; }
.opt { font:inherit; font-size:0.72rem; padding:0.2rem 0.6rem; border:1px solid var(--rule); border-radius:6px; background:var(--card-bg); color:inherit; cursor:pointer; }
.opt b { font-family:var(--mono); font-size:0.66rem; margin-right:0.3rem; opacity:0.7; }
.opt.chosen { border-color:#4caf50; background:rgba(76,175,80,0.14); color:#256029; font-weight:600; }
.opt.approve { border-color:#4caf50; color:#256029; font-weight:600; }
.opt.reject { border-color:rgba(207,34,46,0.5); color:#a3282a; }
.nested { margin-left:0.8rem; border-left:2px solid var(--rule); padding-left:0.5rem; }
.marker { align-self:center; font-size:0.66rem; color:var(--text-subtle); display:flex; gap:0.35rem; align-items:center; font-variant-numeric:tabular-nums; }
.marker::before, .marker::after { content:""; width:2.5rem; height:1px; background:var(--rule); }
.tldr { font-weight:700; }

/* ---- stream view ---- */
.ac-stream { display:flex; flex-direction:column; gap:0.6rem; max-width:64rem; }
.ac-stream .ac-card { gap:0.4rem; }
.ac-stream .msgs-nested { display:flex; flex-direction:column; gap:0.3rem; padding-top:0.2rem; border-top:1px dashed var(--rule-light); }
.ac-stream .msg { max-width:100%; }
.earlier { font-size:0.68rem; color:var(--link); }

/* ---- dark phosphor overrides (every hard-coded ink above is named here) ---- */
html[data-skin^="dark"] .chip-state { color:#6ee7b7; border-color:rgba(110,231,183,0.45); background:rgba(76,175,80,0.16); }
html[data-skin^="dark"] .chip-state-idle { color:#b8c2d0; border-color:rgba(160,170,185,0.35); background:transparent; }
html[data-skin^="dark"] .chip-state-stuck, html[data-skin^="dark"] .chip-state-crashed { color:#ff8a8a; border-color:rgba(255,138,138,0.45); background:rgba(198,40,40,0.14); }
html[data-skin^="dark"] .chip-state-stopped { color:#9aa0a6; background:var(--bg-head); }
html[data-skin^="dark"] .chip-state-spawning { color:#f5d17a; border-color:rgba(245,209,122,0.5); }
html[data-skin^="dark"] .chip-role { color:#6ee7b7; border-color:rgba(110,231,183,0.5); background:rgba(76,175,80,0.18); }
html[data-skin^="dark"] .chip-role-gardener { color:#8ec5ff; border-color:rgba(88,166,255,0.5); background:rgba(88,166,255,0.14); }
html[data-skin^="dark"] .chip-p0 { color:#fff; background:#d32f2f; border-color:#ff8a8a; }
html[data-skin^="dark"] .chip-p1 { color:#ff8a8a; border-color:rgba(255,138,138,0.5); background:rgba(198,40,40,0.14); }
html[data-skin^="dark"] .chip-attn { color:#f5d17a; border-color:rgba(245,209,122,0.55); background:rgba(212,160,23,0.16); }
html[data-skin^="dark"] .chip-esc { color:#ff8a8a; border-color:rgba(255,138,138,0.45); background:rgba(207,34,46,0.14); }
html[data-skin^="dark"] .avatar { background:#2d3745; color:#c9d1d9; }
html[data-skin^="dark"] .avatar-agent { background:#1e3a5f; color:#8ec5ff; }
html[data-skin^="dark"] .avatar-user { background:#5a4a12; color:#f5d17a; }
html[data-skin^="dark"] .mr { color:#58a6ff; border-color:rgba(88,166,255,0.5); }
html[data-skin^="dark"] .mr .ci-ok { color:#6ee7b7; } html[data-skin^="dark"] .mr .ci-fail { color:#ff8a8a; } html[data-skin^="dark"] .mr .ci-run { color:#f5d17a; }
html[data-skin^="dark"] .ac-band { border-left-color:#58a6ff; }
html[data-skin^="dark"] .ac-band.ac-wrapup { border-left-color:#6ee7b7; }
html[data-skin^="dark"] .ac-band.ac-noreport { border-left-color:#ff8a8a; background:rgba(207,34,46,0.10); }
html[data-skin^="dark"] .lever.primary { color:#58a6ff; border-color:#58a6ff; }
html[data-skin^="dark"] .lever.danger { color:#ff8a8a; }
html[data-skin^="dark"] .opt.chosen, html[data-skin^="dark"] .opt.approve { color:#6ee7b7; border-color:rgba(110,231,183,0.5); }
html[data-skin^="dark"] .opt.reject { color:#ff8a8a; }
html[data-skin^="dark"] .msg.kind-decision { border-left-color:#f5d17a; background:rgba(212,160,23,0.08); }
html[data-skin^="dark"] .msg.kind-escalation { border-left-color:#ff8a8a; }
html[data-skin^="dark"] .msg.kind-decision.answered, html[data-skin^="dark"] .msg.kind-wrapup { border-left-color:#6ee7b7; }
html[data-skin^="dark"] .ac-composer .hint.resume { color:#f5d17a; }
html[data-skin^="dark"] .dot { background:#3fb950; }
html[data-skin^="dark"] .ac-card.is-unread::before { background:#58a6ff; }
html[data-skin^="dark"] nav .badge { background:#d32f2f; }


/* ---- lightbox: one host, server-rendered bodies, URL-mirrored ---- */
.lb-backdrop { position:fixed; inset:0; background:rgba(10,14,20,0.45); backdrop-filter:blur(1.5px); display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem; }
.lb { width:min(56rem, 100%); max-height:90vh; overflow:auto; background:var(--card-bg); color:var(--fg); border:1px solid var(--rule); border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,0.35); display:flex; flex-direction:column; }
.lb-head { display:flex; align-items:center; gap:0.5rem; padding:0.6rem 0.9rem; border-bottom:1px solid var(--rule); background:var(--bg-soft); position:sticky; top:0; }
.lb-head .kind { text-transform:uppercase; font-size:0.62rem; letter-spacing:0.05em; padding:0.05rem 0.4rem; border:1px solid currentColor; border-radius:3px; opacity:0.8; }
.lb-head .title { font-weight:700; font-size:0.86rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-head .x { font-size:1rem; line-height:1; padding:0 0.3rem; cursor:pointer; color:var(--text-muted); }
.lb-head .kbd { font-family:var(--mono); font-size:0.62rem; color:var(--text-subtle); border:1px solid var(--rule); border-radius:3px; padding:0 0.3rem; }
.lb-body { padding:0.8rem 0.9rem; display:grid; grid-template-columns:minmax(0,1fr) 16rem; gap:0.9rem; }
.lb-main { display:flex; flex-direction:column; gap:0.6rem; font-size:0.82rem; }
.lb-side { display:flex; flex-direction:column; gap:0.5rem; font-size:0.72rem; color:var(--text-muted); border-left:1px solid var(--rule-light); padding-left:0.8rem; }
.lb-side h4 { margin:0; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-subtle); }
.lb-side .row { display:flex; flex-direction:column; gap:0.15rem; }
.lb-side .row a { color:var(--fg); text-decoration:none; font-weight:600; }
.lb-prompt { font-size:0.9rem; line-height:1.4; }
.lb-opts { display:flex; flex-direction:column; gap:0.4rem; }
.lb-opt { display:grid; grid-template-columns:auto minmax(0,1fr); gap:0.6rem; align-items:start; padding:0.5rem 0.6rem; border:1px solid var(--rule); border-radius:8px; cursor:pointer; background:var(--card-bg); }
.lb-opt:hover { border-color:var(--accent); }
.lb-opt.sel { border-color:#2563eb; background:var(--sel); box-shadow:0 0 0 1px #2563eb inset; }

/* ---- responsive: the rail is the page, the conversation replaces it ---- */
@media (max-width: 60rem) {
  .ac-layout { grid-template-columns: minmax(0,1fr); height:auto; }

.back { display:none; font-size:0.78rem; margin-bottom:0.4rem; }
@media (pointer: coarse) { .lever, .opt, .ac-composer button { min-height:44px; } }
@media (prefers-reduced-motion: reduce) { .dot { animation:none; } }
.ac-card.compact .ac-band { padding:0.35rem 0.5rem; }

function stateChip(a){
  const m = {
    running: `<span class="chip chip-state" title="agent_state=running, heartbeat 40s ago"><span class="dot"></span>running · live</span>`,
    spawning: `<span class="chip chip-state chip-state-spawning"><span class="dot dot-spawn"></span>spawning</span>`,
    idle: `<span class="chip chip-state chip-state-idle" title="armed cron gardener, next fire ${a.idleNext}">idle ⏱ <span class="age">· ${a.idleNext}</span></span>`,
    stuck: `<span class="chip chip-state chip-state-stuck" title="agent_state=running but no heartbeat for ${a.stuckAge} (agentStaleThreshold 1h)"><span class="dot dot-stuck"></span>stuck <span class="age">· ${a.stuckAge}</span></span>`,
    stopped: `<span class="chip chip-state chip-state-stopped"><span class="dot dot-off"></span>stopped <span class="age">· ${a.exit}</span></span>`,
    crashed: `<span class="chip chip-state chip-state-crashed"><span class="dot dot-stuck"></span>crashed <span class="age">· ${a.exit}</span></span>`,
  };
  return m[a.state];
}
function metaStrip(a, opts={}){
  let s = stateChip(a);
  s += `<span class="chip chip-role ${a.role==='gardener'?'chip-role-gardener':''}">${a.role}</span>`;
  if (!opts.hideProject) s += `<span class="chip chip-project">${a.project}</span>`;
  if (a.prio && a.prio !== 'P2') s += `<span class="chip ${a.prio==='P0'?'chip-p0':'chip-p1'}">${a.prio}</span>`;
  if (!opts.mine) s += `<span class="chip chip-by">by <span class="avatar avatar-sm avatar-user">${a.by}</span></span>`;
  if (a.needs && a.needs.decisions) s += `<a class="chip chip-attn" title="1 open decision, oldest ${a.needs.decAge}">${a.needs.decisions} to answer <span class="age">· ${a.needs.decAge}</span></a>`;

  s += `<span class="chip chip-spend" title="session spend so far">${a.spend}</span>`;
  return `<div class="ac-meta">${s}</div>`;
}

}

      : `<span class="kind">decision · needs you</span><span class="who" title="${m.who}">agent</span><span class="age ${o.pinned?'':''}">waiting ${m.age}</span>`;
    const rep = m.report ? `<div class="nested msg kind-report" style="max-width:100%"><div class="msg-head"><span class="kind">report · ${m.report.type}</span><span class="fold">expand</span></div><div class="msg-body tldr" style="-webkit-line-clamp:2">${esc(m.report.body)}</div></div>` : '';
    return `<div class="msg kind-decision ${m.answered?'answered':''}"><div class="msg-head">${head}</div><div class="msg-body open"><p>${esc(m.prompt)}</p></div><div class="opts">${opts}</div>${m.answered?'':'<div class="msg-foot"><input placeholder="optional note to the agent" style="font:inherit;font-size:0.7rem;padding:0.15rem 0.4rem;border:1px solid var(--rule);border-radius:4px;background:var(--bg);color:inherit;flex:1"><span class="fold">dismiss</span></div>'}${rep}</div>`;

  if (m.kind==='wrapup') {
    const a = o.agent; const w = a.wrapup;
    return `<div class="msg kind-wrapup"><div class="msg-head"><span class="avatar avatar-sm avatar-agent" title="${a.name}">${a.ini}</span><span class="who" title="${a.name}">agent</span><span class="kind">wrapup</span><span class="age">${a.age}</span></div><div class="msg-body open tldr">${esc(w.tldr)}</div><dl class="ac-wrap-rows">${[['did',w.did],['handoff',w.handoff]].map(r=>`<dt>${r[0]}</dt><dd title="${esc(r[1])}">${esc(r[1])}</dd>`).join('')}</dl><div class="ac-pills">${w.beads.map(b=>`<a class="bead-pill" href="#">${b}</a>`).join('')}${w.prs.map(p=>`<a class="mr" href="#">↗ ${p.n} ${esc(p.t)} <span class="ci-ok">✓</span></a>`).join('')}</div></div>`;
  }
  return '';
}
function conversation(a){
  const closed = (a.state==='stopped' || a.state==='crashed');
  const msgs = a.msgs.map(m => msgCard(m,{agent:a})).join('');
  const composer = closed
    ? `<div class="ac-composer"><input placeholder="Message this agent (${a.ini}) · sending will resume it with its session"><button class="primary">Send &amp; resume ▶</button></div>`
    : `<div class="ac-composer"><input placeholder="Message this agent (${a.ini})"><span class="hint">nudges the pod, throttled 60s</span><button class="primary">Send</button></div>`;
  return `<section class="ac-conv"><div class="ac-conv-head">${agentCard(a,{header:true})}</div><div class="ac-msgs" id="msgs">${msgs}</div>${composer}</section>`;
}
function twoPane(){
  const rail = AGENTS.map(a => agentCard(a,{compact:true, selected:a.id===selectedId})).join('');
  const sel = AGENTS.find(a=>a.id===selectedId);
  return `<div class="ac-layout"><div class="ac-rail">${rail}</div>${conversation(sel)}</div>`;
}
function stream(){
  return `<div class="ac-stream">${AGENTS.map(a => {
    const real = a.msgs.filter(m=>m.kind!=='marker');
    const lastN = real.slice(-2).map(m=>msgCard(m,{agent:a})).join('');
    const earlier = real.length>2 ? `<a class="earlier" href="#">${real.length-2} earlier · open conversation →</a>` : '';
    const card = agentCard(a,{stream:true});
    return card.replace(/<\/div>$/, `<div class="msgs-nested">${earlier}${lastN}</div></div>`);
  }).join('')}</div>`;
}
document.getElementById('root').innerHTML = view==='stream' ? stream() : twoPane();
if (view==='stream'){ document.getElementById('seg-two').classList.remove('on'); document.getElementById('seg-stream').classList.add('on'); }

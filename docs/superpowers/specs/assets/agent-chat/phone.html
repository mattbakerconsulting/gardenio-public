<!DOCTYPE html><html><head><meta charset="utf-8"><title>phone frame</title>
<style>body{margin:0;background:#666;display:flex;gap:24px;padding:16px;font-family:sans-serif}
iframe{width:375px;height:812px;border:0;border-radius:18px;background:#fff;box-shadow:0 0 0 8px #222}</style></head>
<body><script>
const q=new URLSearchParams(location.search);const skin=q.get('skin')||'baseline';
for (const pane of ['rail','conversation']) { const f=document.createElement('iframe'); f.src=`mockup.html?pane=${pane}&skin=${skin}&face=${q.get('face')||'running'}`; document.body.appendChild(f); }
</script></body></html>

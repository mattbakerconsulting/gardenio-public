<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="An agent asks for a read-only cluster check in its Slack thread (placeholder frame)">
  <!-- Frame 1 of Permissions as tickets: the request card in the agent's thread.
       PLACEHOLDER: replace with the gb slack view screenshot of this step from the
       Slack test workspace (gd-BzL2OD4b3n, waits on gd-fWeCNSRdCd). Keep 640x360. -->
  <style>
    .bg { fill: #ffffff; } .rule { stroke: #e2e2e2; }
    .t { fill: #1d1c1d; font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .name { font-weight: 700; } .muted { fill: #616061; font-size: 12px; }
    .card { fill: #f8f8f8; stroke: #dddddd; } .edge { fill: #d97a2b; } .edge.ok { fill: #2f7d4f; }
    .btnp { fill: #007a5a; } .btnt { font-weight: 700; font-size: 13px; fill: #ffffff; }
    .av2 { fill: #2f7d4f; } .av3 { fill: #d97a2b; } .avt { fill: #ffffff; font-weight: 700; font-size: 16px; }
    .quote { fill: #dddddd; }
    .tag { fill: #1d2420; opacity: .82; } .tagt { fill: #ffffff; font-size: 12px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d21; } .rule { stroke: #35373b; }
      .t { fill: #d1d2d3; } .muted { fill: #9a9b9e; }
      .card { fill: #222529; stroke: #3a3d42; } .edge.ok { fill: #5cc184; } .quote { fill: #565856; }
      .tag { fill: #e6ebe7; } .tagt { fill: #141816; }
    }
  </style>
  <rect class="bg" width="640" height="360"/>
  <rect class="av3" x="20" y="24" width="36" height="36" rx="6"/>
  <text class="t avt" x="38" y="48" text-anchor="middle">f</text>
  <text class="t name" x="72" y="38">fix-flaky-retry</text>
  <text class="t muted" x="184" y="38">10:12</text>
  <text class="t" x="72" y="60">The test fails only on one node pool. I need a read-only look at the nodes.</text>
  <rect class="card" x="72" y="76" width="540" height="150" rx="6"/>
  <rect class="edge" x="72" y="76" width="4" height="150" rx="2"/>
  <text class="t name" x="92" y="102">Escalation Request</text>
  <text class="t" x="92" y="126">Read node status on the cluster</text>
  <text class="t muted" x="92" y="150">read-only · runs as a separate agent once approved</text>
  <text class="t muted" x="92" y="172">Requested by fix-flaky-retry</text>
  <rect class="btnp" x="92" y="186" width="140" height="28" rx="4"/>
  <text class="t btnt" x="162" y="205" text-anchor="middle">Review in Web UI</text>
  <text class="t muted" x="72" y="256">The agent parks the task and waits. Nobody has to remember to come back.</text>
  <rect class="tag" x="400" y="322" width="224" height="26" rx="13"/>
  <text class="tagt" x="512" y="340" text-anchor="middle" font-family="system-ui, sans-serif">Placeholder · screenshot coming</text>

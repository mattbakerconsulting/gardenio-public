<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="A Slack thread from task to merged pull request (placeholder still)">
  <!-- Placeholder for the hero GIF (gd-4HBSQUraKz). Keep the GIF at 960x600 so the swap does not move the layout. -->
  <style>
    .bg { fill: #ffffff; } .bar { fill: #f8f8f8; } .rule { stroke: #e2e2e2; }
    .t { fill: #1d1c1d; font: 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .name { font-weight: 700; } .time, .muted { fill: #616061; font-size: 12px; }
    .h { font-weight: 700; font-size: 16px; }
    .link { fill: #1264a3; } .ment { fill: #1264a3; } .mentbg { fill: #e8f5fa; }
    .card { fill: #f8f8f8; stroke: #dddddd; } .edge { fill: #2f7d4f; }
    .btn { fill: #ffffff; stroke: #bbbbbb; } .btnp { fill: #007a5a; } .btnt { font-weight: 700; font-size: 13px; } .btnpt { fill: #ffffff; }
    .av1 { fill: #6b5bd2; } .av2 { fill: #2f7d4f; } .av3 { fill: #d97a2b; } .avt { fill: #ffffff; font-weight: 700; font-size: 16px; }
    .tag { fill: #1d2420; opacity: .82; } .tagt { fill: #ffffff; font-size: 12px; font-weight: 600; }
    .ok { fill: #2f7d4f; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1d21; } .bar { fill: #222529; } .rule { stroke: #35373b; }
      .t { fill: #d1d2d3; } .time, .muted { fill: #9a9b9e; }
      .link, .ment { fill: #4fa8e0; } .mentbg { fill: #1d3446; }
      .card { fill: #222529; stroke: #3a3d42; } .edge { fill: #5cc184; }
      .btn { fill: #1a1d21; stroke: #565856; } .ok { fill: #5cc184; }
      .tag { fill: #e6ebe7; } .tagt { fill: #141816; }
    }
  </style>
  <rect class="bg" width="960" height="600"/>
  <g transform="scale(1.25)">
  <rect class="bar" width="768" height="44"/>
  <line class="rule" x1="0" y1="44" x2="768" y2="44"/>
  <text class="t h" x="20" y="28">Thread</text>
  <text class="t muted" x="86" y="28"># ship-it</text>

  <!-- 1: the ask -->
  <rect class="av1" x="20" y="60" width="36" height="36" rx="6"/>
  <text class="t avt" x="38" y="84" text-anchor="middle">Y</text>
  <text class="t name" x="72" y="74">you</text>
  <text class="t time" x="108" y="74">10:02</text>
  <rect class="mentbg" x="70" y="81" width="78" height="22" rx="3"/>
  <text class="t" x="72" y="97"><tspan class="ment">@gardenio</tspan> the retry test in the bridge is flaky. Can an agent fix it?</text>

  <!-- 2: the bot starts an agent -->
  <rect class="av2" x="20" y="116" width="36" height="36" rx="6"/>
  <text class="t avt" x="38" y="140" text-anchor="middle">g</text>
  <text class="t name" x="72" y="130">gardenio</text>
  <text class="t time" x="144" y="130">APP  10:02</text>
  <text class="t" x="72" y="152">Started agent <tspan class="name">fix-flaky-retry</tspan> on your task. Follow along in this thread.</text>
  <rect class="card" x="72" y="162" width="520" height="48" rx="6"/>
  <rect class="edge" x="72" y="162" width="4" height="48" rx="2"/>
  <circle class="ok" cx="94" cy="186" r="5"/>
  <text class="t" x="108" y="182"><tspan class="name">working</tspan>  ·  claimed: fix the flaky retry test</text>
  <text class="t muted" x="108" y="200">crew · branch agent/fix-flaky-retry</text>

  <!-- 3: a decision with buttons -->
  <rect class="av3" x="20" y="226" width="36" height="36" rx="6"/>
  <text class="t avt" x="38" y="250" text-anchor="middle">f</text>
  <text class="t name" x="72" y="240">fix-flaky-retry</text>
  <text class="t time" x="186" y="240">10:09</text>
  <text class="t" x="72" y="262">The test races the real clock. Two ways to fix it. Which one?</text>
  <rect class="btnp" x="72" y="272" width="132" height="30" rx="4"/>
  <text class="t btnt btnpt" x="138" y="292" text-anchor="middle">Fake the clock</text>
  <rect class="btn" x="214" y="272" width="152" height="30" rx="4"/>
  <text class="t btnt" x="290" y="292" text-anchor="middle">Widen the timeout</text>
  <text class="t muted" x="72" y="320">you chose Fake the clock  ·  10:10</text>

  <!-- 4: the result -->
  <rect class="av3" x="20" y="336" width="36" height="36" rx="6"/>
  <text class="t avt" x="38" y="360" text-anchor="middle">f</text>
  <text class="t name" x="72" y="350">fix-flaky-retry</text>
  <text class="t time" x="186" y="350">10:21</text>
  <text class="t" x="72" y="372">Opened <tspan class="link">PR #42</tspan>: fix(bridge): fake the clock in the retry test</text>
  <rect class="card" x="72" y="382" width="520" height="48" rx="6"/>
  <rect class="edge" x="72" y="382" width="4" height="48" rx="2"/>
  <circle class="ok" cx="94" cy="406" r="5"/>
  <text class="t" x="108" y="402"><tspan class="name">done</tspan>  ·  CI green  ·  merged</text>
  <text class="t muted" x="108" y="420">1 file changed · 19 minutes from ask to merge</text>

  <rect class="tag" x="560" y="444" width="196" height="26" rx="13"/>
  <text class="tagt" x="658" y="462" text-anchor="middle" font-family="system-ui, sans-serif">Still frame · demo GIF coming</text>
  </g>
</svg>

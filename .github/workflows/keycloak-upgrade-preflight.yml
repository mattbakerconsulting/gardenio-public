# Keycloak upgrade preflight (gd-s47ivaszhW; plan gd-QXq1fjYuRD, phase 2).
#
# Rolls a Postgres-backed Keycloak 26.0.7 (what the cluster runs) to each
# candidate tag with the StatefulSet's own env and checks the migration, probes,
# issuer hostnames, first-admin kcadm calls, custom browser flow, device grant
# and WebAuthn Passwordless attributes. See scripts/keycloak-preflight/run.sh.
#
# Never a required check and never on a PR: it pulls multi-hundred-MB images.
# Doors: workflow_dispatch (pick tags), and push to agent/kc-preflight/** (a new
# workflow's dispatch trigger does not exist until the file is on main, and the
# crew PAT is Contents-only; same reason as e2e.yml's agent/e2e-ci/**).
#
# It is the "scratch CI job" the S2a step allows while the S1b theme harness
# (keycloak-theme.yml) is unmerged. S2b can point it at the chosen tag as the
# upgrade regression test.
name: keycloak-upgrade-preflight

on:
  push:
    branches: ['agent/kc-preflight/**']
  workflow_dispatch:
    inputs:
      tags:
        description: 'JSON array of candidate Keycloak tags'
        required: false
        default: '["26.7.5","26.8.1"]'
      baseline:
        description: 'Tag the database is seeded and migrated FROM'
        required: false
        default: '26.0.7'

permissions:
  contents: read

env:
  CANDIDATES: ${{ inputs.tags || '["26.7.5","26.8.1"]' }}
  BASELINE: ${{ inputs.baseline || '26.0.7' }}

jobs:
  matrix:
    runs-on: gardenio-k3s-light
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.m.outputs.tags }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          # Reject anything that is not a JSON array of plain version strings:
          # the value reaches `docker run` as an image tag.
          echo "$CANDIDATES" | jq -e 'type=="array" and length>0 and all(.[]; type=="string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' >/dev/null
          echo "tags=$(echo "$CANDIDATES" | jq -c .)" >>"$GITHUB_OUTPUT"

  preflight:
    name: ${{ matrix.tag }}
    needs: matrix
    runs-on: gardenio-k3s # dind sidecar: the job drives `docker run`
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.matrix.outputs.tags) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: keycloak
          POSTGRES_PASSWORD: keycloak
          POSTGRES_DB: keycloak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycloak"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: roll ${{ env.BASELINE }} -> ${{ matrix.tag }}
        run: OUT="$PWD/preflight-out" scripts/keycloak-preflight/run.sh "${{ matrix.tag }}" "$BASELINE"
      - name: summary
        if: always()
        run: |
          [ -f preflight-out/summary.md ] && cat preflight-out/summary.md >>"$GITHUB_STEP_SUMMARY" || echo "no summary produced" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-${{ matrix.tag }}
          path: preflight-out/
          if-no-files-found: warn

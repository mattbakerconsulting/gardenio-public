name: checks

# Ports the load-bearing checks that used to run in .rwx/ci.yml (archived under
# docs/archive/rwx/). Every job is a B row from the RWX proof table: a check on
# this repo's own code or config that ci.yml / images.yml do not already run.
# Jobs marked continue-on-error carry known pre-existing debt (red on the
# pristine snapshot too); they report, they do not block. golangci-lint is not
# one of them: a red golangci-lint fails `checks`. Like every heavy job it runs
# on a release tag push, the nightly and dispatch, never on a pull request (gd-19ECZxvFQw);
# the merge desk re-runs it on a PR's trial merge only for GUARD DRIFT
# (docs/merge-desk.md). `if: false` jobs are D rows: real checks we cannot run
# yet (need a live cluster, a beads daemon, or a tool we do not build). All run
# on the k3s ARC runner pool (gardenio/helm/ci).

on:
  push:
    # THE RELEASE TAG, NOT MAIN (owner 2026-11-03), as in ci.yml; read the
    # note on its `on.push`. Of the last 15 checks.yml main push runs, 10 were
    # cancelled by the next merge. This run of the tag is one of the three
    # release-deploy.sh rule 4 requires green before it rolls the tag, and
    # a tag push is a full run below (every gate open, its own concurrency
    # group). The nightly `schedule` is the one full main-head run a day.
    tags: ['20*'] # calver release tags, e.g. 2026.307.1, as images.yml
  pull_request:
    # PULL REQUESTS RUN THE LIGHT TIER ONLY (owner rule 2026-10-31; Task 7.3
    # part B, gd-19ECZxvFQw; root CLAUDE.md "CI on pull requests"). Every
    # heavy job below ANDs `github.event_name != 'pull_request'` into its
    # `if:`, so a PR push, draft or ready, runs only the gate jobs.
    # The heavy jobs run on a release tag push, the nightly and dispatch.
    # `ready_for_review` and `converted_to_draft` are deliberately absent: a
    # PR's draft state no longer changes what runs, so flipping it needs no
    # run, and the head's synchronize run is the one the merge desk reads.
    # scripts/check-ci-draft-gate.py guards all of this.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  # NIGHTLY FULL RUN (gd-2kZxn16TaS): where everything the PR-side gates of
  # gd-WFMvg9sDKE skip still runs, once a day, on main. `schedule` is treated
  # exactly like `workflow_dispatch` everywhere below (concurrency keys, the
  # `gate` and `lint` steps, every path gate's `if:`); see the same block in
  # ci.yml for the time. scripts/check-ci-draft-gate.py guards it.
  schedule:
    - cron: '43 10 * * *'

# ONE GROUP PER RUN FOR A RELEASE TAG (owner 2026-11-03). Main pushes no
# longer run this workflow (see `on.push`), so the shared "<workflow>-main"
# group of gd-RZopn9lf5I, which batched them by letting the newest push
# replace the waiting one, is gone with them. That batching is why most
# main runs never finished: under a steady stream of merges the waiting run
# was usually replaced (10 of the last 15 checks.yml main push runs cancelled).
#
# How a group behaves: it holds at most one RUNNING and one PENDING run, and a
# new run always replaces the PENDING one (GitHub cancels it) whatever
# cancel-in-progress says; cancel-in-progress governs only the RUNNING one.
#
# Keys, per event:
#   pull_request        per PR (github.ref): a newer push cancels the older
#                       run. From gd-gw9mSq9Qtm to part B (gd-19ECZxvFQw) the
#                       key was split by draft state, because a draft run and
#                       a ready_for_review run did different work and, with
#                       one slot, the draft run cancelled the ready one on PR
#                       #1503. Every PR run is now the light tier and
#                       `ready_for_review` starts none, so one slot per PR is
#                       right again. scripts/check-ci-draft-gate.py guards
#                       the PR arm.
#   workflow_dispatch / schedule / a tag push
#                       per run (github.run_id): a deliberate run, the nightly
#                       and a release tag are never evicted, nor evict one.
#                       The tag used to fall through to per-commit
#                       (github.sha), so a second tag on the same commit could
#                       share its slot; release-deploy.sh reads this run, so
#                       nothing may replace it.
#   anything else       per commit (github.sha). No other event reaches it.
#
# cancel-in-progress is TRUE only for pull_request; a tag run is never
# cancelled. scripts/check-main-concurrency.py evaluates this block for each
# event.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && github.run_id || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Exact patch, and the same one ci.yml pins -- see the note there. A bare
  # "1.25" lets setup-go drift to the newest patch, which invalidates GOCACHE
  # on every CI node simultaneously. Bump both files together.
  GO_VERSION: "1.25.14"

jobs:
  # ── Is this run already obsolete? (gd-BCyDxqofKe) ──────────────────────────
  # ci.yml's supersession check (now its `gate` job), ported. Read ci.yml's
  # note above that job and .github/actions/superseded/action.yml first; this
  # records only what is DIFFERENT here. The Task 0.2 baseline
  # (gardenio/docs/ci-minutes/baseline-2026-10-28.json, 2026-10-26..28) has
  # 263 checks.yml push runs at
  # 23.8 runner-minutes each, ~2,090 a day, and the per-sha concurrency group
  # of the time never superseded a main push -- so a burst of N merges paid for N
  # full suites of which one mattered.
  #
  # ── THE DIFFERENCE: THREE JOBS HERE ARE PATH-GATED PER PUSH ─────────────────
  # The rule "any newer push run covers me" holds only for a job that every
  # newer run runs, like ci.yml's `go` matrix. Here lint-go, helm and
  # cargo-security run only when THEIR push touched their paths (`changes`).
  # Push A edits the chart, push B edits only docs: B's `helm` is skipped by
  # B's own gate, so if A's `helm` deferred to B, nothing would ever lint A's
  # chart change and main would look green. So the two halves split:
  #
  #   ungated jobs (gitleaks, security, terraform, script-selftests, quench,
  #   dictation-corpus, wer-eval, lands-contract, lands-gl)
  #       every newer run runs them, so the run-wide verdict below is sound.
  #       They AND `needs.supersession.outputs.superseded != 'true'` into
  #       their `if:`, like ci.yml's `go`.
  #   path-gated jobs (lint-go, helm, cargo-security)
  #       do NOT read this job's verdict. Their in-job re-check passes its own
  #       `job:` name, and the composite then counts a newer run only if that
  #       run's job of the same name is pending, queued, running, or finished
  #       success/failure -- i.e. its path gate said yes. At run creation that
  #       job usually does not exist yet, so a job-aware gate here would almost
  #       always answer false; the in-job check is where it pays. ci.yml's
  #       rust, gardenhub-browser and lands-conformance work the same way
  #       (gd-025MCE7PhK).
  #
  # The in-job re-check runs in EVERY heavy job, gated or not, and always with
  # `job:` set -- stricter than needed for the ungated ones, but it means a
  # later path gate on any of them cannot silently turn this unsound.
  #
  # ── THE SENTINEL ────────────────────────────────────────────────────────────
  # Every heavy job has a `heavy work starting` step, first after the check,
  # with ci.yml's contract: `success` means the job did its work, `skipped`
  # means the in-job check fired, and a gate-skipped job has no steps at all.
  # gardenio/scripts/release-cut.sh read it for every workflow until
  # 2026-11-03, when it stopped reading CI (the tag's own runs gate the deploy
  # now, release-deploy.sh rule 4, which reads ci.yml's): a success run with
  # any sentinel `skipped` was not green, and neither was a run that had THIS
  # job but no sentinel `success` (the gate-skipped shape), nor a run in which
  # this job's `superseded -- run-wide skip` step succeeded (the gate fired,
  # yet a path-gated job built). Keep both names (the draft-gate guard pins
  # them): ci.yml's step of that name is still read by release-deploy.sh.
  #
  # Fail-open as in ci.yml: the dependants use `!cancelled()`, so this job
  # failing leaves `superseded` empty and every job runs. Unlike ci.yml, it
  # runs on BRANCH pushes only: the composite answers false for every other
  # event (pull_request, tag, schedule, workflow_dispatch), so elsewhere it
  # was a light pod and a scheduling delay in front of the ungated jobs, for nothing.
  # Skipped, it leaves `superseded` empty too. Since 2026-11-03 no branch push
  # runs this workflow (owner: test the release tag, not main), so today it
  # never runs; a release tag's run does not wait on it.
  # scripts/check-ci-draft-gate.py guards all of the above.
  supersession:
    name: superseded by a newer push?
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: gardenio-k3s-light # never heavy: the point is to not claim a node
    timeout-minutes: 5
    permissions:
      actions: read # list this workflow's runs
      contents: read # compare two commits
    outputs:
      superseded: ${{ steps.check.outputs.superseded }}
    steps:
      # Sparse + no cone mode: just the action directory, as in ci.yml.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/superseded
          sparse-checkout-cone-mode: false
      - id: check
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
      # Makes "the gate fired" visible in the jobs API: this step concludes
      # `success` only when the run-wide verdict skipped the ungated jobs.
      # A path-gated job (lint-go, helm, cargo-security, ...) can still build in
      # such a run and leave a sentinel `success`, so that alone does not prove
      # the run tested its commit. release-cut.sh refused any run in which this
      # step succeeded (SUPERSESSION_FIRED_STEP) until 2026-11-03; do not
      # rename it.
      - name: superseded -- run-wide skip
        if: steps.check.outputs.superseded == 'true'
        run: echo "a newer checks.yml push run covers this one; the ungated heavy jobs are skipped"

  # ── Which of the EXPENSIVE jobs below can this event actually change? ──────
  #
  # ci.yml solved the same problem with a workflow-level `paths-ignore`, which
  # costs nothing and adds no latency. checks.yml cannot use that: some of its
  # jobs genuinely read the whole tree (quench runs a docs-TOC and docs-link
  # pass, and the conflict-marker guard scans every tracked file), so a
  # workflow-level skip would silently disable real coverage. The filtering
  # therefore has to be per-job, which needs a gate job -- the same
  # `dorny/paths-filter` pattern images.yml already uses.
  #
  # This said "three of its jobs" and counted the internal-strings audit as the
  # third until 2026-09-22, when that job turned out to have never run at all
  # (see the D rows at the bottom of this file). The conclusion is unchanged --
  # quench and the conflict-marker guard still read the whole tree on their own
  # -- but the count was load-bearing-looking and was wrong, so it is fixed here
  # rather than left to be re-cited. (That guard stopped being its own job on
  # 2026-09-23 and ran inside script-selftests until that job was path-gated on
  # PRs (gd-is2Nts83Ai); it now runs inside quench, which is ungated, so the
  # whole-tree reasoning is unaffected.)
  #
  # Measured over the 253 first-parent commits on main in the 14 days to
  # 2026-09-22, the share of commits that CANNOT change each job's result:
  #
  #   lint-go (gardenio/controller)   80 %      helm              84 %
  #   lint-go (kbeads)                75 %      cargo-security    87 %
  #
  # 60 % of main commits need none of the four. That is ~59 heavy runner
  # slot-claims per day given back, on top of the ~42 ci.yml's path filter
  # already recovered -- and slot-claims, not node-minutes, are what the queue
  # wait on this pool is made of (gardenio/helm/ci/README.md).
  #
  # WHY IT IS SAFE TO FILTER THESE FOUR AND NOT THE OTHERS. A positive path
  # list normally fails CLOSED: add a new source tree and it silently stops
  # being covered. That risk vanishes exactly when the job's own scope is
  # ALREADY hardcoded to the same paths, because then the filter cannot be
  # narrower than the job. Each gated job is hardcoded:
  #
  #   lint-go         `cd <matrix.dir> && GOWORK=off golangci-lint run ./...`
  #                   (gardenio/controller, kbeads, gardenio/clicreds)
  #   helm            `helm lint gardenio/helm/gardenio/` + tests in that tree
  #   cargo-security  `defaults.run.working-directory: coop`
  #
  # A new Go module or Rust workspace appearing elsewhere would not be linted
  # or audited by these jobs today either, filter or no filter. The filters
  # below add the files each job reads from OUTSIDE its hardcoded directory,
  # which is the part that does not follow from the scope and had to be
  # audited by hand:
  #
  #   gardenio/clicreds/**   both Go modules `replace` it (controller
  #                          go.mod:230 -> ../clicreds, kbeads go.mod:166 ->
  #                          ../gardenio/clicreds), so with GOWORK=off it is
  #                          still compiled into both lint runs.
  #   gardenio/locks/security-tools.lock
  #                          cargo-security sources its cargo-audit and
  #                          cargo-deny pins from it.
  #
  # NOT gated, deliberately:
  #   security, terraform, script-selftests -- they never run on a PR
  #     (gd-19ECZxvFQw), and every other event runs them whole, so a path
  #     gate would save nothing (gd-whdmfznixO).
  #   quench -- a whole-repo scan. A secret committed
  #     in a markdown file is precisely what they exist to catch, so a docs-only
  #     commit is not a commit they can skip. (internal-strings-audit was listed
  #     here too until 2026-09-22; it is gone -- see the D rows. conflict-markers
  #     was listed until 2026-09-23, when it was folded into script-selftests.
  #     Since gd-is2Nts83Ai, quench also runs the four whole-tree guards that
  #     script-selftests hosted: conflict markers, large files, Go module
  #     coverage, kubectl apply of Secrets.)
  #   dictation-corpus -- on the medium tier, where queue wait is currently
  #     5-9 s. Adding `needs: changes` would roughly double its wall time to
  #     reclaim a few uncontended medium slot-claims a day.
  #
  # FAILING OPEN IS THE POINT. Every gate below is written so the job RUNS
  # when the gate did not succeed, and on workflow_dispatch and schedule
  # (where paths-filter has no meaningful base to diff against and would
  # report no changes at all). A broken gate must cost runner time, never coverage.
  # A release tag push runs everything too (owner 2026-11-03): the gated
  # jobs' `if:` let it through beside dispatch and schedule, and `gate` and
  # `lint` force every output on it.
  changes:
    name: changed-path gate
    runs-on: gardenio-k3s-light # light ARC scale set (gardenio/helm/ci) -- same shape as images.yml's `changes`; see arc-runners-light-values.yaml
    timeout-minutes: 10
    permissions:
      actions: read # the `base` step lists this workflow's push runs
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR's changed files via the API; without this the job fails with "Resource not accessible by integration" on every PR
    outputs:
      # These come from the `gate` step, not `filter`: gate ORs the path
      # verdict together with the per-job-block verdict. See the `gate` step.
      helm: ${{ steps.gate.outputs.helm }}
      coop: ${{ steps.gate.outputs.coop }}
      lint_matrix: ${{ steps.lint.outputs.matrix }}
      lint_count: ${{ steps.lint.outputs.count }}
    steps:
      # SPARSE, DEPTH 1, NO BLOBS (gd-LjoM6ipXQX). This used to be a
      # `fetch-depth: 0` clone of the whole history: 69 s at the median and
      # ~580 of this job's ~700 runner-min/day (Task 4.1, gd-WFMvg9sDKE).
      # Nothing here needs it. paths-filter reads a PR's files through the
      # API, and on a push it fetches its base at depth 1 itself when the clone
      # lacks it (dorny/paths-filter src/git.ts, ensureRefAvailable). The
      # `gate` step reads only the two files below, plus checks.yml at the base
      # commit, which the next step fetches. Do not go back to fetch-depth: 0;
      # scripts/check-ci-draft-gate.py refuses it.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/checks.yml
            scripts/workflow-changed-jobs.py
            .github/actions/last-run-base
          sparse-checkout-cone-mode: false
      # What a push diffs against (gd-RZopn9lf5I). Main pushes share one
      # concurrency group (see `concurrency:` above), so a waiting run can be
      # evicted by a newer push. Diffing only `before..after` would then drop
      # the evicted push's changes from lint-go, helm and cargo-security for
      # good. The base is the newest earlier push run that actually ran; see
      # .github/actions/last-run-base. Empty on a push means fail open: the
      # `gate` step gets no BASE_SHA and sets scope=ALL.
      - id: base
        continue-on-error: true
        uses: ./.github/actions/last-run-base
        with:
          workflow: checks.yml
      # One commit, trees only (the clone's blob:none filter carries over);
      # `git show` below then fetches the one blob it reads. Fails open: if the
      # fetch fails, `gate` finds no base commit and sets scope=ALL.
      - name: fetch the base commit
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.base.outputs.base }}
        run: |
          case "${BASE_SHA:-}" in
            ''|0000000000000000000000000000000000000000) echo "no base sha; gate fails open" ;;
            *) git fetch -q --depth=1 --no-tags origin "$BASE_SHA" \
                 || echo "::warning::could not fetch base ${BASE_SHA}; gate fails open" ;;
          esac
      # Not on a tag push: `gate` forces every output true there anyway, and
      # with no base paths-filter would diff main against the tag in this
      # depth-1 sparse clone; a failure would fail the release's run. As ci.yml.
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          # Empty (every event but a push, or no proven base) keeps
          # paths-filter's own default; `gate` then fails open on a push.
          base: ${{ steps.base.outputs.base }}
          filters: |
            controller:
              - 'gardenio/controller/**'
              - 'gardenio/clicreds/**'
              - 'testdata/role-parse-cases.json'
              - 'scripts/ratchets/deadcode-ratchet.sh' # lint-go's deadcode ratchet
            kbeads:
              - 'kbeads/**'
              - 'gardenio/clicreds/**'
              - 'lands/contract/**' # kbeads/go.mod replaces it (internal/landmap, D.6)
              - 'testdata/role-parse-cases.json'
              - 'scripts/ratchets/deadcode-ratchet.sh' # lint-go's deadcode ratchet
            # clicreds' OWN lint arm (gd-9DycTnzUo3). The two arms above
            # compile it through their `replace`, but golangci-lint reports
            # only the packages under the dir it runs in, so nothing linted
            # clicreds itself until it got this arm.
            clicreds:
              - 'gardenio/clicreds/**'
            helm:
              - 'gardenio/helm/gardenio/**'
              # The release-record size guard packs the chart with these and
              # the chart tests run the theme generator (gd-qiUiXvTX0k).
              - 'scripts/pack-gardenio-chart.sh'
              - 'scripts/pack-gardenio-chart_test.sh'
              - 'scripts/strip-helm-template-comments.py'
              - 'scripts/strip-helm-yaml-comments.py'
              - 'scripts/strip-helm-yaml-comments_test.py'
              - 'scripts/check-helm-release-size.sh'
              - 'gardenio/scripts/keycloak-theme-configmap.py'
              - 'gardenio/scripts/keycloak-theme-configmap_test.py'
              - 'gardenio/keycloak-theme/**'
              # The opt-in OpenZiti overlay chart (tests/render_test.sh).
              - 'gardenio/helm/ziti/**'
              # The duplicate-key guard (values_duplicate_keys_test.go) also
              # reads these two non-chart values locations.
              - 'gardenio/helm/values/**'
              - 'gardenio/helm/values*.yaml'
              - 'deploy-values/**'
              # e2e_lane_namespace_pool_test.go renders the lane overlay and
              # checks the operator's pool manifest against it.
              - 'gardenio/tests/e2e/lane/**'
              # runner_ingress_test.go holds the public runner route to the
              # daemon's runnerAllowedPatterns (gd-lNbLtKuWoq).
              - 'kbeads/internal/server/runner_auth.go'
              # The helm job sources its helm and promtool pins from these, so
              # a pin or sha bump re-runs the chart tests (gd-hZl1cKiELM,
              # gd-POfKpGi6Kj). scripts/check-ci-path-gates.py proves every
              # file it sources matches.
              - 'gardenio/images/agent/install/versions.env'
              - 'gardenio/images/agent/install/checksums.env'
            coop:
              - 'coop/**'
              - 'gardenio/locks/security-tools.lock'
      # ── "this workflow changed" used to mean "run everything" ─────────────
      #
      # Each filter above used to open with `- '.github/workflows/checks.yml'`.
      # The INTENT was right -- if you change how golangci-lint runs,
      # golangci-lint must run -- but checks.yml is ONE file defining twelve
      # jobs, so editing a comment on `security` re-ran `helm lint + chart
      # tests` and `cargo audit + deny` too.
      #
      # Measured on main, 2026-09-22: 40 of the 408 non-merge commits in the
      # last 7 days touch checks.yml (~6/day), and replaying the last 25 of
      # them through the splitter below, 14 touched no gated path AND changed
      # no gated job block -- so they fanned out four heavy jobs
      # (cargo audit + deny 347.2 s, golangci-lint controller 250.2 s, helm
      # 236.7 s, golangci-lint kbeads 110.0 s = 944 s of heavy-tier slot claim)
      # for nothing. That is ~3.7 heavy-runner-hours over the window, on a tier
      # measured pinned at its cap 65% of the time. Slot-claims are what this
      # pool's queue wait is made of, so this is a BURST-SHAPE fix -- the
      # recorded lever for this pool -- not a capacity one.
      #
      # So: the self-reference is NARROWED, not removed. A checks.yml edit
      # still triggers exactly the jobs whose own block changed. The splitter
      # fails open (scope=ALL, everything true) on a base it cannot resolve, a
      # file it cannot parse, a job added/renamed/removed, any change outside
      # the jobs mapping (`on`, top-level `env`, `concurrency`), and any change
      # to `changes` itself, because every gated job reads its outputs.
      # In the replay, 4 of 25 commits failed open that way. FAILING OPEN IS
      # THE POINT, as everywhere else in this job.
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # push gives the commit of the newest earlier push run that ran (the
          # `base` step); PR gives the base branch tip. An older base only ever
          # over-reports changed jobs, which is the safe side.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.base.outputs.base }}
          F_CONTROLLER: ${{ steps.filter.outputs.controller }}
          F_KBEADS: ${{ steps.filter.outputs.kbeads }}
          F_CLICREDS: ${{ steps.filter.outputs.clicreds }}
          F_HELM: ${{ steps.filter.outputs.helm }}
          F_COOP: ${{ steps.filter.outputs.coop }}
        run: |
          # Deliberately NOT `set -e`: every failure path below must fall
          # through to scope=ALL rather than fail the gate job.
          set -uo pipefail
          wf=.github/workflows/checks.yml
          base_yml="$RUNNER_TEMP/checks-base.yml"
          scope=ALL
          reason=""
          changed=""

          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then
            reason="${EVENT} has no base to diff against"
          elif [[ "${REF:-}" == refs/tags/* ]]; then
            # A release tag (owner 2026-11-03): release-deploy.sh rolls it
            # only on this run, so it runs every job.
            reason="tag push ${REF#refs/tags/} is a full run"
          elif [ -z "${BASE_SHA:-}" ]; then
            reason="empty base sha"
          elif [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            reason="null base sha (first push of a new branch)"
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            reason="base ${BASE_SHA} is not present in this checkout"
          elif ! git show "${BASE_SHA}:${wf}" > "$base_yml" 2>/dev/null; then
            reason="${wf} does not exist at ${BASE_SHA}"
          # -S -E proves the splitter is stdlib-only and env-independent: this
          # job has no pip step, and `import yaml` has killed a guard here
          # before.
          elif ! out=$(python3 -S -E scripts/workflow-changed-jobs.py --fail-open-on changes "$base_yml" "$wf" 2>&1); then
            reason="splitter exited non-zero: ${out}"
          else
            printf '%s\n' "$out"
            scope=$(printf '%s\n' "$out" | sed -n 's/^scope=//p' | head -1)
            case "$scope" in
              JOBS) changed=$(printf '%s\n' "$out" | sed -n 's/^changed=//p') ;;
              ALL) reason=$(printf '%s\n' "$out" | sed -n 's/^reason=//p' | head -1) ;;
              *) scope=ALL; reason="splitter printed no recognisable scope" ;;
            esac
          fi

          c=${F_CONTROLLER:-false}; k=${F_KBEADS:-false}
          l=${F_CLICREDS:-false}
          h=${F_HELM:-false}; p=${F_COOP:-false}
          if [ "$scope" = "ALL" ]; then
            echo "::notice::checks.yml job gate failing open: ${reason}"
            c=true; k=true; l=true; h=true; p=true
          elif [ -n "$changed" ]; then
            echo "checks.yml job blocks changed: $(printf '%s' "$changed" | tr '\n' ' ')"
            # Only the GATED jobs are mapped. A change to an ungated job
            # (quench, dictation-corpus, ...) correctly turns nothing
            # on here -- those jobs run unconditionally anyway.
            for j in $changed; do
              case "$j" in
                lint-go) c=true; k=true; l=true ;; # one matrix job over every module
                helm) h=true ;;
                cargo-security) p=true ;;
              esac
            done
          else
            echo "checks.yml: no job block changed; paths alone decide"
          fi

          printf 'controller=%s\n' "$c" >> "$GITHUB_OUTPUT"
          printf 'kbeads=%s\n' "$k" >> "$GITHUB_OUTPUT"
          printf 'clicreds=%s\n' "$l" >> "$GITHUB_OUTPUT"
          printf 'helm=%s\n' "$h" >> "$GITHUB_OUTPUT"
          printf 'coop=%s\n' "$p" >> "$GITHUB_OUTPUT"
          echo "gate: controller=$c kbeads=$k clicreds=$l helm=$h coop=$p"
      # lint-go is a matrix over three independent modules, and `if:` is
      # job-level -- it cannot skip one matrix entry and keep the others. So
      # the matrix itself is built here. Keeping it a matrix (rather than
      # splitting lint-go into separate jobs) preserves the check NAMES
      # "golangci-lint (gardenio/controller)" and "golangci-lint (kbeads)",
      # which history, dashboards and any future required-check config key on.
      - id: lint
        run: |
          set -euo pipefail
          sel='[]'
          # workflow_dispatch and schedule force every arm: paths-filter diffs
          # against the default branch on either, so on main it sees an empty
          # changeset and would report every filter false. A release tag push
          # forces every arm too (owner 2026-11-03).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ] || [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            sel='["gardenio/controller","kbeads","gardenio/clicreds"]'
          else
            if [ "${{ steps.gate.outputs.controller }}" = "true" ]; then
              sel=$(printf '%s' "$sel" | jq -c '. + ["gardenio/controller"]')
            fi
            if [ "${{ steps.gate.outputs.kbeads }}" = "true" ]; then
              sel=$(printf '%s' "$sel" | jq -c '. + ["kbeads"]')
            fi
            if [ "${{ steps.gate.outputs.clicreds }}" = "true" ]; then
              sel=$(printf '%s' "$sel" | jq -c '. + ["gardenio/clicreds"]')
            fi
          fi
          printf 'matrix=%s\n' "$sel" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "$(printf '%s' "$sel" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "lint-go will run for: $(printf '%s' "$sel" | jq -r 'if length == 0 then "(nothing)" else join(" ") end')"

  lint-go:
    name: golangci-lint (${{ matrix.dir }})
    needs: changes
    # Fail open: run unless the gate SUCCEEDED and said there is nothing to
    # lint. A failed or errored gate leaves needs.changes.result != 'success'
    # and every module gets linted.
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       startsWith(github.ref, 'refs/tags/') ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.lint_count != '0')
    # No run-wide supersession conjunct here, deliberately: this job is
    # path-gated per push, so a newer run need not run it. Its in-job
    # re-check passes `job:` instead -- see the `supersession` job.
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    # PER-ARM TIERS. The baseline probe below was added on 2026-09-22
    # specifically to decide this job's tier, and it decided the two arms
    # DIFFERENTLY:
    #
    #   arm                      peak      ANONMAX   vs medium limit 4096Mi
    #   lint-go kbeads          3042Mi     2021Mi    fits, 2.0x headroom
    #   lint-go controller     10096Mi     5889Mi    1.4x OVER -- OOM
    #
    # Had the demotion been taken on the kbeads number alone -- the arm that
    # finishes first and is easiest to sample -- the controller arm would have
    # been OOM-killed on medium, and an OOM-killed runner is indistinguishable
    # from a spot reclaim here (same "lost communication" annotation), so it
    # would have burned three retry-lost-runners attempts before going red.
    # Measure every arm.
    #
    # ^^^ "BOTH ARMS SHARE THIS ONE `runs-on`. The matrix cannot split tiers,
    # so the controller arm sets the tier for both." IS STRUCK (2026-09-23).
    # The measurements above stand; the premise that pinned BOTH arms to the
    # scarcest tier does not. `runs-on` accepts matrix context -- and
    # `continue-on-error` six lines below has keyed off `matrix.dir` in this
    # very job all along, so the capability was already demonstrated in place.
    #
    # Measured 01:44-02:49Z on 2026-09-23 (n=275 jobs across three tiers):
    # heavy ran at 75% utilisation with peak concurrency pinned at 10/10 =
    # maxRunners and a p90 queue wait of 605s (max 1306s), while medium sat at
    # 21.4% and p90 69s. This arm is 1167s of 29251 heavy runner-seconds
    # (4.0%), and it needs no dind: there is no docker, buildx, kind, k3d,
    # `services:` or job `container:` anywhere in the steps below. It wanted
    # heavy for MEMORY, never for docker -- so it moves to the tier that is
    # 79% idle and keeps a 2x memory margin.
    #
    # A module added to the matrix later falls to the `||` branch and lands on
    # heavy. That is the fail-safe direction: more memory, never less. Do not
    # invert this test to an allow-list of heavy modules.
    #
    # `gardenio/clicreds` (gd-9DycTnzUo3) is a stdlib + go-keyring module of
    # four packages, a fraction of kbeads' type-check footprint, so it joins
    # kbeads on medium -- the same call ci.yml's `go` job makes for it.
    runs-on: ${{ (matrix.dir == 'kbeads' || matrix.dir == 'gardenio/clicreds') && 'gardenio-k3s-medium' || 'gardenio-k3s' }}
    timeout-minutes: 25
    # RWX: lint-gardenio, lint-kbeads, kbeads/.rwx lint. No continue-on-error:
    # the controller arm carried it for a SA4023 finding that is long fixed, and
    # it let a SA1019 land on main red (2026-10-14, PRs #376/#382) while the run
    # still concluded success. A lint failure now fails the run.
    strategy:
      fail-fast: false
      matrix:
        # Built by the gate job. The `||` fallback is the fail-open half: if
        # the gate errored, lint_matrix is the empty string, fromJSON('')
        # would abort the job, and an aborted job is lost coverage -- so an
        # absent value expands to EVERY module instead.
        dir: ${{ fromJSON(needs.changes.outputs.lint_matrix || '["gardenio/controller","kbeads","gardenio/clicreds"]') }}
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: golangci-lint (${{ matrix.dir }})
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running golangci-lint (${{ matrix.dir }})"
      # Baseline probe. NOT redundant with the one at the end of this job: the
      # anon sampler is started by the FIRST probe, so a job with only a final
      # probe reports the seed that probe just wrote and `anonmax` degenerates
      # to the instantaneous `anon`. That is why every reading this job has
      # produced says `samp=started` with anonmax == anon (63-99Mi) while peak
      # said 4821-11755Mi -- not a broken sampler, an unstarted one.
      #
      # Proof the mechanism is sound, from the jobs that DO have two probes:
      # `security` reads anonmax 6874-7325Mi against anon 90-119Mi, and its
      # later probes say `samp=running`. So this one line is the difference
      # between an undecidable tier question and a decided one.
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: "lint-go-${{ matrix.dir }}-baseline" }
      - uses: actions/setup-go@v5
        if: steps.superseded.outputs.superseded != 'true'
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      # Install into the pool's node-local bindir when the runner offers one
      # (GOTOOLS_BIN, see gardenio/helm/ci/arc-runners-values.yaml), otherwise
      # into GOPATH/bin exactly as before. Measured: this `go install` cost
      # 60-68 s on every one of six consecutive runs and never less, because
      # `go install pkg@version` re-links a ~150 MB binary outside any module
      # and GOCACHE does not spare it.
      #
      # The version guard is not optional once the bindir is shared. A bare
      # `command -v golangci-lint || install` would pin nothing: the node
      # would keep whatever version some earlier job left there and lint
      # silently with it, which is the same class of drift
      # scripts/check-golangci-pin.sh exists to stop. So compare the exact
      # version the binary REPORTS, not its presence, and reinstall on any
      # mismatch -- including a missing binary, where `have` is empty.
      - name: golangci-lint (pinned)
        if: steps.superseded.outputs.superseded != 'true'
        env:
          GOLANGCI_LINT_VERSION: 2.13.2
        run: |
          set -euo pipefail
          BIN="${GOTOOLS_BIN:-$(go env GOPATH)/bin}"
          mkdir -p "$BIN"
          echo "$BIN" >> "$GITHUB_PATH"
          # `|| true` is load-bearing: under `set -euo pipefail` a missing
          # binary makes the pipeline exit 127 and aborts the step -- which is
          # precisely the cold-node first run this whole guard exists to serve.
          have=$("$BIN/golangci-lint" version 2>/dev/null \
                 | sed -n 's/.*has version \([0-9][0-9.]*\).*/\1/p') || true
          if [ "$have" != "$GOLANGCI_LINT_VERSION" ]; then
            echo "installing golangci-lint $GOLANGCI_LINT_VERSION into $BIN (found: ${have:-none})"
            GOBIN="$BIN" go install \
              "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${GOLANGCI_LINT_VERSION}"
          else
            echo "golangci-lint $have already present in $BIN"
          fi
      # golangci-lint also holds every func to the function caps (funlen,
      # gocyclo; gd-d29n0m678l). The funcs over a cap when that ratchet landed
      # are listed in the module's .golangci.yml, each with its own cap, by
      # scripts/ratchets/func-baseline.py; that list may only shrink.
      - run: cd ${{ matrix.dir }} && GOWORK=off golangci-lint run --timeout=15m ./...
        if: steps.superseded.outputs.superseded != 'true'
      # DEADCODE RATCHET (gd-d29n0m678l): no new func that no shipped main
      # reaches. One deadcode run, no -test, with every shipped main of the
      # module as a root, against <module>/.deadcode-baseline.tsv, which may
      # only shrink (deleting dead code never reds it). Same tool and pin as
      # reachability.yml (gd-Nd2ciHTvTE); bump both together. It rides this
      # job rather than one of its own because the module is already checked
      # out here on a runner sized to type-check it: about a minute for the
      # controller's seven mains on heavy, and kbeads' cmd/kd peaks near
      # 2.1 GB, inside medium's limit. clicreds has no main.
      - name: deadcode ratchet
        if: steps.superseded.outputs.superseded != 'true' && matrix.dir != 'gardenio/clicreds'
        env:
          DEADCODE_VERSION: v0.49.0
        run: |
          set -euo pipefail
          BIN="${GOTOOLS_BIN:-$(go env GOPATH)/bin}"
          # Same reasoning as the golangci-lint pin above: a shared bindir
          # must be checked for the exact version, not for presence.
          have=$(go version -m "$BIN/deadcode" 2>/dev/null | awk '$1 == "mod" { print $3 }') || true
          if [ "$have" != "$DEADCODE_VERSION" ]; then
            echo "installing deadcode $DEADCODE_VERSION into $BIN (found: ${have:-none})"
            GOTOOLCHAIN=local GOBIN="$BIN" go install "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}"
          fi
          DEADCODE="$BIN/deadcode" scripts/ratchets/deadcode-ratchet.sh check "${{ matrix.dir }}"
      # TEMPORARY DIAGNOSTIC -- see .github/actions/peak-memory. This is the
      # largest single consumer of the saturated heavy tier (3460s of slot time
      # over 40 runs on gardenio/controller, 1341s on kbeads) so it is the most
      # valuable thing to size, but also the least likely to fit a 4Gi limit:
      # golangci-lint type-checks the whole module and holds the result. The
      # matrix label matters here -- controller and kbeads are different
      # modules and there is no reason to assume they peak alike.
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: "lint-go-${{ matrix.dir }}" }

  script-selftests:
    name: shell guards + script self-tests
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    # The whole-tree guards it used to host moved to `quench`.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s-light # light ARC scale set (gardenio/helm/ci) -- adversarially verified safe 2026-09-21, see arc-runners-light-values.yaml
    # 20 cancelled green runs on a busy node (gd-EkMsUldjkA); the parallel
    # runner below is the fix, this is headroom for a node with no spare CPU.
    timeout-minutes: 25
    # RWX: test-scripts, test-outbox-shape, test-gvisor-*, test-shard-*,
    # test-skip-visibility, test-terraform-prewarm-contract, lint-large-files,
    # lint-merge-conflict-markers,
    # lint-golangci-pin, lint-go-module-coverage, lint-claude-code-currency-guard,
    # test-security-scripts, security-poison,
    # test-verify-image-signatures.
    # shellcheck is a static binary pinned here because apt's lags.
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: shell guards + script self-tests
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running shell guards + script self-tests"
      # The runner image has no xz and the shellcheck release is a .tar.xz;
      # python3's tarfile reads it, where apt-get install xz-utils cost ~75s
      # of this job on a busy node (gd-zVb2CwXaE7).
      - name: shellcheck
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e
          mkdir -p "$HOME/.local/bin"
          if ! command -v shellcheck >/dev/null; then
            curl -fsSL --retry 3 -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
            python3 - /tmp/shellcheck.tar.xz "$HOME/.local/bin/shellcheck" <<'EOF'
          import os, sys, tarfile
          with tarfile.open(sys.argv[1]) as t:
              data = t.extractfile("shellcheck-v0.11.0/shellcheck").read()
          with open(sys.argv[2], "wb") as f:
              f.write(data)
          os.chmod(sys.argv[2], 0o755)
          EOF
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" shellcheck --version
      # The runner the next two steps feed their lists to: a runner that lost
      # a failure would turn both green, so it is proved first.
      - name: the self-test runner reports every failure
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/run-selftests_test.py
      - name: shellcheck every guarded script
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e
          python3 scripts/run-selftests.py --jobs 4 <<'EOF'
          shellcheck -x scripts/check-large-tracked-files.sh scripts/check-golangci-pin.sh scripts/check-go-module-coverage.sh scripts/check-claude-code-currency.sh scripts/check-merge-conflict-markers.sh scripts/check-no-curl-pipe-shell.sh scripts/check-no-curl-pipe-shell_test.sh scripts/ci-fetch-verified.sh scripts/ci-fetch-verified_test.sh scripts/ci-fetch-node.sh scripts/security/check-secret-last-applied.sh scripts/security/check-secret-last-applied_test.sh scripts/k3s/kubectl-ssm.sh scripts/k3s/kubectl-ssm_test.sh scripts/lint-public-strings.sh scripts/lint-public-strings_test.sh scripts/public-readiness-inventory.sh scripts/quarantine.sh scripts/quarantine_test.sh
          shellcheck -x scripts/gvisor/freeze-thaw-rungs.sh scripts/gvisor/sentry-egress-check.sh scripts/gvisor/discriminating-restore-check.sh
          shellcheck -x gardenio/tests/e2e/scripts/lib-gvisor-node.sh gardenio/tests/e2e/scripts/lib-gvisor-forensics.sh
          shellcheck -x gardenio/tests/e2e/scripts/lib-kd-create.sh gardenio/tests/e2e/scripts/test-lib-kd-create.sh
          shellcheck -x gardenio/helm/ziti/tests/render_test.sh
          shellcheck -x policy/kyverno/verify-image-signatures_test.sh
          shellcheck -x scripts/check-tf-tree-freshness.sh scripts/check-tf-tree-freshness_test.sh scripts/tf-gardenio.sh scripts/tf-gardenio_test.sh scripts/check-tf-no-secret-version-data.sh scripts/check-tf-no-secret-version-data_test.sh
          shellcheck -x gardenio/scripts/machine-principal-canary.sh gardenio/scripts/machine-principal-canary_test.sh
          shellcheck -x gardenio/scripts/ha-drill-drain.sh
          shellcheck -x gardenio/scripts/lands-fence-matrix.sh gardenio/scripts/lands-fence-matrix_test.sh
          shellcheck -x gardenio/scripts/land-door-verify.sh gardenio/scripts/land-door-verify_test.sh
          shellcheck -x gardenio/scripts/release-cut.sh gardenio/scripts/release-cut_test.sh gardenio/scripts/release.sh gardenio/scripts/release-role-guard.sh
          shellcheck -x gardenio/scripts/release-deploy_test.sh gardenio/scripts/release-deploy-record_test.sh gardenio/scripts/release-deploy-edge_test.sh gardenio/scripts/release-deploy_test_harness.sh
          shellcheck -x scripts/security/probe-imds-unreachable.sh scripts/security/probe-imds-unreachable_test.sh
          shellcheck -x gardenio/images/agent/install/codex.sh gardenio/images/agent/install/codex_test.sh
          shellcheck -x gardenio/images/agent/install/go-warm.sh
          shellcheck -x gardenio/images/agent/install/gemini.sh gardenio/images/agent/install/gemini_test.sh
          shellcheck -x gardenio/images/agent/smoke.sh gardenio/images/agent/smoke_test.sh
          shellcheck -x gardenio/images/agent/pg-scratch.sh gardenio/images/agent/pg-scratch_test.sh
          shellcheck -x scripts/onboard.sh scripts/onboard_test.sh scripts/onboard-mac.sh scripts/gardenio-doctor.sh
          shellcheck -x scripts/reachability/deadcode.sh scripts/reachability/coverage-by-package.sh scripts/reachability/summarize.sh scripts/reachability/code-size.sh scripts/reachability/reachability_test.sh
          shellcheck -x scripts/metrics/one-pager.sh scripts/metrics/one-pager_test.sh
          shellcheck -x scripts/ratchets/line-budget.sh scripts/ratchets/line-budget_test.sh scripts/ratchets/deadcode-ratchet.sh scripts/ratchets/deadcode-ratchet_test.sh
          shellcheck -x scripts/coverage/regen-baselines.sh scripts/coverage/regen-baselines_test.sh
          EOF
      # An image that compiles controller/ itself when images/_controller-base/
      # already built that binary still produces a correct image -- it just puts
      # a ~150s job where a ~50s one belongs, on a whole node, and the only
      # symptom is queue wait in some other workflow. That is exactly what
      # happened: phase 2 built all 20 binaries in the shared base and wired six
      # images onto it, and the other fourteen went un-migrated until 2026-09-22.
      - name: images are wired to the shared controller-base
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-controller-base.py
      # Fixtures for the build-policy guards (gd-kCs3VDmMWR); the live checks
      # run in quench. A cmd/ dir nothing builds must fail.
      - name: build-policy guard self-tests
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e
          python3 scripts/check-cmd-shipped_test.py
          python3 scripts/check-guard-provenance_test.py
      # Pull requests run the light tier only, draft or not (gd-JGkmjFfv3B,
      # gd-19ECZxvFQw). Guards the pull_request trigger types, the
      # `github.event_name != 'pull_request'` conjunct on every heavy job,
      # draft-light, and the nightly that runs everything a PR skips.
      - name: ci, checks and images run no heavy job on a pull request
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-ci-draft-gate.py
      # Blobless is mandatory (owner 2026-11-03): every full-history checkout
      # sets `filter:` with blob:none. The full clone still works, so dropping
      # the filter costs minutes per job and fails nothing else.
      - name: full-history checkouts are blobless
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-ci-blobless.py
      # `ci` and `checks` are the checks the main ruleset requires
      # (gd-UqzOTRj6cX). Guards that each aggregator needs every other job,
      # reports under its own name only on a ready run, and that its step
      # really fails on a failed or cancelled job (run on fixtures).
      - name: ci and checks aggregate every job under the required names
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-ci-required-checks.py
      # Main pushes share one concurrency group per workflow, and the path
      # gates diff a push against the newest earlier run that ran
      # (gd-RZopn9lf5I). Both halves fail silently: a per-sha key just costs
      # a full run per push again, and a lost base drops an evicted push's
      # changes from every path-gated job.
      - name: main pushes batch per workflow, and path gates cover evicted pushes
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 -S -E scripts/check-main-concurrency.py
      # controller-base costs 0.308 GB of paid egress per push (measured
      # 2026-10-20); a PR may push it only when a leaf in that run pulls it.
      - name: images.yml pushes only what is consumed
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-image-registry.py
      # The ci runner pods seed Go into the node-local GitHub tool cache, so
      # `setup-go` finds it instead of re-downloading 243 MB per job -- it was
      # 8.8% of all pool cpu-seconds, the 4th largest consumer, measured over
      # 99 steps. Both ways that stops working are SILENT: the pin drifting
      # away from GO_VERSION, and the RUNNER_TOOL_CACHE env being dropped so
      # the seed is written and then ignored. Neither reds anything; CI just
      # quietly costs 8.8% more, which is the same shape as the bug it fixes.
      # It also holds every go.work/go.mod go line at or below the agent
      # image's Go: the image sets GOTOOLCHAIN=local, so a line above it fails
      # every go command on every crew pod (gd-auZ6V08nR1).
      - name: the Go tool-cache seed matches GO_VERSION
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-go-toolcache-pin.py
      # The security-poison self-test hard-requires gitleaks on PATH
      # (POISON_REQUIRE_GITLEAKS=1); same pin as the security job.
      - name: gitleaks (for the poison self-test)
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e; . gardenio/locks/security-tools.lock; mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_X86_64}  /tmp/gitleaks.tgz" | sha256sum -c - || { echo "::error::bump GITLEAKS_SHA256_* in gardenio/locks/security-tools.lock with GITLEAKS_VERSION"; exit 1; }
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
      - name: script self-tests

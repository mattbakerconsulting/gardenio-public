          # test's output printed whole when it ends (gd-EkMsUldjkA). Serially the
          # list hit the 20-minute job timeout on main with every test green.
          # The tests are independent: each builds its fixtures under mktemp.
          python3 scripts/run-selftests.py --jobs 4 <<'EOF'
          # A GREEN SELF-TEST IS NOT COVERAGE: a *_test* file builds its own
          # fixture, so it proves a guard's logic, not that the guard is applied
          # to this tree. check-advice-snapshot-freshness works and fails on main
          # (fixture past its 14d ceiling); it is unwired here and its in-tree
          # twin is `-skip`ped in ci.yml (gd-ucK8JnJAXZ).
          bash scripts/bootstrap-ec2_test.sh
          python3 scripts/build-geo-table_test.py
          python3 scripts/check-advice-snapshot-freshness_test.py
          python3 scripts/check-gardener-prompt-drift_test.py
          python3 scripts/check-controller-base_test.py
          python3 scripts/check-k3s-audit-policy-order_test.py
          python3 scripts/check-sigpipe-producers_test.py
          bash scripts/ci-fetch-verified_test.sh
          bash scripts/quarantine_test.sh
          python3 scripts/coverage/normalize-paths_test.py
          python3 scripts/edge-probe/edge_probe_test.py
          python3 scripts/support-forward/support_forward_test.py
          python3 scripts/uptime-probe/uptime_probe_test.py
          python3 scripts/grade_staleness_probe_test.py
          bash scripts/inbox/acceptance-smoke_test.sh
          bash scripts/k3s/kubectl-ssm_test.sh
          python3 scripts/inbox/build-oci-archive_test.py
          python3 scripts/inbox/refresh-airgap-pins_test.py
          bash scripts/inbox/tarboat-file-regressions_test.sh
          bash scripts/inbox/tarboat-provision-box_test.sh
          bash scripts/inbox/tarboat-validate_test.sh
          bash scripts/lint-deploy-values-deletion_test.sh
          bash scripts/lint-mr-proof_test.sh
          bash scripts/lint-public-strings_test.sh
          bash scripts/lint-trust-dossier_test.sh
          bash scripts/metrics/one-pager_test.sh
          python3 scripts/model-ab-compare_test.py
          python3 scripts/opus5-ab_test.py
          python3 scripts/plan-badge-backfill_test.py
          python3 scripts/plan-badge-legibility_test.py
          python3 scripts/plan-badge-tier0_test.py
          bash scripts/security/gitleaks-history_test.sh
          bash scripts/security/check-secret-last-applied_test.sh
          python3 scripts/security/lint-kubectl-apply-secret_test.py
          bash scripts/security/probe-imds-unreachable_test.sh
          python3 scripts/security/check-security-md_test.py
          bash scripts/tarboat/assemble-tarboat_test.sh
          python3 scripts/worker-epoch_test.py
          python3 scripts/workflow-changed-jobs_test.py
          bash gardenio/scripts/machine-principal-canary_test.sh
          bash gardenio/scripts/lands-fence-matrix_test.sh
          bash gardenio/scripts/land-door-verify_test.sh
          bash gardenio/scripts/release-cut_test.sh
          bash gardenio/scripts/release-deploy_test.sh
          bash gardenio/scripts/release-deploy-record_test.sh
          bash gardenio/scripts/release-deploy-edge_test.sh
          bash gardenio/tests/e2e/scripts/run-shard_test.sh
          # Onboarding: hermetic (stubbed kd/gb/go, temp HOME), plus the old
          # skew tests and the syntax/hooks lint (gd-9pgoX3eeEN).
          bash scripts/onboard_test.sh
          bash scripts/gardenio-version_test.sh
          bash scripts/lint-onboarding.sh
          # Reachability tooling (gd-Nd2ciHTvTE). Its deadcode.sh fixture skips
          # here (nothing installs deadcode on this job); reachability.yml runs
          # the real thing.
          bash scripts/reachability/reachability_test.sh
          # The ratchets (gd-d29n0m678l). Fixtures only; the live checks run in
          # quench (line budget) and lint-go (func caps, deadcode). Their real
          # golangci-lint and deadcode cases skip here: neither is installed.
          bash scripts/ratchets/line-budget_test.sh
          bash scripts/ratchets/deadcode-ratchet_test.sh
          python3 scripts/ratchets/func-baseline_test.py
          bash scripts/coverage/regen-baselines_test.sh
          # nullglob: the e2e scripts dir currently has no *_test.sh; without it
          # bash runs the literal pattern and exits 127.
          #
          # That glob has never matched anything and never will: this repo names
          # its e2e scripts `test-<thing>.sh`, not `<thing>_test.sh`. So the
          # ~220 scripts in that directory were reached by exactly one thing --
          # run-shard.sh, on the heavy pool, against a live cluster -- and the
          # 19 that run-shard.sh does NOT dispatch were reached by nothing at
          # all once 8a3eb29e deleted the RWX tasks their headers still name.
          # Censused 2026-09-22 (gd-xg0uQhRE0G); ten of them are hermetic,
          # green, and total 22.5s, so they are listed explicitly here. They run
          # in THIS job on the light pool: no new job, no new runner, no added
          # queue pressure.
          #
          # Four of them protect the CI cost machinery itself and had no CI
          # coverage while doing it: shard-isolation and shard-budget-guard hold
          # the shard partitioning and time budget the heavy pool spends against,
          # skip-visibility-lint is what stops a self-skipping module counting as
          # a pass (green-by-skip drives the re-runs), and hermetic-set-lint
          # keeps HERMETIC_MODULES hermetic so the shell-hermetic job can stay
          # off the heavy pool.
          #
          # NOT added, with reasons, so the omissions are not read as an
          # oversight: test-gvisor-{abort-races-completion,freeze-interrupt,
          # renudge-thaw,substrate-ready} exit 0 in under a second with no
          # cluster because they self-skip -- wiring them would manufacture
          # precisely the green-by-skip that skip-visibility-lint exists to
          # catch. test-claudeless-{scenario,multi-nudge}-isolated need a
          # `claudeless` binary this runner has no step to install.
          # test-litellm-budget-cap dies on an unbound LITELLM_URL instead of
          # skipping cleanly. test-concurrency-isolation is hermetic but RED on
          # main right now (18 e2e scripts invoke kubectl without declaring
          # NAMESPACE, which is the cross-namespace stomp it exists to prevent);
          # it gets wired by whoever fixes those 18, not before (gd-xg0uQhRE0G).
          # test-terraform-prewarm-cache passes but takes 39s and pulls
          # providers over the network.
          bash gardenio/tests/e2e/scripts/test-hermetic-set-lint.sh
          bash gardenio/tests/e2e/scripts/test-shard-isolation.sh
          bash gardenio/tests/e2e/scripts/test-shard-budget-guard.sh
          bash gardenio/tests/e2e/scripts/test-skip-visibility-lint.sh
          bash gardenio/tests/e2e/scripts/test-pf-supervisor.sh
          bash gardenio/tests/e2e/scripts/test-lib-retry.sh
          bash gardenio/tests/e2e/scripts/test-lib-kd-create.sh
          bash gardenio/tests/e2e/scripts/test-lib-outbox-rig.sh
          bash gardenio/tests/e2e/scripts/test-outbox-shape-selftest.sh
          bash gardenio/tests/e2e/scripts/test-lib-gvisor-forensics.sh
          bash gardenio/tests/e2e/scripts/test-lib-gvisor-node.sh
          bash gardenio/tests/e2e/scripts/test-lane-lib.sh
          # Not appended to the RWX list above: that list is provenance ("the
          # exact list the RWX test-scripts task ran"), so new tests go here.
          bash scripts/check-no-curl-pipe-shell_test.sh
          python3 scripts/check-ci-draft-gate_test.py
          python3 scripts/check-ci-blobless_test.py
          python3 scripts/check-no-pr-goldens_test.py
          python3 scripts/check-ci-required-checks_test.py
          python3 scripts/check-main-concurrency_test.py
          python3 scripts/check-ci-path-gates_test.py
          python3 scripts/check-image-registry_test.py
          python3 scripts/check-viewer-edge-groups_test.py
          python3 scripts/check-viewer-edge-groups.py
          # The >3MiB tracked-blob guard. It WAS wired under RWX (archive
          # ci.yml:3123-3124 runs both the self-test and the live guard) and
          # the Actions migration dropped it: until now line 427 above
          # shellcheck'd it and nothing executed it, so the thing it exists to
          # prevent -- a 1.55GB tip tree that crash-looped every agent pod on
          # the cold-start clone (ka-0000000431) -- had no gate at all.
          # Wiring it here rather than as its own job is deliberate: it runs on
          # this light-pool job, so no new job, no new runner, no added queue
          # pressure. It is affordable only as of this commit -- the live scan
          # was 19.5s of fork-per-file and is now 0.5s (self-test 1.1s); at the
          # old cost this step would have grown by ~40s.
          # The live scan moved to `quench` (gd-is2Nts83Ai): any file can trip
          # it, and this job is path-gated on PRs now.
          bash scripts/check-large-tracked-files_test.sh
          # The merge-conflict-marker guard (ka-0000001064), folded in from its
          # own `conflict-markers` job. That job claimed a MEDIUM runner on
          # every checks run -- measured over 40 runs: queue wait p50 9s / p90
          # 40s, job wall p50 63s / p90 106s / max 206s -- to run a scan that is
          # now 1s. Its last run before this change was 12s of job for 1s of
          # work: ~11s of set-up + checkout overhead on a 0.770-cpu tier. Here
          # it is ~1s on an 0.260-cpu job that is already checked out, and
          # `checks` claims one fewer medium runner per run.
          # The live guard was previously applied ONLY through case 8 of its
          # own self-test (the live-tree regression case), so trimming that
          # case as "redundant" would have silently ended the whole-tree scan
          # with nothing going red. It is invoked directly in `quench` now
          # (gd-is2Nts83Ai), which no path gate skips, so the coverage stays
          # explicit rather than incidental.
          bash scripts/check-merge-conflict-markers_test.sh
          # Every Go module is in go.work or has a make target (ka-0000008045).
          # Third guard in this file that RWX ran (archive ci.yml:3163-3164) and
          # the Actions migration left behind in the shellcheck list at line 428
          # without ever executing. It was recorded on 2026-09-23 as "reds on
          # main, cannot simply be wired" -- WRONG, and the way it was wrong is
          # the point: it walks the working DIRECTORY, so a nested git worktree
          # (.worktrees/, gitignored) made it report 8 real-looking FAILs naming
          # real module paths, while the same commit exported clean passed. CI
          # checks out a clean tree and would never have seen it. The guard now
          # prunes git-ignored paths and the pair costs 0.05s + 0.56s. The live
          # guard runs in `quench` (gd-is2Nts83Ai): a new go.mod anywhere can
          # red it.
          bash scripts/check-go-module-coverage_test.sh
          bash scripts/gvisor/freeze-thaw-rungs_test.sh
          bash scripts/gvisor/sentry-egress-check_test.sh
          bash scripts/gvisor/discriminating-restore-check_test.sh
          bash policy/kyverno/verify-image-signatures_test.sh
          # Terraform tree-freshness guard and its wrapper (gd-F0DwR8UEtV).
          # Both build real git fixtures under mktemp: no network, no AWS, and
          # no terraform -- the wrapper test stubs terraform on PATH precisely
          # so it can assert terraform is NEVER invoked when the guard refuses,
          # which is the wiring bug (`guard || true`) that the guard's own
          # tests cannot see.
          bash scripts/check-tf-tree-freshness_test.sh
          bash scripts/tf-gardenio_test.sh
          bash scripts/check-tf-no-secret-version-data_test.sh
          # GitHub App manifest/JWT/SSM helper. Guards the D4 two-App split: if the
          # agents App ever acquires `administration`, this reds CI rather than
          # shipping a credential every agent pod mounts that can also delete
          # runners and manage collaborators. Needs openssl; no network, no AWS.
          python3 gardenio/scripts/github-app-register_test.py
          # The runner-loss classifier in retry-lost-runners.yml. It is inline
          # JS in a github-script step, so it has no harness of its own, and it
          # has been wrong about the annotation shape twice -- most recently by
          # assuming a drained runner always leaves "The operation was
          # canceled.", which dropped three real reclaims including one on a
          # push to main. Fixtures are real API annotation text; no network.
          python3 scripts/check-retry-lost-runners-gate_test.py
          # The Go tool-cache pin guard. Fixtures are synthetic trees under
          # GARDENIO_ROOT; the last cases run it against the REAL tree, which
          # is what proves its two file lists still name files that exist --
          # a guard whose inputs were all renamed reports "no problems" in the
          # same words as a clean one unless it counts what it read.
          python3 scripts/check-go-toolcache-pin_test.py
          # The CI minutes meter (gd-90WJgUqpz1). Every phase of the CI minutes
          # plan (gd-WFMvg9sDKE) quotes its saving from this script, so the
          # test pins the arithmetic with fixtures, including a positive
          # control day whose total must come out exactly. No network.
          python3 scripts/ci-minutes_test.py
          # The Codex CLI installer for the agent image (gd-HaGrzg53TS). This is
          # the ONLY pull-request execution install/codex.sh ever gets: the
          # `agent` image is dropped from the images.yml matrix on
          # `pull_request` (release-only, gd-9mtwbE3hoK), so without this a
          # wrong arch mapping, a mis-wired digest variable or a wrong tar
          # member name would first surface while cutting a release tag. The
          # tests stub `curl` and build a synthetic release tarball, so there is
          # no network and no 100MB download; ~1s.
          bash gardenio/images/agent/install/codex_test.sh
          # Same for the Gemini CLI bundle installer (ADR 0005 phase 0).
          bash gardenio/images/agent/install/gemini_test.sh
          # And the agent image's post-build tool + TMPDIR check (gd-hZl1cKiELM).
          bash gardenio/images/agent/smoke_test.sh
          # And pg-scratch, the agent's throwaway pgvector Postgres
          # (gd-ELlwvze8G3). Runners have no Postgres server, so only the
          # refusal cases run here; the live cases skip. <1s.
          bash gardenio/images/agent/pg-scratch_test.sh
          POISON_REQUIRE_GITLEAKS=1 bash scripts/security/security-poison-selftest.sh
          EOF
      - name: IMDS is unreachable from a runner pod (P7 Task 7)
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/security/probe-imds-unreachable.sh
      - name: SECURITY.md wording (P7 Task 8)
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/security/check-security-md.py SECURITY.md

  # REMOVED 2026-09-23: `conflict-markers` (RWX: lint-merge-conflict-markers).
  # The self-test runs in `script-selftests` above -- see the comment there for
  # the measurement -- and the live guard in `quench` (gd-is2Nts83Ai). A dedicated MEDIUM job made sense while
  # the scan cost 21-185s; at 1s it was ~11s of set-up + checkout overhead and
  # a whole runner claim per checks run for one second of work.
  # NOTE for anyone restoring it: the guard's own help text used to begin a
  # line with the opener sigils and tripped its own scan; it is reworded, so do
  # not reintroduce that shape.

  terraform:
    name: terraform fmt + validate + module tests
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s-medium # medium ARC scale set (gardenio/helm/ci) -- short CPU-bound jobs, no docker; see arc-runners-medium-values.yaml
    timeout-minutes: 20
    # RWX: test-terraform-roots (fmt -check + validate). The composition tests
    # that needed canonical-prod / monorepo-protect roots are D rows below.
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: terraform fmt + validate + module tests
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running terraform fmt + validate + module tests"
      # setup-terraform unzips the release; the runner image has no unzip.
      - run: sudo apt-get update -q >/dev/null && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends unzip
        if: steps.superseded.outputs.superseded != 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.superseded.outputs.superseded != 'true'
        # wrapper off: the node wrapper it installs was not found on PATH in the
        # runner pod (exit 127); the plain binary in the tool cache is enough.
        with: { terraform_version: "1.16.2", terraform_wrapper: false }
      - run: terraform fmt -check -recursive gardenio/terraform
        if: steps.superseded.outputs.superseded != 'true'
      # INV-4 of the deleted edge-auth secret guard (PR #1681): no
      # `data "aws_secretsmanager_secret_version"` anywhere under the tree,
      # which would put the decrypted secret in state (ka-0000002892). Its
      # self-test runs in script-selftests.
      - name: no Secrets Manager version data source in terraform
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/check-tf-no-secret-version-data.sh
      - if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e
          for d in gardenio/terraform/composition/gardenio gardenio/terraform/modules/k3s gardenio/terraform/modules/network gardenio/terraform/modules/finops gardenio/terraform/modules/edge-probes gardenio/terraform/modules/infra-aws-readonly gardenio/terraform/modules/ses-identity gardenio/terraform/modules/ses-support-inbound; do
            echo "== $d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done
      # Mock-provider tests (command = plan): no cloud credentials, no apply.
      - name: edge-probes module tests
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/modules/edge-probes && terraform init -backend=false -input=false >/dev/null && terraform test
      - name: infra-aws-readonly module tests
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/modules/infra-aws-readonly && terraform init -backend=false -input=false >/dev/null && terraform test
      - name: ses-identity module tests
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/modules/ses-identity && terraform init -backend=false -input=false >/dev/null && terraform test
      - name: ses-support-inbound module tests
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/modules/ses-support-inbound && terraform init -backend=false -input=false >/dev/null && terraform test
      - name: k3s module tests (edge / ziti flag split, ECR read grant, node policy free of launch templates)
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/modules/k3s && terraform init -backend=false -input=false >/dev/null && terraform test
      - name: network module tests (NAT placement, route flip)
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/modules/network && terraform init -backend=false -input=false >/dev/null && terraform test
      - name: composition tests (ECR CI roles trust the immutable OIDC subject)
        if: steps.superseded.outputs.superseded != 'true'
        run: cd gardenio/terraform/composition/gardenio && terraform init -backend=false -input=false >/dev/null && terraform test

  helm:
    name: helm lint + chart tests
    needs: changes
    # Fail open -- see the `changes` job header.
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       startsWith(github.ref, 'refs/tags/') ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.helm == 'true')
    # No run-wide supersession conjunct here, deliberately: this job is
    # path-gated per push, so a newer run need not run it. Its in-job
    # re-check passes `job:` instead -- see the `supersession` job.
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    # DEMOTED to the medium tier 2026-09-22, on the measurement its own probe
    # was added to take (see the TEMPORARY DIAGNOSTIC note below, which
    # pre-registered "if the memory fits, moving this down is both a slot
    # freed and a step made faster"). It fits, with room:
    #
    #   helm-after-chart-tests   peak 2367Mi   ANONMAX 971Mi   limit 4096Mi
    #
    # anonmax is the decision number, not peak -- peak counts reclaimable page
    # cache, and most of this job's peak IS page cache from untarring three
    # tool releases. 4.2x headroom on the number that can actually OOM.
    # It needs no dind (no docker/buildx/kind/k3d/services: anywhere in the
    # job), and medium carries GOCACHE/GOMODCACHE on /cache, which is what the
    # 214s `GOWORK=off go test ./...` step wants.
    runs-on: gardenio-k3s-medium # ARC scale set on the k3s CI pool (gardenio/helm/ci)
    timeout-minutes: 20
    # RWX: lint-helm, test-helm. The old "64 chart tests fail" debt
    # (gd-Il0jwnzCMT, gd-wzxRDryYsR) is gone: both the dead-deploy-values-
    # overlay tests and the canonical-prod-Terraform-dependent tests were
    # deleted, not skipped — see .github/known-failures.md and
    # gardenio/helm/gardenio/tests/README.md.
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: helm lint + chart tests
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running helm lint + chart tests"
      - uses: actions/setup-go@v5
        if: steps.superseded.outputs.superseded != 'true'
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      # A duplicate mapping key in a values file is last-key-wins in helm, with
      # no error: PR #308 (branched before #324) merged a second top-level
      # `beads:` into deploy-values/gardenio-k3s.yaml without a git conflict and
      # would have dropped beads.machineClients, breaking the live /costs fix.
      # yaml.v3 keeps both key nodes, so this test names every repeat as
      # file:line at any depth, over deploy-values/*.yaml and the chart values
      # files, and carries a planted-duplicate positive control. It also runs in
      # `chart tests` below; it is first here so a bad merge fails in seconds,
      # before the helm/yq/promtool installs. Gated by the `helm` path filter.
      - name: values files have no duplicate keys
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          cd gardenio/helm/gardenio/tests
          GOWORK=off go test -count=1 -run 'TestValuesFilesHaveNoDuplicateKeys|TestFindDuplicateKeys|TestValuesDuplicateKeyCheckFailsOnPlantedFile' .
      # NOTHING IS PREINSTALLED on the ARC runner pod. This job used to die at
      # `helm: command not found` in under 20 seconds, and because the repo has
      # no branch protection that never blocked a merge — it just made the
      # check permanently red, which is worse than blocking: a real helm-lint
      # regression is indistinguishable from the tool being absent.
      # The chart tests additionally shell out to yq and promtool
      # (gardenio/helm/gardenio/tests), so all three have to be here.
      - name: install helm, yq, promtool
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          # helm's and promtool's pins are shared with the agent image, so a
          # crew's local `make test-helm` runs the versions this job does.
          . gardenio/images/agent/install/versions.env
          . gardenio/images/agent/install/checksums.env
          HELM_VER="v${HELM_VERSION}"; YQ_VER=v4.44.3; PROM_VER="${PROMTOOL_VERSION}"
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/helm.tgz \
            "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz"
          echo "${HELM_SHA256_AMD64}  /tmp/helm.tgz" | sha256sum -c -
          tar -xzf /tmp/helm.tgz -C /tmp linux-amd64/helm
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64"
          sudo chmod 0755 /usr/local/bin/yq
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VER}/prometheus-${PROM_VER}.linux-amd64.tar.gz" \
            | tar -xz -C /tmp "prometheus-${PROM_VER}.linux-amd64/promtool"
          sudo install -m 0755 "/tmp/prometheus-${PROM_VER}.linux-amd64/promtool" /usr/local/bin/promtool
          helm version --short && yq --version && promtool --version
      # The land door's real-nginx tests (TestPublicEdgeNginx_*, D.18a
      # gd-WTyoLCSMUp) run public-edge.yaml's api.clonk.tv block in nginx, and
      # under GitHub Actions fail rather than skip without one. The debs are
      # unpacked, not installed, so no nginx service starts on the runner.
      # nginx-core carries the binary on Ubuntu 22.04, nginx on 24.04.
      - name: install nginx (land door edge tests)
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          cd /tmp
          apt-get download nginx
          apt-get download nginx-core 2>/dev/null || true
          for d in /tmp/nginx*.deb; do dpkg-deb -x "$d" /tmp/nginx-root; done
          /tmp/nginx-root/usr/sbin/nginx -V 2>&1 | grep http_auth_request_module >/dev/null
          echo "EDGE_NGINX=/tmp/nginx-root/usr/sbin/nginx" >> "$GITHUB_ENV"
      # TEMPORARY DIAGNOSTIC -- see .github/actions/peak-memory. This job is
      # the strongest demotion candidate after `security`: 2316s of heavy slot
      # time over 40 runs, and 214s of its 232s average is the ONE step below,
      # a `GOWORK=off go test ./...`.
      #
      # HALF OF THIS PREDICTION WAS WRONG, and the demotion was taken anyway.
      # The sentence that stood here claimed the move would be "both a slot
      # freed and a step made faster", because `go test` "is precisely the
      # workload the medium tier's node-local GOCACHE now serves (it gained
      # /cache in b689d995)". The slot is freed. The step is NOT faster:
      #
      #   tier     total   chart-test step
      #   medium    296s       272s        (first run after the demotion)
      #   heavy     172-284s   157-264s    (five preceding runs, median 189s)
      #
      # A node-local hostPath cache is worth ~nothing on this pool -- measured
      # separately at 0 hits in 4 runs across 5 distinct nodes, because spot
      # nodes are routinely minutes old and a cache keyed to a node rarely
      # meets a second job. That measurement predates this comment, so the
      # GOCACHE half of the argument was never sound. The real cause of the
      # stretch is contention: cpuavg measured 1384m against this tier's 750m
      # request, with no CPU limit to stop it but other runners to share with.
      #
      # That is the documented medium-tier trade, not a regression: ~100s of
      # duration against a p90 queue wait of 1205s on heavy. n=1 so far, and
      # one heavy run did hit 284s, so treat the exact gap as provisional --
      # but do not re-argue the cache. Keep two probes, not one: the reset
      # the curl/tar tool installs from the Go test compile, because they are
      # different arguments -- a big number from the installs would be page
      # cache from untarring, a big anon number from the compile would not be.
      - run: helm lint gardenio/helm/gardenio/
        if: steps.superseded.outputs.superseded != 'true'
      # Release-record size guard (gd-qiUiXvTX0k). Helm stores the whole
      # packed chart + rendered manifest in one Secret capped at 1 MiB, and
      # release 2026.292.1 failed there with every later release blocked. This
      # packs the chart exactly as release-deploy.sh does, renders it with
      # deploy-values, rebuilds the release record and fails over 900 KiB, so
      # the creep is caught on the PR. ~2s. Runs the new strip/generator
      # script tests first: they are what keep the pack render-safe.
      - name: release record stays under 900 KiB
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          python3 scripts/strip-helm-yaml-comments_test.py
          python3 gardenio/scripts/keycloak-theme-configmap_test.py
          bash scripts/pack-gardenio-chart_test.sh
          bash scripts/check-helm-release-size.sh
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: helm-before-chart-tests, reset: "true" }
      # `-timeout` is NOT optional here. Without it `go test` applies its own
      # 10-minute default, which is INVISIBLE in this file and sits BELOW the
      # job's `timeout-minutes: 20` above -- so the tighter of the two ceilings
      # was the one nobody chose. That was slack until a5a6647 demoted this job
      # to the medium tier; the suite now straddles 10m on node contention and
      # panics at random. Measured on main, not on a branch diff: 16:47Z
      # success in 5m45s, 17:51Z `panic: test timed out after 10m0s` -- same
      # commit range, same code, opposite outcomes (gd-dnk0zE75rw). A red check
      # on a green diff is worse than a slow one: it sends whoever opened the
      # PR back to re-diagnose a change that was fine.
      #
      # 18m keeps a real hang failing, and keeps it failing INSIDE the job so
      # the panic stack names the stuck test, rather than the runner killing
      # the step at 20m with nothing to read. Raise `timeout-minutes` first if
      # you raise this.
      - name: chart tests
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          cd gardenio/helm/gardenio/tests
          GOWORK=off go test -timeout 18m ./...
      # The ziti overlay is its own chart, off by default; this proves it still
      # renders, and renders nothing, until ziti.enabled=true.
      - name: ziti overlay render tests
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          helm lint gardenio/helm/ziti/
          bash gardenio/helm/ziti/tests/render_test.sh
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: helm-after-chart-tests }

  # ── SPLIT OUT OF `security` 2026-09-22 ─────────────────────────────────────
  # gitleaks does not belong on the heavy tier and never did. It was there only
  # because it shared a job with govulncheck. The four peak-memory probes on
  # that job exist precisely to tell those two apart ("If one tool drives it,
  # splitting this job moves the other two down"), and over 20 runs they do,
  # unambiguously. anonmax is the decision number, NOT peak -- see
  # .github/actions/peak-memory for why peak is only a one-sided test:
  #
  #   probe               peak med   ANONMAX med   max seen   fits medium 4Gi?
  #   security-baseline      1272Mi         78Mi      103Mi   yes
  #   after-gitleaks         1272Mi        240Mi      263Mi   YES -- 15x headroom
  #   after-govulncheck      8354Mi       7028Mi     7563Mi   NO  -- 1.7x over
  #   after-osv              8354Mi       7028Mi     7563Mi   see below
  #
  # ONE tool drives the whole job's tier. gitleaks moves down here; govulncheck
  # stays heavy and is why that job stays heavy.
  #
  # osv-scanner is NOT proven either way, and is deliberately left on the heavy
  # job rather than moved on a guess. `reset` reads `unsupported` on these
  # nodes, so anonmax is a running maximum that never resets -- after-osv ==
  # after-govulncheck therefore means only that osv never exceeded govulncheck's
  # watermark. Its own footprint is MASKED, not measured as zero. It is also 2s
  # of a 106.5s job, so there is nothing to win by guessing at it.
  #
  # What the split buys, from 13 runs of step timings: gitleaks 30.8s,
  # govulncheck 54.2s, osv 1.7s, checkout+setup-go+tools 15.9s. Moving gitleaks
  # takes ~31s of heavy occupancy (~30% of this job) off EVERY push -- the job
  # is ungated, so that is every push -- from a tier measured pinned at its cap
  # 65% of the time onto one measured averaging 1.53 of 6.
  #
  # The medium copy costs MORE wall-clock than it did on heavy, and the first
  # post-split run measured it: 99s total, of which the scan step alone was
  # 86s against 30.8s on heavy -- ~2.8x slower under medium's 750m cpu share.
  # (An earlier revision of this comment estimated ~39s by assuming the scan
  # ran at heavy speed. That was wrong; this is the measured number.) It is
  # still the right trade: 8s queue wait against a heavy tier that had every
  # one of its 10 slots busy and 11 jobs still queued in that same run, so the
  # gitleaks verdict landed ~26 minutes earlier than it would have. The medium
  # tier was idle, so those 99s cost nothing anyone was waiting on.
  #
  # Note what does NOT follow: the heavy job is not made cheap, it is made
  # ~30% shorter. A job's TIER is set by its heaviest step; its slot COST is
  # tier x duration. Conflating the two is what previously read as "not worth
  # splitting" -- see gardenio/helm/ci/README.md, corrected there.
  #
  # gitleaks is also the only reason this job was ungated -- "a docs-only commit
  # is not a commit they can skip" is a statement about a secret scanner, not
  # about a Go vulnerability scanner.
  #
  # NOT done here, on purpose: path-gating the remaining heavy job to Go
  # changes. That looks free once gitleaks is gone and it is not -- govulncheck's
  # verdict depends on the upstream vulnerability database, which moves WITHOUT
  # the tree, so a Go-gated job goes stale on a quiet week and the staleness is
  # invisible. That is a coverage tradeoff, not a placement change, so it is
  # filed rather than taken. (gd-yee312IdGD took it for PRs only; it went
  # with every heavy PR job in gd-19ECZxvFQw and gd-whdmfznixO.)
  #
  # ON A PULL REQUEST IT SCANS ONLY THE PR'S COMMITS (gd-5iGDOjVCl7). The walk of
  # all ~7000 commits was 46-196s of a 65-240s job, sampled over 5 PR runs, and
  # every one of those commits other than the PR's own had already been scanned
  # on main. GITLEAKS_LOG_OPTS=origin/<base_ref>..HEAD narrows it; HEAD is the
  # PR's merge ref, so the range is the PR's commits plus that merge commit,
  # whose own diff `git log -p` does not show. Push, schedule, dispatch and tag
  # runs set nothing and keep the full-history scan, which is still where a
  # secret that reached main by any other road gets found.
  #
  # The verdict changes with the scope. On the full history a finding stays
  # advisory: the ~50 known fixture findings already there would red every run.
  # In a PR's range those are out of scope, so a finding there is a secret THIS
  # PR adds, and it fails the job. The positive control is the real-gitleaks
  # cases in scripts/security/gitleaks-history_test.sh (a planted fake key in
  # the range is caught, one only in the base is not); the `scripts` job runs it.
  #
  # The name keeps "history" and "advisory" because the ci-minutes baseline
  # (gardenio/docs/ci-minutes/) matches on it; renaming it would break the
  # before/after comparison this change is measured by.
  gitleaks:
    name: gitleaks history (advisory, as in RWX)
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s-medium # medium ARC scale set (gardenio/helm/ci) -- 750m cpu request and NO cpu limit, 1Gi/4Gi memory, no dind sidecar. gitleaks touches none of docker and peaked at 263Mi across 20 runs.
    timeout-minutes: 20
    # Its own displacement group, for the same reason and with the same measured
    # effect as `security`'s (see the long note there): this job is ungated, so
    # a newer instance scans the newer tip -- the whole history on main, the
    # PR's current commits on a PR -- and a superseded instance can be dropped
    # with no loss for what can still merge. A commit a force-push dropped from
    # the PR goes unscanned, and it cannot land. A SEPARATE key from `security`'s -- sharing one would make
    # the two jobs displace each other, which is not what either wants.
    concurrency:
      group: checks-gitleaks-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        # load-bearing: gitleaks detect walks history and SILENTLY no-ops on a shallow clone -- that silent mode is what gitleaks-history.sh's rc=2 coverage gate exists to catch.
        # On a PR it is also what fetches origin/<base_ref>, the bottom of the scanned range.
        # Blobless on a PR (owner 2026-11-03, scripts/check-ci-blobless.py): the full clone had grown to 227-548 s against a
        # ~1 s range scan; blob:none is 15 MB/4 s with every commit and tree, and git fetches only the range's blobs. The
        # full-history scan (nightly, tag, push, dispatch) reads every blob, so it keeps the full clone ('' = no filter).
        with:
          fetch-depth: 0
          filter: ${{ github.event_name == 'pull_request' && 'blob:none' || '' }}

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: gitleaks history (advisory, as in RWX)
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running gitleaks history (advisory, as in RWX)"
      # Baseline probe -- starts the anon sampler. See the identical note on
      # `lint-go`: a single end-of-job probe cannot report an anon high-water
      # mark, because it is the thing that seeds the sampler. This job's
      # confirmation reading said `samp=started anonmax=62Mi anon=62Mi`, which
      # measured nothing about the step in between.
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: gitleaks-medium-baseline }
      # No setup-go here, deliberately. gitleaks is a prebuilt release tarball
      # and scripts/security/gitleaks-history.sh shells out to exactly two
      # binaries, git and gitleaks (verified with comments stripped). Dropping
      # setup-go also drops the latent shared-GOCACHE upload trap documented on
      # `security` below, rather than copying it into a second job.
      - name: gitleaks (pinned)
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e; . gardenio/locks/security-tools.lock; mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_X86_64}  /tmp/gitleaks.tgz" | sha256sum -c - || { echo "::error::bump GITLEAKS_SHA256_* in gardenio/locks/security-tools.lock with GITLEAKS_VERSION"; exit 1; }
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks
      - name: gitleaks history (coverage is the gate)
        if: steps.superseded.outputs.superseded != 'true'
        env:
          # Empty except on a pull_request; see the note above the job. Passed
          # through env, not spliced into the script, as base_ref is a branch name.
          GITLEAKS_LOG_OPTS: ${{ github.event_name == 'pull_request' && format('origin/{0}..HEAD', github.base_ref) || '' }}
        run: |
          set +e; bash scripts/security/gitleaks-history.sh; rc=$?
          [ "$rc" = 2 ] && { echo "::error::gitleaks history coverage failure"; exit 1; }
          [ "$rc" = 1 ] && [ -n "$GITLEAKS_LOG_OPTS" ] && { echo "::error::gitleaks found a secret in this PR's commits ($GITLEAKS_LOG_OPTS). Remove it from the branch's history; a later commit deleting it does not. A false positive goes in .gitleaks.toml's allowlist."; exit 1; }
          [ "$rc" = 1 ] && echo "::warning::gitleaks found secrets in history (advisory, pre-existing fixture debt)"; exit 0
      # TEMPORARY DIAGNOSTIC -- one probe, to confirm the demotion holds WHERE IT
      # NOW RUNS rather than only where it was measured. The 240Mi above was read
      # on a heavy pod; this re-reads it on a medium one. Delete with the others.
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: gitleaks-medium }

  security:
    name: govulncheck + osv (advisory, as in RWX)
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s # ARC scale set on the k3s CI pool (gardenio/helm/ci) -- STAYS heavy: govulncheck's anonmax is 7028Mi median / 7563Mi max against medium's 4Gi limit. See the gitleaks job above for the measurement.
    timeout-minutes: 25
    # ── ONE OF THESE PER BRANCH, NOT ONE PER COMMIT ────────────────────────────
    #
    # Measured 2026-09-22 03:05Z: 34 jobs queued on the heavy pool, every single
    # one labelled `gardenio-k3s`, while medium sat at 0/6 and light at 1/10.
    # 26 of the 34 belonged to nine pushes to main whose shas were ALREADY
    # ancestors of the main tip -- superseded before their first runner started.
    # Ten of those 26 were this job, one per superseded push. That is the single
    # largest identifiable block in the queue, and raising the ceiling does not
    # touch it: ci_max_nodes went 8 -> 11 and heavy maxRunners 7 -> 10 forty
    # minutes earlier (e8966662) and heavy was pinned at 10/10 within seconds.
    #
    # The run-level `concurrency:` above cannot fix this, and should not: it is
    # keyed per-SHA on push so that nothing supersedes anything, which is right
    # for this workflow's four PATH-GATED jobs. Their gate diffs one push at a
    # time, so an older sha's `cargo audit` is genuinely not redone by a newer
    # run that skipped it -- the same reason retry-lost-runners.yml exempts
    # `images` from its staleness guard. Cancelling those would lose coverage.
    #
    # This job is the opposite case. It is UNGATED and whole-repo by design
    # (see the `changes` header: "a docs-only commit is not a commit they can
    # skip"), and it runs with fetch-depth: 0. So a newer run's instance scans
    # a strict superset of an older one's: same tree plus the commits after it.
    # A superseded instance can therefore be dropped with ZERO coverage loss,
    # which is exactly the judgement retry-lost-runners.yml already applies to
    # the same runs -- it SKIPS retrying a main push whose branch has moved on,
    # calling it "pure queue load ... worst precisely during the churn storms".
    # That policy was only ever enforced on the retry path. This enforces the
    # same policy one layer earlier, on the first attempt.
    #
    # WHY cancel-in-progress IS FALSE. It looks like the weaker setting and it
    # is the deliberate one. With it false, jobs in the group QUEUE instead, and
    # GitHub keeps at most one PENDING job per group -- a newer pending job
    # displaces the older. A burst of ten pushes therefore costs 1 running + 1
    # pending = 2 slot-claims instead of 10, which is 8 of the 9 available, and
    # it buys that without ever killing work already in flight. Two reasons that
    # matters more than the last claim:
    #   1. A cancelled in-flight job has already paid its pod start, its
    #      checkout at fetch-depth 0 and part of its scan. Those slot-seconds
    #      are spent either way; letting it finish converts them into a verdict.
    #   2. `cancelled()` is a RUN-level function, and lint-go / helm /
    #      cargo-security all begin `!cancelled()`. Whether a job cancelled by
    #      job-level concurrency trips its siblings' `!cancelled()` was not
    #      measured when this landed. If it does, killing this job would skip
    #      the three path-gated jobs in the same run -- reintroducing the
    #      coverage loss above through a side door. Displacing a job that never
    #      started cannot have that effect.
    #
    # ── MEASURED 2026-09-22: IT WORKS, AND IT IS FREE ──────────────────────────
    # Over 33 recent push runs this group cancelled 9 instances of this job, and
    # all nine cost ZERO heavy slot-seconds: every one has `runner_name` empty,
    # `steps_ran` 0, and `started_at` exactly equal to `created_at`. They were
    # displaced out of the pending slot, never scheduled. The chain is textbook
    # -- each cancellation's completed_at is the next one's created_at
    # (03:12:03 -> 03:16:50 -> 03:19:29 -> 03:22:22 -> 03:28:00) -- so a burst
    # of nine pushes really did collapse to 1 running + 1 pending.
    #
    # Beware the arithmetic trap this creates: on a cancelled job that never got
    # a runner, `completed_at - started_at` is TIME IN THE PENDING SLOT, not slot
    # consumption. Summing it reads as 18 wasted heavy minutes here when the true
    # figure is zero. Check `runner_name` before costing any cancelled job.
    #
    # Reason 2's worry also did not materialise: in all nine runs the siblings
    # behaved normally -- the three ungated whole-repo jobs all `success`, the
    # path-gated ones `skipped` by their own gate. So displacement does not trip
    # `!cancelled()`. That was the stated blocker on extending this pattern, and
    # it is now answered for the displacement mode, which is the only mode in
    # use here (cancel-in-progress is false). A job KILLED in flight remains
    # unmeasured, because nothing kills one.
    #
    # EXTENDING IT ANYWAY IS NOT WORTH DOING, on separate evidence: the three
    # path-gated heavy jobs barely run. In the same 33-run sample `helm` ran ONCE
    # against 19 skips (4.7 heavy min total), `cargo audit + deny` once against
    # 19 (0.3 min), and golangci-lint three times (1.1 min). A displacement group
    # cannot recover queue load from jobs that are already skipped 19 times in 20;
    # the path gate got there first. The remaining prerequisite -- a group key
    # carrying the gate's own output, so a run whose gate said skip cannot
    # displace one whose gate said run -- stands unbuilt on purpose.
    # Do not extend it by symmetry; it is not symmetric, and it is not needed.
    #
    # The key mirrors the run-level block's shape on purpose: workflow_dispatch
    # and schedule key per run_id so a deliberate manual run or the nightly is
    # never made to wait behind (or be displaced by) a push, and `github.ref` keys PR runs to the PR (where the run-level group
    # already cancels supersedes, making this a no-op) and push runs to the
    # branch (where it is the whole point).
    concurrency:
      group: checks-security-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.ref }}
      cancel-in-progress: false
    # RWX: go-vuln, osv-scan (gitleaks is now the separate `gitleaks` job above
    # -- all three were ADVISORY in .rwx/ci.yml and remain so; the one blocking
    # condition, a gitleaks history-coverage failure at rc=2, moved with it).
    # Pins from gardenio/locks/security-tools.lock. Pre-existing: 59 OSV ids on
    # HEAD, red on the pristine tree (the 50 gitleaks fixture findings moved).
    #
    # fetch-depth: 0 below survived the split, but the reason CHANGED and the
    # concurrency note above is now worded for the job this used to be. Restated
    # for what it is today: govulncheck and osv-scanner read the TREE, not
    # history, so the supersession argument no longer rests on "a superset of
    # the history" -- it rests on the simpler fact that an advisory tree scan of
    # a superseded sha on a branch that has moved on has no consumer. Same
    # conclusion as retry-lost-runners.yml reaches for the same runs.
    #
    # It is kept anyway for two measured reasons, not by inertia. (1) It is
    # free: over 14 runs this fetch-depth-0 checkout averaged 3.6 s, the FASTEST
    # checkout step in the workflow -- faster than the shallow ones in
    # `changed-path gate` (5.2 s) and `shell guards` (5.1 s). Removing it saves
    # nothing. (2) Both scripts grow a history path the moment a target branch
    # is passed: each does `git merge-base` + `git worktree add --detach`. They
    # are called with "" today so that path is dead, but it is one argument away
    # from live, and it self-fetches only --depth=200. Blobless
    # (scripts/check-ci-blobless.py): the scanners read the checked-out tree,
    # which a blob:none checkout still has in full.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: blob:none }

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: govulncheck + osv (advisory, as in RWX)
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running govulncheck + osv (advisory, as in RWX)"
      # cache: false for the same reason as every other setup-go in this repo
      # -- the runner pod points GOCACHE/GOMODCACHE at a node-local hostPath
      # (gardenio/helm/ci) -- but here it closes a LATENT trap rather than
      # fixing a live cost, which is worth stating precisely.
      #
      # Today `cache: true` does nothing at all: setup-go hashes a root
      # `go.sum` to build its key, this is a multi-module repo with no root
      # go.sum, and the logs show `Restore cache failed: Dependencies file is
      # not found` followed by `Primary key was not generated` on the save.
      # Both halves no-op.
      #
      # What makes it worth changing anyway is what happens the day that stops
      # being true. setup-go asks `go env GOCACHE GOMODCACHE` and caches
      # whatever it is told -- which is now /cache/go-build and /cache/go-mod,
      # the directory every job on this node shares. So a root go.sum (or
      # someone adding `cache-dependency-path` to be helpful) would make this
      # step upload the node's entire multi-GB shared cache to the repo's
      # 10 GB Actions cache budget, and restore a stale archive over a warm
      # node cache on the way in. Verified 02:34Z: GOCACHE read back as
      # /cache/go-build inside this very job.
      - uses: actions/setup-go@v5
        if: steps.superseded.outputs.superseded != 'true'
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: tools (pinned)
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e; . gardenio/locks/security-tools.lock; mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" -o "$HOME/.local/bin/osv-scanner"; chmod +x "$HOME/.local/bin/osv-scanner"
          # The gitleaks download moved to the `gitleaks` job above with its
          # scan; this job no longer runs gitleaks, so installing it here would
          # be pure cost. The lock is still sourced whole -- it is a shell
          # KEY=VALUE file and GITLEAKS_VERSION simply goes unused here.
          #
          # osv-scanner is a prebuilt download and costs ~3 s; govulncheck is a
          # `go install` and is the rest of this
          # step. Same node-local bindir and same mandatory version guard as
          # lint-go -- see the long note there for why presence is not a
          # sufficient test once the bindir outlives the pod.
          #
          # The version is read with `go version -m`, which reads the module
          # stamp out of the binary. `govulncheck -version` would also print
          # it, but it contacts the vulnerability database to report the DB
          # timestamp, so it is neither offline nor free.
          BIN="${GOTOOLS_BIN:-$(go env GOPATH)/bin}"
          mkdir -p "$BIN"; echo "$BIN" >> "$GITHUB_PATH"
          # `|| true` for the same reason as in lint-go: this step runs under
          # `set -e`, and an absent binary must mean "install it", not "fail".
          have=$(go version -m "$BIN/govulncheck" 2>/dev/null \
                 | sed -n 's|^[[:space:]]*mod[[:space:]]*golang.org/x/vuln[[:space:]]*v\([0-9][0-9.]*\).*|\1|p') || true
          if [ "$have" != "$GOVULNCHECK_VERSION" ]; then
            echo "installing govulncheck $GOVULNCHECK_VERSION into $BIN (found: ${have:-none})"
            GOBIN="$BIN" go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
          else
            echo "govulncheck $have already present in $BIN"
          fi
      # TEMPORARY DIAGNOSTIC (4 probes, .github/actions/peak-memory) -- delete
      # them and that directory once the tier decision below is recorded.
      #
      # A single end-of-job probe already ran here and returned peak=7967Mi,
      # which killed the plan to demote this job to the medium tier (1Gi
      # request / 4Gi limit). These probes replace it because that one number
      # answered the wrong question twice over:
      #
      #  1. It is a WHOLE-JOB peak, so it says the pod touched 8Gi somewhere
      #     without saying which of gitleaks / govulncheck / osv-scanner did
      #     it. If one tool drives it, splitting this job moves the other two
      #     down; if all three do, the job stays heavy. Resetting the peak at
      #     each boundary is what tells those apart.
      #  2. cgroup memory.peak counts page cache, which is reclaimable, so
      #     7967Mi is an UPPER BOUND on what a 4Gi limit would OOM on, not a
      #     verdict. gitleaks reads every blob in history and osv-scanner
      #     walks the whole tree -- both generate exactly the kind of file
      #     cache that inflates this number without being unevictable. The
      #     probe now reports anon and file separately for that reason.
      #
      # Everything else about the demotion case is unchanged: 121s average, no
      # sustained CPU, and ungated by design (a secret in a markdown file is
      # what it exists to catch) so it runs on every push and holds a 3-CPU
      # slot on a tier that is pinned at its cap 65% of the time.
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: security-baseline, reset: "true" }
      # The `after-gitleaks` probe went with the gitleaks step. Its measurement
      # is recorded on the gitleaks job above; re-reading it here would only
      # re-measure a step this job no longer runs. `security-baseline` stays as
      # the floor and `after-govulncheck` remains the one that matters: the
      # 240Mi -> 7028Mi jump across this next step is the entire tier argument.
      - name: govulncheck
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set +e; export PATH="${GOTOOLS_BIN:-$(go env GOPATH)/bin}:$(go env GOPATH)/bin:$PATH"
          for mod in gardenio/controller kbeads; do GOWORK=off scripts/security/govulncheck-baseline.sh "$mod" ""; done; exit 0
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: after-govulncheck, reset: "true" }
      - name: osv-scanner
        if: steps.superseded.outputs.superseded != 'true'
        run: scripts/security/osv-baseline.sh ""
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: after-osv }

  cargo-security:
    name: cargo audit + deny (coop)
    needs: changes
    # Fail open -- see the `changes` job header.
    if: >-
      !cancelled() &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
       startsWith(github.ref, 'refs/tags/') ||
       needs.changes.result != 'success' ||
       needs.changes.outputs.coop == 'true')
    # No run-wide supersession conjunct here, deliberately: this job is
    # path-gated per push, so a newer run need not run it. Its in-job
    # re-check passes `job:` instead -- see the `supersession` job.
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    # DEMOTED to the medium tier 2026-09-22. The re-measurement this job's own
    # comment demanded ("the tier decision needs a RE-MEASUREMENT after this
    # change, not a re-reading of numbers taken from a job that no longer
    # exists in this shape") has been taken, on the baseline probe below:
    #
    #   cargo-security (end)   peak 2119Mi   ANONMAX 599Mi   limit 4096Mi
    #
    # 6.8x headroom on anon. The job is now 23-43s of wall clock holding a
    # whole 4-vCPU node, with a p90 queue wait of 1125s on this tier -- the
    # exact profile the medium tier was created for.
    #
    # THE CARGO_HOME QUESTION, SETTLED BY MEASUREMENT. The medium tier
    # deliberately sets no CARGO_HOME/RUSTUP_HOME ("no job on this tier needs
    # a Rust toolchain" -- now false, so that line is struck there too), and
    # the rustup step below falls back to $HOME/.cargo. On an ephemeral pod
    # that means re-installing toolchain 1.93.0 every run. The objection is
    # that this trades queue wait for a download -- but the heavy tier does
    # not avoid that download either. The step is guarded on
    # `[ ! -x "$CH/bin/rustup" ]`, so a warm CARGO_HOME would make it ~0s, and
    # it measured 11/15/20/19/10/15/15s across the last seven runs: seven
    # non-zero readings, no sub-5s outlier, no bimodality. The heavy tier's
    # /cache never holds rustup, because this pool puts a job on a different
    # spot node nearly every run (see gardenio/helm/ci/arc-runners-values.yaml
    # and the cargo-install measurement in this file's history). The toolchain
    # is ALREADY cold every run, so moving tiers costs nothing on that axis.
    runs-on: gardenio-k3s-medium # ARC scale set on the k3s CI pool (gardenio/helm/ci)
    timeout-minutes: 30
    # RWX: cargo-audit, cargo-deny, coop/.rwx audit + deny. Advisory in RWX.
    # Pins from the lock; installed with --locked into the runner's cargo home.
    defaults: { run: { working-directory: coop } }
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: cargo audit + deny (coop)
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running cargo audit + deny (coop)"
      # Baseline probe -- starts the anon sampler, which is what the "anonmax
      # is unusable here" note below was actually describing. See `lint-go`
      # for the mechanism and the proof it works when a job has two probes.
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: cargo-security-baseline }
      # An apt install of build-essential + pkg-config + libssl-dev stood here
      # (12.5s mean). It existed only so `cargo install` could COMPILE
      # cargo-audit and cargo-deny -- openssl-sys needs libssl-dev and a cc.
      # Both tools are now fetched as static musl binaries, so nothing in this
      # job compiles a native dependency any more and none of it is reachable.
      # Restore it if a future step here needs to build C.
      #
      # Ephemeral runner pod: nothing is preinstalled. rustup reads
      # coop/rust-toolchain.toml (channel + components) on first use. It stays:
      # `cargo audit` and `cargo deny` are cargo SUBCOMMANDS and `cargo deny`
      # shells out to `cargo metadata`, so cargo itself is still required.
      - name: rustup
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          # --default-toolchain none + a root working directory was the bug:
          # rustup only reads a rust-toolchain.toml from the CWD upwards, and
          # this repo's lives at coop/rust-toolchain.toml — nothing at the
          # root. So `rustup show active-toolchain` exited "error: no active
          # toolchain" and the bare `rustup toolchain install` had no spec to
          # install either. quench runs at the ROOT (`quench check --ci`), so
          # it needs a real default rather than coop's directory override.
          #
          # Pinned to the SAME channel coop pins (coop/rust-toolchain.toml:
          # channel 1.93.0) so the tool that gates the tree is built with the
          # tree's own compiler rather than drifting with whatever `stable` is.
          # Update both together.
          #
          # Paths come from CARGO_HOME, not $HOME/.cargo: the runner pod sets
          # CARGO_HOME to a node-local hostPath (gardenio/helm/ci/
          # arc-runners-values.yaml) and rustup installs its binaries under
          # CARGO_HOME when that is set, so $HOME/.cargo/bin would simply not
          # exist. The fallback keeps this working where the env is unset.
          set -euo pipefail
          CH="${CARGO_HOME:-$HOME/.cargo}"
          if [ ! -x "$CH/bin/rustup" ]; then
            # DO NOT collapse this back to `curl -sSf https://sh.rustup.rs | sh`.
            # That pipeline CANNOT FAIL CORRECTLY: on a transient fetch error
            # curl writes nothing, `sh` reads EOF and exits 0, so the install
            # "succeeds" and the job dies much later at exit 127 -- after it has
            # held a heavy runner for minutes. `set -o pipefail` does not save
            # it either: a TRUNCATED body is still fed to `sh` and partly run.
            # Download to a file, prove it is non-empty, then execute it.
            init="$(mktemp)"
            curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused \
                 --max-time 180 -o "$init" https://sh.rustup.rs
            [ -s "$init" ] || { echo "::error::rustup-init downloaded empty"; exit 1; }
            sh "$init" -y --no-modify-path --profile minimal --default-toolchain 1.93.0
            rm -f "$init"
          fi
          echo "$CH/bin" >> "$GITHUB_PATH"
          "$CH/bin/rustup" show active-toolchain
      # ── PREBUILT, not `cargo install` ────────────────────────────────────
      #
      # This step used to build cargo-audit and cargo-deny from source. The
      # comment here claimed that was "usually a no-op" once the node-local
      # CARGO_HOME was warm. IT IS NOT, and never was: measured across four
      # runs on 2026-09-22 the step took 199s, 200s, 278s and 418s -- not one
      # cache hit -- against `cargo audit` 2.8s and `cargo deny` 2.0s of actual
      # scanning. 80% of the heaviest job in the pool (340s mean, 1699
      # slot-seconds over 12 runs, the single largest heavy consumer) was
      # rebuilding its own tools.
      #
      # The cache could not hit: five runs landed on five DISTINCT nodes. A
      # node-local hostPath cache is worth nothing on a spot pool whose nodes
      # are minutes old, which is the pool this repo runs on by design.
      #
      # Both tools publish static musl binaries for the exact pinned versions,
      # so this is now a download. Checksums are pinned in the lock next to
      # the versions and verified BEFORE extraction -- a bumped version with a
      # stale checksum fails here, loudly, rather than scanning with the wrong
      # tool. Downloaded to a file and checked, never piped to a shell
      # (scripts/check-no-curl-pipe-shell.sh, and see the rustup step above for
      # why a truncated body is the failure that matters).
      - name: cargo-audit + cargo-deny (pinned binaries)
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          . ../gardenio/locks/security-tools.lock
          CH="${CARGO_HOME:-$HOME/.cargo}"
          mkdir -p "$CH/bin"

          fetch() { # url  sha256  member  dest
            local url=$1 want=$2 member=$3 dest=$4 tmp
            tmp="$(mktemp)"
            curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused \
                 --max-time 180 -o "$tmp" "$url"
            [ -s "$tmp" ] || { echo "::error::$dest downloaded empty"; exit 1; }
            echo "$want  $tmp" | sha256sum -c - >/dev/null || {
              echo "::error::checksum mismatch for $url"
              echo "::error::got $(sha256sum < "$tmp" | cut -d\  -f1), want $want"
              echo "::error::bump the _SHA256 in gardenio/locks/security-tools.lock"
              exit 1
            }
            tar -xzf "$tmp" --strip-components=1 -C "$CH/bin" "$member"
            rm -f "$tmp"
          }

          A="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          D="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          fetch "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v${CARGO_AUDIT_VERSION}/${A}.tgz" \
                "$CARGO_AUDIT_SHA256" "$A/cargo-audit" cargo-audit
          fetch "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${D}.tar.gz" \
                "$CARGO_DENY_SHA256" "$D/cargo-deny" cargo-deny

          # Prove the pins landed. A binary that runs but reports the wrong
          # version means the checksum guarded the wrong asset.
          for t in cargo-audit cargo-deny; do chmod +x "$CH/bin/$t"; done
          "$CH/bin/cargo-audit" --version | grep -qF "$CARGO_AUDIT_VERSION" \
            || { echo "::error::cargo-audit version mismatch"; exit 1; }
          "$CH/bin/cargo-deny" --version | grep -qF "$CARGO_DENY_VERSION" \
            || { echo "::error::cargo-deny version mismatch"; exit 1; }
          "$CH/bin/cargo-audit" --version; "$CH/bin/cargo-deny" --version
      # TEMPORARY DIAGNOSTIC -- see .github/actions/peak-memory. 2459s of heavy
      # slot time over 40 runs.
      #
      # The rest of this comment used to argue that demoting this job to medium
      # was blocked, because medium sets no CARGO_HOME / RUSTUP_HOME
      # (arc-runners-medium-values.yaml -- "nothing here needs Rust") and a cold
      # node would pay the 10m45s from-source build. THAT BLOCKER IS GONE: as
      # of the step above nothing is built from source, so there is no cargo
      # tool cache left to lose. `quench` already runs on medium on exactly
      # this basis -- sha256-verified release tarball, no cargo build (see its
      # comment) -- and this job now installs the same way.
      #
      # What is still NOT settled is the memory question, and the existing
      # probe data does not settle it either way. Five runs read peak 3214-4150Mi
      # (median 4111Mi) against medium's 4096Mi limit, so the one-sided peak
      # test FAILS -- which means AMBIGUOUS, not rejected. And that peak was
      # ~96% page cache (file=3614-3646Mi vs anon 63-121Mi) from the cargo
      # BUILD that no longer happens.
      #
      # The earlier version of this note said anonmax was "unusable here"
      # because samp=started makes it a post-step read. That was the symptom,
      # not the cause, and reading it as a property of the number is what kept
      # this undecidable: the sampler is started BY THE FIRST PROBE, and this
      # job had exactly one. A baseline probe now stands after checkout, so
      # anonmax here is a real high-water mark. The mechanism was never broken
      # -- `security`, which has always had two probes, reports anonmax
      # 6874-7325Mi against anon 90-119Mi and says samp=running.
      #
      # So the tier decision needs a RE-MEASUREMENT after this change, not a
      # re-reading of numbers taken from a job that no longer exists in this
      # shape. Keeping the probe for exactly that. Do not demote on the
      # pre-baseline readings.
      - run: cargo audit || echo "::warning::cargo audit findings (advisory)"
        if: steps.superseded.outputs.superseded != 'true'
      - run: cargo deny check licenses bans sources || echo "::warning::cargo deny findings (advisory)"
        if: steps.superseded.outputs.superseded != 'true'
      - uses: ./.github/actions/peak-memory
        if: always() && steps.superseded.outputs.superseded != 'true'
        with: { label: cargo-security }

  quench:
    name: quench quality gate
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s-medium # medium ARC scale set (gardenio/helm/ci) -- short CPU-bound jobs, no docker; see arc-runners-medium-values.yaml
    timeout-minutes: 10
    # RWX: quench (root + kbeads). Fully green (gd-cxKPq7DvA4): escapes
    # resolved at the root cause, and every `docs` broken_link/broken_toc
    # finding is either fixed or de-linked per that task's triage rule — see
    # its comment history for the full disposition. continue-on-error
    # dropped for exactly this reason: it is real signal again.
    #
    # Binary comes from the quench GitHub release tarball (sha256-verified),
    # NOT `cargo install quench` from crates.io (gd-G0LEXCrytC): crates.io's
    # quench 0.3.0 fails to build on this repo's pinned rustc — its
    # lexical-core dependency hits 27 type errors (e.g. "no implementation for
    # u32 - usize"). images/agent/install/rust-tools.sh already solved this
    # for the agent image by fetching the release tarball instead of building
    # from crates.io; this job sources the SAME QUENCH_VERSION/checksum pins
    # so the two installs can't drift apart. Bonus: no rustup/cargo build, so
    # this job no longer needs a Rust toolchain at all.
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: quench quality gate
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running quench quality gate"
      - name: install quench (prebuilt release binary)
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -e
          . gardenio/images/agent/install/versions.env
          . gardenio/images/agent/install/checksums.env
          curl -fsSL "https://github.com/alfredjeanlab/quench/releases/download/v${QUENCH_VERSION}/quench-linux-x86_64.tar.gz" -o /tmp/quench.tar.gz
          echo "${QUENCH_SHA256_X86_64}  /tmp/quench.tar.gz" | sha256sum -c --status -
          mkdir -p "$HOME/.local/bin"
          tar -xz -C "$HOME/.local/bin" -f /tmp/quench.tar.gz quench
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: quench check --ci
        if: steps.superseded.outputs.superseded != 'true'
      # WHOLE-TREE GUARDS (gd-is2Nts83Ai). A file far from scripts/ can change
      # their verdict (any tracked file, any *.sh, any go.mod, a Go test dir an
      # images.yml filter globs, a .tf file's reach), so they cannot sit behind
      # a path gate. This job already scans the whole tree, is ungated and is
      # checked out, and together they cost a few seconds. Their self-tests
      # stay in `script-selftests`. scripts/check-ci-path-gates.py fails if
      # one of them is run by no ungated job.
      # `echo "$x" | grep -q PAT` is a SIGPIPE race, and until 2026-09-22 it was
      # the most common red on main: 7 of the last 95 runs of script-selftests, six of
      # them this one bug wearing four different names. grep -q exits at the
      # first match without draining stdin, the producer's write() then takes
      # EPIPE (immediately -- free pipe buffer is irrelevant), and `pipefail`
      # promotes that to the pipeline's status, so the branch flips even though
      # grep matched. The tell is an assertion reporting exactly the value it
      # asserted. 423 sites were converted to here-strings; this keeps them gone.
      - name: no producer piped into an early-exit grep
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-sigpipe-producers.py
      # A guard that cannot fail is not a guard: the previous internal-strings
      # audit reported green for weeks while its script did not exist
      # (gd-3bU9QDf5sv). This one is hard-failing and whole-tree, and its
      # self-test (lint-public-strings_test.sh, in script-selftests) plants a
      # dead host, the old GitLab group path and an instance id and asserts red.
      - name: public strings and infra ids
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/lint-public-strings.sh --all
      # Proves the files the `helm` job sources are in its filter, and the
      # whole-tree scans sit in an ungated job (gd-is2Nts83Ai, gd-whdmfznixO).
      - name: checks.yml path gates watch what their jobs read
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-ci-path-gates.py
      # `curl … | sh` cannot report failure: on a transient fetch error curl
      # writes nothing, `sh` reads EOF and exits 0, so the install "succeeds"
      # and the job dies minutes later at exit 127 -- having already held a
      # HEAVY node through checkout and apt. 2 of the 6 failures in the last
      # 100 ci.yml runs were exactly that. pipefail does NOT fix it; a
      # truncated body is still executed. The policy already existed in
      # gardenio/images/agent/install/ (clis.sh:8) and nothing enforced it, so
      # three workflows drifted back to it -- ci.yml, e2e.yml and checks.yml,
      # checks.yml's own rustup step among them. gd-ahaGQcSZFp.
      - name: no installer piped straight into a shell
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/check-no-curl-pipe-shell.sh
      - name: no merge-conflict markers in tracked files
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/check-merge-conflict-markers.sh
      - name: no tracked file over 3 MiB
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/check-large-tracked-files.sh
      - name: every Go module is in go.work or has a make target
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/check-go-module-coverage.sh
      - name: no kubectl apply of Secrets in scripts or runbooks
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/security/lint-kubectl-apply-secret.py .
      # Build policy (gd-kCs3VDmMWR; rules in the repo-root CLAUDE.md). A new
      # cmd/ dir or guard test can land anywhere in the tree, so these sit
      # here, ungated.
      - name: every controller binary ships in an image or runs in CI
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-cmd-shipped.py
      - name: every guard test cites the bead it protects against
        if: steps.superseded.outputs.superseded != 'true'
        run: python3 scripts/check-guard-provenance.py
      # The per-package line budget (gd-d29n0m678l): every Go package against
      # scripts/ratchets/line-budget.tsv, counted by code-size.sh (the counter
      # of the reduction targets). Any Go file anywhere moves it, so it sits
      # here, ungated. Reads source only, ~10 s.
      - name: no Go package past its line budget
        if: steps.superseded.outputs.superseded != 'true'
        run: bash scripts/ratchets/line-budget.sh check

  dictation-corpus:
    name: scripts/build-dictation-corpus vet + test
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s-medium # medium ARC scale set (gardenio/helm/ci) -- short CPU-bound jobs, no docker; see arc-runners-medium-values.yaml
    timeout-minutes: 10
    # RWX: test-dictation-corpus
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: scripts/build-dictation-corpus vet + test
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running scripts/build-dictation-corpus vet + test"
      # cache: false -- see the long note on the `security` job's setup-go for
      # the trap this closes. It applies here as of 2026-09-22 for a second
      # reason: this job runs on the MEDIUM tier, which until b689d995 mounted
      # no node cache at all, so reaching for actions/cache over the network
      # was the only caching it had. Now that /cache is mounted here too, the
      # node-local cache is both warmer and free.
      - uses: actions/setup-go@v5
        if: steps.superseded.outputs.superseded != 'true'
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - run: cd scripts/build-dictation-corpus && GOWORK=off go vet ./... && GOWORK=off go test ./...
        if: steps.superseded.outputs.superseded != 'true'


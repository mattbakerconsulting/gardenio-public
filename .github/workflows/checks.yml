  # ── D rows: real checks we cannot run yet ─────────────────────────────────
  # coverage ratchets (RWX coverage*.yml, coverage-baselines.yml): ported as
  #   ci.yml's advisory `coverage / patch` step in the `go` job (gd-roE5roXBKQ);
  #   regen-baselines.sh's self-test runs with the ratchets' below.
  # beads-viewer e2e (test-beads-viewer-e2e): needs node/playwright + a live
  #   viewer; port after gardenio is deployed.
  # advice-snapshot-freshness: needs a live beads daemon (same as the one
  #   skipped test in ci.yml).
  # terraform composition tests (test-release-closure-excludes-control-plane,
  #   test-monorepo-protect-tf, lint-deploy-values*): their roots/overlays were
  #   stripped by the redaction.
  # coop rendering-bc / claudeless: needs tmux + the claudeless binary.
  #
  # internal-strings-audit (RWX ci.yml "OSS-readiness early-warning"): WAS a
  #   real job here until 2026-09-22 and had never once run. It shelled out to
  #   scripts/sanitize/no-internal-strings.sh, and scripts/sanitize/ does not
  #   exist and never has -- `git log --all -- 'scripts/sanitize/*'` is empty,
  #   so the redaction stripped it exactly like the terraform overlays above.
  #   The failure was invisible by construction: `... || echo "::warning::"`
  #   swallowed bash's "No such file or directory", and `continue-on-error:
  #   true` made the job green on top of that. Log for job 106653927690:
  #
  #     bash: scripts/sanitize/no-internal-strings.sh: No such file or directory
  #     ##[warning]internal strings audit (advisory)
  #     conclusion: success
  #
  #   It billed a WHOLE heavy runner (3 CPU / 12Gi, one 4-vCPU node) and a
  #   fetch-depth:0 clone per PR to do that. Measured p50 6 s wall, of which
  #   the audit step itself was 10 ms (07:26:06.586 -> .588); the rest was git
  #   fetch. Removed rather than fixed because the patterns it matched
  #   (internal hosts, registry paths, AWS account ids, IAM ARNs, operator
  #   PII) were redacted with the script -- reimplementing them from memory
  #   would rebuild the same false green, which is the actual defect here, not
  #   the wasted node. Replaced by scripts/lint-public-strings.sh
  #   (hard-failing, with a planted-failure self-test), run whole-tree in the
  #   ungated `quench` job; closes gd-3bU9QDf5sv.
  deferred:
    name: deferred (D rows, see comments)
    if: false
    runs-on: gardenio-k3s # ARC scale set on the k3s CI pool (gardenio/helm/ci)
    steps:
      - run: "true"

  # ── THE REQUIRED CHECK `checks` (gd-UqzOTRj6cX) ────────────────────────────────
  # A ruleset's required status check matches a CHECK-RUN (job) name, not a
  # workflow name, so this job is the one name the main ruleset requires for
  # all of checks.yml. Adding, renaming or path-gating a job then never touches
  # the ruleset. It needs EVERY other job and fails when any of them did not
  # end `success` or `skipped`: a failure, a cancel, a timeout. Skipped is
  # fine, so path gates, the PR light tier and the supersession skip still pass.
  #
  # `if: always()`, not `!cancelled()`: a cancelled run must still report a
  # FAILED `checks`. A skipped check satisfies a required check, so a skipped
  # `checks` would read as green.
  #
  # The name is `checks` on every event. From gd-UqzOTRj6cX to part B
  # (gd-19ECZxvFQw) a draft run reported `checks (draft)`, because its heavy
  # jobs skipped and a ready_for_review run was still to come. Every PR run
  # is now the light tier, draft or not, and `gh pr ready` starts no run,
  # so the head's own run must report the check the ruleset requires.
  #
  # ADVISORY lists the job ids whose failure must not fail `checks`: a job that
  # carries job-level `continue-on-error`. It is empty because no job here
  # does. The advisory scans swallow their findings inside their own steps, so
  # when one of those jobs fails, something real broke.
  #
  # scripts/check-ci-required-checks.py keeps `needs:` equal to every other
  # job, the name, the `if:` and ADVISORY, and runs the step below on fixtures.
  checks:
    name: checks
    needs:
      - supersession
      - changes
      - lint-go
      - script-selftests
      - terraform
      - helm
      - gitleaks
      - security
      - cargo-security
      - quench
      - dictation-corpus
      - wer-eval
      - lands-contract
      - lands-gl
      - deferred
    if: always()
    runs-on: gardenio-k3s-light # never heavy: it only reads `needs`
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every job passed or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          ADVISORY: ""
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          n=$(jq 'length' <<<"$NEEDS")
          if [ "$n" -eq 0 ]; then
            echo "::error::no needs results to judge; failing closed"
            exit 1
          fi
          bad=$(jq -r --arg adv "$ADVISORY" '
            ($adv | split(" ") | map(select(length > 0))) as $a
            | to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | if (.key as $k | $a | index($k)) != null
              then "+advisory \(.key) \(.value.result)"
              else "\(.key) \(.value.result)" end' <<<"$NEEDS")
          rc=0
          while read -r a b c; do
            case "$a" in
              "") ;;
              +advisory) echo "::warning::$b ended $c (advisory, does not fail checks)" ;;
              *) echo "::error::$a ended $b"; rc=1 ;;
            esac
          done <<<"$bad"
          exit "$rc"

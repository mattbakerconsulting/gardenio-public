  # The Lands contract module (lands/contract, task gd-DBEOg6p7rX). It is
  # outside go.work on purpose, so nothing else here compiles it
  # (scripts/check-go-module-coverage.sh maps it to `make test-lands-contract`,
  # which this job runs the equivalent of). Same shape and tier as
  # dictation-corpus: a small module, short CPU-bound work, no docker, ungated.
  lands-contract:
    name: lands/contract spec + bindings + fixtures
    # Drafts skip this job; see `on.pull_request` at the top of this file.
    # `!cancelled()` so a failed or unschedulable gate still runs this job;
    # see the `supersession` job for why the run-wide verdict is sound here.
    needs: supersession
    if: >-
      !cancelled() &&
      needs.supersession.outputs.superseded != 'true' &&
      github.event_name != 'pull_request'
    permissions:
      actions: read # the in-job re-check lists this workflow's runs and jobs
      contents: read
    runs-on: gardenio-k3s-medium # medium ARC scale set (gardenio/helm/ci); see arc-runners-medium-values.yaml
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lands/contract
    steps:
      - uses: actions/checkout@v4

      # Re-ask the supersession question after the queue wait; read the
      # `supersession` job before touching any of the next three steps.
      # ADDING A STEP BELOW? Guard it with the same `if:` -- for the
      # node-minutes, and so the sentinel keeps telling the truth.
      # scripts/check-ci-draft-gate.py refuses an unguarded one.
      - id: superseded
        uses: ./.github/actions/superseded
        with:
          workflow: checks.yml
          job: lands/contract spec + bindings + fixtures
      - name: guard decision
        run: |
          v='${{ steps.superseded.outputs.superseded }}'
          echo "supersession guard: superseded='${v}'"
          if [ -z "$v" ]; then
            echo "::warning::supersession guard produced NO value -- it is failing open and saving nothing"
          fi
      - name: heavy work starting
        if: steps.superseded.outputs.superseded != 'true'
        run: echo "not superseded; running lands/contract spec + bindings + fixtures"
      # cache: false -- see dictation-corpus above; GOCACHE is the node-local /cache.
      - uses: actions/setup-go@v5
        if: steps.superseded.outputs.superseded != 'true'
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - uses: actions/setup-node@v4
        if: steps.superseded.outputs.superseded != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lands/contract/ts/package-lock.json
      - name: go vet + test (spec rules, golden fixtures, hygiene, deps)
        if: steps.superseded.outputs.superseded != 'true'
        run: GOWORK=off go vet ./... && GOWORK=off go test -count=1 ./...
      # Both bindings are committed so gl and the web UI build without the
      # generators. Regenerate and fail on any difference, so a hand edit to a
      # generated file or a spec change without regeneration cannot land.
      - name: regenerate the Go and TypeScript bindings
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          GOWORK=off go generate ./...
          cd ts && npm ci --no-audit --no-fund && npm run generate
      - name: fail on binding drift
        if: steps.superseded.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          drift=$(git status --porcelain -- .)
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            git --no-pager diff --stat -- .
            echo "::error::lands/contract bindings are stale. Run 'make generate-lands-contract' and commit the result."
            exit 1
          fi
      - name: type-check the golden fixtures against the TypeScript binding
        if: steps.superseded.outputs.superseded != 'true'
        run: cd ts && npm run check


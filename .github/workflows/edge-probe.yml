# Daily external probe of the public edge (plan ziti-to-keycloak, Task 1).
#
# GitHub-hosted on purpose: a different network from AWS and from the laptop, so it
# sees the edge the way an attacker does. No secrets and no AWS credentials. A failing
# run emails the repo owner through GitHub's own notifications, which do not depend on
# the cluster. Exit codes: 0 all PASS, 1 any FAIL, 2 any BROKEN (a positive control
# failed, so the probe itself cannot be trusted). See scripts/edge-probe/README.md.
name: edge-probe

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe the public edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run the edge probe
        run: >-
          python3 scripts/edge-probe/edge_probe.py
          --vantage github
          --expectations scripts/edge-probe/expectations.json
          --output edge-probe-report.json
      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-probe-report
          path: edge-probe-report.json
          if-no-files-found: warn

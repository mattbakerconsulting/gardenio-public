# Privileged host-access probe for driving `runsc checkpoint|restore` on the gvisor node.
# Schedules onto the gvisor-poc pool (nodeSelector gvisor=enabled + matching toleration),
# hostPID + hostPath / so it can chroot the node root and reach /run/containerd/runsc/k8s.io.
apiVersion: v1
kind: Pod
metadata:
  name: gvisor-probe
  namespace: gvisor-poc
  labels: {app: gvisor-probe, poc: ka-0000000300}
spec:
  restartPolicy: Never
  nodeSelector: {gvisor: enabled}
  tolerations:
  - {key: gvisor, operator: Equal, value: enabled, effect: NoSchedule}
  hostPID: true
  hostNetwork: true
  containers:
  - name: probe
    image: public.ecr.aws/docker/library/ubuntu:22.04
    command: ["sleep", "36000"]
    securityContext: {privileged: true}
    volumeMounts:
    - {name: host, mountPath: /host}
    - {name: run, mountPath: /run}
  volumes:
  - {name: host, hostPath: {path: /}}
  - {name: run, hostPath: {path: /run}}

# gardener-trigger-bead-event-label-predicate.toml
#
# Live-flow scenario for ka-0000002765 §4: bead_event Match label-predicate
# (label:<name>==<value>) fires/doesn't-fire correctly.
#
# Engine code covered:
#   - gardenio/controller/internal/scheduler/triggers.go:566-590
#     (entry.Match evaluation against payload with labels overlay)
#   - gardenio/controller/internal/scheduler/triggers.go:633-647 (withLabels
#     overlays event labels under the "labels" payload key so label:<name>
#     field leaves resolve correctly).
#   - gardenio/controller/internal/scheduler/conditions/* — label:<name>
#     field leaf parsing.
#
# Two assertions:
#   POS: close a bead carrying the matching label → gardener fires.
#   NEG: close a bead missing the label → gardener does NOT fire.

[claude]
session_id = "e2e00000-000c-4000-a000-000000000004"
username = "e2e-gardener-label-predicate"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 240000

[[responses]]
on = "*"
say = "Running gardener-trigger-bead-event-label-predicate: label-tagged close fires; untagged doesn't."
tools = [
  { call = "Bash", input = { command = """set -u
PASS=0; FAIL=0; ERRORS=""

pass() { PASS=$((PASS + 1)); echo "PASS: $1"; }
fail() { FAIL=$((FAIL + 1)); ERRORS="$ERRORS\\n  - $1${2:+ — $2}"; echo "FAIL: $1${2:+ — $2}"; }

if ! command -v kd >/dev/null 2>&1; then echo "SKIP: kd not present"; exit 0; fi
if [ -z "${BEADS_HTTP_URL:-}" ] || [ -z "${BEADS_TOKEN:-}" ]; then
  echo "SKIP: BEADS_HTTP_URL/BEADS_TOKEN unset"; exit 0
fi

TAG="e2e-clbl-$$-$(date +%s)"
MATCH_LABEL="e2e-gardener-match-$TAG"

EPIC_ID=$(kd create "gardener-label-epic-$TAG" --type=epic -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$EPIC_ID" ]; then fail "create epic"; exit 1; fi

# Two children: one tagged with MATCH_LABEL, one without.
TAGGED_ID=$(kd create "tagged-$TAG" --type=task -l "e2e:claudeless" -l "e2e-tag:$TAG" -l "$MATCH_LABEL" --json 2>&1 | jq -r '.id // empty')
PLAIN_ID=$(kd create "plain-$TAG"  --type=task -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$TAGGED_ID" ] || [ -z "$PLAIN_ID" ]; then fail "create children"; exit 1; fi
kd dep add "$TAGGED_ID" "$EPIC_ID" --type parent-child >/dev/null 2>&1 || true
kd dep add "$PLAIN_ID"  "$EPIC_ID" --type parent-child >/dev/null 2>&1 || true

# Match: label:<MATCH_LABEL> == "true" (truthy presence semantics).
# The withLabels overlay flattens label list into payload such that
# label:<name> resolves to the literal "true" string when present.
TRIGGERS=$(cat <<JSON
[
  {"kind":"cron","cron":"0 0 1 1 *","timezone":"UTC"},
  {"kind":"bead_event","events":["closed"],
   "match":{"all":[{"field":"label:$MATCH_LABEL","op":"==","value":"true"}]}}
]
JSON
)
STOP='{"loop_end":{"any":[{"kind":"max_runs"}]},"run_end":{"any":[{"kind":"no_actionable_state"}]},"hard_stop":{"any":[{"kind":"manual_force","field":"force_close","value":"true"}]}}'

SCHED_ID=$(kd create "gardener-sched-$TAG" --type=schedule \
  -l "e2e:claudeless" -l "e2e-tag:$TAG" -l "role:gardener" -l "project:gardenio" \
  -f "enabled=true" -f "role=gardener" -f "assign_bead=$EPIC_ID" -f "project=gardenio" \
  -f "prompt=gardener test prompt" -f "max_runs=2" \
  -f "cron=0 0 1 1 *" -f "timezone=UTC" \
  -f "triggers=$TRIGGERS" -f "stop=$STOP" --json 2>&1 | jq -r '.id // empty')
if [ -z "$SCHED_ID" ]; then fail "create schedule"; exit 1; fi
echo "schedule: $SCHED_ID  match-label: $MATCH_LABEL"

cleanup() {
  kd update "$SCHED_ID" -f "enabled=false" -f "force_close=true" >/dev/null 2>&1 || true
  AGENT=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.last_agent_id // empty')
  [ -n "$AGENT" ] && kd close "$AGENT" >/dev/null 2>&1 || true
  for id in "$SCHED_ID" "$TAGGED_ID" "$PLAIN_ID" "$EPIC_ID"; do
    kd close "$id" >/dev/null 2>&1 || true
  done
}
trap cleanup EXIT

sleep 5

# ── NEG case: close the PLAIN child first — should NOT fire ──────
kd close "$PLAIN_ID" >/dev/null 2>&1 || { fail "kd close plain"; exit 1; }
echo "closed plain child $PLAIN_ID; waiting 90s to confirm no fire..."
sleep 90
RS=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.runs_spawned // "0"')
if [ "${RS:-0}" = "0" ]; then
  pass "label-mismatch did NOT fire gardener (runs_spawned=0)"
else
  fail "label-mismatch unexpectedly fired gardener" "runs_spawned=$RS"
  exit 1
fi

# ── POS case: close the TAGGED child — should fire ───────────────
kd close "$TAGGED_ID" >/dev/null 2>&1 || { fail "kd close tagged"; exit 1; }
echo "closed tagged child $TAGGED_ID; waiting for fire..."

DEADLINE=$(( $(date +%s) + 150 ))
FIRED=0
while [ "$(date +%s)" -lt "$DEADLINE" ]; do
  RS=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.runs_spawned // "0"')
  if [ "${RS:-0}" -ge 1 ] 2>/dev/null; then
    FIRED=1
    pass "label-match fired gardener (runs_spawned=$RS)"
    break
  fi
  sleep 5
done

if [ "$FIRED" = "0" ]; then
  fail "gardener did not fire on label-tagged close within 150s"
  kd show "$SCHED_ID" 2>/dev/null | head -40 || true
  exit 1
fi

echo ""
echo "=== Results: $PASS passed, $FAIL failed ==="
if [ $FAIL -gt 0 ]; then printf "Failures:%b\\n" "$ERRORS"; exit 1; fi
echo "gardener-trigger-bead-event-label-predicate OK."
exit 0
""" } }
]

[default]
say = "gardener-trigger-bead-event-label-predicate scenario complete."

[tools]
mode = "live"

[tools.Bash]
approve = true

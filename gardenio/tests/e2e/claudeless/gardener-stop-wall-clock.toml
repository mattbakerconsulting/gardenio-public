# gardener-stop-wall-clock.toml
#
# Claudeless scenario: a gardener schedule with a custom `--loop-wall-clock`
# value persists that duration into `stop.loop_end.any` so the
# StopEvaluator can close the loop after the wall-clock budget elapses.
#
# Plan §T9: "gardener-stop-wall-clock: schedule older than wall_clock closes
# on next tick."
#
# Wall-clock evaluation lives in scheduler/stop.go (covered by
# stop_test.go). The E2E surface asserts the CLI flag round-trips into the
# stored stop block — both at the default (168h, the §5.1 backstop) and a
# user-overridden short value. If the lowering ever drops the wall_clock
# entry, gardeners lose their absolute backstop and this test fails.

[claude]
session_id = "e2e00000-0009-4000-a000-000000000005"
username = "e2e-gardener-wall-clock"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 30000

[[responses]]
on = "*"
say = "Running gardener-stop-wall-clock: assert default + override loop wall-clock entries persist."
tools = [
  { call = "Bash", input = { command = """set -u
PASS=0; FAIL=0; ERRORS=""

pass() { PASS=$((PASS + 1)); echo "PASS: $1"; }
fail() { FAIL=$((FAIL + 1)); ERRORS="$ERRORS\\n  - $1${2:+ — $2}"; echo "FAIL: $1${2:+ — $2}"; }

if ! gb gardener --help >/dev/null 2>&1; then
  echo "SKIP: gb gardener not present (pre-T6)"
  exit 0
fi

# ── Case A: default loop wall-clock is 168h (§5.1 backstop) ─────────
EPIC_A=$(kd create "e2e-gardener-wallclock-default-$$-$(date +%s)" --type=epic --json 2>/dev/null | jq -r '.id // empty')
if [ -z "$EPIC_A" ]; then fail "create epic A"; exit 1; fi
echo "epic A (default): $EPIC_A"

cleanup() {
  gb gardener stop "$EPIC_A" --reason "e2e cleanup" >/dev/null 2>&1 || true
  kd close "$EPIC_A" >/dev/null 2>&1 || true
  if [ -n "${EPIC_B:-}" ]; then
    gb gardener stop "$EPIC_B" --reason "e2e cleanup" >/dev/null 2>&1 || true
    kd close "$EPIC_B" >/dev/null 2>&1 || true
  fi
}
trap cleanup EXIT

gb gardener start "$EPIC_A" --i-read-the-gardener-instructions >/dev/null 2>&1 || { fail "gb gardener start (A)"; exit 1; }
STOP_A=$(gb gardener status "$EPIC_A" --json 2>/dev/null | jq -c '.stop // empty')
WC_A=$(echo "$STOP_A" | jq -r '.loop_end.any[] | select(.kind=="wall_clock") | .duration' 2>/dev/null | head -n1)
if [ "$WC_A" = "168h" ]; then
  pass "default loop_end.wall_clock = 168h"
else
  fail "default loop_end.wall_clock" "got=[$WC_A]"
fi

# ── Case B: override --loop-wall-clock=72h ──────────────────────────
EPIC_B=$(kd create "e2e-gardener-wallclock-72h-$$-$(date +%s)" --type=epic --json 2>/dev/null | jq -r '.id // empty')
if [ -z "$EPIC_B" ]; then fail "create epic B"; exit 1; fi
echo "epic B (--loop-wall-clock=72h): $EPIC_B"

gb gardener start "$EPIC_B" --loop-wall-clock=72h --i-read-the-gardener-instructions >/dev/null 2>&1 || { fail "gb gardener start (B)"; exit 1; }
STOP_B=$(gb gardener status "$EPIC_B" --json 2>/dev/null | jq -c '.stop // empty')
WC_B=$(echo "$STOP_B" | jq -r '.loop_end.any[] | select(.kind=="wall_clock") | .duration' 2>/dev/null | head -n1)
if [ "$WC_B" = "72h" ]; then
  pass "override loop_end.wall_clock = 72h"
else
  fail "override loop_end.wall_clock" "got=[$WC_B]"
fi

# ── Sanity: run_end also has a wall_clock cap (default 30m) ─────────
RWC_B=$(echo "$STOP_B" | jq -r '.run_end.any[] | select(.kind=="wall_clock") | .duration' 2>/dev/null | head -n1)
if [ "$RWC_B" = "30m" ]; then
  pass "default run_end.wall_clock = 30m"
else
  fail "default run_end.wall_clock" "got=[$RWC_B]"
fi

# ── Summary ─────────────────────────────────────────────────────────
echo ""
echo "=== Results: $PASS passed, $FAIL failed ==="
if [ $FAIL -gt 0 ]; then
  printf "Failures:%b\\n" "$ERRORS"
  exit 1
fi
echo "gardener-stop-wall-clock: wall_clock entries persist on loop_end and run_end."
exit 0
""" } }
]

[default]
say = "gardener-stop-wall-clock scenario complete."

[tools]
mode = "live"

[tools.Bash]
approve = true

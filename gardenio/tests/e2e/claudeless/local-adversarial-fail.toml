# local-adversarial-fail.toml
#
# Claudeless scenario: Adversarial — body unconditionally reports failure.
#
# Regression fixture for ka-0000006600. Before that fix, `gb agent start
# --local --test-scenario=...` would always exit 0 once coop teardown ran,
# even when the scenario body asserted failure — because the only signal
# was coop's own non-zero teardown exit, which the runner deliberately
# "treated as clean".
#
# This scenario writes `fail` to GB_SCENARIO_RESULT_FILE on its very first
# response and then calls gb stop. The fix narrows the "treated as clean"
# rule to additionally require a positive `pass` verdict from the body, so:
#
#   gb agent start --local --test-scenario=local-adversarial-fail
#
# MUST exit non-zero. Any change that makes it exit zero is a regression.
#
# This file is intentionally NOT wired into test-local-mode.sh's main loop
# (it would always fail). The harness that exercises it lives next to the
# bug's Go unit tests in agent_start_scenario_result_test.go.

# Local-mode startup prompt for `gb agent start --local` lives in the
# sidecar local-adversarial-fail.startup-prompt.txt next to this file.

[claude]
session_id = "e2e00000-0004-4000-a000-00000000000a"
username = "e2e-local-adversarial-fail"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 15000

# ── Single phase: announce failure and stop ──────────────────────────
[[responses]]
on = "*"
say = "Adversarial scenario: reporting failure and stopping."
tools = [
  { call = "Bash", input = { command = """# ka-0000006600 regression fixture: unconditionally signal failure.
if [ -n "${GB_SCENARIO_RESULT_FILE:-}" ]; then
  echo fail > "$GB_SCENARIO_RESULT_FILE"
fi
echo "ADVERSARIAL_FAIL_REPORTED"
gb stop 2>&1 || true
exit 1""" } }
]

# ── Fallback ──────────────────────────────────────────────────────
[default]
say = "Adversarial scenario idle."

# ── Tool config ───────────────────────────────────────────────────
[tools]
mode = "live"

[tools.Bash]
approve = true

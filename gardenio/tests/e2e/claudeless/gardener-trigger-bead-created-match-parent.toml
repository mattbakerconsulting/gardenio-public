# gardener-trigger-bead-created-match-parent.toml
#
# Live-flow scenario for ka-0000002765 §1: bead_event kind=created,
# Match on parent==<id> → gardener fires.
#
# Engine code covered:
#   - gardenio/controller/internal/scheduler/triggers.go:541-612
#     (evaluateEventEntry filter by kind="bead_event", events=["created"])
#   - gardenio/controller/internal/scheduler/triggers.go:617-631
#     (matchesEventType accepts short topic "created")
#   - gardenio/controller/internal/scheduler/nats_bead_closed.go +
#     event broker for bead.created topic
#   - gardenio/controller/internal/scheduler/scheduler.go:213-440
#     (Reconcile pass → SpawnRun → runs_spawned bump)
#
# Why live-flow: shape tests pass even if the bead-created broker stops
# delivering events to the trigger engine. Only an end-to-end "create a
# child, observe runs_spawned increment" proves the broker→engine wiring.

[claude]
session_id = "e2e00000-000c-4000-a000-000000000002"
username = "e2e-gardener-bead-created-parent"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 180000

[[responses]]
on = "*"
say = "Running gardener-trigger-bead-created-match-parent: create child → gardener fires."
tools = [
  { call = "Bash", input = { command = """set -u
PASS=0; FAIL=0; ERRORS=""

pass() { PASS=$((PASS + 1)); echo "PASS: $1"; }
fail() { FAIL=$((FAIL + 1)); ERRORS="$ERRORS\\n  - $1${2:+ — $2}"; echo "FAIL: $1${2:+ — $2}"; }

if ! command -v kd >/dev/null 2>&1; then echo "SKIP: kd not present"; exit 0; fi
if [ -z "${BEADS_HTTP_URL:-}" ] || [ -z "${BEADS_TOKEN:-}" ]; then
  echo "SKIP: BEADS_HTTP_URL/BEADS_TOKEN unset"; exit 0
fi

TAG="e2e-cbcr-$$-$(date +%s)"
EPIC_ID=$(kd create "gardener-bead-created-$TAG" --type=epic -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$EPIC_ID" ]; then fail "create epic"; exit 1; fi
echo "epic: $EPIC_ID"

TRIGGERS=$(cat <<JSON
[
  {"kind":"cron","cron":"0 0 1 1 *","timezone":"UTC"},
  {"kind":"bead_event","events":["created"],
   "match":{"all":[{"field":"parent","op":"==","value":"$EPIC_ID"}]}}
]
JSON
)
STOP='{"loop_end":{"any":[{"kind":"max_runs"}]},"run_end":{"any":[{"kind":"no_actionable_state"}]},"hard_stop":{"any":[{"kind":"manual_force","field":"force_close","value":"true"}]}}'

SCHED_ID=$(kd create "gardener-sched-$TAG" --type=schedule \
  -l "e2e:claudeless" -l "e2e-tag:$TAG" -l "role:gardener" -l "project:gardenio" \
  -f "enabled=true" -f "role=gardener" -f "assign_bead=$EPIC_ID" -f "project=gardenio" \
  -f "prompt=gardener test prompt" -f "max_runs=1" \
  -f "cron=0 0 1 1 *" -f "timezone=UTC" \
  -f "triggers=$TRIGGERS" -f "stop=$STOP" --json 2>&1 | jq -r '.id // empty')
if [ -z "$SCHED_ID" ]; then fail "create schedule"; exit 1; fi
echo "schedule: $SCHED_ID"

cleanup() {
  kd update "$SCHED_ID" -f "enabled=false" -f "force_close=true" >/dev/null 2>&1 || true
  AGENT=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.last_agent_id // empty')
  [ -n "$AGENT" ] && kd close "$AGENT" >/dev/null 2>&1 || true
  for id in "${CHILD_ID:-}" "$SCHED_ID" "$EPIC_ID"; do
    [ -n "$id" ] && kd close "$id" >/dev/null 2>&1 || true
  done
}
trap cleanup EXIT

# Let scheduler register the schedule before firing the event
sleep 5

# ── Mutate: create a child (fires bead_event kind=created) ────────
CHILD_ID=$(kd create "child-created-$TAG" --type=task -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$CHILD_ID" ]; then fail "create child"; exit 1; fi
kd dep add "$CHILD_ID" "$EPIC_ID" --type parent-child >/dev/null 2>&1 || true
echo "created child $CHILD_ID at $(date -u +%FT%TZ)"

# ── Wait for fire ──────────────────────────────────────────────────
DEADLINE=$(( $(date +%s) + 150 ))
FIRED=0
while [ "$(date +%s)" -lt "$DEADLINE" ]; do
  RAW=$(kd show "$SCHED_ID" --json 2>/dev/null)
  RS=$(echo "$RAW" | jq -r '.fields.runs_spawned // "0"')
  LA=$(echo "$RAW" | jq -r '.fields.last_agent_id // empty')
  if [ "${RS:-0}" -ge 1 ] 2>/dev/null || [ -n "$LA" ]; then
    FIRED=1
    pass "gardener fired (runs_spawned=$RS last_agent_id=$LA)"
    break
  fi
  sleep 5
done

if [ "$FIRED" = "0" ]; then
  fail "gardener did not fire within 150s of created event"
  kd show "$SCHED_ID" 2>/dev/null | head -40 || true
  exit 1
fi

echo ""
echo "=== Results: $PASS passed, $FAIL failed ==="
if [ $FAIL -gt 0 ]; then
  printf "Failures:%b\\n" "$ERRORS"; exit 1
fi
echo "gardener-trigger-bead-created-match-parent OK."
exit 0
""" } }
]

[default]
say = "gardener-trigger-bead-created-match-parent scenario complete."

[tools]
mode = "live"

[tools.Bash]
approve = true

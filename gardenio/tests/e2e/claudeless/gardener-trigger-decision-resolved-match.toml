# gardener-trigger-decision-resolved-match.toml
#
# Live-flow scenario for ka-0000002765 §5: decision_resolved Match on
# decision payload (decision_id) → gardener fires after decision answer.
#
# Engine code covered:
#   - gardenio/controller/internal/scheduler/nats_decision.go:65-150
#     (DecisionEventListener.Start subscribes to
#     decisions.*.DecisionResponded, decodes natsDecisionPayload, calls
#     engine.OnDecisionResolved with payload+labels).
#   - gardenio/controller/internal/scheduler/triggers.go:541-612
#     (evaluateEventEntry routes events of kind="decision_resolved"
#     through entry.Match against payload).
#   - gardenio/controller/internal/scheduler/scheduler.go:213-440 (fire path).
#
# The gardener §5.1 template matches on raised_by_agent.task_id which is a
# bead-lookup leaf — we exercise the simpler `decision_id` payload leaf to
# isolate the decision_resolved end-to-end wiring (NATS subject → engine
# OnDecisionResolved → Match → fire). A regression in the NATS subject,
# payload decoding, or Match evaluator would silently break gardeners
# without affecting gardener-conditions-fan-in.toml shape assertions.

[claude]
session_id = "e2e00000-000c-4000-a000-000000000005"
username = "e2e-gardener-decision-resolved"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 180000

[[responses]]
on = "*"
say = "Running gardener-trigger-decision-resolved-match: respond decision → gardener fires."
tools = [
  { call = "Bash", input = { command = """set -u
PASS=0; FAIL=0; ERRORS=""

pass() { PASS=$((PASS + 1)); echo "PASS: $1"; }
fail() { FAIL=$((FAIL + 1)); ERRORS="$ERRORS\\n  - $1${2:+ — $2}"; echo "FAIL: $1${2:+ — $2}"; }

if ! command -v kd >/dev/null 2>&1 || ! command -v gb >/dev/null 2>&1; then
  echo "SKIP: kd or gb not present"; exit 0
fi
if [ -z "${BEADS_HTTP_URL:-}" ] || [ -z "${BEADS_TOKEN:-}" ]; then
  echo "SKIP: BEADS_HTTP_URL/BEADS_TOKEN unset"; exit 0
fi

TAG="e2e-cdrm-$$-$(date +%s)"
EPIC_ID=$(kd create "gardener-decision-epic-$TAG" --type=epic -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$EPIC_ID" ]; then fail "create epic"; exit 1; fi

# Create the decision first so we know its id for the schedule's Match.
DEC_ID=$(gb decision create --no-wait --http-url "$BEADS_HTTP_URL" \
  --prompt "e2e-gardener-decision-resolved $TAG" \
  --option "yes:Continue:report" \
  --option "no:Skip:report" \
  --json 2>&1 | jq -r '.id // .ID // empty')
if [ -z "$DEC_ID" ]; then fail "gb decision create"; exit 1; fi
echo "decision: $DEC_ID"

TRIGGERS=$(cat <<JSON
[
  {"kind":"cron","cron":"0 0 1 1 *","timezone":"UTC"},
  {"kind":"decision_resolved",
   "match":{"all":[{"field":"decision_id","op":"==","value":"$DEC_ID"}]}}
]
JSON
)
STOP='{"loop_end":{"any":[{"kind":"max_runs"}]},"run_end":{"any":[{"kind":"no_actionable_state"}]},"hard_stop":{"any":[{"kind":"manual_force","field":"force_close","value":"true"}]}}'

SCHED_ID=$(kd create "gardener-sched-$TAG" --type=schedule \
  -l "e2e:claudeless" -l "e2e-tag:$TAG" -l "role:gardener" -l "project:gardenio" \
  -f "enabled=true" -f "role=gardener" -f "assign_bead=$EPIC_ID" -f "project=gardenio" \
  -f "prompt=gardener test prompt" -f "max_runs=1" \
  -f "cron=0 0 1 1 *" -f "timezone=UTC" \
  -f "triggers=$TRIGGERS" -f "stop=$STOP" --json 2>&1 | jq -r '.id // empty')
if [ -z "$SCHED_ID" ]; then fail "create schedule"; exit 1; fi
echo "schedule: $SCHED_ID"

cleanup() {
  kd update "$SCHED_ID" -f "enabled=false" -f "force_close=true" >/dev/null 2>&1 || true
  AGENT=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.last_agent_id // empty')
  [ -n "$AGENT" ] && kd close "$AGENT" >/dev/null 2>&1 || true
  for id in "$SCHED_ID" "$DEC_ID" "$EPIC_ID"; do
    kd close "$id" >/dev/null 2>&1 || true
  done
}
trap cleanup EXIT

sleep 5

# ── Mutate: respond to the decision ────────────────────────────────
gb decision respond "$DEC_ID" --http-url "$BEADS_HTTP_URL" --select yes >/dev/null 2>&1 || \
  { fail "gb decision respond"; exit 1; }
echo "resolved decision $DEC_ID at $(date -u +%FT%TZ)"

DEADLINE=$(( $(date +%s) + 150 ))
FIRED=0
while [ "$(date +%s)" -lt "$DEADLINE" ]; do
  RAW=$(kd show "$SCHED_ID" --json 2>/dev/null)
  RS=$(echo "$RAW" | jq -r '.fields.runs_spawned // "0"')
  LA=$(echo "$RAW" | jq -r '.fields.last_agent_id // empty')
  if [ "${RS:-0}" -ge 1 ] 2>/dev/null || [ -n "$LA" ]; then
    FIRED=1
    pass "gardener fired on decision_resolved (runs_spawned=$RS)"
    break
  fi
  sleep 5
done

if [ "$FIRED" = "0" ]; then
  fail "gardener did not fire within 150s of decision response"
  kd show "$SCHED_ID" 2>/dev/null | head -40 || true
  exit 1
fi

echo ""
echo "=== Results: $PASS passed, $FAIL failed ==="
if [ $FAIL -gt 0 ]; then printf "Failures:%b\\n" "$ERRORS"; exit 1; fi
echo "gardener-trigger-decision-resolved-match OK."
exit 0
""" } }
]

[default]
say = "gardener-trigger-decision-resolved-match scenario complete."

[tools]
mode = "live"

[tools.Bash]
approve = true

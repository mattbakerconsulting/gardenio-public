# gardener-trigger-fan-in-cron-precedence.toml
#
# Live-flow scenario for ka-0000002765 §11: fan-in — cron AND bead_event
# entries both eligible in the same reconcile tick → gardener fires
# exactly once (cron entry wins per ordering precedence at
# triggers.go:441-442).
#
# Engine code covered:
#   - gardenio/controller/internal/scheduler/triggers.go:447-484
#     (evaluateTriggerSet iterates entries in order; first FireDecision
#     with Fire=true short-circuits — proves "one fire per tick").
#   - gardenio/controller/internal/scheduler/triggers.go:440-442
#     (header comment: cron entries take precedence over event entries).
#   - gardenio/controller/internal/scheduler/scheduler.go:213-440
#     (Reconcile commits exactly one SpawnRun per pass).
#
# Setup: cron='* * * * *' (eligible every minute) AND bead_event match
# parent. Within one reconcile pass, both entries are evaluable. The
# returned FireDecision must come from the cron entry (kind="cron"),
# and runs_spawned must advance by exactly 1 — not 2 — across the tick.

[claude]
session_id = "e2e00000-000c-4000-a000-00000000000b"
username = "e2e-gardener-fan-in-cron"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 240000

[[responses]]
on = "*"
say = "Running gardener-trigger-fan-in-cron-precedence: cron+event same tick → 1 fire."
tools = [
  { call = "Bash", input = { command = """set -u
PASS=0; FAIL=0; ERRORS=""

pass() { PASS=$((PASS + 1)); echo "PASS: $1"; }
fail() { FAIL=$((FAIL + 1)); ERRORS="$ERRORS\\n  - $1${2:+ — $2}"; echo "FAIL: $1${2:+ — $2}"; }

if ! command -v kd >/dev/null 2>&1; then echo "SKIP: kd not present"; exit 0; fi
if [ -z "${BEADS_HTTP_URL:-}" ] || [ -z "${BEADS_TOKEN:-}" ]; then
  echo "SKIP: BEADS_HTTP_URL/BEADS_TOKEN unset"; exit 0
fi

TAG="e2e-cfan-$$-$(date +%s)"

EPIC_ID=$(kd create "gardener-fan-in-epic-$TAG" --type=epic -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$EPIC_ID" ]; then fail "create epic"; exit 1; fi
# Pre-create a child task so cron's preflight ("at least 1 open child")
# evaluates to allow.
CHILD_ID=$(kd create "fan-in-child-$TAG" --type=task -l "e2e:claudeless" -l "e2e-tag:$TAG" --json 2>&1 | jq -r '.id // empty')
if [ -z "$CHILD_ID" ]; then fail "create child"; exit 1; fi
kd dep add "$CHILD_ID" "$EPIC_ID" --type parent-child >/dev/null 2>&1 || true

# Both entries are eligible per tick:
#   • cron='* * * * *' fires whenever last_run < the most recent minute
#   • bead_event closed match parent fires when we close the child
TRIGGERS=$(cat <<JSON
[
  {"kind":"cron","cron":"* * * * *","timezone":"UTC"},
  {"kind":"bead_event","events":["closed"],
   "match":{"all":[{"field":"parent","op":"==","value":"$EPIC_ID"}]}}
]
JSON
)
# Cap loop_end on max_runs so the schedule auto-closes after one fire —
# guarantees we measure exactly the one tick. STOP slot evaluation runs
# AFTER fire bookkeeping each pass.
STOP='{"loop_end":{"any":[{"kind":"max_runs"}]},"run_end":{"any":[{"kind":"no_actionable_state"}]},"hard_stop":{"any":[{"kind":"manual_force","field":"force_close","value":"true"}]}}'

SCHED_ID=$(kd create "gardener-sched-$TAG" --type=schedule \
  -l "e2e:claudeless" -l "e2e-tag:$TAG" -l "role:gardener" -l "project:gardenio" \
  -f "enabled=true" -f "role=gardener" -f "assign_bead=$EPIC_ID" -f "project=gardenio" \
  -f "prompt=gardener test prompt" -f "max_runs=1" \
  -f "cron=* * * * *" -f "timezone=UTC" \
  -f "triggers=$TRIGGERS" -f "stop=$STOP" --json 2>&1 | jq -r '.id // empty')
if [ -z "$SCHED_ID" ]; then fail "create schedule"; exit 1; fi
echo "schedule: $SCHED_ID  (cron + bead_event both eligible per tick)"

cleanup() {
  kd update "$SCHED_ID" -f "enabled=false" -f "force_close=true" >/dev/null 2>&1 || true
  AGENT=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.last_agent_id // empty')
  [ -n "$AGENT" ] && kd close "$AGENT" >/dev/null 2>&1 || true
  for id in "$SCHED_ID" "$CHILD_ID" "$EPIC_ID"; do
    kd close "$id" >/dev/null 2>&1 || true
  done
}
trap cleanup EXIT

sleep 5

# Trigger the event side concurrently with the cron side becoming
# eligible: close the child early so the bead_event entry has a matching
# event waiting in the buffer when the next reconcile tick runs.
kd close "$CHILD_ID" >/dev/null 2>&1 || { fail "kd close child"; exit 1; }
echo "closed child $CHILD_ID at $(date -u +%FT%TZ)"

# Wait for the first fire.
DEADLINE=$(( $(date +%s) + 150 ))
GOT_FIRST=0
while [ "$(date +%s)" -lt "$DEADLINE" ]; do
  RS=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.runs_spawned // "0"')
  if [ "${RS:-0}" -ge 1 ] 2>/dev/null; then
    GOT_FIRST=1
    pass "first fire observed (runs_spawned=$RS)"
    break
  fi
  sleep 5
done
if [ "$GOT_FIRST" = "0" ]; then
  fail "no fire within 150s"
  kd show "$SCHED_ID" 2>/dev/null | head -40 || true
  exit 1
fi

# CRITICAL invariant: exactly ONE fire per reconcile pass even with both
# entries eligible. Verify runs_spawned is exactly 1 immediately after.
RS=$(kd show "$SCHED_ID" --json 2>/dev/null | jq -r '.fields.runs_spawned // "0"')
if [ "$RS" = "1" ]; then
  pass "fan-in produced exactly one fire (runs_spawned=1)"
else
  fail "fan-in over-fired same tick" "runs_spawned=$RS (expected 1)"
  exit 1
fi

echo ""
echo "=== Results: $PASS passed, $FAIL failed ==="
if [ $FAIL -gt 0 ]; then printf "Failures:%b\\n" "$ERRORS"; exit 1; fi
echo "gardener-trigger-fan-in-cron-precedence OK."
exit 0
""" } }
]

[default]
say = "gardener-trigger-fan-in-cron-precedence scenario complete."

[tools]
mode = "live"

[tools.Bash]
approve = true

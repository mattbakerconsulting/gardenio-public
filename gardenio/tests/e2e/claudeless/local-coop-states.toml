# local-coop-states.toml
#
# Claudeless scenario for the coop integration tests in
# gardenio/tests/e2e/scripts/test-coop-local-mode.sh.
#
# Unlike the lifecycle/local-* scenarios (run via `gb agent start --local`),
# this scenario is fed directly to a bare `coop -- claudeless --scenario=...`
# invocation. The shell test exercises coop's HTTP control plane:
#   * GET  /api/v1/agent      — state detection (idle/working/prompt)
#   * POST /api/v1/agent/nudge — HTTP nudge injection
#   * POST /api/v1/agent/respond — answering a prompt
# and the attach/detach/re-attach cycle via tmux.
#
# Response blocks are matched in order, one per prompt-like input claudeless
# sees. The shell test feeds inputs in the same order:
#   Block 1: initial prompt at coop startup            → idle ack
#   Block 2: first HTTP nudge                          → idle ack
#   Block 3: second HTTP nudge → AskUserQuestion       → prompt
#   Block 4: respond to the question (answer is fed as
#            the next prompt)                          → idle

# Local-mode startup prompt for `gb agent start --local` lives in the
# sidecar local-coop-states.startup-prompt.txt next to this file
# (claudeless rejects unknown TOML keys).

[[responses]]
on = "*"
say = "Coop integration test scenario online."
max = 1

[[responses]]
on = "*"
say = "First nudge received. Idle reply."
max = 1

[[responses]]
on = "*"
say = "Asking a question now."
max = 1
[[responses.tools]]
call = "AskUserQuestion"
input = { questions = [{ question = "Continue?", header = "Q", options = [{ label = "Yes", description = "proceed" }, { label = "No", description = "abort" }], multiSelect = false }] }

[[responses]]
on = "*"
say = "Answer received. Standing by."

[tools]
mode = "live"

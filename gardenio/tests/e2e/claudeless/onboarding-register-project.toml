# onboarding-register-project.toml
#
# Claudeless scenario: a local agent works a poured register-project molecule
# (gardenio/formulas/onboarding/register-project.json) up to its first gate.
#
#   1. the runner, as the person, has closed the sign-in manual gate
#   2. claim check-setup and list-accounts, run what each names, close them
#   3. stop at the pick-account decision gate without touching it
#
# Driven by test-onboarding-formulas.sh, which pours the molecule, exports
# ONBOARD_MOLECULE / ONBOARD_STATE_DIR / ONBOARD_AGENT_STEP, runs
# `gb agent start --local --test-scenario=onboarding-register-project`, and then
# checks from the outside which steps this agent closed and that the gate is
# the molecule's whole ready frontier. Each tool call goes through
# scripts/onboarding-agent-step.sh, which refuses to claim a gate or a step
# outside the ready set and records the scenario verdict.
#
# The startup prompt and follow-up nudges live in the sidecars
# onboarding-register-project.startup-prompt.txt and .nudges.txt. claudeless picks
# the first [[responses]] whose `contains` matches, so every nudge carries
# exactly one phase keyword.

[claude]
session_id = "e2e00000-0005-4000-a000-000000000001"
username = "e2e-onboarding-register-project"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 15000

# ── Startup: find the molecule's ready steps ────────────────────────
[[responses]]
on = { contains = "gb ready" }
say = "Checking the onboarding molecule for ready steps."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" ready'

# ── check-setup and list-accounts: claim, run, close ────────────────
[[responses]]
on = { contains = "Claim check-setup" }
say = "Claiming the check-setup step."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" claim check-setup'

[[responses]]
on = { contains = "Run check-setup" }
say = "Checking the tools, daemon and git remote."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '''"$ONBOARD_AGENT_STEP" run check-setup "kd --version && gb --version && gb ping && git remote get-url origin"'''

[[responses]]
on = { contains = "Close check-setup" }
say = "Closing the check-setup step."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" close check-setup'

[[responses]]
on = { contains = "Claim list-accounts" }
say = "Claiming the list-accounts step."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" claim list-accounts'

[[responses]]
on = { contains = "Run list-accounts" }
say = "Listing the account beads."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '''"$ONBOARD_AGENT_STEP" run list-accounts "kd list --type account"'''

[[responses]]
on = { contains = "Close list-accounts" }
say = "Closing the list-accounts step."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" close list-accounts'

# ── Gate ────────────────────────────────────────────────────────────
[[responses]]
on = { contains = "the gate" }
say = "Only the pick-account decision is left; that is the person's call."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" gate'

# ── Stop ────────────────────────────────────────────────────────────
[[responses]]
on = { contains = "stop" }
say = "Stopping at the gate."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = '"$ONBOARD_AGENT_STEP" verdict; gb stop 2>&1 || true'

# ── Fallback ────────────────────────────────────────────────────────
[default]
say = "Onboarding register-project scenario idle. Ready for the next step."

# ── Tool config ─────────────────────────────────────────────────────
[tools]
mode = "live"

[tools.Bash]
approve = true

# agent-crew-lifecycle.toml
#
# Claudeless scenario: Full crew agent lifecycle — startup, work loop, shutdown
#
# This scenario simulates the complete crew agent lifecycle:
#   1. Agent starts, SessionStart hooks fire (prime, check-mail)
#   2. Agent checks for work via gb ready
#   3. Agent claims a task via kd claim
#   4. Agent does work (simulated with Bash tool calls)
#   5. Agent closes the task via kd close
#   6. Agent checks for more work, finds none
#   7. Agent calls gb done to signal completion
#
# The hook calls use live mode so real gb/kd commands execute against
# the E2E beads server. The pre-assigned task must exist before running.
#
# Run via: tests/e2e/scripts/test-agent-crew-lifecycle.sh (wraps claudeless)

[claude]
session_id = "e2e00000-0002-4000-a000-000000000001"
username = "e2e-crew"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[claude.timeouts]
hook_timeout_ms = 15000

# ── Phase 1: Startup — agent receives priming context ──────────────
# SessionStart hook fires prime.sh → gb prime, then check-mail.sh
# The agent sees workflow context and its assignment.

[[responses]]
on = { contains = "gb ready" }
say = "I see my workflow context. Let me check for available work using gb ready."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = "gb ready 2>&1 || true"

# ── Phase 2: Claim task ────────────────────────────────────────────
# Agent finds a task and claims it.

[[responses]]
on = { contains = "claim" }
say = "Found a task. Let me claim it."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = "echo 'Simulated claim: task claimed successfully'"

# ── Phase 3: Do work ──────────────────────────────────────────────
# Agent simulates doing work on the claimed task.

[[responses]]
on = { contains = "work" }
say = "Working on the task now. Let me make the changes."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = "echo 'Work complete: changes committed and pushed'"

# ── Phase 4: Close task ───────────────────────────────────────────
# Agent closes the completed task.

[[responses]]
on = { contains = "close" }
say = "Task complete. Closing the bead."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = "echo 'Task closed successfully'"

# ── Phase 5: Check for more work ─────────────────────────────────
# Agent checks gb ready again, finds nothing.

[[responses]]
on = { contains = "more" }
say = "Let me check if there's more work available."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = "echo 'No more tasks available'"

# ── Phase 6: Signal done ─────────────────────────────────────────
# Agent calls gb done to signal completion.

[[responses]]
on = { contains = "done" }
say = "No more work available. Calling gb done to signal completion."
[[responses.tools]]
call = "Bash"
[responses.tools.input]
command = "echo 'gb done: session complete'"

# ── Fallback ──────────────────────────────────────────────────────
[default]
say = "I'm a crew agent running the lifecycle test. Ready for the next step."

# ── Tool config ───────────────────────────────────────────────────
[tools]
mode = "live"

[tools.Bash]
approve = true

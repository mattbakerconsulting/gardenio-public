# Pinned versions for the repo's security scanners.
#
# This is the SINGLE source of truth for every security-scanner version the CI
# pipeline installs — extracted from the previously inline pins so a bump lives
# in exactly one place (bundle ka-0000005053 §2.3; the gitleaks 8.21.2 pin was
# migrated out of the inline `gitleaks-bin` task in .rwx/ci.yml).
#
# Shell-sourceable (KEY=VALUE, no spaces) so a `. gardenio/locks/security-tools.lock` in a
# CI task pulls every pin, and RWX `filter:` on this file invalidates the tool
# caches when a version changes — mirrors gardenio/locks/helm-security-tools.lock.
#
# `gb mr security-gate` ALSO parses this file: the machine-parseable
# `Security-Scan:` MR-description block records each scanner's version, and the
# gate rejects any MR whose recorded versions drift from these pins — so the
# lock is both the CI install manifest AND the validator's expected-version set.
# Keep the token before `_VERSION` matching the Security-Scan block scanner name
# (case-insensitive): gitleaks, govulncheck, osv-scanner (osv_scanner),
# cargo-audit (cargo_audit), cargo-deny (cargo_deny).

# Secret scanning (full git history) — CI / Gitleaks.
GITLEAKS_VERSION=8.21.2

# Go reachability vulnerability scanning — CI / Go-Vuln.
# Pinned by module version; installed via `go install golang.org/x/vuln/cmd/govulncheck@vX`.
GOVULNCHECK_VERSION=1.1.4

# OSV manifest/lockfile scanning (bun.lock surfaces) — CI / OSV-Scan.
# v2.x required: the text `bun.lock` format (lockfileVersion 1) is only parsed by
# osv-scanner v2+ (v1.9.x silently skips it as "could not determine extractor").
OSV_SCANNER_VERSION=2.3.8

# Rust dependency audit (RustSec advisories) — CI / Cargo-Audit.
# 0.22+ required: 0.21.x crashes parsing advisory-db entries with CVSS v4.0
# scores ("unsupported CVSS version: 4.0", e.g. RUSTSEC-2026-0146) — a tooling
# bug, not a coop finding.
CARGO_AUDIT_VERSION=0.22.2

# Rust dependency policy (licenses/bans/sources) — CI / Cargo-Deny.
CARGO_DENY_VERSION=0.16.4

# ── Checksums for the PREBUILT binaries ──────────────────────────────────────
#
# checks.yml's cargo-security job downloads these two as static musl binaries
# instead of building them with `cargo install`, which measured 199/200/278/418s
# — never once a no-op — because it runs on a different spot node every time.
# See that job's comment for the measurement.
#
# These are SHA256 of the release TARBALL, not of the binary inside it.
# Verified against upstream's own published .sha256 where one exists
# (cargo-deny publishes one; rustsec does not).
#
# BUMPING A VERSION ABOVE MEANS BUMPING ITS CHECKSUM HERE. The job verifies
# before extracting, so a stale checksum fails the download step loudly rather
# than silently scanning with the wrong tool. Get the new value with:
#   curl -sSfL <asset-url> | sha256sum
#
# Deliberately named _SHA256, not _VERSION: ParseSecurityToolsLock (gardenio/
# controller/internal/bridge/security_gate.go) anchors on `^(...)_VERSION=`
# exactly so an added variable never becomes a phantom scanner pin.
CARGO_AUDIT_SHA256=7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428
CARGO_DENY_SHA256=28b7f8e12df46a9ce186547e38278c851905fc4bda59a0cc57d2aade9fdf6962

# gitleaks linux tarballs, from gitleaks_<ver>_checksums.txt on the release.
# checks.yml verifies the x64 one before every install, and the agent image's
# clis.sh installs this same version and verifies both, so a crew's local scan
# runs the binary CI's gate runs (gd-H2ZTTWf8s8). Suffixes follow the agent
# image's pick_sha_alt.
GITLEAKS_SHA256_X86_64=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
GITLEAKS_SHA256_AARCH64=654c935542c89f565aabe7bf7c6c500830f116c114f0aeb509d2460c1ac2e6da

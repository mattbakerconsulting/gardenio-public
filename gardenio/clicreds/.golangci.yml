# Same settings as gardenio/controller/.golangci.yml: checks.yml lint-go runs
# `GOWORK=off golangci-lint run ./...` in this dir as its own matrix arm
# (gd-9DycTnzUo3), and both modules that `replace` this one lint it this way.
version: "2"

linters:
  disable:
    - errcheck
  enable:
    - funlen
    - gocyclo
  settings:
    # Function caps (gd-d29n0m678l), the "long" and "complex" of
    # gardenio/docs/code-reduction-targets.md. funlen counts body lines, two
    # fewer than code-size.sh's `func` line to closing brace, so 98 here is
    # "over 100 lines" there. Comments count, as they do there.
    funlen:
      lines: 98
      statements: -1
      ignore-comments: false
    gocyclo:
      min-complexity: 30
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST*"
  # The funcs already over a cap when the ratchet landed, each held to its
  # own cap instead. scripts/ratchets/func-baseline.py writes the block and it
  # may only shrink: run it after cutting a listed func; never add a rule by
  # hand. See "Ratchets" in gardenio/docs/code-reduction-targets.md.
  exclusions:
    rules:
      # BEGIN func-baseline (scripts/ratchets/func-baseline.py writes this block; it may only shrink)
      # funlen credstore/lifecycle_test.go TestLifecycle_LoginStoreUseRefreshLogoutRelogin 168 185
      - path: '^credstore/lifecycle_test\.go$'
        linters: [funlen]
        text: '^Function ''TestLifecycle_LoginStoreUseRefreshLogoutRelogin'' is too long \((?:[0-9]{1,2}|1[0-7][0-9]|18[0-4]|185) > '
      # END func-baseline

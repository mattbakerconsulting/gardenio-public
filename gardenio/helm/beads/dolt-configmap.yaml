# dolt sql-server config. Upstream contrib/k8s/dolt-statefulset.yaml passes
# flags (--port=3307 --max-connections=500); the timeouts and back_log the
# Dolt load lab settled on (memory dolt-perf-profile, 2026-09-18) are only
# reachable through a config file, so we mount one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dolt-config
  namespace: beads
  labels:
    app: dolt
    app.kubernetes.io/part-of: gas-city
data:
  config.yaml: |
    log_level: warning
    behavior:
      read_only: false
      autocommit: true
    listener:
      host: 0.0.0.0
      port: 3306
      max_connections: 512
      back_log: 50
      max_connections_timeout_millis: 5000
      read_timeout_millis: 120000
      write_timeout_millis: 120000
    data_dir: /var/lib/dolt
    # Prometheus endpoint off (port -1). The CLI's phone-home metrics are
    # disabled separately by `dolt config --global --add metrics.disabled true`
    # in the init container.
    metrics:
      host: ""
      port: -1

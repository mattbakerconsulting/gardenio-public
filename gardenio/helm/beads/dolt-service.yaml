# Upstream: gascity/contrib/k8s/dolt-service.yaml, port 3307 -> 3306 here
# (the ziti intercept is beads.ziti:3306; keep one number end to end).
apiVersion: v1
kind: Service
metadata:
  name: dolt
  namespace: beads
  labels:
    app: dolt
    app.kubernetes.io/part-of: gas-city
spec:
  type: ClusterIP
  selector:
    app: dolt
  ports:
  - name: mysql
    port: 3306
    targetPort: mysql
    protocol: TCP

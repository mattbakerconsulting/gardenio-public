# Staging area for `CALL DOLT_BACKUP('sync-url', 'file:///backups/<db>')`.
# The server writes here (the URL is on ITS filesystem); the CronJob pod
# mounts the same claim and mirrors it to S3. local-path binds the claim to
# the node the first consumer (the dolt pod) lands on.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dolt-backups
  namespace: beads
  labels:
    app: dolt
    app.kubernetes.io/part-of: gas-city
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi

# Dedicated namespace for the k3s API audit-log shipper (task gd-ZrPUxj8wyU).
#
# The gardenio release namespace enforces Pod Security `baseline`, which forbids
# hostPath, and the shipper must read the apiserver's audit file off the node. A
# namespace of its own, labelled PSA `privileged`, admits that without relaxing
# the namespace every other workload runs in. Only the shipper runs here.
#
# OPERATOR-APPLIED, deliberately not part of the gardenio Helm release: anyone who
# can create a pod in a privileged namespace can mount the host. The release
# deployer therefore has no rights here (and cannot create namespaces), so the
# autonomous release path can neither break nor abuse this. See README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: gardenio-audit
  labels:
    app.kubernetes.io/name: gardenio
    app.kubernetes.io/component: k3s-audit-shipper
    app.kubernetes.io/managed-by: operator-kubectl
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

# Egress for the shipper: DNS and vlsingle :9428, nothing else.
#
# NOT applied by default. NetworkPolicies are off on this cluster (the chart's
# networkPolicies.enabled is false); apply this file the day they are turned on,
# TOGETHER with the ingress carve-out on vlsingle described in README.md
# ("Residual risk"). Applying only one side blocks the shipper.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k3s-audit-shipper-egress
  namespace: gardenio-audit
  labels:
    app.kubernetes.io/name: gardenio
    app.kubernetes.io/component: k3s-audit-shipper
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gardenio
      app.kubernetes.io/component: k3s-audit-shipper
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gardenio
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gardenio
              app.kubernetes.io/component: vlsingle
      ports:
        - protocol: TCP
          port: 9428

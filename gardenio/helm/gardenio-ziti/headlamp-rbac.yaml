# What Headlamp (SA headlamp:headlamp) may do: the builtin `view` ClusterRole.
#
# WHY `view`. Headlamp has no login; whoever passes the edge acts as this
# ServiceAccount. It used to be bound (headlamp-readonly) to a ClusterRole with
# get/list/watch on `*`, which includes Secrets. `view` is the builtin
# read-only role: it does NOT grant Secrets (nor roles/bindings). The cost is
# visible in the UI: nodes, PersistentVolumes, CRDs and custom resources are
# not shown.
#
# Apply this BEFORE deleting the old binding, so Headlamp never has less
# than it needs (safe while it is still on ziti):
#   kubectl apply -f headlamp-rbac.yaml
#   kubectl delete clusterrolebinding headlamp-readonly
#   kubectl delete clusterrole headlamp-readonly
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp

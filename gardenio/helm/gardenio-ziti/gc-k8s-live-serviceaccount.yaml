# Dedicated ServiceAccount for the privileged k8s-live role (gd-KRHGbBJqRN
# step 1; role bead gd-gi5v71wMMo).
#
# WHY A SEPARATE SA AT ALL. k8s-live is the one role that carries
# needs_k8s_api=true — its agents get a ServiceAccount token and can create,
# exec into and delete pods in gc-dogfood. Today that capability rides on
# `gardenio-agent`, the SA EVERY agent pod uses, so the blast radius of the
# gc-dogfood RoleBinding is the entire fleet rather than the one role that
# needs it. This SA exists so that binding can be narrowed to a single
# identity.
#
# automountServiceAccountToken is FALSE at the SA level on purpose. The token
# is not a property of the identity, it is a property of the pod: podspec.go
# opts a pod in only when the role carries needs_k8s_api=true. Defaulting the
# mount on here would hand a token to anything that ever referenced this SA
# for an unrelated reason, which is exactly the coupling this task is undoing.
#
# ORDERING — this SA is inert until fimba-e6 binds it (step 2), and the role
# bead must NOT be pointed at it (step 3) before that binding exists. A
# k8s-live agent switched to an unbound SA does not fail loudly; it gets a
# token with no permissions and 403s on its first real k8s call, which reads
# as "the agent is broken" rather than "the RBAC step was skipped".
#
# THE HAZARD podspec.go NAMES, and why step 0 had to come first: an
# SA-scoped authorization elsewhere that is keyed on
# service_account=gardenio-agent (an OpenZiti broker allow-list, a
# NetworkPolicy, an admission policy) will still hold on first spawn and then
# 403 after a reconciler-driven recreation — hours later, after a node drain,
# not at deploy time. Anything keyed on the old SA must be explicitly decided
# for gc-k8s-live: add it, or exclude it deliberately.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gc-k8s-live
  namespace: gardenio
  labels:
    app.kubernetes.io/part-of: gardenio
    gardenio.io/role: k8s-live
  annotations:
    gardenio.io/purpose: >-
      Privileged k8s-live role only (role bead gd-gi5v71wMMo). Bound to
      gc-dogfood by the gc-dogfood-session-driver RoleBinding; must not be
      granted anything outside gc-dogfood.
automountServiceAccountToken: false

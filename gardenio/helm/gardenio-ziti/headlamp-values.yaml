# Headlamp (Kubernetes dashboard), helm release `headlamp` in namespace
# `headlamp` (plan ziti-to-keycloak S5, gd-duCuVLz5cU).
#
# Reachable only through the public edge (dashboard.clonk.tv, see
# public-edge.yaml) and, until the ziti switch-off (gd-xNMLrsgajy), the ziti
# name gardenio.dashboard.ziti. No Ingress and no HTTPRoute: the identity is the
# edge's (Keycloak sign-in, /gardenio-admins), Headlamp has no login of its
# own and acts as its ServiceAccount, which headlamp-rbac.yaml binds to the
# builtin `view` ClusterRole (no Secrets).
#
# Install / upgrade (README "Headlamp"):
#   helm upgrade headlamp headlamp/headlamp -n headlamp \
#     -f gardenio/helm/gardenio-ziti/headlamp-values.yaml \
#     --version <chart version from `helm list -n headlamp`>
replicaCount: 0  # 2026-10-23: ziti is off (S9c), the dashboard is unreachable; scaled to 0 so it does not pin a spot node (shape A)

config:
  inCluster: true
  inClusterContextName: main
  # No login: Headlamp acts as its own ServiceAccount (headlamp:headlamp).
  unsafeUseServiceAccountToken: true
  oidc:
    secret:
      create: false
  enableHelm: false
  watchPlugins: false

serviceAccount:
  create: true
  name: headlamp

# The chart's own cluster-admin binding stays off; headlamp-rbac.yaml binds
# the builtin `view` role instead.
clusterRoleBinding:
  create: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

httpRoute:
  enabled: false

persistentVolumeClaim:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  karpenter.sh/capacity-type: spot

tolerations:
  - key: gardenio.agent
    operator: Equal
    value: "true"
    effect: NoSchedule

# Who may reach Headlamp in-cluster. Headlamp has no login, so the only thing
# standing between a pod and the dashboard is this policy: pods in the
# `headlamp` namespace accept ingress only from the public edge (namespace
# public-edge, which has already passed the sign-in check). The ziti host pods
# (gardenio.dashboard.ziti) were the other peer until ziti was switched off
# (gd-xNMLrsgajy).
#
# Apply: kubectl apply -f headlamp-networkpolicy.yaml
# Rollback: kubectl delete -f headlamp-networkpolicy.yaml (restores open
# in-cluster reach).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: headlamp-ingress
  namespace: headlamp
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: public-edge}

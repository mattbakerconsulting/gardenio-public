  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr"]
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresh
  namespace: gardenio-e2e-0
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-token-refresh
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresh
    namespace: gardenio
---
apiVersion: rbac.authorization.k8s.io/v1

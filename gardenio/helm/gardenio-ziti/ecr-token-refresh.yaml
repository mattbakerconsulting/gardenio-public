---
# Same narrow rights again in ns gardenio-audit, where the k3s-audit-shipper
# DaemonSet runs (task gd-ZrPUxj8wyU). It needs its
# own namespace because it mounts a hostPath, which the gardenio namespace's PSA
# baseline forbids; imagePullSecrets are namespaced, so it needs its own `ecr`.
# The namespace and DaemonSet are operator-applied (helm/k3s-audit-shipper/), NOT
# part of the gardenio chart, so apply this Role/RoleBinding AFTER that namespace
# exists. The refresh loop below skips gardenio-audit while the namespace does not
# exist, so the CronJob can be applied first without failing the other
# namespaces' refresh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-token-refresh
  namespace: gardenio-audit
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr"]
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresh
  namespace: gardenio-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-token-refresh
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresh
    namespace: gardenio
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresh
  namespace: gardenio
  labels:
    app: ecr-token-refresh
    app.kubernetes.io/part-of: gardenio
spec:
  schedule: "0 */8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: ecr-token-refresh
            # P7 Task 6: mints the ECR pull token with the node role over IMDS.
            gardenio.io/imds: allow
        spec:
          serviceAccountName: ecr-token-refresh
          restartPolicy: OnFailure
          tolerations:
            - key: "gardenio.agent"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # Class from the gardenio chart (global.systemPriorityClass): image pulls depend on it,
          # so a crew burst cannot leave it Pending (gd-2qjxTVMBkC).
          priorityClassName: gardenio-infra
          containers:
            - name: refresh
              image: docker.io/amazon/aws-cli:2.22.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              env:
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: REGISTRY
                  value: "360190250083.dkr.ecr.us-east-1.amazonaws.com"
                - name: HOME
                  value: /tmp
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Token comes from the node role via IMDS; nothing is stored.
                  PASS="$(aws ecr get-login-password)"
                  AUTH="$(printf 'AWS:%s' "$PASS" | base64 -w0)"
                  printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$AUTH" > /tmp/dockerconfig.json
                  API=https://kubernetes.default.svc
                  SA=/var/run/secrets/kubernetes.io/serviceaccount
                  TOKEN="$(cat $SA/token)"
                  B64="$(base64 -w0 < /tmp/dockerconfig.json)"
                  BODY="$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"ecr"},"type":"kubernetes.io/dockerconfigjson","data":{".dockerconfigjson":"%s"}}' "$B64")"
                  # Every namespace that pulls from the ECR cache; imagePullSecrets
                  # are namespaced. claimlayer-demo pulls the ClaimLayer demo image
                  # (gd-NoOR0riqwi). ns ziti was here until S9c deleted it
                  # (2026-10-21): the PUT then 403'd, the job failed every run, and
                  # every namespace after it kept a dead token. A
                  # failure in ANY namespace fails the job — a half-written
                  # credential expires in 12h and surfaces as an
                  # ImagePullBackOff on a restart nobody connects to this job.
                  for NS in "$(cat $SA/namespace)" claimlayer-demo gardenio-e2e-0 gardenio-e2e-1 gardenio-audit; do
                    code=$(curl -sS -o /tmp/out -w '%{http_code}' --cacert $SA/ca.crt \
                      -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                      -X PUT "$API/api/v1/namespaces/$NS/secrets/ecr" -d "$BODY")
                    if [ "$code" = "404" ]; then
                      code=$(curl -sS -o /tmp/out -w '%{http_code}' --cacert $SA/ca.crt \
                        -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                        -X POST "$API/api/v1/namespaces/$NS/secrets" -d "$BODY")
                    fi
                    case "$code" in
                      200|201) echo "ecr pull secret refreshed in ns $NS (HTTP $code)";;
                      # gardenio-audit exists only once the operator has applied
                      # helm/k3s-audit-shipper/namespace.yaml. Until then both the PUT and the POST 404 on the missing
                      # namespace; skip rather than fail the other namespaces.
                      404) if [ "$NS" = "gardenio-audit" ]; then echo "ns $NS not found; skipping"; else echo "FAILED in ns $NS: HTTP $code"; head -c 400 /tmp/out; exit 1; fi;;
                      *) echo "FAILED in ns $NS: HTTP $code"; head -c 400 /tmp/out; exit 1;;
                    esac
                  done
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          volumes:
            - name: tmp
              emptyDir: {}

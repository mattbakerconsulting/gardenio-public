# Keeps an ECR imagePullSecret alive from the node's own IAM role.
#
# WHY THIS EXISTS
# k3s ships no AWS credential provider: there is no ecr-credential-provider
# binary on the nodes and no --image-credential-provider-config on the kubelet
# (verified 2026-09-18 on i-0123456789abcdef0). So granting the node role ECR
# permissions is NOT by itself enough to pull from ECR — containerd never
# consults IMDS for registry auth. A docker-registry Secret is still required.
#
# What the node-role grant DOES buy us is that the token can be minted from
# INSIDE the cluster, so no long-lived registry credential exists anywhere:
# this CronJob calls `aws ecr get-login-password` against IMDS (node role
# gardenio-k3s, Sid EcrAuth) and rewrites the Secret in place. Verified: a pod
# on the platform pool resolves as
# arn:aws:sts::360190250083:assumed-role/gardenio-k3s/<instance-id> and the call
# succeeds.
#
# ECR authorization tokens last 12 hours. This runs every 8 to leave a margin
# for a failed run, and on startup (the Secret is created out-of-band once so
# the first pull does not wait for the first tick).
#
# THE ALTERNATIVE, and why not: installing the ECR credential provider on the
# nodes would remove the Secret entirely, but it is a node-image change (a
# binary plus kubelet flags in user-data) and therefore terraform's lane. If
# that ever lands, delete this CronJob and drop `ecr` from imagePullSecrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresh
  namespace: gardenio
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-token-refresh
  namespace: gardenio
rules:
  # Scoped to the one Secret it rewrites. resourceNames cannot be used with
  # `create`, so create is granted at the type level and every other verb is
  # pinned to the single object.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr"]
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresh
  namespace: gardenio
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-token-refresh
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresh
    namespace: gardenio
---

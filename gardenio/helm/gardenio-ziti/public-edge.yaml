        limit_req_status 429;
        limit_except GET POST { deny all; }
        auth_request /oauth2/auth-lands-demo;
        error_page 401 = @signin;
        auth_request_set $edge_email  $upstream_http_x_auth_request_email;
        auth_request_set $edge_token  $upstream_http_x_auth_request_access_token;
        auth_request_set $edge_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $edge_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;

        set $up_viewer viewer-authproxy.gardenio.svc.cluster.local:8097;
        proxy_pass http://$up_viewer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        # The edge's values overwrite anything the client sent.
        proxy_set_header X-Auth-Request-Email        $edge_email;
        proxy_set_header X-Auth-Request-Access-Token $edge_token;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email    "";
        proxy_set_header Authorization "";
      }


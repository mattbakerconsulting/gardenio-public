# Public HTTPS edge: the ONLY thing on gardenio that answers the internet on
# 443 for humans (decision gd-GbIgemW3dt, escalation gd-NoOR0riqwi).
#
#   claimlayer.clonk.tv  -> oauth2-proxy (claimlayer-demo) -> static demo
#   auth.clonk.tv        -> Keycloak, realm gardenio browser/OIDC paths, plus the realm
#                           admin console behind a sign-in check (oauth2-proxy, /gardenio-admins),
#                           and the one-click Become page (/gardenio/become/) behind the same check
#   grafana.clonk.tv     -> sign-in check (oauth2-proxy, /gardenio-admins) -> Grafana
#   dashboard.clonk.tv   -> sign-in check (oauth2-proxy, /gardenio-admins) -> Headlamp
#   gardenio.clonk.tv    -> sign-in check (same) -> viewer-authproxy :8097 -> beads-viewer
#   mux.clonk.tv         -> sign-in check (same) -> viewer-authproxy :8448 -> coopmux
#   api.clonk.tv         -> bearer-JWT check (oauth2-proxy, /gardenio-admins) -> beads daemon /v1/*
#                           /land/<name>/v1/* -> bearer-JWT check (/project-<name>) or, for a
#                             minted land token, land-token check (daemon GET /v1/me) -> daemon /v1/*
#                             (or the land's landgate, once $land_door_upstream names it)
#   hooks.clonk.tv       -> GitHub hooks IPs, POST only: /webhooks/ -> trigger-engine :8094,
#                           /webhook -> github-bridge :8101 (both verify the HMAC)
#   runners.clonk.tv     -> "Bearer gr_" + the daemon's runner routes only -> beads daemon /v1/*
#                           (plus POST /v1/runners/register, no bearer) -> daemon (runner bearer)
#   clonk.tv             -> GET/HEAD only, no sign-in -> the chart's landing Service (the splash)
#   www.clonk.tv         -> 301 https://clonk.tv$request_uri
#
# WHY NOT TRAEFIK. Traefik's 443 was the GitHub-hooks route (hooks.clonk.tv
# moved here on the cost plan, C4 gd-040vrRf2II), and the shared nodes SG
# (web_ingress_cidrs) was that route's allowlist: ServiceLB (klipper-lb)
# MASQUERADEs every connection, in Cluster AND Local traffic policy (read off the
# running klipper-lb v0.4.17 entry script), so Traefik never sees a client IP
# and an ipAllowList cannot work. Opening the shared 443 to the world would
# drop that allowlist and publish every Traefik route.
#
# So this edge has its own address: the nginx pod runs ON the ziti edge node
# with hostPort 443. That node has its own SG (terraform ziti_edge_web: 443
# from 0.0.0.0/0) and EIP, which claimlayer.clonk.tv and auth.clonk.tv point
# at. hostPort is CNI portmap DNAT with no SNAT, so nginx sees real client
# IPs. Traefik's svclb never runs there (the node's taint). NOT a ServiceLB
# pool: k3s only honours svccontroller lbpool once some node carries
# enablelb=true, and without it the svclb DaemonSet also targeted the three
# servers (it sat Pending there only because Traefik holds 443) -- tried and
# reverted 2026-10-11.
#
# grafana.clonk.tv is the first app behind the edge sign-in (plan
# ziti-to-keycloak S3, gd-iS4Uxv9tfN). Every request runs auth_request against
# oauth2-proxy (gardenio-forwardauth) with allowed_groups=/gardenio-admins: no
# session -> 302 to /oauth2/start on the same host; signed in but not an admin
# -> 403 from the edge. Grafana then does its own Keycloak login on top.
#
# gardenio.clonk.tv (plan ziti-to-keycloak S4, gd-UqhR5d6qPt) uses the same check,
# widened to also admit each /project-<name> group (plan project-scoped-humans,
# gd-4tvNth0mfq) and its land-role subgroups /project-<name>/owners and /guests,
# whose members are not in the parent (gd-A9avO8cXBr). kbeads scopes what they
# can read, this is only the coarse gate; `scripts/check-viewer-edge-groups.py
# --write` writes the list from the realm and the plain run fails the build on
# drift. The list also admits /lands-tenants (Lands Track B 7.8), the static
# group every Lands tenant joins, so a land created at runtime needs no edit
# here. It does not talk to the app directly: it goes through the edge-only listener
# of viewer-authproxy (8097), which trusts
# the identity headers set here and nothing else. That trust is the
# viewer-authproxy-ingress NetworkPolicy (only this namespace reaches those
# ports). The ziti listeners of viewer-authproxy are gone (gd-xNMLrsgajy), so
# this is the only way in. The exceptions to that sign-in check on this host:
#   - /slack/link/ (Slack account linking, gd-OZJ6H2S3xx) goes straight to
#     slack-bridge: the bridge's single-use state and the Keycloak sign-in it
#     starts are its authentication.
#   - /lands/ (the Lands front of house, Track B 7.8) admits the same groups
#     plus /invited (gd-ycE484kLyk): GitHub sign-in is invite-only (owner
#     ruling gd-hCMlZ5jnvB = b), and a person joins /invited when their email
#     invite is claimed. Anyone the viewer already admits still gets in, so
#     no member is locked out; a signed-in user in none of them gets a plain
#     "You need an invite" page. The demo land's door, = /lands/demo and
#     = /lands/accept, admits any signed-in account (gd-T37nCeWMhq = open) so
#     a stranger can take a demo pass. A signed-in user with no admitted group
#     who asks for anything else is sent to /lands/ instead of a 403. The landing
#     page, the three legal documents and their stylesheet need no session at
#     all. All of /lands/ is per-IP rate-limited (front_door_per_ip) before
#     any sign-in check.
#   - /w/ (the Window, plan gd-pz87vf3xsB PW.5) needs no session: the link
#     /w/<token> is the credential, which only kbeads judges. Read-only,
#     rate-limited like /lands/ and capped per IP, and the token is written
#     as /w/- in the access log (every server on this edge logs "redacted").
#
# dashboard.clonk.tv is Headlamp (plan ziti-to-keycloak S5, gd-duCuVLz5cU), same
# sign-in check. Headlamp has no login: it acts as its ServiceAccount, bound to
# the builtin `view` role (no Secrets; headlamp-rbac.yaml), and a NetworkPolicy
# (headlamp-networkpolicy.yaml) lets only this namespace reach it.
#
# api.clonk.tv is the beads daemon API for kd and gb (plan ziti-to-keycloak S6,
# gd-FQJHYGAnjB). There is no cookie flow and no redirect: API clients get 401
# (no or bad bearer JWT) or 403 (valid JWT, not in /gardenio-admins) from the
# edge. oauth2-proxy runs with --skip-jwt-bearer-tokens, so it verifies the
# bearer JWT's signature, issuer and audience; the daemon verifies it again
# (go-oidc) and stamps operated_by_source=oidc. The static fleet/bridge/agent
# tokens (32-byte hex) are not JWTs and are refused at the edge. Only /v1/* and
# /health are proxied; token management, /v1/admin/, embeddings and the SSE
# stream are 404 here. Per-IP limit_req (429) sits before the sign-in check, so
# garbage tokens cost Keycloak's JWKS endpoint nothing beyond the burst.
#
# api.clonk.tv also carries the land door (Door D.2, owner decision
# gd-BTHHmA2rYc = edge-route): /land/<name>/v1/* is the daemon's /v1/* for a
# tenant's kd, gb or gl, behind the same bearer-JWT check but admitting only
# /project-<name> and its /owners and /guests (not /gardenio-admins), so a
# bearer for another land gets 403. The bearer passes through and kbeads
# scopes it; the SSE streams, token routes (including /v1/auth/refresh), admin
# routes, hooks and embeddings are 404 on the land path. A land is a path
# prefix, not a hostname, in v1 (a host per land is a later upgrade).
#
# The land door takes a second credential (Door D.18a gd-WTyoLCSMUp): the
# minted land token a tenant's laptop agent runs kd, gb and gl under (the
# 10.11 land principal, land-<name>). It is opaque, not a JWT, so oauth2-proxy
# cannot judge it: a bearer of that shape (one base64url segment, see
# $land_door_land_token) is checked instead by the daemon itself, GET /v1/me
# with X-Land-Door, which answers 200 only for this land's land principal or
# a per-agent token bound to this land (gd-mh9ANzCHIE: it writes only its own
# agent bead). A JWT, or anything else, takes the bearer-JWT check as before.
#
# auth.clonk.tv is per-IP rate-limited too (auth_per_ip, Track B 7.8: GitHub is
# the only bot filter at registration), except the back-channel endpoints the
# cluster itself calls through this host (see auth_limit_key).
#
# Pod Security: hostPort is outside "baseline", so this namespace enforces
# privileged with audit/warn at restricted. The pod itself is otherwise
# restricted-clean (non-root, no caps, RuntimeDefault seccomp, no SA token).
#
# runners.clonk.tv is the public runner listener (local-agents spec §4.3, plan
# gd-fwFefkDP4H, gd-T4eL6P5OtC): the k3s counterpart of the chart's Traefik
# route (templates/beads/runner-ingress.yaml), which cannot face the internet
# here for the reason above. A laptop runner's `gb runner` talks to the daemon
# through it with its own runner token. There is no sign-in check: the daemon
# judges the token. The edge forwards only a "Bearer gr_" request on a route in
# kbeads' runnerAllowedPatterns (runner_auth.go), each method-pinned, plus
# POST /v1/runners/register (an invite code, no bearer), and stamps
# X-Gardenio-Listener: runner so the daemon refuses any bearer that is not a
# runner token. Everything else is 404.
#
# clonk.tv is the public front door (plan gd-tLxfoaw366, route gd-Z3eh4eEJ87,
# gd-gQ8hZLd4AQ): the splash, a static page baked into the gardenio landing
# image (gardenio/images/landing, chart landing.page=image). It reads no bead
# and holds no session, so there is no sign-in check: GET and HEAD go to the
# landing Service with every credential the client sent stripped, anything
# else is 405. Its Request an invite and Sign in links go to gardenio.clonk.tv.
# www.clonk.tv only redirects to it.
#
# nginx serves only the eleven hosts below: unknown SNI is refused at the
# handshake, unknown Host gets 421.
#
# Keycloak exposure is an allowlist: /auth/realms/gardenio/ and
# /auth/resources/ (login page assets), open; and the gardenio realm's admin
# console with its admin API (/auth/admin/gardenio/console/,
# /auth/admin/realms/gardenio, GET /auth/admin/serverinfo and
# /auth/admin/realms), behind the /gardenio-admins sign-in check and then
# Keycloak's own admin token (owner decision gd-papvgFfwMf: admin impersonation
# V1 needs the console on this host). The Become page, /gardenio/become/, is
# static files behind the same sign-in check; it reaches Keycloak only through
# the console paths. /auth/admin/ (the master console), the
# master realm's console and API, every other realm's admin API and
# everything else are 404 here. Paths carrying "..", encoded dots/slashes,
# backslashes or ";" are refused before matching, so a path that nginx and
# Keycloak would normalise differently never reaches Keycloak.
#
# Apply: kubectl apply -f public-edge.yaml (the namespace first time round
# needs the Certificate to issue before the pod is Ready; DNS-01, ~1-2 min).
apiVersion: v1
kind: Namespace
metadata:
  name: public-edge
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-edge
  namespace: public-edge
spec:
  secretName: public-edge-tls
  issuerRef: {name: letsencrypt-dns01, kind: ClusterIssuer}
  dnsNames: [claimlayer.clonk.tv, auth.clonk.tv, grafana.clonk.tv, dashboard.clonk.tv, gardenio.clonk.tv, mux.clonk.tv, api.clonk.tv, hooks.clonk.tv, runners.clonk.tv, clonk.tv, www.clonk.tv]
  privateKey: {algorithm: ECDSA, size: 256, rotationPolicy: Always}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-edge
  namespace: public-edge
data:
  default.conf: |
    # Path part of the raw request (before "?") carrying traversal or
    # ambiguous encodings. Query strings are not checked: OIDC redirect_uri
    # values are legitimately percent-encoded there.
    map $request_uri $public_edge_bad_path {
      default 0;
      "~*^[^?]*(\.\.|%2e|%2f|%5c|\x5c|;)" 1;
    }

    # Grafana Live and Headlamp (pod logs, exec, watches) are WebSockets: send "Connection: upgrade" only on upgrades.
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      "";
    }

    # mux.clonk.tv only: refuse a cross-origin request. The edge session cookie
    # is SameSite=lax, which still rides along from any same-SITE page
    # (claimlayer/grafana/dashboard/gardenio/auth are all *.clonk.tv), and
    # coopmux allows any origin, so without this a script on one of them could
    # open wss://mux.clonk.tv/ws/mux and type into every agent. A WebSocket
    # handshake always carries Origin; "" is a plain same-origin navigation.
    map $http_origin $mux_bad_origin {
      default                0;
      "~."                   1;
      "https://mux.clonk.tv" 0;
    }

    # API host (api.clonk.tv): per-client-IP request limit, applied before the
    # sign-in check so unauthenticated garbage is cut off at the edge. The land
    # door (/land/<name>/v1/) shares it.
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

    # The land a /land/<name>/v1/ request names (Door D.2), read off the raw
    # request line. The sign-in subrequest sees the same $request_uri as its
    # parent, so this is how /oauth2/auth-land learns which /project-<name>
    # groups to require; the name pattern is the contract's LandName, so it
    # can never carry a "," or "&" into allowed_groups. Anything percent-
    # encoded or doubled in the prefix maps to "", which the land door 404s.
    map $request_uri $land_door_name {
      default "";
      "~^/land/(?<land_door_n>[a-z][a-z0-9-]{0,62})/v1/" $land_door_n;
    }

    # A land door bearer that is a minted land token (Door D.18a
    # gd-WTyoLCSMUp): one base64url segment, the shape of a 10.11 land
    # principal's token. It has no dot, so it can never be a JWT, and the
    # daemon can only resolve it as a registered token: sending it to the
    # land-token check never lets a Keycloak JWT skip oauth2-proxy's group
    # check. Every other Authorization (a JWT, a malformed one, none) maps to
    # 0 and goes to oauth2-proxy exactly as before. landgate classifies a
    # bearer with the same pattern (cmd/landgate gate.go landTokenBearer).
    map $http_authorization $land_door_land_token {
      default 0;
      "~^Bearer [A-Za-z0-9_-]+$" 1;
    }

    # The land door's route allowlist (Door D.18 gd-nvvTcZeBZD): the one
    # list is kbeads/internal/server/land_door_routes.txt, which kbeads and
    # landgate enforce too; the chart test holds these lines to it. A route
    # is METHOD and the decoded, merged $uri the daemon will route on, each
    # mux wildcard one path segment. Everything else under /land/ is 404.
    map "$request_method $uri" $land_door_route {
      default 0;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/plots$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/plots/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/crew$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/crew/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/whoami$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets/[^/]+$" 1;
      "~^PATCH /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets/[^/]+/comments$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets/[^/]+/close$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/tickets/[^/]+/reopen$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/search/tickets$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/decisions$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/decisions/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/decisions/[^/]+/resolve$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/decisions/[^/]+/cancel$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/decisions/[^/]+/comments$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/decisions/[^/]+/evidence/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/escalations$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/escalations$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/escalations/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/plans$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/plans/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/plans/[^/]+/answer$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/threads$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/threads/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/threads/[^/]+/messages$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/threads/[^/]+/messages$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/budget$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/budget/history$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/releases$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/releases/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/releases/[^/]+/deployments$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/events$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/agents$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/agents$" 1;
      "~^GET /land/[^/]+/v1/lands/v1/lands/[^/]+/agents/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/agents/[^/]+/refresh$" 1;
      "~^POST /land/[^/]+/v1/lands/v1/lands/[^/]+/agents/[^/]+/revoke$" 1;
      "~^GET /land/[^/]+/v1/me$" 1;
      "~^GET /land/[^/]+/v1/beads$" 1;
      "~^GET /land/[^/]+/v1/beads/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/batch/beads$" 1;
      "~^GET /land/[^/]+/v1/beads/[^/]+/dependencies$" 1;
      "~^GET /land/[^/]+/v1/beads/[^/]+/dependents$" 1;
      "~^GET /land/[^/]+/v1/beads/[^/]+/mentions$" 1;
      "~^GET /land/[^/]+/v1/beads/[^/]+/mentioned-by$" 1;
      "~^GET /land/[^/]+/v1/beads/[^/]+/comments$" 1;
      "~^POST /land/[^/]+/v1/search/semantic$" 1;
      "~^POST /land/[^/]+/v1/beads$" 1;
      "~^PATCH /land/[^/]+/v1/beads/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/beads/[^/]+/close$" 1;
      "~^POST /land/[^/]+/v1/beads/[^/]+/comments$" 1;
      "~^POST /land/[^/]+/v1/beads/[^/]+/dependencies$" 1;
      "~^DELETE /land/[^/]+/v1/beads/[^/]+/dependencies$" 1;
      "~^POST /land/[^/]+/v1/beads/[^/]+/labels$" 1;
      "~^DELETE /land/[^/]+/v1/beads/[^/]+/labels/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/agents/roster$" 1;
      "~^GET /land/[^/]+/v1/agents-by-name/[^/]+$" 1;
      "~^POST /land/[^/]+/v1/windows$" 1;
      "~^GET /land/[^/]+/v1/windows$" 1;
      "~^DELETE /land/[^/]+/v1/windows/[^/]+$" 1;
      "~^GET /land/[^/]+/v1/windows/preview$" 1;
    }

    # Where the land door forwards a land (landgate v0, gd-ParwLpmgID): the
    # land's own landgate once one runs (gardenio chart landgate.lands), the
    # daemon otherwise. Add a land here only after its landgate is Ready, and
    # only as `<name> gardenio-landgate-<name>.gardenio.svc.cluster.local:8080;`
    # (the chart test pins the shape, so a land can never be sent to another
    # land's gate).
    map $land_door_name $land_door_upstream {
      default gardenio-beads.gardenio.svc.cluster.local:8080;
      scopetest gardenio-landgate-scopetest.gardenio.svc.cluster.local:8080;
    }

    # runners.clonk.tv's route allowlist: kbeads' runnerAllowedPatterns
    # (kbeads/internal/server/runner_auth.go), the routes the daemon lets a
    # runner token call. The chart's Traefik route renders the same list
    # (templates/beads/runner-ingress.yaml); the chart test holds both to
    # runner_auth.go. A route is METHOD and the decoded, merged $uri the daemon
    # will route on, each mux wildcard one path segment ({name...} the rest
    # of the path). Everything else on the host is 404.
    map "$request_method $uri" $runner_route {
      default 0;
      "~^POST /v1/runners/[^/]+/heartbeat$" 1;
      "~^GET /v1/runners/[^/]+$" 1;
      "~^GET /v1/events/stream$" 1;
      "~^GET /v1/beads$" 1;
      "~^GET /v1/beads/[^/]+$" 1;
      "~^GET /v1/beads/[^/]+/comments$" 1;
      "~^GET /v1/beads/[^/]+/dependencies$" 1;
      "~^GET /v1/beads/[^/]+/dependents$" 1;
      "~^POST /v1/beads$" 1;
      "~^PATCH /v1/beads/[^/]+$" 1;
      "~^POST /v1/beads/[^/]+/close$" 1;
      "~^POST /v1/beads/[^/]+/comments$" 1;
      "~^POST /v1/hooks/emit$" 1;
      "~^POST /v1/escalations/[^/]+/result$" 1;
      "~^GET /v1/configs$" 1;
      "~^GET /v1/configs/.+$" 1;
      "~^GET /v1/me$" 1;
      "~^GET /v1/agents-by-name/[^/]+$" 1;
      "~^POST /v1/beads/[^/]+/dependencies$" 1;
      "~^DELETE /v1/beads/[^/]+/dependencies$" 1;
      "~^POST /v1/search/semantic$" 1;
      "~^GET /v1/escalations$" 1;
      "~^GET /v1/batch/beads$" 1;
      "~^POST /v1/beads/[^/]+/labels$" 1;
      "~^DELETE /v1/beads/[^/]+/labels/[^/]+$" 1;
      "~^POST /v1/agents/[^/]+/gates/[^/]+/satisfy$" 1;
    }

    # A runner bearer (runnerTokenPrefix "gr_", runners.go): the only
    # credential runners.clonk.tv forwards on those routes. The daemon still
    # looks the token up; this keeps every other bearer off the host.
    map $http_authorization $runner_bearer {
      default 0;
      "~^Bearer gr_" 1;
    }

    # runners.clonk.tv, per client IP, before anything reaches the daemon.
    # Runner routes: as the chart's Traefik route (average 20/s, burst 40).
    # Registration (spec §10: 10 an hour per IP): nginx's finest rate is one
    # a minute, so the edge lets 10 through at once and then one a minute;
    # the daemon's registerLimiter (runners.go) holds the hourly 10.
    limit_req_zone $binary_remote_addr zone=runner_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=runner_register_per_ip:10m rate=1r/m;

    # Front-door pages on gardenio.clonk.tv (Lands Track B 7.8): the pages a
    # visitor reaches with no session, or signed in with no admitted group.
    # Per client IP, applied before any sign-in check. Named for the class of
    # page, not for /lands/: every such location on this host shares it.
    limit_req_zone $binary_remote_addr zone=front_door_per_ip:10m rate=5r/s;
    # Requests in flight per client IP on the Window (^~ /w/, plan
    # gd-pz87vf3xsB PW.5), the one front-door page anyone holding a link can
    # load with no account.
    limit_conn_zone $binary_remote_addr zone=front_door_conn_per_ip:10m;

    # The access log never carries a window token (Window PW-D9): the link is
    # the credential. /w/<token>/rest is logged as /w/-/rest, query dropped.
    # Keyed on the normalised $uri, not the raw $request_uri, so every
    # spelling nginx routes to ^~ /w/ (//w/, /%77/) is caught. A Referer that
    # names a window is cut the same way (the page sends none, no-referrer).
    # The image's nginx.conf logs "main" (the full request line) at http
    # level, so every server below sets its own access_log with this format;
    # TestPublicEdge_WindowLocation fails the build on a server that does not.
    map $uri $log_uri {
      default                          $request_uri;
      "~^/w/[^/]*(?<log_window_rest>/[^?]*)?$" /w/-$log_window_rest;
    }
    map $http_referer $log_referer {
      default                  $http_referer;
      "~*^[a-z]+://[^/]*/+(w|%77)/" /w/-;
    }
    log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
                        '$status $body_bytes_sent "$log_referer" "$http_user_agent" "$http_x_forwarded_for"';

    # auth.clonk.tv: per client IP on the browser-facing realm paths (login,
    # GitHub broker, registration, login actions, resources). The back-channel
    # endpoints map to an empty key, which limit_req does not count: the
    # cluster calls them through this host from a few node addresses
    # (forwardauth's code redeem and cookie refresh, every OIDC verifier's
    # discovery and JWKS fetch, machine principals' client_credentials), so a
    # per-IP limit there would throttle every signed-in user at once.
    map $uri $auth_limit_key {
      default                                                                       $binary_remote_addr;
      "~^/auth/realms/gardenio/protocol/openid-connect/(token|certs|userinfo|token/introspect)$" "";
      "~^/auth/realms/gardenio/\.well-known/"                                       "";
    }
    limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=10r/s;

    # auth.clonk.tv /gardenio/become/?email=<tenant> (one-click Become,
    # gd-VIm9kMDswf) opened from another site: the page would turn the admin's
    # browser into that tenant on a click they never meant. Only the start
    # (any query) is checked: the return from Keycloak comes back on the
    # fragment with no query, and may come through GitHub's sign-in, which is
    # cross-site. Keyed on the whole query, not $arg_email: nginx matches arg
    # names undecoded, but become.js's URLSearchParams decodes them, so
    # ?%65mail= would get past an $arg_email check.
    map "$http_sec_fetch_site:$args" $become_cross_site {
      default          0;
      "~^cross-site:." 1;
    }

    # Upstreams are resolved per request (variables below), so nginx starts
    # even when a backend Service does not exist yet. 10.43.0.10 = kube-dns.
    resolver 10.43.0.10 valid=30s ipv6=off;

    server_tokens off;
    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:PUBEDGE:2m;
    ssl_session_timeout 1h;

    # Plain HTTP (hostPort 80): redirect-only. A browser that types a bare
    # name, or follows an http:// link, used to hang (nothing listened on 80).
    # Only the names this edge serves get a 301 to the same host over https;
    # anything else is closed without a response. No content, no proxying and
    # no sign-in happen on 80, and the edge probe accepts 80 only when it
    # answers exactly this way.
    server {
      listen 8080 default_server;
      server_name _;
      access_log /dev/stdout redacted;
      return 444;
    }

    server {
      listen 8080;
      server_name api.clonk.tv auth.clonk.tv claimlayer.clonk.tv clonk.tv dashboard.clonk.tv gardenio.clonk.tv grafana.clonk.tv hooks.clonk.tv mux.clonk.tv runners.clonk.tv www.clonk.tv;
      access_log /dev/stdout redacted;
      location / { return 301 https://$host$request_uri; }
    }

    # Anything that is not one of the names below.
    server {
      listen 8443 ssl default_server;
      http2 on;
      server_name _;
      access_log /dev/stdout redacted;
      ssl_reject_handshake on;
      return 421;
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name claimlayer.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }

      location / {
        set $up_demo claimlayer-demo-auth.claimlayer-demo.svc.cluster.local:80;
        proxy_pass http://$up_demo;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
      }
    }

    # clonk.tv: the splash from the landing Service (see the header). No
    # sign-in and no session: GET and HEAD only, per-IP rate-limited like the
    # front-door pages on gardenio.clonk.tv, and nothing of the client's
    # session reaches the landing nginx. The landing image sets the caching
    # (index.html no-cache, the ?v=<hash> assets a year).
    server {
      listen 8443 ssl;
      http2 on;
      server_name clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }

      location / {
        limit_req zone=front_door_per_ip burst=20 nodelay;
        limit_req_status 429;

        set $up_landing gardenio-landing.gardenio.svc.cluster.local:80;
        proxy_pass http://$up_landing;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Cookie                      "";
        proxy_set_header Authorization               "";
        proxy_set_header X-Auth-Request-Email        "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Auth-Request-User         "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email           "";
      }
    }

    # www.clonk.tv: redirect only, to the apex on the same path.
    server {
      listen 8443 ssl;
      http2 on;
      server_name www.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }

      location / { return 301 https://clonk.tv$request_uri; }
    }

    # hooks.clonk.tv: GitHub App webhook deliveries (cost plan 2026-10-21 C4;
    # was Traefik on the servers' public IPs). No sign-in: trigger-engine
    # (/webhooks/) and github-bridge (/webhook, gd-blqlgxJmap) verify each
    # delivery's HMAC. Defence in depth: only GitHub's `hooks`
    # IPv4 ranges (`gh api meta --jq .hooks`, 2026-10-11; re-check on failed
    # deliveries) and only POST. The edge pod sees the real client address
    # (hostPort, no SNAT), as the per-IP limits above rely on.
    server {
      listen 8443 ssl;
      http2 on;
      server_name hooks.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      location /webhooks/ {
        allow 192.30.252.0/22;
        allow 185.199.108.0/22;
        allow 140.82.112.0/20;
        allow 143.55.64.0/20;
        allow 9.234.98.160/28;
        allow 9.234.98.176/28;
        allow 9.234.106.48/28;
        deny all;
        limit_except POST { deny all; }
        client_max_body_size 25m;
        set $up_hooks gardenio-trigger-engine.gardenio.svc.cluster.local:8094;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$up_hooks;
      }
      # The gardenio-io App webhook (wake on CI). The chart's github-bridge
      # IngressRoute is on Traefik, which no DNS name reaches.
      location = /webhook {
        allow 192.30.252.0/22;
        allow 185.199.108.0/22;
        allow 140.82.112.0/20;
        allow 143.55.64.0/20;
        allow 9.234.98.160/28;
        allow 9.234.98.176/28;
        allow 9.234.106.48/28;
        deny all;
        limit_except POST { deny all; }
        client_max_body_size 25m;
        set $up_ghbridge gardenio-github-bridge.gardenio.svc.cluster.local:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$up_ghbridge;
      }
      location / { return 404; }
    }

    # runners.clonk.tv: the public runner listener (see the header). No
    # sign-in check and no redirect: the runner token is the credential, and
    # the daemon judges it. The two forwarding locations each set everything
    # they need (nginx does not inherit proxy_set_header into a location that
    # sets its own).
    server {
      listen 8443 ssl;
      http2 on;
      server_name runners.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }
      # Bead descriptions and comment bodies can be large.
      client_max_body_size 8m;

      # Registration: an invite code in the body, no bearer yet. POST only.
      location = /v1/runners/register {
        if ($request_method != POST) { return 404; }
        limit_req zone=runner_register_per_ip burst=9 nodelay;
        limit_req_status 429;

        set $up_runner_beads gardenio-beads.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_runner_beads;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # Overwrites any client-sent value: on this listener the daemon
        # refuses every bearer but a runner token (runnerAuthMiddleware).
        proxy_set_header X-Gardenio-Listener runner;
        # Nothing from the internet may name an identity, a land or an edge
        # envelope; the runner's own Authorization goes through.
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Actor                 "";
        proxy_set_header X-Fleet                 "";
        proxy_set_header X-System-Operator       "";
        proxy_set_header X-Owner-Override        "";
        proxy_set_header X-Operated-By           "";
        proxy_set_header X-Edge-Auth-Ts          "";
        proxy_set_header X-Edge-Auth-Sig         "";
        proxy_set_header X-Edge-Auth-Version     "";
        proxy_set_header X-Auth-Request-User     "";
        proxy_set_header X-Auth-Request-Email    "";
        proxy_set_header X-Auth-Request-Groups   "";
        proxy_set_header X-Land-Door             "";
      }

      # The runner routes: a runner bearer on a route in $runner_route, or
      # 404 (before the rate limit counts it). The event stream is
      # Server-Sent Events, so nothing is buffered.
      location ^~ /v1/ {
        if ($runner_route = 0) { return 404; }
        if ($runner_bearer = 0) { return 404; }
        limit_req zone=runner_per_ip burst=40 nodelay;
        limit_req_status 429;

        set $up_runner_beads gardenio-beads.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_runner_beads;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Gardenio-Listener runner;
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Actor                 "";
        proxy_set_header X-Fleet                 "";
        proxy_set_header X-System-Operator       "";
        proxy_set_header X-Owner-Override        "";
        proxy_set_header X-Operated-By           "";
        proxy_set_header X-Edge-Auth-Ts          "";
        proxy_set_header X-Edge-Auth-Sig         "";
        proxy_set_header X-Edge-Auth-Version     "";
        proxy_set_header X-Auth-Request-User     "";
        proxy_set_header X-Auth-Request-Email    "";
        proxy_set_header X-Auth-Request-Groups   "";
        proxy_set_header X-Land-Door             "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
      }

      # /health, /metrics, every other path.
      location / { return 404; }
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name auth.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }
      # Inherited by every block below. A login page is one document plus
      # ~10 resources, so the burst covers a few page loads at once.
      limit_req zone=auth_per_ip burst=40 nodelay;
      limit_req_status 429;

      location ^~ /auth/realms/gardenio/ {
        set $up_kc gardenio-keycloak-runtime.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_kc;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $remote_addr;
      }

      location ^~ /auth/resources/ {
        limit_except GET HEAD { deny all; }
        set $up_kc gardenio-keycloak-runtime.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_kc;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
      }

      # Sign-in round trip (start, callback, sign_out) on this host, for the
      # realm admin console below only.
      location ^~ /oauth2/ {
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa;
        proxy_set_header Host                    $host;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Forwarded-For         $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization           "";
      }

      # Internal: a client cannot call it directly and read its headers. A 403
      # (signed in, not in /gardenio-admins) passes through as 403.
      location = /oauth2/auth {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: the console's own bearer
        # (or a forged one) would otherwise stand in for the cookie session.
        proxy_set_header Authorization     "";
      }

      location @signin {
        if ($edge_signin_scripted) { return 401; }
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
      }

      # The gardenio realm's admin console and the admin API it calls (owner
      # decision gd-papvgFfwMf), for Users > <user> > Impersonate
      # (gardenio/docs/lands/admin-impersonation.md). It must be served on this
      # host: Keycloak sets the impersonated session's cookie on the host the
      # console was loaded from. Two checks: the edge sign-in above
      # (/gardenio-admins), then Keycloak's own admin token, which the console
      # sends as Authorization and which therefore passes through to Keycloak.
      # A gardenio-realm token can manage only the gardenio realm, and the
      # master realm's console and API stay 404 (location / below).
      location ~ ^/auth/admin/(gardenio/console|realms/gardenio)(/.*)?$ {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $edge_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $edge_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;
        set $up_kc gardenio-keycloak-runtime.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_kc;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $remote_addr;
      }

      # Two read-only endpoints outside the realm path that the console calls
      # on load: the server info, and the realm list (Keycloak answers only the
      # realms the token may see, so gardenio). Same two checks.
      location ~ ^/auth/admin/(serverinfo|realms)$ {
        limit_except GET HEAD { deny all; }
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $edge_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $edge_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;
        set $up_kc gardenio-keycloak-runtime.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_kc;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header X-Forwarded-For   $remote_addr;
      }

      # One-click Become (plan gd-0SUIdKXWV3, gd-VIm9kMDswf): a static page
      # (ConfigMap public-edge-become below) that signs the admin in to the
      # public client gardenio-become and calls the realm admin API's
      # impersonation endpoint, same origin, through the console locations
      # above. It must be on this host for the same reason as the console. The
      # same /gardenio-admins sign-in check; Keycloak's admin API is still the
      # real gate (the role and the client's scope). Read-only, no store, and
      # a CSP that runs only this page's own script and lets it call only this
      # host.
      location = /gardenio/become {
        return 301 https://$host/gardenio/become/$is_args$args;
      }
      location ^~ /gardenio/become/ {
        limit_except GET HEAD { deny all; }
        error_page 429 = @become_busy;
        if ($become_cross_site) { return 403 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Start Become from /garden</title></head><body><main><h1>Start Become from /garden</h1><p>This link was opened from another site, so it did not run. Continue only if you meant to become this tenant.</p><p><a href="">Continue</a> &middot; <a href="https://gardenio.clonk.tv/garden">Back to /garden</a></p></main></body></html>'; }
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $edge_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $edge_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
          text/html       html;
          text/javascript js;
          text/css        css;
        }
        default_type text/html;
        alias /usr/share/nginx/become/;
        index index.html;
      }
      location @become_busy {
        default_type text/html;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Retry-After 60 always;
        return 429 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Too many requests</title></head><body><main><h1>Too many requests</h1><p>auth.clonk.tv is limiting requests from your address. Wait a minute, then open Become again from /garden.</p><p><a href="https://gardenio.clonk.tv/garden">Back to /garden</a></p></main></body></html>';
      }

      # Edge-probe positive control (plan ziti-to-keycloak, Task 1). Open on
      # purpose and harmless: the external probes must classify it OPEN, or
      # the probes themselves are broken. Never serve anything else here.
      location = /__edge_canary {
        default_type text/plain;
        return 200 "edge-canary-open\n";
      }

      # /auth/admin/ (the master console), /auth/admin/master/,
      # /auth/admin/realms/<any other realm>/, /auth/realms/master, metrics,
      # health, everything else.
      location / { return 404; }
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name grafana.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }

      # Sign-in round trip (start, callback, sign_out) on this host.
      location ^~ /oauth2/ {
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa;
        proxy_set_header Host                    $host;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Forwarded-For         $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization           "";
      }

      # Internal: a client cannot call it directly and read its headers. A 403
      # (signed in, not in /gardenio-admins) passes through as 403.
      location = /oauth2/auth {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: a client-sent bearer JWT
        # would otherwise sign the request in without a cookie session.
        proxy_set_header Authorization     "";
      }

      location @signin {
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
      }

      # nginx does not inherit proxy_set_header into a location that sets its
      # own, so this location sets everything it needs.
      location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $edge_email $upstream_http_x_auth_request_email;

        # Expire Grafana's own session cookies (gd-JXjqvnKU8u). Grafana's OIDC
        # login (on 10-12 to 10-19) left grafana_session and
        # grafana_session_expiry in browsers for up to 30 days. Grafana 11.4's
        # frontend sees the expiry cookie, POSTs /api/user/auth-tokens/rotate,
        # gets 401 "user token not found" (auth-proxy users have no token, and
        # that 401 deletes no cookie) and reloads the page: forever, in every
        # garden and /costs frame. Auth proxy issues no such cookie, so nothing
        # valid is lost. Delete these lines only if Grafana ever turns on
        # auth.proxy enable_login_token or its own login again.
        # add_header here stops the server-level HSTS inheriting, so restate it.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Set-Cookie "grafana_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;
        add_header Set-Cookie "grafana_session_expiry=; Path=/; Max-Age=0; Secure; SameSite=Lax" always;

        set $up_grafana gardenio-grafana.gardenio.svc.cluster.local:3000;
        proxy_pass http://$up_grafana;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        # The edge's identity overwrites anything the client sent. Grafana
        # does its own OIDC login (defence in depth); it does not read these.
        proxy_set_header X-Auth-Request-Email $edge_email;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Forwarded-Email    "";
        # Cookie-session host: the client's own Authorization never reaches
        # the backend (the edge sign-in is the only credential here).
        proxy_set_header Authorization        "";
        # Grafana Live is a WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
      }
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name dashboard.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }

      # Sign-in round trip (start, callback, sign_out) on this host.
      location ^~ /oauth2/ {
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa;
        proxy_set_header Host                    $host;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Forwarded-For         $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization           "";
      }

      # Internal: a client cannot call it directly and read its headers. A 403
      # (signed in, not in /gardenio-admins) passes through as 403.
      location = /oauth2/auth {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: a client-sent bearer JWT
        # would otherwise sign the request in without a cookie session.
        proxy_set_header Authorization     "";
      }

      location @signin {
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
      }

      # nginx does not inherit proxy_set_header into a location that sets its
      # own, so this location sets everything it needs.
      location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $edge_email $upstream_http_x_auth_request_email;

        set $up_headlamp headlamp.headlamp.svc.cluster.local:80;
        proxy_pass http://$up_headlamp;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        # The edge's identity overwrites anything the client sent. Headlamp
        # has no login and does not read these.
        proxy_set_header X-Auth-Request-Email $edge_email;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Forwarded-Email    "";
        # Cookie-session host: the client's own Authorization never reaches
        # the backend (the edge sign-in is the only credential here).
        proxy_set_header Authorization        "";
        # Pod logs, exec and resource watches are WebSockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
      }
    }

    # Script-issued requests (htmx / fetch / XHR) cannot follow the sign-in
    # redirect: it ends at a cross-origin IdP page, so a 302 makes a write
    # vanish with no error (gd-C2Sl6ClxAY). They get a plain 401 instead, which
    # the viewer turns into a "session expired, your draft is kept" notice.
    # Navigations (Sec-Fetch-Mode: navigate, or none on an old browser) keep
    # the 302.
    map "$http_hx_request:$http_sec_fetch_mode" $edge_signin_scripted {
      default                         0;
      "~^true:"                       1;
      "~:(cors|same-origin|no-cors)$" 1;
    }

    # gardenio.clonk.tv: the beads viewer and admin panel. Same sign-in check
    # as grafana.clonk.tv, then viewer-authproxy's edge-only listener (8097),
    # which turns the identity below into the viewer's trust headers. The
    # signed-in user's own access token goes along so the viewer's writes (the
    # quick-spawn, escalation approve) are made as that person.
    server {
      listen 8443 ssl;
      http2 on;
      server_name gardenio.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }

      # The sign-in session cookie is split into ~4KB chunks, and the auth
      # reply carries the access token plus a refreshed Set-Cookie.
      large_client_header_buffers 4 32k;
      proxy_buffer_size       32k;
      proxy_buffers           8 32k;
      proxy_busy_buffers_size 64k;

      location ^~ /oauth2/ {
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa;
        proxy_set_header Host                    $host;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Forwarded-For         $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization           "";
      }

      location = /oauth2/auth {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins,%2Flands-tenants,%2Fproject-claimlayer,%2Fproject-claimlayer%2Fowners,%2Fproject-claimlayer%2Fguests,%2Fproject-scopetest,%2Fproject-scopetest%2Fowners,%2Fproject-scopetest%2Fguests;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: a client-sent bearer JWT
        # would otherwise sign the request in without a cookie session.
        proxy_set_header Authorization     "";
      }

      # The sign-in check for /lands/ only: the list above plus /invited
      # (gd-ycE484kLyk). GitHub sign-in is invite-only, so a GitHub registrant
      # reaches /lands/apply once their email invite is claimed (the Lands
      # provisioner adds them to /invited), not before; the viewer's
      # routeApplicant class still keeps them to their own data. The demo
      # door, = /lands/demo and = /lands/accept, uses the check below instead.
      # scripts/check-viewer-edge-groups.py fails the build if this list is not
      # the one above plus /invited, if any location but ^~ /lands/ uses it,
      # or if any viewer location uses a check with no allowed_groups.
      location = /oauth2/auth-lands {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins,%2Flands-tenants,%2Finvited,%2Fproject-claimlayer,%2Fproject-claimlayer%2Fowners,%2Fproject-claimlayer%2Fguests,%2Fproject-scopetest,%2Fproject-scopetest%2Fowners,%2Fproject-scopetest%2Fguests;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: a client-sent bearer JWT
        # would otherwise sign the request in without a cookie session.
        proxy_set_header Authorization     "";
      }

      # The demo land's door only (gd-T37nCeWMhq = open): any signed-in
      # account, GitHub registrants with no invite included, so a stranger can
      # accept the terms at /lands/accept and ask for a demo pass at
      # /lands/demo. The viewer keeps both to routeApplicant (the caller's own
      # terms and pass only), and the pass is the real gate
      # (demo-land.md: 1 per account, a cap on open passes, guests cannot
      # spawn). No allowed_groups on purpose. scripts/check-viewer-edge-groups.py
      # fails the build if any location but = /lands/demo and = /lands/accept
      # uses it, or if it ever gains a group list.
      location = /oauth2/auth-lands-demo {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: a client-sent bearer JWT
        # would otherwise sign the request in without a cookie session.
        proxy_set_header Authorization     "";
      }

      location @signin {
        if ($edge_signin_scripted) { return 401; }
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
      }

      # Signed in, but in no group the check above admits (a GitHub registrant
      # before their land, Track B 2.2 step 4): a navigation goes to the front
      # of house instead of a bare 403. A script still gets the 403.

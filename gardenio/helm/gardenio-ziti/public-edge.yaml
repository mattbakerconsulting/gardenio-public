        if ($edge_signin_scripted) { return 403; }
        return 302 https://$host/lands/;
      }

      # Signed in, but not invited and in no group the viewer admits: a plain
      # page that says so, never a redirect (the sign-in would only come back
      # here). A claimed invite reaches the session within forwardAuth's
      # cookieRefresh, so "try again" is the honest next step. A script gets
      # the bare 403. No error_page here: it would loop.
      location @lands_need_invite {
        if ($edge_signin_scripted) { return 403; }
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 403 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>You need an invite</title></head><body style="margin:0;font:16px/1.5 system-ui,sans-serif"><main style="max-width:34rem;margin:12vh auto;padding:0 16px"><h1 style="font-size:1.6rem">You need an invite</h1><p>Gardenio Lands is invite-only. You are signed in, but this account has no invite yet.</p><p>If you were invited by email, sign in with a GitHub account that has that email address, and confirm the address when asked. It can take a few minutes after that before you are let in.</p><p><a href="">Try again</a> &middot; <a href="/oauth2/sign_out?rd=/lands/">Sign out</a> &middot; <a href="/lands/">Gardenio Lands</a></p></main></body></html>';

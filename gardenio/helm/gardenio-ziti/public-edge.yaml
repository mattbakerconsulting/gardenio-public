      # The splash (plan gd-EJGA3zDGCk, public since gd-hzRHm1KB5r): one
      # document for everyone, reading no bead and no viewer, and the two files
      # it fetches by hash. No session, GET and HEAD only, rate-limited and
      # stripped of any session like the front of house above; the viewer
      # serves them without a session (noSessionPatterns) and viewer-authproxy
      # lets them through with no identity ($bv_public).
      location = /garden/splash {
        limit_req zone=front_door_per_ip burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        set $up_viewer viewer-authproxy.gardenio.svc.cluster.local:8097;
        proxy_pass http://$up_viewer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Cookie                      "";
        proxy_set_header Authorization               "";
        proxy_set_header X-Auth-Request-Email        "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Auth-Request-User         "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email           "";
      }

      location = /garden/splash/three.module.min.js {
        limit_req zone=front_door_per_ip burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        set $up_viewer viewer-authproxy.gardenio.svc.cluster.local:8097;
        proxy_pass http://$up_viewer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Cookie                      "";
        proxy_set_header Authorization               "";
        proxy_set_header X-Auth-Request-Email        "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Auth-Request-User         "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email           "";
      }

      location = /garden/splash/still.png {
        limit_req zone=front_door_per_ip burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        set $up_viewer viewer-authproxy.gardenio.svc.cluster.local:8097;
        proxy_pass http://$up_viewer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Cookie                      "";
        proxy_set_header Authorization               "";
        proxy_set_header X-Auth-Request-Email        "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Auth-Request-User         "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email           "";
      }

      # The Window (plan gd-pz87vf3xsB, PW.5): /w/<token> is a read-only page
      # on one plan for anyone who holds the link, with no account. The token
      # in the path is the credential: the viewer hands it to kbeads, which
      # opens exactly one route for it. No session, GET and HEAD only, and
      # nothing of a session reaches the viewer, as for the front of house
      # above. viewer-authproxy lets it through with no identity by its own
      # ^~ /w/ location, not $bv_public: the viewer serves it from its own
      # pattern list, not noSessionPatterns. The front door's per-IP request
      # limit (a visitor needs one page, then one plan.json every 20 s) plus
      # a per-IP cap on requests in flight. The token reaches no log: the
      # access log writes /w/- ($log_uri), and this location's error log is
      # crit-only because nginx's error lines (a 429, an upstream failure)
      # quote the whole request line.
      #
      # /w/<token>/live (PW.7, gd-nBkInNpy3r) is a long-lived event stream
      # telling the page when the plan changed. It holds one of the ten
      # connections; the viewer lets one address hold three streams. Never
      # buffered here: viewer-authproxy honors the viewer's X-Accel-Buffering
      # but hides that header from this hop, so this location says it itself
      # (a page or plan.json just passes through unbuffered). The stream
      # sends a keepalive every 15 s, inside the 60 s proxy_read_timeout of
      # both hops, and the page falls back to its 20 s poll when it is
      # refused or lost.
      location ^~ /w/ {
        limit_req zone=front_door_per_ip burst=10 nodelay;
        limit_req_status 429;
        limit_conn front_door_conn_per_ip 10;
        limit_conn_status 429;
        limit_except GET { deny all; }
        error_log /dev/stderr crit;
        proxy_buffering off;
        # The viewer sends these too; the edge makes sure of them, so a link
        # is never passed on in a Referer or indexed, whatever answers.
        # add_header here drops the server's, so HSTS is restated.
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        set $up_viewer viewer-authproxy.gardenio.svc.cluster.local:8097;
        proxy_pass http://$up_viewer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Cookie                      "";
        proxy_set_header Authorization               "";
        proxy_set_header X-Auth-Request-Email        "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Auth-Request-User         "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email           "";
      }

      # Slack account linking (gd-OZJ6H2S3xx): the ONLY path of slack-bridge
      # exposed here (slackBridge.accountLink.publicURL). /slack/link/start
      # redirects the person to the Keycloak sign-in and /slack/link/callback
      # receives the code. No auth_request: the sign-in check below admits
      # admins and project groups only and would refuse everyone else; the
      # single-use state the bridge bound to the Slack user (10 min TTL) and the
      # Keycloak sign-in itself are the authentication. Nothing of the viewer
      # session reaches the bridge. Moved here from viewer-authproxy's ziti
      # front door (8443) when ziti was switched off (gd-xNMLrsgajy). ^~ so it
      # never falls into location /.
      location ^~ /slack/link/ {
        set $up_slack gardenio-slack-bridge.gardenio.svc.cluster.local:8090;
        proxy_pass http://$up_slack;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
      }

      location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        error_page 403 = @lands_front;
        # Identity and token come from oauth2-proxy's verified reply, never
        # from the client.
        auth_request_set $edge_email  $upstream_http_x_auth_request_email;
        auth_request_set $edge_token  $upstream_http_x_auth_request_access_token;
        auth_request_set $edge_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $edge_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;

        set $up_viewer viewer-authproxy.gardenio.svc.cluster.local:8097;
        proxy_pass http://$up_viewer;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        # The edge's values overwrite anything the client sent.
        proxy_set_header X-Auth-Request-Email        $edge_email;
        proxy_set_header X-Auth-Request-Access-Token $edge_token;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email    "";
        # No client bearer reaches the backend; viewer-authproxy builds the
        # Authorization header from the token above.
        proxy_set_header Authorization "";
        # The activity feed is Server-Sent Events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }

    # mux.clonk.tv: the coopmux terminal (a shell into every agent). Same sign-in
    # check as grafana.clonk.tv (/gardenio-admins ONLY, never widened to a
    # project group, as the viewer's is; a project-scoped person is refused 403
    # here; scripts/check-viewer-edge-groups.py fails the build otherwise), then viewer-authproxy's edge-only listener (8448),
    # which injects the coopmux bearer so the browser never holds it. Published
    # on the owner's answer to gd-jfXRKAn6Ez (S4b, gd-0e6aSFhxM5). It is its own
    # host because the viewer and coopmux both serve /api/v1/.
    server {
      listen 8443 ssl;
      http2 on;
      server_name mux.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }

      large_client_header_buffers 4 32k;
      proxy_buffer_size       32k;
      proxy_buffers           8 32k;
      proxy_busy_buffers_size 64k;

      location ^~ /oauth2/ {
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa;
        proxy_set_header Host                    $host;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Forwarded-For         $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization           "";
      }

      location = /oauth2/auth {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # forwardauth runs --skip-jwt-bearer-tokens: a client-sent bearer JWT
        # would otherwise sign the request in without a cookie session.
        proxy_set_header Authorization     "";
      }

      location @signin {
        return 302 https://$host/oauth2/start?rd=$scheme://$host$request_uri;
      }

      # Defence in depth: viewer-authproxy refuses this too. The injected
      # coopmux token is an admin token; it must not manage credentials.
      location ^~ /api/v1/credentials {
        return 403;
      }

      location / {
        # Cross-site WebSocket hijack guard (see $mux_bad_origin).
        if ($mux_bad_origin) { return 403; }

        auth_request /oauth2/auth;
        error_page 401 = @signin;
        auth_request_set $edge_email  $upstream_http_x_auth_request_email;
        auth_request_set $edge_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $edge_cookie;
        add_header Strict-Transport-Security "max-age=31536000" always;
        # This block sets its own headers, so the server-level ones do not
        # inherit: the terminal must never be framed.
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        set $up_mux viewer-authproxy.gardenio.svc.cluster.local:8448;
        proxy_pass http://$up_mux;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        # The edge's identity overwrites anything the client sent.
        proxy_set_header X-Auth-Request-Email $edge_email;
        proxy_set_header X-Auth-Request-User  "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email    "";
        # Cookie-session host: no client bearer reaches the backend; the
        # coopmux token is injected by viewer-authproxy.
        proxy_set_header Authorization        "";
        # Terminal I/O is a WebSocket plus long-lived streams.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }
    }

    server {
      listen 8443 ssl;
      http2 on;
      server_name api.clonk.tv;
      access_log /dev/stdout redacted;
      add_header Strict-Transport-Security "max-age=31536000" always;
      if ($public_edge_bad_path) { return 400; }
      # Bead descriptions and comment bodies can be large.
      client_max_body_size 8m;

      # Internal: a client cannot call it directly and read its headers. The
      # request's Authorization header goes through to oauth2-proxy, which
      # verifies the bearer JWT (--skip-jwt-bearer-tokens). 401 (no or bad
      # token) and 403 (valid token, not in /gardenio-admins) pass through
      # unchanged: there is no error_page on this host, so no redirect.
      location = /oauth2/auth {
        internal;
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fgardenio-admins;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # Bearer-only host. oauth2-proxy falls back to the cookie session when
        # the bearer is not a valid JWT (--bearer-token-login-fallback), and the
        # _gardenio_oauth2 cookie is shared by every edge host, so a valid
        # cookie plus a static token in Authorization would pass. No cookie and
        # no forwarded access token ever reach it from this host.
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
      }

      # The land door's sign-in check (Door D.2): the same bearer-JWT check,
      # but it admits a member of the one land the path names, its owners and
      # its guests (land roles are exclusive, gd-A9avO8cXBr), and nobody else,
      # /gardenio-admins included. A bearer for another land gets 403.
      # scripts/check-viewer-edge-groups.py fails the build if this list
      # changes or another location uses it.
      location = /oauth2/auth-land {
        internal;
        # Unreachable behind the 404 in ^~ /land/; kept so this check can
        # never ask forwardauth about a group named "/project-".
        if ($land_door_name = "") { return 403; }
        # A minted land token is not a JWT: the daemon judges it (below).
        # auth_request takes only a literal URI, so the branch lives here.
        if ($land_door_land_token) { rewrite ^ /oauth2/auth-land-token last; }
        set $up_fa gardenio-forwardauth.gardenio.svc.cluster.local:4180;
        proxy_pass http://$up_fa/oauth2/auth?allowed_groups=%2Fproject-$land_door_name,%2Fproject-$land_door_name%2Fowners,%2Fproject-$land_door_name%2Fguests;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        # Bearer only, as for /oauth2/auth above.
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
      }

      # The land door's land-token check (Door D.18a gd-WTyoLCSMUp), reached
      # only from /oauth2/auth-land for a bearer $land_door_land_token marks.
      # It asks the daemon itself, not $land_door_upstream, so the edge's
      # check stays independent of the land's landgate: GET /v1/me with the
      # caller's bearer and X-Land-Door. The daemon answers 200 for a land
      # principal of this land, 403 for another land's or for a fleet or
      # bridge token, 401 for a token it does not know (expired and revoked
      # included); auth_request passes 401 and 403 through. Nothing is
      # cached, so a revoke bites on the next request. The daemon does not
      # count this check, marked by X-Land-Door-Check, against the land's
      # rate limit (kbeads isLandDoorAuthCheck); the request it admits is
      # counted, and every location that forwards a caller blanks the
      # marker. Nothing but the bearer and the door names an identity: the
      # land door's blanked set is blanked here too. scripts/check-viewer-edge-groups.py fails
      # the build if any location auth_requests it directly.
      location = /oauth2/auth-land-token {
        internal;
        if ($land_door_name = "") { return 403; }
        set $up_beads_me gardenio-beads.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_beads_me/v1/me;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length    "";
        proxy_set_header Connection        "";
        proxy_set_header X-Land-Door       $land_door_name;
        # Marks this as the door's own admission check, which the daemon
        # leaves out of the rate limit (kbeads isLandDoorAuthCheck).
        proxy_set_header X-Land-Door-Check 1;
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Actor                 "";
        proxy_set_header X-Fleet                 "";
        proxy_set_header X-System-Operator       "";
        proxy_set_header X-Owner-Override        "";
        proxy_set_header X-Operated-By           "";
        proxy_set_header X-Edge-Auth-Ts          "";
        proxy_set_header X-Edge-Auth-Sig         "";
        proxy_set_header X-Edge-Auth-Version     "";
        proxy_set_header X-Auth-Request-User     "";
        proxy_set_header X-Auth-Request-Email    "";
        proxy_set_header X-Auth-Request-Groups   "";
        proxy_set_header X-Auth-Request-Preferred-Username "";
        proxy_set_header X-Forwarded-Email       "";
        proxy_set_header X-Forwarded-User        "";
        proxy_set_header X-Trigger-Bead          "";
        proxy_set_header X-User-Bead-Id          "";
        proxy_set_header X-No-Owner-Default      "";
        proxy_set_header X-No-Auto-Parent        "";
        proxy_set_header X-No-Auto-Inherit       "";
        proxy_set_header X-Force-Parent-Edge     "";
      }

      # The land door (Door D.2, owner decision gd-BTHHmA2rYc = edge-route):
      # /land/<name>/v1/* is the daemon's /v1/* for the members of one land,
      # so a tenant's kd, gb or gl points BEADS_HTTP_URL at
      # https://api.clonk.tv/land/<name> and never learns a daemon address.
      # The caller's own bearer goes through untouched; kbeads verifies it
      # again and scopes it (scoped_principal.go), this is only the coarse
      # gate. Only the routes on the land door's allowlist ($land_door_route,
      # D.18) are forwarded: the Lands API and the daemon routes a tenant's
      # agent loop (kd and gb) calls. The daemon's SSE streams, token routes,
      # admin routes and machine-only hooks and embeddings are also 404 by
      # name here, matched on the decoded path the daemon will route on; the
      # land's own feed (D.9) has its own location. Everything else under
      # /land/ is 404.
      location ^~ /land/ {
        location ~ "^/land/[a-z][a-z0-9-]{0,62}/v1/(bridge-tokens|fleet-tokens|auth|admin|hooks|embeddings)(/|$)" {
          return 404;
        }
        location ~ "^/land/[a-z][a-z0-9-]{0,62}/v1/(events/stream|bus/events)(/|$)" {
          return 404;
        }

        # The land feed (D.9 gd-Z9VVGjvzBk): the map's one event stream,
        # /lands/v1/lands/<land>/events. It forwards like the door below, with
        # no proxy buffering. Its per-land limits (new streams a second,
        # streams open at once) are kbeads', after the sign-in check: here
        # they would run before it (limit_req and limit_conn are preaccess),
        # so garbage tokens could spend a land's share. kbeads ends each
        # stream after five minutes (the access token's lifetime, checked
        # once at connect); the client resumes with a fresh bearer and its
        # cursor.
        location ~ "^/land/[a-z][a-z0-9-]{0,62}/v1/lands/v1/lands/[a-z][a-z0-9-]{0,62}/events$" {
          if ($land_door_name = "") { return 404; }
          if ($land_door_route = 0) { return 404; }
          limit_req zone=api_per_ip burst=20 nodelay;
          limit_req_status 429;
          auth_request /oauth2/auth-land;

          set $up_land $land_door_upstream;
          rewrite ^/land/[^/]+(/v1/.*)$ $1 break;
          proxy_pass http://$up_land;
          proxy_set_header Host              $host;
          proxy_set_header Connection        "";
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header X-Forwarded-For   $remote_addr;
          proxy_set_header X-Land-Door       $land_door_name;
          proxy_set_header Cookie                      "";
          proxy_set_header X-Auth-Request-Access-Token "";
          proxy_set_header X-Actor                 "";
          proxy_set_header X-Fleet                 "";
          proxy_set_header X-System-Operator       "";
          proxy_set_header X-Owner-Override        "";
          proxy_set_header X-Operated-By           "";
          proxy_set_header X-Edge-Auth-Ts          "";
          proxy_set_header X-Edge-Auth-Sig         "";
          proxy_set_header X-Edge-Auth-Version     "";
          proxy_set_header X-Auth-Request-User     "";
          proxy_set_header X-Auth-Request-Email    "";
          proxy_set_header X-Auth-Request-Groups   "";
          # Nor the agent-pod headers kbeads honours for a per-agent token, nor
          # the admission check's marker (gd-Utbyy4xJRX; landgate scrub).
          proxy_set_header X-Trigger-Bead          "";
          proxy_set_header X-User-Bead-Id          "";
          proxy_set_header X-No-Owner-Default      "";
          proxy_set_header X-No-Auto-Parent        "";
          proxy_set_header X-No-Auto-Inherit       "";
          proxy_set_header X-Force-Parent-Edge     "";
          proxy_set_header X-Land-Door-Check       "";
          # Server-Sent Events: every frame goes out as it is written.
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 360s;
        }

        location ~ "^/land/[a-z][a-z0-9-]{0,62}/v1/" {
          # The decoded path and the raw request line must name the same
          # land (see $land_door_name), and the route must be on the land
          # door's allowlist (see $land_door_route).
          if ($land_door_name = "") { return 404; }
          if ($land_door_route = 0) { return 404; }
          limit_req zone=api_per_ip burst=20 nodelay;
          limit_req_status 429;
          auth_request /oauth2/auth-land;

          # set before rewrite: "break" stops the rewrite directives.
          set $up_land $land_door_upstream;
          rewrite ^/land/[^/]+(/v1/.*)$ $1 break;
          proxy_pass http://$up_land;
          proxy_set_header Host              $host;
          proxy_set_header Connection        "";
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header X-Forwarded-For   $remote_addr;
          # The land in the path (gd-eAfptUBh9Z, owner decision gd-zf6eceweED
          # = per-land audiences): kbeads and landgate then require the
          # bearer to be minted for exactly this land (aud land-<name>), so a
          # user of two lands cannot reach the second through the first's
          # door. It can only narrow, so it needs no signature; this replaces
          # whatever the client sent.
          proxy_set_header X-Land-Door       $land_door_name;
          # As for ^~ /v1/ below: the daemon must take its OIDC path, so
          # nothing from the internet may name an actor, fleet, operator,
          # owner override or edge envelope.
          proxy_set_header Cookie                      "";
          proxy_set_header X-Auth-Request-Access-Token "";
          proxy_set_header X-Actor                 "";
          proxy_set_header X-Fleet                 "";
          proxy_set_header X-System-Operator       "";
          proxy_set_header X-Owner-Override        "";
          proxy_set_header X-Operated-By           "";
          proxy_set_header X-Edge-Auth-Ts          "";
          proxy_set_header X-Edge-Auth-Sig         "";
          proxy_set_header X-Edge-Auth-Version     "";
          proxy_set_header X-Auth-Request-User     "";
          proxy_set_header X-Auth-Request-Email    "";
          proxy_set_header X-Auth-Request-Groups   "";
          # Nor the agent-pod headers kbeads honours for a per-agent token, nor
          # the admission check's marker (gd-Utbyy4xJRX; landgate scrub).
          proxy_set_header X-Trigger-Bead          "";
          proxy_set_header X-User-Bead-Id          "";
          proxy_set_header X-No-Owner-Default      "";
          proxy_set_header X-No-Auto-Parent        "";
          proxy_set_header X-No-Auto-Inherit       "";
          proxy_set_header X-Force-Parent-Edge     "";
          proxy_set_header X-Land-Door-Check       "";
        }

        return 404;
      }

      # Never reachable from the internet: token management and admin routes
      # (machine callers use the in-cluster Service), embeddings, and the two SSE
      # streams (long-lived: they outlive the 5-minute access token; out of
      # scope for this host). Exact and ^~ matches
      # beat the /v1/ prefix below.
      location ^~ /v1/bridge-tokens { return 404; }
      location ^~ /v1/fleet-tokens  { return 404; }
      location ^~ /v1/admin/        { return 404; }
      location ^~ /v1/embeddings/   { return 404; }
      location = /v1/events/stream  { return 404; }
      location = /v1/bus/events     { return 404; }

      # nginx does not inherit proxy_set_header into a location that sets its
      # own, so this location sets everything it needs. The identity headers
      # are blanked: the daemon honours X-Operated-By only on static-token
      # calls and the X-Edge-Auth-* envelope is HMAC-signed, but nothing from
      # the internet should be able to name them.
      location ^~ /v1/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;

        set $up_beads gardenio-beads.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_beads;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # A request that got past the edge is JWT-verified, so the daemon must
        # take its OIDC path. These headers are honoured only on the static
        # token path: blank them (and the cookie / forwarded access token that
        # let a static token through the edge fallback) so a client cannot name
        # an actor, fleet, system operator or owner override.
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Actor                 "";
        proxy_set_header X-Fleet                 "";
        proxy_set_header X-System-Operator       "";
        proxy_set_header X-Owner-Override        "";
        proxy_set_header X-Operated-By           "";
        proxy_set_header X-Edge-Auth-Ts          "";
        proxy_set_header X-Edge-Auth-Sig         "";
        proxy_set_header X-Edge-Auth-Version     "";
        proxy_set_header X-Auth-Request-User     "";
        proxy_set_header X-Auth-Request-Email    "";
        proxy_set_header X-Auth-Request-Groups   "";
        # A caller may not pass a GET /v1/me as the land door's admission
        # check, which the daemon leaves out of the rate limit.
        proxy_set_header X-Land-Door-Check       "";
      }

      location = /health {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req_status 429;
        auth_request /oauth2/auth;

        set $up_beads gardenio-beads.gardenio.svc.cluster.local:8080;
        proxy_pass http://$up_beads;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # A request that got past the edge is JWT-verified, so the daemon must
        # take its OIDC path. These headers are honoured only on the static
        # token path: blank them (and the cookie / forwarded access token that
        # let a static token through the edge fallback) so a client cannot name
        # an actor, fleet, system operator or owner override.
        proxy_set_header Cookie                      "";
        proxy_set_header X-Auth-Request-Access-Token "";
        proxy_set_header X-Actor                 "";
        proxy_set_header X-Fleet                 "";
        proxy_set_header X-System-Operator       "";
        proxy_set_header X-Owner-Override        "";
        proxy_set_header X-Operated-By           "";
        proxy_set_header X-Edge-Auth-Ts          "";
        proxy_set_header X-Edge-Auth-Sig         "";
        proxy_set_header X-Edge-Auth-Version     "";
        proxy_set_header X-Auth-Request-User     "";
        proxy_set_header X-Auth-Request-Email    "";
        proxy_set_header X-Auth-Request-Groups   "";
      }

      # /metrics, /v1-less paths, everything else.
      location / { return 404; }
    }
---
# The one-click Become page (plan gd-0SUIdKXWV3, gd-VIm9kMDswf), served by
# auth.clonk.tv's ^~ /gardenio/become/ location from the mount below. nginx
# reads these files on every request, so an edit to this ConfigMap goes live
# within the kubelet's sync (about a minute) with no restart; a change to
# default.conf above still needs one. Flow and refusals: become.js's header,
# gardenio/docs/lands/admin-impersonation.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-edge-become
  namespace: public-edge
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>Become a tenant</title>
    <link rel="stylesheet" href="become.css">
    <script src="become.js" defer></script>
    </head>
    <body>
    <main>
    <h1 id="title">Becoming a tenant</h1>
    <p id="text">Starting.</p>
    <noscript><p>This page needs JavaScript.</p></noscript>
    <nav id="links"><a href="https://gardenio.clonk.tv/garden">Back to /garden</a></nav>
    </main>
    </body>
    </html>
  become.css: |
    :root { color-scheme: light dark; --ink: #1d2320; --muted: #4c5751; --link: #1f5f8b; --paper: #fbfaf6; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #e6ebe7; --muted: #b3bdb7; --link: #8cc4ec; --paper: #141816; }
    }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; margin: 12vh auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem; overflow-wrap: anywhere; }
    p { color: var(--muted); overflow-wrap: anywhere; }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
    a { color: var(--link); }
  become.js: |
    // One-click Become (plan gd-0SUIdKXWV3, gd-VIm9kMDswf). An admin opens
    // /gardenio/become/?email=<tenant>; this page signs them in silently to the
    // public client gardenio-become (PKCE), refuses an unknown email, an admin
    // and the admin's own account, makes the impersonation call the admin
    // console's Impersonate button makes, then signs the browser out of
    // gardenio.clonk.tv so /garden mints the tenant's session from the new SSO
    // session. Same origin as Keycloak, so no CORS, and Keycloak sets the
    // impersonated session's cookie on this host. Every failure says what
    // happened and links back to /garden.
    (() => {
      'use strict';
      const REALM = '/auth/realms/gardenio/protocol/openid-connect';
      const ADMIN = '/auth/admin/realms/gardenio';
      const CLIENT = 'gardenio-become';
      const ADMINS = '/gardenio-admins';
      const GARDEN = 'https://gardenio.clonk.tv/garden';
      // Clears the admin's gardenio.clonk.tv cookie and Redis session; /garden
      // then signs in again and Keycloak answers with the tenant.
      const DONE = 'https://gardenio.clonk.tv/oauth2/sign_out?rd=%2Fgarden';
      const HERE = location.origin + '/gardenio/become/';
      const SAVED = 'gardenio-become';
      // Group memberships read per user. A user with this many is refused: the
      // page cannot tell they are not an admin.
      const MAX_GROUPS = 500;
      const LOGIN_NEEDED = ['login_required', 'interaction_required', 'consent_required'];

      class Refusal extends Error {
        constructor(title, text, links) {
          super(title);
          this.title = title;
          this.text = text;
          this.links = links || [];
        }
      }

      function show(title, text, links) {
        document.getElementById('title').textContent = title;
        document.getElementById('text').textContent = text;
        const nav = document.getElementById('links');
        const items = (links || []).concat([['Back to /garden', GARDEN]]).map(([label, href]) => {
          const a = document.createElement('a');
          a.href = href;
          a.textContent = label;
          return a;
        });
        nav.replaceChildren(...items);
      }

      function b64url(bytes) {
        let s = '';
        for (const b of new Uint8Array(bytes)) s += String.fromCharCode(b);
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      function random(n) {
        return b64url(crypto.getRandomValues(new Uint8Array(n)));
      }

      // The access token's sub: who is signed in. Read, not verified: Keycloak
      // verifies the token on every admin call, this only spots "yourself".
      function subject(token) {
        try {
          const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
          return JSON.parse(atob(part)).sub || '';
        } catch (e) {
          return '';
        }
      }

      function checkStatus(res, what) {
        if (res.ok) return res;
        if (res.status === 429) {
          throw new Refusal('Too many requests',
            'auth.clonk.tv is limiting requests from your address. Wait a minute, then open Become again from /garden.');
        }
        if (res.status === 401) {
          throw new Refusal('Your sign-in ran out',
            'Open Become again from /garden to sign in again.');
        }
        if (res.status === 403) {
          throw new Refusal('Keycloak refused',
            'Keycloak answered 403 to ' + what + '. Your account needs the impersonation role, and the ' +
            'gardenio-become client needs impersonation, view-users and query-users in scope.');
        }
        throw new Refusal('Something went wrong', 'Keycloak answered ' + res.status + ' to ' + what + '.');
      }

      async function call(method, path, token, what) {
        let res;
        try {
          res = await fetch(path, {
            method,
            headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' },
            credentials: 'same-origin',
            cache: 'no-store',
          });
        } catch (e) {
          throw new Refusal('Could not reach Keycloak', 'The request to ' + what + ' failed: ' + e.message);
        }
        return checkStatus(res, what);
      }

      async function start() {
        const query = new URLSearchParams(location.search);
        const email = (query.get('email') || '').trim();
        if (!/^[^\s@]+@[^\s@]+$/.test(email)) {
          throw new Refusal('No one to become', 'This link names no tenant. Open Become from a tenant in /garden.');
        }
        const state = random(16);
        const verifier = random(32);
        const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
        sessionStorage.setItem(SAVED, JSON.stringify({ state, verifier, email }));
        show('Becoming ' + email, 'Signing you in.');
        const ask = new URLSearchParams({
          client_id: CLIENT,
          redirect_uri: HERE,
          response_type: 'code',
          response_mode: 'fragment',
          scope: 'openid',
          state,
          code_challenge: challenge,
          code_challenge_method: 'S256',
        });
        // Silent unless the admin asked to sign in (the link offered below).
        if (query.get('login') !== '1') ask.set('prompt', 'none');
        location.replace(REALM + '/auth?' + ask);
      }

      async function finish(back) {
        // The code is single-use, but keep it out of history all the same.
        history.replaceState(null, '', HERE);
        let saved = null;
        try {
          saved = JSON.parse(sessionStorage.getItem(SAVED) || 'null');
        } catch (e) {
          saved = null;
        }
        sessionStorage.removeItem(SAVED);
        if (!saved || !saved.state || back.get('state') !== saved.state) {
          throw new Refusal('This sign-in did not start here', 'Open Become again from /garden.');
        }
        const email = saved.email;
        const error = back.get('error');
        if (LOGIN_NEEDED.includes(error)) {
          throw new Refusal('You need to sign in first',
            'Keycloak needs you to sign in before you can become ' + email + '.',
            [['Sign in and try again', HERE + '?' + new URLSearchParams({ email, login: '1' })]]);
        }
        if (error || !back.get('code')) {
          throw new Refusal('Sign-in failed', 'Keycloak answered ' + (error || 'no code') + '.');
        }
        show('Becoming ' + email, 'Looking them up.');

        let res;
        try {
          res = await fetch(REALM + '/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'authorization_code',
              code: back.get('code'),
              redirect_uri: HERE,
              client_id: CLIENT,
              code_verifier: saved.verifier,
            }),
            credentials: 'same-origin',
            cache: 'no-store',
          });
        } catch (e) {
          throw new Refusal('Could not reach Keycloak', 'The sign-in failed: ' + e.message);
        }
        if (res.status === 400) {
          throw new Refusal('Sign-in failed', 'Keycloak would not finish the sign-in. Open Become again from /garden.');
        }
        const token = (await checkStatus(res, 'the sign-in').json()).access_token;
        if (!token) throw new Refusal('Sign-in failed', 'Keycloak sent no token.');
        const me = subject(token);

        const found = await (await call('GET',
          ADMIN + '/users?' + new URLSearchParams({ email, exact: 'true', briefRepresentation: 'true' }),
          token, 'the user lookup')).json();
        const users = (Array.isArray(found) ? found : [])
          .filter((u) => (u.email || '').toLowerCase() === email.toLowerCase());
        if (users.length === 0) {
          throw new Refusal('No such tenant', 'No one in the gardenio realm has the email ' + email + '.');
        }
        if (users.length > 1) {
          throw new Refusal('More than one account', 'More than one account has the email ' + email + ', so Become cannot tell which one you mean.');
        }
        const user = users[0];
        if (!user.id || user.id === me) {
          throw new Refusal('That is you', 'You cannot become yourself.');
        }

        const groups = await (await call('GET',
          ADMIN + '/users/' + encodeURIComponent(user.id) + '/groups?' +
            new URLSearchParams({ briefRepresentation: 'true', first: '0', max: String(MAX_GROUPS) }),
          token, 'the group lookup')).json();
        if (!Array.isArray(groups) || groups.length >= MAX_GROUPS) {
          throw new Refusal('Could not check ' + email, 'Become could not read all of their groups, so it cannot tell they are not an admin.');
        }
        if (groups.some((g) => g.path === ADMINS || String(g.path || '').startsWith(ADMINS + '/'))) {
          throw new Refusal('That is an admin', email + ' is a gardenio admin. Become works only for tenants.');
        }

        show('Becoming ' + email, 'Switching your session.');
        await call('POST', ADMIN + '/users/' + encodeURIComponent(user.id) + '/impersonation', token, 'the impersonation');
        location.replace(DONE);
      }

      async function main() {
        const back = new URLSearchParams(location.hash.replace(/^#/, ''));
        try {
          if (back.has('state')) await finish(back);
          else await start();
        } catch (e) {
          if (e instanceof Refusal) show(e.title, e.text, e.links);
          else show('Something went wrong', String(e && e.message ? e.message : e));
        }
      }

      main();
    })();
---
# In-cluster name for the edge (gd-IvwS0KTj8x): pods cannot dial the edge EIP,
# so a measuring agent pins gardenio.clonk.tv to this ClusterIP (curl --resolve,
# Chromium --host-resolver-rules) and gets the production TLS, server blocks and
# auth_request unchanged. No edge rule trusts a pod-network source. Rollback:
# delete this Service.
apiVersion: v1
kind: Service
metadata:
  name: public-edge
  namespace: public-edge
  labels: {app.kubernetes.io/name: public-edge}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: public-edge}
  ports:
    - {name: https, port: 443, targetPort: 8443, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-edge
  namespace: public-edge
  labels: {app.kubernetes.io/name: public-edge}
spec:
  replicas: 1
  # hostPort: a second pod cannot start beside the first.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: public-edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: public-edge}
    spec:
      # The ziti edge node: on-demand, static EIP, its own SG.
      nodeSelector: {gardenio.io/role: ziti-edge}
      tolerations: [{key: gardenio.io/ziti-edge, operator: Equal, value: "true", effect: NoSchedule}]
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      # Class from the gardenio chart (global.systemPriorityClass): the sign-in path,
      # so a crew burst cannot leave it Pending (gd-2qjxTVMBkC).
      priorityClassName: gardenio-system-critical
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - {name: https, containerPort: 8443, hostPort: 443, protocol: TCP}
            # Redirect-only HTTP listener (see the port-80 server blocks).
            - {name: http, containerPort: 8080, hostPort: 80, protocol: TCP}
          readinessProbe: {tcpSocket: {port: https}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: https}, periodSeconds: 30}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
            - {name: tls, mountPath: /etc/nginx/tls, readOnly: true}
            - {name: become, mountPath: /usr/share/nginx/become, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: public-edge}
        - name: become
          configMap: {name: public-edge-become}
        - name: tls
          secret: {secretName: public-edge-tls}

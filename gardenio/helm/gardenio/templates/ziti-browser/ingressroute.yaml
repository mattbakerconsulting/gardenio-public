{{- if and .Values.zitiBrowser.enabled (eq (include "gardenio.traefik.ingressRoutesEnabled" .) "true") }}
{{- if not .Values.edgeAuth.enabled -}}
{{- fail "zitiBrowser.enabled requires edgeAuth.enabled for the private /mux and /kd HMAC proxy routes" -}}
{{- end -}}
{{- $fullname := include "gardenio.fullname" . -}}
{{- $cfg := .Values.zitiBrowser -}}
{{- $paths := $cfg.paths -}}
{{- $edgeAuthService := include "gardenio.edgeAuth.fullname" . -}}
{{- $edgeAuthPort := .Values.edgeAuth.service.port | default 8096 -}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-clear-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  headers:
    customRequestHeaders:
      Authorization: ""
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-Access-Token: ""
---
{{- if .Values.edgeAuth.entra.enabled }}
# Direct delegated-token routes retain Authorization for the real Entra
# verifier, but discard every identity assertion a client could spoof.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-clear-spoofed-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-Access-Token: ""
---
# The beads viewer verifies the original bearer token itself. This separate
# ForwardAuth endpoint applies the same delegated Entra contract before the
# request reaches it without changing Authorization.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-forwardauth-entra
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  forwardAuth:
    address: http://{{ $edgeAuthService }}.{{ .Release.Namespace }}.svc.cluster.local:{{ $edgeAuthPort }}/forwardauth/entra
    trustForwardHeader: false
---
{{- end }}
# Beads receives oauth2-proxy's signed Entra ID token in Authorization so its
# pod-side verifier can enforce issuer, audience, email domain, and app role.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-forwardauth-beads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  forwardAuth:
    address: http://{{ $fullname }}-ziti-forwardauth.{{ .Release.Namespace }}.svc.cluster.local:4180/
    trustForwardHeader: false
    authResponseHeaders:
      - Authorization
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
      - X-Auth-Request-Access-Token
    addAuthCookiesToResponse:
      - {{ $cfg.oauth2Proxy.cookieName | default "_gardenio_ziti_oauth2" }}
---
# Mux/kd authenticate the same browser session at Traefik, but Authorization
# is not copied onward: edge-auth must validate the session cookie and stamp
# the HMAC envelope rather than misclassify the Entra token as a GitLab PAT.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-forwardauth-session
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  forwardAuth:
    address: http://{{ $fullname }}-ziti-forwardauth.{{ .Release.Namespace }}.svc.cluster.local:4180/
    trustForwardHeader: false
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
    addAuthCookiesToResponse:
      - {{ $cfg.oauth2Proxy.cookieName | default "_gardenio_ziti_oauth2" }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-beads-stripprefix
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  stripPrefix:
    prefixes:
      - {{ $paths.beads | quote }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ziti-root-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  redirectRegex:
    regex: '^https://{{ $cfg.host | replace "." "\\." }}/?$'
    replacement: "https://{{ $cfg.host }}{{ $paths.beads }}"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-ziti-browser
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-browser
spec:
  entryPoints:
    - {{ $cfg.entryPoint | default "ziti" }}
  routes:
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`/oauth2/`)
      kind: Rule
      priority: 300
      services:
        - name: {{ $fullname }}-ziti-forwardauth
          port: 4180
    {{- if .Values.edgeAuth.entra.enabled }}
    # Delegated Entra bearer tokens deliberately outrank the browser-session
    # routes below. HeaderRegexp only selects a candidate route; edge-auth
    # performs all cryptographic and claim validation.
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`{{ $paths.beads }}`) && HeaderRegexp(`Authorization`, `(?i)^Bearer[[:space:]]+.+$`)
      kind: Rule
      priority: 250
      services:
        - name: {{ $fullname }}-beads-viewer
          port: {{ .Values.beadsViewer.service.port | default 8095 }}
      middlewares:
        - name: {{ $fullname }}-ziti-clear-spoofed-auth
        - name: {{ $fullname }}-ziti-forwardauth-entra
        - name: {{ $fullname }}-ziti-beads-stripprefix
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ $fullname }}-security-headers-htmx-eval
        {{- end }}
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`{{ $paths.mux }}`) && HeaderRegexp(`Authorization`, `(?i)^Bearer[[:space:]]+.+$`)
      kind: Rule
      priority: 250
      services:
        - name: {{ $edgeAuthService }}
          port: {{ $edgeAuthPort }}
      middlewares:
        - name: {{ $fullname }}-ziti-clear-spoofed-auth
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ $fullname }}-security-headers
        {{- end }}
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`{{ $paths.kd }}`) && HeaderRegexp(`Authorization`, `(?i)^Bearer[[:space:]]+.+$`)
      kind: Rule
      priority: 250
      services:
        - name: {{ $edgeAuthService }}
          port: {{ $edgeAuthPort }}
      middlewares:
        - name: {{ $fullname }}-ziti-clear-spoofed-auth
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ $fullname }}-security-headers
        {{- end }}
    {{- end }}
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`{{ $paths.beads }}`)
      kind: Rule
      priority: 200
      services:
        - name: {{ $fullname }}-beads-viewer
          port: {{ .Values.beadsViewer.service.port | default 8095 }}
      middlewares:
        - name: {{ $fullname }}-ziti-clear-auth
        - name: {{ $fullname }}-ziti-forwardauth-beads
        - name: {{ $fullname }}-ziti-beads-stripprefix
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ $fullname }}-security-headers-htmx-eval
        {{- end }}
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`{{ $paths.mux }}`)
      kind: Rule
      priority: 200
      services:
        - name: {{ $edgeAuthService }}
          port: {{ $edgeAuthPort }}
      middlewares:
        - name: {{ $fullname }}-ziti-clear-auth
        - name: {{ $fullname }}-ziti-forwardauth-session
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ $fullname }}-security-headers
        {{- end }}
    - match: Host(`{{ $cfg.host }}`) && PathPrefix(`{{ $paths.kd }}`)
      kind: Rule
      priority: 200
      services:
        - name: {{ $edgeAuthService }}
          port: {{ $edgeAuthPort }}
      middlewares:
        - name: {{ $fullname }}-ziti-clear-auth
        - name: {{ $fullname }}-ziti-forwardauth-session
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ $fullname }}-security-headers
        {{- end }}
    - match: Host(`{{ $cfg.host }}`) && Path(`/`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $fullname }}-beads-viewer
          port: {{ .Values.beadsViewer.service.port | default 8095 }}
      middlewares:
        - name: {{ $fullname }}-ziti-root-redirect
  tls:
    secretName: {{ include "gardenio.tls.secretName" . }}
    {{- if .Values.tls.optionName }}
    options:
      name: {{ .Values.tls.optionName }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
{{- end }}

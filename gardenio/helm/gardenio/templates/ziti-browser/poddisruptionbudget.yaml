{{- if and .Values.zitiBrowser.enabled (gt (int (.Values.zitiBrowser.oauth2Proxy.replicaCount | default 2)) 1) }}
{{- $fullname := include "gardenio.fullname" . -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-ziti-forwardauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-forwardauth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-ziti-forwardauth
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

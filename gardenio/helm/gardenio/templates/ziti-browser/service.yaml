{{- if .Values.zitiBrowser.enabled }}
{{- $fullname := include "gardenio.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ziti-forwardauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-forwardauth
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-ziti-forwardauth
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

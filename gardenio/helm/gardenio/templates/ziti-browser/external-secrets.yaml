{{- if and .Values.zitiBrowser.enabled .Values.externalSecrets.enabled }}
{{- $oauth := .Values.zitiBrowser.oauth2Proxy -}}
{{- $secrets := .Values.externalSecrets.zitiBrowser -}}
{{- if not $secrets.client.remoteRef -}}
{{- fail "zitiBrowser requires externalSecrets.zitiBrowser.client.remoteRef" -}}
{{- end -}}
{{- if not $secrets.cookie.remoteRef -}}
{{- fail "zitiBrowser requires externalSecrets.zitiBrowser.cookie.remoteRef" -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $oauth.clientSecretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-forwardauth
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ $oauth.clientSecretRef.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $oauth.clientSecretRef.clientIDKey }}
      remoteRef:
        key: {{ $secrets.client.remoteRef | quote }}
        property: {{ $secrets.client.clientIDProperty | default "client_id" | quote }}
    - secretKey: {{ $oauth.clientSecretRef.clientSecretKey }}
      remoteRef:
        key: {{ $secrets.client.remoteRef | quote }}
        property: {{ $secrets.client.clientSecretProperty | default "client_secret" | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $oauth.cookieSecretRef.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: ziti-forwardauth
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ $oauth.cookieSecretRef.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $oauth.cookieSecretRef.key }}
      remoteRef:
        key: {{ $secrets.cookie.remoteRef | quote }}
        property: {{ $secrets.cookie.property | default "cookie_secret" | quote }}
{{- end }}

{{- /*
MinIO agent-credentials guard (gd-urSiLLwPIz).

Agent pods mount the Secret named by COOP_S3_CREDENTIALS_SECRET
(gardenio.minio.agentSecretName). Pointing it at the root Secret would hand
every agent, including crews running untrusted repo code, the keys to read,
overwrite and delete every bucket and administer MinIO. Fail the render
instead. The controller refuses the default root name at runtime too
(podspec.go forbiddenPodSecretMarkers); this catches a custom
objectStore.existingSecret that the marker would miss.
*/}}
{{- if .Values.objectStore.enabled }}
{{- if eq (include "gardenio.minio.agentSecretName" .) (include "gardenio.minio.secretName" .) }}
{{- fail (printf "objectStore.agentCredentials.existingSecret=%q is the MinIO root Secret; agent pods must get the least-privilege agent user. See gd-urSiLLwPIz." (include "gardenio.minio.agentSecretName" .)) }}
{{- end }}
{{- /* Same for the beads daemon's read-only user (gd-k3GmLJKW8R): the root
       Secret would let the daemon write and administer every bucket, the agent
       Secret would let it write the whole sessions prefix. */}}
{{- if include "gardenio.minio.beadsCredentialsEnabled" . }}
{{- $beadsSecret := include "gardenio.minio.beadsSecretName" . }}
{{- if or (eq $beadsSecret (include "gardenio.minio.secretName" .)) (eq $beadsSecret (include "gardenio.minio.agentSecretName" .)) }}
{{- fail (printf "objectStore.beadsCredentials.existingSecret=%q is the MinIO root or agent Secret; the beads daemon must get its own read-only user. See gd-k3GmLJKW8R." $beadsSecret) }}
{{- end }}
{{- end }}
{{- end }}

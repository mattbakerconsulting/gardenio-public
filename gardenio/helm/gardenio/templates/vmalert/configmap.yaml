                the Keycloak client gardenio-slack-bridge is reconciled; the pod log
                carries the auth_unavailable cause. See runbook.
              runbook_url: "{{ $ga.runbookBaseURL }}#slackbridgemachineauthunavailable"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-system-health/gardenio-system-health?viewPanel=8&{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.slackBridgeMachineForbidden.enabled }}
          # SlackBridgeMachineForbidden (gd-Hc34EENbO9 component 4) — the slack-bridge's
          # machine token is valid but the daemon DENIES its background writes (403).
          # That is the first-roll role race: a chart that adds the
          # gardenio-machine-slack-* realm roles and the client using them in one
          # release can hand the bridge a token before Keycloak attaches the roles
          # (the 2026-10-15 #370 roll, 155 denials in 20 minutes, no alert). The
          # config seed and dm delivery writes are then refused while the pod stays
          # Ready and DMs still reach Slack. SlackBridgeMachineAuthUnavailable only
          # covers a failed token FETCH. gardenio_machine_forbidden_total{client}
          # counts every 403 on a request carrying this client's token. dm traffic is
          # light, so the threshold is low; the client re-acquires its token once a
          # minute on a 403, so a role race clears itself and a sustained rate is a
          # real grant gap. No absent-series leg: the series exists only after the
          # first 403.
          - alert: SlackBridgeMachineForbidden
            expr: |
              sum(increase(gardenio_machine_forbidden_total{client={{ $.Values.slackBridge.machinePrincipal.clientId | quote }}}[{{ $ga.slackBridgeMachineForbidden.window }}])) > {{ $ga.slackBridgeMachineForbidden.threshold }}
            for: {{ $ga.slackBridgeMachineForbidden.for | quote }}
            labels:
              severity: {{ $ga.slackBridgeMachineForbidden.severity | quote }}
              component: slack-bridge
              subsystem: machine-principal
            annotations:
              summary: "slack-bridge's machine principal is being denied (403) by the beads daemon — its config seed / dm delivery writes are not landing"
              description: |
                gardenio_machine_forbidden_total{client={{ $.Values.slackBridge.machinePrincipal.clientId | quote }}}
                increased by more than {{ $ga.slackBridgeMachineForbidden.threshold }} over {{ $ga.slackBridgeMachineForbidden.window }}.
                The slack-bridge authenticates fine as machine:gardenio-slack-bridge but
                the daemon refuses its config seed or dm delivery writes (authz:deny).
                The pod stays Ready and DMs still reach Slack, but dm beads are not
                stamped or closed and question DMs lose their reply capture.
                Triage: the bridge log's "machine token acquired" line lists realm_roles;
                gardenio-machine-slack-config-seed and gardenio-machine-slack-dm-delivery
                must both be there (a missing role also logs "machine token lacks
                expected realm role(s)"). If they are, the grants do not cover the denied
                write: compare it with kbeads/internal/server/testdata/machine_grants.golden.json
                and the authz:deny audit beads. See runbook.
              runbook_url: "{{ $ga.runbookBaseURL }}#slackbridgemachineforbidden"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-system-health/gardenio-system-health?viewPanel=8&{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.respawnPhaseSlow.enabled }}
          # NEW (ka-0000001457) — slack-bridge cold-respawn phase anomaly.
          # gardenio_slackbridge_respawn_phase_slow_total{phase} is bumped by the
          # slack-bridge whenever a cold thread/DM respawn's phase exceeded its
          # anomaly threshold (dispatch>15s = bridge-side bead mint / daemon
          # retries; boot>150s = pod-side schedule + image pull + coop --resume
          # replay; total>180s = end-to-end). A multi-minute respawn (the
          # motivating ~4-min incident) previously had NO alarm and no way to
          # attribute the gap; this fires on increase>0 and the `phase` label
          # localizes the slow leg to the bridge vs the pod. increase(...) over a
          # counter (not histogram_quantile) because respawns are infrequent — a
          # percentile is jumpy on a short window, a counter delta is not. warn.
          - alert: SlackBridgeRespawnPhaseSlow
            expr: |
              sum by (phase) (increase(gardenio_slackbridge_respawn_phase_slow_total[1h])) > {{ $ga.respawnPhaseSlow.threshold }}
            for: {{ $ga.respawnPhaseSlow.for | quote }}
            labels:
              severity: {{ $ga.respawnPhaseSlow.severity | quote }}
              component: slack-bridge
              subsystem: respawn-latency
            annotations:
              summary: "slack-bridge cold-respawn phase anomalously slow ({{`{{ $labels.phase }}`}})"
              description: |
                gardenio_slackbridge_respawn_phase_slow_total{phase="{{`{{ $labels.phase }}`}}"}
                increased over the last 15m — a cold thread/DM agent respawn's
                {{`{{ $labels.phase }}`}} phase exceeded its anomaly threshold
                (dispatch>15s / boot>150s / total>180s). phase=dispatch points at
                the bridge (bead mint / daemon retries); phase=boot points at the
                pod (schedule + image pull + coop --resume replay). Triage: graph
                gardenio_slackbridge_respawn_phase_seconds by phase, and check
                slack-bridge logs around the respawn for the offending agent.
              runbook_url: "{{ $ga.runbookBaseURL }}#slackbridgerespawnphaseslow"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-system-health/gardenio-system-health?viewPanel=19&{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.adviceBudget.enabled }}
          # Advice context budget (ka-0000004716, context-crisis plan
          # ka-0000003733). gb prime pushes gardenio_prime_hook_bytes at
          # every agent session start; source="advice" over the hard budget
          # for any (project, role) archetype means the Part-A advice cut
          # regressed. max by (project, role) so the firing series names the
          # offending archetype. Bytes unit: 20k tok x 4 = 81920 default.
          # Silent-before-release caveat: the series first exists on the
          # release carrying MR !5331; absent series -> no evaluation, which
          # is fine because the budget cannot regress before the metric does.
          - alert: AdviceContextOverBudget
            expr: |
              max by (project, role) (gardenio_prime_hook_bytes{source="advice"}) > {{ $ga.adviceBudget.maxBytes }}
            for: {{ $ga.adviceBudget.for | quote }}
            labels:
              severity: {{ $ga.adviceBudget.severity | quote }}
              component: gardenio
              subsystem: advice-hygiene
            annotations:
              summary: "advice section over the per-archetype context budget ({{ $ga.adviceBudget.maxBytes }} bytes)"
              description: |
                gardenio_prime_hook_bytes{source="advice"} has exceeded
                {{ $ga.adviceBudget.maxBytes }} bytes (~{{ div $ga.adviceBudget.maxBytes 4096 }}k tokens) for the firing
                (project, role) archetype for {{ $ga.adviceBudget.for }} — the advice corpus
                regressed past the Part-A budget (ka-0000003733). Triage:
                `gb advice audit --project <project> --role <role>` to see the
                matched beads; `gb advice lint` for targeting smells; then
                RETARGET/NUKE/CONSOLIDATE/SHORTEN per the plan runbook.
              runbook_url: "{{ $ga.runbookBaseURL }}#advicecontextoverbudget"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-system-health/gardenio-system-health?viewPanel=9&{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.unattributedSpend.enabled }}
          # Approach B residual (ka-0000003988). tagSpendSync splits the whole
          # LiteLLM bill into gardenio_agent_attributed_cost_usd (agent:*-tagged
          # — what per-agent settlement can book) + gardenio_unattributed_cost_usd
          # (per-proxy /global/spend bill minus agent-tagged), so
          # attributed + unattributed ≡ bill by construction. This alert fires
          # when the unattributed share of the trailing-1h bill exceeds
          # ratioThreshold — a new untagged consumer appeared or tag propagation
          # regressed (e.g. the rotation tag-loss bug ka-0000000333). Both series
          # come from the SAME poller tick, so no cross-poller phase skew; the
          # same dedup + aligned-subquery shape as the tag-cost validation rules.
          # The minSpend gate is a label-less VECTOR via `and on() (...)` — a
          # bare scalar comparison on `and`'s RHS suppresses everything.
          # Silent-before-release caveat: the series first exist on the release
          # carrying ka-0000003988; absent series → no evaluation, which is fine
          # (the residual cannot regress before it is measured).
          - alert: UnattributedSpendHigh
            expr: |
              (
                sum(increase((max by (env) (gardenio_unattributed_cost_usd))[1h:5m]))
                /
                clamp_min(
                  sum(increase((max by (env) (gardenio_unattributed_cost_usd))[1h:5m]))
                  + sum(increase((max by (env) (gardenio_agent_attributed_cost_usd))[1h:5m])),
                  {{ $ga.unattributedSpend.minSpendUSD }}
                )
              ) > {{ $ga.unattributedSpend.ratioThreshold }}
              and on()
              (
                sum(increase((max by (env) (gardenio_unattributed_cost_usd))[1h:5m]))
                + sum(increase((max by (env) (gardenio_agent_attributed_cost_usd))[1h:5m]))
                > {{ $ga.unattributedSpend.minSpendUSD }}
              )
            for: {{ $ga.unattributedSpend.for | quote }}
            labels:
              severity: {{ $ga.unattributedSpend.severity | quote }}
              component: gardenio
              subsystem: spend
            annotations:
              summary: "unattributed LiteLLM spend >{{ $ga.unattributedSpend.ratioThreshold }} of the trailing-1h bill"
              description: |
                gardenio_unattributed_cost_usd (the part of the LiteLLM bill
                carrying no agent: tag) exceeded {{ $ga.unattributedSpend.ratioThreshold }} of the trailing-1h
                bill for {{ $ga.unattributedSpend.for }}. Per-agent settlement can never book this
                money — a new untagged consumer appeared (an internal service,
                an operator key) or tag propagation regressed (credential
                rotation dropping x-litellm-tags, ka-0000000333; podspec
                x-litellm-tags wiring). Enumerate the offending rows with
                GET /spend/logs/ui (master key): untagged = no agent: entry in
                request_tags; key alias + requester IP identify the consumer.
              runbook_url: "{{ $ga.runbookBaseURL }}#unattributedspendhigh"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-cost-overview/gardenio-cost-overview?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.darkSpend.enabled }}
{{- $ds := $ga.darkSpend }}
          # DarkSpendOverThreshold (R6-FU6c, ka-0000007149; epic ka-5FZ2 pre-
          # autonomy guardrails ka-0000005876) — the cost guardrail for the
          # autonomous (dark) fleet, the OBSERVE half of the R6-FU6 cost pair
          # whose ENFORCE half is the per-agent/day token budget. Keyed to the
          # litellm-cost-tracking metric family: gardenio_agent_spend_usd_total
          # is the per-turn LiteLLM spend counter (labels
          # {agent,project,role,model,account}) the controller tag_spend_sync
          # daemon feeds from LiteLLM spend logs — the exact series the
          # litellm-cost-tracking E2E module validates end-to-end, and the same
          # counter the gardenio:agent_cost_usd:rate1h recording rule and the
          # gardenio-dark-spend dashboard read.
          #
          # Fires when the selected fleet's TRAILING-1h spend rate (USD/hour)
          # crosses the operator-set threshold. increase(...[1h]) (not rate())
          # so the value reads as dollars-per-hour, matching the dashboard's
          # "Dark spend rate vs alert threshold" panel and the threshold
          # variable. projectRegex scopes it to the dark universe (default
          # "monorepo-dark") — an anchored full-match, so it does not leak onto
          # the main-fleet project. `for` debounces a single spiky turn so only
          # a SUSTAINED over-threshold burn pages, matching the guardrail's
          # intent (a runaway autonomous loop, not one expensive turn).
          #
          # Off by default: dark-fleet spend is only in this vmsingle once the
          # dark controller's metrics are scraped/federated (cf. the parked
          # gitlab-dark-drift board whose gitlab_dark_* exporter is not yet
          # applied). An absent series makes increase() no-data, so even if
          # flipped on early the rule stays silent rather than mis-fires — the
          # operator flips darkSpend.enabled + threshold when dark spend lands.
          - alert: DarkSpendOverThreshold
            expr: |
              sum(increase(gardenio_agent_spend_usd_total{project=~"{{ $ds.projectRegex }}"}[1h])) > {{ $ds.threshold }}
            for: {{ $ds.for | quote }}
            labels:
              severity: {{ $ds.severity | quote }}
              component: gardenio
              subsystem: spend
              universe: dark
            annotations:
              summary: "dark-fleet LiteLLM spend >${{ $ds.threshold }}/h (project=~{{ $ds.projectRegex }})"
              description: |
                The autonomous (dark) fleet's trailing-1h LiteLLM spend rate
                crossed the operator-set guardrail of ${{ $ds.threshold }}/hour
                for {{ $ds.for }} (projects matching "{{ $ds.projectRegex }}").
                This is the OBSERVE guardrail from R6-FU6 (ka-0000007149) — the
                per-agent/day token budget ENFORCES, this alert watches the
                aggregate burn. A sustained over-threshold rate is what a
                runaway autonomous loop looks like on the bill.
                Triage: open the Gardenio Dark Spend board to see WHICH agent /
                gardener is driving it (per-agent + per-gardener spend-rate
                panels), then decide whether to raise the threshold (expected
                growth), throttle/kill the offending gardener (kill-switch), or
                hunt a spend regression (untagged consumer — cross-check with
                UnattributedSpendHigh).
              runbook_url: "{{ $ga.runbookBaseURL }}#darkspendoverthreshold"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-dark-spend/gardenio-dark-spend?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.xcheckDrift.enabled }}
{{- $xd := $ga.xcheckDrift }}
{{- $pairOverrides := $xd.pairThresholds | default dict }}
{{- $overriddenPairs := keys $pairOverrides | sortAlpha }}
          # C5 (ka-0000006644, plan ka-0000003747) — cost x-check corroboration
          # drift. The controller x-check sweep publishes
          # gardenio_xcheck_agreement{pair,env}: a [0,1] score per conservation
          # pair (the same quantity derived from two INDEPENDENT sources;
          # 1 − |A−B|/max(A,B,ε)). Sustained low agreement means two
          # derivations of one number disagree — a real measurement bug in one
          # of the sources, not noise. The sweep NEVER publishes a pair it
          # could not derive both sides of (absent, not fabricated), so this
          # cannot fire on missing data; and a pair listed in pairThresholds
          # is excluded here and gets its own floor below (0 = opted out, so a
          # structurally-low pair does not fire the default 0.95 rule).
          # Silent-before-release caveat: the series first exists on the
          # release carrying C2 (ka-0000000950).
          - alert: CostXCheckDrift
            expr: |
              gardenio_xcheck_agreement{{ if $overriddenPairs }}{pair!~"{{ join "|" $overriddenPairs }}"}{{ end }} < {{ $xd.threshold }}
            for: {{ $xd.for | quote }}
            labels:
              severity: {{ $xd.severity | quote }}
              component: gardenio
              subsystem: cost-trust
            annotations:
              summary: "cost x-check pair {{`{{ $labels.pair }}`}} agreement <{{ $xd.threshold }} for {{ $xd.for }} (two derivations disagree)"
              description: |
                gardenio_xcheck_agreement{pair="{{`{{ $labels.pair }}`}}",env="{{`{{ $labels.env }}`}}"} has stayed
                below {{ $xd.threshold }} for {{ $xd.for }} (current score {{`{{ $value | printf "%.3f" }}`}}). The pair's
                two INDEPENDENT derivations of the same quantity (x-check
                sweep, cmd/controller/xcheck_sweep.go) disagree — one of the
                sources is mismeasuring, so every cost number that pair
                qualifies is suspect until reconciled. Open the xcheck-trust
                board's side A/B panel for the pair to see which derivation
                moved and when; the runbook maps each pair to its two sources.
              runbook_url: "{{ $ga.runbookBaseURL }}#costxcheckdrift"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-xcheck-trust/gardenio-cost-x-check-trust-double-check-principle?from=now-24h&to=now"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- range $pair, $floor := $pairOverrides }}
{{- if $floor }}
          # Per-pair floor override (vmalert.gapAlerts.xcheckDrift.pairThresholds).
          - alert: CostXCheckDrift
            expr: |
              gardenio_xcheck_agreement{pair="{{ $pair }}"} < {{ $floor }}
            for: {{ $xd.for | quote }}
            labels:
              severity: {{ $xd.severity | quote }}
              component: gardenio
              subsystem: cost-trust
            annotations:
              summary: "cost x-check pair {{ $pair }} agreement <{{ $floor }} (pair-specific floor) for {{ $xd.for }}"
              description: |
                gardenio_xcheck_agreement{pair="{{ $pair }}",env="{{`{{ $labels.env }}`}}"} has stayed below its
                pair-specific floor {{ $floor }} for {{ $xd.for }} (current score {{`{{ $value | printf "%.3f" }}`}}).
                This pair's two independent derivations disagree beyond its
                tuned baseline. Open the xcheck-trust board's side A/B panel
                for the pair; the runbook maps each pair to its two sources.
              runbook_url: "{{ $ga.runbookBaseURL }}#costxcheckdrift"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-xcheck-trust/gardenio-cost-x-check-trust-double-check-principle?from=now-24h&to=now"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if $ga.accountThrottled.enabled }}
          # Credential-account rate-limited (ka-0000003179). Series:
          # gardenio_account_throttled (labels {account,env}), set to 1 by the
          # controller when the Anthropic rate-limit probe reports
          # throttle_status="rejected" for a credential account. FIREABLE TODAY —
          # the series is live on prod (it already backs the account-capacity
          # dashboard's throttle timeline), so this belongs in the fireable group,
          # not the blocked pack. count(max by (account)(...)>0) dedups the
          # per-pod gauge republish so a single throttled account counts once,
          # not once per controller pod. E2E/probe throwaway accounts are excluded
          # with the byte-identical matcher the beads-viewer rollup uses
          # (ka-0000005167) so a harness run can never trip this. warn, not page:
          # the credential broker fails over to un-throttled accounts, so a
          # throttle degrades headroom rather than halting work — a sustained
          # count is the "we are running out of un-throttled capacity" signal.
          # Deep-links to the account-capacity board, whose throttle timeline +
          # utilization panels answer the "why" (was the account already near its
          # 5h ceiling?).
          - alert: AccountThrottled
            expr: |
              count(max by (account) (gardenio_account_throttled{account!~"(?i:e2e-.*|probe-acct-.*)"}) > 0) > {{ $ga.accountThrottled.threshold }}
            for: {{ $ga.accountThrottled.for | quote }}
            labels:
              severity: {{ $ga.accountThrottled.severity | quote }}
              component: gardenio
              subsystem: credential-capacity
            annotations:
              summary: ">{{ $ga.accountThrottled.threshold }} credential account(s) rate-limited (throttled)"
              description: |
                More than {{ $ga.accountThrottled.threshold }} credential account(s) have been rate-limited
                (gardenio_account_throttled==1, provider 429) for {{ $ga.accountThrottled.for }}. The
                broker fails over to un-throttled accounts, so this degrades
                capacity headroom rather than halting work — but a sustained
                count means the fleet is leaning on fewer accounts. Break down by
                `account` on the graph; the account-capacity dashboard correlates
                each throttle with its 5h/7d utilization so you can see whether
                the account was already near its window ceiling.
              runbook_url: "{{ $ga.runbookBaseURL }}#accountthrottled"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-account-capacity/gardenio-account-capacity-rate-limit-health?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if or $ga.pendingPods.enabled $ga.nodepoolMemory.enabled $ga.nodeLifecycle.enabled $ga.fleetSize.enabled $ga.idleNodes.enabled $ga.containerOOMKilled.enabled $ga.pvcObs.enabled }}
      # ---- BLOCKED gaps — enabled per-toggle ONLY after the prereq series
      #      exists in vmsingle; otherwise these evaluate against a missing
      #      series and never fire (silent). See values.yaml gapAlerts.* notes.
      - name: gardenio.gap-alerts-blocked
        interval: {{ .Values.vmalert.evaluationInterval | quote }}
        rules:
{{- if $ga.containerOOMKilled.enabled }}
          # ka-0000004184 (Matt: "detect OOMs and alert in Slack"). The
          # CHILD-PROCESS-OOM-aware sibling of the fireable AgentOOMKilled.
          # AgentOOMKilled reads the kubelet's per-container reason=OOMKilled,
          # which the kubelet sets ONLY when the container PID1 is the OOM victim.
          # Agents run coop as PID1 and claude + workflow fan-out
          # (node/playwright/subagents) as CHILDREN, so a cgroup OOM-kill of a
          # workflow child leaves coop alive → the container is never flagged
          # OOMKilled → AgentOOMKilled stays silent and the death is mislabeled
          # stop_gate_*_involuntary. This alert reads container_oom_events_total —
          # the cadvisor counter for the cgroup's OWN oom_kill count, which
          # increments for ANY process the OOM-killer reaps in the container cgroup
          # (child OR PID1), and fires under gVisor since the memory limit is
          # host-cgroup-enforced. by (namespace, pod) so the firing series names
          # the exact agent pod that OOMed.
          #
          # BLOCKED gap: container_oom_events_total exists in vmsingle ONLY when
          # the cadvisor scrape is on (vmagent.kubeletScrape.cadvisorOOM.enabled,
          # which itself needs kubeletScrape.enabled). Arming this alert without
          # that scrape evaluates a missing series and NEVER fires (silent) — the
          # footgun this group's convention prevents. The prod overlay flips BOTH
          # together. warn, not page: a single OOM is a cold-resume (run
          # auto-salvaged to S3), a sustained rate is the under-provisioning /
          # workflow-memory-leak signal.
          - alert: AgentContainerOOMKilled
            expr: |
              sum by (namespace, pod) (increase(container_oom_events_total{namespace=~"{{ $ga.containerOOMKilled.namespaceRegex }}"}[1h])) > {{ $ga.containerOOMKilled.threshold }}
            for: {{ $ga.containerOOMKilled.for | quote }}
            labels:
              severity: {{ $ga.containerOOMKilled.severity | quote }}
              component: gardenio
              subsystem: agent-reliability
            annotations:
              summary: "agent container OOM-kill (incl. workflow child procs) >{{ $ga.containerOOMKilled.threshold }}/h ({{`{{ $labels.namespace }}/{{ $labels.pod }}`}})"
              description: |
                More than {{ $ga.containerOOMKilled.threshold }} cgroup OOM-kills/h
                in agent pod {{`{{ $labels.pod }}`}} (namespace
                {{`{{ $labels.namespace }}`}}) — the cadvisor
                container_oom_events_total counter, which unlike the kubelet
                reason=OOMKilled signal AgentOOMKilled reads ALSO counts OOM-kills
                of workflow CHILD processes (node/playwright/subagents) under coop
                (PID1), the "lots of deaths on workflows" blind spot (ka-0000004184).
                Fires under gVisor too (host-cgroup-enforced limit). A single OOM is
                a cold-resume (run auto-salvaged to S3); a sustained rate means the
                agent memory limit is too tight for the workflow or a run is leaking.
                Triage: check the VPA right-sizing board for this role's working-set
                vs limit and widen the limit / VPA minAllowed if under-provisioned.
              runbook_url: "{{ $ga.runbookBaseURL }}#agentcontaineroomkilled"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-involuntary-deaths/gardenio-killed-mid-work-agents-involuntary-deaths?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.nodeLifecycle.enabled }}
          # Track D (ka-0000001509; operator ask ka-0000006448: "monitoring and
          # alerts for … node lifecycle events; alerts that fire into slack;
          # create a metric if we do not have one"). Node-lifecycle churn on the
          # fireable vmalert path. Reads the controller-emitted
          # gardenio_node_lifecycle_events_total{reason=...} counter — CREATED for
          # this ask (internal/nodelifecycle). BLOCKED gap: the series exists
          # only when the collector is enabled (agents.nodeLifecycle.enabled,
          # prereq {{ $ga.nodeLifecycle.prereqBead }}), so this alert defaults OFF
          # and both flip together in the prod overlay — otherwise it evaluates a
          # missing series and never fires (silent), the footgun this group's
          # convention prevents. Counts reason="terminated" ONLY — the once-per-
          # node vanish-from-listing edge (ka-0000005966). A single graceful node
          # teardown walks ALL THREE going-away edges in sequence (disrupting ->
          # deleting -> terminated), so summing disrupting|deleting|terminated
          # counted ~3 events per node gone and tripped the per-node 6/h threshold
          # on just ~2 clean consolidations/h — routine healthy scale-down, not
          # churn. terminated fires exactly once per node that goes away regardless
          # of path (graceful drain OR abrupt spot/AWS-health reclaim), so the
          # threshold reads as NODES/h and matches the runbook's per-node model;
          # it also keeps uniform sensitivity across graceful and abrupt reclaims
          # (an abrupt spot kill emits terminated with little/no disrupting, so
          # summing would have made the alert LEAST sensitive to the most
          # dangerous churn). disrupting/deleting stay emitted for the dashboard
          # reason-breakdown (triage step 1) — only the ALERT counts nodes.
          # not_ready is likewise excluded (a Ready flap is a health blip, not a
          # teardown). Complements AgentNodeReclaimDeaths, which fires only once
          # churn actually KILLS an agent; this fires on the teardowns too,
          # including the ones that miss the agents. warn: node churn is expected
          # background (spot, TTL); a sustained rate is the "reclaims are climbing"
          # signal. Tune via vmalert.gapAlerts.nodeLifecycle.
          - alert: AgentNodeLifecycleEvents
            expr: |
              sum(increase(gardenio_node_lifecycle_events_total{reason="terminated"}[1h])) > {{ $ga.nodeLifecycle.threshold }}
            for: {{ $ga.nodeLifecycle.for | quote }}
            labels:
              severity: {{ $ga.nodeLifecycle.severity | quote }}
              component: gardenio
              subsystem: node-lifecycle
            annotations:
              summary: "node teardowns >{{ $ga.nodeLifecycle.threshold }} nodes/h (agent-pool going-away churn)"
              description: |
                More than {{ $ga.nodeLifecycle.threshold }} agent-pool nodes went
                away (terminated/reclaimed — Karpenter disruption drain, node
                deletion, or instance reclaim via spot / AWS health /
                interruption-queue / expireAfter TTL / AMI drift) per hour for
                {{ $ga.nodeLifecycle.for }}, from
                gardenio_node_lifecycle_events_total{reason="terminated"} (one count
                per node gone). Break down by `reason` (disrupting/deleting/
                terminated) on the graph to see the teardown path. Node churn is
                expected background, but a sustained
                rate means instances are cycling faster than usual — which
                cold-resumes any agent on those nodes (see AgentNodeReclaimDeaths
                for the ones that were actually killed mid-work). Check Karpenter
                disruption budgets, the node expireAfter TTL, and any AMI-drift
                rollout in flight.
              runbook_url: "{{ $ga.runbookBaseURL }}#agentnodelifecycleevents"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-involuntary-deaths/gardenio-killed-mid-work-agents-involuntary-deaths?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.fleetSize.enabled }}
          # P1b FLEET-SIZE alerting (ka-0000003023; operator ask Matt Baker,
          # #aws-cost-management 2026-08-13: "alert when running agent-node count
          # / total vCPU provisioned exceeds a threshold"). Reads the
          # controller-emitted current-state gauge gardenio_agent_node_count{env}
          # — the number of agent-pool nodes (karpenter.sh/nodepool=agent-pool)
          # live as of the last sweep. This is the LEADING cost indicator: it
          # rises the moment Karpenter provisions a node, hours before the
          # On-Demand BoxUsage lands on the bill, so we catch fleet growth BEFORE
          # the trailing spend. Routed to the cost channel via subsystem="cost".
          #
          # BLOCKED gap (default OFF): the gauge exists only when the
          # node-lifecycle collector is enabled (agents.nodeLifecycle.enabled,
          # prereq {{ $ga.fleetSize.prereqBead }}) — the SAME collector + RBAC
          # that backs AgentNodeLifecycleEvents, since the gauge is a tally over
          # the node LIST that collector already runs. Flip both together in the
          # prod overlay; arming this without the collector evaluates a missing
          # series and never fires (silent), the footgun this group prevents.
          # warn, not page: a large fleet is a cost signal to investigate, not an
          # availability incident. Written gauge > threshold so an absent series
          # yields NO result (never a phantom fire). Threshold is NODES; tune to
          # the fleet's expected steady-state ceiling per env.
          - alert: AgentFleetSizeHigh
            expr: |
              gardenio_agent_node_count > {{ $ga.fleetSize.threshold }}
            for: {{ $ga.fleetSize.for | quote }}
            labels:
              severity: {{ $ga.fleetSize.severity | quote }}
              component: gardenio
              subsystem: cost
            annotations:
              summary: "agent-pool fleet size >{{ $ga.fleetSize.threshold }} nodes (provisioned-cost early warning)"
              description: |
                The agent-pool node count (gardenio_agent_node_count) has been
                above {{ $ga.fleetSize.threshold }} for {{ $ga.fleetSize.for }} —
                the fleet is running more On-Demand nodes than the expected
                steady-state ceiling. This is the LEADING cost indicator: node
                count rises the moment Karpenter provisions, hours before the
                BoxUsage bill lands (gardenio-account EC2 is 100% On-Demand). Check
                the total provisioned vCPU (gardenio_agent_node_vcpus) and whether
                the growth is real demand or under-utilized/idle nodes that the
                P2b right-sizing should consolidate. Cross-refs the cost-control
                epic ka-0000006909.
              runbook_url: "{{ $ga.runbookBaseURL }}#agentfleetsizehigh"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-involuntary-deaths/gardenio-killed-mid-work-agents-involuntary-deaths?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.idleNodes.enabled }}
          # P1b-follow-up IDLE-NODE alerting (ka-0000001398). Reads the
          # controller-emitted current-state gauge gardenio_agent_idle_node_count
          # {env} — agent-pool nodes (karpenter.sh/nodepool=agent-pool) hosting
          # ZERO active agent pods as of the last sweep. This is the UNBLOCKED
          # half of the node-utilization ask: "provisioned but nothing scheduled"
          # idle capacity, the direct waste signal — On-Demand nodes Karpenter
          # has not yet consolidated, paying for nothing. Routed to the cost
          # channel via subsystem="cost".
          #
          # BLOCKED gap (default OFF): the gauge exists only when idle-node
          # detection is enabled (agents.nodeLifecycle.idleNodes.enabled, prereq
          # {{ $ga.idleNodes.prereqBead }} — itself gated on the node-lifecycle
          # collector). Arming this without it evaluates a missing series and
          # never fires (silent), the footgun this group prevents. warn, not page:
          # idle capacity is a cost signal to investigate, not an availability
          # incident. Written gauge > threshold so an absent series yields NO
          # result (never a phantom fire). Real sustained-low CPU/mem utilization
          # (busy-looking nodes barely using their requests) stays blocked — it
          # needs node-exporter/cadvisor series absent from vmsingle today.
          - alert: AgentFleetIdleNodes
            expr: |
              gardenio_agent_idle_node_count > {{ $ga.idleNodes.threshold }}
            for: {{ $ga.idleNodes.for | quote }}
            labels:
              severity: {{ $ga.idleNodes.severity | quote }}
              component: gardenio
              subsystem: cost
            annotations:
              summary: "agent-pool has >{{ $ga.idleNodes.threshold }} idle nodes (provisioned but nothing scheduled)"
              description: |
                The count of agent-pool nodes hosting zero active agent pods
                (gardenio_agent_idle_node_count) has been above
                {{ $ga.idleNodes.threshold }} for {{ $ga.idleNodes.for }} — the
                fleet is running On-Demand nodes Karpenter has not consolidated,
                paying for idle capacity (gardenio-account EC2 is 100% On-Demand).
                Check gardenio_agent_node_count / gardenio_agents_active to gauge how
                much of the fleet is idle, then tighten Karpenter consolidation/TTL
                or right-size over-provisioned instance types. This is the
                "provisioned but nothing scheduled" signal; real sustained-low
                CPU/mem utilization is a separate blocked follow-up. Cross-refs the
                cost-control epic ka-0000006909.
              runbook_url: "{{ $ga.runbookBaseURL }}#agentfleetidlenodes"
              {{- if $dashBase }}
              dashboard: "{{ $dashBase }}/d/gardenio-involuntary-deaths/gardenio-killed-mid-work-agents-involuntary-deaths?{{ $dashWindow }}"
              {{- end }}
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.pendingPods.enabled }}
          # GAP-1 — agent pods stuck Pending. Requires the controller gauge
          # gardenio_agent_pods_pending (prereq {{ $ga.pendingPods.prereqBead }}).
          - alert: AgentPodsPendingTooLong
            expr: |
              sum(gardenio_agent_pods_pending) > {{ $ga.pendingPods.threshold }}
            for: {{ $ga.pendingPods.for | quote }}
            labels:
              severity: {{ $ga.pendingPods.severity | quote }}
              subsystem: agent-scheduling
            annotations:
              summary: "agent pods stuck Pending >{{ $ga.pendingPods.for }} (spawn stall)"
              description: |
                Agent pods cannot schedule. Check agent-pool nodepool memory
                headroom (GAP-2), ephemeral ns bloat (GAP-3), and
                kubectl -n {{ .Release.Namespace }} get pods
                -l app.kubernetes.io/component=agents --field-selector=status.phase=Pending.
              runbook_url: "{{ $ga.runbookBaseURL }}#agentpodspendingtoolong"
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.nodepoolMemory.enabled }}
          # GAP-2 — karpenter agent-pool provisioned memory ≥ limit. Requires
          # karpenter_* scraped into vmagent (prereq {{ $ga.nodepoolMemory.prereqBead }}).
          # Metric names AND label keys vary by karpenter version — verify both
          # against the running build (curl karpenter-metrics:8080/metrics | grep
          # nodepool) before enabling. The v1 series are
          # karpenter_nodepools_{usage,limit}, and v1.3.3 labels the resource
          # dimension `resource_type` (NOT `resource` — the pre-v1 key). A wrong
          # label key selects an EMPTY vector and the alert can NEVER fire
          # (ka-0000005173), the exact silent-no-fire this pack exists to kill.
          # Written as usage >= threshold*limit (NOT usage/limit >= threshold) so
          # a 0/absent limit yields NO result instead of usage/0 = +Inf, which
          # would satisfy >= threshold and spuriously page (ka-0000001461 review).
          - alert: AgentPoolMemoryNearLimit
            expr: |
              karpenter_nodepools_usage{nodepool="{{ $ga.nodepoolMemory.nodepool }}",resource_type="memory"}
              >=
              {{ $ga.nodepoolMemory.threshold }} * karpenter_nodepools_limit{nodepool="{{ $ga.nodepoolMemory.nodepool }}",resource_type="memory"}
            for: {{ $ga.nodepoolMemory.for | quote }}
            labels:
              severity: {{ $ga.nodepoolMemory.severity | quote }}
              subsystem: capacity
            annotations:
              summary: "karpenter {{ $ga.nodepoolMemory.nodepool }} provisioned memory ≥{{ $ga.nodepoolMemory.threshold }} of limit"
              description: |
                The {{ $ga.nodepoolMemory.nodepool }} nodepool is near its provisioned-memory
                limit — Karpenter will soon refuse new nodes and agent pods will
                stall Pending (the 2026-07-08 root cause, ~12h early warning).
                Mitigation: raise the nodepool memory limit in IaC and reconcile
                any live kubectl-patch drift; check ns bloat (GAP-3). See runbook.
              runbook_url: "{{ $ga.runbookBaseURL }}#agentpoolmemorynearlimit"
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- if $ga.pvcObs.enabled }}
          # ka-0000002737 — orphaned Pending PVCs (storage/EBS cost leak). Backed
          # by the controller gauge gardenio_orphaned_pending_pvcs (PVCs stuck
          # Pending past the orphan threshold with no consuming pod, re-derived
          # every controller sweep; the in-chart vmagent has no KSM). The day-1
          # cost-gardener survey found observability/tempo-0 (~200d) and dolt/redis-master-0
          # (~148d) leaking silently. Threshold defaults to 0 so the alert fires
          # on the FIRST confirmed orphan — one is already a leak worth an owner
          # cleaning up. Prereq {{ $ga.pvcObs.prereqBead }}.
          - alert: OrphanedPendingPVCs
            expr: |
              gardenio_orphaned_pending_pvcs > {{ $ga.pvcObs.threshold }}
            for: {{ $ga.pvcObs.for | quote }}
            labels:
              severity: {{ $ga.pvcObs.severity | quote }}
              component: gardenio
              subsystem: storage-cost
            annotations:
              summary: "orphaned Pending PVCs >{{ $ga.pvcObs.threshold }} (storage cost leak)"
              description: |
                One or more PersistentVolumeClaims have been stuck Pending past
                the orphan threshold with no consuming pod for {{ $ga.pvcObs.for }}
                — a long-abandoned storage/EBS cost leak (the day-1 cost-gardener
                survey found observability/tempo-0 ~200d and dolt/redis-master-0
                ~148d). The oldest age is in
                gardenio_orphaned_pending_pvc_max_age_seconds and the wasted
                capacity in gardenio_orphaned_pending_pvc_requested_bytes; the
                per-PVC gardenio_orphaned_pending_pvc_age_seconds{namespace,name,
                storageclass} names exactly which claims to clean up.
                Triage: confirm the consumer is truly gone/relocated, then have
                the owning team delete the abandoned PVC. See runbook.
              runbook_url: "{{ $ga.runbookBaseURL }}#orphanedpendingpvcs"
              {{- if $beadURL }}
              bead: {{ $beadURL | quote }}
              {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
  assistant-pane-alert.yaml — AssistantPaneSilent on the vmalert rule path
  (ka-0000004766). The alert's canonical home is the PrometheusRule CRD
  (templates/slack-bridge/assistant-pane-alert.yaml — full failure-mode +
  tuning rationale there), but on new prod that CRD is INERT (converted to a
  VMRule nobody evaluates — same reason the gap-alerts above are ConfigMap
  keys). Render the SAME rule (shared define, zero drift) as a ConfigMap key
  the vmalert -rule=/config/*.yaml glob loads, whenever the pane alert is
  enabled and a notifier is wired (alerting rules without a notifier crashloop
  vmalert). vmsingle has the gardenio_assistant_event_total series via the
  slack-bridge pod's prometheus.io/scrape annotation, so the expr evaluates
  against real history. Deliberately independent of gapAlerts.enabled — this
  is the pane smoke check, not part of the starter pack.
*/ -}}
{{- if and .Values.slackBridge.metrics.prometheusRule.assistantPane.enabled $notifierAvailable }}
  # AssistantPaneSilent on the fireable (ConfigMap) rule path — see
  # templates/slack-bridge/assistant-pane-alert.yaml for the full rationale.
  assistant-pane-alert.yaml: |
    groups:
      - name: gardenio.assistant_pane
        interval: 1m
        rules:
          {{- include "gardenio.slackBridge.assistantPaneSilentRule" . | nindent 10 }}
{{- end }}
{{- /*
  lands-slo.yaml — the Lands SLO recording rules and burn-rate alerts (Track B
  §5.8, gd-rqtbyqCMZJ) on the vmalert rule path. Canonical home and rationale:
  templates/_lands-slo.tpl, rendered also as the PrometheusRule CRD
  templates/lands-slo-rules.yaml (inert where no VMAlert evaluates it). Same
  define, zero drift; gated on a notifier like every alerting key here.
*/ -}}
{{- if and .Values.agents.metrics.prometheusRule.landsSLO.enabled $notifierAvailable }}
  # Lands SLOs on the fireable (ConfigMap) rule path — see
  # templates/_lands-slo.tpl for the full rationale.
  lands-slo.yaml: |
    groups:
      {{- include "gardenio.landsSLO.groups" . | nindent 6 }}
{{- end }}
{{- /*
  postgres-budgets.yaml — Postgres efficiency budgets on the postgres_exporter
  series (gd-ylgk1jBhLi); rules and rationale in templates/_postgres-budgets.tpl.
  Needs the exporter, and a notifier like every alerting key here.
*/ -}}
{{- if and .Values.vmalert.postgresBudgets.enabled .Values.postgres.enabled .Values.postgres.exporter.enabled $notifierAvailable }}
  postgres-budgets.yaml: |
    groups:
      {{- include "gardenio.postgresBudgets.groups" . | nindent 6 }}
{{- end }}
{{- end }}

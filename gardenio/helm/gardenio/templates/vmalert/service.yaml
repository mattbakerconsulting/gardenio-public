{{- if .Values.vmalert.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.vmalert.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vmalert.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8880
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.vmalert.selectorLabels" . | nindent 4 }}
{{- end }}

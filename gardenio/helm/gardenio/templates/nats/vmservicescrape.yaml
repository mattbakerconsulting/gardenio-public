{{/*
VMServiceScrape for gardenio-nats (monitoring port 8222).

Emitted only when both `nats.enabled` and `monitoring.victoriaMetrics.enabled`
are true. NATS exposes Prometheus-format metrics on the monitoring port
(/metrics). There is no parallel ServiceMonitor for nats in the chart today.
customer-poc-aws POC use case: see bead ka-0000005115.
*/}}
{{- if and .Values.nats.enabled (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.nats.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.nats.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gardenio.nats.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: monitoring
      path: /metrics
      interval: {{ .Values.monitoring.victoriaMetrics.interval | default "30s" }}
{{- end }}

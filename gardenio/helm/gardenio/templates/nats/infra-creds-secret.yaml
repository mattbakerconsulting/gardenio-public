{{- if and .Values.nats.enabled .Values.nats.auth.enabled .Values.nats.auth.subjectIsolation.enabled }}
{{- $iso := .Values.nats.auth.subjectIsolation -}}
{{- if and $iso.existingSecrets (or $iso.infraToken $iso.agentToken (and .Values.externalSecrets.enabled (or .Values.externalSecrets.natsInfraToken.remoteRef .Values.externalSecrets.natsAgentToken.remoteRef))) }}
{{- fail "nats.auth.subjectIsolation.existingSecrets is exclusive with infraToken/agentToken and the natsInfraToken/natsAgentToken ExternalSecrets: the operator creates both creds Secrets, so set none of these" }}
{{- end }}
{{- if not $iso.existingSecrets }}
{{- $useExternal := and .Values.externalSecrets.enabled .Values.externalSecrets.natsInfraToken.remoteRef -}}
{{- if $useExternal }}
# NATS infrastructure token sourced from AWS Secrets Manager via ExternalSecret.
# Used by controller, beads daemon, bridges, and coopmux for full pub/sub access.
# The "token" key is consumed by controller via NATS_TOKEN env var.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gardenio.fullname" . }}-nats-infra-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
spec:
  # Category: rotated — NATS infra (full pub/sub) token. Short refresh so
  # controller / bridges / coopmux pick up rotations promptly.
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "rotated" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "gardenio.fullname" . }}-nats-infra-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        token: '{{`{{ .token }}`}}'
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.externalSecrets.natsInfraToken.remoteRef | quote }}
        {{- if .Values.externalSecrets.natsInfraToken.property }}
        property: {{ .Values.externalSecrets.natsInfraToken.property | quote }}
        {{- end }}
{{- else }}
# Dev/test escape hatch: raw K8s Secret populated from
# .Values.nats.auth.subjectIsolation.infraToken. For production, configure
# `externalSecrets.natsInfraToken.remoteRef` (AWS Secrets Manager key) so the
# token is not persisted in values.yaml or the helm release in etcd.
# Used by controller, beads daemon, bridges, and coopmux for full pub/sub access.
# The "token" key is consumed by controller via NATS_TOKEN env var.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.fullname" . }}-nats-infra-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.nats.auth.subjectIsolation.infraToken | quote }}
{{- end }}
{{- end }}
{{- end }}

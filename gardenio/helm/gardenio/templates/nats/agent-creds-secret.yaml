{{- if and .Values.nats.enabled .Values.nats.auth.enabled .Values.nats.auth.subjectIsolation.enabled (not .Values.nats.auth.subjectIsolation.existingSecrets) }}
{{- $useExternal := and .Values.externalSecrets.enabled .Values.externalSecrets.natsAgentToken.remoteRef -}}
{{- /* Render the agent NATS token into every namespace agent pods can be
     routed to: the release namespace, plus the PSA-privileged gVisor
     namespace when the namespace split is active (routeGVisorNamespace).
     Secrets cannot be referenced across namespaces, so without the second
     copy every runsc-routed agent defers forever on "gardenio-nats-agent-creds
     not yet synced in namespace <gvisor-ns>" and MicroVM launches deliver no
     COOP_NATS_TOKEN (resolveMicrovmNatsToken reads the routed namespace) —
     bug ka-0000004273, found arming the E2E gate ka-0000000183. */ -}}
{{- $namespaces := list .Release.Namespace -}}
{{- if and .Values.gvisor.enabled .Values.gvisor.namespace.name (ne .Values.gvisor.namespace.name .Release.Namespace) -}}
{{- $namespaces = append $namespaces .Values.gvisor.namespace.name -}}
{{- end -}}
{{- range $ns := $namespaces }}
---
{{- if $useExternal }}
# NATS agent token sourced from AWS Secrets Manager via ExternalSecret.
# W5 (ka-0000006585): mounted into agent pods as a tmpfs-backed file at
# /etc/nats-token/token (K8s Secret volumes are tmpfs by default). Agents
# read the token via $COOP_NATS_TOKEN_FILE so it is not visible in
# /proc/self/environ or `kubectl describe pod`. Token grants restricted
# permissions (publish-only to agent-scoped subjects, no cross-agent
# message reading). See docs/nats-token-hardening.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gardenio.fullname" $ }}-nats-agent-creds
  namespace: {{ $ns }}
  labels:
    {{- include "gardenio.labels" $ | nindent 4 }}
spec:
  # Category: rotated — NATS subject-isolation token. Short refresh so agent
  # pods reconnect with the new token before the old one is revoked.
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "rotated" "root" $) }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ $.Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "gardenio.fullname" $ }}-nats-agent-creds
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        token: '{{`{{ .token }}`}}'
  data:
    - secretKey: token
      remoteRef:
        key: {{ $.Values.externalSecrets.natsAgentToken.remoteRef | quote }}
        {{- if $.Values.externalSecrets.natsAgentToken.property }}
        property: {{ $.Values.externalSecrets.natsAgentToken.property | quote }}
        {{- end }}
{{- else }}
# Dev/test escape hatch: raw K8s Secret populated from
# .Values.nats.auth.subjectIsolation.agentToken. For production, configure
# `externalSecrets.natsAgentToken.remoteRef` (AWS Secrets Manager key) so the
# token is not persisted in values.yaml or the helm release in etcd.
# W5 (ka-0000006585): mounted into agent pods as a tmpfs-backed file at
# /etc/nats-token/token; agents read it via $COOP_NATS_TOKEN_FILE.
# Token grants restricted permissions (publish-only to agent-scoped
# subjects, no cross-agent message reading).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.fullname" $ }}-nats-agent-creds
  namespace: {{ $ns }}
  labels:
    {{- include "gardenio.labels" $ | nindent 4 }}
type: Opaque
stringData:
  token: {{ $.Values.nats.auth.subjectIsolation.agentToken | quote }}
{{- end }}
{{- end }}
{{- end }}

{{/*
VMServiceScrape for gardenio-beads (daemon /metrics on port 9091).

Emitted only when the beads service is rendered (fleet.enabled=false) and
`monitoring.victoriaMetrics.enabled` is true. There is no parallel
ServiceMonitor for beads in the chart today — this is the first scrape-target
resource for the beads component. customer-poc-aws POC use case: see bead
ka-0000005115.
*/}}
{{- if and (not .Values.fleet.enabled) (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.beads.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.beads.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gardenio.beads.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.victoriaMetrics.interval | default "30s" }}
{{- end }}

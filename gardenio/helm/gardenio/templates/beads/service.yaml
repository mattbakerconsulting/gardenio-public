{{- if not .Values.fleet.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.beads.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.beads.labels" . | nindent 4 }}
spec:
  type: {{ .Values.beads.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.beads.service.grpcPort | default 9090 }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.beads.service.httpPort | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.beads.service.metricsPort | default 9091 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.beads.selectorLabels" . | nindent 4 }}
{{- end }}

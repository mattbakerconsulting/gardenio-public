{{- if .Values.global.coverage.enabled }}
# Coverage PVC — shared volume for runtime coverage profiling data.
# Go binaries write to GOCOVERDIR, Rust binaries write to LLVM_PROFILE_FILE.
# Data persists across pod restarts for long-term dead code analysis.
#
# The weekly in-cluster coverage-merge CronJob that used to live here was
# retired (ka-0000006110): merge + the dead-code-candidate report moved to the
# pre-Actions CI's weekly coverage-merge job, and no workflow runs them today
# (checks.yml and e2e.yml have no coverage-merge job). The PVC
# is retained for runtime coverage collection.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gardenio.agents.fullname" . }}-coverage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" . | nindent 4 }}
    app.kubernetes.io/component: coverage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.global.coverage.persistence.storageClass | default .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.global.coverage.persistence.size }}
{{- end }}

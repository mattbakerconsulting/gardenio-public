{{- if and .Values.githubBridge.enabled .Values.githubBridge.webhookSecret.externalSecret.enabled }}
# GitHub App webhook secret, synced from SSM Parameter Store
# (/gardenio/github-app/agents/webhook-secret, SecureString under the CMK;
# written by scripts/github-app-register.py) into one Secret, key "webhook-secret".
# The bridge mounts it as a file and HMAC-verifies every delivery with it; an
# empty or missing value makes the bridge refuse to start. The bridge holds ONE
# secret, so rotation has a short window of failed deliveries between the SSM
# update syncing and the new secret being saved on the App; redeliver those from
# the App's Advanced tab. See docs/runbooks/github-bridge.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.githubBridge.webhookSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-bridge
spec:
  refreshInterval: {{ .Values.githubBridge.webhookSecret.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.githubBridge.webhookSecret.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ required "githubBridge.webhookSecret.externalSecret.secretStoreName is required when the external secret is enabled" .Values.githubBridge.webhookSecret.externalSecret.secretStoreName }}
  target:
    name: {{ .Values.githubBridge.webhookSecret.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
  data:
    - secretKey: {{ .Values.githubBridge.webhookSecret.secretKey | default "webhook-secret" }}
      remoteRef:
        key: {{ .Values.githubBridge.webhookSecret.externalSecret.remoteRef | quote }}
{{- end }}

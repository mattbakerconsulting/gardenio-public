{{- if .Values.githubBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-github-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: github-bridge
spec:
  type: {{ .Values.githubBridge.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.githubBridge.service.port | default 8101 }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9101
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: github-bridge
{{- end }}

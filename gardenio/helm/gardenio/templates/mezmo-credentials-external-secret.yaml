{{- if and .Values.agents.enabled .Values.agents.mezmoServiceKeySecret .Values.agents.mezmoServiceKeyExternalSecret.enabled }}
# Mezmo MCP service key from external secret store for agent pods (observability log analysis)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.agents.mezmoServiceKeySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" $ | nindent 4 }}
spec:
  # Category: oauth — Mezmo MCP service key is an external-provider API key.
  # Honors the per-component override on agents.mezmoServiceKeyExternalSecret
  # but otherwise picks up the central `oauth` bucket. Historical default
  # was 15m; the centralized 1h matches actual rotation cadence (operator-
  # initiated in Mezmo) — set the per-component override if you need faster.
  refreshInterval: {{ .Values.agents.mezmoServiceKeyExternalSecret.refreshInterval | default (include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .)) }}
  secretStoreRef:
    kind: {{ .Values.agents.mezmoServiceKeyExternalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.agents.mezmoServiceKeyExternalSecret.secretStoreName }}
  target:
    name: {{ .Values.agents.mezmoServiceKeySecret }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        token: '{{`{{ .token }}`}}'
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.agents.mezmoServiceKeyExternalSecret.remoteRef | quote }}
        property: {{ .Values.agents.mezmoServiceKeyExternalSecret.tokenProperty | default "token" | quote }}
{{- end }}

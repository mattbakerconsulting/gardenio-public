{{- if .Values.vmsingle.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.vmsingle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vmsingle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8428
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.vmsingle.selectorLabels" . | nindent 4 }}
{{- end }}

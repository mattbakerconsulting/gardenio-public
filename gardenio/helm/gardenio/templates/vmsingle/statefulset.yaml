{{- if .Values.vmsingle.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "gardenio.vmsingle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vmsingle.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "gardenio.vmsingle.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "gardenio.vmsingle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gardenio.vmsingle.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmsingle
          image: {{ include "gardenio.mirroredImage" (dict "image" .Values.vmsingle.image "global" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.vmsingle.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args:
            - "-retentionPeriod={{ .Values.vmsingle.retentionPeriod }}"
            - "-storageDataPath=/victoria-metrics-data"
            - "-httpListenAddr=:8428"
          ports:
            - name: http
              containerPort: 8428
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.vmsingle.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if not .Values.vmsingle.persistence.enabled }}
        {{- /* Persistence disabled (throwaway ephemeral test namespaces,
               ka-0000000711): back the metrics data dir with an emptyDir
               instead of a PVC. The volumeClaimTemplates block only renders
               when persistence is enabled, so the `data` mount would otherwise
               dangle. emptyDir avoids consuming an EBS attachment slot on the
               POC node — see the postgres statefulset note for the
               AttachmentLimitExceeded chain. */}}
        - name: data
          emptyDir: {}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- include "gardenio.nodeSelector" (dict "local" .Values.vmsingle.nodeSelector "global" .Values.global.nodeSelector) | nindent 6 }}
      {{- with .Values.vmsingle.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "gardenio.tolerations" (dict "local" .Values.vmsingle.tolerations "global" .Values.global.tolerations) | nindent 6 }}
      {{- if .Values.global.systemPriorityClass.create }}
      priorityClassName: {{ .Values.global.systemPriorityClass.name }}
      {{- end }}
  {{- if .Values.vmsingle.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.vmsingle.persistence.storageClass }}
        storageClassName: {{ .Values.vmsingle.persistence.storageClass }}
        {{- else if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.vmsingle.persistence.size }}
  {{- end }}
{{- end }}

{{- if .Values.slackBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-slack-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-bridge
spec:
  type: {{ .Values.slackBridge.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.slackBridge.service.port | default 8090 }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9093
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- if .Values.landNamespaces.enabled }}
    - port: 8091
      targetPort: land
      protocol: TCP
      name: land
    {{- end }}
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: slack-bridge
{{- end }}

{{/*
ServiceMonitor for the slack-bridge /metrics endpoint (port 9093).

The bridge exports gardenio_assistant_event_total and
gardenio_mention_delivery_total on :9093 (assistant_event_metrics.go), but until
this resource existed nothing scraped them — so the ka-0000000892 smoke metric
("did handleAssistantMessage fire?") was exported into the void. This wires the
endpoint into a prometheus-operator scrape so the assistant-pane alert
(slack-bridge/assistant-pane-alert.yaml) has data to evaluate.

Emitted only when both slackBridge.enabled and the serviceMonitor toggle are
true. Parallel to vmservicescrape.yaml for clusters running vm-operator instead
of prometheus-operator. Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
*/}}
{{- if and .Values.slackBridge.enabled (.Values.slackBridge.metrics.serviceMonitor.enabled | default false) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gardenio.fullname" . }}-slack-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-bridge
spec:
  selector:
    matchLabels:
      {{- include "gardenio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: slack-bridge
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.slackBridge.metrics.serviceMonitor.interval | default "30s" }}
{{- end }}

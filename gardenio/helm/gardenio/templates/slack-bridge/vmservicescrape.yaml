{{/*
VMServiceScrape for the slack-bridge /metrics endpoint (port 9093).

vm-operator analogue of slack-bridge/servicemonitor.yaml, for clusters that run
operator.victoriametrics.com without prometheus-operator (no ServiceMonitor
CRD) — e.g. the customer-poc-aws POC cluster poc-gardenio-eks (bead
ka-0000005115). Scrapes the bridge's gardenio_assistant_event_total /
gardenio_mention_delivery_total so the ka-0000000892 assistant-pane smoke alert
can evaluate.

Emitted only when both slackBridge.enabled and
monitoring.victoriaMetrics.enabled are true. Parallel with the ServiceMonitor —
both can be enabled simultaneously without conflict.
*/}}
{{- if and .Values.slackBridge.enabled (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.fullname" . }}-slack-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-bridge
spec:
  selector:
    matchLabels:
      {{- include "gardenio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: slack-bridge
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.slackBridge.metrics.serviceMonitor.interval | default .Values.monitoring.victoriaMetrics.interval | default "30s" }}
{{- end }}

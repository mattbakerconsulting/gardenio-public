{{- if .Values.triggerEngine.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-trigger-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: trigger-engine
spec:
  type: {{ .Values.triggerEngine.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.triggerEngine.service.port | default 8094 }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9092
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: trigger-engine
{{- end }}

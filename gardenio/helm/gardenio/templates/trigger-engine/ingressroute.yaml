{{- if and (eq (include "gardenio.traefik.ingressRoutesEnabled" .) "true") .Values.triggerEngine.enabled .Values.triggerEngine.ingress.enabled }}
{{- if and .Values.triggerEngine.ingress.ipWhitelist.enabled (empty .Values.triggerEngine.ingress.ipWhitelist.sourceRange) }}
{{- fail "triggerEngine.ingress.ipWhitelist.enabled is true but triggerEngine.ingress.ipWhitelist.sourceRange is empty: set webhook source CIDRs (see values.yaml comments) or set triggerEngine.ingress.ipWhitelist.enabled=false." }}
{{- end }}
{{- $fullname := printf "%s-trigger-engine" (include "gardenio.fullname" .) -}}
{{- $host := .Values.triggerEngine.ingress.host -}}
{{- $port := .Values.triggerEngine.service.port | default 8094 -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: trigger-engine
spec:
  # With TLS on, websecure ONLY: webhook payloads and signatures must never
  # be served in plaintext. Port 80 then only reaches the chart's
  # http->https redirect (priority 1). On a no-TLS install keep web as well,
  # or the route would have no listener at all.
  entryPoints:
    {{- if not .Values.tls.enabled }}
    - web
    {{- end }}
    - websecure
  routes:
    - match: Host(`{{ $host }}`) && PathPrefix(`/webhooks/`)
      kind: Rule
      priority: 100
      services:
        - name: {{ $fullname }}
          port: {{ $port }}
      middlewares:
        {{- include "gardenio.edgeMiddlewares" . | nindent 8 }}
        {{- if .Values.global.securityHeaders.enabled }}
        - name: {{ include "gardenio.fullname" . }}-security-headers
        {{- end }}
        {{- if .Values.triggerEngine.ingress.ipWhitelist.enabled }}
        - name: {{ $fullname }}-ipwhitelist
        {{- end }}
        {{- if .Values.triggerEngine.ingress.rateLimit.enabled }}
        - name: {{ $fullname }}-ratelimit
        {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
    secretName: {{ include "gardenio.tls.secretName" . }}
    {{- if .Values.tls.optionName }}
    options:
      name: {{ .Values.tls.optionName }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- end }}
{{- if .Values.triggerEngine.ingress.ipWhitelist.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ipwhitelist
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: trigger-engine
spec:
  ipWhiteList:
    sourceRange:
      {{- toYaml .Values.triggerEngine.ingress.ipWhitelist.sourceRange | nindent 6 }}
    ipStrategy:
      depth: {{ .Values.triggerEngine.ingress.ipWhitelist.depth | default 1 }}
{{- end }}
{{- if .Values.triggerEngine.ingress.rateLimit.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-ratelimit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: trigger-engine
spec:
  rateLimit:
    average: {{ .Values.triggerEngine.ingress.rateLimit.average }}
    burst: {{ .Values.triggerEngine.ingress.rateLimit.burst }}
{{- end }}
{{- end }}

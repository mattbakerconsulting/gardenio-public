{{- if and (eq (include "gardenio.traefik.ingressRoutesEnabled" .) "true") .Values.tls.enabled .Values.tls.createOption }}
# ── Traefik TLSOption (audit F1) ─────────────────────────────────────────────
# Pins TLS posture for every public IngressRoute in the chart. Without this
# CR, Traefik falls back to its built-in defaults — fine today but unpinned.
#
# Profile: Mozilla "intermediate" (broad client compatibility, no TLS 1.0/1.1,
# no weak ciphers, server cipher preference honored, SNI required).
#
# Referenced by IngressRoute `tls.options.name` blocks (see other templates).
# Disable creation via `tls.createOption: false` (e.g. when the Traefik CRDs
# aren't installed in the target cluster).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ .Values.tls.optionName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: tls-option
spec:
  minVersion: VersionTLS12
  cipherSuites:
    # TLS 1.3 (cipher suite negotiation is fixed in 1.3 but listing them is
    # the documented Mozilla intermediate set).
    - TLS_AES_128_GCM_SHA256
    - TLS_AES_256_GCM_SHA384
    - TLS_CHACHA20_POLY1305_SHA256
    # TLS 1.2 (ECDHE forward-secrecy + AEAD only).
    - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
  curvePreferences:
    - CurveP256
    - X25519
  sniStrict: true
{{- end }}

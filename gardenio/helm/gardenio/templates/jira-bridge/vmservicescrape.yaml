{{/*
VMServiceScrape for the jira-bridge /metrics endpoint (port 9093).

vm-operator analogue of the Path A pod annotations on the jira-bridge
Deployment, for clusters that run operator.victoriametrics.com WITHOUT an
in-chart vmagent — e.g. the customer-poc-aws POC cluster poc-gardenio-eks
(bead ka-0000005115). Scrapes the JQL-count exporter's
gardenio_jira_issues / gardenio_jira_scrape_duration_seconds /
gardenio_jira_scrape_errors_total series (Phase 2, ka-0000006172).

Emitted only when both jiraBridge.enabled and monitoring.victoriaMetrics.enabled
are true. Parallel with the Path A annotations — both can be enabled
simultaneously without conflict.
*/}}
{{- if and .Values.jiraBridge.enabled (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.fullname" . }}-jira-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: jira-bridge
spec:
  selector:
    matchLabels:
      {{- include "gardenio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: jira-bridge
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.jiraBridge.metrics.serviceMonitor.interval | default .Values.monitoring.victoriaMetrics.interval | default "30s" }}
{{- end }}

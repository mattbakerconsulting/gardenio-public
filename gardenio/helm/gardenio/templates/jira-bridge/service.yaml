{{- if .Values.jiraBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-jira-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: jira-bridge
spec:
  type: {{ .Values.jiraBridge.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.jiraBridge.service.port | default 8091 }}
      targetPort: http
      protocol: TCP
      name: http
    # Metrics endpoint — name MUST be exactly `metrics`; the VMServiceScrape
    # (Path B) matches the endpoint by this port-name string.
    - port: 9093
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: jira-bridge
{{- end }}

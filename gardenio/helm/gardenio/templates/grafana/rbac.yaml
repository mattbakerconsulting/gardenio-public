{{- if and .Values.grafana.enabled .Values.grafana.sidecar.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.grafana.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.grafana.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gardenio.grafana.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.grafana.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gardenio.grafana.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.grafana.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gardenio.grafana.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gardenio.grafana.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

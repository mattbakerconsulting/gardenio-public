{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.grafana.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.grafana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.grafana.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.grafana.service.port | default 3000 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.grafana.auth.proxy.agentPath.enabled }}
    # Header-stripping agent port (gd-RUhOpXWwmz): agents reach Grafana here,
    # never on the trusted port above.
    - port: {{ .Values.grafana.auth.proxy.agentPath.port }}
      targetPort: http-agent
      protocol: TCP
      name: http-agent
    {{- end }}
  selector:
    {{- include "gardenio.grafana.selectorLabels" . | nindent 4 }}
{{- end }}

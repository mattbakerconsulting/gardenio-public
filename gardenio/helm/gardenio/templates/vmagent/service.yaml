{{- if .Values.vmagent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.vmagent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vmagent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8429
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.vmagent.selectorLabels" . | nindent 4 }}
{{- end }}

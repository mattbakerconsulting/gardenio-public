{{- if .Values.keycloak.enabled }}
{{- $fullname := include "gardenio.fullname" . -}}
{{- range .Values.keycloak.roles }}
# ── KeycloakRealmRole: {{ .name }} ────────────────────────────────────────────
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmRole
metadata:
  name: {{ $fullname }}-role-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gardenio.labels" $ | nindent 4 }}
  annotations:
    edp.epam.com/preserve-resources-on-deletion: "true"
spec:
  name: {{ .name | quote }}
  realmRef:
    name: {{ $fullname }}-realm
    kind: KeycloakRealm
  {{- if .description }}
  description: {{ .description | quote }}
  {{- end }}
  {{- if .isDefault }}
  isDefault: {{ .isDefault }}
  {{- end }}
  {{- if .composite }}
  composite: {{ .composite }}
  {{- end }}
  {{- if .composites }}
  composites:
    {{- toYaml .composites | nindent 4 }}
  {{- end }}
  {{- if .attributes }}
  attributes:
    {{- toYaml .attributes | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}

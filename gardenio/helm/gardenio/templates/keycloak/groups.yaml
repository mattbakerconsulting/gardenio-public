{{- if .Values.keycloak.enabled }}
{{- $fullname := include "gardenio.fullname" . -}}
{{- range .Values.keycloak.groups }}
# ── KeycloakRealmGroup: {{ .name }} ───────────────────────────────────────────
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: {{ $fullname }}-group-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gardenio.labels" $ | nindent 4 }}
  annotations:
    edp.epam.com/preserve-resources-on-deletion: "true"
spec:
  name: {{ .name | quote }}
  realmRef:
    name: {{ $fullname }}-realm
    kind: KeycloakRealm
  {{- if .description }}
  description: {{ .description | quote }}
  {{- end }}
  {{- if .realmRoles }}
  realmRoles:
    {{- toYaml .realmRoles | nindent 4 }}
  {{- end }}
  {{- if .clientRoles }}
  clientRoles:
    {{- toYaml .clientRoles | nindent 4 }}
  {{- end }}
  {{- if .attributes }}
  attributes:
    {{- toYaml .attributes | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- /* Per-project member groups: only the project name is an input; the realm
role is fixed so a project group can never be configured into a global grant. */}}
{{- range .Values.keycloak.projectGroups }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" (.name | default "")) }}
{{- fail (printf "keycloak.projectGroups[].name must be a lowercase DNS-label project name, got %q" (.name | default "")) }}
{{- end }}
# ── KeycloakRealmGroup: project-{{ .name }} ───────────────────────────────────
apiVersion: v1.edp.epam.com/v1
kind: KeycloakRealmGroup
metadata:
  name: {{ $fullname }}-group-project-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gardenio.labels" $ | nindent 4 }}
  annotations:
    edp.epam.com/preserve-resources-on-deletion: "true"
spec:
  name: {{ printf "project-%s" .name | quote }}
  realmRef:
    name: {{ $fullname }}-realm
    kind: KeycloakRealm
  realmRoles:
    - gardenio-project-member
---
{{- end }}
{{- end }}

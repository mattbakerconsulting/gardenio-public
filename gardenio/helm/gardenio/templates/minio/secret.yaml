{{- if .Values.objectStore.enabled }}
{{- /*
In-box object store (MinIO) root credentials — ka-0000004955.

OFF by default (objectStore.enabled=false). Rendered only by the in-box
profile (values-inbox.yaml), where MinIO replaces AWS S3 as the session/image
object store. MinIO uses a static access-key/secret-key pair (no IRSA in-box);
coop, the controller, and beads-viewer pick these up from AWS_ACCESS_KEY_ID /
AWS_SECRET_ACCESS_KEY (default AWS credential chain) sourced from this Secret.

Seeding modes (the chart renders a Secret ONLY in the inline mode):
  - RECOMMENDED (operator-seeded): objectStore.rootPassword empty → the chart
    renders NO Secret and references gardenio.minio.secretName (objectStore.
    existingSecret, or the default "<release>-minio-credentials"). deploy-byo.sh
    (`ensure_secret` via `openssl rand`, create-if-missing) seeds it so creds
    are never baked into chart values. A genuinely-missing Secret fails closed
    at MinIO startup (the server won't boot without MINIO_ROOT_USER/PASSWORD) —
    never a silent-plaintext default.
  - INLINE (dev/test): objectStore.rootPassword set → the chart renders the
    Secret from rootUser/rootPassword at the default name. Ignored when
    existingSecret is set (the operator-supplied Secret always wins).
*/}}
{{- if and (not .Values.objectStore.existingSecret) .Values.objectStore.rootPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.minio.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  accesskey: {{ .Values.objectStore.rootUser | default "minioadmin" | quote }}
  secretkey: {{ .Values.objectStore.rootPassword | quote }}
{{- end }}
{{- end }}

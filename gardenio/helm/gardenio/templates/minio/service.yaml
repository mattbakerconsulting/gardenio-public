{{- if .Values.objectStore.enabled }}
{{- /*
In-box object store (MinIO) Service — ka-0000004955.
ClusterIP only; the S3 API on :9000 is the endpoint coop/controller/beads-viewer
target via COOP_S3_ENDPOINT (path-style). Never edge-exposed.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.minio.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.minio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: s3
      protocol: TCP
      name: s3
  selector:
    {{- include "gardenio.minio.selectorLabels" . | nindent 4 }}
{{- end }}

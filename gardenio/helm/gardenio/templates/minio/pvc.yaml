{{- if .Values.objectStore.enabled }}
{{- /*
In-box object store (MinIO) data PVC — ka-0000004955.

Single-node single-drive (SNSD): one RWO PVC on the same `local-path` storage
the in-box storage axis standardizes on. The session archive is sacrificial vs
postgres (audit/replay artifacts, not crown jewels), so it does NOT default to
the Retain StorageClass — a deliberate cap-and-prune posture, not durable
retention. Size with a hard cap; the ILM expiry rule (bootstrap Job) keeps the
archive self-pruning so it never crowds postgres on the shared host disk.
Standalone PVC (not a volumeClaimTemplate) so a Deployment can mount it.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gardenio.minio.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.minio.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.objectStore.persistence.storageClass }}
  storageClassName: {{ .Values.objectStore.persistence.storageClass }}
  {{- else if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.objectStore.persistence.size | quote }}
{{- end }}

{{- if .Values.grafanaBridge.enabled }}
# grafana-bridge writes per-dashboard ConfigMaps labeled grafana_dashboard="1"
# for the Grafana sidecar to provision (the least-privileged beads→Grafana write
# path — no Grafana credentials, only the k8s API). It owns only the ConfigMaps
# it creates (app.kubernetes.io/managed-by=grafana-bridge) and never touches the
# chart-shipped dashboard bundle CM.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.fullname" . }}-grafana-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gardenio.fullname" . }}-grafana-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-bridge
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gardenio.fullname" . }}-grafana-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-bridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gardenio.fullname" . }}-grafana-bridge
subjects:
  - kind: ServiceAccount
    name: {{ include "gardenio.fullname" . }}-grafana-bridge
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if and .Values.grafanaBridge.enabled .Values.grafanaBridge.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "gardenio.fullname" . }}-grafana-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-bridge
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.grafanaBridge.persistence.storageClass }}
  storageClassName: {{ .Values.grafanaBridge.persistence.storageClass | quote }}
  {{- else if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafanaBridge.persistence.size | default "1Gi" }}
{{- end }}

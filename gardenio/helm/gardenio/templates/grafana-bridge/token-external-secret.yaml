{{- if and .Values.grafanaBridge.enabled .Values.grafanaBridge.grafana.url .Values.grafanaBridge.grafana.tokenSecret .Values.grafanaBridge.grafana.externalSecret.enabled }}
# Grafana VIEWER service-account token for the grafana-bridge Grafana→beads
# read-back poll (W2-impl-b, ka-0000001236; follow-up seed task ka-0000003616).
# One k8s Secret (key "token") synced from AWS Secrets Manager, consumed by the
# grafana-bridge Deployment as GRAFANA_TOKEN (secretKeyRef) — the same Bearer-
# token-from-Secret shape as the mcp-grafana read sidecar.
#
# Read-back only calls GET /api/search + GET /api/dashboards/uid/<uid>, so a
# Viewer token is sufficient (the beads→Grafana write direction never uses this
# token — it stays on the least-privileged ConfigMap provisioning path). This is
# the same scope/rotation class as the mcp-grafana read token, so grafana.
# externalSecret.remoteRef defaults to the SAME SM entry.
#
# Default OFF (gated on grafanaBridge.enabled + grafana.url + grafana.tokenSecret
# + grafana.externalSecret.enabled). The ESO provider role can READ but not
# CreateSecret in AWS SM, so an operator seeds the SM entry once before flipping
# this on — see docs/runbooks/grafana-mcp-token.md. The break-glass path
# provisions the same Secret out-of-band instead (externalSecret.enabled=false).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafanaBridge.grafana.tokenSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-bridge
spec:
  # Category: oauth — a Grafana SA token is an external-provider API key, same
  # rotation class as the mcp-grafana token and the env Grafana token bundle.
  # Per-component override wins; otherwise the centralized `oauth` bucket applies.
  refreshInterval: {{ .Values.grafanaBridge.grafana.externalSecret.refreshInterval | default (include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .)) }}
  secretStoreRef:
    kind: {{ .Values.grafanaBridge.grafana.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.grafanaBridge.grafana.externalSecret.secretStoreName }}
  target:
    name: {{ .Values.grafanaBridge.grafana.tokenSecret }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        token: '{{`{{ .token }}`}}'
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.grafanaBridge.grafana.externalSecret.remoteRef | quote }}
        property: {{ .Values.grafanaBridge.grafana.externalSecret.tokenProperty | default "token" | quote }}
{{- end }}

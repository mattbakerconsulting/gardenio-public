{{- if .Values.agents.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" . | nindent 4 }}
  {{- with .Values.agents.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agents.service.type | default "ClusterIP" }}
  ports:
    - port: 8091
      targetPort: health
      protocol: TCP
      name: health
    - port: 9092
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- with .Values.agents.service.extraPorts }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "gardenio.agents.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if and .Values.agents.enabled .Values.agents.githubApp.enabled .Values.agents.githubApp.externalSecret.enabled }}
# GitHub App (agents) private key, synced from SSM Parameter Store
# (/gardenio/github-app/agents/private-key, SecureString under the CMK) into ONE
# Secret in the release namespace. Read only by the controller, as a mounted
# file. NOT mirrored into the gVisor namespace (see gvisor-namespace.yaml) and
# on the controller's agent-pod mount deny-list (isForbiddenPodSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.agents.githubApp.privateKeySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .Values.agents.githubApp.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ .Values.agents.githubApp.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ required "agents.githubApp.externalSecret.secretStoreName is required when the external secret is enabled" .Values.agents.githubApp.externalSecret.secretStoreName }}
  target:
    name: {{ .Values.agents.githubApp.privateKeySecret }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
  data:
    - secretKey: private-key
      remoteRef:
        key: {{ .Values.agents.githubApp.externalSecret.remoteRef | quote }}
{{- end }}

{{/*
VMServiceScrape for gardenio-agents (controller /metrics on port 9092).

Emitted only when both `agents.enabled` and `monitoring.victoriaMetrics.enabled`
are true. Parallel to controller/servicemonitor.yaml — intended for clusters
where vm-operator (operator.victoriametrics.com) is installed without
prometheus-operator (no ServiceMonitor CRD). customer-poc-aws POC use case:
see bead ka-0000005115.
*/}}
{{- if and .Values.agents.enabled (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gardenio.agents.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.agents.metrics.serviceMonitor.interval | default .Values.monitoring.victoriaMetrics.interval | default "30s" }}
{{- end }}

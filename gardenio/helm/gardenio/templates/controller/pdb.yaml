{{- /*
  WHY maxUnavailable, NOT minAvailable (ka-0000001453, gd-27vcHmrurh): on a
  1-replica Deployment minAvailable:1 == maxUnavailable:0, which makes the
  eviction API refuse the pod forever — a managed-nodegroup drain then hits
  PodEvictionFailure and wedges (see templates/pdb-singletons.yaml).
  maxUnavailable:1 only blocks eviction while the pod is currently unhealthy,
  so it is a safe drain guard at replicaCount=1 and upgrades to real quorum
  protection the moment agents.replicaCount is scaled past 1. Renders
  unconditionally (no replicaCount gate) for the same reason.
*/}}
{{- if and .Values.agents.enabled .Values.agents.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gardenio.agents.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.agents.podDisruptionBudget.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "gardenio.agents.selectorLabels" . | nindent 6 }}
{{- end }}

            {{- end }}
            {{- if .Values.agents.litellmURL }}
            - name: LITELLM_URL
              value: {{ .Values.agents.litellmURL }}
            {{- else if .Values.litellm.enabled }}
            - name: LITELLM_URL
              value: http://{{ include "gardenio.litellm.fullname" . }}:{{ .Values.litellm.port | default 4000 }}
            {{- end }}
            {{- if .Values.externalSecrets.litellmMasterKey.remoteRef }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            {{- else if .Values.litellm.enabled }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gardenio.litellm.masterKeySecretName" . }}
                  key: token
            - name: LITELLM_ADMIN_SECRET
              value: {{ include "gardenio.litellm.masterKeySecretName" . }}
            {{- end }}
            {{- if .Values.litellm.tagSpendSource }}
            - name: LITELLM_TAG_SPEND_SOURCE
              value: {{ .Values.litellm.tagSpendSource | quote }}
            {{- end }}
            {{- if .Values.agents.claudeTeams.enabled }}
            - name: CLAUDE_TEAMS_ENABLED
              value: "true"
            {{- if .Values.agents.claudeTeams.teammateMode }}
            - name: CLAUDE_TEAMMATE_MODE
              value: {{ .Values.agents.claudeTeams.teammateMode }}
            {{- end }}
            {{- if gt (int .Values.agents.claudeTeams.maxTeammates) 0 }}
            - name: CLAUDE_TEAMS_MAX_TEAMMATES
              value: {{ .Values.agents.claudeTeams.maxTeammates | quote }}
            {{- end }}
            {{- with .Values.agents.claudeTeams.resources }}
            {{- if .requests }}
            {{- if .requests.cpu }}
            - name: CLAUDE_TEAMS_CPU_REQUEST
              value: {{ .requests.cpu | quote }}
            {{- end }}
            {{- if .requests.memory }}
            - name: CLAUDE_TEAMS_MEMORY_REQUEST
              value: {{ .requests.memory | quote }}
            {{- end }}
            {{- end }}
            {{- if .limits }}
            {{- if .limits.cpu }}
            - name: CLAUDE_TEAMS_CPU_LIMIT
              value: {{ .limits.cpu | quote }}
            {{- end }}
            {{- if .limits.memory }}
            - name: CLAUDE_TEAMS_MEMORY_LIMIT
              value: {{ .limits.memory | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* Daily Postgres efficiency report (gd-ylgk1jBhLi), judged by
                 the vmalert budget rules' own thresholds. */}}
            {{- $pgr := .Values.postgres.exporter.report }}
            {{- if and .Values.postgres.enabled .Values.postgres.exporter.enabled $pgr.enabled }}
            - name: GARDENIO_PG_BUDGET_REPORT_HOUR
              value: {{ $pgr.hourUTC | quote }}
            - name: GARDENIO_PG_BUDGET_LAND
              value: {{ $pgr.land | quote }}
            {{- if $pgr.parentEpic }}
            - name: GARDENIO_PG_BUDGET_EPIC
              value: {{ $pgr.parentEpic | quote }}
            {{- end }}
            - name: GARDENIO_PG_BUDGETS
              value: {{ .Values.vmalert.postgresBudgets | toJson | quote }}
            {{- end }}
            {{- if .Values.agents.gardenioChannel }}
            - name: GARDENIO_CHANNEL
              value: "1"
            {{- end }}
            {{- if .Values.agents.beadsE2EHTTPAddr }}
            - name: BEADS_E2E_HTTP_ADDR
              value: {{ .Values.agents.beadsE2EHTTPAddr }}
            {{- end }}
            {{- if .Values.agents.externalSecretStore }}
            {{- if .Values.agents.externalSecretStore.name }}
            - name: EXTERNAL_SECRET_STORE_NAME
              value: {{ .Values.agents.externalSecretStore.name }}
            {{- end }}
            {{- if .Values.agents.externalSecretStore.kind }}
            - name: EXTERNAL_SECRET_STORE_KIND
              value: {{ .Values.agents.externalSecretStore.kind }}
            {{- end }}
            {{- if .Values.agents.externalSecretStore.refreshInterval }}
            - name: EXTERNAL_SECRET_REFRESH_INTERVAL
              value: {{ .Values.agents.externalSecretStore.refreshInterval | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.agents.pvGCTTL }}
            - name: PV_GC_TTL
              value: {{ .Values.agents.pvGCTTL | quote }}
            {{- end }}
            {{- if .Values.agents.pvGCInterval }}
            - name: PV_GC_INTERVAL
              value: {{ .Values.agents.pvGCInterval | quote }}
            {{- end }}
            {{- if .Values.agents.pvGCNamespaces }}
            - name: PV_GC_NAMESPACES
              value: {{ .Values.agents.pvGCNamespaces | quote }}
            {{- end }}
            {{- /* Orphaned-Pending-PVC observability collector (ka-0000002737).
                 Rendered only with agents.pvcObs.enabled, which also provisions
                 the persistentvolumeclaims:list + pods:list ClusterRole the
                 collector needs (templates/controller/pvc-obs-rbac.yaml).
                 Empty/absent = collector disabled (PVC_OBS_INTERVAL defaults to
                 0). PVC_OBS_THRESHOLD is optional; 0/absent → the collector's
                 built-in 7d default. */}}
            {{- if .Values.agents.pvcObs.enabled }}
            - name: PVC_OBS_INTERVAL
              value: {{ .Values.agents.pvcObs.interval | quote }}
            {{- if .Values.agents.pvcObs.threshold }}
            - name: PVC_OBS_THRESHOLD
              value: {{ .Values.agents.pvcObs.threshold | quote }}
            {{- end }}
            {{- end }}
            {{- /* Node-lifecycle collector (Track D, ka-0000001509). Rendered
                 only with agents.nodeLifecycle.enabled, which also provisions
                 the nodes:list/watch ClusterRole the collector needs
                 (templates/controller/node-lifecycle-rbac.yaml). Empty/absent =
                 collector disabled (NODE_LIFECYCLE_INTERVAL defaults to 0). */}}
            {{- if .Values.agents.nodeLifecycle.enabled }}
            - name: NODE_LIFECYCLE_INTERVAL
              value: {{ .Values.agents.nodeLifecycle.interval | quote }}
            {{- /* Scope the sweep to the agent nodepool so the metric excludes
                 ephemeral-pool/reaper churn that cannot cold-resume an agent
                 (ka-0000003804). Empty selector = list every node (opt-out). */}}
            - name: NODE_LIFECYCLE_NODE_SELECTOR
              value: {{ .Values.agents.nodeLifecycle.nodeSelector | quote }}
            {{- /* Idle-node detection (P1b-follow-up, ka-0000001398). Renders the
                 namespaces swept for agent pods only when idleNodes.enabled;
                 empty podNamespaces defaults to the release namespace (where
                 agent pods run). Reuses the controller's EXISTING namespace
                 pods:list RBAC — no new grant. Absent env = idle-node gauge not
                 emitted (NodeLifecycleIdlePodNamespaces defaults to empty). */}}
            {{- if .Values.agents.nodeLifecycle.idleNodes.enabled }}
            - name: NODE_LIFECYCLE_IDLE_POD_NAMESPACES
              {{- $idleNS := .Values.agents.nodeLifecycle.idleNodes.podNamespaces }}
              value: {{ if $idleNS }}{{ join "," $idleNS | quote }}{{ else }}{{ .Release.Namespace | quote }}{{ end }}
            {{- end }}
            {{- end }}
            {{- if .Values.agents.pvcGCTTL }}
            - name: PVC_GC_TTL
              value: {{ .Values.agents.pvcGCTTL | quote }}
            {{- end }}
            {{- if .Values.agents.pvcGCInterval }}
            - name: PVC_GC_INTERVAL
              value: {{ .Values.agents.pvcGCInterval | quote }}
            {{- end }}
            {{- if .Values.agents.bridgeTokenRotation }}
            {{- if .Values.agents.bridgeTokenRotation.enabled }}
            - name: BRIDGE_TOKEN_ROTATION_ENABLED
              value: "true"
            - name: BRIDGE_TOKEN_ROTATION_DRY_RUN
              value: {{ .Values.agents.bridgeTokenRotation.dryRun | default false | quote }}
            {{- if .Values.agents.bridgeTokenRotation.interval }}
            - name: BRIDGE_TOKEN_ROTATION_INTERVAL
              value: {{ .Values.agents.bridgeTokenRotation.interval | quote }}
            {{- end }}
            {{- if .Values.agents.bridgeTokenRotation.threshold }}
            - name: BRIDGE_TOKEN_ROTATION_THRESHOLD
              value: {{ .Values.agents.bridgeTokenRotation.threshold | quote }}
            {{- end }}
            {{- if .Values.agents.bridgeTokenRotation.accessTTL }}
            - name: BRIDGE_TOKEN_ROTATION_ACCESS_TTL
              value: {{ .Values.agents.bridgeTokenRotation.accessTTL | quote }}
            {{- end }}
            {{- if .Values.agents.bridgeTokenRotation.refreshTTL }}
            - name: BRIDGE_TOKEN_ROTATION_REFRESH_TTL
              value: {{ .Values.agents.bridgeTokenRotation.refreshTTL | quote }}
            {{- end }}
            {{- /*
                 The rotator MUST write the same Secret the beads daemon reads,
                 or a live rotation mints fresh tokens the daemon never sees and
                 auth breaks at the TTL boundary (ka-0000004295). An explicit
                 agents.bridgeTokenRotation.secretName wins; otherwise default to
                 the daemon's resolved bridge-token secret
                 (gardenio.beads.bridgeTokenSecretName) so a values file that pins
                 ONLY beads.bridgeFleetTokenSecret / beads.bridgeTokenSecret
                 cannot silently strand rotation. Always emitted so the two
                 sides can never diverge to their independent Go defaults.
            */}}
            - name: BRIDGE_TOKEN_ROTATION_SECRET
              value: {{ .Values.agents.bridgeTokenRotation.secretName | default (include "gardenio.beads.bridgeTokenSecretName" .) | quote }}
            {{- if .Values.agents.bridgeTokenRotation.fleetMapKey }}
            - name: BRIDGE_TOKEN_ROTATION_FLEET_MAP_KEY
              value: {{ .Values.agents.bridgeTokenRotation.fleetMapKey | quote }}
            {{- end }}
            {{- if .Values.agents.bridgeTokenRotation.fleets }}
            - name: BRIDGE_TOKEN_ROTATION_FLEETS
              value: {{ join "," .Values.agents.bridgeTokenRotation.fleets | quote }}
            {{- end }}
            {{- if .Values.agents.bridgeTokenRotation.privilegedFleets }}
            - name: BRIDGE_TOKEN_ROTATION_PRIVILEGED_FLEETS
              value: {{ join "," .Values.agents.bridgeTokenRotation.privilegedFleets | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.agents.autodestruct.enabled }}
            {{- if .Values.agents.autodestruct.tokenSecret }}
            - name: AUTODESTRUCT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agents.autodestruct.tokenSecret }}
                  key: token
            {{- else if .Values.agents.autodestruct.token }}
            {{- fail "agents.autodestruct.token plaintext value is removed for security (AUDIT §J6) — use agents.autodestruct.tokenSecret pointing at a K8s Secret with key 'token'." }}
            {{- end }}
            {{- if .Values.agents.autodestruct.allowedSlackUsers }}
            - name: AUTODESTRUCT_ALLOWED_USERS
              value: {{ .Values.agents.autodestruct.allowedSlackUsers | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.agents.controllerApi.tokenSecret }}
            - name: CONTROLLER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agents.controllerApi.tokenSecret }}
                  key: token
            {{- end }}
            # Slack env vars removed — now handled by slack-bridge container (bd-8x8fy).
            {{- /* OpenZiti per-pod overlay access (epic ka-0000000990). All
                 gated on agents.zitiAccess.enabled (default false) so a chart
                 with the feature off renders byte-identically to before. The
                 broker URL is the controller-side master switch read by
                 applyZitiAccess; without it, agent pods get no Ziti wiring. */}}
            {{- if .Values.agents.zitiAccess.enabled }}
            - name: ZITI_ACCESS_BROKER_URL
              value: {{ required "agents.zitiAccess.brokerURL is required when zitiAccess.enabled" .Values.agents.zitiAccess.brokerURL | quote }}
            {{- if .Values.agents.zitiAccess.tokenAudience }}
            - name: ZITI_ACCESS_TOKEN_AUDIENCE
              value: {{ .Values.agents.zitiAccess.tokenAudience | quote }}
            {{- end }}
            {{- if .Values.agents.zitiAccess.tunnelerImage }}
            - name: ZITI_TUNNELER_IMAGE
              value: {{ .Values.agents.zitiAccess.tunnelerImage | quote }}
            {{- end }}
            {{- if .Values.agents.zitiAccess.defaultTTL }}
            - name: ZITI_ACCESS_DEFAULT_TTL
              value: {{ .Values.agents.zitiAccess.defaultTTL | quote }}
            {{- end }}
            - name: ZITI_ACCESS_REVOKE_ON_EXIT
              {{- /* Direct reference (NOT `| default true`): Helm's `default`
                     treats a boolean false as empty and would force it back to
                     true, so `revokeOnExit: false` would render this env var
                     "true" while the `{{- if .revokeOnExit }}` guard below (raw
                     value) skips mounting the broker-audience token — telling
                     the controller to revoke without the credential to do so.
                     The key always ships in values.yaml (default true). */}}
              value: {{ .Values.agents.zitiAccess.revokeOnExit | quote }}
            {{- if .Values.agents.zitiAccess.revokeOnExit }}
            # The controller's OWN projected broker-audience token, used to
            # authenticate DELETE /lease?task_id revoke calls. The controller
            # must be listed in the broker's REVOKER_SUBJECTS.
            - name: ZITI_ACCESS_CONTROLLER_TOKEN_FILE
              value: /var/run/secrets/ziti-broker/token
            {{- end }}
            {{- end }}
            {{- /* Lambda MicroVM execution backend (epic ka-0000005010, C3).
                 All gated on agents.microvm.enabled (default false) so a chart
                 with the feature off renders byte-identically to before. The
                 controller assumes the launcher role from its own IRSA identity;
                 no Lambda authority is granted here — it lives on the launcher.
                 launcherRoleARN + region are both required when enabled (the
                 controller treats either-unset as backend-disabled). */}}
            {{- if .Values.agents.microvm.enabled }}

            {{- end }}
            {{- if not .Values.agents.microvm.zitiBroker.url }}
            {{- fail "agents.microvm.productionMode requires zitiBroker.url — production launches mint per-run Ziti identities" }}
            {{- end }}
            {{- if not .Values.agents.microvm.controllerRoleARN }}
            {{- fail "agents.microvm.productionMode requires controllerRoleARN — the dedicated controller-only launcher-hop role, not the shared agent identity" }}
            {{- end }}
            {{- if not .Values.agents.microvm.expectedLauncherAccount }}
            {{- fail "agents.microvm.productionMode requires expectedLauncherAccount — pin the launcher account explicitly" }}
            {{- end }}
            {{- if not .Values.agents.microvm.imageVersion }}
            {{- fail "agents.microvm.productionMode requires imageVersion — production never floats on the image's active version" }}
            {{- end }}
            {{- if not .Values.agents.microvm.logGroup }}
            {{- fail "agents.microvm.productionMode requires logGroup — production runs deliver runtime logs to CloudWatch (ka-0000002120)" }}
            {{- end }}
            - name: MICROVM_PRODUCTION_MODE
              value: "true"
            {{- end }}
            - name: MICROVM_LAUNCHER_ROLE_ARN
              value: {{ required "agents.microvm.launcherRoleARN is required when microvm.enabled" .Values.agents.microvm.launcherRoleARN | quote }}
            - name: MICROVM_REGION
              value: {{ required "agents.microvm.region is required when microvm.enabled" .Values.agents.microvm.region | quote }}
            {{- if .Values.agents.microvm.controllerRoleARN }}
            - name: MICROVM_CONTROLLER_ROLE_ARN
              value: {{ .Values.agents.microvm.controllerRoleARN | quote }}
            {{- end }}
            {{- if .Values.agents.microvm.expectedLauncherAccount }}
            - name: MICROVM_EXPECTED_LAUNCHER_ACCOUNT
              value: {{ .Values.agents.microvm.expectedLauncherAccount | quote }}
            {{- end }}
            {{- if .Values.agents.microvm.assumeRoleSessionName }}
            - name: MICROVM_ASSUME_ROLE_SESSION_NAME
              value: {{ .Values.agents.microvm.assumeRoleSessionName | quote }}
            {{- end }}
            {{- if .Values.agents.microvm.secretPrefix }}
            - name: MICROVM_SECRET_PREFIX
              value: {{ .Values.agents.microvm.secretPrefix | quote }}
            {{- end }}
            {{- /* C4 backend launch config (epic ka-0000005010). imageIdentifier
                 + executionRoleARN are required for the backend to issue
                 RunMicrovm; without them the identity resolves but launches
                 fail closed. */}}
            - name: MICROVM_IMAGE_IDENTIFIER
              value: {{ required "agents.microvm.imageIdentifier is required when microvm.enabled" .Values.agents.microvm.imageIdentifier | quote }}
            - name: MICROVM_EXECUTION_ROLE_ARN
              value: {{ required "agents.microvm.executionRoleARN is required when microvm.enabled" .Values.agents.microvm.executionRoleARN | quote }}
            {{- if .Values.agents.microvm.imageVersion }}
            - name: MICROVM_IMAGE_VERSION
              value: {{ .Values.agents.microvm.imageVersion | quote }}
            {{- end }}
            {{- if .Values.agents.microvm.staticIdentitySecretARN }}
            - name: MICROVM_STATIC_IDENTITY_SECRET_ARN
              value: {{ .Values.agents.microvm.staticIdentitySecretARN | quote }}
            {{- end }}
            {{- /* Per-run git credential minting (ka-0000004762). The factory
                 token (GitLab api scope, Maintainer) mints per-run project
                 access tokens for satellites; delivered as a Secret env-ref,
                 never a plaintext chart value. Unset → shared-fallback mode
                 (the project's own git secrets ride the per-run document). */}}
            {{- if .Values.agents.microvm.gitCredentials.factoryTokenSecret }}
            - name: MICROVM_GIT_FACTORY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agents.microvm.gitCredentials.factoryTokenSecret | quote }}
                  key: token
                  # Optional so the wiring can deploy BEFORE the operator seeds
                  # the factory token in the secret store: until the Secret
                  # materializes the controller runs shared-fallback instead of
                  # wedging on a missing env Secret.
                  optional: true
            {{- end }}
            {{- if .Values.agents.microvm.gitCredentials.gitlabBaseURL }}
            - name: MICROVM_GITLAB_BASE_URL
              value: {{ .Values.agents.microvm.gitCredentials.gitlabBaseURL | quote }}
            {{- end }}
            {{- /* Per-run Ziti identities (ka-0000001924). When zitiBroker.url
                 is set, every launch mints a unique short-lived identity via
                 the ziti-access-broker (fail-closed) and the deprecated
                 staticIdentitySecretARN above is ignored by the controller. */}}
            {{- if .Values.agents.microvm.zitiBroker.url }}
            - name: MICROVM_ZITI_BROKER_URL
              value: {{ .Values.agents.microvm.zitiBroker.url | quote }}
            {{- if .Values.agents.microvm.zitiBroker.serverID }}
            - name: MICROVM_ZITI_BROKER_SERVER_ID
              value: {{ .Values.agents.microvm.zitiBroker.serverID | quote }}
            {{- end }}
            {{- if .Values.agents.microvm.zitiBroker.enroll }}
            - name: MICROVM_ZITI_BROKER_ENROLL
              value: "true"
            {{- end }}
            {{- end }}
            {{- /* Wall-clock lifetime cap. 0/unset keeps the controller's
                 compiled 3600s default; long-lived roles (plan-gardener) need
                 the 8h ceiling (ka-0000003026). */}}
            {{- if .Values.agents.microvm.maximumDurationSeconds }}
            - name: MICROVM_MAXIMUM_DURATION_SECONDS
              value: {{ .Values.agents.microvm.maximumDurationSeconds | quote }}
            {{- end }}
            {{- /* CloudWatch runtime logging (ka-0000002120). logGroup unset
                 leaves RunMicrovm's Logging member off entirely — the C7 POC
                 behavior. The stream prefix is only meaningful with a group,
                 so it is nested rather than independently emitted. */}}
            {{- if .Values.agents.microvm.logGroup }}
            - name: MICROVM_LOG_GROUP
              value: {{ .Values.agents.microvm.logGroup | quote }}
            {{- if .Values.agents.microvm.logStreamPrefix }}
            - name: MICROVM_LOG_STREAM_PREFIX
              value: {{ .Values.agents.microvm.logStreamPrefix | quote }}
            {{- end }}
            {{- end }}
            {{- /* Bead-scoped S3 session-credential vending (S4 ka-0000006612).
                 The controller assumes this S2-provisioned role via
                 AssumeRoleWithWebIdentity and narrows each mint to
                 coop/sessions/<bead>/*. Unset leaves satellites without S3
                 session persistence (the MINIMAL execution role grants none);
                 vending also requires a sessions bucket (agents.s3.bucket). */}}
            {{- if .Values.agents.microvm.sessionVendorRoleARN }}
            - name: MICROVM_SESSION_VENDOR_ROLE_ARN
              value: {{ .Values.agents.microvm.sessionVendorRoleARN | quote }}
            {{- if .Values.agents.microvm.sessionCredentialDurationSeconds }}
            - name: MICROVM_SESSION_CREDENTIAL_DURATION_SECONDS
              value: {{ .Values.agents.microvm.sessionCredentialDurationSeconds | quote }}
            {{- end }}
            {{- end }}
            {{- /* Native suspend/resume IdlePolicy (plan ka-0000004518). Disabled
                 leaves RunMicrovm's IdlePolicy member unset (byte-for-byte
                 pre-idle-policy launch shape). When enabled, all three members
                 are emitted — the SDK requires them together. Egress-only
                 topology means suspendedDurationSeconds is the operative
                 standby-billing auto-terminate backstop. */}}
            {{- if .Values.agents.microvm.idlePolicy.enabled }}
            - name: MICROVM_IDLE_POLICY_ENABLED
              value: "true"
            {{- if .Values.agents.microvm.idlePolicy.autoResumeEnabled }}
            - name: MICROVM_IDLE_AUTO_RESUME_ENABLED
              value: "true"
            {{- end }}
            - name: MICROVM_IDLE_MAX_IDLE_DURATION_SECONDS
              value: {{ .Values.agents.microvm.idlePolicy.maxIdleDurationSeconds | quote }}
            - name: MICROVM_IDLE_SUSPENDED_DURATION_SECONDS
              value: {{ .Values.agents.microvm.idlePolicy.suspendedDurationSeconds | quote }}
            {{- end }}
            {{- /* Native suspend-on-stop (plan ka-0000004518, step 2
                 ka-0000007189). When enabled, a freeze-eligible MicroVM thread
                 agent's `gb stop` suspends the VM and leaves the bead open at
                 agent_state=stopping; disabled leaves the env unset so every
                 MicroVM stop terminates as before. */}}
            {{- if .Values.agents.microvm.suspendOnStop.enabled }}
            - name: MICROVM_SUSPEND_ENABLED
              value: "true"
            {{- end }}
            {{- /* Resume rehydration correctness boundary (step 5, plan
                 ka-0000004518). Default-on fail-closed proof-of-life gate: after
                 ResumeMicrovm the controller waits for the resumed VM's egress
                 heartbeat before marking it working, else terminates + marks
                 resume_failed. Set enabled=false for the step-3 rollback (stamp
                 working immediately). See docs/microvm-resume-rehydration.md. */}}
            {{- if not .Values.agents.microvm.resumeRehydrate.enabled }}
            - name: MICROVM_RESUME_REHYDRATE_ENABLED
              value: "false"
            {{- end }}
            {{- if .Values.agents.microvm.resumeRehydrate.deadlineSeconds }}
            - name: MICROVM_RESUME_REHYDRATE_DEADLINE_SECONDS
              value: {{ .Values.agents.microvm.resumeRehydrate.deadlineSeconds | quote }}
            {{- end }}
            {{- /* Max-standby-age cap (step 4 ka-0000006202). A SUSPENDED
                 thread-agent VM is intentional standby (its open bead is the
                 resume target); this cap bounds how long that standby may bill
                 — leak GC terminates a suspended VM past the cap and closes its
                 bead as done. Empty/unset leaves the controller cap off, so the
                 AWS IdlePolicy suspendedDurationSeconds backstop is the only
                 standby-billing limit. */}}
            {{- if .Values.agents.microvm.suspendOnStop.maxStandbyAge }}
            - name: MICROVM_MAX_STANDBY_AGE
              value: {{ .Values.agents.microvm.suspendOnStop.maxStandbyAge | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.global.coverage.enabled }}
            - name: GOCOVERDIR
              value: "{{ .Values.global.coverage.mountPath }}/controller"
            {{- /* Runtime coverage for dynamically-built AGENT pods (C2,
                   ka-0000000508). The controller reads these to add GOCOVERDIR +
                   LLVM_PROFILE_FILE to each agent container and mount the shared
                   coverage PVC. GARDENIO_AGENT_COVERAGE gates the wiring;
                   _CLAIM names the shared PVC (embeds the release name, so it
                   cannot be derived at runtime); _MOUNT keeps the agent-pod mount
                   path in lockstep with global.coverage.mountPath. Gated on the
                   same coverage.enabled flag as the daemons above. */}}
            - name: GARDENIO_AGENT_COVERAGE
              value: "1"
            - name: GARDENIO_AGENT_COVERAGE_CLAIM
              value: {{ include "gardenio.agents.fullname" . }}-coverage
            - name: GARDENIO_AGENT_COVERAGE_MOUNT
              value: {{ .Values.global.coverage.mountPath | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.agents.resources | nindent 12 }}
          {{- if or .Values.global.coverage.enabled .Values.agents.githubApp.enabled (and .Values.agents.zitiAccess.enabled .Values.agents.zitiAccess.revokeOnExit) .Values.agents.machinePrincipal.enabled .Values.agents.lands.provisioner.enabled (and .Values.agents.mailer.enabled .Values.agents.mailer.credentialsSecret.name) .Values.releases.box.name (and .Values.nats.auth.subjectIsolation.enabled .Values.nats.auth.subjectIsolation.landCallout.enabled) .Values.coopmux.landTokens.enabled }}
          volumeMounts:
            {{- if .Values.coopmux.landTokens.enabled }}
            - name: coopmux-land-token-key
              mountPath: /var/run/secrets/coopmux-land-token-key
              readOnly: true
            {{- end }}
            {{- if and .Values.nats.auth.subjectIsolation.enabled .Values.nats.auth.subjectIsolation.landCallout.enabled }}
            - name: nats-land-callout
              mountPath: /var/run/secrets/nats-land-callout
              readOnly: true
            {{- end }}
            {{- if .Values.agents.githubApp.enabled }}
            - name: github-app-private-key
              mountPath: {{ .Values.agents.githubApp.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.global.coverage.enabled }}
            - name: coverage-data
              mountPath: {{ .Values.global.coverage.mountPath }}
            {{- end }}
            {{- if and .Values.agents.zitiAccess.enabled .Values.agents.zitiAccess.revokeOnExit }}
            - name: ziti-broker-token
              mountPath: /var/run/secrets/ziti-broker
              readOnly: true
            {{- end }}
            {{- if .Values.agents.machinePrincipal.enabled }}
            - name: machine-client-secret
              mountPath: /var/run/secrets/gardenio-machine
              readOnly: true
            {{- if include "gardenio.keycloak.inClusterCA" . }}
            {{- include "gardenio.keycloakRuntime.caVolumeMount" . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if .Values.agents.lands.provisioner.enabled }}
            - name: lands-keycloak-client-secret
              mountPath: {{ .Values.agents.lands.provisioner.keycloak.mountPath }}
              readOnly: true
            - name: lands-github-app-private-key
              mountPath: {{ .Values.agents.lands.provisioner.githubApp.mountPath }}
              readOnly: true
            {{- if include "gardenio.keycloakRuntime.tlsEnabled" . }}
            - name: lands-keycloak-ca
              mountPath: {{ .Values.agents.lands.provisioner.keycloak.caMountPath }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if and .Values.agents.mailer.enabled .Values.agents.mailer.credentialsSecret.name }}
            - name: mailer-ses-credentials
              mountPath: /var/run/secrets/gardenio-mailer-ses
              readOnly: true
            {{- end }}
            {{- if .Values.releases.box.name }}
            - name: release-home-client-secret
              mountPath: /var/run/secrets/gardenio-release-home
              readOnly: true
            {{- if .Values.releases.box.homeCA.name }}
            - name: release-home-ca
              mountPath: /var/run/secrets/gardenio-release-home-ca
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- if or .Values.global.coverage.enabled .Values.agents.githubApp.enabled (and .Values.agents.zitiAccess.enabled .Values.agents.zitiAccess.revokeOnExit) .Values.agents.machinePrincipal.enabled .Values.agents.lands.provisioner.enabled (and .Values.agents.mailer.enabled .Values.agents.mailer.credentialsSecret.name) .Values.releases.box.name (and .Values.nats.auth.subjectIsolation.enabled .Values.nats.auth.subjectIsolation.landCallout.enabled) .Values.coopmux.landTokens.enabled }}
      volumes:
        {{- if .Values.coopmux.landTokens.enabled }}
        # Land coopmux token key, shared with coopmux (gd-ApgYe740ps).
        - name: coopmux-land-token-key
          secret:
            secretName: {{ include "gardenio.coopmux.landTokenKeySecretName" . }}
            defaultMode: 0440
            items:
              - key: key
                path: key
        {{- end }}
        {{- if and .Values.nats.auth.subjectIsolation.enabled .Values.nats.auth.subjectIsolation.landCallout.enabled }}
        # The land callout's issuer seed alone, not its public half.
        - name: nats-land-callout
          secret:
            secretName: {{ required "nats.auth.subjectIsolation.landCallout.issuerSecret is required with landCallout.enabled" .Values.nats.auth.subjectIsolation.landCallout.issuerSecret }}
            defaultMode: 0400
            items:
              - key: seed
                path: seed
        {{- end }}
        {{- if .Values.agents.githubApp.enabled }}
        # App private key (controller-only, file projection per the W6 precedent).
        - name: github-app-private-key
          secret:
            secretName: {{ .Values.agents.githubApp.privateKeySecret }}
            defaultMode: 0440
            items:
              - key: private-key
                path: private-key
        {{- end }}
        {{- if .Values.global.coverage.enabled }}
        - name: coverage-data
          persistentVolumeClaim:
            claimName: {{ include "gardenio.agents.fullname" . }}-coverage
        {{- end }}
        {{- if and .Values.agents.zitiAccess.enabled .Values.agents.zitiAccess.revokeOnExit }}
        # Controller's own projected broker-audience token for lease revocation.
        - name: ziti-broker-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.agents.zitiAccess.tokenAudience | default "gardenio-ziti-broker" | quote }}
                  expirationSeconds: 600
        {{- end }}
        {{- if .Values.agents.machinePrincipal.enabled }}
        # Machine-principal client secret (gd-s7aPIf0Bgp). optional: the operator
        # creates the Secret by hand; without it the pod still starts and account
        # writes fail closed with auth_unavailable in the log.
        - name: machine-client-secret
          secret:
            secretName: {{ .Values.agents.machinePrincipal.secretName | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: clientSecret
                path: clientSecret
        {{- if include "gardenio.keycloak.inClusterCA" . }}
        # The same ca.crt as lands-keycloak-ca below, at the path every
        # machine-principal client uses (gd-lYPZlslOM7).
        {{- include "gardenio.keycloakRuntime.caVolume" . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if .Values.agents.lands.provisioner.enabled }}
        # Lands provisioner secrets (step 8.6). optional, like the machine
        # principal's: a missing Secret still starts the pod, and the
        # provisioner logs the unreadable file and stays off.
        - name: lands-keycloak-client-secret
          secret:
            secretName: {{ .Values.agents.lands.provisioner.keycloak.clientSecretSecret | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: clientSecret
                path: clientSecret
        - name: lands-github-app-private-key
          secret:
            secretName: {{ .Values.agents.lands.provisioner.githubApp.privateKeySecret | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: private-key
                path: private-key
        {{- if include "gardenio.keycloakRuntime.tlsEnabled" . }}
        # The in-cluster Keycloak CA (gd-XRsosVFAau): ca.crt ONLY from the
        # keycloak-runtime leaf Secret, never its tls.key. optional so the
        # pod starts before cert-manager has issued; the provisioner then
        # logs the unreadable CA file and stays off.
        - name: lands-keycloak-ca
          secret:
            secretName: {{ include "gardenio.keycloakRuntime.tlsSecretName" . | quote }}
            optional: true
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- with .Values.agents.mailer.credentialsSecret }}
        {{- if and $.Values.agents.mailer.enabled .name }}
        # The mailer's own SES keys (gd-kSLbp23ekV). optional, like the
        # provisioner's: a missing Secret still starts the pod, and the mailer
        # logs the unreadable keys and stays off.
        - name: mailer-ses-credentials
          secret:
            secretName: {{ .name | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: {{ required "agents.mailer.credentialsSecret.accessKeyIdKey is required when credentialsSecret.name is set" .accessKeyIdKey | quote }}
                path: accessKeyId
              - key: {{ required "agents.mailer.credentialsSecret.secretAccessKeyKey is required when credentialsSecret.name is set" .secretAccessKeyKey | quote }}
                path: secretAccessKey
        {{- end }}
        {{- end }}
        {{- with .Values.releases.box }}
        {{- if .name }}
        # The box's home-realm client secret (plan gd-UZKZ9H25UD step 4d).
        # optional, like the machine principal's: a missing Secret still starts
        # the pod, and the release reporter logs its token fetch failures.
        - name: release-home-client-secret
          secret:
            secretName: {{ required "releases.box.homeClientSecret.name is required when releases.box.name is set" .homeClientSecret.name | quote }}
            optional: true
            defaultMode: 0440
            items:
              - key: {{ required "releases.box.homeClientSecret.key is required when releases.box.name is set" .homeClientSecret.key | quote }}
                path: clientSecret
        {{- if .homeCA.name }}
        - name: release-home-ca
          secret:
            secretName: {{ .homeCA.name | quote }}
            optional: true
            defaultMode: 0444
            items:
              - key: {{ .homeCA.key | default "ca.crt" | quote }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      {{- include "gardenio.nodeSelector" (dict "local" .Values.agents.nodeSelector "global" .Values.global.nodeSelector) | nindent 6 }}
      {{- /* HA spread (gd-27vcHmrurh). Only rendered at replicaCount > 1 — see
             templates/litellm/deployment.yaml for the rationale this mirrors. */}}
      {{- if gt (int (.Values.agents.replicaCount | default 1)) 1 }}
      {{- with .Values.agents.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - maxSkew: {{ .maxSkew | default 1 }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable | default "ScheduleAnyway" }}
          labelSelector:
            matchLabels:
              {{- include "gardenio.agents.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Values.agents.affinity }}
      affinity:
        {{- toYaml .Values.agents.affinity | nindent 8 }}
      {{- else if and (gt (int (.Values.agents.replicaCount | default 1)) 1) .Values.agents.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: {{ .Values.agents.podAntiAffinity.weight | default 100 }}
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "gardenio.agents.selectorLabels" . | nindent 20 }}
      {{- end }}
      {{- include "gardenio.tolerations" (dict "local" .Values.agents.tolerations "global" .Values.global.tolerations) | nindent 6 }}
      {{- /* Same class as the interactive (thread/dm/gardener) agent pods the
      controller stamps: agents depend on this pod, so they must not be able
      to preempt it (gd-cTobdw0kAL). */}}
      {{- if .Values.global.systemPriorityClass.create }}
      priorityClassName: {{ .Values.global.systemPriorityClass.name }}
      {{- end }}
{{- end }}

              value: {{ .Values.agents.claudeModel }}
            {{- end }}
            # Pins the Claude Code harness `fable` alias on agent pods
            # (ka-0000003175). ALWAYS emitted (quoted) — NOT guarded on a truthy
            # value — so an explicit empty override in a values overlay reaches the
            # controller as a SET-but-empty env var (os.LookupEnv), disabling
            # injection. A truthy if-guard would drop the empty value and the
            # controller's baked default (claude-fable-5-oauth) would silently
            # re-apply, defeating the escape hatch. The chart default matches that
            # baked default, so the common case is identical either way.
            - name: AGENT_DEFAULT_FABLE_MODEL
              value: {{ .Values.agents.defaultFableModel | quote }}
            # Pins the Claude Code harness `opus` alias on agent pods
            # (plan:opus55-release T1). Same ALWAYS-emitted, escape-hatch
            # reasoning as the fable pin above.
            - name: AGENT_DEFAULT_OPUS_MODEL
              value: {{ .Values.agents.defaultOpusModel | quote }}
            # Pins the Claude Code harness `haiku` alias on agent pods
            # (ka-0000005599). ALWAYS emitted (quoted) — NOT guarded on a truthy
            # value — so an explicit empty override in a values overlay reaches the
            # controller as a SET-but-empty env var (os.LookupEnv), disabling
            # injection. A truthy if-guard would drop the empty value and the
            # controller's baked default (anthropic/claude-haiku-4-5) would silently
            # re-apply, defeating the escape hatch. The chart default matches that
            # baked default, so the common case is identical either way.
            - name: AGENT_DEFAULT_HAIKU_MODEL
              value: {{ .Values.agents.defaultHaikuModel | quote }}
            {{- if .Values.agents.vmagentURL }}
            - name: AGENT_VMAGENT_URL
              value: {{ .Values.agents.vmagentURL | quote }}
            {{- else if .Values.vmagent.enabled }}
            - name: AGENT_VMAGENT_URL

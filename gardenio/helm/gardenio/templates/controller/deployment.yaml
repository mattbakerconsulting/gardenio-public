            {{- with .Values.agents.machineClientMounts }}
            - name: GARDENIO_AGENT_MACHINE_CLIENT_MOUNTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- /* Agent pods cannot dial the public edge that serves the issuer
                 (landgate crewDeny), so a machine-client pod discovers it at

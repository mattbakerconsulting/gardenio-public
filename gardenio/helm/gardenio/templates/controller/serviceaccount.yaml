{{- /*
Render the agents ServiceAccount when EITHER the controller (agents.enabled) OR
the beads-viewer needs it. beads-viewer/deployment.yaml reuses this SA for its
IRSA role (gardenio.agents.serviceAccountName), so on the Gardenio-in-a-Box
profile — where agents.enabled=false but beadsViewer.enabled=true — the SA must
still be created or the beads-viewer ReplicaSet FailsCreate with
"serviceaccount \"gardenio-agents-sa\" not found" and the login gate never gets a
backend to authenticate to (ka-0000005282). Still gated on serviceAccount.create
so an operator supplying their own SA out-of-band is respected.
*/ -}}
{{- if and (or .Values.agents.enabled .Values.beadsViewer.enabled) .Values.agents.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.agents.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" . | nindent 4 }}
  {{- with .Values.agents.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
Auxiliary ServiceAccount (gd-Hk4RBE2MC7) for beads-viewer.
Same IRSA annotations as the agents SA so the S3 proxy keeps
working; bound only to the namespace Role (controller/rbac.yaml), never to the
cluster/node/pv bindings or the codex-keeper Role, so the controller SA is the
sole holder of the Codex keeper's secrets update.
*/ -}}
{{- if and (or .Values.agents.enabled .Values.beadsViewer.enabled) .Values.agents.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.agents.auxServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" . | nindent 4 }}
  {{- with .Values.agents.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if and .Values.agents.enabled .Values.agents.agentServiceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.coop.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.coop.labels" . | nindent 4 }}
  {{- with .Values.agents.agentServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gardenio.coop.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.coop.labels" . | nindent 4 }}
rules:
  # Agents talk to the controller, not the K8s API — nothing is granted by
  # default. Projects that genuinely need K8s API access opt in per-bead via
  # the cluster-admin SA (see agents.clusterAdmin) or by adding rules here
  # through a values override.
  # See AUDIT.md §C1 / ka-0000002934.
  {{- with .Values.agents.agentServiceAccount.extraRules }}
    {{- toYaml . | nindent 2 }}
  {{- else }}
  []
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gardenio.coop.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.coop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gardenio.coop.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gardenio.coop.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- with .Values.agents.agentServiceAccount.extraSubjects }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

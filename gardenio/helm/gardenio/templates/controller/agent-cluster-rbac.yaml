{{- if and .Values.agents.enabled .Values.agents.clusterAdmin.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.coop.clusterAdminServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.coop.labels" . | nindent 4 }}
  {{- with .Values.agents.clusterAdmin.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.agents.clusterAdmin.useRestrictedRole }}
---
{{/*
Restricted ClusterRole alternative to the built-in `cluster-admin`. Lists
only the verbs/resources actually consumed by code paths that run under
this SA — `gb fleet create/delete` (controller/cmd/gb/fleet.go), helm
upgrades of this chart's cluster-scoped objects (controller/cluster-rbac.yaml,
agent-cluster-rbac.yaml, fleet-manager-rbac.yaml, pv-gc-rbac.yaml), and the
common kubectl/helm operations agents perform.

Off by default (clusterAdmin.useRestrictedRole=false) — operators flip
to true once they have validated the verb list against their workloads.
See gardenio/docs/audits/namespace-isolation-static.md §F8 (ka-0000007647).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gardenio.coop.clusterAdminServiceAccountName" . }}-restricted
  labels:
    {{- include "gardenio.coop.labels" . | nindent 4 }}
rules:
  # Fleet provisioning + helm release management (namespaces, RBAC, secrets).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Workload + storage primitives (agent ops, helm upgrades, kubectl debugging).
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "pods/portforward", "pods/attach", "pods/eviction"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  # Helm releases that ship CRDs.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ExternalSecrets — `gb fleet create` provisions ExternalSecret resources
  # (controller/cmd/gb/fleet.go) and the chart's tenant-system bootstrap may
  # also materialize SecretStores.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores", "clustersecretstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gardenio.coop.clusterAdminServiceAccountName" . }}
  labels:
    {{- include "gardenio.coop.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  {{- if .Values.agents.clusterAdmin.useRestrictedRole }}
  name: {{ include "gardenio.coop.clusterAdminServiceAccountName" . }}-restricted
  {{- else }}
  name: cluster-admin
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gardenio.coop.clusterAdminServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
  {{- if and .Values.gvisor.enabled .Values.gvisor.namespace.name .Values.gvisor.namespace.create }}
  {{/*
  The gVisor namespace mirrors this SA (gvisor-namespace.yaml) because
  runtime_class=runsc agents of an opted-in project are scheduled there. A
  ServiceAccount is namespace-scoped IDENTITY, so the mirror is a DIFFERENT
  subject — without this entry a runsc agent runs under the cluster-admin SA
  name but with zero permissions, and every kubectl call 403s with a confusing
  "serviceaccount ... cannot list resource" naming the right SA.
  */}}
  - kind: ServiceAccount
    name: {{ include "gardenio.coop.clusterAdminServiceAccountName" . }}
    namespace: {{ .Values.gvisor.namespace.name }}
  {{- end }}
  {{- with .Values.agents.clusterAdmin.extraSubjects }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}

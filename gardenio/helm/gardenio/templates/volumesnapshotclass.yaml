{{- if and .Values.volumeSnapshotClass.create (.Capabilities.APIVersions.Has "snapshot.storage.k8s.io/v1") }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.volumeSnapshotClass.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Cluster-scoped, shared across releases — `keep` orphans rather than
    # deletes it when a release stops templating it (see storageclass.yaml,
    # ka-0000006194).
    "helm.sh/resource-policy": keep
driver: ebs.csi.aws.com
deletionPolicy: {{ .Values.volumeSnapshotClass.deletionPolicy | default "Delete" }}
parameters:
  {{- range $i, $tag := .Values.volumeSnapshotClass.tags }}
  tagSpecification_{{ add $i 1 }}: "{{ $tag.key }}={{ $tag.value }}"
  {{- end }}
{{- end }}

{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.litellm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.litellm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.litellm.port | default 4000 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.litellm.selectorLabels" . | nindent 4 }}
{{- end }}

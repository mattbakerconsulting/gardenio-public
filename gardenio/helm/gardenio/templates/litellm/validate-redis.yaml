{{- /*
LiteLLM Redis coordination guard (H4, ka-0000003463, epic ka-0000005228).

When litellm.redis.enabled the Router is wired onto a shared Redis backend
(rate-limit / cooldown / cache — the state that diverges across replicaCount>=2,
H2 ka-0000007221). It needs SOMEWHERE to connect. Two mutually-exclusive
backends satisfy that:
  - IN-CHART:  litellm.redis.deploy.enabled=true renders a single-node Redis
               Deployment+Service; host defaults to that Service.
  - EXTERNAL:  litellm.redis.host set to a managed endpoint (e.g. ElastiCache),
               with deploy.enabled=false.

This guard fails the render when redis is enabled but there is nowhere to
connect — deploy.enabled=false AND host empty — so a misconfigured overlay never
reaches a cluster (a silent empty redis_host would 400 the Router at boot).
*/}}
{{- if and .Values.litellm.enabled .Values.litellm.redis.enabled }}
{{- if and (not .Values.litellm.redis.deploy.enabled) (not .Values.litellm.redis.host) }}
{{- fail "litellm.redis.enabled=true but no Redis endpoint: set litellm.redis.deploy.enabled=true for the in-chart Redis, OR set litellm.redis.host to a managed endpoint (e.g. ElastiCache). See ka-0000003463." }}
{{- end }}
{{- end }}

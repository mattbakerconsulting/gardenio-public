{{- if and .Values.litellm.enabled (or .Values.litellm.thinkingCapture.enabled .Values.litellm.cacheTTL.enabled) }}
# LiteLLM custom-callback source modules. Each enabled callback's Python module
# is rendered verbatim here and mounted at /app/<module>.py via subPath
# (bug ka-0000004812) so litellm's get_instance_fn can resolve the bare module
# name as a file under the --config dir.
#
#   - litellm_thinking_callback.py  (ka-0000002697 / spike ka-0000004553):
#     extracts extended-thinking PLAINTEXT from each completion and publishes it
#     to coop.events.messages.<actor>.thinking — the subject the beads-viewer
#     telepathy consumer (ka-0000007528) reads. Source of truth is
#     files/litellm/litellm_thinking_callback.py; spike write-up in
#     gardenio/docs/thinking-capture-spike.md.
#   - litellm_cache_ttl_callback.py (ka-0000003469 / impl ka-0000004405):
#     pre-call hook that upgrades Claude Code's default 5m ephemeral
#     cache_control breakpoints to ttl:"1h" on the Anthropic /v1/messages route.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gardenio.litellm.fullname" . }}-callback
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.litellm.labels" . | nindent 4 }}
data:
  {{- if .Values.litellm.thinkingCapture.enabled }}
  litellm_thinking_callback.py: |
{{ .Files.Get "files/litellm/litellm_thinking_callback.py" | indent 4 }}
  {{- end }}
  {{- if .Values.litellm.cacheTTL.enabled }}
  litellm_cache_ttl_callback.py: |
{{ .Files.Get "files/litellm/litellm_cache_ttl_callback.py" | indent 4 }}
  {{- end }}
{{- end }}

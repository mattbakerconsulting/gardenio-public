{{- /*
  WHY unconditional, NOT gated on replicaCount > 1 (gd-27vcHmrurh): even at
  replicaCount=1, maxUnavailable:1 (unlike minAvailable:1) can never wedge a
  managed-nodegroup drain — it only blocks eviction while the pod is
  currently unhealthy — so there is no reason to withhold this drain guard
  below HA. See templates/pdb-singletons.yaml (ka-0000001453) for the
  canonical version of this reasoning, which this now matches.
*/}}
{{- if and .Values.litellm.enabled .Values.litellm.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gardenio.litellm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.litellm.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.litellm.pdb.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "gardenio.litellm.selectorLabels" . | nindent 6 }}
{{- end }}

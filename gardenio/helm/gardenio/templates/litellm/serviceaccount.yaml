{{- if .Values.litellm.enabled }}
# LiteLLM ServiceAccount (ka-0000007591, Stage-3 ka-0000002573, epic
# ka-0000000560; unconditional-sa decision ka-0000000992).
#
# This SA object is rendered UNCONDITIONALLY whenever litellm is enabled — it is
# decoupled from the IRSA credential gate on purpose. Previously both this object
# and the deployment's serviceAccountName reference gated on the same dedicated-SA
# expression, and a render-time divergence left the deployment referencing
# gardenio-litellm while no SA object existed → ReplicaFailure/FailedCreate
# "serviceaccount gardenio-litellm not found" and red deploy-prod for 3 consecutive
# golden tags (ka-0000006740). Always materialising the SA makes that class of
# failure structurally impossible: the SA the pod names is guaranteed to exist.
#
# The IRSA role-arn annotation is added ONLY under the Bedrock IRSA credential
# strategy (gardenio.litellm.usesDedicatedSA) — that annotation is what the EKS
# pod-identity webhook keys off to inject the projected web-identity token (the
# deployment flips automountServiceAccountToken on for that strategy). Under the
# common chat-only / static-creds case the SA exists but carries no role-arn and
# the pod does not mount its token, so it is an inert default-style SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.litellm.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.litellm.labels" . | nindent 4 }}
  {{- if include "gardenio.litellm.usesDedicatedSA" . }}
  annotations:
    # IRSA: the role referenced here must allow bedrock:InvokeModel on every
    # enabled Bedrock model (the Titan embedder and any bedrock chat groups).
    eks.amazonaws.com/role-arn: {{ .Values.litellm.embedding.irsaRoleArn | quote }}
  {{- end }}
{{- end }}

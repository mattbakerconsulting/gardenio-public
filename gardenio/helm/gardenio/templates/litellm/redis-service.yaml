{{- if and .Values.litellm.enabled .Values.litellm.redis.enabled .Values.litellm.redis.deploy.enabled }}
{{- /*
Optional in-chart Redis Service for LiteLLM router coordination (H4,
ka-0000003463). ClusterIP only — the :6379 endpoint the litellm Router targets
(gardenio.litellm.redis.host defaults to this Service). Never edge-exposed.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.litellm.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.litellm.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.litellm.redis.port | default 6379 }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "gardenio.litellm.redis.selectorLabels" . | nindent 4 }}
{{- end }}

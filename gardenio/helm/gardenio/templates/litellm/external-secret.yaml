{{- if and .Values.litellm.enabled .Values.externalSecrets.enabled .Values.externalSecrets.litellm.masterKey.remoteRef .Values.externalSecrets.litellm.saltKey.remoteRef }}
# In-chart LiteLLM proxy secrets (tier h1, ka-0000001624 of epic ka-0000004609).
# Materializes a single K8s Secret containing both LITELLM_MASTER_KEY and
# LITELLM_SALT_KEY for the bundled litellm Deployment. Distinct from the
# prod-style `litellm-master-key` ESO in templates/external-secrets.yaml
# (which is for controller spend_sync against an external LiteLLM in the
# devops namespace).
#
# K8s Secret name matches the gardenio.litellm.masterKeySecretName helper
# fallback ("<release>-litellm-master-key") so the existing deployment.yaml
# secretKeyRef wiring keeps working unchanged.
#
# Data keys on the Secret:
#   master-key — LITELLM_MASTER_KEY value (used to authenticate proxy clients).
#   salt-key   — LITELLM_SALT_KEY value (encrypts virtual-key material at rest).
#   token      — alias of master-key; the existing litellm Deployment reads
#                this key for LITELLM_MASTER_KEY, mirroring the shape of the
#                prod-style `litellm-master-key` ExternalSecret.
#
# Category: static — master-key + salt-key rotation is an operator-driven
# event that requires re-issuing virtual keys; short refreshInterval would
# only add load without any rotation upside.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gardenio.litellm.masterKeySecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.litellm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "static" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "gardenio.litellm.masterKeySecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        master-key: '{{`{{ .master_key }}`}}'
        salt-key: '{{`{{ .salt_key }}`}}'
        token: '{{`{{ .master_key }}`}}'
  data:
    - secretKey: master_key
      remoteRef:
        key: {{ .Values.externalSecrets.litellm.masterKey.remoteRef | quote }}
        {{- if .Values.externalSecrets.litellm.masterKey.property }}
        property: {{ .Values.externalSecrets.litellm.masterKey.property | quote }}
        {{- end }}
    - secretKey: salt_key
      remoteRef:
        key: {{ .Values.externalSecrets.litellm.saltKey.remoteRef | quote }}
        {{- if .Values.externalSecrets.litellm.saltKey.property }}
        property: {{ .Values.externalSecrets.litellm.saltKey.property | quote }}
        {{- end }}
{{- end }}

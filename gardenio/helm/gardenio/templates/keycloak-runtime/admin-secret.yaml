{{- /*
Bootstrap admin Secret for the in-box Keycloak runtime.

Holds the master-realm bootstrap superuser (username/password) that the
StatefulSet projects via secretKeyRef into KC_BOOTSTRAP_ADMIN_USERNAME /
KC_BOOTSTRAP_ADMIN_PASSWORD (upstream KC 26 env names). Also consumed by the ClusterKeycloak
CR (runtime.clusterKeycloak.adminSecret defaults to the same Secret) so the
realm operator can authenticate to the in-cluster admin REST API.

The password is generated on first install via `randAlphaNum 32` and is
preserved across upgrades via `helm.sh/resource-policy: keep` plus the
`gardenio.keycloakRuntime.admin.password` helper which `lookup`s the existing
Secret. This guarantees a stable admin password across `helm upgrade`s.

OPERATOR-NAMESPACE COPY (ka-0000005282): the EDP keycloak-operator resolves a
ClusterKeycloak's `.spec.secret` in its OWN namespace (OPERATOR_NAMESPACE), not
in the CR's namespace. The StatefulSet reads this Secret from .Release.Namespace,
so the operator needs an IDENTICAL copy in its namespace or ClusterKeycloak stays
connected:false and the realm/clients are never reconciled (oauth2-proxy 404s
"Realm does not exist" -> CrashLoopBackOff). When
runtime.clusterKeycloak.operatorNamespace is set (and differs from the release
namespace) we emit a second copy there. Both copies share the SAME password
value ($pw, computed once here) so they never diverge — critical on FIRST
install, where the helper's `lookup` returns nil and would otherwise mint two
DIFFERENT randAlphaNum values in two separate templates.

Precedent: templates/postgres/external-rds-credentials.yaml.
Gated by runtime.enabled AND runtime.admin.generate (default true for in-box).
Set runtime.admin.generate=false when supplying the Secret out-of-band.
*/ -}}
{{- if and .Values.keycloak.enabled .Values.keycloak.runtime.enabled .Values.keycloak.runtime.admin.generate -}}
{{- $runtime := .Values.keycloak.runtime -}}
{{- $usernameKey := $runtime.admin.usernameKey | default "username" -}}
{{- $passwordKey := $runtime.admin.passwordKey | default "password" -}}
{{- $username := $runtime.admin.username | default "admin" -}}
{{- /* Compute the password ONCE so every copy is byte-identical. */ -}}
{{- $pw := include "gardenio.keycloakRuntime.admin.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtime.admin.existingSecret | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.keycloakRuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-runtime-admin
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $usernameKey }}: {{ $username | b64enc | quote }}
  {{ $passwordKey }}: {{ $pw | b64enc | quote }}
{{- $opNs := $runtime.clusterKeycloak.operatorNamespace -}}
{{- if and $opNs (ne $opNs .Release.Namespace) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtime.admin.existingSecret | quote }}
  # The operator namespace: the EDP operator reads the ClusterKeycloak admin
  # Secret from its OWN namespace (ka-0000005282). This copy MUST exist there or
  # the realm is never reconciled.
  namespace: {{ $opNs | quote }}
  labels:
    {{- include "gardenio.keycloakRuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-runtime-admin
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $usernameKey }}: {{ $username | b64enc | quote }}
  {{ $passwordKey }}: {{ $pw | b64enc | quote }}
{{- end }}
{{- end }}

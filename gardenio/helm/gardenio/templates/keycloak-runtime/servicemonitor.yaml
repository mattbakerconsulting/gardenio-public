{{- if and .Values.keycloak.enabled .Values.keycloak.runtime.enabled .Values.keycloak.runtime.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gardenio.keycloakRuntime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.keycloakRuntime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gardenio.keycloakRuntime.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: management
      path: {{ printf "%s/metrics" (.Values.keycloak.runtime.httpRelativePath | default "/auth") }}
      interval: {{ .Values.keycloak.runtime.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.keycloak.runtime.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}

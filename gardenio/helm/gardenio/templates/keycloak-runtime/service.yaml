{{- if and .Values.keycloak.enabled .Values.keycloak.runtime.enabled }}
{{- $runtime := .Values.keycloak.runtime -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.keycloakRuntime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.keycloakRuntime.labels" . | nindent 4 }}
spec:
  type: {{ $runtime.service.type | default "ClusterIP" }}
  ports:
    - port: {{ $runtime.service.httpPort | default 8080 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if include "gardenio.keycloakRuntime.tlsEnabled" . }}
    # In-cluster https (gd-XRsosVFAau), cert from templates/keycloak-runtime/tls.yaml.
    - port: {{ $runtime.service.httpsPort | default 8443 }}
      targetPort: https
      protocol: TCP
      name: https
    {{- end }}
    - port: {{ $runtime.service.managementPort | default 9000 }}
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "gardenio.keycloakRuntime.selectorLabels" . | nindent 4 }}
{{- end }}

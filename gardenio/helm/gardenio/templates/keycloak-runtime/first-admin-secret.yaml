{{- /*
First-admin bootstrap Secret for the in-box Keycloak runtime.

Holds the username + one-time installer password for the gardenio-REALM admin
user that the post-install bootstrap Job (first-admin-job.yaml) creates. This is
DISTINCT from the master-realm bootstrap admin (admin-secret.yaml): that one is
a Keycloak master-realm superuser that cannot log into beads over OIDC; THIS one
is the first real gardenio-realm OIDC user that lands with the gardenio-admin role
so a fresh box is not locked read-only (research ka-0000004895 §3).

The password is generated on first install via `randAlphaNum 32` and preserved
across upgrades via `helm.sh/resource-policy: keep` plus the
`gardenio.keycloakRuntime.firstAdmin.password` helper which `lookup`s the existing
Secret. The operator retrieves it ONCE after install:

  kubectl get secret <release>-keycloak-first-admin -n <ns> \
    -o jsonpath='{.data.password}' | base64 -d; echo

Precedent: templates/keycloak-runtime/admin-secret.yaml.
Gated by runtime.enabled AND firstAdmin.enabled AND
firstAdmin.passwordSecret.generate (default true for in-box). Set generate=false
to supply the Secret out-of-band.
*/ -}}
{{- if and .Values.keycloak.enabled .Values.keycloak.runtime.enabled .Values.keycloak.runtime.firstAdmin.enabled .Values.keycloak.runtime.firstAdmin.passwordSecret.generate -}}
{{- $fa := .Values.keycloak.runtime.firstAdmin -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.keycloakRuntime.firstAdmin.secretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.keycloakRuntime.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-runtime-first-admin
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $fa.passwordSecret.usernameKey | default "username" }}: {{ include "gardenio.keycloakRuntime.firstAdmin.username" . | b64enc | quote }}
  {{ $fa.passwordSecret.passwordKey | default "password" }}: {{ include "gardenio.keycloakRuntime.firstAdmin.password" . | b64enc | quote }}
{{- end }}

{{/*
VMServiceScrape for keycloak-runtime (management port /metrics).

Emitted in parallel to keycloak-runtime/servicemonitor.yaml when
`monitoring.victoriaMetrics.enabled` is true and the keycloak runtime is
enabled. customer-poc-aws POC use case: see bead ka-0000005115.
*/}}
{{- if and .Values.keycloak.enabled .Values.keycloak.runtime.enabled (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.keycloakRuntime.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.keycloakRuntime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "gardenio.keycloakRuntime.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: management
      path: {{ printf "%s/metrics" (.Values.keycloak.runtime.httpRelativePath | default "/auth") }}
      interval: {{ .Values.keycloak.runtime.serviceMonitor.interval | default .Values.monitoring.victoriaMetrics.interval | default "30s" }}
      scrapeTimeout: {{ .Values.keycloak.runtime.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}

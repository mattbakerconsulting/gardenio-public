{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Cluster-scoped, shared by every release on the cluster. `keep` ensures a
    # release that stops templating this SC (e.g. staging flips create:false,
    # or an uninstall) ORPHANS it instead of deleting the StorageClass other
    # releases' PVCs depend on. Only the prod `gardenio` release sets create:true
    # and owns it; staging merely references it (ka-0000006194).
    "helm.sh/resource-policy": keep
provisioner: ebs.csi.aws.com
parameters:
  type: {{ .Values.storageClass.type | default "gp3" }}
  {{- range $i, $tag := .Values.storageClass.tags }}
  tagSpecification_{{ add $i 1 }}: "{{ $tag.key }}={{ $tag.value }}"
  {{- end }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode | default "WaitForFirstConsumer" }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy | default "Delete" }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion | default true }}
{{- end }}

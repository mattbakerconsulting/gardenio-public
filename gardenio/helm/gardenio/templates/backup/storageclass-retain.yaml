{{- if .Values.storageClassRetain.create }}
# local-path StorageClass with reclaimPolicy: Retain for Gardenio-in-a-Box.
#
# k3s's built-in `local-path` SC is reclaimPolicy: Delete — deleting a PVC (or
# `helm uninstall`) wipes the on-disk dir. The critical stores (postgres / nats
# / keycloak) point their `persistence.storageClass` at THIS class so a deleted
# PVC ORPHANS its PV (data survives) instead of being erased. Mirrors the
# `helm.sh/resource-policy: keep` intent on the chart's cluster-scoped EBS SC.
#
# reclaimPolicy is immutable and applies only to PVs provisioned after a store
# is (re)created against this class. See gardenio/docs/gardenio-in-a-box-restore.md.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClassRetain.name }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-retain
  annotations:
    # Cluster-scoped and shared. `keep` orphans (rather than deletes) the SC if
    # a release stops templating it, so other releases' PVs keep their class.
    "helm.sh/resource-policy": keep
provisioner: {{ .Values.storageClassRetain.provisioner | quote }}
volumeBindingMode: {{ .Values.storageClassRetain.volumeBindingMode | default "WaitForFirstConsumer" }}
reclaimPolicy: {{ .Values.storageClassRetain.reclaimPolicy | default "Retain" }}
{{- end }}

{{- if .Values.bridgeLogShipper.enabled }}
{{- /*
bridge-log-shipper RBAC (non-AVA webhook-audit transport, GAP-B of the webhook
carve-out, task ka-0000000320, epic ka-0000000914).

Unlike the traefik-log-shipper (whose source pod lives in a SEPARATE
terraform-managed `traefik` namespace and so needs a cross-namespace Role), both
bridge doors — jira-bridge and gitlab-bridge — run in THIS release's namespace
alongside the shipper. So the Role + RoleBinding are same-namespace and there is
no second-namespace image-pull plumbing.

Least-privilege: list/get pods (to resolve the two bridge pods by selector) and
get pods/log (to open the follow streams) in the release namespace ONLY. Nothing
else — no write verbs, no other namespaces, no cluster scope.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gardenio.bridgeLogShipper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.bridgeLogShipper.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gardenio.bridgeLogShipper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.bridgeLogShipper.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gardenio.bridgeLogShipper.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.bridgeLogShipper.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gardenio.bridgeLogShipper.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gardenio.bridgeLogShipper.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.mcpVictoriaLogs.enabled }}
# ClusterIP Service for the standalone mcp-victorialogs server (task ka-0000006956).
# Agents reach it in-cluster at
# http://{{ include "gardenio.mcpVictoriaLogs.fullname" . }}:{{ .Values.mcpVictoriaLogs.service.port }}{{ .Values.mcpVictoriaLogs.endpointPath }}
# (the URL the crew claude-mcp config bead points at). Not exposed via IngressRoute.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.mcpVictoriaLogs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.mcpVictoriaLogs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpVictoriaLogs.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.mcpVictoriaLogs.service.port | default 8081 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gardenio.mcpVictoriaLogs.selectorLabels" . | nindent 4 }}
{{- end }}

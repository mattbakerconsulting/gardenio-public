{{- if .Values.vmalertLogs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.vmalertLogs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vmalertLogs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8880
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.vmalertLogs.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if and .Values.alertmanager.enabled .Values.alertmanager.slack.secretName .Values.externalSecrets.enabled .Values.externalSecrets.alertmanagerSlackWebhook.remoteRef }}
# Slack incoming-webhook URL for the Alertmanager → Slack delivery path (epic
# ka-0000000770, decision ka-0000006149 option (a)). One K8s Secret (key =
# alertmanager.slack.secretKey, default "url") synced from AWS Secrets Manager,
# mirroring the mcp-grafana-token / mezmo single-token ExternalSecret shape.
# Consumed by the Alertmanager Deployment as a mounted FILE, referenced by
# alertmanager.yml via global.slack_api_url_file — the webhook URL never lands
# in the rendered config ConfigMap.
#
# Gated on alertmanager.enabled + slack.secretName + externalSecrets.enabled +
# a non-empty remoteRef. The ESO provider role can READ but not CreateSecret in
# AWS SM, so an operator seeds the SM entry once before flipping this on (see
# externalSecrets.alertmanagerSlackWebhook in values.yaml). Break-glass path:
# seed the K8s Secret out-of-band and leave the remoteRef empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.alertmanager.slack.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.alertmanager.labels" . | nindent 4 }}
spec:
  # Category: oauth — a Slack incoming-webhook URL is an external-provider
  # credential, same rotation class as the other bridge tokens.
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.alertmanager.slack.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        {{ .Values.alertmanager.slack.secretKey | default "url" }}: '{{`{{ .url }}`}}'
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.externalSecrets.alertmanagerSlackWebhook.remoteRef | quote }}
        {{- if .Values.externalSecrets.alertmanagerSlackWebhook.property }}
        property: {{ .Values.externalSecrets.alertmanagerSlackWebhook.property | quote }}
        {{- end }}
{{- end }}

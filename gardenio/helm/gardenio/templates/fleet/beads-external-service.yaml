{{- if and .Values.fleet.enabled .Values.fleet.parentRelease .Values.fleet.parentNamespace }}
{{- /*
  ExternalName service that forwards beads daemon traffic to the parent fleet.
  Named to match gardenio.beads.fullname so existing helpers resolve transparently.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.beads.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.beads.labels" . | nindent 4 }}
    gardenio.dev/fleet-external: "true"
spec:
  type: ExternalName
  externalName: {{ .Values.fleet.parentRelease }}-beads.{{ .Values.fleet.parentNamespace }}.svc.cluster.local
{{- end }}

{{- /*
  Stage 3 / W-B-12 (ka-0000007194): gardenio-edge-auth Service.

  ClusterIP for the Traefik IngressRoute to target. The shim is the only
  pod that fronts cli.gardenio.<env>; no in-cluster caller talks to it
  directly (daemons trust X-Operator via HMAC, not via this Service).
*/}}
{{- if .Values.edgeAuth.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.edgeAuth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.edgeAuth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.edgeAuth.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.edgeAuth.service.port | default 8096 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- /* Internal-only metrics port (ka-0000006312). Scraped in-cluster;
       the public IngressRoute only ever targets the http port. */}}
    - port: {{ .Values.edgeAuth.metrics.port | default 9092 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.edgeAuth.selectorLabels" . | nindent 4 }}
{{- end }}

{{- /*
  Stage 3 / W-B-12 (ka-0000007194): ExternalSecret for the edge-auth
  HMAC signing key.

  The HMAC envelope is the load-bearing trust boundary between the shim
  and downstream daemons (W-B-11): if it is forgeable, any in-cluster
  caller could mint X-Operator headers. Sourced from the cluster's
  configured secret store; an env-local override is allowed via
  edgeAuth.hmacKey.secretName so dev / e2e harnesses can supply their
  own K8s Secret without going through ExternalSecrets.

  No-op when externalSecrets.enabled=false OR no remoteRef configured.
  The deployment marks the env var optional so the pod still starts;
  the proxy surface 503s until the key lands. /healthz stays up.
*/}}
{{- if and .Values.edgeAuth.enabled .Values.externalSecrets.enabled .Values.externalSecrets.edgeAuthHMACKey.remoteRef (not .Values.edgeAuth.hmacKey.secretName) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gardenio.edgeAuth.hmacSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.edgeAuth.labels" . | nindent 4 }}
spec:
  # Category: rotated — HMAC signing key is the trust boundary between the
  # edge-auth shim and downstream daemons. Short refresh so rotations
  # propagate before the previous key is retired.
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "rotated" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "gardenio.edgeAuth.hmacSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        {{ .Values.edgeAuth.hmacKey.secretKey | default "hmac-key" }}: '{{`{{ .hmac_key }}`}}'
        {{- if and .Values.edgeAuth.hmacKey.secretKeyV2 .Values.externalSecrets.edgeAuthHMACKeyV2.remoteRef }}
        {{ .Values.edgeAuth.hmacKey.secretKeyV2 }}: '{{`{{ .hmac_key_v2 }}`}}'
        {{- end }}
        {{- if and .Values.edgeAuth.hmacKey.secretKeyRelay .Values.externalSecrets.edgeAuthHMACKeyRelay.remoteRef }}
        {{ .Values.edgeAuth.hmacKey.secretKeyRelay }}: '{{`{{ .hmac_key_relay }}`}}'
        {{- end }}
  data:
    - secretKey: hmac_key
      remoteRef:
        key: {{ .Values.externalSecrets.edgeAuthHMACKey.remoteRef | quote }}
        {{- if .Values.externalSecrets.edgeAuthHMACKey.property }}
        property: {{ .Values.externalSecrets.edgeAuthHMACKey.property | quote }}
        {{- end }}
    {{- if and .Values.edgeAuth.hmacKey.secretKeyV2 .Values.externalSecrets.edgeAuthHMACKeyV2.remoteRef }}
    # Split v2 envelope key (gd-h2tQrOwjGJ, edgeAuth.hmacKey.secretKeyV2).
    - secretKey: hmac_key_v2
      remoteRef:
        key: {{ .Values.externalSecrets.edgeAuthHMACKeyV2.remoteRef | quote }}
        {{- if .Values.externalSecrets.edgeAuthHMACKeyV2.property }}
        property: {{ .Values.externalSecrets.edgeAuthHMACKeyV2.property | quote }}
        {{- end }}
    {{- end }}
    {{- if and .Values.edgeAuth.hmacKey.secretKeyRelay .Values.externalSecrets.edgeAuthHMACKeyRelay.remoteRef }}
    # Glass relay key (gd-9ZGh01W5ub, edgeAuth.hmacKey.secretKeyRelay).
    - secretKey: hmac_key_relay
      remoteRef:
        key: {{ .Values.externalSecrets.edgeAuthHMACKeyRelay.remoteRef | quote }}
        {{- if .Values.externalSecrets.edgeAuthHMACKeyRelay.property }}
        property: {{ .Values.externalSecrets.edgeAuthHMACKeyRelay.property | quote }}
        {{- end }}
    {{- end }}
{{- end }}

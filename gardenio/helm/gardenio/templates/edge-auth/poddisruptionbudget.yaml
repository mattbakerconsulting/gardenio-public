{{- /*
  PodDisruptionBudget for gardenio-edge-auth. Gated the same way as the
  Deployment (edgeAuth.enabled + not dryRun) plus an explicit
  edgeAuth.podDisruptionBudget.enabled opt-in. Only meaningful when
  edgeAuth.replicaCount > 1 — with maxUnavailable: 1 it lets a voluntary
  disruption (Karpenter consolidation/drift, node drain) evict at most one
  edge-auth pod at a time, so the AVA forwardauth path never fully drops.
*/}}
{{- if and .Values.edgeAuth.enabled (not .Values.edgeAuth.dryRun) .Values.edgeAuth.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gardenio.edgeAuth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.edgeAuth.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.edgeAuth.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "gardenio.edgeAuth.selectorLabels" . | nindent 6 }}
{{- end }}

{{- /*
Password of the postgres_exporter login role (gd-cawNAc0iU7). Always chart-
owned: the role only exists inside this postgres, so there is no external
store to source it from. Seeded like credentials.yaml (lookup, then
randAlphaNum 32; alphanumeric, which the exporter's DSN parser requires) and
kept across upgrades and uninstall. The exporter-setup container applies it
with ALTER ROLE on every pod start, so a rotated value converges on restart.
*/ -}}
{{- if and .Values.postgres.enabled .Values.postgres.exporter.enabled }}
{{- $name := printf "%s-exporter" (include "gardenio.postgres.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.postgres.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ include "gardenio.inbox.seededValue" (dict "root" . "secretName" $name "key" "password" "len" 32) | b64enc | quote }}
{{- end }}

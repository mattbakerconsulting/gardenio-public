{{- /*
Per-instance external-RDS role password Secret.

Holds the password for the per-instance Postgres role created by the
provisioning Job (see external-rds-provision-job.yaml). Beads daemon reads
this Secret at runtime via secretKeyRef.

The password is generated on first install via `randAlphaNum 32` and is
preserved across upgrades via `helm.sh/resource-policy: keep` plus the
`gardenio.beads.externalRDS.password` helper which `lookup`s the existing
Secret. This guarantees stable credentials across `helm upgrade`s.

Resolution: D2 (ka-0000005090) — shared-rds-per-db, scoped role per
ephemeral. E3 of the ephemeral smoketests umbrella (ka-0000002007;
docs/archive/rwx/docs/gardenio-plans/ephemeral-rwx-smoketests.md).
*/ -}}
{{- if .Values.beads.externalRDS.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.beads.externalRDS.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.beads.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-rds-credentials
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ include "gardenio.beads.externalRDS.password" . | b64enc | quote }}
{{- end }}

{{- /*
Chart-managed in-box Postgres password Secret.

When postgres.enabled && not externalSecrets.enabled, the chart owns the
<release>-postgres-password Secret directly — no AWS Secrets Manager /
ExternalSecrets dependency. This unblocks Gardenio-in-a-Box: with
externalSecrets.enabled=false the Secret would otherwise never exist and
the postgres StatefulSet + beads daemon (which read it via secretKeyRef)
fail to start.

Mirrors the proven external-rds-credentials.yaml pattern:
  - helm.sh/resource-policy: keep   -> Secret survives `helm uninstall`
  - lookup-then-randAlphaNum 32      -> existing password never regenerated
    across `helm upgrade` (see gardenio.postgres.password helper).

Emits both keys the ExternalSecrets-managed Secret provides today
(see external-secrets.yaml): `password` and `password_url`
(urlquery-escaped, for embedding in a connection string).
*/ -}}
{{- if and .Values.postgres.enabled (not .Values.externalSecrets.enabled) -}}
{{- $password := include "gardenio.postgres.password" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.postgres.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-credentials
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
  password_url: {{ $password | urlquery | b64enc | quote }}
{{- end }}

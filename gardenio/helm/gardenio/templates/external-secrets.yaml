    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.coopmux.credentialKey.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        {{ .Values.coopmux.credentialKey.secretKey }}: '{{`{{ .key }}`}}'
  data:
    - secretKey: key
      remoteRef:
        key: {{ .Values.externalSecrets.coopCredentialKey.remoteRef | quote }}
        {{- if .Values.externalSecrets.coopCredentialKey.property }}
        property: {{ .Values.externalSecrets.coopCredentialKey.property | quote }}
        {{- end }}
{{- end }}

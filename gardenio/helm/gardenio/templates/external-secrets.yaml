# GitLab API token (consumed by gitlab-bridge as GITLAB_API_TOKEN — a REQUIRED
# secretKeyRef; the pod CrashLoops without it). Mirrors the jiraApiToken block:
# gated on gitlabBridge.enabled so it stays dormant until the bridge is turned
# on (e.g. the P4.4 cutover step E flip). The K8s Secret name + key match the
# gitlab-bridge deployment's secretKeyRef (.Values.gitlabBridge.gitlab.secretName
# / .secretKey, default "token").
# Category: oauth — GitLab PAT/deploy token, refreshed only when an operator
# rotates it and updates the secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gitlabBridge.gitlab.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitlab-bridge
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.gitlabBridge.gitlab.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        {{ .Values.gitlabBridge.gitlab.secretKey | default "token" }}: '{{`{{ .api_token }}`}}'
  data:
    - secretKey: api_token
      remoteRef:
        key: {{ .Values.externalSecrets.gitlabToken.remoteRef | quote }}
        {{- if .Values.externalSecrets.gitlabToken.property }}
        property: {{ .Values.externalSecrets.gitlabToken.property | quote }}
        {{- end }}
{{- end }}

{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.postgresPassword.remoteRef (not .Values.fleet.enabled) }}
---
# PostgreSQL password from secret store.
# Category: rotated-db — in prod this is the RDS-managed master password, which
# AWS RDS/Secrets Manager rotates AUTOMATICALLY (not a manual op). A slow refresh
# lets the daemon hold a stale password past a rotation and CrashLoop on pq
# 28P01 until the next sync — the P0 outage ka-0000006811 (2026-07-25). Short
# interval caps the stale window at minutes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gardenio.postgres.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.postgres.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "rotated-db" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "gardenio.postgres.passwordSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        password: '{{`{{ .password }}`}}'
        password_url: '{{`{{ urlquery .password }}`}}'
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.externalSecrets.postgresPassword.remoteRef | quote }}
        {{- if .Values.externalSecrets.postgresPassword.property }}
        property: {{ .Values.externalSecrets.postgresPassword.property | quote }}
        {{- end }}
{{- end }}

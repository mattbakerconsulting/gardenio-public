{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.beadsToken.remoteRef }}
# Beads daemon authentication token from secret store.
# Category: rotated — token-rotator CronJob rotates this in-store (see
# `tokenRotation` in values.yaml). Short refresh so rotated values reach
# controller / bridges before the overlap window closes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "gardenio.beads.tokenSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "rotated" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ include "gardenio.beads.tokenSecretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        token: '{{`{{ .token }}`}}'
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.externalSecrets.beadsToken.remoteRef | quote }}
        {{- if .Values.externalSecrets.beadsToken.property }}
        property: {{ .Values.externalSecrets.beadsToken.property | quote }}
        {{- end }}
{{- end }}

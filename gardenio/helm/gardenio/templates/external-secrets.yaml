{{- if and .Values.externalSecrets.enabled .Values.slackBridge.enabled .Values.externalSecrets.slackCredentials.remoteRef .Values.slackBridge.slack.secretName }}
---
# Slack bot credentials (consumed by slack-bridge as SLACK_BOT_TOKEN /
# SLACK_APP_TOKEN — both REQUIRED secretKeyRefs; the pod hits
# CreateContainerConfigError on rollout without them, mirroring the
# jiraApiToken/gitlabToken contract, ka-0000005548). Materializes the K8s Secret
# named by .Values.slackBridge.slack.secretName with keys bot-token + app-token
# (and signing-secret when externalSecrets.slackCredentials.includeSigningSecret
# is true; the deployment mounts signing-secret optional so Socket-Mode apps
# without one still start). Gated on slackBridge.enabled + slack.secretName so it
# stays dormant until the bridge is turned on (e.g. the P4.4 step-E slack flip,
# ka-0000006191). The remote secret is a JSON object exposing bot-token /
# app-token (optionally signing-secret) as top-level properties.
# Category: oauth — Slack app/bot tokens, refreshed only when an operator rotates
# them and updates the secret store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.slackBridge.slack.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-bridge
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.slackBridge.slack.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        bot-token: '{{`{{ .bot_token }}`}}'
        app-token: '{{`{{ .app_token }}`}}'
        {{- if .Values.externalSecrets.slackCredentials.includeSigningSecret }}
        signing-secret: '{{`{{ .signing_secret }}`}}'
        {{- end }}
  data:
    - secretKey: bot_token
      remoteRef:
        key: {{ .Values.externalSecrets.slackCredentials.remoteRef | quote }}
        property: "bot-token"
    - secretKey: app_token
      remoteRef:
        key: {{ .Values.externalSecrets.slackCredentials.remoteRef | quote }}
        property: "app-token"
    {{- if .Values.externalSecrets.slackCredentials.includeSigningSecret }}
    - secretKey: signing_secret
      remoteRef:
        key: {{ .Values.externalSecrets.slackCredentials.remoteRef | quote }}
        property: "signing-secret"
    {{- end }}
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.slackE2ESession .Values.externalSecrets.slackE2ESession.remoteRef }}
---
# Real-user Slack E2E session (epic ka-0000006991, task ka-0000002727).
# Materializes the K8s Secret named by externalSecrets.slackE2ESession.secretName
# with a single key `storage-state.json` — the verbatim Playwright storageState
# document for the dedicated TEST Slack human user (the `d`/`d-s` session
# cookies). The slack-ui Playwright module (gardenio/tests/slack-e2e/) mounts it
# and injects it as its browser storageState so it authenticates as a real human
# without scripting Slack's MFA/email-code login.
#
# Gated on externalSecrets.enabled + slackE2ESession.remoteRef, so it stays
# dormant on every stack that does not opt in (empty remoteRef is the default in
# values.yaml). The session cookies EXPIRE (rolling weeks-to-months) — the
# refresh runbook (gardenio/docs/slack-e2e-provisioning.md) rewrites the SM value
# in place and this ExternalSecret re-syncs it on refreshInterval (category
# `oauth`) with no redeploy.
#
# Category: oauth — a provider session credential rotated only when an operator
# re-captures it, same class as the Slack app tokens above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.slackE2ESession.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack-e2e
spec:
  refreshInterval: {{ .Values.externalSecrets.slackE2ESession.refreshInterval | default (include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .)) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.externalSecrets.slackE2ESession.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        storage-state.json: '{{`{{ .storage_state }}`}}'
  data:
    - secretKey: storage_state
      remoteRef:
        key: {{ .Values.externalSecrets.slackE2ESession.remoteRef | quote }}
        property: {{ .Values.externalSecrets.slackE2ESession.sessionProperty | default "storage-state" | quote }}
{{- end }}
{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.boxUserAdminSvcSecret.remoteRef }}
---
# gardenio-in-a-box (GiB) Keycloak user-management service-account client secret
# (epic ka-0000001297, task ka-0000001845; design ka-0000005452).
#
# The box Keycloak (`gardenio-inbox` realm) is a SEPARATE server the in-cluster
# keycloak-operator cannot reconcile into, so — unlike the info-density client,
# whose secret the operator auto-generates from a KeycloakClient CRD — this
# confidential client's secret has no CRD path and must flow AWS SM -> here ->
# K8s Secret. An agent pod reads the target Secret (agent SA `get`, see the
# deploy overlay's agents.agentServiceAccount.extraRules) and mints a
# `client_credentials` token to drive box user-management REST.
#
# The SM key MUST live under gardenio/prod/* (NOT gardenio/box/*): the
# ESO IRSA is GetSecretValue-scoped to gardenio/prod/*, so a
# gardenio/box/* key is AccessDenied and this ExternalSecret would sit in
# SecretSyncedError (values.yaml boxUserAdminSvcSecret comment; runbook
# docs/runbooks/box-useradmin-svc-secret.md).
#
# Category: oauth — a confidential OAuth client secret rotated on a manual
# operator step (regenerate on the box + rewrite the SM value).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.boxUserAdminSvcSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: box-useradmin-svc
spec:
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.externalSecrets.boxUserAdminSvcSecret.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        clientSecret: '{{`{{ .clientSecret }}`}}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: {{ .Values.externalSecrets.boxUserAdminSvcSecret.remoteRef | quote }}
        {{- if .Values.externalSecrets.boxUserAdminSvcSecret.property }}
        property: {{ .Values.externalSecrets.boxUserAdminSvcSecret.property | quote }}
        {{- end }}
{{- end }}

{{- if and .Values.mcpGrafana.enabled .Values.mcpGrafana.token.secretName .Values.mcpGrafana.token.externalSecret.enabled }}
# Scoped Grafana VIEWER service-account token for the standalone mcp-grafana
# server (A2, task ka-0000002328; Track A epic ka-0000005390). One k8s Secret
# (key "token") synced from AWS Secrets Manager, mirroring the mezmo
# single-token ExternalSecret shape and consumed by the A1 Deployment as
# GRAFANA_SERVICE_ACCOUNT_TOKEN (same Bearer-token-from-Secret pattern as the
# grafana-bridge GRAFANA_TOKEN).
#
# Default OFF (gated on mcpGrafana.enabled + token.secretName +
# token.externalSecret.enabled). The ESO
# provider role can READ but not CreateSecret in AWS SM, so an operator seeds
# the SM entry once before flipping this on — see
# docs/runbooks/grafana-mcp-token.md. The break-glass path provisions the same
# Secret out-of-band instead (externalSecret.enabled=false).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.mcpGrafana.token.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-grafana
spec:
  # Category: oauth — a Grafana SA token is an external-provider API key, same
  # rotation class as the Mezmo MCP key and the env Grafana token bundle.
  # Per-component override wins; otherwise the centralized `oauth` bucket applies.
  refreshInterval: {{ .Values.mcpGrafana.token.externalSecret.refreshInterval | default (include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .)) }}
  secretStoreRef:
    kind: {{ .Values.mcpGrafana.token.externalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.mcpGrafana.token.externalSecret.secretStoreName }}
  target:
    name: {{ .Values.mcpGrafana.token.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        token: '{{`{{ .token }}`}}'
  data:
    - secretKey: token
      remoteRef:
        key: {{ .Values.mcpGrafana.token.externalSecret.remoteRef | quote }}
        property: {{ .Values.mcpGrafana.token.externalSecret.tokenProperty | default "token" | quote }}
{{- end }}

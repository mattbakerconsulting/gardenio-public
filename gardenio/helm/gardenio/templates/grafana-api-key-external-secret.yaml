{{- if and .Values.agents.enabled .Values.agents.grafanaApiKeySecret .Values.agents.grafanaApiKeyExternalSecret.enabled }}
# Env-side Grafana Editor service-account tokens for agent pods.
# One k8s Secret (`grafana-api-key`) carrying a per-environment token key
# (token-devel / token-perf / token-prod), each synced from its own AWS
# Secrets Manager entry `gardenio/grafana-api-key/<env>`. These reach the
# an environment Grafana (e.g. grafana.example.com), distinct from the in-cluster
# gardenio Grafana that `gb grafana render` / GRAFANA_URL already covers.
# Design: docs/research/fsm-311-observability-gaps-design.md §1 (task ka-0000002337).
{{- $envs := .Values.agents.grafanaApiKeyExternalSecret.environments | default (list "devel" "perf" "prod") }}
{{- $remoteRefPrefix := .Values.agents.grafanaApiKeyExternalSecret.remoteRefPrefix | default "gardenio/grafana-api-key" }}
{{- $tokenProperty := .Values.agents.grafanaApiKeyExternalSecret.tokenProperty | default "token" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.agents.grafanaApiKeySecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.agents.labels" $ | nindent 4 }}
spec:
  # Category: oauth — env Grafana SA tokens are external-provider API keys,
  # same rotation class as the Mezmo MCP key. Per-component override wins;
  # otherwise the centralized `oauth` bucket applies.
  refreshInterval: {{ .Values.agents.grafanaApiKeyExternalSecret.refreshInterval | default (include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .)) }}
  secretStoreRef:
    kind: {{ .Values.agents.grafanaApiKeyExternalSecret.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.agents.grafanaApiKeyExternalSecret.secretStoreName }}
  target:
    name: {{ .Values.agents.grafanaApiKeySecret }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        {{- range $env := $envs }}
        token-{{ $env }}: '{{ printf "{{ index . \"token-%s\" }}" $env }}'
        {{- end }}
  data:
    {{- range $env := $envs }}
    - secretKey: token-{{ $env }}
      remoteRef:
        key: {{ printf "%s/%s" $remoteRefPrefix $env | quote }}
        property: {{ $tokenProperty | quote }}
    {{- end }}
{{- end }}

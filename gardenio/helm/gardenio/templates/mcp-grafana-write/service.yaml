{{- if .Values.mcpGrafanaWrite.enabled }}
# ClusterIP Service for the write-capable mcp-grafana instance (ka-0000000293).
# Reached IN-CLUSTER by the gardenio-assistant-app plugin backend at
# http://{{ include "gardenio.mcpGrafanaWrite.fullname" . }}:{{ .Values.mcpGrafanaWrite.service.port }}{{ .Values.mcpGrafanaWrite.endpointPath }}
# (jsonData.mcpUpstreamURL on the assistant plugin). NOT exposed via IngressRoute,
# and NOT reachable by agents (NetworkPolicy mcp-grafana-write-ingress allows the
# grafana pod ONLY) — so the chat box's write surface never leaves the cluster
# and the agent read-only contract (mcp-grafana sidecar) is untouched.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.mcpGrafanaWrite.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.mcpGrafanaWrite.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpGrafanaWrite.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.mcpGrafanaWrite.service.port | default 8000 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gardenio.mcpGrafanaWrite.selectorLabels" . | nindent 4 }}
{{- end }}

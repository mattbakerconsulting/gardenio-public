{{- if .Values.mcpGrafana.enabled }}
# ClusterIP Service for the standalone mcp-grafana server (A1, ka-0000004361).
# Agents reach it in-cluster at
# http://{{ include "gardenio.mcpGrafana.fullname" . }}:{{ .Values.mcpGrafana.service.port }}{{ .Values.mcpGrafana.endpointPath }}
# (the URL the A3 claude-mcp config bead points at). Not exposed via IngressRoute.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.mcpGrafana.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.mcpGrafana.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mcpGrafana.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.mcpGrafana.service.port | default 8000 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gardenio.mcpGrafana.selectorLabels" . | nindent 4 }}
{{- end }}

    regex: {{ printf "^https?://%s(/.*)?$" $legacyHost | quote }}
    replacement: {{ printf "https://%s%s${1}" $unifiedHost $jiraPath | quote }}
    permanent: true
{{- end }}

{{- end }}{{- /* end legacyRedirects */ -}}
{{- end }}{{- /* end traefik.ingressRoutes.enabled && unifiedHost.enabled */ -}}

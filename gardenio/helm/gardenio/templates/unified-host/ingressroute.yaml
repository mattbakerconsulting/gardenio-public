    app.kubernetes.io/component: unified-host
spec:
  redirectRegex:
    regex: {{ printf "^https?://%s(/.*)?$" $legacyHost | quote }}
    replacement: {{ printf "https://%s%s${1}" $unifiedHost $muxPath | quote }}
    permanent: true
{{- end }}

{{- if and $jiraEnabled (not (has "jira" $excludeRedirects)) .Values.jiraBridge.webhook.enabled .Values.jiraBridge.webhook.host }}
{{- $legacyHost := .Values.jiraBridge.webhook.host }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-jira-bridge-unified-redirect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: unified-host

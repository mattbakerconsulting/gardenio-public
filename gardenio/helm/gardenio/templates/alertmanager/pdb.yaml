{{- if and .Values.alertmanager.enabled .Values.alertmanager.pdb.enabled (gt (int .Values.alertmanager.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gardenio.alertmanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.alertmanager.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.alertmanager.pdb.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "gardenio.alertmanager.selectorLabels" . | nindent 6 }}
{{- end }}

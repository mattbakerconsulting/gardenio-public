{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.alertmanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.alertmanager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.alertmanager.service.port | default 9093 }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.alertmanager.selectorLabels" . | nindent 4 }}
{{- end }}

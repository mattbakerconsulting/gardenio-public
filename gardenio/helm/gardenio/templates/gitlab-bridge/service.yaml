{{- if .Values.gitlabBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-gitlab-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: gitlab-bridge
spec:
  type: {{ .Values.gitlabBridge.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.gitlabBridge.service.port | default 8092 }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9092
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gitlab-bridge
{{- end }}

{{- if and .Values.traefikLogShipper.enabled .Values.traefikLogShipper.asnTable.data }}
{{- /*
traefik-log-shipper ASN table ConfigMap (edge IDP L1 enrichment, task
ka-0000001136; ASN mechanism ka-0000003626).

Holds the operator-provided-per-env CIDR->ASN table (the offline ip2asn form) the
shipper resolves each edge row's X-Forwarded-For client IP against to emit the
scalar sourceASN field the L2 novel-ASN detections group by. Rendered ONLY when
traefikLogShipper.asnTable.data is non-empty, so the default deploy carries no ASN
config and the shipper runs in its byte-identical RAW form (no client_ip/
sourceASN). The mechanism ships in the chart; the table is mounted per env
overlay.

The deployment mounts this at /etc/traefik-log-shipper/asn/ and passes the file
path via TRAEFIK_ASN_TABLE_PATH; a malformed table fails the shipper fast at
startup (auditxform.ParseASNTable names the bad line) rather than silently
shipping without ASNs — a detective control must not degrade to a blind spot
silently.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gardenio.traefikLogShipper.fullname" . }}-asn-table
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.traefikLogShipper.labels" . | nindent 4 }}
data:
  asn-table.txt: |
    {{- .Values.traefikLogShipper.asnTable.data | nindent 4 }}
{{- end }}

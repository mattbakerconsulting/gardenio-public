{{- if and .Values.agents.metrics.prometheusRule.landsSLO.enabled .Values.agents.metrics.prometheusRule.landsSLO.prometheusRule }}
{{- $cfg := .Values.agents.metrics.prometheusRule.landsSLO }}
# PrometheusRule for the Lands SLOs (Track B spec §5.8, step 10.8,
# gd-rqtbyqCMZJ): SLI recording rules and multi-window burn-rate alerts, one
# pair per objective in landsSLO.objectives. The rules live in
# templates/_lands-slo.tpl; the same define renders the vmalert ConfigMap key
# lands-slo.yaml, which is the path that fires where no VMAlert evaluates
# this CRD.
#
# Off by default, like the other rules; per-env overlays opt in. The probe
# SLIs need vmagent.uptimeProbeScrape (the off-cluster prober's metrics file).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "gardenio.fullname" . }}-lands-slo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    {{- with $cfg.prometheusRuleSelectorLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- include "gardenio.landsSLO.groups" . | nindent 4 }}
{{- end }}

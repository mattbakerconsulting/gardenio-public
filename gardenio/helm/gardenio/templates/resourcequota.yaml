{{- /*
ResourceQuota for the gardenio namespace (F1, namespace-isolation audit).

Caps total pods, CPU/memory requests, PVCs, services, and secrets per
namespace so a runaway controller or compromised agent cannot saturate
the cluster. See gardenio/docs/audits/namespace-isolation-static.md §F1.

Defaults are sized for the parent gardenio namespace (controller +
beads + postgres + NATS + coopmux + bridges + a healthy fleet of agent
pods). Override via .Values.resourceQuota.hard for tighter or looser
caps; disable entirely with .Values.resourceQuota.enabled=false on
clusters that already enforce quotas via an external admission policy.

Fleet (child) namespaces get an analogous quota stamped by
createFleetNamespace in gardenio/controller/cmd/gb/fleet.go.
*/ -}}
{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "gardenio.fullname" . }}-quota
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml .Values.resourceQuota.hard | nindent 4 }}
{{- end }}

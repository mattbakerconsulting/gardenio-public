{{- /*
  WHY maxUnavailable, NOT minAvailable (ka-0000001453, gd-27vcHmrurh): on a
  1-replica Deployment minAvailable:1 == maxUnavailable:0, which makes the
  eviction API refuse the pod forever — a managed-nodegroup drain then hits
  PodEvictionFailure and wedges. maxUnavailable:1 only blocks eviction while
  the pod is currently unhealthy, so it is a safe drain guard at
  replicaCount=1 and upgrades to real quorum protection past 1. Renders
  unconditionally — see templates/pdb-singletons.yaml.
*/}}
{{- if and .Values.beadsViewer.enabled .Values.beadsViewer.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gardenio.fullname" . }}-beads-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer
spec:
  maxUnavailable: {{ .Values.beadsViewer.pdb.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "gardenio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beads-viewer
{{- end }}

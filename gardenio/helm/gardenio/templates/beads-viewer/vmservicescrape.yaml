{{/*
VMServiceScrape for gardenio-beads-viewer (view-engagement + request-latency
metrics on the internal-only `metrics` port — ka-0000006752 / epic
ka-0000007629).

Emitted only when `beadsViewer.enabled` and
`monitoring.victoriaMetrics.enabled` are both true. Parallel to the controller
and beads VMServiceScrapes — for clusters running vm-operator
(operator.victoriametrics.com) without prometheus-operator. Scrapes
gardenio_operator_activity_total (the {activity_type=view,surface=web} slice)
and gardenio_user_request_latency_seconds off the metrics service port.
*/}}
{{- if and .Values.beadsViewer.enabled (((.Values.monitoring).victoriaMetrics).enabled) }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ include "gardenio.fullname" . }}-beads-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer
spec:
  selector:
    matchLabels:
      {{- include "gardenio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beads-viewer
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.victoriaMetrics.interval | default "30s" }}
{{- end }}

{{- /*
  Purpose-scoped machine identity for the beads-viewer k8sSA bearer path
  (ka-0000002445 / ka-0000007405). This dedicated `gardenio-audit` ServiceAccount
  exists SOLELY to mint audience-pinned projected SA tokens that new-prod audit
  pods present to beads-viewer as the second verified OIDC issuer
  (beadsViewer.k8sSA). Reusing gardenio-agent would work but widens the blast
  radius; a dedicated SA whose only power is minting its OWN token keeps it tight.

  Its subject (system:serviceaccount:<ns>:gardenio-audit) is the default entry in
  beadsViewer.k8sSA.allowedSubjects.

  DEFAULT OFF: gated on k8sSA.enabled, so an unconfigured deploy renders none of
  this and stays byte-identical (matching the K8S_SA_* env block).
*/}}
{{- if .Values.beadsViewer.k8sSA.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gardenio-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer-audit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gardenio-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer-audit
rules:
  # Mint ONLY its own SA token (TokenRequest subresource). resourceNames scopes
  # the create to the gardenio-audit SA itself — it cannot mint a token for any
  # other ServiceAccount in the namespace. This is the entirety of its power.
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["gardenio-audit"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gardenio-audit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer-audit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gardenio-audit
subjects:
  - kind: ServiceAccount
    name: gardenio-audit
    namespace: {{ .Release.Namespace }}
{{- end }}

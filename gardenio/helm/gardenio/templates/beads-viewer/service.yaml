{{- if .Values.beadsViewer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-beads-viewer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer
spec:
  type: {{ .Values.beadsViewer.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.beadsViewer.service.port | default 8095 }}
      targetPort: http
      protocol: TCP
      name: http
    {{- /* Internal-only metrics port (ka-0000006752). Scraped in-cluster by
           the VMServiceScrape below; never exposed via the public IngressRoute. */}}
    - port: {{ .Values.beadsViewer.metrics.port | default 9095 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer
{{- end }}
{{- /*
  Dedicated internal-NLB LoadBalancer Service for the AWS Verified Access (AVA)
  edge (ka-0000007720 — codifies the ka-0000007004 prod live-patch). ADDITIVE:
  this is a SECOND Service alongside the ClusterIP above; it does NOT convert
  it. The AWS LB Controller provisions an internal NLB from the annotations
  (mirroring the controller edge overlay set) terminating TLS on :443 and
  forwarding plain TCP to the viewer http container port (8095). The AVA
  endpoint's target_load_balancer_arn points at THIS NLB (not the controller
  NLB), so authenticated beads-viewer login reaches the viewer directly.

  Deliberately carries NO external-dns hostname annotation: the public
  beads-viewer.<workload> CNAME is owned by the edge-auth Terraform module
  (CNAME -> AVA endpoint FQDN, auth-gated). AVA reaches this internal NLB by
  ARN, not DNS — a public-host annotation here would double-own that record.
*/}}
{{- if and .Values.beadsViewer.enabled .Values.beadsViewer.edgeService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.fullname" . }}-beads-viewer-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: {{ required "beadsViewer.edgeService.sslCertArn is required when beadsViewer.edgeService.enabled" .Values.beadsViewer.edgeService.sslCertArn | quote }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  ports:
    - port: {{ .Values.beadsViewer.edgeService.port | default 443 }}
      targetPort: http
      protocol: TCP
      name: https
  selector:
    {{- include "gardenio.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: beads-viewer
{{- end }}

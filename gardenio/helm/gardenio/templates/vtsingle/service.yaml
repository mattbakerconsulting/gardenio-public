{{- if .Values.vtsingle.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.vtsingle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vtsingle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 10428
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.vtsingle.otlpGRPC.enabled }}
    - port: 4317
      targetPort: otlp-grpc
      protocol: TCP
      name: otlp-grpc
    {{- end }}
  selector:
    {{- include "gardenio.vtsingle.selectorLabels" . | nindent 4 }}
{{- end }}

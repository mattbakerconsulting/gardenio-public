{{- if .Values.coopmux.landTokens.enabled }}
{{- $name := include "gardenio.coopmux.landTokenKeySecretName" . }}
# HMAC key for tenant lands' coopmux bearers (gd-ApgYe740ps). Generated once
# and preserved across upgrades by the lookup; resource-policy keep so an
# uninstall or a values flip never rotates every land's token at once.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.coopmux.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  key: {{ include "gardenio.inbox.seededValue" (dict "root" . "secretName" $name "key" "key" "len" 64) | b64enc | quote }}
{{- end }}

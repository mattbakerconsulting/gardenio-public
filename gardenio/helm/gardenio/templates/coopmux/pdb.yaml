{{- /*
  WHY maxUnavailable, NOT minAvailable, and unconditional (ka-0000001453,
  gd-27vcHmrurh): on a 1-replica Deployment minAvailable:1 == maxUnavailable:0,
  which makes the eviction API refuse the pod forever — a managed-nodegroup
  drain then hits PodEvictionFailure and wedges. maxUnavailable:1 only blocks
  eviction while the pod is currently unhealthy, so it is safe at
  replicaCount=1 and upgrades to real quorum protection past 1. See
  templates/pdb-singletons.yaml for the canonical version of this reasoning.
*/}}
{{- if and .Values.coopmux.enabled .Values.coopmux.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gardenio.coopmux.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.coopmux.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.coopmux.pdb.maxUnavailable | default 1 }}
  selector:
    matchLabels:
      {{- include "gardenio.coopmux.selectorLabels" . | nindent 6 }}
{{- end }}

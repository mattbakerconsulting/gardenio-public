{{- /*
Per-namespace LimitRange (audit ka-0000005403 §F2).

Mirrors the agent pod compute defaults hard-coded at
gardenio/controller/internal/podmanager/manager.go:53-56 into a
namespace-scoped LimitRange so EVERY pod admitted into this
namespace inherits a default + defaultRequest + max — not only
pods built by podmanager.buildContainer. This closes the gap
where pods admitted via the fleet `gardenio-agent` Role (see
controller/cmd/gb/fleet.go:255-260) had no resource cap at all.

Default profile mirrors the podmanager defaults (2/16Gi request,
4/16Gi limit). Operators can override per-environment via
.Values.limitRange.{default,defaultRequest,max}.
*/ -}}
{{- if .Values.limitRange.enabled -}}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "gardenio.fullname" . }}-defaults
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.limitRange.default.cpu | quote }}
        memory: {{ .Values.limitRange.default.memory | quote }}
      defaultRequest:
        cpu: {{ .Values.limitRange.defaultRequest.cpu | quote }}
        memory: {{ .Values.limitRange.defaultRequest.memory | quote }}
      max:
        cpu: {{ .Values.limitRange.max.cpu | quote }}
        memory: {{ .Values.limitRange.max.memory | quote }}
{{- end }}

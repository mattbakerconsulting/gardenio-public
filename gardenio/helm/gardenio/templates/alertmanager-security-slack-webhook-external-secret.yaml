{{- if and .Values.alertmanager.enabled .Values.alertmanager.securityRoute.enabled .Values.alertmanager.securityRoute.slack.secretName .Values.externalSecrets.enabled .Values.externalSecrets.alertmanagerSecuritySlackWebhook.remoteRef }}
# Dedicated SECURITY-channel Slack incoming-webhook URL for the EKS
# intrusion-detection alert route (ka-0000002447, epic ka-0000004743). A Slack
# incoming webhook is channel-locked to the channel it was minted against, so
# delivering the intrusion pack (subsystem="intrusion-detection") to a genuinely
# separate security channel — isolated from the #gardenio-alerts ops firehose —
# needs a SECOND webhook. One K8s Secret (key = securityRoute.slack.secretKey,
# default "url") synced from AWS Secrets Manager, mirroring the ops
# alertmanager-slack-webhook ExternalSecret shape. Consumed by the Alertmanager
# Deployment as a mounted FILE, referenced by the slack-security-warn /
# slack-security-page receivers via api_url_file — the webhook URL never lands in
# the rendered config ConfigMap.
#
# Gated on alertmanager.enabled + securityRoute.enabled + a non-empty
# securityRoute.slack.secretName + externalSecrets.enabled + a non-empty
# remoteRef. The ESO provider role can READ but not CreateSecret in AWS SM, so an
# operator seeds the SM entry once before flipping this on. Break-glass path: seed
# the K8s Secret out-of-band and leave the remoteRef empty. When
# securityRoute.slack.secretName is empty entirely, the security receivers fall
# back to the global ops webhook + a best-effort channel override (see
# alertmanager.securityRoute in values.yaml) and this ExternalSecret is skipped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.alertmanager.securityRoute.slack.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.alertmanager.labels" . | nindent 4 }}
spec:
  # Category: oauth — a Slack incoming-webhook URL is an external-provider
  # credential, same rotation class as the other bridge tokens.
  refreshInterval: {{ include "gardenio.externalSecrets.refreshInterval" (dict "category" "oauth" "root" .) }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreKind | default "ClusterSecretStore" }}
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.alertmanager.securityRoute.slack.secretName }}
    creationPolicy: Owner
    template:
      type: Opaque
      metadata: {}
      data:
        {{ .Values.alertmanager.securityRoute.slack.secretKey | default "url" }}: '{{`{{ .url }}`}}'
  data:
    - secretKey: url
      remoteRef:
        key: {{ .Values.externalSecrets.alertmanagerSecuritySlackWebhook.remoteRef | quote }}
        {{- if .Values.externalSecrets.alertmanagerSecuritySlackWebhook.property }}
        property: {{ .Values.externalSecrets.alertmanagerSecuritySlackWebhook.property | quote }}
        {{- end }}
{{- end }}

{{- if and (eq (include "gardenio.traefik.ingressRoutesEnabled" .) "true") .Values.webhooksEdgeCatchall.enabled }}
{{- $fullname := include "gardenio.fullname" . -}}
{{- $cfg := .Values.webhooksEdgeCatchall -}}
{{- $eps := $cfg.entryPoints | default (list "webhooks") -}}
{{- if not $eps }}
{{- fail "webhooksEdgeCatchall.enabled is true but webhooksEdgeCatchall.entryPoints is empty: set the public entrypoint the catch-all must close (default [\"webhooks\"])." }}
{{- end }}
# ── Webhooks-edge default-host catch-all → immediate close ────────────────────
# task ka-0000007813, epic ka-0000000572 — scanner-response block+alert policy.
# OPERATOR DECISION ka-0000001217 = alert_plus_catchall (Option B).
#
# The public `webhooks` entrypoint is a CONTAINMENT WALL. Today every off-apex
# request (a bare-IP Host, a scanner probe) matches NO Traefik router and dies
# with a bare 404 (re-verified live 2026-08-14: 441/441 off-apex reqs → 404, 0
# with RouterName). This catch-all ACTIVELY closes that noise floor: a lowest-
# priority HostRegexp(`^.+$`) route on the webhooks entrypoint(s) whose only
# middleware is an ipAllowList with an UNMATCHABLE sourceRange, so every request
# reaching it is refused with `rejectStatusCode` (default 444 — nginx's silent
# connection-close code) BEFORE any backend is touched.
#
# ALLOWLIST-FIRST BY CONSTRUCTION — it keys on "Host header matched no real
# router", NEVER on source IP. The real gitlab-bridge / jira-bridge / litellm
# routers are Host(`…`) matches at priority ≥90; this route is priority 1, so a
# legitimate webhook Host ALWAYS wins and is never touched. There is no source
# CIDR to get wrong, so it cannot reach a legit shared-egress webhook range
# (contrast a fail2ban / SG denylist — research doc ka-0000001921 Q2/Q3).
#
# Scope: the webhooks entrypoint ONLY. It never lists web/websecure, so the
# AVA-gated apex is untouched by construction (do NOT add web/websecure here).
#
# Off by default: byte-identical chart until an overlay opts in (AVA-transport
# dark-ship pattern, MR !7100). ROLLBACK = set webhooksEdgeCatchall.enabled=false
# + redeploy; the route disappears and the bare-404 wall returns instantly.
#
# COUPLING WITH THE BREACH ALERT (ka-0000001162, EdgeContainmentBreach): once
# this route is live it SETS RouterName and returns a non-404 on every off-apex
# request — which would otherwise trip the inverse breach rule on every scanner
# probe (the background-radiation page the brief forbids). templates/vmalert-logs
# /configmap.yaml therefore EXCLUDES this sanctioned catch-all router from the
# breach rule, but ONLY when this catch-all is enabled — so the two ship together
# and the alert still fires for any OTHER off-apex router or non-(404|closeStatus)
# status. The exclusion keys on the IngressRoute name below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullname }}-webhooks-catchall-close
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhooks-catchall
spec:
  ipAllowList:
    # UNMATCHABLE range: 192.0.2.0/24 is TEST-NET-1 (RFC 5737, reserved for
    # documentation, never routed) so no real client can fall inside it. Every
    # request reaching this middleware is therefore refused. A /32 host route is
    # deliberately avoided so the range reads unambiguously as "no real client".
    sourceRange:
      {{- toYaml ($cfg.sourceRange | default (list "192.0.2.0/24")) | nindent 6 }}
    # Status returned to the refused (i.e. every) caller. Default 444 = immediate
    # connection close with no response body (nginx convention); a scanner learns
    # nothing. Set to 403/404 if a visible code is preferred.
    rejectStatusCode: {{ $cfg.closeStatus | default 444 }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  # The router name below appears in the Traefik access log RouterName as
  # `<entrypoint>-<namespace>-<this-name>-<hash>@kubernetescrd`; the breach-rule
  # exclusion in templates/vmalert-logs/configmap.yaml keys on this stable
  # substring. If you rename this resource, update webhooksEdgeCatchall
  # .breachRouterMatch below to match.
  name: {{ $fullname }}-webhooks-catchall
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhooks-catchall
spec:
  entryPoints:
    {{- range $eps }}
    - {{ . }}
    {{- end }}
  routes:
    # Lowest priority: every REAL webhook Host router (gitlab-bridge/jira-bridge
    # at priority 100, litellm at 90) outranks this, so only Hosts that match no
    # real router fall through here and get closed.
    - match: HostRegexp(`^.+$`)
      kind: Rule
      priority: 1
      services:
        - name: noop@internal
          kind: TraefikService
      middlewares:
        - name: {{ $fullname }}-webhooks-catchall-close
  {{- if .Values.tls.enabled }}
  tls:
    secretName: {{ include "gardenio.tls.secretName" . }}
    {{- if .Values.tls.optionName }}
    options:
      name: {{ .Values.tls.optionName }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- end }}
{{- end }}

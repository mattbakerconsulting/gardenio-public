{{- if and (eq (include "gardenio.traefik.ingressRoutesEnabled" .) "true") .Values.keycloak.enabled .Values.keycloak.forwardAuth.enabled .Values.keycloak.forwardAuth.ingress.enabled }}
{{- $fullname := include "gardenio.fullname" . -}}
# ── OAuth2 Proxy callback IngressRoute ────────────────────────────────────────
# Exposes /oauth2/ paths for the OIDC callback and sign-out flows.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}-forwardauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: forwardauth
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`{{ .Values.keycloak.forwardAuth.ingress.host }}`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: {{ $fullname }}-forwardauth
          port: 4180
      {{- if .Values.global.securityHeaders.enabled }}
      middlewares:
        {{- include "gardenio.edgeMiddlewares" . | nindent 8 }}
        - name: {{ $fullname }}-security-headers
      {{- end }}
  {{- if .Values.tls.enabled }}
  tls:
    secretName: {{ include "gardenio.tls.secretName" . }}
    {{- if .Values.tls.optionName }}
    options:
      name: {{ .Values.tls.optionName }}
      namespace: {{ .Release.Namespace }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if and .Values.keycloak.enabled .Values.keycloak.forwardAuth.enabled (eq .Values.keycloak.forwardAuth.sessionStore.type "redis") .Values.keycloak.forwardAuth.sessionStore.redis.deploy.enabled }}
{{- /*
ClusterIP Service for the oauth2-proxy session-store Redis (gd-C2Sl6ClxAY).
Never edge-exposed; only oauth2-proxy pods reach it (NetworkPolicy).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.forwardAuth.redis.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.forwardAuth.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.keycloak.forwardAuth.sessionStore.redis.port | default 6379 }}
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "gardenio.forwardAuth.redis.selectorLabels" . | nindent 4 }}
{{- end }}

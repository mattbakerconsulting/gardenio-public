{{- /*
oauth2-proxy session-store guard (gd-C2Sl6ClxAY). type must be cookie or redis,
and redis needs somewhere to connect: the in-chart Redis (deploy.enabled) or an
explicit managed endpoint (redis.host).
*/}}
{{- if and .Values.keycloak.enabled .Values.keycloak.forwardAuth.enabled }}
{{- $ss := .Values.keycloak.forwardAuth.sessionStore }}
{{- if not (has $ss.type (list "cookie" "redis")) }}
{{- fail (printf "keycloak.forwardAuth.sessionStore.type must be \"cookie\" or \"redis\" (got %q)." $ss.type) }}
{{- end }}
{{- if and (eq $ss.type "redis") (not $ss.redis.deploy.enabled) (not $ss.redis.host) }}
{{- fail "keycloak.forwardAuth.sessionStore.type=redis but no Redis endpoint: set sessionStore.redis.deploy.enabled=true for the in-chart Redis, OR set sessionStore.redis.host to a managed endpoint. See gd-C2Sl6ClxAY." }}
{{- end }}
{{- end }}

{{- /*
G2 (ka-0000003741): chart-managed forwardauth + edge-auth HMAC Secrets for the
in-box profile.

The cloud path sources these via ExternalSecrets (templates/external-secrets.yaml
+ templates/edge-auth/externalsecret.yaml). In-box (externalSecrets.enabled=false)
there is no AWS Secrets Manager / ESO backing store, so before this template the
chart fail-closed: oauth2-proxy needs gardenio-forwardauth-secrets
(client-secret + cookie-secret) and the edge-auth shim needs gardenio-edge-auth-hmac
(hmac-key); both were created by hand on the box.

Own them directly here, exactly like templates/postgres/credentials.yaml and the
keycloak-runtime admin Secret: lookup-then-randAlphaNum (value preserved across
`helm upgrade` via the gardenio.inbox.seededValue helper) + helm.sh/resource-policy:
keep so the value survives `helm uninstall`.

Closing the loop: in-box the chart's KeycloakClient CR
(templates/keycloak/clients.yaml) references
`$gardenio-forwardauth-secrets:client-secret`, so the EDP operator configures the
SAME generated value on the Keycloak client — the oauth2-proxy <-> realm secret
matches with no hand-step.

Gated OFF whenever ExternalSecrets owns the value (selfSeedSecrets gate) or the
operator supplied their own Secret out-of-band (edgeAuth.hmacKey.secretName).
*/ -}}
{{- if eq (include "gardenio.inbox.selfSeedSecrets" .) "true" -}}
{{- if and .Values.keycloak.enabled .Values.keycloak.forwardAuth.enabled .Values.keycloak.forwardAuth.clientSecretRef.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.forwardAuth.clientSecretRef.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: forwardauth
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # OAuth client secret shared with the Keycloak gardenio-traefik-forwardauth client.
  {{ .Values.keycloak.forwardAuth.clientSecretRef.key }}: {{ include "gardenio.inbox.seededValue" (dict "root" . "secretName" .Values.keycloak.forwardAuth.clientSecretRef.name "key" .Values.keycloak.forwardAuth.clientSecretRef.key "len" 48) | b64enc | quote }}
  # oauth2-proxy cookie encryption key. MUST be 16/24/32 bytes — 32 chars = 32 bytes.
  {{ .Values.keycloak.forwardAuth.cookieSecretRef.key }}: {{ include "gardenio.inbox.seededValue" (dict "root" . "secretName" .Values.keycloak.forwardAuth.clientSecretRef.name "key" .Values.keycloak.forwardAuth.cookieSecretRef.key "len" 32) | b64enc | quote }}
{{- end }}
{{- if and .Values.edgeAuth.enabled (not .Values.edgeAuth.hmacKey.secretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.edgeAuth.hmacSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.edgeAuth.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # HMAC signing key — the trust boundary between the edge-auth shim and the
  # downstream daemons (X-Operator / X-Edge-Auth-Sig envelope). 48 chars.
  {{ .Values.edgeAuth.hmacKey.secretKey | default "hmac-key" }}: {{ include "gardenio.inbox.seededValue" (dict "root" . "secretName" (include "gardenio.edgeAuth.hmacSecretName" .) "key" (.Values.edgeAuth.hmacKey.secretKey | default "hmac-key") "len" 48) | b64enc | quote }}
  {{- with .Values.edgeAuth.hmacKey.secretKeyV2 }}
  # Split v2 envelope key (gd-h2tQrOwjGJ): signs/verifies the role-bearing v2
  # envelope only. Never mounted into beads-viewer. 48 chars.
  {{ . }}: {{ include "gardenio.inbox.seededValue" (dict "root" $ "secretName" (include "gardenio.edgeAuth.hmacSecretName" $) "key" . "len" 48) | b64enc | quote }}
  {{- end }}
  {{- with .Values.edgeAuth.hmacKey.secretKeyRelay }}
  # Glass relay key (gd-9ZGh01W5ub): beads-viewer signs, only coopmux verifies,
  # only on the /ws watch upgrade. Never mounted into beads. 48 chars.
  {{ . }}: {{ include "gardenio.inbox.seededValue" (dict "root" $ "secretName" (include "gardenio.edgeAuth.hmacSecretName" $) "key" . "len" 48) | b64enc | quote }}
  {{- end }}
{{- else if and .Values.edgeAuth.hmacKey.secretKeyRelay (not .Values.edgeAuth.hmacKey.secretName) }}
---
{{- /* Relay-only (ruling gd-P2Ybp03DPh): edge-auth is off, so the Secret
       carries the Glass relay key alone. No shim signs anything, so there is
       no hmac-key or hmac-key-v2 to seed; turning edge-auth on later adds
       them to this same Secret and the lookup keeps the relay key. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gardenio.edgeAuth.hmacSecretName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.edgeAuth.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Glass relay key (gd-9ZGh01W5ub): beads-viewer signs, only coopmux verifies,
  # only on the /ws watch upgrade. Never mounted into beads. 48 chars.
  {{ .Values.edgeAuth.hmacKey.secretKeyRelay }}: {{ include "gardenio.inbox.seededValue" (dict "root" . "secretName" (include "gardenio.edgeAuth.hmacSecretName" .) "key" .Values.edgeAuth.hmacKey.secretKeyRelay "len" 48) | b64enc | quote }}
{{- end }}
{{- end }}

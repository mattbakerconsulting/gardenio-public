{{- if and .Values.keycloak.enabled .Values.keycloak.forwardAuth.enabled .Values.keycloak.forwardAuth.podDisruptionBudget.enabled }}
{{- $fullname := include "gardenio.fullname" . -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-forwardauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.labels" . | nindent 4 }}
    app.kubernetes.io/component: forwardauth
spec:
  minAvailable: {{ .Values.keycloak.forwardAuth.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-forwardauth
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

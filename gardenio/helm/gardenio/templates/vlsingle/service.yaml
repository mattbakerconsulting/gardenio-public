{{- if .Values.vlsingle.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gardenio.vlsingle.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gardenio.vlsingle.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9428
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "gardenio.vlsingle.selectorLabels" . | nindent 4 }}
{{- end }}

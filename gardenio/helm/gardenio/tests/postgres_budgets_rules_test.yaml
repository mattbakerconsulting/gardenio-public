# rule_files is rewritten at runtime by TestPostgresBudgets_Fire
# (postgres_budgets_test.go): the placeholder becomes the rendered
# postgres-budgets.yaml key of the vmalert ConfigMap, at the chart defaults.
#
# gd-ylgk1jBhLi. One case per budget, each with a breach that fires and a
# near miss that stays quiet. Series carry component="postgres", as the
# exporter's scrape relabelling gives them.
rule_files:
  - __RULES_FILE__

evaluation_interval: 1m

tests:
  # a. q1 runs 20 s of every 62 s of exec time (32%): fires once `for: 15m`
  # has passed. pg_dump's COPY is 65% but excluded; q2 is 3%.
  - name: query_share_fires_for_the_dominant_statement
    interval: 1m
    input_series:
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="beads",queryid="1",query="SELECT a"}'
        values: '0+20x60'
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="beads",queryid="2",query="SELECT b"}'
        values: '0+2x60'
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="beads",queryid="3",query="COPY public.events (id) TO stdout"}'
        values: '0+40x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresQueryDominatesExecTime
        exp_alerts: []
      - eval_time: 20m
        alertname: PostgresQueryDominatesExecTime
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: query-share
              datname: beads
              queryid: "1"
              query: SELECT a

  # a. One statement is all of an idle database's 30 s an hour: under the
  # 60 s floor, quiet.
  - name: query_share_quiet_on_an_idle_database
    interval: 1m
    input_series:
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="beads",queryid="1",query="SELECT a"}'
        values: '0+0.5x90'
    alert_rule_test:
      - eval_time: 80m
        alertname: PostgresQueryDominatesExecTime
        exp_alerts: []

  # b. q1: 1.5 s a call, 120 calls an hour, fires. q2 is as slow but runs 60
  # times an hour; q3 runs often but takes 0.1 s.
  - name: slow_frequent_query_fires
    interval: 1m
    input_series:
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="litellm",queryid="1",query="SELECT tags"}'
        values: '0+3x120'
      - series: 'pg_top_statements_calls{component="postgres",datname="litellm",queryid="1",query="SELECT tags"}'
        values: '0+2x120'
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="litellm",queryid="2",query="SELECT rare"}'
        values: '0+1.5x120'
      - series: 'pg_top_statements_calls{component="postgres",datname="litellm",queryid="2",query="SELECT rare"}'
        values: '0+1x120'
      - series: 'pg_top_statements_exec_seconds{component="postgres",datname="beads",queryid="3",query="SELECT fast"}'
        values: '0+10x120'
      - series: 'pg_top_statements_calls{component="postgres",datname="beads",queryid="3",query="SELECT fast"}'
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 90m
        alertname: PostgresSlowFrequentQuery
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: slow-query
              datname: litellm
              queryid: "1"
              query: SELECT tags

  # c. A 45 s kbeads-server query fires after `for: 1m`; a 10-minute backup
  # dump and a 20 s query do not.
  - name: long_active_query_fires_except_for_backups
    interval: 1m
    input_series:
      - series: 'pg_activity_max_query_age_seconds{component="postgres",datname="beads",application_name="kbeads-server",state="active",wait_event_type="none"}'
        values: '45x10'
      - series: 'pg_activity_max_query_age_seconds{component="postgres",datname="beads",application_name="gardenio-backup",state="active",wait_event_type="IO"}'
        values: '600x10'
      - series: 'pg_activity_max_query_age_seconds{component="postgres",datname="litellm",application_name="litellm",state="active",wait_event_type="none"}'
        values: '20x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: PostgresLongActiveQuery
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: long-query
              datname: beads
              application_name: kbeads-server

  # c. Four copies of queryid 7 across two callers fire; three of queryid 8 do
  # not.
  - name: pile_up_fires_above_three_copies
    interval: 1m
    input_series:
      - series: 'pg_active_statements_backends{component="postgres",datname="litellm",queryid="7",application_name="litellm"}'
        values: '2x10'
      - series: 'pg_active_statements_backends{component="postgres",datname="litellm",queryid="7",application_name="gardenio-controller"}'
        values: '2x10'
      - series: 'pg_active_statements_backends{component="postgres",datname="beads",queryid="8",application_name="kbeads-server"}'
        values: '3x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: PostgresQueryPileUp
        exp_alerts: []
      - eval_time: 4m
        alertname: PostgresQueryPileUp
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: pile-up
              datname: litellm
              queryid: "7"

  # d. One sample every 2 m, 720 steps a day. events grows 600 MB a day
  # (> 500 MiB) and history 30% of 200 MB: both fire. tiny doubles but stays
  # under 100 MiB; labels grows 10% (100 MB): quiet. Before a day of history
  # nothing is judged.
  - name: table_growth_fires_on_bytes_or_ratio
    interval: 2m
    input_series:
      - series: 'pg_top_tables_total_bytes{component="postgres",datname="beads",schemaname="public",relname="events"}'
        values: '3000000000+833333x800'
      - series: 'pg_top_tables_total_bytes{component="postgres",datname="beads",schemaname="public",relname="history"}'
        values: '200000000+83334x800'
      - series: 'pg_top_tables_total_bytes{component="postgres",datname="beads",schemaname="public",relname="tiny"}'
        values: '10000000+13889x800'
      - series: 'pg_top_tables_total_bytes{component="postgres",datname="beads",schemaname="public",relname="labels"}'
        values: '1000000000+138889x800'
    alert_rule_test:
      - eval_time: 1400m
        alertname: PostgresTableGrowth
        exp_alerts: []
      - eval_time: 1500m
        alertname: PostgresTableGrowth
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: table-growth
              datname: beads
              schemaname: public
              relname: events
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: table-growth
              datname: beads
              schemaname: public
              relname: history

  # e. 950 hits to 100 reads a minute is a 90% hit ratio on beads: fires after
  # `for: 15m`. litellm's worse ratio is not judged.
  - name: beads_cache_hit_low_fires
    interval: 1m
    input_series:
      - series: 'pg_stat_database_blks_hit{component="postgres",datname="beads"}'
        values: '0+950x40'
      - series: 'pg_stat_database_blks_read{component="postgres",datname="beads"}'
        values: '0+100x40'
      - series: 'pg_stat_database_blks_hit{component="postgres",datname="litellm"}'
        values: '0+100x40'
      - series: 'pg_stat_database_blks_read{component="postgres",datname="litellm"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: PostgresBeadsCacheHitLow
        exp_alerts: []
      - eval_time: 30m
        alertname: PostgresBeadsCacheHitLow
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: cache-hit
              datname: beads

  - name: beads_cache_hit_healthy_is_quiet
    interval: 1m
    input_series:
      - series: 'pg_stat_database_blks_hit{component="postgres",datname="beads"}'
        values: '0+990x40'
      - series: 'pg_stat_database_blks_read{component="postgres",datname="beads"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: PostgresBeadsCacheHitLow
        exp_alerts: []

  # f. 1.7 of the node's 2 cores (85%) fires after `for: 30m`.
  - name: cpu_saturating_node_fires
    interval: 1m
    input_series:
      - series: 'pg_cpu_container_usage_seconds{component="postgres"}'
        values: '0+102x60'
      - series: 'pg_cpu_node_seconds{component="postgres"}'
        values: '0+120x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: PostgresCPUSaturatingNode
        exp_alerts: []
      - eval_time: 45m
        alertname: PostgresCPUSaturatingNode
        exp_alerts:
          - exp_labels:
              severity: warn
              component: postgres
              subsystem: postgres-budget
              budget: cpu

  # f. One core of two (50%): quiet.
  - name: cpu_half_the_node_is_quiet
    interval: 1m
    input_series:
      - series: 'pg_cpu_container_usage_seconds{component="postgres"}'
        values: '0+60x60'
      - series: 'pg_cpu_node_seconds{component="postgres"}'
        values: '0+120x60'
    alert_rule_test:
      - eval_time: 45m
        alertname: PostgresCPUSaturatingNode
        exp_alerts: []

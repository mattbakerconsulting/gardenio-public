  # JQL-count metrics exporter (Phase 2, epic ka-0000004505 / task ka-0000006172).
  # The jira-bridge always serves /metrics on :9093; the collector only runs when
  # `queries` below is a non-empty list (rendered into the JIRA_METRICS_QUERIES
  # env as a JSON array). Each entry emits gardenio_jira_issues{query,project}
  # plus gardenio_jira_scrape_duration_seconds{query} and
  # gardenio_jira_scrape_errors_total{query}.
  #
  # Discovery paths:
  #   Path A — in-chart vmagent scrapes via prometheus.io/* pod annotations
  #            (prod gardenio ns, no vm-operator). Requires vmagent.enabled +
  #            the vmagent ingress NetworkPolicy rule (templates/networkpolicies).
  #   Path B — VMServiceScrape (templates/jira-bridge/vmservicescrape.yaml),
  #            gated on monitoring.victoriaMetrics.enabled (operator clusters,
  #            e.g. poc-gardenio-eks). Matches the Service `metrics` port by name.
  metrics:
    # Scrape interval for the VMServiceScrape (Path B). jira-bridge ships only
    # the VMServiceScrape + Path A annotations — no prometheus-operator
    # ServiceMonitor — but the interval key mirrors slack-bridge/controller for
    # consistency.
    serviceMonitor:
      interval: 30s

    # v1 JQL query list (Phase 0 confirmed counts in comments — deployed
    # JIRA_PROJECTS=PE,DEVOPS). Each JQL is scoped to project in (PE,DEVOPS) and
    # uses statusCategory, which is reliable across both projects (no per-project
    # status map needed). `project` becomes the {project} label; "PE,DEVOPS"
    # marks the cross-project scope. `interval` is an optional per-query Go
    # duration override (base cadence is METRICS_INTERVAL, default 120s).
    # incidents_open is intentionally omitted: there is no Incident issuetype on
    # this site, so it would silently report 0.
    queries:
      - name: open_bugs
        help: "Open bugs (issuetype=Bug, not Done) in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND issuetype=Bug AND statusCategory != Done'
        project: "PE,DEVOPS"
      - name: open_bugs_high
        help: "Open High/Highest-priority bugs in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND issuetype=Bug AND statusCategory != Done AND priority in (High,Highest)'
        project: "PE,DEVOPS"
      - name: wip
        help: "Issues in the In Progress status category in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND statusCategory = "In Progress"'
        project: "PE,DEVOPS"
      - name: backlog
        help: "All not-Done issues in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND statusCategory != Done'
        project: "PE,DEVOPS"
      - name: created_7d
        help: "Issues created in the last 7 days in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND created >= -7d'
        project: "PE,DEVOPS"
      - name: resolved_7d
        help: "Issues resolved in the last 7 days in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND resolved >= -7d'
        project: "PE,DEVOPS"
      - name: open_high_priority
        help: "Open High/Highest-priority issues in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND priority in (High,Highest) AND statusCategory != Done'
        project: "PE,DEVOPS"
      - name: reopened_7d
        help: "Issues reopened from Resolved in the last 7 days in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND status CHANGED FROM Resolved AFTER -7d'
        project: "PE,DEVOPS"

    # Per-issue AGE query list (task ka-0000000282 — the grounded SLA-age /
    # age-burn-down lever). Rendered into the JIRA_AGE_QUERIES env as a JSON
    # array; empty disables the age collector so the default deployment is
    # unchanged. Each entry pages its matching OPEN issues (fields=created) and
    # republishes their ages as a SNAPSHOT histogram
    # gardenio_jira_issue_age_seconds{query,project} (buckets 1/3/7/14/30/60/90/
    # 180/365d) plus gardenio_jira_issue_oldest_age_seconds{query,project}. From
    # that single per-issue dataset the dashboard grounds oldest-open age, age
    # p50/p95 (histogram_quantile) and N-day SLA-breach counts
    # (_count - _bucket{le="Nd"}) — none of which is derivable from the
    # approximate-count gauges above.
    #
    # Scope these to BOUNDED open sets: an age scrape pages the whole matching
    # set, so each query costs (matches / 100) requests per cycle. The two
    # shipped queries are ~585 (open bugs) and ~600 (open high-priority)
    # matches, ≈ 6 requests each; at the 600s default cadence that is a small,
    # steady add on top of the 120s count collector's ~8 single-call scrapes.
    # `maxIssues` caps paging as a safety bound; `interval` (Go duration)
    # overrides the base 600s cadence per query.
    ageQueries:
      - name: open_bugs_age
        help: "Age distribution of open bugs (issuetype=Bug, not Done) in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND issuetype=Bug AND statusCategory != Done'
        project: "PE,DEVOPS"
        maxIssues: 2000
      - name: open_high_priority_age
        help: "Age distribution of open High/Highest-priority issues in PE,DEVOPS"
        jql: 'project in (PE,DEVOPS) AND priority in (High,Highest) AND statusCategory != Done'
        project: "PE,DEVOPS"
        maxIssues: 2000

    # PrometheusRule for the trigger cooldown-starvation SYMPTOM detector
    # (Alert B of epic ka-0000005107, task ka-0000000052 — the deferred
    # follow-up to Alert A / MR !5055). The TriggerEngine publishes
    # gardenio_trigger_starved{source,trigger}=1 when a trigger has ONLY
    # cooldown-skipped for longer than its own cooldown can explain while its
    # JQL still matches upstream issues (per-trigger ApproximateCount check,
    # trigger_starve.go). This catches ANY starvation cause — foreign
    # last_checked stampers (the 2026-07-01 outage), clock skew, a future
    # cooldown bypass bug — in ~15m instead of 13h. Off by default; per-env
    # overlays opt in. Requires the monitoring.coreos.com/v1 PrometheusRule CRD.
    prometheusRule:
      triggerStarved:
        enabled: false
        # Alert severity (Alertmanager routing key). page in prod (a starved
        # trigger silently drops fsm-triage / crew spawns), ticket in e2e,
        # none (silenced) in dev.
        severity: "page"
        # `for:` hold before paging. The engine-side detector already
        # requires ~15m of pure cooldown-skips before setting the gauge, so
        # this only rides out scrape gaps and a flapping verdict.
        for: "5m"
        # Optional extra gate: also require this gardenio_jira_issues query
        # (the JQL-count exporter, commit 94a188743) to be non-zero before
        # paging, e.g. "backlog". Empty (default) disables the join — the
        # engine already gates the verdict on the trigger's OWN per-trigger
        # ApproximateCount, and joining on a collector series would silently
        # suppress the page when JIRA_METRICS_QUERIES is unset (no series ⇒
        # `and` never matches). Only set this on envs that run the collector.
        backlogQuery: ""
        # Labels merged onto the PrometheusRule METADATA so the cluster's
        # ruleSelector (e.g. kube-prometheus-stack release label) discovers it.
        prometheusRuleSelectorLabels: {}
        #   release: kube-prometheus-stack
        # Extra labels merged into the alert (route to a specific oncall).
        labels: {}
        # Extra annotations merged into the alert.
        annotations: {}

      # PrometheusRule for the INGESTION-POLLER stall prevention alert (epic
      # ka-0000005107 deliverable #4, task ka-0000001629). Where triggerStarved
      # above guards the TRIGGER path, this guards the ingestion poll() path —
      # the loop that materializes matching JIRA issues into source beads. The
      # poller Go-computes gardenio_jira_poller_stalled=1 when a poll cycle's JQL
      # search returned ZERO rows while an independent approximate-count of the
      # same ingestion JQL still reports matching issues upstream (i.e. polled,
      # 0 new beads, yet matches exist — the faithful, fireable rendering of the
      # bead Signal; the literal ApproximateCount>tracked comparison is
      # unfireable because tracked includes closed beads). Renders two alerts:
      # JiraPollerStalled (materialization blind-spot) and JiraPollerDeadman
      # (poll loop not ticking at all). Off by default; per-env overlays opt in.
      # Requires the monitoring.coreos.com/v1 PrometheusRule CRD.
      pollerStall:
        enabled: false
        # Alert severity (Alertmanager routing key). page in prod (a stalled
        # poller silently stops ingesting JIRA work), ticket in e2e, none
        # (silenced) in dev.
        severity: "page"
        # Lookback window for the stall gauge's max_over_time. Together with
        # `for` this encodes the bead's "N > threshold minutes" — the stall must
        # persist across the window+hold before paging. A single flapping scrape
        # inside the window keeps the alert asserted (max_over_time==1) so a
        # brief self-heal does not clear it prematurely.
        window: "15m"
        # `for:` hold before the stall alert pages. Rides out scrape gaps and a
        # transient single-cycle blip.
        for: "10m"
        # Lookback for the deadman leg: if gardenio_jira_poller_polls_total has
        # not increased over this window (or the series is absent), the poll
        # loop is not ticking at all. Should comfortably exceed the poll
        # interval (default 60s) so a normal cadence never trips it.
        deadmanWindow: "15m"
        # `for:` hold before the deadman leg pages.
        deadmanFor: "10m"
        # Labels merged onto the PrometheusRule METADATA so the cluster's
        # ruleSelector (e.g. kube-prometheus-stack release label) discovers it.
        prometheusRuleSelectorLabels: {}
        #   release: kube-prometheus-stack
        # Extra labels merged into both alerts (route to a specific oncall).
        labels: {}
        # Extra annotations merged into both alerts.
        annotations: {}

      # PrometheusRule for the JQL-count collector's JIRA RATE-LIMIT recovery
      # monitor (task ka-0000002481, tuning ka-0000005655). The collector
      # (jira_metrics.go) already detects an HTTP 429 and backs off, but that
      # was invisible: 429s folded into gardenio_jira_scrape_errors_total with
      # every other error, and NOTHING marked when Jira's cooldown expired and
      # normal throughput resumed. The collector now Go-computes the rate-limit
      # lifecycle into dedicated series on the jira-bridge :9093 /metrics:
      #   gardenio_jira_rate_limited{query} — 1 while a query is in 429 backoff,
      #     0 once it next scrapes cleanly. The 1->0 EDGE is the recovery signal
      #     (cooldown expired, throughput resumed) — this alert clears on it.
      #   gardenio_jira_rate_limit_events_total{query} — 429 onsets (each scrape
      #     that entered backoff); a sustained throttle counts repeatedly.
      #   gardenio_jira_rate_limit_recoveries_total{query} — observed recoveries
      #     (the durable, countable form of the 1->0 edge).
      #   gardenio_jira_rate_limit_backoff_seconds{query} — backoff of the most
      #     recent 429 (Retry-After, or the default fallback).
      # The alert pages while a query stays throttled past the hold and RESOLVES
      # the moment recovery is observed, so the recovery is monitored both as a
      # firing/resolving alert and as scrapeable series. Off by default; per-env
      # overlays opt in. Requires the monitoring.coreos.com/v1 PrometheusRule CRD.
      rateLimitRecovery:
        enabled: false
        # Alert severity (Alertmanager routing key). A stuck-throttled JQL-count
        # query degrades the JIRA backlog dashboards but is not a customer-facing
        # outage, so ticket in prod by default (a persistent throttle is worth a
        # human look but not a page); tune per env.
        severity: "ticket"
        # Lookback window for the rate_limited gauge's max_over_time. Together
        # with `for` this sets how long a query must stay throttled before the
        # alert fires. A single clean scrape inside the window drops the gauge to
        # 0 and the max_over_time clears — that IS the recovery detection.
        window: "15m"
        # `for:` hold before the stuck-throttled alert fires. Rides out a brief
        # single-cycle 429 blip (which self-heals on the next scrape) so only a
        # genuinely sustained throttle pages.
        for: "15m"
        # Labels merged onto the PrometheusRule METADATA so the cluster's
        # ruleSelector (e.g. kube-prometheus-stack release label) discovers it.
        prometheusRuleSelectorLabels: {}
        #   release: kube-prometheus-stack
        # Extra labels merged into the alert (route to a specific oncall).
        labels: {}
        # Extra annotations merged into the alert.
        annotations: {}

      # PrometheusRule for the INBOUND-WEBHOOK deadman alert (bug ka-0000000426,
      # parent epic ka-0000007401). Where pollerStall guards INGESTION and
      # triggerStarved guards TRIGGERS, this guards the third leg — the inbound
      # webhook receive path (@gardenio mentions, follow-up nudges, F3 re-spawn,
      # comment mirroring). The bridge Go-computes gardenio_jira_webhook_dark=1
      # when NO authenticated, well-formed delivery arrived within the deadman
      # window while an independent approximate-count of the webhook JQL scope
      # (project in (PE,DEVOPS) updated in the window) still reports activity —
      # matter existed upstream and we received nothing. Keying "alive" on
      # AUTHENTICATED deliveries makes a wrong-Secret hook (hmac_failed only)
      # page rather than read as healthy; a genuinely quiet upstream (count 0)
      # never pages. Renders two alerts: JiraWebhookDark (receive path dark) and
      # JiraWebhookMonitorDeadman (the monitor itself not evaluating). Off by
      # default; per-env overlays opt in. Requires the monitoring.coreos.com/v1
      # PrometheusRule CRD.
      webhookDeadman:
        enabled: false
        # Alert severity (Alertmanager routing key). page in prod (a dark
        # webhook silently drops the whole conversational surface), ticket in
        # e2e, none (silenced) in dev.
        severity: "page"
        # Lookback window for the dark gauge's max_over_time. Together with `for`
        # this encodes "dark for N minutes" — the dark state must persist across
        # the window+hold before paging. A single flapping scrape inside the
        # window keeps the alert asserted (max_over_time==1) so a brief recovery
        # does not clear it prematurely. Should be >= the monitor's own deadman
        # window (JIRA_WEBHOOK_DEADMAN_WINDOW, default 2h) is NOT required — the
        # monitor already encodes the 2h no-delivery judgement; this window only
        # rides out scrape flapping of the already-computed verdict.
        window: "15m"
        # `for:` hold before the dark alert pages. Rides out scrape gaps and a
        # transient single-cycle blip.
        for: "10m"
        # Lookback for the deadman leg: if gardenio_jira_webhook_evaluations_total
        # has not increased over this window (or the series is absent), the
        # monitor is not evaluating at all. Should comfortably exceed the
        # monitor's evaluation interval (JIRA_WEBHOOK_DEADMAN_INTERVAL, default
        # 5m) so a normal cadence never trips it.
        deadmanWindow: "15m"
        # `for:` hold before the deadman leg pages.
        deadmanFor: "10m"
        # Labels merged onto the PrometheusRule METADATA so the cluster's
        # ruleSelector (e.g. kube-prometheus-stack release label) discovers it.
        prometheusRuleSelectorLabels: {}
        #   release: kube-prometheus-stack
        # Extra labels merged into both alerts (route to a specific oncall).
        labels: {}
        # Extra annotations merged into both alerts.
        annotations: {}

  # State persistence — survives pod restarts, preserves SSE last-event-ID and dedup state.
  # When disabled (default), an emptyDir is used (state lost on restart, CatchUp covers dedup).
  persistence:
    enabled: false
    size: 100Mi
    storageClass: ""

  # Pod scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# GitLab Bridge — standalone beads→GitLab MR merge sync bridge
# Watches GitLab for MR merges (webhook + polling) and updates bead fields.
# Runs independently from the agent controller (separate deployment).
# =============================================================================
# =============================================================================
# Keycloak — OIDC realm via EDP keycloak-operator CRDs
# Creates a KeycloakRealm CR referencing an existing ClusterKeycloak instance.
# Requires the EDP keycloak-operator (v1.32+) to be installed in the cluster.
# =============================================================================
keycloak:
  enabled: true

  # ---------------------------------------------------------------------------
  # In-cluster Keycloak runtime (StatefulSet + Service + ServiceMonitor +
  # Traefik IngressRoute). Default OFF — gated by `runtime.enabled`. When
  # disabled the chart still provisions only the realm/client/role CRDs against
  # the externally-managed ClusterKeycloak (today: ECS). When enabled, this
  # chart also stands up the Keycloak server itself in-cluster and creates a
  # ClusterKeycloak CR pointing at the in-cluster Service.
  #
  # Plan-of-record: gardenio/docs/research/keycloak-in-cluster-from-ecs.md §3.1, §7.
  # A staging env flips this on first; prod stays off until cutover (ka-0000004078).
  #
  # Out of scope of the chart: DB provisioning, cert-manager Issuer, Route53
  # records. The chart consumes a pre-existing DB-credentials Secret and
  # the cluster wildcard TLS secret.
  # ---------------------------------------------------------------------------
  runtime:
    enabled: false
    # Upstream Keycloak image (official Quarkus distribution). Its entrypoint
    # takes the `start` subcommand (args:[start] in the StatefulSet) and matches
    # the EDP keycloak-operator's expectations + kcadm.sh path conventions.
    # (Earlier this pointed at the Bitnami mirror, whose entrypoint rejects a
    # bare `start` subcommand -> "exec: start: not found" -> CrashLoop; see
    # ka-0000006376.) Pulled anonymously and directly from quay.io (the nodes
    # have no mirror for it; the pre-Actions mirror job is gone).
    # 26.7.5 (was 26.0.7): the first 26.x with passkeys + conditional UI is
    # 26.4; the target and the rejected alternatives are in the design doc
    # docs/superpowers/specs/2026-10-18-keycloak-passkeys-login-theme-design.md
    # section 12. The schema migration is forward-only: rolling this tag back
    # needs the pg_dump restore as well.
    # See https://quay.io/repository/keycloak/keycloak?tab=tags
    image:
      repository: keycloak/keycloak
      registry: quay.io
      tag: "26.7.5"
      digest: ""
      pullPolicy: IfNotPresent
    replicas: 1
    # External hostname Traefik routes for. Used as KC_HOSTNAME inside the pod
    # so issuer URLs are rendered correctly. Override per-env in deploy-values.
    host: "auth.gardenio.example.com"
    # Optional browser-facing frontend as a FULL URL incl. the relative path,
    # e.g. "https://auth.example.com/auth". Overrides host for KC_HOSTNAME
    # only (issuer + login pages); host keeps feeding the derived issuer
    # URLs and the IngressRoute. gd-ZbqAlzulHK.
    hostnameUrl: ""
    # KC_HOSTNAME_BACKCHANNEL_DYNAMIC: in-cluster callers reaching Keycloak by
    # its Service name get in-cluster token/jwks/userinfo URLs. Requires
    # hostnameUrl.
    hostnameBackchannelDynamic: false
    # KC_PROXY_HEADERS — Keycloak honours X-Forwarded-* from Traefik.
    proxyHeaders: "xforwarded"
    # KC_HTTP_RELATIVE_PATH — keep "/auth" so issuer URLs match the existing
    # ECS Keycloak's URL shape (https://<host>/auth/realms/<realm>) and the
    # current ForwardAuth/oauth2-proxy/iOS client configurations don't need
    # to change at cutover. Plan-of-record §3.4 / §3.5.
    httpRelativePath: "/auth"
    # Extra start-up args. The StatefulSet always passes "start" (production
    # mode); these are appended after it. Use "--optimized" if you bake an
    # optimized Keycloak image; the stock upstream image works without it.
    extraStartArgs: []

    # Login theme: the tree in gardenio/keycloak-theme/gardenio (OUTSIDE the
    # chart, gd-qiUiXvTX0k: inside it the theme was stored twice in the 1 MiB
    # Helm release Secret). The release deployer applies it as a ConfigMap
    # right before `helm upgrade` (gardenio/scripts/keycloak-theme-configmap.py
    # | kubectl apply); a theme-unpack initContainer rebuilds the tree from the
    # ConfigMap keys ("/" encoded as "__") into an emptyDir mounted read-only
    # at /opt/keycloak/themes/<name>. Dormant by default. Select it per realm
    # with keycloak.realm.themes.loginTheme (kept at "keycloak" until the theme
    # is rolled out). A theme edit restarts the pod via the checksum/theme
    # annotation. `name` is the mount directory and must equal the loginTheme
    # value; the files dir itself is always "gardenio".
    theme:
      enabled: false
      name: gardenio
      # ConfigMap holding the theme files. Empty = "<release>-keycloak-runtime-
      # theme-files", the generator's default for the same release name.
      configMapName: ""
      # checksum/theme on the pod: sha256 over the theme files. Empty = read
      # the gardenio.dev/theme-checksum annotation off the live ConfigMap at
      # upgrade time (lookup), which is how the deployer works; set it only to
      # pin or to test (`helm template` has no cluster to look up).
      checksum: ""

    service:
      type: ClusterIP
      httpPort: 8080
      managementPort: 9000  # Quarkus management interface (health, metrics)
      # https port, served only with tls.enabled below.
      httpsPort: 8443

    # In-cluster TLS (gd-XRsosVFAau). Keycloak also serves https on
    # service.httpsPort with a cert for its Service names (<fullname>,
    # .<ns>, .<ns>.svc, .<ns>.svc.cluster.local), issued by cert-manager from
    # a namespaced CA this chart makes (templates/keycloak-runtime/tls.yaml:
    # a SelfSigned Issuer, a 10y CA Certificate, a CA Issuer, the leaf). The
    # http port stays for Traefik (TLS ends at the edge) and the EDP
    # operator; KC_HOSTNAME is unchanged, so tokens keep the same iss.
    # The Lands provisioner then dials https://<fullname>.<ns>.svc.cluster.
    # local:<httpsPort><httpRelativePath> and trusts the CA (ca.crt only,
    # mounted into the controller). Needs cert-manager's CRDs.
    tls:
      enabled: false
      # The chart's other in-cluster clients move to https too (gd-lYPZlslOM7):
      # every machine-principal token fetch (BEADS_OIDC_TOKEN_URL /
      # KD_OIDC_TOKEN_URL: controller, slack-bridge, grafana-bridge,
      # beads-viewer, trigger-engine, coopmux, release-deployer), the beads
      # daemon's OIDC discovery (BEADS_OIDC_DISCOVERY_URL) and the first-admin
      # kcadm Job. Each mounts ca.crt at caMountPath and trusts it
      # (BEADS_OIDC_CA_FILE / KD_OIDC_CA_FILE; the Job a PKCS#12 truststore),
      # and the http port's NetworkPolicy then admits only Traefik and the EDP
      # operator. Only with enabled above. false = those clients stay on http
      # (the rollback lever if one of them cannot reach the https port).
      inClusterClients: true
      caMountPath: /etc/gardenio/keycloak-runtime-ca

    persistence:
      # Default false: with db.vendor=postgres (the only vendor this chart
      # ever configures — no dev-file/dev-mem H2 path exists), every realm,
      # client and user lives in Postgres, not under /opt/keycloak/data. That
      # directory holds only Keycloak's own transient Quarkus working files,
      # so it's mounted as a plain emptyDir by default: no PVC, no node-bound
      # PV, safe to lose on any node loss (gd-85rqxsPPoM). Set true only for a
      # deploy profile that runs Keycloak against a DB where /opt/keycloak/data
      # genuinely matters (there is no such profile in this chart today).
      enabled: false
      size: 8Gi
      # StorageClass for the Keycloak data PVC (volumeClaimTemplates), only
      # rendered when enabled: true above.
      #
      # SECURITY (encryption-at-rest): if enabled, the Keycloak data volume
      # can hold bootstrap/admin state and cached realm material, so the
      # operator MUST choose a StorageClass backed by ENCRYPTED storage. The
      # chart does NOT enforce this — it is an operator responsibility.
      #
      # NOTE: with shipped defaults this is empty and inherits
      # global.storageClass, which defaults to "gp2" — an UNENCRYPTED EBS class
      # on a stock EKS cluster. Do not assume the default is encrypted.
      #   - AWS/EBS: use a gp3/gp2 StorageClass with `encrypted: "true"` (and a
      #     KMS key) in its parameters, or rely on an account-level EBS
      #     default-encryption policy.
      #   - Other clouds: pick the provider's encrypted-volume StorageClass.
      # Resolution precedence: this value -> global.storageClass -> cluster
      # default StorageClass (only if both are empty).
      storageClass: ""

    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"

    nodeSelector: {}
    tolerations: []
    affinity: {}

    # ---- Database --------------------------------------------------------------
    # Keycloak's Quarkus runtime reads KC_DB_URL/KC_DB_USERNAME/KC_DB_PASSWORD
    # from the environment.
    #
    # Two modes:
    #   (1) autoWire=false (default): all three are projected from a single
    #       pre-provisioned Secret (`existingSecret`). The Secret MUST contain:
    #         - urlKey       (default "url")      e.g. jdbc:postgresql://<rds>:5432/keycloak
    #         - usernameKey  (default "username")
    #         - passwordKey  (default "password")
    #       This is the external-RDS / BYO-Secret path (ka-0000004078 scope).
    #
    #   (2) autoWire=true (in-box profile): when the chart's in-cluster postgres
    #       is enabled (postgres.enabled=true), the StatefulSet derives KC_DB_URL
    #       inline from the in-cluster postgres Service FQDN, sets KC_DB_USERNAME
    #       to the postgres superuser, and projects KC_DB_PASSWORD from the
    #       chart-managed postgres password Secret. No `existingSecret` is
    #       required. An init container creates the `database` (default
    #       "keycloak") on the shared postgres if it does not already exist —
    #       the postgres StatefulSet only bootstraps one POSTGRES_DB, so Keycloak
    #       gets its OWN logical database, NOT the beads DB.
    db:
      vendor: "postgres"
      # autoWire: when true AND postgres.enabled, derive KC_DB_* from the
      # in-cluster postgres Service instead of `existingSecret`. The in-box
      # deploy-values overlay sets this true.
      autoWire: false
      # Logical database Keycloak uses. Only meaningful when autoWire=true
      # (in BYO mode the DB name is encoded inside existingSecret's url).
      # MUST differ from postgres.database (beads' DB) — Keycloak owns its own.
      database: "keycloak"
      # ---- BYO-Secret path (autoWire=false) ----
      existingSecret: "gardenio-keycloak-runtime-db"
      urlKey: "url"
      usernameKey: "username"
      passwordKey: "password"

    # ---- Bootstrap admin user ----------------------------------------------
    # Projected into KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD
    # (upstream Keycloak 26 env names; the legacy KEYCLOAK_ADMIN* vars are
    # deprecated). The realm operator uses *its own* admin credentials via
    # ClusterKeycloak; this is the bootstrap superuser for the Keycloak master
    # realm only, created once on a clean DB.
    admin:
      # When true (default for in-box bring-up), the chart generates the
      # bootstrap-admin Secret named below with a random 32-char password,
      # stable across upgrades (helm.sh/resource-policy: keep + lookup).
      # Set false to supply `existingSecret` out-of-band.
      generate: true
      existingSecret: "gardenio-keycloak-runtime-admin"
      # Bootstrap admin username written into the generated Secret. Only used
      # when generate=true; ignored when supplying the Secret yourself.
      username: "admin"
      usernameKey: "username"
      passwordKey: "password"

    # ---- Service monitoring -------------------------------------------------
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s

    # ---- Ingress (Traefik) --------------------------------------------------
    # IngressRoute on the websecure entryPoint. TLS comes from the cluster
    # wildcard secret managed elsewhere (see tls.yaml + cert-manager) — the
    # cert for `auth.gardenio.example.com` is provisioned by a separate
    # task and out of scope here.
    ingress:
      enabled: true

      # ---- Per-IP rate limit on the auth host (research ka-0000004895 §5) ----
      # The Keycloak login endpoint (/realms/<realm>/protocol/openid-connect/auth)
      # has no per-IP rate limit today; only Keycloak's built-in brute-force
      # protection would stand between a public attacker and password guessing —
      # and that brute-force config is NOT expressible through the EDP
      # KeycloakRealm CRD (its spec has no bruteForce/failureFactor field;
      # verified live against the v1.32.0 operator schema, spike ka-0000006878).
      # So a Traefik per-source-IP rateLimit Middleware is the front-line
      # mitigation: it caps request rate at the edge before traffic ever reaches
      # Keycloak. Enabling Keycloak realm brute-force protection in addition
      # requires either a Keycloak admin-API step or a future CRD field and is
      # tracked as a follow-up (it cannot be done from this chart today).
      #
      # Tuned generously so real interactive logins (which fan out to several
      # sub-requests: auth, login-actions, resources) are never throttled, while
      # a credential-stuffing source is bounded. Override per-env as needed.
      rateLimit:
        enabled: true
        # Sustained average requests/sec per source IP (over `period`).
        average: 50
        # Token-bucket burst allowance — short spikes above `average` are OK.
        burst: 100
        # Averaging window for `average` (Go duration: "1s", "1m", ...).
        period: "1m"
        # depth of the X-Forwarded-For header to read the real client IP from
        # (Traefik sourceCriterion.ipStrategy.depth). 1 = the IP the edge LB
        # appended (the true client when a single trusted LB fronts Traefik).
        # 0 = use the direct connection remote IP (no XFF trust).
        ipStrategyDepth: 1

    # ---- ClusterKeycloak CR --------------------------------------------------
    # When runtime.enabled, the chart emits a NEW ClusterKeycloak CR pointing
    # at the in-cluster Service. The realm template's existing
    # `keycloak.realm.clusterKeycloakRef` should be flipped to this CR's name
    # in the per-env deploy-values when the env is ready to cut over (e.g.
    # a staging env first). Until that flip the realm continues to point at
    # whatever ClusterKeycloak CR is currently named.
    clusterKeycloak:
      # Name of the ClusterKeycloak CR to create. Distinct from the existing
      # external ClusterKeycloak CR so both can coexist during cutover.
      name: "gardenio-keycloak-runtime"
      # Reference to a Secret carrying admin user/password the operator uses
      # to talk to the in-cluster Keycloak admin REST API. Same shape as
      # `runtime.admin.*` — typically the same Secret.
      adminSecret: "gardenio-keycloak-runtime-admin"
      adminUserKey: "username"
      adminPasswordKey: "password"
      # Namespace the EDP keycloak-operator runs in. The operator ALWAYS
      # resolves a ClusterKeycloak's `.spec.secret` in its OWN namespace
      # (OPERATOR_NAMESPACE, projected from the operator pod's metadata.namespace
      # — see edp-keycloak-operator MakeKeycloakAuthDataFromClusterKeycloak),
      # NOT in the namespace the KeycloakRealm/ClusterKeycloak CR lives in. The
      # chart-generated admin Secret above lands in .Release.Namespace, so
      # without a copy in the operator's namespace the operator can never
      # authenticate — ClusterKeycloak stays connected:false and the realm /
      # clients are NEVER reconciled (oauth2-proxy then 404s "Realm does not
      # exist" and CrashLoopBackOffs; ka-0000005282). When runtime.enabled and
      # this is set (and differs from .Release.Namespace), the admin-secret
      # template renders a SECOND identical copy into this namespace. Empty =>
      # no copy (cloud path binds the realm to the external ClusterKeycloak whose
      # secret already lives in the operators namespace). Box default:
      # "operators" (bootstrap-ec2.sh OPERATORS_NAMESPACE).
      operatorNamespace: ""
      # Dial the runtime over in-cluster TLS (gd-PhU6jPtSxa). Needs
      # runtime.tls.enabled. The ClusterKeycloak url becomes
      # https://<svc>.<ns>.svc.cluster.local:<httpsPort><httpRelativePath>
      # with spec.caCert from a ConfigMap (<fullname>-keycloak-runtime-ca-bundle,
      # key ca.crt) rendered into operatorNamespace (the operator resolves
      # caCert there too), and the http port no longer admits the operator.
      # The ConfigMap's ca.crt comes from caCert below, else a lookup of the
      # runtime's leaf TLS Secret, else the ConfigMap already live; with none
      # (helm template, a first install before cert-manager issues) it is not
      # rendered, so turn this on only once the TLS Secret exists.
      # The release deployer may only get/update/patch that ConfigMap in a
      # foreign operatorNamespace (no create), so the roll that FIRST turns
      # this on must be an ADMIN roll: it creates the ConfigMap and adds the
      # grant (the deployer cannot grant itself access). An autonomous roll
      # that turns it on fails and rolls back.
      tls: false
      # PEM CA to put in that ConfigMap instead of the lookup, for a CA
      # managed out of band. Empty = the lookup.
      caCert: ""

    # ---- First-admin bootstrap (OIDC chicken-and-egg) ----------------------
    # Research ka-0000004895 §3 / doc §3. Solves a HARD LOCK-OUT:
    #
    #   * The master-realm bootstrap admin (runtime.admin) is a superuser of the
    #     Keycloak *master* realm only — NOT a gardenio-realm OIDC user, so it
    #     cannot log into beads.
    #   * The first human who logs in via OIDC is auto-provisioned a type=user
    #     bead with NO role; the gardenio-viewer role comes from the realm's
    #     defaultGroups:[gardenio-viewers] at token-gen time. They land READ-ONLY.
    #   * write_authz.go blocks every admin write and userRegistration=false
    #     leaves no self-service escape — the box locks with no admin.
    #
    # This post-install/upgrade hook Job uses the master-realm bootstrap creds
    # against the in-cluster Keycloak admin REST API (via kcadm.sh) to create a
    # gardenio-realm user `admin@<runtime.host>`, emailVerified=true, and join it
    # to the gardenio-admins group (carries the gardenio-admin role). The realm
    # stays userRegistration=false + defaultGroups:[gardenio-viewers]; all later
    # users start as viewers and are promoted by this admin.
    #
    # IDEMPOTENT: if the realm user already exists the Job only re-ensures group
    # membership (it does NOT reset the password) — safe to re-run on every
    # `helm upgrade`. The one-time installer password lives in a chart-generated,
    # lookup-stable Secret (see firstAdmin.passwordSecret) for one-time retrieval:
    #   kubectl get secret <release>-keycloak-first-admin -n <ns> \
    #     -o jsonpath='{.data.password}' | base64 -d; echo
    #
    # FALLBACK if this hook is disabled or fails (a missing hook is a hard
    # lock-out — see the runbook, ka-0000005523): port-forward the Keycloak
    # console and create the user by hand:
    #   kubectl port-forward svc/<release>-keycloak-runtime 8080:8080 -n <ns>
    #   # open http://localhost:8080/auth/ , log in with the master admin from
    #   # Secret gardenio-keycloak-runtime-admin, switch to the gardenio realm,
    #   # add a user, set a password, join the gardenio-admins group.
    firstAdmin:
      # Master switch. Gated additionally by runtime.enabled, so it renders
      # nothing unless the in-box Keycloak is on. Default true for in-box.
      enabled: true
      # Username/email of the realm admin user to create. Empty => derived as
      # "admin@<runtime.host>" at render time. emailAsUsername=true in the realm
      # means this doubles as the login email; it is marked emailVerified.
      username: ""
      # Realm group the user joins (must exist in keycloak.groups[] and carry the
      # gardenio-admin role). groups.yaml renders it as a KeycloakRealmGroup.
      group: "gardenio-admins"
      # Chart-generated Secret holding the one-time installer password. Created
      # with a random 32-char password, stable across upgrades
      # (helm.sh/resource-policy: keep + lookup), mirroring the master-admin
      # Secret pattern. Set generate=false and pre-create it to supply your own.
      passwordSecret:
        generate: true
        # Defaults to "<release>-keycloak-first-admin" when empty.
        name: ""
        usernameKey: "username"
        passwordKey: "password"
      # Fail the Helm post-* hook (and thus mark the release failed) when the
      # bootstrap cannot complete. Default true: on a FRESH box a missing realm
      # admin is a hard lock-out worth surfacing loudly. Set false for long-lived
      # boxes where the admin is already bootstrapped and a cosmetic re-ensure
      # miss must not fail every `helm upgrade` (in-box overlay sets this false,
      # ka-0000006886). Independent of the diagnostics dump, which always logs the
      # captured kcadm error (401 vs connection-refused) on a terminal failure.
      failOnError: true
      # Hook tuning. The Job waits for the in-cluster Keycloak admin REST API to
      # answer before acting, so give it generous wall-clock on cold starts.
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 600
      backoffLimit: 3
      # kcadm.sh ships inside the Keycloak runtime image, so the Job reuses it.
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    # Role-drift probe (gd-L2MyfEe9lL): an hourly CronJob that fails when
    # default-roles-<realm> composes a gardenio-* role, which makes every new
    # user hold it; a fresh gardenio-viewer user is an unrestricted reader in
    # kbeads and the viewer. vmalert gapAlerts.keycloakRoleDrift alerts on its
    # stale last success; monitoring.podStateMetrics must be on to see it.
    # It signs in as its own confidential client (clientId below), which the
    # chart renders with realm-management view-realm only, and a chart-made
    # Secret <fullname>-keycloak-runtime-role-drift-client (operator decision
    # gd-TgsaQWJPQ3). It does not render while keycloak.realm.defaultGroups
    # names a group with a gardenio-* role (this file's default,
    # gardenio-viewers): there every new user is a global reader by design.
    # The k3s overlay sets defaultGroups: [].
    roleDriftProbe:
      enabled: true
      clientId: "gardenio-role-drift-probe"
      schedule: "23 * * * *"
      activeDeadlineSeconds: 300
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

    # Realm hardening applied by the first-admin hook with kcadm. The EDP
    # KeycloakRealm CRD has no brute-force field (see ingressroute.yaml), so this
    # is the only declarative way to switch detection on. Runs only while
    # firstAdmin.enabled is true (it is the same Job).
    realmHardening:
      bruteForce:
        # Default false: a plain upgrade leaves the realm's brute-force settings
        # as they are. When true the hook idempotently sets
        # bruteForceProtected=true, permanentLockout=false, failureFactor=10,
        # waitIncrementSeconds=60, maxFailureWaitSeconds=900 and
        # maxDeltaTimeSeconds=43200 (temporary, growing lockout, never a
        # permanent one). Rollback: set false and roll, or
        # `kcadm.sh update realms/<realm> -s bruteForceProtected=false`.
        enabled: false
      # WebAuthn Passwordless (passkey) policy (plan gd-QXq1fjYuRD, step S3a;
      # design doc docs/superpowers/specs/2026-10-18-keycloak-passkeys-login-
      # theme-design.md section 4.2). The KeycloakRealm CRD cannot express
      # WebAuthn policy, so, like bruteForce, the first-admin hook applies it
      # with `kcadm update realms/<realm>`: idempotent, and a failure is logged
      # but never fails the hook. Needs Keycloak >= 26.4 (passkeys-enabled flag).
      # Runs only while firstAdmin.enabled is true (it is the same Job). The
      # policy does nothing visible until the browser flow offers passkeys
      # (keycloak.mfa.factor: passkey).
      passkeys:
        # Default false: a plain upgrade leaves the realm's WebAuthn policy as
        # it is. Rollback: set false and roll (stops the hook re-applying); the
        # attributes already written stay on the realm until cleared by hand.
        enabled: false
        # Relying Party ID. Empty = the host of keycloak.runtime.hostnameUrl
        # (auth.clonk.tv in the k3s overlay); the render fails if both are
        # empty. The RP ID is the identity of every enrolled passkey: changing
        # the issuer host (or this value) strands them all, so it is always
        # written explicitly. An explicit value must equal the issuer host or be
        # a parent domain of it (a browser rejects anything else).
        rpId: ""
        # Relying Party name shown in the OS passkey dialog.
        rpName: "gardenio"
        # required | preferred | discouraged. "required" (biometric or PIN) is
        # what makes one passkey a real two factors.
        userVerification: "required"
        # Discoverable credential ("Yes" | "No"). Yes is needed for username-less
        # autofill. Written to the non-deprecated webAuthnPolicyPasswordlessResidentKey
        # attribute (Yes -> required, No -> discouraged).
        requireResidentKey: "Yes"
        # none | indirect | direct. "none" = no AAGUID allow-list; we do not need
        # to know the device model, and synced passkeys are accepted.
        attestation: "none"
        # "" (not specified: platform and roaming keys both allowed) | platform
        # | cross-platform.
        authenticatorAttachment: ""
        # COSE algorithms offered at registration (Windows Hello, Apple,
        # Android and FIDO2 keys). Any of ES256, ES384, ES512, RS256, RS384,
        # RS512, EdDSA.
        signatureAlgorithms: [ES256, RS256]
        # Refuse to register one authenticator twice (accidental double-enrolment).
        avoidSameAuthenticatorRegister: true

  # OIDC audience for beads server token validation.
  # When empty, any valid JWT from the realm is accepted (SkipClientIDCheck).
  oidcAudience: ""

  # Comma-separated list of allowed email domains for OIDC-authenticated users.
  # When set, users with emails outside these domains are rejected with 403.
  # Defense-in-depth behind ForwardAuth. Empty = any domain accepted.
  oidcAllowedEmailDomains: ""

  # Keycloak Admin API configuration for session revocation (offboarding).
  # Requires a confidential client with realm-admin or manage-users role.
  admin:
    enabled: false
    # Keycloak server base URL (e.g., "https://keycloak.example.com/auth")
    url: ""
    # Realm to manage (defaults to keycloak.realm.name if empty)
    realm: ""
    # Service account client ID with admin privileges
    clientId: ""
    # Reference to a K8s Secret containing the client secret
    clientSecretRef: {}
    #   name: gardenio-keycloak-admin
    #   key: client-secret

  realm:
    # Create the KeycloakRealm CRD. Set to false when sharing a realm
    # managed by another installation (e.g., an e2e release reusing gardenio's realm).
    create: true
    # Realm name in Keycloak. Empty default falls through to .Release.Name in
    # templates/keycloak/realm.yaml so each release gets a namespace-scoped
    # realm name and never collides with another release's KeycloakRealm CRD
    # (the vkeycloakrealm-v1.kb.io webhook enforces cluster-wide uniqueness on
    # realmName). Set explicitly in deploy-values when a stable realm name is
    # needed (prod owns "gardenio").
    name: ""
    # Display name shown in the Keycloak admin console and login page
    displayName: "Gardenio"
    # Name of the existing ClusterKeycloak CR to reference
    clusterKeycloakRef: "keycloak"
    # OIDC issuer URL for this realm (used by backend services for JWT validation)
    # Format: https://{keycloak-host}/auth/realms/{realm-name}
    issuerURL: ""
    # Realm frontend URL (EDP KeycloakRealm .spec.frontendUrl). Overrides the base
    # URL Keycloak stamps into per-realm frontend responses — critically the
    # `issuer` / `token-service` claims of the discovery doc and issued JWTs.
    # Leave "" on installs where Keycloak already renders correct issuer claims
    # (KC_HOSTNAME set, or KC_PROXY_HEADERS=xforwarded honouring the LB's
    # X-Forwarded-Proto). Set it when the shared Keycloak has NO KC_HOSTNAME and
    # KC_PROXY_HEADERS=forwarded, so realms without a frontendUrl issue http://
    # claims that OIDC clients reject as a mismatch against an https:// issuerURL.
    # Format: https://{keycloak-host}/auth   (base only — NO realm path).
    frontendUrl: ""
    # Default groups assigned to new users on registration.
    # Each entry is a group name that must exist in the groups list below.
    defaultGroups:
      - gardenio-viewers

    # Login page settings
    login:
      userRegistration: false
      emailAsUsername: true
      loginWithEmail: true
      verifyEmail: true
      forgotPassword: true
      rememberMe: true
      editUsername: false
      duplicateEmails: false

    # Realm SMTP (KeycloakRealm .spec.smtp, gd-hTlQPf59qf): where Keycloak sends
    # verify-email and reset-password mail. login.verifyEmail is true, and a
    # GitHub registrant starts with email_verified=false (keycloak.githubIdp
    # trustEmail: false), so public registration fails closed until this is on.
    # Defaults target Amazon SES SMTP (the chart's mailer already uses SES):
    #   host email-smtp.<region>.amazonaws.com, port 587, STARTTLS, `from` on a
    #   verified SES identity. SES SMTP needs its own credentials: an IAM user
    #   allowed ses:SendRawEmail, whose SMTP username is the access key id and
    #   whose SMTP password is derived from the secret key (not the key itself).
    # OFF by default: no spec.smtp renders and the realm is left as it is.
    # Turning it off later does not clear the server Keycloak already holds;
    # the operator only writes SMTP when spec.smtp is present.
    smtp:
      enabled: false
      host: ""
      port: 587
      # STARTTLS on 587, or ssl (implicit TLS) on 465. Not both.
      starttls: true
      ssl: false
      # Sender on a verified identity, e.g. "lands@lands.clonk.tv". Required
      # when enabled.
      from: ""
      fromDisplayName: ""
      replyTo: ""
      replyToDisplayName: ""
      # Bounce address (Return-Path). Empty = Keycloak's default (from).
      envelopeFrom: ""
      auth:
        enabled: true
        # K8s Secret in the release namespace (the KeycloakRealm's namespace;
        # the EDP operator reads it from there). Required when auth is on.
        # The password is only ever read from this Secret.
        secretName: ""
        usernameKey: "username"
        passwordKey: "password"
        # Plain username instead of usernameKey. Leave "" to read it from the
        # Secret: the chart looks up usernameKey in secretName at render time
        # and renders it as username.value, since keycloak-operator 1.32.0
        # drops a username secretKeyRef on reconcile (gd-M8NN95y1Xh). When the
        # lookup finds nothing (helm template, first install) the secretKeyRef
        # renders instead.
        username: ""

    # Realm events (KeycloakRealm .spec.realmEventConfig, gd-X2xwS9MoBP): the
    # audit record for admin impersonation. Keycloak writes two rows per
    # impersonation: an admin event (ACTION on users/<id>/impersonation, with
    # the admin's user id, time and IP, under Events > Admin events) and a
    # user event of type IMPERSONATE carrying the impersonator's name (Events >
    # User events). User events are on for IMPERSONATE only, so logins are
    # not recorded. adminEventsDetailsEnabled also stores the request body.
    # The EDP 1.32.0 operator PUTs the whole events/config on every reconcile,
    # and Keycloak empties a field the body leaves null, so eventsListeners
    # repeats Keycloak's default (jboss-logging) or the realm loses it.
    # enabled: false renders no realmEventConfig and leaves the realm as it is.
    events:
      enabled: true
      adminEventsEnabled: true
      adminEventsDetailsEnabled: true
      adminEventsExpiration: 7776000    # 90 days
      eventsEnabled: true
      enabledEventTypes:
        - IMPERSONATE
      eventsExpiration: 7776000         # 90 days
      eventsListeners:
        - jboss-logging

    # UI themes
    themes:
      loginTheme: "keycloak"
      accountTheme: ""
      emailTheme: ""

    # Session timeouts (in seconds). Default 30m-idle was too aggressive —
    # users got bounced to login mid-task and oauth2-proxy returned 500
    # because the refresh_token had expired with the SSO session. Bumped
    # to 8h idle / 7d max for the default flow, with longer "Remember me"
    # variants for users who tick the checkbox at login. See bead context
    # in the realm-side fix MR.
    sessions:
      ssoSessionIdleTimeout: 28800      # 8 hours
      ssoSessionMaxLifespan: 604800     # 7 days
      ssoSessionIdleTimeoutRememberMe: 86400    # 24h (only used if user tics Remember me)
      ssoSessionMaxLifespanRememberMe: 2592000  # 30 days
      offlineSessionIdleTimeout: 2592000  # 30 days
      offlineSessionMaxLifespan: 5184000  # 60 days
      offlineSessionMaxLifespanEnabled: false

    # Token settings
    tokenSettings:
      accessTokenLifespan: 300          # 5 minutes
      accessCodeLifespan: 300           # 5 minutes — gives auth code more headroom for browser preload races
      revokeRefreshToken: false
      refreshTokenMaxReuse: 0
      defaultSignatureAlgorithm: "RS256"

    # Password policies (list of {type, value} objects)
    # Example: [{type: "length", value: "8"}, {type: "upperCase", value: "1"}]
    passwordPolicy:
      - type: "length"
        value: "8"
      - type: "upperCase"
        value: "1"
      - type: "lowerCase"
        value: "1"
      - type: "specialChars"
        value: "1"
      - type: "digits"
        value: "1"

  # ── MFA — mandatory second factor for the gardenio-admin role ──────────────
  # MFA epic ka-0000001366 / research ka-0000004895 §5. Implementation pivoted
  # away from the original `KeycloakRealmRequiredAction` plan after the gating
  # spike ka-0000006878 DISPROVED that CRD's existence in the deployed EDP
  # operator (v1.32.0). The validated CRD-native approach is a custom browser
  # authentication flow built from `KeycloakAuthFlow` CRs:
  #
  #   <prefix>-mfa-browser              topLevel browser flow (clone of `browser`)
  #     ├─ auth-cookie                  ALTERNATIVE  (existing SSO session)
  #     ├─ identity-provider-redirector ALTERNATIVE  (corporate IdP, if enabled)
  #     └─ <prefix>-mfa-forms           ALTERNATIVE  forms subflow
  #          ├─ auth-username-password-form  REQUIRED
  #          └─ <prefix>-mfa-conditional     CONDITIONAL  ← gated on admin role
  #               ├─ conditional-user-role   config condUserRole=<adminRole>
  #               └─ auth-otp-form / webauthn-authenticator   REQUIRED
  #
  # factor: passkey (design doc section 4.1) inserts `conditional-credential`
  # (skip the subflow when a passkey was the primary credential) and ends with
  # `webauthn-authenticator-passwordless`:
  #               ├─ conditional-user-role
  #               ├─ conditional-credential  credentials=webauthn-passwordless, included=false
  #               └─ webauthn-authenticator-passwordless   REQUIRED
  #
  # The CONDITIONAL subflow is DISABLED for non-admins and REQUIRED for admins,
  # so only gardenio-admin members are forced through the second factor. With
  # totp or webauthn the execution is REQUIRED and enrols: an admin with no
  # enrolled credential is prompted to set one up on next login (passkey does
  # not enrol, see factor below) — no realm-wide required action is
  # needed (and none is CRD-expressible: spike ka-0000006878). Bound to the
  # realm via `KeycloakRealm.browserFlow` (templates/keycloak/realm.yaml).
  #
  # Template: templates/keycloak/auth-flow-mfa.yaml. Gated independently so
  # customer-poc / no-operator installs render zero KeycloakAuthFlow CRs.
  mfa:
    # Master switch. When false, no KeycloakAuthFlow CRs are rendered and the
    # realm keeps Keycloak's built-in `browser` flow (no enforced MFA).
    enabled: false
    # Realm role whose members are forced through the second factor. Must be
    # one of keycloak.roles[].name below.
    adminRole: "gardenio-admin"
    # Alias of the custom top-level browser flow created and bound to the realm.
    flowAlias: "gardenio-mfa-browser"
    # Second factor: "totp" (auth-otp-form), "webauthn"
    # (webauthn-authenticator, FIDO2, phishing-resistant, origin-bound) or
    # "passkey" (webauthn-authenticator-passwordless behind a
    # conditional-credential gate: a passkey used as the primary credential
    # skips the second factor, a password sign-in is followed by a passkey, so an
    # admin never gets in without one). "passkey" needs Keycloak >= 26.4 and the
    # WebAuthn Passwordless policy (keycloak.runtime.realmHardening.passkeys).
    # Unlike totp/webauthn it does NOT enrol: Keycloak's passwordless authenticator
    # does not offer user setup, so an admin with no passkey is refused ("credential
    # setup required"), not walked through registering one. Flip it only after every
    # admin has enrolled in the account console (design doc 3.D and 7).
    # deploy-values/gardenio-k3s.yaml chooses the live factor; this file's default
    # is not the live one.
    factor: "webauthn"
  roles:
    - name: gardenio-admin
      description: "Full access to all gardenio services"
    - name: gardenio-operator
      description: "Can manage beads, decisions, and advice"
    - name: gardenio-viewer
      description: "Read-only access to dashboards and reports"
      # NOT isDefault: a default role is held by every realm user, which made
      # each one a global reader. A new user holds NO gardenio role until put
      # in a group (gd-zuV3EfwrzB, epic gd-myIsTYHWX7).
    - name: gardenio-mention
      description: "Can @mention the bot to spawn agents"
    - name: escalation-approver
      description: "Can approve privilege escalation requests"
    # Project-scoped access. Held ONLY through a `project-<name>` group (see
    # keycloak.projectGroups); kbeads derives the member's project scope from
    # that group claim and fails closed on everything outside it. It grants no
    # global read, so it never composes gardenio-viewer.
    - name: gardenio-project-member
      description: "Member of one or more projects: access confined to the projects named by their project-<name> groups"
    # Lets a user sign in through a client whose directGrantRole it is (the
    # land-door verifier's test owner, gd-Hq1PnUVOUC). Grants nothing in
    # kbeads or the edge: no gardenio service reads it.
    - name: gardenio-land-verifier
      description: "Test identity: may use the password grant of a client whose directGrantRole this is. Grants no gardenio access"
    # Machine-principal capability roles (gardenio/docs/machine-principal-design.md
    # §4.1). Held ONLY by the service account of a confidential client listed in
    # beads.machineClients; kbeads maps each to an enumerated set of writes
    # (kbeads/internal/server/testdata/machine_grants.golden.json is the
    # reviewed table). A human who is granted one gets nothing from it.
    - name: gardenio-machine-accounts
      description: "Machine principal: may update type=account beads (controller spend sync, rate-limit probe, auth failover, key rotation)"
    - name: gardenio-machine-token-mint
      description: "Machine principal: may mint per-agent and bridge daemon tokens (controller only)"
    - name: gardenio-machine-plan-reactor
      description: "Machine principal: may update type=epic beads it did not create (beads-viewer plan-step reactor last_nudge_at stamp); typed ownership, no other write"
    - name: gardenio-machine-lands-gate
      description: "Machine principal (beads-viewer Lands Gate): may create and update type=plot_application beads only (the applicant never writes one on their own token); no other admin-gated write"
    - name: gardenio-machine-lands-provisioner
      description: "Machine principal (controller Lands provisioner): may update type=plot_application beads it did not create; create/update/close type=project and type=account; create type=credit_grant. No other admin-gated write"
    - name: gardenio-machine-config-seed
      description: "Machine principal: may create/update ONLY the type:dashboard config bead (EnsureGrafanaBridgeConfigs at start: grafana-bridge); no prerun, context, claude-* or nudge-prompts"
    - name: gardenio-machine-dashboard-sync
      description: "Machine principal: may update type=dashboard beads it did not create, and UPDATE ONLY (never close) type=doc beads labelled grafana:dashboard-model (grafana-bridge readback/sync); typed ownership, no other write"
    - name: gardenio-machine-trigger-ops
      description: "Machine principal (trigger-engine): update/close trigger, task, bug, feature, chore beads it did not create; update-only the uncovered-open-lane-rollup doc; trigger_id creates are attributed to the trigger's human author. No admin-gated write."
    - name: gardenio-machine-slack-config-seed
      description: "Machine principal: may create/update ONLY the dm, message, mail, decision and escalation type config beads and the decisions/escalations/mail-inbox views (slack-bridge startup seed); no agent-facing or write-policy config"
    - name: gardenio-machine-slack-dm-delivery
      description: "Machine principal: may update/close/comment type=dm beads it did not create (slack-bridge DM delivery); typed ownership, no other write, no operated-by relay"
    - name: gardenio-machine-controller-ownership
      description: "Machine principal (controller default client): update/close foreign task, advice, session, trigger beads (stale reaper, advice sweeper, spend stamps); update-only bug/feature/chore/epic whose assignee is a closed agent (claim release); no other write"
    - name: gardenio-machine-controller-config-seed
      description: "Machine principal (controller EnsureConfigs at start): may create/update ONLY the exact config titles the controller seeds (types, views, prerun, context, claude-instructions, nudge-prompts); never the auth bead or claude-hooks/settings/mcp"
    - name: gardenio-machine-release-recorder
      description: "Machine principal (the GitHub bridge release recorder): may create and update type=release beads (tag webhook + 5-minute tag poll; deployment_status); typed ownership of release, no other write"
    - name: gardenio-machine-github-bridge
      description: "Machine principal (the GitHub bridge daemon client): update/close type=merge-request beads; on task/bug/feature/chore/epic update ONLY the PR bookkeeping fields it stamps; no admin-gated write, no operated-by relay"
    - name: gardenio-machine-release-deploy
      description: "Machine principal (release-deployer CronJob, controller release reconciler): may record where a release runs (POST /v1/releases/{id}/deployments, deploy on type=release) and nothing else; never records, edits or closes a release"
    - name: gardenio-machine-escalation-executor
      description: "Machine principal (coordinator:cluster): may update/close only the task/bug/feature/chore/epic beads in approved_targets of an approved bead-only escalation it has claimed; no other write"

  # Realm groups (KeycloakRealmGroup CRs)
  # Each entry creates a group with assigned realm roles.
  groups:
    - name: gardenio-admins
      description: "Administrators with full gardenio access"
      realmRoles:
        - gardenio-admin
      # Literal impersonation, V1 (gd-NJkG7x9wb7, gd-X2xwS9MoBP): Keycloak's
      # own Users > <user> > Impersonate. impersonation is the permission;
      # view-users lets the admin console list and open the user to click it.
      # Keycloak refuses impersonation to anyone without the role, and every
      # IMPERSONATE is an admin event (keycloak.realm.events). Runbook:
      # gardenio/docs/lands/admin-impersonation.md.
      clientRoles:
        - clientId: realm-management
          roles: [impersonation, view-users]
    - name: gardenio-operators
      description: "Operators who manage beads and decisions"
      realmRoles:
        - gardenio-operator
    - name: gardenio-viewers
      description: "Viewers with read-only access"
      realmRoles:
        - gardenio-viewer
    - name: gardenio-mentioners
      description: "Users authorized to @mention the bot"
      realmRoles:
        - gardenio-mention
    - name: gardenio-escalation-approvers
      description: "Users authorized to approve escalation requests"
      realmRoles:
        - escalation-approver
    # Every Lands tenant (Track B step 7.8, B-D2): the controller's Lands
    # provisioner adds a tenant here when they join their first land and takes
    # them out when they leave their last; it only looks the group up, never
    # creates it. gardenio.clonk.tv's sign-in check admits it, so a land made
    # at runtime needs no edge edit. gardenio-project-member and nothing else:
    # a tenant's read scope is their /project-<land> groups, and this group
    # names no project, so membership on its own reads nothing.
    - name: lands-tenants
      description: "Lands tenants: admitted by the viewer edge; read scope comes only from their project-<land> groups"
      realmRoles:
        - gardenio-project-member
    # Everyone whose sign-in invite was claimed (gd-ycE484kLyk): GitHub
    # sign-in is invite-only. The Lands provisioner adds a person here when a
    # type=invite bead's email matches their verified, GitHub-linked user; it
    # only looks the group up, never creates it. gardenio.clonk.tv's /lands/
    # check admits it. No role: membership grants nothing but getting past
    # that check.
    - name: invited
      description: "Invited to sign in: admitted by the viewer edge's /lands/ check; grants no role"

  # Per-project member groups (KeycloakRealmGroup CRs). One entry per project:
  # `{name: <project>}` renders a group `project-<name>` whose only realm role
  # is gardenio-project-member. The role list is NOT an input here, so a
  # project group can never be configured into a global grant. Removing a
  # user from the group takes effect on their next access token (<= the
  # realm accessTokenLifespan, 5m; the forwardAuth cookieRefresh is shorter).
  # See templates/keycloak/groups.yaml.
  projectGroups: []

  # Per-land audiences (gd-eAfptUBh9Z, owner decision gd-zf6eceweED): each land
  # has an OPTIONAL client scope land-<name> whose one mapper adds aud
  # land-<name> to the access token, so `kd login` / `gb login` against
  # https://<api>/land/<name> gets a token minted for that land alone; kbeads
  # and landgate narrow it to the land and the land door refuses any other.
  # The chart renders the scope for every keycloak.projectGroups name and every
  # name listed here (a land whose group is declared in keycloak.groups, e.g.
  # project-claimlayer). The Lands provisioner makes it for runtime lands as a
  # KeycloakClientScope resource (internal/lands/landscope), held to this shape
  # by the admission policy in templates/controller/lands-scope-rbac.yaml; its
  # Keycloak credential never needs manage-clients. See
  # templates/keycloak/client-scopes.yaml.
  landScopes: []
  # The clients a land scope is attached to as an optional scope: the clients
  # that mint land-door bearers. Runtime lands' scopes are attached on the
  # next helm upgrade after the provisioner makes them (clients.yaml lookup).
  landScopeClients:
    - gardenio-cli

  # Realm users (KeycloakRealmUser CRs) — durable, declarative human accounts.
  # EMPTY by default. Each entry: username (required; the realm has
  # emailAsUsername=true so this is the login email), email (defaults to
  # username), enabled / emailVerified (default true), groups (realm group
  # names, e.g. [gardenio-admins]), firstName / lastName (optional, rendered
  # only when set; the operator blanks them on every reconcile otherwise),
  # reconciliationStrategy (default addOnly; the operator's own default `full`
  # removes unlisted groups and direct realm roles from the live user). No
  # credential is rendered: a person sets their own password out of band, so
  # nothing secret is in git. A machine test identity may set passwordSecret
  # {name, key}, a Secret in the release namespace whose key holds its password
  # (the land-door verifier, gd-Hq1PnUVOUC). groups are matched by bare name,
  # first match anywhere in the tree, so never list a subgroup such as owners.
  # roles (optional) lists realm roles granted to the user directly, e.g. the
  # directGrantRole of a password-grant client.
  # See templates/keycloak/realm-users.yaml.
  realmUsers: []

  # Realm client scopes (KeycloakClientScope CRs)
  # Each entry renders a requestable OIDC client-scope in the realm so a client
  # can ask for `scope=... <name>` without Keycloak rejecting it as
  # invalid_scope. A scope with `type: default` is auto-attached to EVERY client
  # in the realm, so it covers the forwardauth client without editing the shared
  # `clients` list below.
  #
  # EMPTY by default — prod (app.example.com) federates to gitlab.com via the
  # oauth2-proxy gitlab provider and never asks Keycloak for these scopes, so the
  # base render must stay a no-op. Only the Gardenio-in-a-Box overlay
  # (deploy-values/gardenio-inbox.yaml), whose oauth2-proxy runs --provider=oidc
  # against the in-box realm and requests `scope=openid email profile groups`,
  # populates this with a `groups` scope. Without it Keycloak returns
  # `invalid_scope: Invalid scopes: openid email profile groups` and the oauth2
  # callback 403s — nobody can log in (ka-0000000403). Each entry supports:
  #   name           (required) scope name, e.g. groups
  #   protocol       (default openid-connect)
  #   description     human label
  #   type           default | optional | none (default "default")
  #   attributes      map<string,string> (e.g. include.in.token.scope: "true")
  #   protocolMappers list of mappers (same shape as client protocolMappers)
  clientScopes: []

  # OIDC clients (KeycloakClient CRs)
  # Each entry creates a client in the gardenio Keycloak realm.
  # Public clients use Authorization Code Flow with PKCE (browser apps).
  # Confidential clients use client_secret for service-to-service auth.
  #
  # SECURITY — redirect URIs MUST be anchored to an exact host. The defaults
  # below use localhost so `helm lint`/`helm template` stay green and local
  # dev installs work out of the box, but NEVER rely on these in production.
  # Every real deployment must override `redirectUris` (and webOrigins) in a
  # per-environment overlay — see deploy-values/gardenio-k3s.yaml for the
  # canonical per-host patterns.
  # Wildcarded hosts like `https://*.example/*` let an attacker who controls
  # any matching subdomain receive auth codes (audit ka-0000004369 F2).
  #
  # scopeMappings (optional, needs fullScopeAllowed: false): the client roles
  # of other clients this client's tokens may carry, as
  #   scopeMappings: [{clientId: realm-management, roles: [view-users]}]
  # The KeycloakClient CRD has no field for it, so the first-admin hook
  # (templates/keycloak-runtime/first-admin-job.yaml, step 2d) adds them with
  # kcadm. Add-only: a role dropped from the list stays mapped until removed
  # by hand.
  #
  # directGrantRole (optional, needs directAccess: true): a realm role. The
  # client's password grant then runs templates/keycloak/auth-flow-direct-grant.yaml,
  # which refuses every user without that role. Required on a public client with
  # directAccess: it has no secret, and Keycloak's default direct grant runs no
  # passkey, so any realm user's password would mint its token (gd-Hq1PnUVOUC).
  clients:
    # ── Public clients (browser-based SPAs) ──
    - clientId: gardenio-coopmux
      name: "Coopmux Dashboard"
      public: true
      # Override per environment — see deploy-values/*.yaml for anchored hosts.
      redirectUris:
        - "http://localhost:8092/*"
      webOrigins:
        - "+"
      attributes:
        post.logout.redirect.uris: "+"
        pkce.code.challenge.method: "S256"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    - clientId: gardenio-landing
      name: "Gardenio Landing Page"
      public: true
      # Override per environment — see deploy-values/*.yaml for anchored hosts.
      redirectUris:
        - "http://localhost:8093/*"
      webOrigins:
        - "+"
      attributes:
        post.logout.redirect.uris: "+"
        pkce.code.challenge.method: "S256"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    - clientId: gardenio-ios
      name: "Gardenio iOS App"
      public: true
      redirectUris:
        - "com.gardenio.app://oauth/callback"
      webOrigins:
        - "+"
      attributes:
        post.logout.redirect.uris: "+"
        pkce.code.challenge.method: "S256"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    - clientId: gardenio-escalation
      name: "Escalation Approval UI"
      public: true
      # Override per environment — see deploy-values/*.yaml for anchored hosts.
      redirectUris:
        - "http://localhost:8094/*"
      webOrigins:
        - "+"
      attributes:
        post.logout.redirect.uris: "+"
        pkce.code.challenge.method: "S256"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    # ── Confidential clients (server-side) ──
    - clientId: gardenio-beads-api
      name: "Beads API"
      public: false
      directAccess: true
      # Override per environment — see deploy-values/*.yaml for anchored hosts.
      redirectUris:
        - "http://localhost:8095/*"
      webOrigins:
        - "+"
      attributes:
        post.logout.redirect.uris: "+"
      serviceAccount:
        enabled: true
        realmRoles:
          - gardenio-admin
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"

    - clientId: gardenio-traefik-forwardauth
      name: "Traefik ForwardAuth"
      public: false
      redirectUris:
        - "https://gardenio.example.com/oauth2/*"
      webOrigins:
        - "+"
      attributes:
        post.logout.redirect.uris: "+"
      protocolMappers:
        - name: realm-roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          config:
            claim.name: realm_roles
            jsonType.label: String
            multivalued: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        # kbeads verifies tokens with aud = keycloak.oidcAudience (this client).
        # An ID token has it already; a Keycloak ACCESS token only does with this
        # mapper. Roles reach kbeads via realm_roles above (ExtractRoles reads it
        # next to realm_access.roles). gd-l1Jh9aFEXY.
        - name: audience-self
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: gardenio-traefik-forwardauth
            id.token.claim: "false"
            access.token.claim: "true"
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: "true"
            id.token.claim: "true"
            access.token.claim: "true"
            userinfo.token.claim: "true"
        # Who is acting behind an impersonated session (one-click Become,
        # gd-rbML2txvGG). Keycloak sets these session notes only when an admin
        # impersonates a user, so on any other session both claims are absent.
        - name: impersonator
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          config:
            user.session.note: IMPERSONATOR_USERNAME
            claim.name: impersonator
            jsonType.label: String
            id.token.claim: "true"
            access.token.claim: "true"
        - name: impersonator-id
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          config:
            user.session.note: IMPERSONATOR_ID
            claim.name: impersonator_id
            jsonType.label: String
            id.token.claim: "true"
            access.token.claim: "true"

    # ── Confidential service account for admin API (session revocation) ──
    - clientId: gardenio-admin-api
      name: "Gardenio Admin API"
      public: false
      standardFlowEnabled: false
      directAccess: false
      serviceAccount:
        enabled: true
        realmRoles:
          - gardenio-admin
      attributes:
        # Client credentials grant for service-to-service auth
        oidc.ciba.grant.enabled: "false"
        oauth2.device.authorization.grant.enabled: "false"

  # GitLab IdP client secret — set in deployment repo values, not here.
  # Injected into the gitlab identityProvider config by the template.
  gitlabIdpClientSecret: ""

  # gardenio-traefik-forwardauth client secret — no longer set as a chart value.
  # The KeycloakClient CR now references the gardenio-forwardauth-secrets K8s
  # Secret (via EDP `$<name>:<key>` syntax in templates/keycloak/clients.yaml),
  # which is populated either by ExternalSecrets or by the deploy step from
  # a secret store. The operator and oauth2-proxy read the same Secret/key, so
  # they stay in sync across chart reinstalls.

  # ── Corporate IdP Federation ──────────────────────────────────────────────
  # Federate Keycloak with your organization's corporate SSO (Google Workspace, Azure AD,
  # or generic OIDC). When enabled, employees log in with their corporate
  # credentials — when someone leaves the organization, their SSO is disabled and they
  # immediately lose gardenio access.
  #
  # Setup guide: gardenio/docs/corporate-idp-federation.md
  corporateIdp:
    # Enable the corporate identity provider. When false, no CRD is created.
    enabled: false

    # Provider type determines OIDC discovery endpoints and claim mappings:
    #   "google"  — Google Workspace (uses accounts.google.com discovery)
    #   "azure"   — Azure AD / Entra ID (uses login.microsoftonline.com/{tenant})
    #   "oidc"    — Generic OIDC provider (requires manual endpoint config)
    provider: "google"

    # Display name shown on the Keycloak login button
    displayName: "Example SSO"

    # Trust email from corporate IdP — skips Keycloak email verification for
    # SSO users. Safe when the corporate IdP guarantees verified emails.
    trustEmail: true

    # Keycloak authentication flow alias for first-time SSO users.
    # "first broker login" is Keycloak's built-in flow that auto-creates
    # a local user account on first SSO login.
    firstBrokerLoginFlowAlias: "first broker login"

    # OIDC client credentials from the corporate IdP app registration.
    # clientId is set here; clientSecret should be set in the deployment repo
    # values or via ExternalSecrets (never commit real secrets to source).
    clientId: ""
    # Direct client secret value — prefer ExternalSecrets for production.
    clientSecret: ""

    # Provider-specific OIDC endpoint overrides.
    # For "google" and "azure", these are auto-populated by the template.
    # Only required when provider is "oidc" (generic).
    #
    # Google Workspace endpoints (auto-set when provider=google):
    #   authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
    #   tokenUrl: https://oauth2.googleapis.com/token
    #   userInfoUrl: https://openidconnect.googleapis.com/v1/userinfo
    #   jwksUrl: https://www.googleapis.com/oauth2/v3/certs
    #   issuer: https://accounts.google.com
    #
    # Azure AD endpoints (auto-set when provider=azure, replace {tenant}):
    #   authorizationUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/authorize
    #   tokenUrl: https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token
    #   userInfoUrl: https://graph.microsoft.com/oidc/userinfo
    #   jwksUrl: https://login.microsoftonline.com/{tenant}/discovery/v2.0/keys
    #   issuer: https://login.microsoftonline.com/{tenant}/v2.0
    authorizationUrl: ""
    tokenUrl: ""
    userInfoUrl: ""
    jwksUrl: ""
    issuer: ""

    # Azure AD tenant ID — required when provider is "azure".
    # Use the directory (tenant) ID from Azure Portal > App registrations.
    azureTenantId: ""

    # OIDC scopes to request from the corporate IdP
    defaultScope: "openid email profile"

    # Allowed email domain — restricts SSO to users with this email domain.
    # For Google Workspace: validated via the 'hd' (hosted domain) claim.
    # For Azure AD: validated via the tenant restriction.
    # For generic OIDC: validated via email claim suffix.
    # Leave empty to skip Keycloak-level domain restriction (still enforced
    # at oauth2-proxy and beads API levels via forwardAuth.emailDomains
    # and oidcAllowedEmailDomains).
    allowedEmailDomain: ""

    # Sync mode for user attributes from the corporate IdP:
    #   "IMPORT" — create local user on first login, no further sync
    #   "FORCE"  — sync user attributes on every login (recommended for
    #              corporate IdP to keep names/emails current)
    syncMode: "FORCE"

    # When true, make this IdP the default login method (bypass the Keycloak
    # login page and redirect directly to the corporate IdP).
    authenticateByDefault: false

  # GitHub IdP (Lands Track B §2.2 item 1, gd-0o4Ggf9ngP): the public front door.
  # Anyone with a GitHub account registers through Keycloak's built-in `github`
  # provider; the first broker login flow creates a realm user with no group and
  # no role. When enabled the chart renders, all keyed to alias `github`:
  #   - the KeycloakRealmIdentityProvider, syncMode IMPORT, trustEmail FALSE.
  #     Keycloak's GitHub provider takes /user's email, else the primary entry
  #     of /user/emails, and never reads GitHub's `verified` flag, so trusting it
  #     would hand email_verified=true to an unverified address, which kbeads and
  #     the viewer accept as the identity (gd-rnklckVFKS). A GitHub registrant
  #     starts with email_verified=false and verifies through Keycloak's own
  #     verify-email step, which needs realm SMTP: until SMTP is configured their
  #     tokens are refused (fail closed);
  #   - the KeycloakAuthFlow `gardenio-github-first-broker-login`, the IdP's first
  #     broker login flow: review the profile if a field is missing, then create
  #     a NEW user, or stop on Keycloak's "user already exists" page. It has no
  #     account-linking branch, so a GitHub sign-in can never take over an
  #     existing user by email (the stock flow's link-by-email / re-auth);
  #   - the KeycloakAuthFlow `gardenio-github-post-broker-login`, run after every
  #     GitHub sign-in: it refuses anyone holding keycloak.mfa.adminRole. The
  #     admin passkey is asked only in the username/password subflow of the MFA
  #     browser flow, which a GitHub sign-in never runs, so admins sign in with
  #     a password and passkey, never with GitHub;
  #   - IdP mappers copying the GitHub user's numeric `id` and `login` into the
  #     user attributes github_id and github_login, both re-synced on every
  #     GitHub sign-in (a GitHub login can be renamed, and a user who linked
  #     GitHub from the account console gets github_id on their next GitHub
  #     sign-in, not at link time). An admin cannot sign in with GitHub, so an
  #     admin's github_id is set by hand in the Keycloak admin console;
  #   - both attributes in the realm user profile, editable by admins only, so a
  #     user can never set their own github_id (the Lands setup check and the
  #     invite join match on it);
  #   - a `github-identity` default client scope with protocol mappers putting
  #     github_id (a JSON number) and github_login in the access token, ID token
  #     and userinfo, attached to every chart client like keycloak.clientScopes.
  #
  # The OAuth app is the operator's (github.com > Settings > Developer settings >
  # OAuth Apps), Authorization callback URL
  #   {keycloak-base-url}/realms/{realm}/broker/github/endpoint
  # where the base URL includes Keycloak's http-relative-path (e.g.
  # https://auth.example.com/auth); the Keycloak admin console shows it as the
  # IdP's Redirect URI.
  # Its client secret lives in a K8s Secret the EDP operator dereferences
  # (`$<name>:<key>`), so the secret never sits in values.
  githubIdp:
    # OFF by default: no CR, mapper, flow, client scope or user-profile change
    # renders. Needs keycloak.realm.create (the user profile and the flow live
    # on the chart's KeycloakRealm) and keycloak.realm.defaultGroups: [].
    enabled: false
    displayName: "GitHub"
    # The OAuth app's Client ID (public). Required when enabled.
    clientId: ""
    # K8s Secret (in the release namespace) holding the OAuth app's client secret.
    clientSecretRef:
      name: "gardenio-github-idp"
      key: "client-secret"
    # read:user for the profile (id, login), user:email for the verified
    # primary email.
    defaultScope: "read:user user:email"

  # Identity providers (KeycloakRealmIdentityProvider CRs)
  # Each entry creates an external identity provider in the gardenio Keycloak realm.
  # Users can SSO via these providers instead of local Keycloak credentials.
  # For GitLab OIDC: create an Application in GitLab (Admin > Applications) with
  # scopes: openid, profile, email. Set the redirect URI to:
  #   https://{keycloak-host}/auth/realms/{realm}/broker/{alias}/endpoint
  identityProviders:
    - alias: gitlab
      displayName: "GitLab"
      # Use generic "oidc" providerId with explicit gitlab.com endpoints
      # rather than Keycloak's built-in "gitlab" provider. The built-in
      # provider's defaults assume the legacy "api read_user" scope which
      # gitlab.com rejects when the OAuth app only allows OIDC scopes; the
      # OIDC providerId path is also exercised more often upstream and is
      # easier to debug (every endpoint is explicit).
      providerId: "oidc"
      enabled: true
      # Trust email from GitLab — skip Keycloak email verification for SSO users
      trustEmail: true
      # Required: edp-keycloak-operator's gocloak adapter sends this field as
      # an empty string when unset, which makes Keycloak look up an
      # empty-named flow and return HTTP 500 unknown_error on every CREATE
      # and UPDATE. Pin it to Keycloak's built-in default flow.
      firstBrokerLoginFlowAlias: "first broker login"
      config:
        # GitLab OIDC Application (Group: example-org, "Gardenio Keycloak SSO").
        # clientId is the Application ID (public); clientSecret is the
        # gloas-prefixed value injected via keycloak.gitlabIdpClientSecret
        # (formerly RWX vault GARDENIO_PROD_KEYCLOAK_IDP_SECRET), set per-deploy.
        clientId: "57ab1f8bf23244ada4ccbc9dbafadbdf03931be30e7d1f85b4fb7b3fe32383e6"
        clientSecret: ""
        # gitlab.com OIDC endpoints
        issuer: "https://gitlab.com"
        authorizationUrl: "https://gitlab.com/oauth/authorize"
        tokenUrl: "https://gitlab.com/oauth/token"
        userInfoUrl: "https://gitlab.com/oauth/userinfo"
        jwksUrl: "https://gitlab.com/oauth/discovery/keys"
        # Intentionally empty — Keycloak otherwise back-channels the upstream
        # logout to GitLab on realm SLO, which signs users out of gitlab.com
        # too. The donk-clear / SLO flow only needs the local Keycloak
        # session cleared.
        logoutUrl: ""
        useJwksUrl: "true"
        validateSignature: "true"
        clientAuthMethod: "client_secret_post"
        # The OAuth app permits openid+profile+email; matching prevents the
        # built-in default ("api read_user") which gitlab.com rejects.
        defaultScope: "openid profile email"
        # IMPORT = create local user on first login; FORCE = sync on every login
        syncMode: "IMPORT"
      # Attribute mappers — map GitLab OIDC claims to Keycloak user attributes.
      # NOTE: gitlab.com /oauth/userinfo with openid+profile+email scopes does
      # NOT return given_name, family_name, or groups claims; it returns name,
      # nickname, preferred_username, email, email_verified, picture, etc.
      # We keep username + email mappers only.
      mappers:
        - name: "username"
          identityProviderMapper: "oidc-username-idp-mapper"
          identityProviderAlias: "gitlab"
          config:
            target: "LOCAL"
            syncMode: "INHERIT"
            template: "${CLAIM.preferred_username}"
        - name: "email"
          identityProviderMapper: "oidc-user-attribute-idp-mapper"
          identityProviderAlias: "gitlab"
          config:
            claim: "email"
            user.attribute: "email"
            syncMode: "INHERIT"

  # ForwardAuth — oauth2-proxy deployment for Traefik OIDC middleware.
  # When enabled, a Traefik ForwardAuth Middleware CR is created that can be
  # referenced by ingress routes for OIDC SSO authentication.
  #
  # Note on authResponseHeaders: oauth2-proxy returns the OIDC access token
  # to upstreams via X-Auth-Request-Access-Token only. We deliberately do NOT
  # add Authorization to authResponseHeaders, because injecting
  # Authorization: Bearer <oidc-jwt> collides with upstreams that interpret
  # Authorization for their own auth scheme (e.g. Grafana treats Bearer as a
  # service-account/API key and pre-empts its valid grafana_session cookie,
  # failing closed with 401). Every in-house service already accepts the
  # X-Auth-Request-Access-Token fallback path:
  #   - gardenio/controller/internal/oidcauth/oidcauth.go (extractToken)
  #   - coop/crates/mux/src/transport/auth.rs (extract_bearer)
  #   - gardenio/controller/cmd/slack-bridge/main.go (bearerTokenMatches)
  # See docs/audits/forwardauth-authorization-collision.md (audit
  # ka-0000000839, follow-up ka-0000002928) for the full rationale.
  forwardAuth:
    enabled: true

    image:
      repository: oauth2-proxy/oauth2-proxy
      registry: quay.io
      tag: "v7.15.2"
      digest: ""
      pullPolicy: IfNotPresent

    replicaCount: 2

    # Scheduling — forwardAuth consumes the shared gardenio.nodeSelector /
    # gardenio.tolerations helpers so it honors global.nodeSelector and
    # global.tolerations like every other deployment. Without this, on the POC
    # ephemeral overlay (which sets global.tolerations so all pods can spill
    # onto the tainted agent-pool), forwardAuth could not tolerate
    # gardenio.agent=true:NoSchedule, both replicas stayed Pending, and the helm
    # install timed out ("context deadline exceeded") — blocking golden
    # (ka-0000005420, regression after ka-0000005127 / MR !4318).
    nodeSelector: {}
    tolerations: []
    affinity: {}

    # PodDisruptionBudget — forwardAuth gates almost every protected ingress
    # route (beads-viewer, coopmux, grafana,
    # slack-bridge UI). A single-pod restart 5xxs every protected request,
    # so default to HA: 2 replicas + minAvailable:1 (audit F13).
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    # oauth2-proxy provider. Default "oidc" drives the Keycloak realm broker
    # (oidcIssuerUrl below) and is what ephemeral CI namespaces use. The prod
    # + staging front doors override this to "gitlab" (with oidcIssuerUrl
    # https://gitlab.com) so oauth2-proxy talks to gitlab.com directly and can
    # gate on GitLab group membership via gitlabGroups (ka-0000005030). The
    # gitlab provider queries the gitlab.com userinfo `groups` claim — the oidc
    # provider against gitlab.com gets no usable groups claim, so group gating
    # only works with provider=gitlab.
    provider: "oidc"

    # OIDC issuer URL (Keycloak realm endpoint)
    oidcIssuerUrl: "https://auth.example.com/auth/realms/gardenio"

    # Client ID of the confidential client for ForwardAuth
    clientId: "gardenio-traefik-forwardauth"

    # K8s Secret references for client secret and cookie encryption key
    clientSecretRef:
      name: "gardenio-forwardauth-secrets"
      key: "client-secret"
    cookieSecretRef:
      name: "gardenio-forwardauth-secrets"
      key: "cookie-secret"

    # Cookie settings for SSO across gardenio subdomains. Set to "" for
    # HOST-ONLY cookies: neither --cookie-domain nor the domain-wide
    # --whitelist-domain=.<domain> is rendered, and each host gets its own
    # sign-in cookie (the public-edge pattern, plan ziti-to-keycloak S2a).
    cookieDomain: ".example.com"
    # Exact hosts (or .suffix patterns) oauth2-proxy may redirect to after
    # sign-in/sign-out (`rd=`), each rendered as --whitelist-domain=<d>. Use with
    # cookieDomain: "" so every public host is listed explicitly. Without
    # ingress.enabled there is no --redirect-url, so oauth2-proxy derives each
    # host's callback from X-Forwarded-Host.
    whitelistDomains: []
    cookieSecure: true

    # Whether the Traefik ForwardAuth Middleware forwards the *incoming*
    # X-Forwarded-* headers unchanged to oauth2-proxy (templates/forwardauth/
    # middleware.yaml). Defaults true to preserve the ALB-fronted prod/staging
    # behaviour, where a trusted upstream LB sets those headers. Set false for
    # a directly internet-facing Traefik with no front-proxy (the
    # Gardenio-in-a-Box profile): there X-Forwarded-* is client-spoofable and
    # must not influence the auth decision (ingress research §G2,
    # ka-0000002581; audit ingress-tls-static.md F9).
    trustForwardHeader: true

    # Refresh the access token in the cookie before it expires, using the
    # refresh token. MUST be shorter than the Keycloak access-token lifetime
    # (default 5m in this realm) so oauth2-proxy swaps in a fresh token before
    # clients see an expired one. Leave unset to disable refresh (default
    # oauth2-proxy behavior, which causes stranded-session symptoms).
    cookieRefresh: "3m"

    # Where oauth2-proxy keeps the session (gd-C2Sl6ClxAY).
    #   cookie (default): the whole session (access + id + refresh token) is in
    #     the browser cookie, split into ~4KB chunks. Two concurrent refreshes
    #     (a page polling every 15s) each Set-Cookie their own chunks, the
    #     browser keeps a mix and every request fails "cookie signature not
    #     valid" -> 401 -> sign-in redirect until the user re-authenticates.
    #   redis: the session lives in Redis and the cookie is a small ticket, so
    #     a refresh is one atomic server-side write. Use this wherever a page
    #     polls while a tab is open (the beads-viewer front door).
    # Sessions are lost if the in-chart Redis restarts (no persistence): users
    # silently re-authenticate through the IdP SSO session.
    sessionStore:
      type: cookie
      redis:
        # Managed/external endpoint. Empty => the in-chart Redis Service
        # (requires deploy.enabled=true).
        host: ""
        port: 6379
        # Optional AUTH. When set, the in-chart Redis runs --requirepass and
        # oauth2-proxy gets OAUTH2_PROXY_REDIS_PASSWORD from this Secret.
        passwordSecret: ""
        passwordKey: "password"
        deploy:
          enabled: true
          image:
            # Same image the litellm Redis uses (one mirror entry).
            repository: library/redis
            tag: "7.4-alpine"
            digest: ""
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          nodeSelector: {}
          tolerations: []
          affinity: {}

    # Allowed email domains for authentication. Users with emails outside
    # these domains are rejected by oauth2-proxy. Use ["*"] to allow all
    # domains (NOT recommended for public-facing deployments).
    emailDomains:
      - "*"

    # GitLab group-membership allowlist. Only effective with provider=gitlab
    # (the prod + staging front doors). Each entry is a GitLab full group path
    # (e.g. "example-org"); oauth2-proxy admits a session only if the
    # user is a member of one of these groups, queried from the gitlab.com
    # userinfo `groups` claim. Kept ALONGSIDE emailDomains as defense-in-depth
    # (a user must be both in an allowed domain AND in an allowed group). Empty
    # by default so the Keycloak/oidc path is unaffected. See ka-0000005030 /
    # ka-0000002569.
    gitlabGroups: []

    # OIDC scopes — "groups" scope requests Keycloak group membership claim
    scope: "openid email profile groups"

    # Extra oauth2-proxy CLI args.
    #
    # --cookie-csrf-per-request-limit=4 caps the number of per-request CSRF
    # cookies oauth2-proxy will set before evicting the oldest one. This
    # bounds the cumulative `_gardenio_oauth2_<hash>_csrf` cookie header so
    # Slack link unfurls + auto-refresh tabs cannot pile cookies up past
    # the ALB / upstream header-size limit (8 KiB) and crash the page with
    # a 400 Bad Request. Knob added in oauth2-proxy v7.11.0 (PR #2615);
    # only effective when --cookie-csrf-per-request=true (it is, see the
    # forwardauth deployment template). 4 leaves headroom for a few
    # concurrent in-flight login attempts (multi-tab, link unfurl racing
    # with a real click) while keeping the worst-case header bounded.
    # Bug: ka-0000007747. Earlier diagnosis: ka-0000001516.
    extraArgs:
      - "--cookie-csrf-per-request-limit=4"

    # Force-logout-on-403 redirect (ka-0000000378, design ka-0000006780,
    # epic ka-0000005759). When forwardauth rejects with 403 (stale cookie,
    # missing group, expired refresh-token, email-domain mismatch), Traefik
    # currently leaks a bare "403 Forbidden" page to the browser. Toggling
    # this on installs:
    #   - a Traefik `errors` Middleware (gardenio-forwardauth-errors) that
    #     matches status 403 and rewrites the body via the landing service.
    #   - a /403 nginx location on the landing pod that serves a meta-refresh
    #     HTML page bouncing the browser through /oauth2/sign_out?rd=<orig>
    #     so the cookie is cleared and the user is re-driven through Keycloak.
    #   - the new middleware chained AFTER gardenio-forwardauth on every
    #     protected IngressRoute (beads-viewer, grafana, coopmux,
    #     slack-bridge UI, beads API).
    #
    # **Default off.** Auth path is load-bearing — leave OFF until E2E green
    # AND the auth-403 vs app-403 disambiguation spike (Risk #3 in the
    # design doc, gardenio/docs/research/forwardauth-403-force-logout.md)
    # is verified against the deployed Traefik version.
    #
    # See gardenio/docs/research/forwardauth-403-force-logout-impl-spike.md
    # for the disambiguation trade-off and the X-Forwarded-Uri header
    # check we did before flipping this on.
    forceLogoutOn403:
      enabled: false
      # Absolute URL of the /oauth2/sign_out endpoint that the meta-refresh
      # page bounces through. Defaults to https://<forwardAuth.ingress.host>/oauth2/sign_out
      # when empty. Override only if a different host serves /oauth2/*.
      signOutURL: ""

    # Ingress for oauth2-proxy callback (/oauth2/ paths)
    ingress:
      enabled: true
      host: "gardenio.example.com"

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

gitlabBridge:
  enabled: false

  image:
    repository: gitlab-bridge
    tag: ""
    digest: ""
    pullPolicy: Always

  replicaCount: 1

  # Log level: debug, info, warn, error
  logLevel: ""

  # GitLab connection and polling config
  gitlab:
    # GitLab instance URL (required, e.g., "https://gitlab.com")
    baseURL: ""
    # K8s secret name with key: api-token (required).
    # Plaintext apiToken value is no longer accepted (AUDIT §J6) — template
    # will fail-close if set via --set.
    secretName: ""
    # Plaintext webhookSecret value is no longer accepted (AUDIT §J6) —
    # template will fail-close if set. Use webhookSecretName below.
    webhookSecret: ""
    # K8s secret name with key: webhook-secret (required for HMAC verification).
    webhookSecretName: ""
    # GitLab group ID to poll for merged MRs (required)
    groupID: ""
    # Polling interval (e.g., "5m", "10m")
    pollInterval: "5m"
    # Bot username — notes from this user are ignored to prevent feedback loops
    botUsername: ""

  # @mention handler — spawns agents when commenters @mention the bot on MRs.
  # Authorization is gated on the commenter's user bead (type=user,
  # kind=config) carrying the "mention" capability. Grant at runtime with:
  #   kd update <user-bead> \
  #     --field gitlab_username=<name> \
  #     --field capabilities='["mention"]'
  # Directory auto-refreshes every 5 minutes. Fails closed when the user
  # bead is missing or lacks the capability. (AUDIT §J10 / ka-0000001267)

  # Poll interval for the shared TriggerEngine (GitLab MR / pipeline triggers).
  # Leave empty to use the binary default (60s).
  triggerPollInterval: ""

  # Observability — scrape wiring and Prometheus alerting rules off the
  # gitlab-bridge's :9092 /metrics endpoint. Two parallel scrape paths, same as
  # jira-bridge:
  #   Path A — prometheus.io/* pod annotations on the Deployment (annotation
  #            scraping, e.g. an in-chart vmagent).
  #   Path B — VMServiceScrape (templates/gitlab-bridge/vmservicescrape.yaml),
  #            gated on monitoring.victoriaMetrics.enabled (operator clusters,
  #            incl. prod-gardenio-eks). Matches the Service `metrics` port by
  #            name. Absent until ka-0000001045 — before that nothing scraped
  #            this pod in prod and gardenio_gitlab_webhook_* never existed.
  metrics:
    # Scrape interval for the VMServiceScrape (Path B). Falls back to
    # monitoring.victoriaMetrics.interval when unset. Key mirrors
    # jiraBridge.metrics.serviceMonitor for consistency.
    serviceMonitor:
      interval: 30s

    prometheusRule:
      # Inbound-webhook DARK-HOOK DEADMAN (GAP-C of the non-AVA webhook carve-out
      # ka-0000005632; the GitLab twin of jiraBridge.metrics.prometheusRule.
      # webhookDeadman). gitlab_webhook_metrics.go already exposes the
      # deliveries COUNTER, but a counter alone cannot tell a dark hook
      # (deregistered / mis-secreted — nothing increments it) from a genuinely
      # quiet upstream. The bridge Go-computes gardenio_gitlab_webhook_dark=1
      # when NO authenticated, well-formed delivery arrived within the deadman
      # window while an independent scan of the group's recently-updated merge
      # requests still reports activity — matter existed upstream and we
      # received nothing. Keying "alive" on AUTHENTICATED deliveries makes a
      # wrong-secret hook (token_failed only) page rather than read as healthy;
      # a genuinely quiet upstream never pages. Renders two alerts:
      # GitLabWebhookDark (receive path dark) and GitLabWebhookMonitorDeadman
      # (the monitor itself not evaluating). Off by default; per-env overlays
      # opt in. Requires the monitoring.coreos.com/v1 PrometheusRule CRD. NOTE:
      # the monitor only runs when gitlab.groupID is set (the upstream-activity
      # confirmation arm needs a group scope) — enable only where a group is
      # configured.
      webhookDeadman:
        enabled: false
        # Alert severity (Alertmanager routing key). page in prod (a dark
        # webhook silently drops the whole conversational + MR-sync surface),
        # ticket in e2e, none (silenced) in dev.
        severity: "page"
        # Lookback window for the dark gauge's max_over_time. Together with `for`
        # this encodes "dark for N minutes" — the dark state must persist across
        # the window+hold before paging. A single flapping scrape inside the
        # window keeps the alert asserted (max_over_time==1) so a brief recovery
        # does not clear it prematurely. The bridge already encodes the 2h
        # no-delivery judgement (GITLAB_WEBHOOK_DEADMAN_WINDOW); this window only
        # rides out scrape flapping of the already-computed verdict.
        window: "15m"
        # `for:` hold before the dark alert pages. Rides out scrape gaps and a
        # transient single-cycle blip.
        for: "10m"
        # Lookback for the deadman leg: if
        # gardenio_gitlab_webhook_evaluations_total has not increased over this
        # window (or the series is absent), the monitor is not evaluating at
        # all. Should comfortably exceed the monitor's evaluation interval
        # (GITLAB_WEBHOOK_DEADMAN_INTERVAL, default 5m) so a normal cadence never
        # trips it.
        deadmanWindow: "15m"
        # `for:` hold before the deadman leg pages.
        deadmanFor: "10m"
        # Labels merged onto the PrometheusRule METADATA so the cluster's
        # ruleSelector (e.g. kube-prometheus-stack release label) discovers it.
        prometheusRuleSelectorLabels: {}
        #   release: kube-prometheus-stack
        # Extra labels merged into both alerts (route to a specific oncall).
        labels: {}
        # Extra annotations merged into both alerts.
        annotations: {}

  # AI-authored MR human-approval enforcement (DEVOPS-730). Opt-in: when
  # enabled, the bridge applies an idempotent approval rule to every MR opened
  # by a configured bot user, requiring `approvalsRequired` human approvals
  # from the reviewer group/users below before the MR can merge. Disabled by
  # default so the mechanism can ship dark and be turned on once the team
  # agrees the policy (reviewer count, the `ai-reviewers` group ID). Requires a
  # GitLab tier with MR-level approval rules (Premium); on CE it degrades to a
  # logged no-op. The token in gitlab.secretName must have api scope.
  aiApproval:
    enabled: false
    # Approval-rule name; matched verbatim for idempotency.
    ruleName: "AI-generated change review"
    # Human approvals required (the 1-vs-2 policy decision).
    approvalsRequired: 1
    # Comma-separated GitLab usernames whose MRs are treated as AI-authored.
    # Empty defaults to gitlab.botUsername.
    botUsernames: ""
    # Comma-separated GitLab group IDs that may satisfy the rule — typically
    # the `ai-reviewers` group. At least one of reviewerGroupIDs /
    # reviewerUserIDs must be set, else the enforcer skips (never creates an
    # unsatisfiable rule).
    reviewerGroupIDs: ""
    # Comma-separated GitLab user IDs that may satisfy the rule (alternative or
    # supplement to reviewerGroupIDs).
    reviewerUserIDs: ""

  # Release-drought deadman watchdog (ka-0000002594, P0 post-mortem
  # ka-0000007176). Polls GitLab tags + Releases and alerts LOUDLY when the
  # oldest unreleased calver tag has waited longer than `threshold` — i.e.
  # tags are being pushed but no release fully succeeds. Alerts flow through
  # the trigger-notice bead relay (Slack via slack-bridge), a P0 bug bead,
  # and Prometheus gauges on the gitlab-bridge /metrics endpoint — NONE of
  # which the release pipeline's own (historically broken) notify path is
  # part of. Opt-in per env: enable on exactly ONE bridge per release lane
  # (prod), or staging/ephemeral envs watching the same GitLab project would
  # duplicate every alert.
  releaseDrought:
    enabled: false
    # GitLab project path whose release lane is watched.
    project: "example-org/gardenio"
    # Alarm when the oldest unreleased calver tag is older than this.
    threshold: "6h"
    # Poll cadence (two GET requests per tick).
    interval: "15m"
    # Re-alert cadence while a drought persists. Empty = threshold.
    repeat: ""
    # File a P0 bug bead (deduped on the open release-drought label) on the
    # first alert of an episode, so the drought enters the ready queue.
    createBead: true
    # Project label for the filed bug bead.
    beadProject: "gardenio"
    # Optional PrometheusRule off the watchdog gauges — an alerting leg with
    # zero beads/Slack dependency, plus a deadman rule for the watchdog
    # itself. Requires the monitoring.coreos.com/v1 CRD; per-env opt-in.
    prometheusRule:
      enabled: false
      severity: "page"
      for: "5m"
      # Extra labels for rule-selector matching (e.g. vmalert selectors).
      prometheusRuleSelectorLabels: {}
      labels: {}
      annotations: {}

  # Escalation auto-reaper (ka-0000004105 + ka-0000007203). Periodically closes
  # open escalations a human already satisfied out-of-band, via two detectors:
  #  1. MR-witness (ka-0000004105): the approve/merge ask was satisfied in the
  #     GitLab UI. Verb-allowlist guarded — reaps ONLY on {approve_and_merge_mr,
  #     approve_only_do_not_merge, merge_mr} and NEVER on an apply/deploy/
  #     provision/mint ask, even one referencing a merged MR.
  #  2. Orchestration-layer (ka-0000007203): the operator recorded the
  #     resolution ON THE BEAD without closing it — a terminal result_status
  #     ({success,partial}) on a still-open escalation, or a human-operator
  #     resolve-comment (/reap, "resolved out-of-band", …). No GitLab call, so it
  #     covers the non-MR apply/deploy/mint asks detector 1 cannot. NEVER reaps
  #     on result_status=failure or an agent comment.
  # Together they stop the operator queue carrying ~15% dead-oldest phantoms. ON
  # by default (the code default is enabled); set enabled:false to disable, or
  # dryRun:true to log intended reaps without closing during rollout.
  escalationReaper:
    enabled: true
    # Sweep cadence. Coarse by design — the phantoms it clears sat open for days.
    interval: "10m"
    # Log what WOULD be reaped without commenting/closing. Safe rollout lever.
    dryRun: false
    # Group namespace used to expand a bare short repo name found in a merge
    # escalation's title ("gardenio !7656") into a full GitLab project path so the
    # reaper can GET the MR and auto-close the escalation once it merges
    # (bug ka-0000006851). Empty → the reaper's built-in default.
    # Override only for a re-namespaced / self-hosted GitLab.
    mrGroupNamespace: ""

  # CI/CD compute-minutes metrics collector (Phase G, ka-0000002378; design
  # docs/research/cicd-minutes-metrics.md). Publishes gardenio_cicd_* series on
  # the bridge's existing :9092 /metrics endpoint (annotation-scraped — no
  # ServiceMonitor). Two independent series, each opt-in:
  #   - jobDurationEnabled: compute minutes reconstructed from per-job
  #     durations. Runs on the existing gitlab.secretName GAT.
  #   - firstPartyEnabled: GitLab's own billed usage/quota via GraphQL
  #     ciMinutesUsage. NEEDS a group-owner-scoped token (escalation
  #     ka-0000006982). Leave off until that token replaces the GAT, else its
  #     scrape-error series just increments while the job-duration series flows.
  cicdMetrics:
    jobDurationEnabled: true
    firstPartyEnabled: false
    # GitLab project paths whose pipelines are polled for the job-duration
    # series (comma-joined into CICD_METRICS_PROJECTS). Runs on the existing
    # gitlab.secretName GAT — verified able to page /projects/:id/jobs for both.
    projects:
      - example-org/monorepo
      - example-org/gardenio
    # Base poll cadence and pipeline updated_after lookback.
    interval: "120s"
    window: "60m"
    # First-party GraphQL namespace global id + REST group path + usage history.
    firstPartyNamespaceID: ""
    firstPartyGroupPath: ""
    lookbackMonths: 12

  service:
    type: ClusterIP
    port: 8092

  ingress:
    enabled: false
    host: ""
    # Traefik entrypoints the /webhook IngressRoute binds. Default (empty =
    # web/websecure) suits edges where the shared entrypoints are directly
    # reachable by the webhook sender. Environments whose shared edge sits
    # behind an authenticating proxy SaaS senders can't traverse (e.g.
    # AVA-fronted prod) bind a dedicated public entrypoint instead:
    #   entryPoints: ["webhooks"]
    # (provisioned cluster-side).
    entryPoints: []
    # IP whitelist for webhook source IPs (recommended — defense in depth on top of HMAC).
    # Default disabled so existing prod upgrades do not require sourceRange to be set;
    # operators opt in by flipping enabled=true and providing sourceRange.
    # Empty + enabled fails install fast (see templates/gitlab-bridge/ingressroute.yaml).
    ipWhitelist:
      enabled: false
      # GitLab.com SaaS Web/API (webhook) egress CIDRs — VERIFY before enabling,
      # they drift and a stale/narrow list silently drops real deliveries:
      #   https://docs.gitlab.com/ee/user/gitlab_com/#ip-range
      # Current published set (as of 2026-08-29 — re-verify at each review):
      #   - 34.74.90.64/28
      #   - 34.74.226.0/24
      # Self-managed GitLab — set the CIDR of your GitLab instance's egress here.
      sourceRange: []
      # ipStrategy.depth — how Traefik selects the client IP for the match:
      #   0 (default) = match the DIRECT remote IP (no ipStrategy). Correct when
      #     the edge preserves the true client IP in the connection and injects
      #     no X-Forwarded-For — e.g. an L4 NLB with PROXY protocol v2 wired to
      #     Traefik proxyProtocol.trustedIPs, which lands the real client in
      #     ClientHost. This is the gardenio public `webhooks` entrypoint shape.
      #   >=1 = read the Nth X-Forwarded-For entry from the right. ONLY for edges
      #     that prepend a trusted XFF chain (an L7 proxy hop). A wrong depth
      #     silently drops every delivery — verify against edge access logs.
      depth: 0
    # Rate limiting for webhook endpoint — default enabled with conservative caps
    # (well above realistic webhook traffic; mirrors beads CI route shape).
    rateLimit:
      enabled: true
      average: 20
      burst: 40

  # Plain networking.k8s.io/v1 Ingress for /webhook — for clusters WITHOUT
  # Traefik (e.g. prod-gardenio-eks, which runs only the AWS Load Balancer
  # Controller, ingressclass "alb"). Coexists with (does not replace) the
  # Traefik `ingress` block above; enable exactly one per environment.
  # Controller-specific behavior is driven entirely by the caller-supplied
  # annotations map — the chart hardcodes no ALB specifics.
  webhookIngress:
    enabled: false
    # IngressClass name (e.g. "alb" for the AWS Load Balancer Controller).
    className: ""
    # External webhook hostname (required when enabled), e.g.
    # gitlab-webhook.gardenio.example.com. DNS + cert coverage are the
    # operator's responsibility (external-dns / ACM / Route53).
    host: ""
    # Path + pathType for the webhook route. The bridge serves POST /webhook;
    # Exact keeps /healthz, /readyz and anything else off the internet.
    path: "/webhook"
    pathType: "Exact"
    # Annotations — fully caller-supplied. For ALB, typical set:
    #   alb.ingress.kubernetes.io/scheme: internet-facing
    #   alb.ingress.kubernetes.io/target-type: ip
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...   # workload wildcard cert
    #   alb.ingress.kubernetes.io/healthcheck-path: /healthz         # bridge 404s on "/"
    #   # Source-IP allowlisting (defense in depth on top of HMAC) — GitLab.com
    #   # SaaS webhook egress CIDRs, see:
    #   #   https://docs.gitlab.com/ee/user/gitlab_com/#ip-range
    #   # (34.74.90.64/28 et al; self-managed GitLab: use your instance's
    #   # egress CIDR). Do NOT hardcode here — ranges rotate; verify at flip time.
    #   alb.ingress.kubernetes.io/inbound-cidrs: "35.227.35.0/24,34.74.226.0/24"
    annotations: {}
    # Optional spec.tls (e.g. for nginx-style controllers; ALB terminates TLS
    # via the certificate-arn annotation instead and ignores this).
    tls: []

  # Memory headroom: steady state is ~19Mi, but webhook bursts and the periodic
  # reconcilers spike well above that. At the previous 128Mi limit the bridge
  # OOMKilled 19 times in 19h (ka-0000007917) — and because each crash drops
  # in-flight webhook deliveries that GitLab does NOT retry, every restart
  # silently lost @gardenio mentions. The specific spike (an unpaged whole-corpus
  # task fetch in the note path) is fixed, but the margin stays: this pod is the
  # sole ingest path for MR webhooks, so crashing is data loss, not a retry.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 512Mi

  # State persistence — survives pod restarts, preserves SSE last-event-ID and dedup state.
  # When disabled (default), an emptyDir is used (state lost on restart, CatchUp covers dedup).
  persistence:
    enabled: false
    size: 100Mi
    storageClass: ""

  # Pod scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# github-bridge — GitHub App webhook receiver (gd-GreWIwME20, plan gd-j5OxXb3ySp)
# =============================================================================
# The GitHub counterpart of gitlabBridge. It receives GitHub App deliveries,
# verifies X-Hub-Signature-256 (HMAC-SHA256, constant-time, fail-closed on an
# empty secret), drops replays (X-GitHub-Delivery dedupe with a TTL), and maps
# them onto beads: pull_request -> mr_* fields + forge=github, check_suite and
# workflow_run -> mr_pipeline_status, reviews and comments -> agent nudge and
# thread quote. With githubApp.appId set it also mints per-repo installation
# tokens to post `gb squawk --to-mr` squawks as PR comments and to run the
# review-thread resolver. Runbook: docs/runbooks/github-bridge.md. Default OFF.
#
# Retires the 2026-10-19 PAT cliff on the webhook/API side: auth is the App's
# shared secret plus an installation token, never a PAT.
githubBridge:
  enabled: false

  image:
    repository: github-bridge
    tag: ""
    digest: ""
    pullPolicy: Always

  # Recreate strategy + 1 replica: the replay cache is in memory.
  replicaCount: 1

  # Log level: debug, info, warn, error
  logLevel: ""

  # Convert a crew PR opened as ready (head agent/*, base main) back to a draft
  # and comment why, so it runs the draft CI tier until the agent runs
  # `gb pr ready` (plan gd-WFMvg9sDKE task 1.4). Needs githubApp.appId and the
  # App's pull_requests: write. Rendered as GITHUB_BRIDGE_DRAFT_AGENT_PRS.
  draftAgentPRs: false

  # Webhook secret (REQUIRED when enabled; the chart refuses to render without
  # it). Mounted as a file. Written to SSM by scripts/github-app-register.py.
  webhookSecret:
    secretName: gardenio-github-webhook-secret
    secretKey: webhook-secret
    externalSecret:
      enabled: false
      secretStoreName: ""
      secretStoreKind: ClusterSecretStore
      remoteRef: /gardenio/github-app/agents/webhook-secret
      refreshInterval: 1h

  # Beads daemon credential while machinePrincipal is OFF (the rollback; the
  # daemon has refused the shared static token since 2026.306.1). Empty
  # tokenSecret uses beads.tokenSecret / kd-beads-token; otherwise a bridge
  # token Secret. Not rendered with machinePrincipal on.
  beads:
    tokenSecret: ""
    tokenKey: github-bridge

  # Machine principal (release recorder gd-305kriuXdT; every other call
  # gd-tCMXlS9fXW, decision gd-aZrncmZbkD "tight"). With it on, every bridge
  # daemon call and the SSE stream authenticate as the Keycloak service
  # account of clientId (client-credentials grant against
  # gardenio.keycloak.tokenURL), and BEADS_DAEMON_TOKEN is not rendered.
  # Requires: a keycloak.clients entry for clientId with serviceAccount.enabled
  # and the gardenio-machine-release-recorder and gardenio-machine-github-bridge
  # realm roles, the client in beads.machineClients, and a Secret <secretName>
  # with key clientSecret the OPERATOR creates by hand. The mount is optional:
  # without the Secret the pod starts and every daemon call fails closed
  # (auth_unavailable). Check the bridge log for HTTP 401/403, not readiness.
  machinePrincipal:
    enabled: false
    clientId: gardenio-github-bridge
    secretName: gardenio-machine-gardenio-github-bridge

  # App credentials for installation-token minting. Optional: with appId empty
  # the bridge still receives and verifies webhooks. privateKeySecret defaults
  # to the Secret the controller's agents.githubApp already syncs (same App).
  githubApp:
    appId: ""
    installationId: ""
    apiUrl: ""
    privateKeySecret: gardenio-github-app-private-key
    mountPath: /etc/gardenio/github-app

  # PR conflict scanner (cmd/github-bridge/conflicts.go, docs/pr-conflicts.md):
  # writes mr_merge_state and the other mr_conflict_* fields from a blobless
  # mirror plus `git merge-tree`. Off while repo is empty; needs
  # githubApp.appId (the token reads contents). The mirror is an emptyDir at
  # /var/lib/github-bridge, and the bridge creates mirror/ inside it so git
  # owns the directory it runs in.
  conflictScanner:
    repo: ""         # owner/name; rendered as CONFLICT_SCAN_REPO
    interval: ""     # Go duration; empty = binary default (5m)
    mirrorSizeLimit: 2Gi

  # Replay protection for X-GitHub-Delivery. GitHub redelivers failed
  # deliveries inside 3 days under the same GUID, but those are only redelivered
  # after a non-2xx, and a failed attempt is forgotten here, so 24h is ample.
  replay:
    ttl: ""          # Go duration; empty = binary default (24h)
    maxEntries: ""   # empty = binary default (100000); full cache sheds with 503

  service:
    type: ClusterIP
    port: 8101

  # Public Traefik IngressRoute for POST /webhook (only that path is routed).
  ingress:
    enabled: false
    host: ""
    entryPoints: []
    # Defense in depth on top of HMAC: GitHub's webhook source ranges are the
    # `hooks` list at https://api.github.com/meta. They change, so they are not
    # hardcoded here; verify at flip time.
    ipWhitelist:
      enabled: false
      sourceRange: []
      depth: 0
    rateLimit:
      enabled: true
      average: 20
      burst: 40

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================================================
# LiteLLM Proxy — bundled LLM proxy for cost tracking and routing
# =============================================================================
# Deploys a LiteLLM proxy instance inside the gardenio namespace.
# Uses the existing gardenio PostgreSQL for state storage (spend data, virtual keys).
# Disabled by default — enable per-environment with litellm.enabled=true.
litellm:
  enabled: false

  image:
    repository: ghcr.io/berriai/litellm
    # v1.95.0 — latest STABLE upstream release (ka-0000005360). Taken as a
    # deliberate no-prerelease-risk refresh off v1.84.8, NOT as a targeted fix for
    # the ~190Mi/min unbounded leak (ka-0000001241). Be honest about that: the
    # evicted-LLM-client hypothesis (upstream #35492) was REFUTED against the live
    # prod pod by ka-0000008121 — heap census showed
    # litellm.in_memory_llm_clients_cache.cache_dict holding 6 entries (not pinned
    # at 200 with hundreds orphaned), FD/socket/connection counts stayed flat
    # while RSS jumped +179MB in a 20s window, and cgroup memory.stat read sock=0
    # / anon=5.68GB. The leak is pure Python anon heap, not connection state.
    #
    # Why NOT v1.97.0-rc.1: it is the only tag carrying #35492, and #35492 is not
    # our bug. A prerelease on the fleet LLM data-plane buys nothing here.
    # For the record, no stable release carries that fix — presence of
    # litellm/caching/evicted_client_closer.py: v1.94.2 ✗, v1.95.0 ✗,
    # v1.96.0-rc.1 ✗, v1.97.0-dev.2 ✓, v1.97.0-rc.1 ✓ (also absent from branches
    # stable/1.94.x and stable/1.95.x).
    #
    # Retains upstream fix 583bdd3 ("fix(bedrock): allowlist Bedrock Invoke body
    # fields and filter all anthropic-beta values") that v1.84.8 was originally
    # pinned for — v1.82.0 forwarded Claude Code's Anthropic `context_management`
    # field straight into the Bedrock Invoke body on the /v1/messages passthrough
    # (ignoring drop_params), so every bedrock-* agent 400'd with
    # "context_management: Extra inputs are not permitted" (litellm#25931,
    # ka-0000004508). Confirmed still present in v1.95.0.
    tag: "v1.95.0"
    pullPolicy: IfNotPresent

  # HA (ka-0000007221 / epic ka-0000005228 H2). 2 replicas, operator-approved
  # 2026-08-10 (decision ka-0000007407, option `ha-now`) AHEAD of H4/Redis.
  #
  # WHY NOW, AND WHY NOT WAIT FOR REDIS: litellm has a confirmed unbounded memory
  # leak (~190Mi/min, bug ka-0000001241) that OOMKills the pod regardless of the
  # limit — measured ~6min between kills at 2Gi, ~16min at 4Gi, ~38min at 8Gi. At
  # replicaCount=1 on strategy:Recreate, EVERY kill was a TOTAL fleet LLM outage
  # (~78s each; 159 of them in one 24h window => litellm unavailable ~14% of the
  # day). No memory limit fixes that shape. Two replicas do: the Service is
  # ClusterIP, so agents already load-balance across Endpoints via kube-proxy,
  # and an OOM-reaped pod becomes a blip on in-flight requests instead of a
  # fleet-wide stall. Availability here does NOT require Redis — without it the
  # two replicas keep INDEPENDENT in-memory router state (rate-limit counters,
  # model cooldowns), so budgets can double-count and cooldowns diverge. That is
  # wrong-but-tolerable next to total outages; H4 (ka-0000003463) still fixes the
  # accuracy half and should land after. Spend/virtual-key truth is already in
  # Postgres, so the two replicas agree on the things that matter for billing.
  #
  # Two replicas also re-arm two dormant safety nets: the chart's conditional
  # strategy restores RollingUpdate maxSurge:1/maxUnavailable:0 (zero-downtime
  # config rollouts, instead of the terminate-then-create Recreate blip), and the
  # PDB below actually renders, so node drains stop being able to take the whole
  # data-plane. Headroom re-verified 2026-08-10 on the untainted `infra` managed
  # nodegroup that litellm is confined to (no tolerations): 6 x m5.large at
  # ~7.0Gi allocatable with 2.2-3.7Gi requested, so a second 2Gi-request replica
  # fits on any of them.
  replicaCount: 2

  # Keep the replicas off one another's node — two pods on one node do not remove
  # the SPOF this epic targets. Soft (ScheduleAnyway / preferred) by design: see
  # the rationale block in templates/litellm/deployment.yaml. Both are inert at
  # replicaCount=1, which renders byte-identically to before.
  # The labelSelector is supplied by the template from the canonical litellm
  # selectorLabels helper — do not hand-write it here (a hand-written selector
  # silently drifts from the Deployment's own selector, and the constraint then
  # spreads the wrong pod set or nothing at all).
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
    # Second dimension: spread across AZs once the nodes allow it. Also
    # ScheduleAnyway — the infra pool may be single-AZ at any given moment.
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

  # Soft pod anti-affinity, belt-and-braces with the hostname spread above.
  # Suppressed entirely when litellm.affinity is set explicitly (that wins) and
  # at replicaCount=1. Set enabled:false to drop it.
  podAntiAffinity:
    enabled: true
    weight: 100

  # PodDisruptionBudget for the proxy (ka-0000006118, epic ka-0000005228).
  # Renders unconditionally (gd-27vcHmrurh): maxUnavailable:1 is a safe drain
  # guard even at replicaCount=1 (it only blocks eviction while the pod is
  # currently unhealthy — see templates/litellm/pdb.yaml), and upgrades to
  # real quorum protection once litellm runs HA (>=2 replicas, see H2/H4
  # under the epic).
  pdb:
    enabled: true
    maxUnavailable: 1

  # LiteLLM proxy port
  port: 4000

  # Database name in the shared postgres instance
  database: litellm

  # Explicit database URL override (bypasses auto-wiring from postgres.enabled)
  databaseURL: ""

  # K8s secret name containing the LiteLLM master key (key: "token").
  # If empty, defaults to "<release>-litellm-master-key".
  masterKeySecret: ""

  # Enable verbose debug logging
  detailedDebug: false

  # Forward client headers (e.g. Authorization) to the upstream LLM API.
  # Required for OAuth token forwarding to Anthropic.
  forwardClientHeaders: true

  # Thinking-capture telepathy producer (ka-0000002697 / spike ka-0000004553).
  # When enabled, a LiteLLM CustomLogger extracts extended-thinking PLAINTEXT
  # from each completion and publishes it to coop.events.messages.<actor>.thinking
  # — the subject the beads-viewer telepathy consumer reads. This is the only
  # source that sees reasoning plaintext (Anthropic strips it on persist, so
  # coop's log-watcher path only ever emits empty thinking). The callback module
  # ships via configMap (rendered from files/litellm/litellm_thinking_callback.py)
  # and nats-py is pip-installed by the install-callback-deps init container.
  # Requires litellm.enabled AND in-cluster NATS reachable from the proxy pod.
  thinkingCapture:
    enabled: false
    # nats-py version pip-installed into the callback-deps emptyDir.
    natsPyVersion: "2.9.0"
    # NATS subject prefix (must match what the viewer consumer subscribes to).
    natsPrefix: "coop.events"
    # NATS URL override. Empty → derived from in-cluster nats (gardenio.natsURL).
    natsURL: ""
    # K8s Secret (key: token) for NATS auth. Empty → no token (auth-disabled
    # clusters like an e2e release). On prod set this to the agent/infra token
    # secret so the proxy can publish to the agent subject namespace.
    natsTokenSecret: ""

  # 1-hour prompt-cache TTL upgrade (epic ka-0000003469, impl ka-0000004405,
  # lever investigation ka-0000003909). When enabled, a LiteLLM pre-call
  # CustomLogger rewrites Claude Code's default 5-minute ephemeral cache_control
  # breakpoints to carry ttl:"1h" on the upstream Anthropic /v1/messages call.
  #
  # WHY A CALLBACK (not the documented cache_control_injection_points setting):
  # that config-only setting is wired ONLY through the OpenAI /chat/completions
  # path (Logging.get_chat_completion_prompt). 100% of gardenio agents use the
  # Anthropic-native /v1/messages PASSTHROUGH route, which never invokes it — so
  # it is a no-op for our traffic. The pre_call_hook the callback uses DOES run
  # on every route_type including anthropic_messages. Full write-up: ka-0000003909.
  #
  # The 1h TTL is GA — the extended-cache-ttl-2025-04-11 beta header is no longer
  # required (ttl:"1h" on the cache_control block suffices). Economics: a 1h
  # cache WRITE costs 2x base input (vs 1.25x for 5m); READS stay 0.1x either
  # way — a net win at ~22% utilization with respawn-heavy traffic, where the
  # >5m gaps between respawns turn 5m caches into cold misses.
  #
  # PURELY ADDITIVE + default-OFF: when enabled=false the callback configMap,
  # mount, and litellm_settings.callbacks entry are all omitted, so existing
  # overlays render identically. The callback module is pure stdlib (no nats, no
  # network) and ships via configMap (rendered from
  # files/litellm/litellm_cache_ttl_callback.py). Requires litellm.enabled.
  cacheTTL:
    enabled: false
    # Target TTL stamped on ephemeral cache breakpoints. "1h" or "5m" only;
    # "5m" acts as an in-place kill switch (the Anthropic default — nothing is
    # upgraded) without removing the callback. Wired to the proxy via the
    # LITELLM_CACHE_TTL env var.
    ttl: "1h"

  # Database init container — creates the litellm database on first deploy.
  # Uses the postgres image to run CREATE DATABASE IF NOT EXISTS.
  dbInit:
    enabled: true
    # statement_timeout for the litellm database (gd-oih6JxjJMM). db-init runs
    # ALTER DATABASE ... SET statement_timeout on every rollout, so it applies
    # to every new LiteLLM connection. Empty RESETs it to the server default
    # (no limit). It exists for GET /spend/tags, which is a GROUP BY over all of
    # LiteLLM_SpendLogs: on 2026-10-31 each scan took 7-16 s, callers hung up
    # at 10 s, and Postgres kept running every abandoned scan until five ran at
    # once on the 2 vCPU platform node. The controller's reader waits 60 s
    # (tagSpendReadTimeout), so keep this below that.
    # It also caps LiteLLM's own startup migrations: if an upgrade's migration
    # rewrites LiteLLM_SpendLogs (an index build on a large table), set ""
    # for that rollout.
    statementTimeout: "20s"

  # Spend-log retention (gd-oih6JxjJMM). A period renders LiteLLM's
  # general_settings.maximum_spend_logs_retention_period (and _interval), and
  # LiteLLM then deletes older LiteLLM_SpendLogs rows in 1000-row batches.
  #
  # OFF by default: do not set a period until the controller stops reading
  # lifetime totals from LiteLLM_SpendLogs. GET /spend/tags (the only source of
  # gardenio_tag_cost_usd and of the session reconciler's baselines) sums
  # whatever rows are left, so under retention:
  #   - gardenio_tag_cost_usd and gardenio_agent_attributed_cost_usd become a
  #     rolling N-day sum that drops at every cleanup run, not once. Every
  #     cost panel, the /garden farm and the tag-cost and unattributed-spend
  #     alerts read them through increase(), which counts a drop as a counter
  #     reset. Under VictoriaMetrics' rule a drop over 1/8 of the value (the
  #     first run, and a daily run at 7d) adds the whole remaining total as new
  #     spend; a smaller drop is absorbed but still under-reads by the pruned
  #     spend.
  #   - the reconciler books an agent's lifetime cost as tag total minus its
  #     first baseline. For an agent name that spends over more than N days
  #     (a respawning gardener), pruning drops the total below that baseline
  #     and the next settlement overwrites total_cost_usd with 0.
  # gardenio_unattributed_cost_usd is already windowed: /global/spend reads
  # LiteLLM's MonthlyGlobalSpend view, the last 30 days.
  #
  # The k3s overlay sets this block to a 7d period on cron "17 3 * * *", with
  # tagSpendSource: daily (gd-FGD4OdAR8f). Set retention here or in
  # extraGeneralSettings, not both; the render fails on both.
  #
  # Set tagSpendSource: daily (below) before setting a period: the controller
  # then reads both from LiteLLM_DailyTagSpend, which the cleanup leaves intact.
  spendLogsRetention:
    # e.g. "7d". Empty renders nothing.
    period: ""
    # How often the cleanup runs; LiteLLM's default is 1d. The interval counts
    # from pod start, so a LiteLLM pod that restarts more often than this
    # never runs the cleanup.
    interval: "1d"
    # A crontab (e.g. "17 * * * *") runs the cleanup on the wall clock
    # instead of the interval. Empty uses the interval.
    cron: ""

  # Where the controller reads lifetime per-tag spend (gardenio_tag_cost_usd and
  # the session reconciler's baselines), as LITELLM_TAG_SPEND_SOURCE
  # (gd-Um9gnz9FuW). Empty leaves the controller's default, auto.
  #   auto        reads GET /spend/tags (a LiteLLM_SpendLogs scan) and the
  #               LiteLLM_DailyTagSpend aggregate, serves /spend/tags until every
  #               agent:/role:/project:/model: tag agrees within $0.50 or 0.5%,
  #               then reads only the aggregate. The controller logs "tag spend
  #               totals agree" at cutover and "disagree" (worst tags) otherwise.
  #               It re-checks on every start, so once retention prunes
  #               SpendLogs it would never cut over again: pin daily first.
  #   daily       reads only the aggregate. Required before spendLogsRetention.
  #   spend-tags  reads only GET /spend/tags (the fallback).
  tagSpendSource: ""

  # Custom model definitions (overrides the defaults derived from litellm_aliases.go).
  # When empty, the ConfigMap includes default models for claude-opus-5-5-oauth,
  # claude-opus-5-oauth, claude-opus-4-8-oauth, claude-opus-4-7-oauth,
  # claude-opus-4-6-oauth, claude-sonnet-5-5-oauth, claude-sonnet-5-oauth,
  # claude-sonnet-4-6-oauth,
  # claude-fable-5-1-oauth, claude-fable-5-oauth, and anthropic/claude-haiku-4-5.
  models: []

  # Bedrock Titan embedding model (ka-0000007591, epic ka-0000000560). When
  # enabled, the ConfigMap APPENDS a `bedrock-titan-embed-v2` model to the
  # default model_list so the in-cluster proxy can serve kbeads semantic-search
  # embeddings (POST /embeddings {model: bedrock-titan-embed-v2}) — mirroring
  # the external devops litellm, which defines it as
  #   model: bedrock/amazon.titan-embed-text-v2:0  +  aws_region_name: us-east-1
  # (verified live: GET /v1/model/info → output_vector_size 1024, mode embedding).
  #
  # The 1024-dim output MUST match the kbeads pgvector column width
  # (migration 005_bead_embeddings) — do not change `model` to a variant that
  # emits a different vector size without also widening the column.
  #
  # CREDENTIALS: the upstream Bedrock InvokeModel call needs AWS credentials.
  # This `embedding.*` credential strategy is the SINGLE AWS credential path for
  # the litellm pod and serves BOTH the Titan embedding model AND any Bedrock
  # CHAT models enabled via `litellm.bedrock` below — one pod rides one
  # ServiceAccount/role, so the IRSA role (or static-creds Secret) configured
  # here must allow bedrock:InvokeModel on every enabled Bedrock model (the
  # Titan embedder and, if `bedrock.enabled`, the chat inference profiles).
  # The default in-cluster litellm pod runs on SA `default` with
  # automountServiceAccountToken:false and no AWS env, so one of the two
  # credential strategies below MUST be wired or the /embeddings call 5xxs at
  # the Bedrock auth boundary:
  #   - irsa:        annotate a dedicated litellm ServiceAccount with an
  #                  eks.amazonaws.com/role-arn whose role allows
  #                  bedrock:InvokeModel on amazon.titan-embed-text-v2:0.
  #                  Re-enables automountServiceAccountToken so the EKS
  #                  pod-identity webhook can inject the web-identity token.
  #   - staticCreds: mount AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (+ optional
  #                  AWS_SESSION_TOKEN) from a K8s Secret (e.g. ESO-synced from
  #                  AWS SM) for clusters/accounts without an IRSA trust path.
  # Exactly one strategy must be configured: setting both irsaRoleArn and
  # staticCredsSecret (or neither, while embedding.enabled) is rejected by the
  # render-time guard in templates/litellm/validate-embedding.yaml.
  embedding:
    enabled: false
    # Routed model name clients POST to (must match beads.embedding.model and
    # BEADS_EMBED_MODEL). Keep as bedrock-titan-embed-v2 to mirror external.
    modelName: "bedrock-titan-embed-v2"
    # Underlying Bedrock model id. 1024-dim; matches the pgvector column width.
    bedrockModel: "amazon.titan-embed-text-v2:0"
    # AWS region the Bedrock model is invoked in.
    region: "us-east-1"
    # IRSA strategy: role-arn for a dedicated litellm ServiceAccount. When set,
    # the chart creates `<release>-litellm` SA carrying this annotation and
    # flips automountServiceAccountToken on for the proxy pod so the
    # web-identity token is injected (the SDK default credential chain then
    # assumes the role for the bedrock:InvokeModel call).
    irsaRoleArn: ""
    # Static-credential strategy: name of a K8s Secret carrying AWS keys. Used
    # for accounts without an IRSA trust path. Keys default to the standard
    # AWS_* env var names; override below if the Secret uses different keys.
    staticCredsSecret: ""
    accessKeyIdKey: "AWS_ACCESS_KEY_ID"
    secretAccessKeyKey: "AWS_SECRET_ACCESS_KEY"
    # Optional session-token key for STS/temporary credentials. Empty → no
    # AWS_SESSION_TOKEN env is rendered.
    sessionTokenKey: ""

  # Bedrock CHAT models (litellm Stage-3, ka-0000002573, epic ka-0000000560).
  # Appends Bedrock-backed chat model groups to the proxy's model_list so the
  # in-cluster proxy can serve accounts that point at Bedrock inference
  # profiles (e.g. the litellm-bedrock OAuth-exhaustion safety-net account
  # ka-0000003488, model bedrock-claude-opus-4-7). Mirrors the external devops
  # litellm's bedrock-* groups (model ids confirmed live 2026-06-14 via
  # /model/info on https://litellm.example.com).
  #
  # PURELY ADDITIVE + default-off: when enabled=false the model_list is
  # unchanged, so existing overlays that only set
  # `embedding.*` keep rendering identically.
  #
  # CREDENTIALS: these models reuse the `embedding.*` AWS credential path above
  # (same pod, same SA/role). Enabling `bedrock` WITHOUT a credential strategy
  # configured under `embedding` is rejected by the render-time guard in
  # templates/litellm/validate-embedding.yaml — the IRSA role / static-creds
  # Secret MUST allow bedrock:InvokeModel on every model id listed here.
  bedrock:
    enabled: false
    # AWS region the Bedrock chat models are invoked in. The external proxy
    # leaves region unset on the per-model params (it resolves region from the
    # pod's AWS env/region default); set it explicitly here for the in-cluster
    # proxy so the InvokeModel call targets the intended region.
    region: "us-east-1"
    # Bedrock chat model groups. Each entry renders one model_list item:
    #   - model_name: <name>        # routed name clients POST as `model`
    #     litellm_params:
    #       model: bedrock/<bedrockModel>
    #       aws_region_name: <region>   # from .region above unless overridden
    # `bedrockModel` is the Bedrock inference-profile / model id WITHOUT the
    # leading "bedrock/" (the template prepends it). Defaults mirror the
    # external devops litellm's bedrock-* groups so account beads can flip
    # base_url with no model rename. Override `region` per-model if needed.
    models:
      - modelName: "bedrock-claude-opus-5"
        bedrockModel: "us.anthropic.claude-opus-5"
      - modelName: "bedrock-claude-opus-4-7"
        bedrockModel: "us.anthropic.claude-opus-4-7"
      - modelName: "bedrock-claude-haiku-4-5"
        bedrockModel: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
      # Z.AI GLM 5 (zai.glm-5) — first-party serverless Bedrock chat model
      # (epic ka-0000002312; Matt decision ka-0000003230: company policy forbids
      # OpenRouter/Z.ai managed APIs, so Bedrock is the only policy-compliant GLM
      # path). Selectable in Slack as `--model=glm` and via the glm-bedrock
      # account, both resolving through the glm-5 model_group_alias below.
      #
      # region OVERRIDE (us-east-2): unlike the Anthropic models above, GLM 5 has
      # NO `us.` cross-region inference profile — it is In-Region only (AWS model
      # card). The bedrockModel is therefore the BARE `zai.glm-5` id (no `us.`
      # prefix), and region is pinned to us-east-2 (an In-Region-supported region
      # for zai.glm-5) rather than inheriting the us-east-1 bedrock.region
      # default. The configmap renders `aws_region_name` per-model from this key.
      # The IRSA role's policy grants InvokeModel on
      # arn:aws:bedrock:us-east-2::foundation-model/zai.glm-5.
      - modelName: "bedrock-glm-5"
        bedrockModel: "zai.glm-5"
        region: "us-east-2"

  # Bedrock IMAGE-GENERATION model (ka-0000008102, plan ka-0000005980 Phase 5 —
  # optional raster plan-badges). Appends an image model to the proxy's
  # model_list so the in-cluster proxy can serve POST /v1/images/generations
  # {model: <modelName>} — the mount already 401s (not 404s) today, it just has
  # no image model in model_list. Mirrors the embedding/bedrock-chat wiring:
  #
  #   - model_name: <modelName>
  #     litellm_params:
  #       model: bedrock/<bedrockModel>       # e.g. amazon.nova-canvas-v1:0
  #       aws_region_name: <region>
  #     model_info:
  #       mode: image_generation
  #
  # PURELY ADDITIVE + default-off: when enabled=false the model_list is
  # unchanged, so existing overlays render identically. This is the CHART half
  # of the "If yes: add an image model" task — it is INERT until an operator
  # both (a) flips enabled=true with a credential strategy and (b) grants the
  # underlying AWS Bedrock model-access on gardenio-prod (Nova Canvas / Titan
  # Image are access-gated per-account; the agent IRSA role has zero bedrock:*
  # today — measured 2026-08-14). The two enablement prerequisites live outside
  # this chart:
  #   1. AWS model-access grant for the image model (operator, AWS console).
  #   2. The litellm IRSA role (litellm.embedding.irsaRoleArn) OR static creds
  #      must allow bedrock:InvokeModel on the image model id — this reuses the
  #      SAME single AWS credential path as the Titan embedder and bedrock-chat
  #      groups (one pod, one SA/role). Enabling imageGeneration WITHOUT a
  #      credential strategy is rejected by the render-time guard in
  #      templates/litellm/validate-embedding.yaml (same guard as embedding /
  #      bedrock chat — see gardenio.litellm.needsBedrockCreds).
  imageGeneration:
    enabled: false
    # AWS region the Bedrock image model is invoked in. Nova Canvas
    # (amazon.nova-canvas-v1:0) is available in us-east-1.
    region: "us-east-1"
    # Routed model name clients POST to as `model` on /v1/images/generations.
    modelName: "bedrock-image"
    # Underlying Bedrock image-model id WITHOUT the leading "bedrock/" (the
    # template prepends it). Default is Amazon Nova Canvas; override for Titan
    # Image or another Bedrock image model the grant covers.
    bedrockModel: "amazon.nova-canvas-v1:0"

  # ADDITIVE model_group_alias additions (maps client-facing model ids -> model
  # groups defined in model_list). Rendered under router_settings.model_group_alias
  # in the ConfigMap — LiteLLM only honors the alias map there, NOT at top level
  # (ka-0000005911).
  #
  # SINGLE SOURCE OF TRUTH (ka-0000003830): the chart ALWAYS renders the
  # claude-*/glm-5 base map (matching litellm_aliases.go) and MERGES these keys on
  # top — setting this NO LONGER replaces the base. So an overlay declares ONLY its
  # env-specific additions (e.g. the grafana OSS-chat OpenAI->Bedrock aliases
  # gpt-4o -> bedrock-claude-opus-4-7, gpt-4o-mini -> bedrock-claude-haiku-4-5 in
  # the RWX-era staging overlay, epic ka-0000002011 Phase 0) rather than
  # re-copying the base map. A key here that collides with a base key overrides it
  # (last-wins in the rendered YAML). NOTE: every alias TARGET must be a defined
  # model_name in model_list — the Bedrock groups only exist when
  # litellm.bedrock.enabled=true, so do not alias to them where bedrock is off.
  modelGroupAlias: {}

  # Router-level fallbacks (ka-0000008144). Rendered under
  # router_settings.fallbacks in the ConfigMap — a LiteLLM List[Dict[str,List[str]]]
  # mapping a primary model group to an ordered list of fallback groups. LiteLLM
  # v1.84.8 routes 429 rate_limit_error (incl. Anthropic "monthly spend limit")
  # to `litellm.RateLimitError`, which the generic `fallbacks` chain retries on
  # (verified source-level at the pinned tag: router.py async_function_with_fallbacks
  # is in the /v1/messages anthropic_messages passthrough path — the very wrapper
  # that emits the "Fallbacks=None" error agents saw when it was unset). Fires on
  # generic errors incl. rate limits; NOT content/context-window fallbacks.
  #
  # Default arms (plan:opus55-release T1 moved the degrade target from opus-5
  # to opus-5.5, the fleet's new default Opus):
  #   fable-5-1 → opus-5.5 — a usage-limit 429 on the fable tier
  #     (claude-fable-5-1-oauth, the `fable` selector's target since
  #     ka-0000002744) auto-retries on claude-opus-5-5-oauth.
  #   fable-5   → opus-5.5 — same arm for the superseded fable-5 group, kept
  #     for beads still pinning it and for rollback.
  #   opus-4-8  → opus-5.5 — KEEP even though no role bead pins opus-4-8 any
  #     more (ka-0000001786 flipped the last 17, crew-e2e ka-0000004014 among
  #     them, to claude-opus-5-oauth). opus-4-8 stays a routable group for
  #     rollback and for older sessions, so the arm still has to exist; the
  #     history below is why. When crew-e2e PINNED claude-opus-4-8-oauth its
  #     per-agent key budget exhausted with runtime,
  #     and without a fallback arm the /v1/messages passthrough logged
  #     "No fallback model group found for original model_group=claude-opus-4-8-oauth"
  #     and the harness spin-looped a "monthly spend limit" 429 forever, holding
  #     the pod Running + health-probe-green while making zero progress
  #     (bug ka-0000007458: two crew-e2e pods, 78 identical 429s over ~3h). This
  #     arm lets an exhausted opus-4-8 key fail over to opus-5.5 (a separate,
  #     gated Opus account) instead of looping. Unlike the removed haiku→opus
  #     arm below, opus-4-8 is ITSELF a gated subscription Opus model, so
  #     spilling onto another gated Opus does not invert a fallback's intent —
  #     it moves an exhausted gated key to a fresh gated key of the same class.
  #   opus-5    → opus-5.5 — a role bead or crew still PINNED to the prior
  #     default (claude-opus-5-oauth) fails over to the new default the same
  #     way opus-4-8 does, instead of dead-ending on its own exhausted budget.
  #
  # There is deliberately NO anthropic/claude-haiku-4-5 → claude-opus-5-5-oauth
  # arm (removed, bug ka-0000001221; it was added in ka-0000000592). Anthropic
  # gates SUBSCRIPTION Opus on the request being recognizable as Claude Code
  # (parent ka-0000006551); Haiku 4.5 is NOT gated and returns 200 in every
  # request shape tested — including shapes where Opus 429s. So a haiku→opus
  # fallback converts a request on a WORKING, ungated model into a request on a
  # gated one that can fail: it can only ever make things worse for a
  # Haiku-pinned agent. On 2026-08-02 it killed two Haiku-pinned gardeners
  # (ka-0000003254, ka-0000004583) whose own model was healthy — the haiku call
  # was retried onto opus-5 and it was the FALLBACK that produced the fatal
  # "monthly spend limit" 429. Falling back from the cheapest, ungated model to
  # the most expensive, gated one inverts the intent of a fallback. A pinned
  # haiku route that genuinely exhausts spills nowhere and blocks — that is the
  # correct, non-fatal behavior for an ungated model (the operator/probe rotates
  # the account), and is strictly better than being dragged onto a gated route.
  #
  # BOTH the primary (claude-fable-5-1-oauth / claude-fable-5-oauth /
  # claude-opus-4-8-oauth / claude-opus-5-oauth) and the target
  # (claude-opus-5-5-oauth) of every arm are always defined in the default
  # model_list, so the fallback target is never dangling. Every entry's primary
  # key AND targets MUST be a defined model_name in model_list (LiteLLM
  # validates one key per dict; a dangling target 400s "no healthy
  # deployments").
  #
  # Baked as a chart DEFAULT (like modelGroupAlias) rather than per-overlay
  # because the deploy-values overlays are standalone, non-merging --values
  # files; a chart default is the only way every overlay inherits it without
  # maintaining the entry in each. Set to [] in an overlay to disable.
  fallbacks:
    - claude-fable-5-1-oauth: ["claude-opus-5-5-oauth"]
    - claude-fable-5-oauth: ["claude-opus-5-5-oauth"]
    - claude-opus-4-8-oauth: ["claude-opus-5-5-oauth"]
    - claude-opus-5-oauth: ["claude-opus-5-5-oauth"]

  # Extra router_settings merged into the config (sibling of model_group_alias).
  # Reserved for advanced LiteLLM router knobs (routing_strategy, num_retries,
  # etc.). Default {} renders nothing extra.
  extraRouterSettings: {}

  # Extra litellm_settings merged into the config.
  extraSettings: {}

  # Extra general_settings merged into the config.
  extraGeneralSettings: {}

  # Redis for multi-replica router coordination (H4, ka-0000003463, epic
  # ka-0000005228). LiteLLM's in-memory router state — rate-limit counters,
  # model cooldowns, and the router cache — is PER-PROCESS. At replicaCount>=2
  # (H2, ka-0000007221) that state DIVERGES across replicas: each pod counts
  # spend/rate-limit independently and cools a model down in isolation, so a
  # budget is double-counted and a model reaped as unhealthy on one pod stays
  # live on the other. Spend/virtual-key TRUTH is already shared (Postgres), so
  # this is wrong-but-tolerable for availability — but Redis is what makes the
  # accuracy half correct: LiteLLM's Router uses it as the shared backend for
  # exactly those three coordination surfaces (rate-limit, cooldown, cache).
  #
  # PURELY ADDITIVE + default-OFF: when enabled=false NOTHING renders — no
  # router_settings.redis_* keys, no env, no in-chart Redis workload, no
  # NetworkPolicies — so every existing overlay renders byte-identically. Turn
  # this on in the HA overlays (prod runs replicaCount=2) to coordinate the two
  # replicas.
  #
  # WIRING: when enabled, the chart renders `redis_host` + `redis_port` under
  # router_settings (the ONLY place LiteLLM honors them, same rule as
  # model_group_alias / fallbacks — ka-0000005911), which flips the Router onto
  # the shared Redis backend. An optional AUTH password is injected as the
  # LITELLM_REDIS_PASSWORD env and referenced as `redis_password:
  # os.environ/LITELLM_REDIS_PASSWORD` so the secret never lands in the rendered
  # ConfigMap.
  #
  # TWO BACKENDS (pick one):
  #   - IN-CHART (deploy.enabled=true): the chart renders a single-node Redis
  #     Deployment+Service (PSA-restricted, ClusterIP, no persistence — router
  #     coordination state is ephemeral and self-heals, so a Redis restart just
  #     re-warms counters/cooldowns). host/port default to that Service. This is
  #     the zero-external-dependency path for dev/test/inbox and for prod stacks
  #     that do not want a managed Redis.
  #   - MANAGED/EXTERNAL (deploy.enabled=false + host set): point host/port at a
  #     managed endpoint (e.g. ElastiCache). Supply the AUTH token via
  #     passwordSecret.
  redis:
    # Master switch. false => the entire Redis surface is absent (config keys,
    # env, workload, policies) and the render is byte-identical to pre-H4.
    enabled: false

    # Redis endpoint the Router connects to. Leave host empty to default to the
    # in-chart Service (requires deploy.enabled=true) — a redis.enabled=true with
    # an empty host AND deploy.enabled=false is rejected by the render-time guard
    # in templates/litellm/validate-redis.yaml (nowhere to connect).
    host: ""
    port: 6379

    # Optional AUTH. When passwordSecret is set the chart injects
    # LITELLM_REDIS_PASSWORD (from secret key passwordKey) into the proxy and
    # renders `redis_password: os.environ/LITELLM_REDIS_PASSWORD` so the token
    # stays out of the ConfigMap. Empty => no auth (the in-chart Redis runs
    # auth-less on a ClusterIP reachable only by the litellm pod via
    # NetworkPolicy; a managed endpoint should set this).
    passwordSecret: ""
    passwordKey: "password"

    # In-chart single-node Redis workload. When true, renders the Deployment +
    # Service (and, with networkPolicies.enabled, the redis ingress + the
    # litellm->redis egress leg). host/port above default to this Service.
    deploy:
      enabled: false
      image:
        # Flat repository name: <mirrorImageRegistry>/<repository> must stay at
        # 2 path segments (GitLab registry nesting limit). Mirror dst
        # `redis:7.4-alpine` matched the pre-Actions mirror entry.
        repository: library/redis
        tag: "7.4-alpine"
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      nodeSelector: {}
      tolerations: []
      affinity: {}

  # Extra environment variables for the LiteLLM container.
  extraEnv: []

  # Allocator swap — the DURABLE FIX for the litellm OOM (ka-0000003951; RCA
  # ka-0000000169, leak bug ka-0000001241). The ~190Mi/min unbounded RSS growth
  # that OOMKilled the proxy is glibc main-arena FRAGMENTATION, not a Python
  # object leak: on a live prod pod, of 3044Mi RSS, 2549Mi sat in `[heap]` with
  # `mallinfo2` showing 1180Mi of freed-but-unreturned chunks (`fordblks`) and
  # `keepcost≈0` (the free holes are mid-heap, so glibc's top-of-brk shrink can
  # never reclaim them). A single injected `malloc_trim(0)` handed 1.23GB back
  # to the OS instantly, live, with no restart — which a real leak could not do.
  # The hot `/v1/messages` passthrough churns large transient bytes/str JSON
  # buffers (worsened by a 429 retry-traceback storm) that fragment the arena.
  #
  # jemalloc returns freed pages to the OS aggressively and does not suffer
  # glibc's per-arena high-water-mark retention, so RSS tracks the true working
  # set (~1.3–1.5GB) instead of ratcheting to the limit. This is the standard,
  # well-worn fix for a Python-server-on-glibc leak of exactly this shape.
  #
  # WHY AN initContainer (not just an LD_PRELOAD env): the pod runs the UPSTREAM
  # ghcr.io/berriai/litellm image, which does NOT ship libjemalloc — and Helm's
  # LD_PRELOAD to a missing .so is a SILENT no-op (the dynamic linker warns to
  # stderr and continues with glibc malloc), so the fix would look applied while
  # doing nothing. When enabled, the `stage-jemalloc` initContainer
  # (templates/litellm/deployment.yaml) `apk fetch`es the libjemalloc2 package
  # from the image's baked-in Chainguard/Wolfi apk repo (verified reachable as
  # uid 65534 in-pod: apk fetch + tar-extract + LD_PRELOAD load confirmed via
  # /proc/self/maps and jemalloc's mallctl symbol), extracts libjemalloc.so.2
  # into a shared emptyDir mounted read-only at /opt/jemalloc on the main
  # container, and the container sets LD_PRELOAD to it. Mirrors the existing
  # seed-prisma-engine copy-into-emptyDir pattern; purely additive and default
  # -off, so existing overlays render byte-identically when disabled.
  #
  # MALLOC_ARENA_MAX=2 is belt-and-suspenders: it caps the number of malloc
  # arenas (fewer independent fragmented pools). Under jemalloc it is inert
  # (jemalloc ignores glibc's MALLOC_* tunables); if LD_PRELOAD ever fails to
  # load it still reins in glibc arena sprawl, so it is set unconditionally with
  # the allocator swap. Rendered into the litellm container env.
  jemalloc:
    # Master switch. When true, renders the stage-jemalloc initContainer + the
    # /opt/jemalloc emptyDir + LD_PRELOAD & MALLOC_ARENA_MAX env on the proxy.
    enabled: false
    # libjemalloc.so.2 path INSIDE the shared emptyDir (mounted at mountPath on
    # the main container). The initContainer stages the .so here; LD_PRELOAD
    # points at <mountPath>/libjemalloc.so.2.
    mountPath: /opt/jemalloc
    # apk package that provides libjemalloc.so.2 in the Chainguard/Wolfi base.
    # The `jemalloc` package ships only CLI tools (jemalloc.sh/jeprof); the .so
    # lives in the `libjemalloc2` subpackage — fetch that.
    package: libjemalloc2
    # MALLOC_ARENA_MAX value stamped on the container (belt-and-suspenders).
    # Empty string omits the env entirely.
    arenaMax: "2"

  # Memory sizing (ka-0000003606) — a MITIGATION for a confirmed leak, NOT a fix.
  # Read this before "fixing" litellm OOMKills by raising the limit again.
  #
  # This limit was 2Gi against a 1.1-1.2Gi baseline / ~1.9Gi peak (~5% headroom)
  # and the proxy entered a sustained OOMKill crashloop: 0 restarts/day through
  # 08-05, then 1 -> 9 -> 101 -> 173 -> 159/day (exit 137, reason=OOMKilled).
  # Each kill costs ~78s of TOTAL fleet LLM outage (CrashLoopBackOff sleep +
  # `prisma migrate deploy` on boot + uvicorn startup; measured OOMKill
  # 17:48:43 -> "Application startup complete" 17:50:01), because the proxy is
  # a single replica on strategy:Recreate (ka-0000005233) with no second pod to
  # absorb traffic. 159 x 78s = 3.4h of a 24.1h window => litellm was
  # unavailable ~14% of the day / 8.6 min per hour.
  #
  # RAISING THE LIMIT DOES NOT STOP THE OOMKILLS. Verified empirically, not
  # assumed: at 4Gi the pod still OOMKilled (startedAt 18:25:41 -> terminated
  # 18:42:21), a 16.6 min lifetime vs ~9.1 min at 2Gi. Doubling the ceiling
  # bought only ~1.8x the lifetime — the signature of UNBOUNDED growth, whereas
  # a genuinely undersized limit would have been fixed outright. Growth measured
  # ~190Mi/min, monotonic, no plateau (1320 -> 1515 -> 1733 -> 1895Mi in ~75s).
  # So litellm leaks; 4Gi merely stretches the interval between fleet outages
  # (~6.6/h -> ~3.6/h) and buys headroom for the real fix. Leak: ka-0000001241.
  #
  # The leak is UPSTREAM, not our config (checked so this is not re-litigated):
  # the rendered config carries no cache block and no callbacks (litellm_settings
  # is only drop_params + forward_client_headers_to_llm_api), and both optional
  # callback paths here (cacheTTL, thinkingCapture) are default-off and off in
  # prod. Not the version bump alone either — v1.84.8 landed 06-16 and ran 7
  # weeks at 0 restarts/day — nor load growth: agent concurrency shows no step at
  # the 08-06 onset (08-05 peaked at 21 concurrent agent pods, 08-06 ran 5-7).
  #
  # DO NOT just bump this to 8Gi when it recurs — that trades memory for a
  # slightly longer interval and leaves the SPOF intact. The fix that removes
  # the user-visible pain is availability: replicas >= 2 (epic ka-0000005228,
  # child ka-0000007221 / H2). The Service is ClusterIP, so agents already
  # load-balance across endpoints via kube-proxy; with 2 replicas an OOM-reaped
  # pod is a blip on in-flight requests instead of a TOTAL fleet LLM outage.
  # Note the RollingUpdate surge above also returns at replicaCount > 1.
  #
  # requests 2Gi keeps the scheduler honest about the real steady-state footprint
  # (the old 1Gi request under-declared it, so the kubelet placed the pod as if
  # it were half its true size). Headroom verified on the untainted `infra` EKS
  # managed nodegroup that hosts it: 6 nodes x ~7.0Gi allocatable, 1.4-3.3Gi
  # requested, so a 2Gi request schedules with room to spare on any of them.
  #
  # cpu request 500m (was 200m) — bumped for H5 (HPA, epic ka-0000005228). The
  # CPU-Utilization HPA target below is a percentage of THIS request, so a too-low
  # request makes the utilization ratio jittery (a small absolute CPU move looks
  # like a huge percentage swing) and scales the fleet data-plane on noise. 500m
  # reflects the proxy's real busy-hour draw and gives the 70% target a stable
  # denominator. Still comfortably schedulable: even at maxReplicas the infra pool
  # (6 x 2 vCPU) absorbs it (worst case 6 x 500m = 3 vCPU of requests).
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

  # Horizontal Pod Autoscaler (H5, epic ka-0000005228). Renders
  # templates/litellm/hpa.yaml (autoscaling/v2) only when enabled AND
  # litellm.enabled. When active, the Deployment omits its own `replicas` field
  # so the HPA owns replica count (see deployment.yaml) — minReplicas holds the
  # HA floor at 2, matching replicaCount above, so turning the HPA on is
  # behaviour-preserving at baseline and only ADDS scale-up headroom under load.
  #
  # WHY min=2: the proxy is the fleet LLM data-plane (SPOF removal is the whole
  # point of this epic) — never let the autoscaler drop below the HA floor.
  #
  # METRICS. CPU utilization is a Resource metric served by metrics-server
  # (metrics.k8s.io), present on prod-gardenio-eks and on in-box k3s, so it is
  # ALWAYS on. The latency / in-flight-request signal is the better scaling
  # signal for an I/O-bound LLM proxy (CPU stays low while requests queue on slow
  # upstream tokens), but a Pods/custom metric needs a custom.metrics.k8s.io
  # adapter (prometheus-adapter / KEDA) exposing litellm's Prometheus series —
  # NOT installed on prod-gardenio-eks today (api-versions shows no
  # custom.metrics.k8s.io). So customMetric defaults OFF and the HPA runs on CPU
  # alone until an adapter is wired; flipping customMetric.enabled then adds the
  # Pods metric with zero template churn. LiteLLM exposes the raw series when its
  # Prometheus callback is on (e.g. litellm_requests_metric for in-flight-style
  # gauges, litellm_request_total_latency_metric for latency).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    # Percent of the cpu REQUEST above; scale up when the pods' mean CPU exceeds
    # this. Empty/omitted → the CPU metric is dropped entirely.
    targetCPUUtilizationPercentage: 70
    # Optional second Resource metric; omitted by default (the leak-driven memory
    # sizing makes memory a poor scaling signal here). Set to a percent to add it.
    targetMemoryUtilizationPercentage: null
    # Latency / in-flight-request custom metric. Requires a custom.metrics.k8s.io
    # adapter serving `name` as a Pods metric — see the METRICS note above.
    customMetric:
      enabled: false
      # Prometheus series name the adapter must expose as a per-pod Pods metric.
      name: litellm_requests_metric
      # AverageValue target across pods: mean in-flight requests/pod (a bare
      # number), or a latency Quantity ("500m" = 0.5s) if `name` is a latency series.
      targetAverageValue: "20"
    # Optional autoscaling/v2 scaling behaviour (stabilization windows, policies).
    # Empty → the HPA uses Kubernetes defaults.
    behavior: {}

  # Pod scheduling
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Soft nodeAffinity layered onto the default podAntiAffinity above (both
  # render together at replicas>1) rather than replacing it — see the
  # template's affinity block. Suppressed entirely when `affinity` above is
  # set explicitly. e.g. a lifecycle=spot preference (gd-cTobdw0kAL):
  #   nodeAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         preference:
  #           matchExpressions:
  #             - key: gardenio.io/lifecycle
  #               operator: In
  #               values: [spot]
  nodeAffinity: {}

# =============================================================================
# ResourceQuota (per-namespace caps — namespace-isolation audit §F1)
# =============================================================================
# Bounds the gardenio namespace footprint so a runaway controller or
# compromised agent cannot saturate the cluster on pods/CPU/memory/PVCs/
# services/secrets. Stamped on .Release.Namespace; fleet (child)
# namespaces get an analogous quota emitted by createFleetNamespace
# (gardenio/controller/cmd/gb/fleet.go) — keep `hard` here in sync with
# the controller defaults if you tighten one side.
#
# `hard` is rendered verbatim into ResourceQuota.spec.hard; any standard
# k8s ResourceQuota key (e.g. limits.cpu, count/<resource>.<group>) is
# accepted. Disable entirely on clusters that already enforce quotas via
# an external admission policy.
resourceQuota:
  enabled: true
  hard:
    pods: "200"
    requests.cpu: "200"
    requests.memory: 1Ti
    persistentvolumeclaims: "200"
    services: "50"
    secrets: "200"

# P7 Task 6 (spec D5): deny pod-network access to the EC2 instance metadata
# service (IMDS) without touching any other egress. Independent of
# networkPolicies.enabled. Every pod in a listed namespace may reach anything
# except 169.254.169.254 and fd00:ec2::254. Pods labelled gardenio.io/imds:
# allow are exempt ONLY in exemptLabelNamespaces, and agent pods
# (gardenio.io/agent) are never exempt. kube-system is deliberately absent
# (cluster-autoscaler, cloud controller). hostNetwork pods are not affected by
# NetworkPolicy at all.
imdsDeny:
  enabled: false
  namespaces: []
  exemptLabelNamespaces: []

# =============================================================================
# Edge backends (ingress NetworkPolicies for apps with no auth of their own)
# =============================================================================
# Plan ziti-to-keycloak, S2a (gd-hRltljHGon). Ingress-only policies (egress is
# untouched) that fence the three backends the public-edge sign-in design leans
# on, so only the edge, ziti-host and named in-cluster callers can reach them:
#   - gardenio-forwardauth (oauth2-proxy): only the edge namespace on :4180
#   - grafana: edge namespace, ziti-host, grafanaCallers
#   - beads-viewer: viewer-authproxy, ziti-host, viewerCallers (devAuthBypass
#     trusts X-Auth-Request-Email from ANY caller, so this one matters most)
# Independent of networkPolicies.enabled (which stays false: no default-deny).
# Once a pod is selected by one of these, everything not listed is denied, so
# the caller lists below must be complete.
edgeBackends:
  enabled: false

  # Namespace of the public edge nginx. Matched by the standard
  # kubernetes.io/metadata.name label.
  edgeNamespace: public-edge

  # Pod selector (matchLabels) for the Ziti host pods in the release namespace.
  # Kept until the Ziti path is retired (gd-xNMLrsgajy). Set to {} to drop it.
  zitiHostSelector:
    app: ziti-host

  # Admit zitiHostSelector on Grafana's port (edge-grafana). Ignored, and
  # ziti-host never admitted there, while grafana.auth.proxy.enabled: that port
  # trusts the identity header, which a ziti client could set itself
  # (gd-2TXOKAXFcQ). Set false to drop it on a cluster without auth.proxy too.
  # The beads-viewer policy is not affected.
  grafanaZitiHost: true

  # Pod selector (matchLabels) for the viewer's auth-proxy nginx (the
  # gardenio.clonk.tv front door). Set to {} to drop it.
  viewerAuthproxySelector:
    app: viewer-authproxy

  # In-cluster pods (release namespace) that call the oauth2-proxy
  # server-side, as full podSelector objects (matchLabels / matchExpressions).
  # Default none: the edge namespace is the only caller. A deployment whose
  # auth_request runs in the release namespace (e.g. viewer-authproxy) lists it
  # here.
  forwardauthCallers: []

  # In-cluster pods that call Grafana server-side. Browser-fetched surfaces
  # (iframes, links) are NOT callers: browsers arrive via the edge or ziti.
  #   agent pods     — `gb grafana render` (GRAFANA_URL, controller env)
  #   beads-viewer   — /grafana same-origin proxy (GRAFANA_UPSTREAM_URL)
  #   mcp-grafana(+write) — MCP servers (GRAFANA_URL)
  #   grafana-bridge — dashboard provisioning (grafanaBridge.grafana.url)
  grafanaCallers:
    - matchExpressions:
        - {key: gardenio.io/agent, operator: Exists}
    - matchLabels: {app.kubernetes.io/component: beads-viewer}
    - matchLabels: {app.kubernetes.io/component: mcp-grafana}
    - matchLabels: {app.kubernetes.io/component: mcp-grafana-write}
    - matchLabels: {app.kubernetes.io/component: grafana-bridge}

  # In-cluster pods admitted to Grafana's header-stripping agent port
  # (grafana.auth.proxy.agentPath.port). Rendered only when
  # grafana.auth.proxy.agentPath.enabled. Turning that on does not remove agents
  # from grafanaCallers above: the env must override grafanaCallers without the
  # agent selector (the chart refuses to render an agentPath whose
  # grafanaCallers still names gardenio.io/agent).
  grafanaAgentCallers:
    - matchExpressions:
        - {key: gardenio.io/agent, operator: Exists}

  # In-cluster pods that call the beads-viewer server-side.
  #   agent pods — BEADS_VIEWER_INTERNAL_URL (controller env, forwarded to
  #                agents) for `gb` viewer calls
  # slack-bridge / gitlab-bridge only put the viewer URL in links that a
  # browser follows, so they are not listed.
  viewerCallers:
    - matchExpressions:
        - {key: gardenio.io/agent, operator: Exists}

# Lands land namespaces (Track B spec §5.2, step 10.2 gd-NH44mohWlL). When
# enabled, the controller's Lands provisioner gives every tenant land its own
# namespace land-<name> (quota, limit range, default-deny NetworkPolicy, an
# RBAC-less land-agent ServiceAccount) and places the land's pods there under
# runsc. Renders the controller RBAC in
# templates/controller/lands-namespace-rbac.yaml and the controller env.
# Off by default: rolling it out is an operator change, together with gVisor
# (RuntimeClass runsc) on the nodes and a NetworkPolicy enforcement check.
# Enabled, it always renders its ValidatingAdmissionPolicies (Kubernetes
# 1.30+): the controller's land namespace writes, the agent manager role's
# bindings, and the tenant pods' runtime (runsc), ServiceAccount, token and
# hostPath. They cannot be turned off separately.
landNamespaces:
  enabled: false
  # RuntimeClass every tenant land pod runs under (controller env
  # LANDS_RUNTIME_CLASS). "" (the default) sets no runtimeClassName: tenant pods
  # run on the node's default runtime, runc (owner ruling 2026-11-01,
  # gd-iyZom5u11A: Lands ships without gVisor). "runsc" puts them under gVisor,
  # which needs that RuntimeClass and nodes that provide it (gvisor.*). The
  # land-pods admission policy requires exactly this value either way.
  runtimeClassName: ""
  # In-cluster egress peers a tenant pod may reach, replacing the controller's
  # defaults (beads 8080/9090, litellm 4000, coopmux 9800, nats 4222,
  # slack-bridge 8091 (its land listener, never the main port 8090), all by
  # app.kubernetes.io/component in the release namespace). Each: {name, namespace (default: release), labels, ports, udp}.
  egressPeers: []
  # Extra CIDRs cut from the tenant pods' internet egress, on top of RFC 1918,
  # 100.64.0.0/10 and 169.254.0.0/16: the cluster's pod and service CIDRs when
  # they sit outside those, and any IPv6 internal ranges.
  extraExceptCIDRs: []

# landgate v0 (Lands boundary gd-uYNbyW4a9Z §6 step 11, Phase 10 second wall,
# gd-ParwLpmgID). One transparent proxy per land between the edge's land door
# (/land/<name>/v1/*) and kbeads. It verifies the caller's own Keycloak bearer,
# requires the land's group (/project-<name>, /owners, /guests) and a scoped
# principal (gardenio-project-member, not gardenio-admin), 404s the routes the
# edge 404s, blanks identity headers and forwards the bearer untouched. It
# holds no fleet, coopmux or daemon token. The edge sends a land to its
# landgate only once gardenio-ziti/public-edge.yaml's $land_door_upstream map
# names it; until then the land door goes straight to the daemon as before.
landgate:
  enabled: false

  # Land names, one Deployment and Service (<fullname>-landgate-<land>) each.
  lands: []

  image:
    repository: landgate
    tag: ""
    digest: ""
    pullPolicy: Always

  logLevel: ""

  # Defaults: the Keycloak issuer (gardenio.keycloak.issuerURL) and
  # keycloak.oidcAudience, the same issuer and audience kbeads verifies.
  oidc:
    issuerURL: ""
    clientID: ""

  # The edge namespace, the only caller admitted to a landgate besides
  # verifier below. Defaults to
  # edgeBackends.edgeNamespace.
  edgeNamespace: ""

  # Crew -> edge deny (§4: "an escaped agent with a stolen bearer cannot act as
  # its owner"). With landgate on, every egress policy that selects agent pods
  # (imds-deny-agents, agent-internet-egress, dark-agent-egress, the land
  # namespaces' tenant pods) stops admitting the edge namespace, and these
  # CIDRs are cut from their ipBlock egress: the edge node's EIP and private IP
  # as /32s, and the edge node's podCIDR (kubectl get node <edge> -o
  # jsonpath='{.spec.podCIDR}'), since an ipBlock can match a pod IP. Other pods
  # on that node stay reachable through the namespace peer. The edge also
  # serves auth.clonk.tv and the other *.clonk.tv hosts, so agent pods lose
  # those too. A machine-client pod (kd/gb --as-machine) discovers the issuer
  # at the Keycloak Service instead (GARDENIO_OIDC_DISCOVERY_URL, gd-pnrrLJNUHn).
  crewDeny:
    edgeCIDRs: []

  # Land-door verifier (gd-Hq1PnUVOUC): agent pods in this namespace whose
  # gardenio.io/role is in roles may open a connection to the landgate of each
  # land in lands, and to no other landgate, so a crew can run the land-door
  # checks (gardenio/scripts/land-door-verify.sh) as that land's test owner.
  # Each land must also be in landgate.lands. The edge stays fenced (crewDeny);
  # landgate still verifies every bearer. Empty = no agent reaches a landgate.
  verifier:
    lands: []
    roles: []

  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []

# =============================================================================
# Network Policies (pod-to-pod isolation)
# =============================================================================
# When enabled, creates a default-deny ingress policy and per-service allow
# rules so only expected traffic flows between pods. Critically, this enforces
# AGENT-TO-AGENT NETWORK ISOLATION: agent pods can only reach infrastructure
# services (beads, NATS, coopmux, slack-bridge) and the public internet —
# they cannot communicate with other agent pods. This prevents data exfiltration
# between agents in multi-tenant deployments.
#
# Disabled by default to avoid breaking existing deployments — enable in
# environment values files after verifying your CNI plugin supports NetworkPolicy.
networkPolicies:
  enabled: false

  # Default-deny egress (audit finding F0, ka-0000006988).
  # When true, renders a `-default-deny-egress` NetworkPolicy (podSelector: {},
  # policyTypes: [Egress]) that blocks ALL egress from every pod in the namespace
  # by default, plus per-component allow-egress rules for controller, beads,
  # coopmux, NATS, postgres, forwardauth, landing, vmsingle, and
  # Components that already have explicit egress policies (agent,
  # slack-bridge, *-bridge, grafana, vmagent) are unaffected — NetworkPolicy
  # union semantics mean their existing allow rules still apply.
  #
  # Disabled by default to avoid breaking existing deployments. Recommended
  # rollout: enable on a staging env first, check no traffic is unexpectedly
  # dropped there, then enable on production.
  defaultDenyEgress: false

  # Controller (component: agents) egress. The controller must reach the
  # Kubernetes API server. When the API server is at a private/in-cluster IP
  # (e.g. private EKS endpoint, kubeadm clusters), set kubeApiServer.cidrs
  # to that endpoint CIDR; the internet 443 rule otherwise excludes RFC1918.
  # For public EKS API endpoints, leave empty — the internet 443 rule
  # (0.0.0.0/0 minus RFC1918+IMDS+CGNAT) covers them.
  controller:
    kubeApiServer:
      cidrs: []
      #   - 10.100.0.1/32

  # k3s / kube-router post-DNAT apiserver reach for LONG-RUNNING apiserver
  # clients: controller, grafana-bridge,
  # pod-state-metrics (ka-0000004987; hook-Job twin ka-0000003176). On k3s,
  # kube-proxy (iptables mode) DNATs the in-cluster apiserver VIP
  # 10.43.0.1:443 to <node-private-IP>:6443 in nat/PREROUTING — BEFORE the
  # embedded kube-router netpol controller evaluates egress ipBlocks — so the
  # 443-only apiserver allows above never match and every apiserver call is
  # REJECTED ("connection refused"): the controller cannot reconcile or spawn
  # agents. The post-DNAT node IP is DHCP-assigned and unknowable in a tracked
  # values file, so kubeApiServer.cidrs cannot express it either. Enable this
  # on k3s boxes (deploy-values/gardenio-inbox.yaml does) to add a dedicated
  # private-range TCP/6443 allow to those clients' egress policies. 6443 only
  # — 443 keeps its RFC1918/IMDS/CGNAT exclusions, so the no-pivot posture
  # survives for everything that is not a kube-apiserver. Leave off on EKS:
  # the VPC CNI matches ipBlocks pre-DNAT, so the overlays' pinned
  # kubeApiServer.cidrs (172.20.0.1/32) already covers the apiserver there.
  # (The seconds-lived pre-install/pre-upgrade hook Jobs carry this allow
  # unconditionally — see networkpolicies/pre-upgrade-hooks-egress.yaml.)
  apiServerPostDNAT: false

  # Beads daemon egress to an external (off-cluster) database — e.g. an Aurora
  # / RDS endpoint that resolves to an RFC1918 ENI inside the same VPC. The
  # default beads-egress rule only allows TCP/5432 to the in-cluster postgres
  # pod (component=postgres) + NATS + kube-dns. When beads.databaseURL points
  # at an external host AND defaultDenyEgress is on, the internet-443/80
  # escape hatches do NOT cover the DB (every internet allow EXCLUDES
  # RFC1918), so without this list beads loses its database the day
  # NetworkPolicy enforcement is turned on (ka-0000005077).
  #
  # Scope as tightly as you can. Prefer the resolved /32 of the endpoint
  # over a subnet range; switch to a subnet range only when running an
  # Aurora multi-AZ failover / read-replica setup whose endpoint can land
  # on a different ENI under failover. Port is fixed at TCP 5432.
  beads:
    externalDatabaseCIDRs: []
    #   - 10.30.155.42/32

  # LiteLLM proxy egress (epic ka-0000007994). When the bundled LiteLLM is on
  # (litellm.enabled) and defaultDenyEgress is set, the litellm pod is the ONLY
  # pod allowed to reach the upstream provider. By default that egress is the
  # wide internet-443 allow (0.0.0.0/0 minus RFC1918+IMDS+CGNAT) because the
  # provider (api.anthropic.com) fronts many CDN IPs. Set providerCIDRs to pin
  # the egress to specific ranges (e.g. a fixed corp-proxy IP or a published
  # provider range) — when non-empty it REPLACES the wide allow.
  litellm:
    providerCIDRs: []
    #   - 203.0.113.10/32

  # Alertmanager egress (epic ka-0000000770, decision ka-0000006149). When the
  # in-chart Alertmanager is on (alertmanager.enabled) and defaultDenyEgress is
  # set, Alertmanager needs internet-443 to POST the Slack incoming webhook
  # (hooks.slack.com). By default that is the wide internet-443 allow
  # (0.0.0.0/0 minus RFC1918+IMDS+CGNAT) because Slack fronts many CDN IPs. Set
  # slackWebhookCIDRs to pin the egress to specific ranges — when non-empty it
  # REPLACES the wide allow.
  alertmanager:
    slackWebhookCIDRs: []
    #   - 203.0.113.10/32

  # Traefik ingress controller — typically runs in a separate namespace.
  # Configure namespace and pod selectors so Traefik can reach services
  # that have ingress routes.
  traefik:
    namespaceSelector: {}
    #   kubernetes.io/metadata.name: traefik
    podSelector: {}
    #   app.kubernetes.io/name: traefik

  # kube-dns (CoreDNS) — pins egress DNS (UDP/TCP 53) to the cluster DNS
  # pods so policies can't exfiltrate DNS to arbitrary external resolvers.
  # Defaults match the standard kube-system/CoreDNS deployment shipped by
  # kubeadm, EKS, GKE, and most managed Kubernetes distributions. Override
  # if your cluster runs DNS under a different namespace or label set.
  kubeDns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns

  # EDP keycloak-operator (G8, ka-0000000554). When the in-cluster Keycloak
  # runtime is on (keycloak.runtime.enabled), the EDP keycloak-operator —
  # which usually runs in its own namespace (e.g. "operators") — must reach
  # keycloak:8080 to reconcile the ClusterKeycloak/Realm/Client CRs. The
  # keycloak-runtime-ingress policy otherwise allows only forwardauth / beads /
  # first-admin / Traefik, so the operator's ClusterKeycloak stays
  # connected:false and the realm/clients must be created by hand via kcadm.
  # Set the namespaceSelector (and optionally podSelector) of the operator's
  # namespace to add an allow-from rule. EMPTY namespaceSelector => no rule
  # rendered (the default; cloud envs bind the EDP realm to the external
  # ClusterKeycloak and never need this).
  keycloakOperator:
    namespaceSelector: {}
    #   kubernetes.io/metadata.name: operators
    podSelector: {}
    #   app.kubernetes.io/name: keycloak-operator

# ─────────────────────────────────────────────────────────────────────────────
# Per-project namespace RBAC (task ka-0000007869, epic ka-0000005677)
# ─────────────────────────────────────────────────────────────────────────────
# Chart-owned Roles + RoleBindings inside a project's OWN namespace — the grants
# that let a project's agent pods do anything there. Rendered by
# templates/project-namespace-rbac.yaml.
#
# WHY: every one of these on prod-gardenio-eks was hand-applied with `kubectl
# apply` and owned by nothing — no chart, no terraform, no manifest in any repo
# (swept live 2026-08-25: all carried only the last-applied-configuration
# annotation). Two consequences, both realized:
#   1. Nothing reconciles them. A namespace recreation or cluster rebuild loses
#      the grant with no record of what it was.
#   2. Nobody ever read them. Because they never went through an MR,
#      glm-lab/glm-lab-agent-admin held `apiGroups: ["", "apps", "batch"]` /
#      `resources: ["*"]` / `verbs: ["*"]` — full namespace admin — for 45 days
#      before anyone looked. It was revoked 2026-08-25 (see the glm-lab entry in
#      the overlay). Codifying is what puts a grant somewhere a reviewer can
#      object to it.
#
# DEFAULT OFF, TWICE OVER: `enabled: false` and `grants: {}`. The chart's default
# render is byte-identical to before this block existed. Concrete grants live in
# the environment overlay that owns them — for prod that is the
# projectNamespaceRbac block of deploy-values/gardenio-k3s.yaml.
#
# NOT IN SCOPE: namespace creation. Every `namespace` named here must already
# exist. These are grants inside somebody else's namespace.
#
# ADOPTING A PRE-EXISTING OBJECT: stamp app.kubernetes.io/managed-by=Helm and
# meta.helm.sh/release-{name,namespace} on it by hand before enabling its grant,
# or the atomic upgrade fails with "invalid ownership metadata".
#
# GRANT SHAPE (map key is the grant id; used as the default object name):
#
#   projectNamespaceRbac:
#     enabled: true
#     grants:
#       <id>:
#         enabled: true               # per-grant gate; false => renders nothing
#         namespace: <ns>             # REQUIRED, must already exist
#         project: <project>          # stamped as gardenio.io/project (the label
#                                     # `kubectl get roles,rolebindings -A -l
#                                     # gardenio.io/project` finds these by — omit
#                                     # it and the grant is invisible to that sweep)
#         name: <base-name>           # default: the map key
#         labels: {}                  # extra labels on both objects
#         annotations: {}             # extra annotations on both objects
#         role:
#           create: true              # false => manage the Role elsewhere
#           name: <override>          # default: name/key
#         roleBinding:
#           create: true              # false => manage the RoleBinding elsewhere
#           name: <override>          # default: name/key
#         rules: []                   # Role rules, verbatim
#         subjects: []                # RoleBinding subjects, verbatim
#
# An enabled grant with no `namespace`, a rendered Role with empty `rules`, or a
# rendered RoleBinding with empty `subjects` FAILS the render. That is
# deliberate: a placeholder grant ships with `rules: []` so whoever turns it on
# is forced to state the resources and verbs it actually needs, instead of
# inheriting a wildcard by accident.
#
# AGENT-OPERATED INFRA ROLE (task gd-IYY1dxukfR; design
# gardenio/docs/project-infra-role-design.md). The same grant entry also carries
# the guardrails that make it safe to hand the Role to an agent, rendered by
# templates/project-infra-role.yaml:
#
#         resourceQuota:
#           hard: {pods: "10", requests.cpu: "2", ...}   # ResourceQuota in <ns>
#         limitRange:
#           limits: [{type: Container, default: {...}, defaultRequest: {...}}]
#         agentInfra:
#           enabled: true               # requires project, resourceQuota.hard,
#                                       # limitRange.limits (render fails if absent)
#           serviceAccount: <sa>        # default: the grant name; the VAP matches
#                                       # system:serviceaccount:<release ns>:<sa>
#           egress:
#             keycloakRuntime: true     # allow TCP 8080 to the Keycloak runtime Service
#             exceptCidrs: [...]        # HTTPS exclusions; default RFC1918, 169.254/16 (IMDS), 100.64/10
#           admissionPolicy:            # REQUIRED when the Role can create/change pods
#             enabled: true             # or pod-bearing workloads (render fails if not)
#             workloadServiceAccounts: ["default"]   # SAs the agent's workloads may run as
#
# `agentInfra.enabled` renders two egress NetworkPolicies (<name>-egress-internal,
# <name>-egress-https) and one ValidatingAdmissionPolicy plus binding per pod-spec
# shape (<name>-no-secrets-{pod,workload,cronjob}) plus <name>-service-exposure
# (Services: ClusterIP only, no externalIPs or externalName, CVE-2020-8554), scoped
# to the SA's username and to the grant's namespace. Its ServiceAccount lives in the RELEASE namespace and
# comes from `projectInfraServiceAccounts` below.
projectNamespaceRbac:
  enabled: false
  grants: {}

# ServiceAccounts for agent-operated infra roles, in the release namespace (where
# agent pods run). Default off. automountServiceAccountToken is false; the token is
# mounted only into a pod whose role bead sets needs_k8s_api=true.
#
#   projectInfraServiceAccounts:
#     claimlayer-infra: {enabled: true, project: claimlayer}
projectInfraServiceAccounts: {}

# OpenZiti overlay. OFF by default (owner 2026-10-13: "keep ziti as a
# possibility for configuration in the future, but not use it in the stack
# today"). Turning it on also needs the Terraform flags ziti_public_router_enabled
# and ziti_router_vpc_enabled, and a controller with enrolled identities.
ziti:
  enabled: false
  controller:          {enabled: true}
  routerAws:           {enabled: true}
  routerPublic:        {enabled: true}
  corednsSplitHorizon: {enabled: true}
  hostGardenio:        {enabled: true}
  hostBeads:           {enabled: false}

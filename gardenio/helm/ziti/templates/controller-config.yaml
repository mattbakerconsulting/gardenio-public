{{- if and .Values.ziti.enabled .Values.ziti.controller.enabled }}
# Declarative config.yml for the in-cluster ziti controller.
#
# WHY THIS EXISTS. The controller's config.yml normally comes from one of two
# places, neither of which is reviewable: the image's bootstrap generates it on
# a fresh volume, or restore-if-empty restores whatever was inside the pinned
# backup. Both are invisible to code review and neither can express the second
# bind point (gd-mClQbiOtPk) — the generator will not produce one, and a config
# that lives only inside the backup is exactly as durable as the pin and
# vanishes on a genuine fresh bootstrap.
#
# HOW IT IS APPLIED. /bootstrap.bash:577 preserves an existing non-empty
# config.yml unless ZITI_BOOTSTRAP_CONFIG is literally "force", so an
# install-config init container writes this file into ZITI_HOME AFTER
# restore-if-empty has run, and bootstrap then leaves it alone. Verified live:
# the controller boots logging "INFO: config file exists in
# /ziti-controller/config.yml".
#
# THIS IS THE GENERATED CONFIG PLUS ONE LISTENER. The body below was captured
# verbatim from the running controller and then appended to. Do not hand-edit
# the generated portion; if the image's generator changes, re-capture and
# re-append rather than merging by hand.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ziti-controller-config
  namespace: ziti
data:
  config.yml: |
    v: 3

    #trace:
    #  path: "ziti-ctrl.clonk.tv.trace"

    #profile:
    #  memory:
    #    path: ctrl.memprof


    cluster:
      dataDir:         "/ziti-controller/raft"

    identity:
      cert:        "pki/intermediate/certs/client.chain.pem"
      server_cert: "pki/intermediate/certs/server.chain.pem"
      key:         "pki/intermediate/keys/server.key"
      ca:          "pki/root/certs/root.cert"
      #alt_server_certs:
      #  - server_cert:  ""
      #    server_key:   ""

    # trust domains may be overridden by SPIFFE ID as URI SAN 
    #trustDomain: ziti.example.com

    # additional trust domains allow for migrating to a new trust domain
    #additionalTrustDomains: []

    # Network Configuration
    #
    # Configure how the controller will establish and manage the overlay network, and routing operations on top of
    # the network.
    #
    #network:

      # routeTimeoutSeconds controls the number of seconds the controller will wait for a route attempt to succeed.
      #routeTimeoutSeconds:  10

      # createCircuitRetries controls the number of retries that will be attempted to create a path (and terminate it)
      # for new circuits.
      #createCircuitRetries: 2  

      # pendingLinkTimeoutSeconds controls how long we'll wait before creating a new link between routers where
      # there isn't an established link, but a link request has been sent
      #pendingLinkTimeoutSeconds: 10

      # Defines the period that the controller re-evaluates the performance of all of the circuits
      # running on the network.
      #
      #cycleSeconds:         15

      # Sets router minimum cost. Defaults to 10
      #minRouterCost: 10

      # Sets how often a new control channel connection can take over for a router with an existing control channel connection
      # Defaults to 1 minute
      #routerConnectChurnLimit: 1m

      # Sets the latency of link when it's first created. Will be overwritten as soon as latency from the link is actually
      # reported from the routers. Defaults to 65 seconds.
      #initialLinkLatency: 65s

      #smart:
        #
        # Defines the fractional upper limit of underperforming circuits that are candidates to be re-routed. If 
        # smart routing detects 100 circuits that are underperforming, and `smart.rerouteFraction` is set to `0.02`,
        # then the upper limit of circuits that will be re-routed in this `cycleSeconds` period will be limited to 
        # 2 (2% of 100). 
        #
        #rerouteFraction:    0.02
        # 
        # Defines the hard upper limit of underperforming circuits that are candidates to be re-routed. If smart 
        # routing detects 100 circuits that are underperforming, and `smart.rerouteCap` is set to `1`, and 
        # `smart.rerouteFraction` is set to `0.02`, then the upper limit of circuits that will be re-routed in this 
        # `cycleSeconds` period will be limited to 1.
        #
        #rerouteCap:         4  

    # the endpoint that routers will connect to the controller over.
    ctrl:
      options:
        advertiseAddress: tls:ziti-ctrl.clonk.tv:8440
      # (optional) settings
      # set the maximum number of connect requests that are buffered and waiting to be acknowledged (1 to 5000, default 1)
      #maxQueuedConnects:      1
      # the maximum number of connects that have  begun hello synchronization (1 to 1000, default 16)
      #maxOutstandingConnects: 16
      # the number of milliseconds to wait before a hello synchronization fails and closes the connection (30ms to 60000ms, default: 5000ms)
      #connectTimeoutMs:       5000
      listener:             tls:0.0.0.0:8440

    #metrics:
    #  influxdb:
    #    url:                http://localhost:8086
    #    database:           ziti

    # xctrl_example
    #
    #example:
    #  enabled:              false
    #  delay:                5s

    healthChecks:
      boltCheck:
        # How often to try entering a bolt read tx. Defaults to 30 seconds
        interval: 30s
        # When to time out the check. Defaults to 20 seconds
        timeout: 20s
        # How long to wait before starting the check. Defaults to 30 seconds
        initialDelay: 30s

    # By having an 'edge' section defined, the ziti-controller will attempt to parse the edge configuration. Removing this
    # section, commenting out, or altering the name of the section will cause the edge to not run.
    edge:
      # This section represents the configuration of the Edge API that is served over HTTPS
      api:
        #(optional, default 90s) Alters how frequently heartbeat and last activity values are persisted
        # activityUpdateInterval: 90s
        #(optional, default 250) The number of API Sessions updated for last activity per transaction
        # activityUpdateBatchSize: 250
        # sessionTimeout - optional, default 30m
        # The number of minutes before an Edge API session will time out. Timeouts are reset by
        # API requests and connections that are maintained to Edge Routers
        sessionTimeout: 30m
        # address - required
        # The default address (host:port) to use for enrollment for the Client API. This value must match one of the addresses
        # defined in this Controller.WebListener.'s bindPoints.
        address: ziti-ctrl.clonk.tv:8440
      # This section is used to define option that are used during enrollment of Edge Routers, Ziti Edge Identities.
      enrollment:
        # signingCert - required
        # A Ziti Identity configuration section that specifically makes use of the cert and key fields to define
        # a signing certificate from the PKI that the Ziti environment is using to sign certificates. The signingCert.cert
        # will be added to the /.well-known CA store that is used to bootstrap trust with the Ziti Controller.
        signingCert:
          cert: pki/intermediate/certs/intermediate.cert
          key:  pki/intermediate/keys/intermediate.key
        # edgeIdentity - optional
        # A section for identity enrollment specific settings
        edgeIdentity:
          # duration - optional, default 180m
          # The length of time that a Ziti Edge Identity enrollment should remain valid. After
          # this duration, the enrollment will expire and no longer be usable.
          duration: 180m
        # edgeRouter - Optional
        # A section for edge router enrollment specific settings.
        edgeRouter:
          # duration - optional, default 180m
          # The length of time that a Ziti Edge Router enrollment should remain valid. After
          # this duration, the enrollment will expire and no longer be usable.
          duration: 180m

    # web
    # Defines webListeners that will be hosted by the controller. Each webListener can host many APIs and be bound to many
    # bind points.
    web:
      # name - required
      # Provides a name for this listener, used for logging output. Not required to be unique, but is highly suggested.
      - name: client-management
        # bindPoints - required
        # One or more bind points are required. A bind point specifies an interface (interface:port string) that defines
        # where on the host machine the webListener will listen and the address (host:port) that should be used to
        # publicly address the webListener(i.e. mydomain.com, localhost, 127.0.0.1). This public address may be used for
        # incoming address resolution as well as used in responses in the API.
        bindPoints:
          #interface - required
          # A host:port string on which network interface to listen on. 0.0.0.0 will listen on all interfaces
          - interface: 0.0.0.0:8440
            # address - required
            # The public address that external incoming requests will be able to resolve. Used in request processing and
            # response content that requires full host:port/path addresses.
            address: ziti-ctrl.clonk.tv:8440
        # identity - optional
        # Allows the webListener to have a specific identity instead of defaulting to the root 'identity' section.
        identity:
          ca:          "pki/root/certs/root.cert"
          key:         "pki/intermediate/keys/server.key"
          server_cert: "pki/intermediate/certs/server.chain.pem"
          cert:        "pki/intermediate/certs/client.chain.pem"
          #alt_server_certs:
          #- server_cert: ""
          #  server_key:  ""

        # options - optional
        # Allows the specification of webListener level options - mainly dealing with HTTP/TLS settings. These options are
        # used for all http servers started by the current webListener.
        options:
          # idleTimeoutMs - optional, default 5000ms
          # The maximum amount of idle time in milliseconds allowed for pipelined HTTP requests. Setting this too high
          # can cause resources on the host to be consumed as clients remain connected and idle. Lowering this value
          # will cause clients to reconnect on subsequent HTTPs requests.
          idleTimeout: 5000ms  #http timeouts, new
          # readTimeoutMs - optional, default 5000ms
          # The maximum amount of time in milliseconds http servers will wait to read the first incoming requests. A higher
          # value risks consuming resources on the host with clients that are acting bad faith or suffering from high latency
          # or packet loss. A lower value can risk losing connections to high latency/packet loss clients.
          readTimeout: 5000ms
          # writeTimeoutMs - optional, default 100000ms
          # The total maximum time in milliseconds that the http server will wait for a single requests to be received and
          # responded too. A higher value can allow long-running requests to consume resources on the host. A lower value
          # can risk ending requests before the server has a chance to respond.
          writeTimeout: 100000ms
          # minTLSVersion - optional, default TLS1.2
          # The minimum version of TSL to support
          minTLSVersion: TLS1.2
          # maxTLSVersion - optional, default TLS1.3
          # The maximum version of TSL to support
          maxTLSVersion: TLS1.3
        # apis - required
        # Allows one or more APIs to be bound to this webListener
        apis:
          # binding - required
          # Specifies an API to bind to this webListener. Built-in APIs are
          #   - edge-management
          #   - edge-client
          #   - fabric-management
          - binding: edge-management
            # options - arg optional/required
            # This section is used to define values that are specified by the API they are associated with.
            # These settings are per API. The example below is for the 'edge-api' and contains both optional values and
            # required values.
            options: { }
          - binding: edge-client
            options: { }
          - binding: fabric
            options: { }
          - binding: edge-oidc
            # allowedHostnames (optional): a wildcard server-cert SAN serves OIDC only for the exact hostnames listed here.
            # options:
            #   allowedHostnames:
            #     - ctrl.example.com
            options: { }
          - binding: spa
            options:
              path: zac
              location: /ziti-console
              indexFile: index.html

      # ── SECOND BIND POINT: edge-client ONLY, publicly-trusted cert ──────────
      # gd-mClQbiOtPk. Exists so the six external identities can re-enroll
      # against THIS controller before the Phase 2 cutover; BrowZer reuses it
      # afterwards (gd-jBXCnYp3ir, held until after the cutover).
      #
      # WHY A SECOND LISTENER RATHER THAN EXPOSING 8440. The listener above is
      # ONE bind point serving edge-management, edge-client, fabric, edge-oidc
      # AND spa. Publishing it publishes the MANAGEMENT API and the fabric —
      # exactly what PR #6 did, and why it was reverted in 0a2dbea3. The apis
      # list below is edge-client and nothing else. Adding a binding here is a
      # security change, not a convenience.
      #
      # CORRECTION (gd-mClQbiOtPk, ~11h stuck): this used to carry a VERBATIM
      # COPY of "client-management"'s identity block (ziti-PKI server_cert as
      # primary) plus the LE cert as an alt_server_certs entry, on the theory
      # that alt_server_certs adds a SECOND cert selected by SNI without
      # touching the primary. That theory is right in general but wrong HERE,
      # because the primary server_cert (pki/intermediate/certs/server.chain.pem)
      # and the alt LE cert have the IDENTICAL SAN: both are for
      # ziti-ctrl.clonk.tv (the bootstrap PKI's cert SAN is deliberately that
      # name — docs/ziti-controller-k3s.md "the cert SAN is ziti-ctrl.clonk.tv").
      # Upstream OpenZiti's own SNI cert-selection has two independently
      # reported bug threads for exactly this shape (primary identity cert and
      # an alt_server_certs entry sharing one SAN): the selection is not
      # SNI-driven in that case, it deterministically falls back to the
      # identity's own server_cert every time — openziti.discourse.group
      # "alt-server-certs-not-working-properly/4744" and
      # "alt-server-certs-for-zac-are-not-being-recognised/4488" ("if you use
      # the same domain for both you get non-deterministic behavior as the TLS
      # engine won't know which of the two certs to provide ... it'll just pick
      # one" — in practice, observed here as ALWAYS the ziti-PKI leaf,
      # consistent with 11h of unchanging openssl output). Their fix is two
      # distinct FQDNs, which doesn't fit: the whole point of this bind point is
      # to serve ziti-ctrl.clonk.tv itself over public trust.
      #
      # THE ACTUAL FIX: this identity block is local to THIS web listener only
      # — it does not back the ctrl channel (top-level `identity:` above, used
      # by routers/raft, untouched) or "client-management" (its own separate
      # identity block on 8440, untouched). Nothing needs THIS listener to also
      # present the ziti-PKI cert: 8441 has never been reachable before this
      # change, so no existing enrolled identity depends on validating it
      # against the ziti root CA. `ca` stays pki root — it is what validates
      # CLIENT certs already-enrolled identities present back to the server
      # over mTLS once they reconnect here, unrelated to which SERVER cert this
      # listener presents. `cert`/`key` are carried over unchanged too (the
      # component's own client identity for outbound use, not consulted by an
      # inbound web listener). Only server_cert/server_key point at the LE
      # cert, made the ONE cert this listener ever presents — no SNI selection
      # needed or wanted, so no alt_server_certs entry to collide with it.
      - name: client-public
        bindPoints:
          - interface: 0.0.0.0:8441
            address: ziti-ctrl.clonk.tv:8441
        identity:
          ca:          "pki/root/certs/root.cert"
          key:         "pki/intermediate/keys/server.key"
          cert:        "pki/intermediate/certs/client.chain.pem"
          server_cert: /public-certs/tls.crt
          server_key:  /public-certs/tls.key
        options:
          idleTimeout: 5000ms
          readTimeout: 5000ms
          writeTimeout: 100000ms
          minTLSVersion: TLS1.2
          maxTLSVersion: TLS1.3
        apis:
          - binding: edge-client
            options: { }

{{- end }}

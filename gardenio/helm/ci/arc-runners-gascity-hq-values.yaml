# Runner scale set "gascity-hq-k3s" for the PRIVATE mirror mattbakerconsulting/gascity-hq.
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
# Namespace: arc-runners (same controller as gardenio-k3s). Release name = runs-on label.
#
# Gas City's quality gates (make check / make check-docs) run here so nothing
# ever appears on the public fork and no GitHub-hosted minutes are spent
# (private minutes are exhausted; self-hosted minutes are free). Every
# inherited upstream workflow on gascity-hq is disabled individually; only
# hq-gates.yml (branch hq/**, workflow_dispatch) is allowed to run.
#
# Auth: the same PAT secret as gardenio-k3s (it has admin on gascity-hq;
# verified 2026-09-17 with a registration-token call). Debt: GitHub App.
githubConfigUrl: https://github.com/mattbakerconsulting/gascity-hq
githubConfigSecret: gardenio-github

minRunners: 0
maxRunners: 4

containerMode:
  type: dind

template:
  spec:
    nodeSelector:
      gardenio.io/role: ci
    tolerations:
      - key: ci
        operator: Equal
        value: "true"
        effect: NoSchedule
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        # The stock image has no make/gcc and upstream's gates (and its
        # composite setup action, which we do not edit) assume a GitHub-hosted
        # Ubuntu. Install the toolchain at pod start via sudo (~30 s) rather
        # than carrying a custom runner image. libicu-dev: dolt's
        # go-icu-regex is cgo and includes unicode/uregex.h (make check and
        # make check-docs both failed on it without the headers).
        # lsof: gc doctor's lsof-binary check fails (exit 1) without it, which
        # broke TestPackV2ImportsScript; six dolt-state tests also skip.
        # netcat-openbsd: the dolt pack's sql.sh runs under dash, where the
        # /dev/tcp probe is unavailable and it falls back to `nc -z`
        # (TestSQLScriptConnectedBranchExportsPassword). python3: several
        # tests t.Skip without it; GitHub's ubuntu-latest has all three.
        command: ["/bin/bash", "-c"]
        args:
          - |
            sudo apt-get update -q >/dev/null \
              && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends build-essential pkg-config libicu-dev lsof netcat-openbsd python3 >/dev/null \
              && exec /home/runner/run.sh
        resources:
          # One runner per 4-vCPU / 16 GiB node; upstream's setup action
          # installs Go + Node and make check compiles the whole tree.
          requests: { cpu: "3", memory: 12Gi }
          limits: { memory: 14Gi }

# ── LISTENER PLACEMENT ──────────────────────────────────────────────────────
# The listener is the pod that acquires jobs from GitHub; if it cannot schedule,
# NOTHING runs and the queue just grows silently. It is NOT a runner: it
# requests 50m CPU / 128Mi and does no build work.
#
# Every Ready node in this cluster carries a NoSchedule taint by design —
# control-plane on the three servers, gardenio.agent on the platform nodes
# (terraform modules/k3s), ci on the CI pool. The RUNNER side already tolerates
# ci=true and selects gardenio.io/role=ci, but the listener had only the default
# not-ready/unreachable tolerations, so it was homeless the moment it had to be
# re-placed.
#
# That is exactly what happened 2026-09-20: a control-plane node hung, its
# listener was evicted, and CI was dead for ~20 minutes with 12 runs queued
# before anyone noticed — the runners sat "Listening for Jobs" the whole time,
# which looks healthy. The other three scale sets only kept working because
# their listeners had been scheduled earlier and were never forced to move.
#
# Tolerating control-plane is deliberate and is NOT a reversal of the taint
# added the same day: that taint exists to keep 2Gi-limit AGENT pods off
# 1.95Gi etcd nodes, and a 50m/128Mi listener is a different thing entirely.
# The platform nodes were at 100% CPU when this was chosen; the servers are the
# calmer home for a latency-sensitive poller.
listenerTemplate:
  spec:
    containers:
      - name: listener   # required by the ARS CRD even when only tolerations change
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      # Home off the servers (gd-ybTutceJpn). The 2 GiB servers ran out of memory
      # one after another on 2026-10-14 because a server drain piled the ARC
      # listeners onto the survivors. Tolerate the platform pool's taint and
      # PREFER those nodes; the control-plane toleration above stays as the
      # fallback, so a listener is never stranded Pending.
      - key: gardenio.agent
        operator: Equal
        value: "true"
        effect: NoSchedule
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: gardenio.io/role
                  operator: In
                  values: ["platform"]

    # Keep the listeners off one another's node. All six tolerate only the
    # control-plane taint above, so they all compete for the same three k3s
    # servers; left alone they pile up (3/2/1 on 2026-09-22, with every
    # gardenio tier on one node), which turns a single node loss into a
    # TIER-BLIND dispatch outage.
    #
    # ScheduleAnyway is deliberate and must stay: six listeners over three
    # nodes means a hard constraint can strand one Pending, the failure this
    # file already has a scar from. This all-six selector is shared by the three
    # MIRROR values files in this directory (beads-hq, gascity-hq,
    # gascity-packs-hq) -- change one, change those three. The gardenio tiers
    # deliberately select on repository instead; arc-runners-values.yaml says
    # why, and carries the full rationale.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/part-of: gha-runner-scale-set
            app.kubernetes.io/component: runner-scale-set-listener

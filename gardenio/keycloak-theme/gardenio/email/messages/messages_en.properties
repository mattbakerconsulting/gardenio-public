# gardenio email copy: short, plain, and every message says what to do next.
# Only keys the theme changes are listed; everything else falls through to the
# base theme's English. MessageFormat rules: a literal apostrophe is doubled,
# and a message used with arguments reads them as {0}, {1}...
#
# Plain-text alternatives (text/*.ftl are the base templates) use the *Body keys
# below, in the base theme's argument order: {0} link, {1} expiry number, {2}
# realm name, {3} expiry with unit. executeActions: {3} actions, {4} expiry.
# emailUpdateConfirmation: {0} link, {1} new address, {3} expiry with unit.

gdEmailBrand=gardenio
gdEmailFooter=gardenio · secure sign-in. You are getting this because of activity on a gardenio account.
gdEmailLinkFallback=If the button does not work, paste this link into your browser:

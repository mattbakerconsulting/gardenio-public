# gardenio email theme. Delivered with the login and account themes (see
# templates/keycloak-runtime/theme-configmap.yaml).
#
# parent=base, not keycloak: the keycloak email theme is abstract and adds
# nothing but locales. Only html/template.ftl (the layout every HTML message
# imports) and five HTML bodies are overridden; every other message, and every
# plain-text alternative, is the base template with the wording in
# messages/messages_en.properties.
parent=base

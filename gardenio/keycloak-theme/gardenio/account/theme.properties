# gardenio account console theme: a stylesheet and a small script, no template
# overrides.
#
# keycloak.v3 is the account console of the pinned Keycloak (26.7.5, see
# keycloak.runtime.image); it ships in the keycloak-account-ui jar and extends
# base. Its index.ftl links every file in `styles` after its own stylesheets, so
# ours loads last, and every file in `scripts` as a module in <head>.
# darkMode=true and the dark class (pf-v5-theme-dark, added by the page from
# prefers-color-scheme) are inherited unchanged.
parent=keycloak.v3
styles=css/gardenio-account.css
# Closes the phone drawer after a link in it is chosen, and names the
# icon-only menu buttons (gd-ROY5CMuLfW).
scripts=js/gardenio-account.js

# The masthead brand: resolved against this theme's resources, so it is
# resources/img/logo.svg below (the stock value is the Keycloak logo).
logo=img/logo.svg

# The tab title and the description of the stock page name Keycloak.
title=gardenio
description=Manage your gardenio account, passkeys and sign-in methods.

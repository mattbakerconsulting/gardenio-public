# gardenio login theme. Delivered as a ConfigMap (templates/keycloak-runtime/
# theme-configmap.yaml), mounted at /opt/keycloak/themes/gardenio.
#
# keycloak.v2 (the pinned image, see keycloak.runtime.image) is parent=keycloak with styles=css/styles.css
# and the PatternFly v5 class map (kc*Class keys). A child's `styles` REPLACES
# the parent's value, so the parent stylesheet is listed first and ours after it:
# dropping css/styles.css would lose the keycloak.v2 layout rules. The class
# keys, stylesCommon and kcHtmlClass (login-pf) are inherited unchanged.
parent=keycloak.v2
# S1h (gd-0SYmLWCCM5): the Dawn Meadow pixel-art scene (design doc section 13,
# direction A) ships inside this same theme, so loginTheme stays `gardenio`.
# scene-base.css is the shared pixel layer stack, framed card, sign and heading
# font; scene-meadow.css is the meadow's colour tokens, pictures and motion.
# Dropping the two scene stylesheets from this line is the full visual rollback
# to the flat theme (nothing else changes). Redraw the art: node
# gardenio/tests/keycloak-theme/gen/index.js.
styles=css/styles.css css/gardenio.css css/scene-base.css css/scene-meadow.css

# The template renders <meta name=viewport> from this key (`name==content`,
# space separated). The first CI run showed the pages laid out at 980px on a 360px
# phone, i.e. no viewport meta reached the page, so the 360px layout never applied.
meta=viewport==width=device-width,initial-scale=1

# Passkey: errors. {0} (the browser's own wording) is left out on purpose.
# The four sign-in errors show in two places: the sign-in form's alert (a passkey
# picked in the username box; the password box is on that page) and the
# webauthn-error page (the passkey an admin must give after the password). That
# page offers only Try again, and the flow has no other way at that step, so the
# copy promises nothing more (gd-aYmqhMKH05).
webauthn-error-title=That passkey did not work
webauthn-error-auth-verification=Your passkey was not recognized. Try again with another passkey.
webauthn-error-user-not-found=Your passkey was not recognized. Try again with another passkey.
webauthn-error-different-user=That passkey belongs to a different account. Try again with a passkey for this account.
webauthn-error-api-get=Your device did not confirm the passkey. Try again.
webauthn-error-registration=The passkey could not be added. Try again, or use another device or security key.
webauthn-error-register-verification=The passkey could not be added. Try again, or use another device or security key.
doTryAgain=Try again


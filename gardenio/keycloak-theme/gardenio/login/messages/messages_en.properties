# gardenio login copy: short, plain, and every error names the next action.
# Only keys the theme changes are listed; everything else falls through to the
# parent theme's English. MessageFormat rules: a literal apostrophe is doubled.
# No user-visible string says "WebAuthn": passkey wording is in the S1d section below.

# Brand: the wordmark is drawn from this text by the theme CSS (the realm
# name never shows) and the browser tab says just "gardenio".
loginTitle=gardenio
loginTitleHtml=gardenio
gdFooter=gardenio · secure sign-in


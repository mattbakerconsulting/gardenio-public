# ---- S1d: passkeys, security keys, account set-up and the kd login device pages ----
# Never "WebAuthn" in front of a user. A passkey is "your fingerprint, face, PIN or
# security key"; the hint line under the button is drawn by gardenio.css (it is
# English-only, like this file).

# Passkey: sign in

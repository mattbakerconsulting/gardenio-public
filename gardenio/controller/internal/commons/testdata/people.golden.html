<section class="cm-lightbox cm-people" data-commons="lightbox" data-kind="people" data-land="claimlayer" role="dialog" aria-modal="true" aria-labelledby="cm-lb-title">
<h2 class="cm-lb-title" id="cm-lb-title">People in claimlayer</h2>
<form class="cm-lb-form cm-invite" method="post" action="/base/garden/c/claimlayer/general/invite" data-commons="invite">
<label class="cm-lb-field"><span>GitHub login</span><input class="cm-input" name="login" value="" required maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
<fieldset class="cm-lb-roles"><legend>Invite as</legend>
<label class="cm-lb-role"><input type="radio" name="role" value="member" checked><span><b>Member</b><span class="cm-lb-hint">Talks, files work and starts agents</span></span></label>
<label class="cm-lb-role"><input type="radio" name="role" value="guest"><span><b>Guest</b><span class="cm-lb-hint">Talks and reacts, nothing more</span></span></label>
</fieldset>
<p class="cm-lb-note">They join when they next sign in with that GitHub account. The invite lasts 14 days.</p>
<div class="cm-lb-acts">
<button class="btn ghost" type="button" data-commons="close">Close</button>
<button class="btn" type="submit">Invite</button>
</div>
</form>
<h3 class="cm-lb-sub">Members</h3>
<ul class="cm-invites cm-members">
<li class="cm-invite-row cm-member-row"><span class="cm-invite-who">ann</span><span class="cm-invite-what">member</span>
<button class="btn small ghost cm-become" type="button" data-become="oidc:ann@claimlayer.example" data-become-name="ann" aria-label="Become ann" hidden>Become</button></li>
<li class="cm-invite-row cm-member-row"><span class="cm-invite-who">Bo Lind</span><span class="cm-invite-what">owner</span></li>
<li class="cm-invite-row cm-member-row"><span class="cm-invite-who">cy</span><span class="cm-invite-what">member</span>
<button class="btn small ghost cm-become" type="button" data-become="oidc:cy@both.example" data-become-name="cy" aria-label="Become cy" hidden>Become</button></li>
</ul>
<h3 class="cm-lb-sub">Invited</h3>
<ul class="cm-invites">
<li class="cm-invite-row" data-invite="cl-inv2"><span class="cm-invite-who">@hubot</span><span class="cm-invite-what">guest · waiting, until Thursday, Oct 29</span>
<form class="cm-invite-revoke" method="post" action="/base/garden/c/claimlayer/general/revoke" data-commons="invite"><input type="hidden" name="id" value="cl-inv2"><button class="btn small ghost" type="submit" aria-label="Revoke @hubot">Revoke</button></form></li>
<li class="cm-invite-row" data-invite="cl-inv1"><span class="cm-invite-who">@monalisa</span><span class="cm-invite-what">member · joined</span>
<form class="cm-invite-revoke" method="post" action="/base/garden/c/claimlayer/general/revoke" data-commons="invite"><input type="hidden" name="id" value="cl-inv1"><button class="btn small ghost" type="submit" aria-label="Revoke @monalisa">Revoke</button></form></li>
</ul>
</section>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Gardenio</title>
<!-- SPLASH (splash.go, plan gd-EJGA3zDGCk): one full-viewport canvas that splash.js draws in WebGL with the vendored three.js
     (data-three). Without WebGL the still and its note below take the canvas's place. ?t= pins the clock the scene is lit by,
     ?play=1 plays the day; the time controls (#splash-time) show once the scene draws, and drive both. The start menu
     (#splash-menu, gd-Fw6fffLZ3p) is plain HTML over the scene, so it is there with or without WebGL: the title and two
     links, as a game's title screen offers its options: to ask for an invite (the Lands front of house, /lands/) and to sign
     in (the edge's /oauth2/start, back to /garden). It comes before the time controls, so Tab reaches it first. The view's
     buttons (#splash-view, plan gd-I5QHVfGLbD) come between the two: Reset view (only off the default view), Zoom in and Zoom
     out, whose arrow keys turn the view and Escape resets it; the canvas takes no focus, so the keyboard reaches the view
     through them. -->
<style>{{.CSS}}</style>
</head>
<body data-base="{{.Base}}" data-three="{{.Three}}">
<main>
<h1 class="sr">Gardenio</h1>
<canvas id="splash" role="img" aria-label="The gardenio stone on its hill above a valley of farmland"></canvas>
<nav id="splash-menu" aria-label="Start">
<p class="title" aria-hidden="true">Gardenio</p>
<ul>
<li><a id="splash-invite" href="{{.Invite}}">Request an invite</a></li>
<li><a id="splash-signin" href="{{.SignIn}}">Sign in</a></li>
</ul>
</nav>
<div id="splash-view" role="group" aria-label="The view" hidden>
<button id="splash-reset" type="button" aria-label="Reset view" title="Reset view" hidden></button>
<button id="splash-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
<button id="splash-out" type="button" aria-label="Zoom out" title="Zoom out">&#8722;</button>
</div>
<div id="splash-time" role="group" aria-label="The scene's time" hidden>
<div class="row">
<output id="splash-readout" aria-live="off"><span class="when"></span><span class="sky"></span><span class="zoom" hidden></span></output>
<span class="buttons"><button id="splash-play" type="button" aria-pressed="false">Play</button><button id="splash-now" type="button">Now</button></span>
</div>
<input id="splash-scrub" type="range" min="0" max="1439" step="1" value="0" aria-label="Time of day">
</div>
<figure id="splash-flat" hidden>
<img src="{{.Still}}" alt="Midday over the farm: the gardenio stone on its hill, an oak at the left, fields and a farmstead in the valley below">
<figcaption>No 3D in this browser: this is a still of the scene.</figcaption>
</figure>
</main>
<script>{{.JS}}</script>
</body>
</html>

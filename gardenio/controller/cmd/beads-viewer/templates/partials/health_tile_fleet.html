{{define "health_tile_fleet"}}
<h2>Agent fleet{{with .Fleet}}{{if .Stale}} <span class="health-pill health-pill-stale" title="snapshot age {{.StaleAge}}">stale</span>{{end}}{{end}}</h2>
{{with .Fleet}}
{{if .Error}}
<p class="banner banner-error">{{.Error}}</p>
{{else}}
<dl class="field-list">
  <dt>Alive</dt><dd><strong class="ok">{{.Alive}}</strong></dd>
  <dt>Stuck</dt><dd>{{if gt .Stuck 0}}<strong class="err">{{.Stuck}}</strong>{{else}}<strong>{{.Stuck}}</strong>{{end}}</dd>
  <dt>Idle</dt><dd>{{.Idle}}</dd>
  <dt>Total</dt><dd>{{.Total}}</dd>
</dl>
{{end}}
<p class="meta">as of {{.AsOf}}</p>
{{end}}
{{end}}

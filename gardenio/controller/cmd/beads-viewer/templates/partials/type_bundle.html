{{define "type_bundle"}}
<section class="bundle-summary">
  <h3>Bundle</h3>

  {{with .Bundle}}
    {{if .Docs}}
      <ol class="bundle-toc">
        {{range .Docs}}
          <li class="bundle-toc-entry">
            <a href="{{$.BasePath}}/{{.BeadID}}"><code>{{.BeadID}}</code></a>
            <span class="bundle-toc-title">{{.Title}}</span>
            {{if .Format}}<span class="bundle-toc-format"><code>{{.Format}}</code></span>{{end}}
          </li>
        {{end}}
      </ol>
    {{else}}
      <p class="empty empty-yet">No documents yet.</p>
    {{end}}

    <p class="bundle-cta">
      <a class="bundle-open-as-document" href="{{.CTAURL}}">Open as document &rarr;</a>
    </p>
  {{else}}
    <p class="empty">Bundle metadata unavailable.</p>
  {{end}}
</section>
{{end}}

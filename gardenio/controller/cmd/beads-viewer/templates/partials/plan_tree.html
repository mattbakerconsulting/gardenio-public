{{/* plan_tree.html — one PLAN drawn as a tree, for the /plans zoomable forest
     (?view=tree; plans_tree.go, thread ka-0000005850).

     The whole glyph is ONE self-contained inline <svg> in a fixed normalized
     viewBox (100×120), so "zoom" is a CSS width change on .plans-tree-tile and
     never a re-layout or a re-fetch. Nothing here is decorative:

       trunk   the plan. Always ground→apex, so a wall of trees shares one
               silhouette envelope and reads as a stand rather than a ragged row.
       crown   the plan's ATTENTION tier (decision / escalation / ready /
               stalled / closeout). The one signal that must stay legible at a
               64px canopy glyph — you spot which tree is on fire without
               reading a word.
       limb    one PHASE, bottom-first (phase 1 lowest — a tree grows upward, so
               reading bottom-up reads the plan in phase order).
       leaf    one STEP, colored by the step bead's own lifecycle status using
               the SAME palette the card's mini task-grid squares use.
       root    a live-crew pulse: something is grinding on this plan right now.

     Every leaf is an <a> to its step bead, so preview_popover.js gives the
     hover preview + click-through for free (it treats any ka-XXX anchor as a
     bead link — no per-leaf JS), exactly as the mini-grid squares do. The tile
     itself links to the plan cockpit. */}}
{{- define "planTree" -}}
{{- $root := .Root -}}
{{- with .Tree -}}
<a class="plans-tree-tile{{if .Attention}} plans-tree-attn{{end}}"
   href="{{.URL}}"
   data-attention="{{.Attention}}"
   data-plan="{{.ID}}"
   title="{{.Title}} — {{.StepsClosed}}/{{.StepsTotal}} steps ({{.PctDone}}%){{if .HasCrew}} · {{.CrewWorking}} working{{end}}">
  <svg class="plans-tree-svg" viewBox="0 0 100 120" role="img" aria-label="{{.Title}}: {{.StepsClosed}} of {{.StepsTotal}} steps done{{if .Attention}}, needs attention ({{.Attention}}){{end}}">
    {{/* Ground line — a shared horizon so the stand reads as one landscape
         rather than N free-floating glyphs. */}}
    <line class="plans-tree-ground" x1="18" y1="{{.GroundY}}" x2="82" y2="{{.GroundY}}"/>
    <line class="plans-tree-trunk" x1="{{.TrunkX}}" y1="{{.GroundY}}" x2="{{.TrunkX}}" y2="{{.TrunkTopY}}"/>
    {{/* Crown: the attention tint. Always drawn (an unattended plan gets the
         calm default), so the apex never reads as a missing piece. */}}
    <circle class="plans-tree-crown" cx="{{.TrunkX}}" cy="{{.TrunkTopY}}" r="4.5"/>
    {{range .Branches}}
    <g class="plans-tree-branch{{if .Empty}} plans-tree-branch-empty{{end}}">
      <line class="plans-tree-limb" x1="{{.StartX}}" y1="{{.StartY}}" x2="{{.EndX}}" y2="{{.EndY}}"/>
      {{range .Leaves}}<a href="{{$root.BasePath}}/{{.ID}}"><circle class="plans-tree-leaf" data-status="{{.Status}}" cx="{{.CX}}" cy="{{.CY}}" r="{{.R}}"><title>#{{.Number}} {{.Title}} — {{.Status}}</title></circle></a>{{end}}
      {{/* Overflow marker: a limb that clipped its leaves SAYS SO (advice
           ka-0000004800 — a truncated view is not absence). */}}
      {{if .LeafOverflow}}<text class="plans-tree-overflow" x="{{.EndX}}" y="{{.EndY}}" text-anchor="{{if lt .Side 0}}end{{else}}start{{end}}">+{{.LeafOverflow}}</text>{{end}}
      {{/* In-SVG phase label — rendered into the DOM at every zoom but revealed
           by CSS only at tree zoom, where there is room for it. Centered on the
           limb MIDPOINT and clipped to a paint budget (planTreeShortLabel): SVG
           text neither wraps nor ellipsizes and the tile does not clip, so an
           unbudgeted name paints straight across its neighbours. The full phase
           title rides the <title> tooltip, so the clip loses nothing. */}}
      {{if .ShortLabel}}<text class="plans-tree-limb-label" x="{{.LabelX}}" y="{{.LabelY}}" text-anchor="middle" dy="-2.5">{{.ShortLabel}}<title>{{.Title}}</title></text>{{end}}
    </g>
    {{end}}
    {{/* A plan with no steps yet is a SEEDLING, not a missing tile: it still
         draws a trunk + crown so a freshly-created plan is visible in the
         stand instead of silently absent. */}}
    {{if .Bare}}<text class="plans-tree-seedling" x="{{.TrunkX}}" y="72" text-anchor="middle">no steps yet</text>{{end}}
    {{if .BranchOverflow}}<text class="plans-tree-overflow plans-tree-overflow-root" x="{{.TrunkX}}" y="{{.GroundY}}" text-anchor="middle" dy="8">+{{.BranchOverflow}} phases</text>{{end}}
    {{/* Live-crew pulse at the trunk base. */}}
    {{if .HasCrew}}<circle class="plans-tree-crew" cx="{{.TrunkX}}" cy="{{.GroundY}}" r="3"><title>{{.CrewWorking}} crew working now</title></circle>{{end}}
  </svg>
  <span class="plans-tree-caption">
    <span class="plans-tree-name">{{.Title}}</span>
    <span class="plans-tree-nums meta">{{.StepsClosed}}/{{.StepsTotal}} · {{.PctDone}}%</span>
  </span>
</a>
{{- end -}}
{{- end -}}

{{define "plan_critique_thread"}}<section id="plan-critique-thread" class="plan-critique-thread"
  data-plan-id="{{.PlanID}}"
  data-step-id="{{.StepID}}"
  data-comments-latest="{{.CommentsLatestRFC}}">
  {{if .Comments}}
  <ul class="plan-critique-list">
    {{range .Comments}}
    <li class="plan-critique-comment{{if .IsNew}} comment-new{{end}}" id="critique-comment-{{.ID}}"
        data-comment-id="{{.ID}}"
        data-created-at="{{.CreatedAtRFC}}"
        {{if .HasAnchor}}data-anchored="1"{{end}}
        {{if .BlockID}}data-block-id="{{.BlockID}}"{{end}}
        {{if .Quote}}data-quote="{{.Quote}}"{{end}}
        {{if .Prefix}}data-prefix="{{.Prefix}}"{{end}}
        {{if .Suffix}}data-suffix="{{.Suffix}}"{{end}}>
      <div class="comment-meta"><strong>{{.Author}}</strong>{{if .OperatorChipHTML}} &middot; {{.OperatorChipHTML}}{{end}} &middot; <a class="comment-permalink" href="#critique-comment-{{.ID}}" data-comment-id="{{.ID}}" title="{{.CreatedAt.Format "2006-01-02 15:04:05 MST"}}">{{humanizeTime .CreatedAt}}</a></div>
      {{if .Quote}}<blockquote class="plan-critique-quote">{{.Quote}}</blockquote>{{end}}
      <div class="comment-body">{{.TextHTML}}</div>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty empty-yet">No critique yet.</p>
  {{end}}
</section>
{{end}}

{{define "inbox_homepage_banner"}}
<aside id="inbox-homepage-banner" class="banner banner-info" role="note" aria-label="Inbox moved notice"
       style="display:flex;align-items:center;gap:0.6rem;background:#eaf3ff;border:1px solid #b6d3f3;color:#1a3c66;">
  <span aria-hidden="true">&#9432;</span>
  <span style="flex:1;">
    Your personal activity has moved to
    <a href="{{.BasePath}}/u/me"><strong>your homepage</strong></a>.
    The /inbox view stays available for triage.
  </span>
  <button type="button"
          aria-label="Dismiss homepage notice"
          title="Dismiss"
          style="background:none;border:0;font-size:1.1rem;line-height:1;cursor:pointer;color:inherit;padding:0 0.25rem;"
          hx-post="{{.BasePath}}/banner/inbox-homepage/dismiss"
          hx-target="#inbox-homepage-banner"
          hx-swap="outerHTML"
          hx-on::after-request="if(event.detail.successful){this.closest('#inbox-homepage-banner').remove();}">&times;</button>
</aside>
{{end}}

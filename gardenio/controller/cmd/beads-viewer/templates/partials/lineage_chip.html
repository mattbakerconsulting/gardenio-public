{{define "lineage_chip"}}<a class="agent-lineage-chip agent-lineage-status-{{or .Status "unknown"}}{{if .IsHead}} agent-lineage-chip-head{{end}}" href="{{.Href}}" title="{{.Name}}{{if .AgeLabel}} · {{.AgeLabel}} old{{end}}{{if .Status}} · {{.Status}}{{end}}"><span class="agent-lineage-dot" style="background:{{.Color}};border-color:{{.Stroke}}" aria-hidden="true"></span><span class="agent-lineage-name"><code>{{.Name}}</code></span>{{if .AgeLabel}}<span class="agent-lineage-age meta">{{.AgeLabel}}</span>{{end}}{{if .IsHead}}<span class="agent-lineage-head-tag">head</span>{{end}}</a>{{end}}

{{define "mr_pill"}}
<a class="mr-pill" href="{{.URL}}" target="_blank" rel="noopener"{{if .Title}} title="{{if .IID}}!{{.IID}} · {{end}}{{.Title}}"{{else if .IID}} title="!{{.IID}}"{{end}}>
  <span class="mr-pill-glyph" aria-hidden="true">&#x2197;</span>
  {{if .IID}}<span class="mr-pill-iid">!{{.IID}}</span>{{end}}
  {{if .Title}}<span class="mr-pill-title">{{.Title}}</span>{{end}}
  {{if .State}}<span class="mr-state mr-state-{{.State}}">{{.State}}</span>{{end}}
  {{if .PipelineStatus}}<span class="pipe-{{.PipelineStatus}}">{{.PipelineStatus}}</span>{{end}}
</a>
{{end}}

{{define "widget_type_preview"}}
{{with .Preview}}
<div class="widget-preview">
  {{if .ErrorMsg}}
  <div class="banner banner-error">
    <strong>{{.ErrorClass}} error:</strong> {{.ErrorMsg}}
  </div>
  {{else}}
  <div class="widget-preview-rendered" style="border: 1px dashed rgba(128,128,128,0.40); padding: 0.75rem; border-radius: 4px; background: rgba(255,255,255,0.02);">
    {{.RenderedHTML}}
  </div>
  {{end}}

  <details style="margin-top: 0.75rem;">
    <summary class="meta">Preview payload (JSON)</summary>
    <form hx-post="{{$.BasePath}}/htmx/widget-types/{{.Slug}}/preview"
          hx-target="closest .widget-preview"
          hx-swap="outerHTML"
          style="margin-top: 0.5rem;">
      <textarea name="payload" rows="8" style="width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85em;">{{.PayloadEdit}}</textarea>
      <button type="submit" class="bead-action" style="margin-top: 0.4rem;">Refresh preview</button>
    </form>
  </details>
</div>
{{end}}
{{end}}

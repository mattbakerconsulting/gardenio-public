<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1000" height="540" fill="#fafaf7"/>
  <text x="20" y="36" font-size="20" font-weight="600" fill="#222">beads-viewer palette reference</text>
  <text x="20" y="58" font-size="13" fill="#666">Source: gardenio/controller/cmd/beads-viewer/constellation.go (statusFill, statusStroke, edgeStyle)</text>

  <!-- Status row -->
  <text x="20" y="100" font-size="14" font-weight="600" fill="#333">Status (node fill / stroke)</text>
  <g transform="translate(20,120)">
    <circle cx="30" cy="30" r="24" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2"/>
    <text x="30" y="80" font-size="12" fill="#333" text-anchor="middle">open</text>
    <text x="30" y="96" font-size="11" fill="#888" text-anchor="middle">#a8d4ab</text>

    <circle cx="130" cy="30" r="24" fill="#9bc7f0" stroke="#1d6bbd" stroke-width="2"/>
    <text x="130" y="80" font-size="12" fill="#333" text-anchor="middle">in_progress</text>
    <text x="130" y="96" font-size="11" fill="#888" text-anchor="middle">#9bc7f0</text>

    <circle cx="230" cy="30" r="24" fill="#f3c889" stroke="#a36a14" stroke-width="2"/>
    <text x="230" y="80" font-size="12" fill="#333" text-anchor="middle">deferred</text>
    <text x="230" y="96" font-size="11" fill="#888" text-anchor="middle">#f3c889</text>

    <circle cx="330" cy="30" r="24" fill="#cfcfcf" stroke="#888" stroke-width="2"/>
    <text x="330" y="80" font-size="12" fill="#333" text-anchor="middle">closed</text>
    <text x="330" y="96" font-size="11" fill="#888" text-anchor="middle">#cfcfcf</text>

    <circle cx="430" cy="30" r="28" fill="#a8d4ab" stroke="#d4a017" stroke-width="3"/>
    <circle cx="430" cy="30" r="32" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.4"/>
    <text x="430" y="80" font-size="12" fill="#333" text-anchor="middle">center (intake)</text>
    <text x="430" y="96" font-size="11" fill="#888" text-anchor="middle">#d4a017 ring</text>
  </g>

  <!-- Category row -->
  <text x="20" y="240" font-size="14" font-weight="600" fill="#333">Category (angular sector — position only, no fill change in v1)</text>
  <g transform="translate(20,260)">
    <rect x="0" y="0" width="220" height="60" fill="#fff7ec" stroke="#d4a017" stroke-width="1" rx="4"/>
    <text x="110" y="28" font-size="13" font-weight="600" fill="#333" text-anchor="middle">action</text>
    <text x="110" y="46" font-size="11" fill="#888" text-anchor="middle">−150° → −30° (top arc)</text>

    <rect x="240" y="0" width="220" height="60" fill="#eef3f8" stroke="#1d6bbd" stroke-width="1" rx="4"/>
    <text x="350" y="28" font-size="13" font-weight="600" fill="#333" text-anchor="middle">intermediate</text>
    <text x="350" y="46" font-size="11" fill="#888" text-anchor="middle">−30° → +90° (right)</text>

    <rect x="480" y="0" width="220" height="60" fill="#f5f0e8" stroke="#9b8650" stroke-width="1" rx="4"/>
    <text x="590" y="28" font-size="13" font-weight="600" fill="#333" text-anchor="middle">config</text>
    <text x="590" y="46" font-size="11" fill="#888" text-anchor="middle">+90° → +210° (bottom-left)</text>
  </g>

  <!-- Edge row -->
  <text x="20" y="370" font-size="14" font-weight="600" fill="#333">Edges (provenance)</text>
  <g transform="translate(20,390)" font-size="12" fill="#333">
    <line x1="0" y1="10" x2="80" y2="10" stroke="#3b6fa0" stroke-width="2"/>
    <text x="92" y="14">dep (parent) — #3b6fa0</text>

    <line x1="280" y1="10" x2="360" y2="10" stroke="#5d8a3a" stroke-width="2"/>
    <text x="372" y="14">dep (child) — #5d8a3a</text>

    <line x1="560" y1="10" x2="640" y2="10" stroke="#3b6fa0" stroke-width="2" stroke-dasharray="6 2"/>
    <text x="652" y="14">typed mention</text>

    <line x1="0" y1="46" x2="80" y2="46" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="3 4" opacity="0.55"/>
    <text x="92" y="50">untyped mention — #7a7a7a</text>

    <line x1="280" y1="46" x2="360" y2="46" stroke="#b9851b" stroke-width="2"/>
    <text x="372" y="50">assignee — #b9851b</text>

    <line x1="560" y1="46" x2="640" y2="46" stroke="#9b8650" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="652" y="50">semantically similar</text>
  </g>

  <!-- Age row -->
  <text x="20" y="490" font-size="14" font-weight="600" fill="#333">Age opacity (orbit-only fade; center stays at 1.0; floor 0.30)</text>
  <g transform="translate(20,500)">
    <circle cx="30" cy="20" r="14" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2" opacity="1.0"/>
    <text x="30" y="14" font-size="10" fill="#666" text-anchor="middle">today</text>
    <circle cx="100" cy="20" r="14" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2" opacity="0.75"/>
    <text x="100" y="14" font-size="10" fill="#666" text-anchor="middle">2d</text>
    <circle cx="170" cy="20" r="14" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2" opacity="0.50"/>
    <text x="170" y="14" font-size="10" fill="#666" text-anchor="middle">7d</text>
    <circle cx="240" cy="20" r="14" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2" opacity="0.30"/>
    <text x="240" y="14" font-size="10" fill="#666" text-anchor="middle">30d (floor)</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1400" height="800" fill="#fdfdfa"/>

  <!-- ============== TOP BAR ============== -->
  <rect x="0" y="0" width="1400" height="48" fill="#222" />
  <text x="20" y="30" font-size="16" font-weight="700" fill="#fff">beads-viewer</text>
  <text x="160" y="30" font-size="13" fill="#bbb">/inbox</text>
  <text x="240" y="30" font-size="12" fill="#999">·</text>
  <text x="260" y="30" font-size="12" fill="#999">operator: matt@acme (slack:U0OPERATOR1)</text>
  <text x="1380" y="30" font-size="12" fill="#999" text-anchor="end">8 intake · 2 raised</text>

  <!-- ============== FILTER CHIPS BAR ============== -->
  <g transform="translate(0,48)">
    <rect width="1400" height="40" fill="#f3efe6"/>
    <g transform="translate(20,8)" font-size="12">
      <rect width="60" height="24" rx="12" fill="#d4a017" stroke="#7a5a14" stroke-width="1"/>
      <text x="30" y="16" fill="#fff" font-weight="600" text-anchor="middle">mine</text>

      <rect x="68" width="60" height="24" rx="12" fill="#fff" stroke="#bbb" stroke-width="1"/>
      <text x="98" y="16" fill="#666" text-anchor="middle">team</text>

      <rect x="136" width="78" height="24" rx="12" fill="#fff" stroke="#bbb" stroke-width="1"/>
      <text x="175" y="16" fill="#666" text-anchor="middle">on-call</text>

      <rect x="222" width="92" height="24" rx="12" fill="#fff" stroke="#bbb" stroke-width="1"/>
      <text x="268" y="16" fill="#666" text-anchor="middle">raise-only</text>

      <text x="340" y="16" fill="#888">|  sort:</text>
      <rect x="392" width="124" height="24" rx="4" fill="#fff" stroke="#bbb" stroke-width="1"/>
      <text x="402" y="16" fill="#333">priority ▾</text>

      <text x="540" y="16" fill="#aaa">·  ↑/↓ or j/k navigate intake · → expand · Enter open · / search</text>
    </g>
  </g>

  <!-- ============== LANE HEADERS ============== -->
  <g transform="translate(0,88)" font-size="11" letter-spacing="2" font-weight="600">
    <!-- Lane 1: Intake -->
    <rect x="0" y="0" width="466" height="40" fill="#f7f4ed" stroke="#e0d8c8" stroke-width="1"/>
    <text x="20" y="24" fill="#7a6a40">INTAKE — MINE (8)</text>
    <text x="446" y="24" fill="#a89070" text-anchor="end" font-weight="400">▼ 8</text>

    <!-- Lane 2: Intermediate -->
    <rect x="466" y="0" width="467" height="40" fill="#f0f3ee" stroke="#dbe2d4" stroke-width="1"/>
    <text x="486" y="24" fill="#4a6a40">INTERMEDIATE</text>
    <text x="913" y="24" fill="#8a9a80" text-anchor="end" font-weight="400">— select an intake to expand —</text>

    <!-- Lane 3: Action -->
    <rect x="933" y="0" width="467" height="40" fill="#efeef3" stroke="#d8d4e0" stroke-width="1"/>
    <text x="953" y="24" fill="#4a4070">ACTION</text>
    <text x="1380" y="24" fill="#8a82a0" text-anchor="end" font-weight="400">— select an intake to expand —</text>
  </g>

  <!-- ============== LANE BODIES ============== -->
  <g transform="translate(0,128)">
    <!-- Lane 1 body -->
    <rect x="0" y="0" width="466" height="672" fill="#fbfaf5"/>
    <line x1="466" y1="0" x2="466" y2="672" stroke="#e0d8c8" stroke-width="1"/>

    <!-- Lane 2 body (empty / placeholder) -->
    <rect x="467" y="0" width="466" height="672" fill="#f6f8f4"/>
    <line x1="933" y1="0" x2="933" y2="672" stroke="#dbe2d4" stroke-width="1"/>

    <!-- Lane 3 body (empty / placeholder) -->
    <rect x="934" y="0" width="466" height="672" fill="#f5f4f9"/>

    <!-- Empty-state hint art for Lane 2 -->
    <g transform="translate(700,300)" opacity="0.45">
      <rect x="-90" y="-20" width="180" height="40" rx="6" fill="none" stroke="#a8baa0" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="0" y="6" font-size="12" fill="#7a8a70" text-anchor="middle" font-style="italic">no intake selected</text>
    </g>
    <g transform="translate(700,344)" opacity="0.55">
      <text x="0" y="0" font-size="11" fill="#8a9a80" text-anchor="middle">descendants &amp; tasks for the focused intake</text>
      <text x="0" y="16" font-size="11" fill="#8a9a80" text-anchor="middle">will appear here</text>
    </g>

    <!-- Empty-state hint art for Lane 3 -->
    <g transform="translate(1167,300)" opacity="0.45">
      <rect x="-90" y="-20" width="180" height="40" rx="6" fill="none" stroke="#a89eb8" stroke-width="1.5" stroke-dasharray="4 4"/>
      <text x="0" y="6" font-size="12" fill="#7a708a" text-anchor="middle" font-style="italic">no intake selected</text>
    </g>
    <g transform="translate(1167,344)" opacity="0.55">
      <text x="0" y="0" font-size="11" fill="#8a82a0" text-anchor="middle">decisions, escalations &amp; raises</text>
      <text x="0" y="16" font-size="11" fill="#8a82a0" text-anchor="middle">for the focused intake will appear here</text>
    </g>

    <!-- ============== LANE 1: INTAKE BEADS (rectangles) ============== -->

    <!-- Row 1: epic (selected = false on load; first row gets focus ring) -->
    <g transform="translate(20,16)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#1d6bbd" stroke-width="2"/>
      <rect width="6" height="64" rx="3" fill="#1d6bbd"/>
      <rect x="6" y="0" width="0" height="64" fill="#fff7ec"/>
      <!-- glyph chip -->
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#9bc7f0" stroke="#1d6bbd" stroke-width="1.5"/>
      <text x="36" y="38" font-size="16" font-weight="700" fill="#0a3a70" text-anchor="middle">E</text>
      <!-- text block -->
      <text x="64" y="22" font-size="13" font-weight="700" fill="#222">ka-0000006157</text>
      <text x="64" y="40" font-size="12" fill="#444">Epic: inbox-primary constellation view</text>
      <text x="64" y="56" font-size="10" fill="#888">P1 · in_progress · 12 descendants · 2h ago</text>
      <!-- raise badge -->
      <rect x="380" y="12" width="36" height="16" rx="3" fill="#c83a3a"/>
      <text x="398" y="24" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">RAISE</text>
      <!-- focus ring (initial focus on first row) -->
      <rect x="-2" y="-2" width="430" height="68" rx="8" fill="none" stroke="#d4a017" stroke-width="2" stroke-dasharray="4 3"/>
    </g>

    <!-- Row 2: epic -->
    <g transform="translate(20,92)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#9bc7f0" opacity="0.5"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="1.5"/>
      <text x="36" y="38" font-size="15" font-weight="700" fill="#1d4220" text-anchor="middle">S</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000003625</text>
      <text x="64" y="40" font-size="12" fill="#555">Epic: Pivot operated_by to Option B</text>
      <text x="64" y="56" font-size="10" fill="#888">P1 · open · 6 descendants · 1d ago</text>
    </g>

    <!-- Row 3: epic -->
    <g transform="translate(20,168)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#9bc7f0" opacity="0.5"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="1.5"/>
      <text x="36" y="38" font-size="15" font-weight="700" fill="#1d4220" text-anchor="middle">J</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000001573</text>
      <text x="64" y="40" font-size="12" fill="#555">Epic: Keycloak ECS → in-cluster</text>
      <text x="64" y="56" font-size="10" fill="#888">P1 · open · 9 descendants · 3d ago</text>
    </g>

    <!-- Row 4: deferred epic -->
    <g transform="translate(20,244)" opacity="0.7">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#f3c889" opacity="0.5"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#f3c889" stroke="#a36a14" stroke-width="1.5"/>
      <text x="36" y="38" font-size="15" font-weight="700" fill="#5a3a08" text-anchor="middle">E</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000005759</text>
      <text x="64" y="40" font-size="12" fill="#555">Epic: force-logout on forwardauth 403</text>
      <text x="64" y="56" font-size="10" fill="#888">P1 · deferred · 4 descendants · 5d ago</text>
    </g>

    <!-- Row 5: Slack mention as intake -->
    <g transform="translate(20,320)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#a8d4ab" opacity="0.6"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="1.5"/>
      <text x="36" y="38" font-size="16" font-weight="700" fill="#1d4220" text-anchor="middle">✉</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000004357</text>
      <text x="64" y="40" font-size="12" fill="#555">Slack mention: add gardenio-rwx e2e tests for session…</text>
      <text x="64" y="56" font-size="10" fill="#888">P2 · open · slack-mention · @matt · 4h ago</text>
    </g>

    <!-- Row 6: GitLab MR mention as intake -->
    <g transform="translate(20,396)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#9bc7f0" opacity="0.6"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#9bc7f0" stroke="#1d6bbd" stroke-width="1.5"/>
      <text x="36" y="38" font-size="16" font-weight="700" fill="#0a3a70" text-anchor="middle">@</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000001291</text>
      <text x="64" y="40" font-size="12" fill="#555">GitLab MR !2146: get them linked and visible…</text>
      <text x="64" y="56" font-size="10" fill="#888">P2 · in_progress · gitlab-mention · @matthewbaker · 6h ago</text>
    </g>

    <!-- Row 7: JIRA ticket as intake -->
    <g transform="translate(20,472)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#a8d4ab" opacity="0.6"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="1.5"/>
      <text x="36" y="38" font-size="14" font-weight="700" fill="#1d4220" text-anchor="middle">J</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000004909</text>
      <text x="64" y="40" font-size="12" fill="#555">JIRA ACME-3142: Slack workspace token refresh fails on…</text>
      <text x="64" y="56" font-size="10" fill="#888">P2 · open · source:jira · @sre-rotation · 1d ago</text>
    </g>

    <!-- Row 8: Webhook-spawned alert as intake -->
    <g transform="translate(20,548)">
      <rect width="426" height="64" rx="6" fill="#fff" stroke="#cfcfcf" stroke-width="1"/>
      <rect width="6" height="64" rx="3" fill="#f3c889" opacity="0.7"/>
      <rect x="18" y="14" width="36" height="36" rx="4" fill="#f3c889" stroke="#a36a14" stroke-width="1.5"/>
      <text x="36" y="38" font-size="15" font-weight="700" fill="#5a3a08" text-anchor="middle">⚠</text>
      <text x="64" y="22" font-size="13" font-weight="700" fill="#333">ka-0000001974</text>
      <text x="64" y="40" font-size="12" fill="#555">Webhook: deploy-rwx pipeline FAILED on main-9c84e5a7</text>
      <text x="64" y="56" font-size="10" fill="#888">P1 · open · source:webhook · auto-triage · 12m ago</text>
      <rect x="380" y="12" width="36" height="16" rx="3" fill="#c83a3a"/>
      <text x="398" y="24" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">RAISE</text>
    </g>

    <!-- Footer hint inside Lane 1 -->
    <g transform="translate(0,628)">
      <rect width="466" height="44" fill="#ede6d2" stroke="#d6c89a" stroke-width="0.5"/>
      <text x="20" y="20" font-size="11" fill="#7a6a40" font-weight="600">↑/↓ navigate · → expand lanes · Enter open · ? help</text>
      <text x="20" y="36" font-size="10" fill="#a89070">tip: hover or arrow-key any intake to reveal its descendants in the right two lanes</text>
    </g>
  </g>
</svg>

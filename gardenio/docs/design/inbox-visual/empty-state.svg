<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1000" height="500" fill="#fdfdfa"/>

  <!-- Sector guide arcs (very faint, for context) -->
  <g opacity="0.18" fill="none" stroke="#d4a017" stroke-width="1" stroke-dasharray="2 4">
    <path d="M 500 250 m -240 0 a 240 240 0 0 1 415.69 -120" />
    <path d="M 500 250 m 240 0 a 240 240 0 0 1 -120 207.85" />
    <path d="M 500 250 m -207.85 120 a 240 240 0 0 1 -32.15 -240" />
  </g>

  <!-- Sector labels (muted, captions only) -->
  <text x="500" y="50" font-size="13" fill="#a09681" text-anchor="middle" font-style="italic">action sector — no descendants yet</text>
  <text x="900" y="260" font-size="13" fill="#7a8aa0" text-anchor="middle" font-style="italic">intermediate — nothing to show</text>
  <text x="100" y="430" font-size="13" fill="#9b8650" text-anchor="middle" font-style="italic">config — nothing to show</text>

  <!-- Center intake -->
  <circle cx="500" cy="250" r="92" fill="none" stroke="#d4a017" stroke-width="1" opacity="0.35"/>
  <circle cx="500" cy="250" r="42" fill="#a8d4ab" stroke="#d4a017" stroke-width="3"/>
  <text x="500" y="256" font-size="22" font-weight="700" fill="#1d4220" text-anchor="middle">E</text>

  <!-- Center label -->
  <text x="500" y="320" font-size="14" font-weight="600" fill="#222" text-anchor="middle">ka-0000006157</text>
  <text x="500" y="338" font-size="12" fill="#555" text-anchor="middle">Epic: inbox-primary constellation view</text>
  <text x="500" y="354" font-size="11" fill="#888" text-anchor="middle">status: open · category: intake</text>

  <!-- Empty-state tip -->
  <g transform="translate(250,400)">
    <rect width="500" height="44" rx="6" fill="#fff7ec" stroke="#e6cf8a" stroke-width="1"/>
    <text x="250" y="20" font-size="12" fill="#7a5a14" text-anchor="middle" font-style="italic">tip</text>
    <text x="250" y="34" font-size="12" fill="#5a4410" text-anchor="middle">drill into the inbox row again after the first agent claims this work</text>
  </g>

  <!-- Footnote -->
  <text x="20" y="480" font-size="11" fill="#888">empty-state: view.HasAnything = false · sector captions render as static text (not nodes) · zero hydrate calls</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1400" height="800" fill="#fdfdfa"/>
  <rect x="0" y="0" width="1400" height="32" fill="#222"/>
  <text x="20" y="22" font-size="14" font-weight="600" fill="#fff">/inbox  ·  peek panel state  ·  hover/click on ka-MEm6…</text>

  <!-- Faint background constellation (low opacity to show focus) -->
  <g opacity="0.30">
    <circle cx="700" cy="400" r="42" fill="#9bc7f0" stroke="#d4a017" stroke-width="3"/>
    <text x="700" y="408" font-size="22" font-weight="700" fill="#0a3a70" text-anchor="middle">E</text>
    <line x1="700" y1="400" x2="540" y2="220" stroke="#5d8a3a"/>
    <line x1="700" y1="400" x2="700" y2="160" stroke="#5d8a3a"/>
    <line x1="700" y1="400" x2="860" y2="220" stroke="#5d8a3a"/>
    <circle cx="540" cy="220" r="22" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2"/>
    <circle cx="860" cy="220" r="22" fill="#a8d4ab" stroke="#3a8a3f" stroke-width="2"/>
  </g>

  <!-- Highlighted node -->
  <g>
    <circle cx="700" cy="160" r="30" fill="none" stroke="#d4a017" stroke-width="2" opacity="0.6"/>
    <circle cx="700" cy="160" r="22" fill="#9bc7f0" stroke="#1d6bbd" stroke-width="3"/>
    <text x="700" y="166" font-size="14" font-weight="700" fill="#0a3a70" text-anchor="middle">!</text>
  </g>

  <!-- Connector line to peek panel -->
  <line x1="722" y1="160" x2="900" y2="160" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- ============== PEEK PANEL ============== -->
  <g transform="translate(900,80)">
    <!-- shadow -->
    <rect x="4" y="4" width="480" height="540" rx="8" fill="#000" opacity="0.10"/>
    <!-- panel -->
    <rect width="480" height="540" rx="8" fill="#fff" stroke="#d4a017" stroke-width="2"/>

    <!-- Header -->
    <rect width="480" height="48" rx="8" fill="#fff7ec"/>
    <rect y="40" width="480" height="8" fill="#fff7ec"/>
    <line x1="0" y1="48" x2="480" y2="48" stroke="#d4a017" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="#9bc7f0" stroke="#1d6bbd" stroke-width="1.5"/>
    <text x="24" y="28" font-size="10" font-weight="700" fill="#0a3a70" text-anchor="middle">!</text>
    <text x="44" y="20" font-size="14" font-weight="700" fill="#222">ka-0000005668</text>
    <text x="44" y="36" font-size="11" fill="#666">escalation · in_progress · P1</text>
    <text x="460" y="28" font-size="14" fill="#888" text-anchor="end">×</text>

    <!-- Title -->
    <text x="20" y="78" font-size="14" font-weight="600" fill="#222">RWX token rotation needed before</text>
    <text x="20" y="96" font-size="14" font-weight="600" fill="#222">2026-05-12 expiry</text>

    <!-- Meta grid -->
    <g transform="translate(20,120)" font-size="11">
      <text fill="#888">assignee</text>
      <text x="100" fill="#222" font-weight="500">crew-rotate-rwx-token-9k2</text>
      <text y="20" fill="#888">parent</text>
      <text x="100" y="20" fill="#3b6fa0" font-weight="500">ka-0000006157</text>
      <text y="40" fill="#888">created</text>
      <text x="100" y="40" fill="#222">2026-05-04 14:22 · 22h ago</text>
      <text y="60" fill="#888">flag</text>
      <rect x="100" y="50" width="120" height="14" rx="3" fill="#c83a3a"/>
      <text x="160" y="60" fill="#fff" font-weight="700" text-anchor="middle">operator-blocking</text>
    </g>

    <!-- Description preview -->
    <line x1="20" y1="200" x2="460" y2="200" stroke="#eee"/>
    <text x="20" y="222" font-size="11" font-weight="600" fill="#7a6a40" letter-spacing="1">DESCRIPTION (preview)</text>
    <text x="20" y="244" font-size="12" fill="#333">Token in gardenio-rwx/rwx-token-secret expires</text>
    <text x="20" y="262" font-size="12" fill="#333">2026-05-12. Rotate via mint dashboard, update SOPS</text>
    <text x="20" y="280" font-size="12" fill="#333">file, redeploy. Without rotation, e2e dispatch</text>
    <text x="20" y="298" font-size="12" fill="#333">jobs will start failing on 2026-05-13.</text>

    <!-- Recent comments -->
    <line x1="20" y1="320" x2="460" y2="320" stroke="#eee"/>
    <text x="20" y="342" font-size="11" font-weight="600" fill="#7a6a40" letter-spacing="1">RECENT (2)</text>
    <text x="20" y="362" font-size="11" fill="#444">crew-rotate…  ·  2h ago</text>
    <text x="20" y="378" font-size="11" fill="#666">rotated in mint, updating SOPS now</text>
    <text x="20" y="402" font-size="11" fill="#444">matt  ·  30m ago</text>
    <text x="20" y="418" font-size="11" fill="#666">@gardener please verify deploy after merge</text>

    <!-- Action bar -->
    <line x1="20" y1="450" x2="460" y2="450" stroke="#eee"/>
    <g transform="translate(20,468)">
      <rect width="84" height="28" rx="4" fill="#fff" stroke="#bbb"/>
      <text x="42" y="18" font-size="11" fill="#333" text-anchor="middle">drill in →</text>

      <rect x="92" width="74" height="28" rx="4" fill="#fff" stroke="#bbb"/>
      <text x="129" y="18" font-size="11" fill="#333" text-anchor="middle">comment</text>

      <rect x="174" width="62" height="28" rx="4" fill="#fff" stroke="#bbb"/>
      <text x="205" y="18" font-size="11" fill="#333" text-anchor="middle">reparent</text>

      <rect x="244" width="118" height="28" rx="4" fill="#c83a3a" stroke="#7a1a1a"/>
      <text x="303" y="18" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">clear raise (r)</text>

      <rect x="370" width="60" height="28" rx="4" fill="#3a8a3f" stroke="#1d4220"/>
      <text x="400" y="18" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">resolve</text>
    </g>

    <!-- Keyboard hint -->
    <text x="240" y="520" font-size="10" fill="#888" text-anchor="middle" font-style="italic">space → close · Enter → drill in · r → toggle raise · c → comment</text>
  </g>

  <!-- Caption -->
  <text x="20" y="780" font-size="11" fill="#888">peek panel: 480×540 overlay anchored to focused node · existing GET /bead/{id} hydrate · no new endpoint · keyboard-resolvable in-place</text>
</svg>

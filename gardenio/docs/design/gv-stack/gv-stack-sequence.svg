<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="arrNats" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7"/>
    </marker>
  </defs>

  <style>
    .lifeline   { stroke:#aaa; stroke-dasharray:4 4; }
    .actorBox   { fill:#f4f6fa; stroke:#445; stroke-width:1; }
    .actorTxt   { font-weight:bold; }
    .activation { fill:#dbe7ff; stroke:#445; }
    .msg        { stroke:#333; stroke-width:1.2; fill:none; }
    .msgNats    { stroke:#0a7; stroke-width:1.2; stroke-dasharray:6 3; fill:none; }
    .msgErr     { stroke:#c33; stroke-width:1.2; stroke-dasharray:2 2; fill:none; }
    .label      { fill:#222; }
    .note       { fill:#fff7d6; stroke:#c8b25e; }
    .blip       { fill:#fdecec; stroke:#c66; }
    .title      { font-size:18px; font-weight:bold; }
  </style>

  <text x="20" y="28" class="title">GV operator stack — connect, push_front, pop, reconnect-with-replay</text>

  <!-- Actor columns -->
  <g>
    <rect x="60"   y="50" width="160" height="34" class="actorBox"/>
    <text x="140"  y="72" text-anchor="middle" class="actorTxt">Browser tab</text>
    <line x1="140" y1="84" x2="140" y2="790" class="lifeline"/>

    <rect x="300"  y="50" width="180" height="34" class="actorBox"/>
    <text x="390"  y="72" text-anchor="middle" class="actorTxt">beads-viewer (WS hub)</text>
    <line x1="390" y1="84" x2="390" y2="790" class="lifeline"/>

    <rect x="580"  y="50" width="180" height="34" class="actorBox"/>
    <text x="670"  y="72" text-anchor="middle" class="actorTxt">kbeads daemon</text>
    <line x1="670" y1="84" x2="670" y2="790" class="lifeline"/>

    <rect x="850"  y="50" width="160" height="34" class="actorBox"/>
    <text x="930"  y="72" text-anchor="middle" class="actorTxt">oracle agent</text>
    <line x1="930" y1="84" x2="930" y2="790" class="lifeline"/>
  </g>

  <!-- 1. Connect -->
  <g>
    <line x1="140" y1="110" x2="390" y2="110" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="105" text-anchor="middle" class="label">GET /api/v1/stack/ws  (cookie: edge-auth / OIDC / AVA)</text>

    <line x1="390" y1="135" x2="670" y2="135" class="msg" marker-end="url(#arr)"/>
    <text x="530" y="130" text-anchor="middle" class="label">snapshot tx: SELECT items ORDER BY position</text>

    <line x1="670" y1="160" x2="390" y2="160" class="msg" marker-end="url(#arr)"/>
    <text x="530" y="155" text-anchor="middle" class="label">{ seq: 42, items: [...] }</text>

    <line x1="390" y1="185" x2="140" y2="185" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="180" text-anchor="middle" class="label">{ type: "init", seq: 42, items: [...] }</text>

    <line x1="390" y1="215" x2="670" y2="215" class="msgNats" marker-end="url(#arrNats)"/>
    <text x="530" y="210" text-anchor="middle" class="label" fill="#0a7">NATS subscribe: stack.h(op).&gt;</text>
  </g>

  <!-- 2. push_front -->
  <g>
    <line x1="930" y1="260" x2="670" y2="260" class="msg" marker-end="url(#arr)"/>
    <text x="800" y="255" text-anchor="middle" class="label">POST /stack/.../push_front  { bead: "ka-XYZ", reason: "P0" }</text>

    <rect x="660" y="275" width="20" height="80" class="activation"/>
    <text x="690" y="295" class="label">tx: insert at idx 0</text>
    <text x="690" y="312" class="label">seq = 43; event row</text>
    <text x="690" y="329" class="label">NATS publish</text>

    <line x1="670" y1="370" x2="390" y2="370" class="msgNats" marker-end="url(#arrNats)"/>
    <text x="530" y="365" text-anchor="middle" class="label" fill="#0a7">stack.h(op).push_front  { seq: 43, item: {...} }</text>

    <line x1="390" y1="395" x2="140" y2="395" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="390" text-anchor="middle" class="label">{ type: "push_front", seq: 43, item: {...} }</text>
  </g>

  <!-- 3. pop with expected_top_id -->
  <g>
    <line x1="140" y1="435" x2="390" y2="435" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="430" text-anchor="middle" class="label">{ type: "pop", expected_top_id: "01HQ" }</text>

    <line x1="390" y1="460" x2="670" y2="460" class="msg" marker-end="url(#arr)"/>
    <text x="530" y="455" text-anchor="middle" class="label">POST /stack/.../pop  { expected_top: "01HQ" }</text>

    <rect x="660" y="475" width="20" height="80" class="activation"/>
    <text x="690" y="495" class="label">lock row; verify top</text>
    <text x="690" y="512" class="label">delete idx 0; seq = 44</text>
    <text x="690" y="529" class="label">NATS publish</text>

    <line x1="670" y1="570" x2="390" y2="570" class="msgNats" marker-end="url(#arrNats)"/>
    <text x="530" y="565" text-anchor="middle" class="label" fill="#0a7">stack.h(op).pop  { seq: 44, item_id: "01HQ" }</text>

    <line x1="390" y1="595" x2="140" y2="595" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="590" text-anchor="middle" class="label">{ type: "pop", seq: 44, item_id: "01HQ" }</text>
  </g>

  <!-- 4. WS drop and reconnect with replay -->
  <g>
    <rect x="60" y="620" width="160" height="22" class="blip"/>
    <text x="140" y="636" text-anchor="middle" class="label">network blip — WS dropped</text>

    <line x1="930" y1="665" x2="670" y2="665" class="msg" marker-end="url(#arr)"/>
    <text x="800" y="660" text-anchor="middle" class="label">POST /stack/.../push  → seq = 45 (buffered to NATS)</text>

    <line x1="140" y1="700" x2="390" y2="700" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="695" text-anchor="middle" class="label">WS reconnect  ?since_seq=44</text>

    <line x1="390" y1="725" x2="670" y2="725" class="msg" marker-end="url(#arr)"/>
    <text x="530" y="720" text-anchor="middle" class="label">replay tx: SELECT events WHERE seq &gt; 44</text>

    <line x1="670" y1="750" x2="390" y2="750" class="msg" marker-end="url(#arr)"/>
    <text x="530" y="745" text-anchor="middle" class="label">[ { seq: 45, kind: "push", item: {...} } ]</text>

    <line x1="390" y1="775" x2="140" y2="775" class="msg" marker-end="url(#arr)"/>
    <text x="265" y="770" text-anchor="middle" class="label">{ type: "init", seq: 44 }   then   { type: "push", seq: 45 }</text>
  </g>

  <!-- Legend -->
  <g transform="translate(820,640)">
    <rect x="0" y="0" width="260" height="105" fill="#fbfbfd" stroke="#bbb"/>
    <text x="10" y="22" class="actorTxt">Legend</text>
    <line x1="10" y1="40" x2="60" y2="40" class="msg" marker-end="url(#arr)"/>
    <text x="70" y="44" class="label">HTTP / WS message</text>
    <line x1="10" y1="62" x2="60" y2="62" class="msgNats" marker-end="url(#arrNats)"/>
    <text x="70" y="66" class="label">NATS pub/sub on STACK_EVENTS</text>
    <rect x="10" y="78" width="50" height="14" class="activation"/>
    <text x="70" y="90" class="label">server-side write tx</text>
  </g>
</svg>

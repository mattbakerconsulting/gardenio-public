<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #1a1a1a; }
      .sub { font-size: 13px; fill: #666; }
      .boxlabel { font-size: 14px; font-weight: bold; }
      .small { font-size: 11px; fill: #333; }
      .tiny { font-size: 10px; fill: #555; }
      .repl { font-size: 10px; fill: #2e7d32; font-style: italic; }
      .edge { stroke: #555; stroke-width: 1.4; fill: none; }
      .legend { font-size: 11px; fill: #333; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="920" fill="#ffffff"/>
  <text x="40" y="42" class="title">Gardenio in a Box — single-EC2 in-box architecture</text>
  <text x="40" y="64" class="sub">Every AWS managed service replaced by an in-box equivalent. No AWS API at runtime. Public-internet-safe by gate. (synthesis ka-0000000791)</text>

  <!-- INTERNET -->
  <rect x="40" y="86" width="190" height="58" rx="8" fill="#eef2f7" stroke="#8aa0b8"/>
  <text x="135" y="112" text-anchor="middle" class="boxlabel">Public Internet</text>
  <text x="135" y="132" text-anchor="middle" class="tiny">browsers · iOS app · gb/kd CLI</text>

  <!-- EC2 host outer -->
  <rect x="40" y="170" width="1200" height="700" rx="14" fill="#fbfcfd" stroke="#5b7894" stroke-width="2"/>
  <text x="60" y="196" class="boxlabel" fill="#3a536b">Single EC2 instance (r7i family) — AL2023/Ubuntu</text>
  <text x="60" y="214" class="small">Host firewall: nftables default-drop → only 22 / 80 / 443. SSH key-only. IMDSv2 hop-limit=1. kube-apiserver bound loopback/private (never public).</text>

  <!-- host-level units band -->
  <rect x="60" y="232" width="1160" height="58" rx="8" fill="#fff6e8" stroke="#d9a441"/>
  <text x="74" y="252" class="boxlabel" fill="#9c6a12">Host-level (systemd)</text>
  <rect x="250" y="240" width="230" height="42" rx="6" fill="#fff" stroke="#d9a441"/>
  <text x="365" y="258" text-anchor="middle" class="small" font-weight="bold">zot OCI registry</text>
  <text x="365" y="274" text-anchor="middle" class="tiny">127.0.0.1:5000 · seeded from crane bundle</text>
  <rect x="500" y="240" width="250" height="42" rx="6" fill="#fff" stroke="#d9a441"/>
  <text x="625" y="258" text-anchor="middle" class="small" font-weight="bold">k3s server (containerd)</text>
  <text x="625" y="274" text-anchor="middle" class="tiny">Traefik · ServiceLB · local-path · CoreDNS</text>
  <rect x="770" y="240" width="230" height="42" rx="6" fill="#fff" stroke="#d9a441"/>
  <text x="885" y="258" text-anchor="middle" class="small" font-weight="bold">runsc (gVisor)</text>
  <text x="885" y="274" text-anchor="middle" class="tiny">RuntimeClass-only · agent sandbox</text>
  <rect x="1018" y="240" width="186" height="42" rx="6" fill="#fff" stroke="#d9a441"/>
  <text x="1111" y="258" text-anchor="middle" class="small" font-weight="bold">EBS gp3 data vol</text>
  <text x="1111" y="274" text-anchor="middle" class="tiny">host EBS-snapshot = DR floor</text>

  <!-- EDGE -->
  <rect x="60" y="304" width="1160" height="92" rx="8" fill="#e8f3ee" stroke="#3a9d6e"/>
  <text x="74" y="324" class="boxlabel" fill="#1f7a4d">Edge (k3s-bundled Traefik) — fail-closed by gate</text>
  <rect x="74" y="332" width="250" height="54" rx="6" fill="#fff" stroke="#3a9d6e"/>
  <text x="199" y="352" text-anchor="middle" class="small" font-weight="bold">TLS: cert-manager</text>
  <text x="199" y="368" text-anchor="middle" class="tiny">sslip.io + per-host HTTP-01</text>
  <text x="199" y="381" text-anchor="middle" class="tiny">(publicly-trusted; local-CA fallback)</text>
  <rect x="338" y="332" width="300" height="54" rx="6" fill="#fff" stroke="#3a9d6e"/>
  <text x="488" y="350" text-anchor="middle" class="small" font-weight="bold">middleware chain (all routes)</text>
  <text x="488" y="365" text-anchor="middle" class="tiny">buffering → inFlightReq → rateLimit(depth0)</text>
  <text x="488" y="378" text-anchor="middle" class="tiny">→ security-headers → CrowdSec → forwardAuth</text>
  <rect x="652" y="332" width="260" height="54" rx="6" fill="#fff" stroke="#3a9d6e"/>
  <text x="782" y="352" text-anchor="middle" class="small" font-weight="bold">oauth2-proxy forwardAuth</text>
  <text x="782" y="368" text-anchor="middle" class="tiny">--provider=oidc → in-box Keycloak</text>
  <text x="782" y="381" text-anchor="middle" class="tiny">gates EVERY browser route (no AVA)</text>
  <rect x="926" y="332" width="280" height="54" rx="6" fill="#fff" stroke="#3a9d6e"/>
  <text x="1066" y="352" text-anchor="middle" class="small" font-weight="bold">in-box Keycloak (BUILT ✓)</text>
  <text x="1066" y="368" text-anchor="middle" class="tiny">realm-role authz · first-admin Job</text>
  <text x="1066" y="381" text-anchor="middle" class="tiny">mandatory passkey (admin)</text>

  <!-- CLUSTER workloads -->
  <rect x="60" y="410" width="1160" height="240" rx="8" fill="#eef0f7" stroke="#6a72b0"/>
  <text x="74" y="430" class="boxlabel" fill="#444f9c">k3s cluster — gardenio Helm chart (NetworkPolicy default-deny + default-deny-egress ON)</text>

  <!-- control plane workloads -->
  <rect x="74" y="442" width="200" height="60" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="174" y="462" text-anchor="middle" class="small" font-weight="bold">controller</text>
  <text x="174" y="478" text-anchor="middle" class="tiny">reconciler · podmanager</text>
  <text x="174" y="492" text-anchor="middle" class="tiny">spawns agent pods</text>

  <rect x="288" y="442" width="200" height="60" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="388" y="462" text-anchor="middle" class="small" font-weight="bold">kbeads daemon</text>
  <text x="388" y="478" text-anchor="middle" class="tiny">gRPC/HTTP · beads API</text>
  <text x="388" y="492" text-anchor="middle" class="tiny">OIDC realm-role authz</text>

  <rect x="502" y="442" width="200" height="60" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="602" y="462" text-anchor="middle" class="small" font-weight="bold">coopmux</text>
  <text x="602" y="478" text-anchor="middle" class="tiny">terminal mux · cred broker</text>
  <text x="602" y="492" text-anchor="middle" class="tiny">beads-viewer · bridges</text>

  <rect x="716" y="442" width="230" height="60" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="831" y="462" text-anchor="middle" class="small" font-weight="bold">litellm · NATS · grafana/vm*</text>
  <text x="831" y="478" text-anchor="middle" class="tiny">LLM proxy · event bus</text>
  <text x="831" y="492" text-anchor="middle" class="tiny">optional metrics stack</text>

  <!-- agent pods sandbox -->
  <rect x="960" y="442" width="246" height="60" rx="6" fill="#fdeeee" stroke="#c0392b"/>
  <text x="1083" y="462" text-anchor="middle" class="small" font-weight="bold" fill="#c0392b">agent pods (gVisor runsc)</text>
  <text x="1083" y="478" text-anchor="middle" class="tiny">untrusted model output</text>
  <text x="1083" y="492" text-anchor="middle" class="tiny">no agent↔agent · no IMDS · no PG</text>

  <!-- in-box substitution stores row -->
  <text x="74" y="528" class="boxlabel" fill="#444f9c">In-box data plane (replaces AWS managed services) — all on local-path PVCs, one host disk</text>

  <rect x="74" y="540" width="208" height="92" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="178" y="560" text-anchor="middle" class="small" font-weight="bold">in-box Postgres</text>
  <text x="178" y="577" text-anchor="middle" class="tiny">pgvector StatefulSet</text>
  <text x="178" y="592" text-anchor="middle" class="repl">replaces RDS / Aurora</text>
  <text x="178" y="610" text-anchor="middle" class="tiny">CROWN JEWELS</text>
  <text x="178" y="624" text-anchor="middle" class="tiny">pg_dumpall CronJob backup</text>

  <rect x="296" y="540" width="208" height="92" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="400" y="560" text-anchor="middle" class="small" font-weight="bold">MinIO (ka-0000004955)</text>
  <text x="400" y="577" text-anchor="middle" class="tiny">single-node single-drive</text>
  <text x="400" y="592" text-anchor="middle" class="repl">replaces S3</text>
  <text x="400" y="610" text-anchor="middle" class="tiny">S3 endpoint + path-style</text>
  <text x="400" y="624" text-anchor="middle" class="tiny">sessions/recordings (sacrificial)</text>

  <rect x="518" y="540" width="208" height="92" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="622" y="560" text-anchor="middle" class="small" font-weight="bold">in-box secrets</text>
  <text x="622" y="577" text-anchor="middle" class="tiny">k8s Secrets seeded at install</text>
  <text x="622" y="592" text-anchor="middle" class="repl">replaces SM / ESO / IRSA</text>
  <text x="622" y="610" text-anchor="middle" class="tiny">openssl rand · no plaintext</text>
  <text x="622" y="624" text-anchor="middle" class="tiny">COOP_CREDENTIAL_KEY required</text>

  <rect x="740" y="540" width="208" height="92" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="844" y="560" text-anchor="middle" class="small" font-weight="bold">local-path-provisioner</text>
  <text x="844" y="577" text-anchor="middle" class="tiny">dynamic PVCs (ensurePVC)</text>
  <text x="844" y="592" text-anchor="middle" class="repl">replaces EBS/EFS CSI</text>
  <text x="844" y="610" text-anchor="middle" class="tiny">VolumeSnapshotClass dropped</text>
  <text x="844" y="624" text-anchor="middle" class="tiny">reclaimPolicy Retain (critical)</text>

  <rect x="962" y="540" width="244" height="92" rx="6" fill="#fff" stroke="#6a72b0"/>
  <text x="1084" y="560" text-anchor="middle" class="small" font-weight="bold">cert-manager + zot</text>
  <text x="1084" y="577" text-anchor="middle" class="tiny">cert-manager: TLS issuance</text>
  <text x="1084" y="592" text-anchor="middle" class="repl">replaces Route53/ACM + registry</text>
  <text x="1084" y="610" text-anchor="middle" class="tiny">containerd mirror → 127.0.0.1:5000</text>
  <text x="1084" y="624" text-anchor="middle" class="tiny">air-gappable image bundle</text>

  <!-- bootstrap band -->
  <rect x="60" y="666" width="1160" height="56" rx="8" fill="#f3eef7" stroke="#8e6aa8"/>
  <text x="74" y="686" class="boxlabel" fill="#6e4790">Install / bootstrap</text>
  <text x="74" y="706" class="small">EC2 user-data → k3s install → (opt) runsc shim → image bundle import → seed secrets (openssl rand) → helm install -f values.yaml -f values-inbox.yaml → rollout + smoke</text>

  <!-- arrows -->
  <line x1="135" y1="144" x2="135" y2="304" class="edge" marker-end="url(#arrow)"/>
  <text x="142" y="232" class="tiny">443/80</text>
  <line x1="782" y1="386" x2="782" y2="442" class="edge" marker-end="url(#arrow)"/>
  <line x1="488" y1="386" x2="450" y2="442" class="edge" marker-end="url(#arrow)"/>
  <line x1="388" y1="502" x2="300" y2="540" class="edge" marker-end="url(#arrow)"/>
  <text x="300" y="525" class="tiny">PG</text>
  <line x1="602" y1="502" x2="420" y2="540" class="edge" marker-end="url(#arrow)"/>
  <text x="470" y="525" class="tiny">S3→MinIO</text>
  <line x1="174" y1="502" x2="600" y2="540" class="edge" marker-end="url(#arrow)"/>

  <!-- agent isolation arrows (denied) -->
  <line x1="1083" y1="502" x2="850" y2="540" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowred)"/>
  <text x="935" y="522" class="tiny" fill="#c0392b">PVC only</text>

  <!-- legend -->
  <text x="40" y="898" class="legend">Legend:  </text>
  <text x="100" y="898" class="legend" fill="#2e7d32" font-style="italic">green italic = replaces AWS service</text>
  <text x="360" y="898" class="legend" fill="#c0392b">red dashed = denied by NetworkPolicy (agent isolation)</text>
  <text x="720" y="898" class="legend" fill="#9c6a12">amber = host-level (systemd, below k8s)</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 890" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Releases: entities, as shipped</title>
  <desc>The project, release, plan, step and merge-request beads, and the release's two row lists: contents (one row per merged PR) and deployments (one row per Helm revision per target). Plan gd-UZKZ9H25UD, step 10 gd-HHMReWCHUi.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #555; }
      .hd { font-size: 14px; font-weight: bold; fill: #ffffff; }
      .hk { font-size: 11px; fill: #e8eef6; }
      .f { font-size: 11.5px; fill: #222; font-family: Menlo, Consolas, monospace; }
      .fn { font-size: 11.5px; fill: #b45309; font-family: Menlo, Consolas, monospace; font-weight: bold; }
      .tm { font-size: 11px; fill: #222; font-family: Menlo, Consolas, monospace; }
      .th { font-size: 11px; fill: #555; font-family: Menlo, Consolas, monospace; font-weight: bold; }
      .lbl { font-size: 11.5px; fill: #333; }
      .card { font-size: 12px; font-weight: bold; fill: #444; }
      .note { font-size: 11px; fill: #666; font-style: italic; }
      .edge { stroke: #444; stroke-width: 1.5; fill: none; }
      .soft { stroke: #888; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
      .open { fill: #2e7d32; }
      .shut { fill: #9aa5b1; }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="890" fill="#ffffff"/>
  <text x="32" y="40" class="title">Releases: entities, as shipped</text>
  <text x="32" y="62" class="sub">Boxes are beads; contents[] and deployments[] are rows on the release bead, not beads. Bold amber fields are the ones this plan added. Arrows read "parent → child" unless labelled.</text>

  <!-- Project -->
  <rect x="32" y="90" width="300" height="230" rx="8" fill="#ffffff" stroke="#3d5a80" stroke-width="1.5"/>
  <rect x="32" y="90" width="300" height="38" rx="8" fill="#3d5a80"/><rect x="32" y="114" width="300" height="14" fill="#3d5a80"/>
  <text x="46" y="114" class="hd">project</text><text x="120" y="114" class="hk">type=project · kind config</text>
  <text x="46" y="150" class="f">name, prefix, git_url, repos</text>
  <text x="46" y="168" class="f">default_branch, github_app,</text>
  <text x="46" y="186" class="f">github_installation_id</text>
  <text x="46" y="204" class="f">land_kind, land_owner_sub</text>
  <text x="46" y="230" class="fn">release_tag_pattern</text>
  <text x="46" y="248" class="fn">release_targets [{name, kind}]</text>
  <text x="46" y="266" class="fn">release_branch</text>
  <text x="46" y="290" class="note">gardenio gd-Ui9jl00KfA: calver pattern,</text>
  <text x="46" y="306" class="note">targets [prod (k3s)], branch unset = main</text>

  <!-- Release -->
  <rect x="400" y="90" width="430" height="262" rx="8" fill="#fffaf0" stroke="#b45309" stroke-width="1.8"/>
  <rect x="400" y="90" width="430" height="38" rx="8" fill="#b45309"/><rect x="400" y="114" width="430" height="14" fill="#b45309"/>
  <text x="414" y="114" class="hd">release</text><text x="482" y="114" class="hk">type=release · kind data · created closed</text>
  <text x="414" y="150" class="fn">project, tag</text><text x="530" y="150" class="lbl">unique together (idempotency_key)</text>
  <text x="414" y="168" class="fn">sha, previous, previous_tag</text>
  <text x="414" y="186" class="fn">cut_at, cut_by, source</text><text x="604" y="186" class="lbl">script · webhook · backfill · manual</text>
  <text x="414" y="204" class="fn">built_at, images[]</text><text x="560" y="204" class="lbl">gb release built, by hand</text>
  <text x="414" y="222" class="fn">contents[], contents_complete</text>
  <text x="414" y="240" class="fn">deployments[]</text><text x="520" y="240" class="lbl">written only by the daemon's deploy route</text>
  <text x="414" y="258" class="fn">status</text><text x="470" y="258" class="lbl">derived: cut · built · live · superseded</text>
  <text x="414" y="284" class="lbl">live = an open deployment row; superseded = rows, all closed;</text>
  <text x="414" y="300" class="lbl">built = built_at and no rows; cut = neither</text>
  <text x="414" y="324" class="note">title "gardenio 2026.306.3"; parent: its project bead</text>
  <text x="414" y="340" class="note">previous → the release of previous_tag (same project)</text>

  <!-- Target -->
  <rect x="900" y="90" width="348" height="112" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <rect x="900" y="90" width="348" height="38" rx="8" fill="#2e7d32"/><rect x="900" y="114" width="348" height="14" fill="#2e7d32"/>
  <text x="914" y="114" class="hd">target</text><text x="970" y="114" class="hk">a row of release_targets, not a bead</text>
  <text x="914" y="150" class="f">{name: prod, kind: k3s}</text>
  <text x="914" y="170" class="lbl">kinds: k3s · box · land · github-environment</text>
  <text x="914" y="190" class="note">a GitHub environment is declared on its first row</text>

  <!-- Contents row card -->
  <rect x="900" y="226" width="348" height="126" rx="8" fill="#ffffff" stroke="#d9b98a" stroke-width="1.4"/>
  <text x="914" y="248" class="card">contents[] row: one merged PR</text>
  <text x="914" y="268" class="f">pr, train, url, title,</text>
  <text x="914" y="286" class="f">merge_sha, merged_at,</text>
  <text x="914" y="304" class="f">mr_bead, task, step, plan</text>
  <text x="914" y="326" class="lbl">no plan = unplanned; no task = a direct</text>
  <text x="914" y="342" class="lbl">commit or a branch with no bead</text>

  <!-- Deployments table -->
  <rect x="32" y="380" width="828" height="244" rx="8" fill="#fffaf0" stroke="#b45309" stroke-width="1.5"/>
  <text x="48" y="404" class="card">deployments[] rows: one per Helm revision per target (gd-yn68eNqnu6)</text>
  <text x="48" y="420" class="note">gardenio's prod on 2026-11-02, as kd release show prints it</text>
  <text x="56" y="444" class="th" xml:space="preserve">release     rev  since                 until                 via         by        image_tag</text>
  <rect x="40" y="452" width="8" height="16" class="shut"/>
  <text x="56" y="464" class="tm" xml:space="preserve">2026.306.2  267  2026-11-02T08:45:45Z  2026-11-02T15:12:28Z  reconciler  observed  2026.306.2</text>
  <rect x="40" y="474" width="8" height="16" class="shut"/>
  <text x="56" y="486" class="tm" xml:space="preserve">2026.306.3  268  2026-11-02T15:12:28Z  2026-11-02T22:23:34Z  reconciler  observed  2026.306.3</text>
  <rect x="40" y="496" width="8" height="16" class="shut"/>
  <text x="56" y="508" class="tm" xml:space="preserve">2026.306.3  269  2026-11-02T22:23:34Z  2026-11-02T22:49:11Z  reconciler  observed  2026.306.3</text>
  <rect x="40" y="518" width="8" height="16" class="open"/>
  <text x="56" y="530" class="tm" xml:space="preserve">2026.306.3  270  2026-11-02T22:49:11Z  (empty: runs now)     reconciler  observed  2026.306.3</text>
  <text x="48" y="554" class="lbl">target prod, kind k3s on every row. A new revision of the same release closes its own row and opens one.</text>
  <text x="48" y="572" class="lbl">A revision already recorded changes nothing; a revision another release holds is refused (409).</text>
  <text x="48" y="590" class="lbl">A row older than the newest goes into history, closed. One open row per (project, target):</text>
  <text x="48" y="608" class="lbl">the release that holds it is what runs there. kd release repair-deployments rebuilds a history.</text>

  <!-- Plan / step / MR -->
  <rect x="32" y="680" width="300" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="32" y="680" width="300" height="38" rx="8" fill="#6b7280"/><rect x="32" y="704" width="300" height="14" fill="#6b7280"/>
  <text x="46" y="704" class="hd">plan</text><text x="92" y="704" class="hk">type=epic · label plan</text>
  <text x="46" y="740" class="f">plan_state, step_order</text>
  <text x="46" y="766" class="lbl">gb release record comments on it:</text>
  <text x="46" y="784" class="lbl">"Shipped in gardenio 2026.306.3"</text>

  <rect x="400" y="680" width="430" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="400" y="680" width="430" height="38" rx="8" fill="#6b7280"/><rect x="400" y="704" width="430" height="14" fill="#6b7280"/>
  <text x="414" y="704" class="hd">step / task</text><text x="502" y="704" class="hk">type=task (or bug, feature, chore)</text>
  <text x="414" y="740" class="f">mr_url, forge, awaits_release</text>
  <text x="414" y="766" class="lbl">awaits_release=true: closed by the first deployment row</text>
  <text x="414" y="784" class="lbl">of a release that carries its PRs (P-R3, gd-ZM7NEBPAqZ)</text>

  <rect x="900" y="680" width="348" height="122" rx="8" fill="#ffffff" stroke="#7b4fa0" stroke-width="1.5"/>
  <rect x="900" y="680" width="348" height="38" rx="8" fill="#7b4fa0"/><rect x="900" y="704" width="348" height="14" fill="#7b4fa0"/>
  <text x="914" y="704" class="hd">PR</text><text x="944" y="704" class="hk">type=merge-request · kind issue</text>
  <text x="914" y="740" class="f">mr_url (key), mr_iid = PR #</text>
  <text x="914" y="758" class="f">mr_state, mr_outcome, author</text>
  <text x="914" y="776" class="fn">merge_sha, merged_at</text>
  <text x="914" y="794" class="note">stamped by github-bridge at merge</text>

  <!-- Edges -->
  <path d="M332 200 H398" class="edge" marker-end="url(#a)"/>
  <text x="338" y="190" class="lbl">parent</text>
  <text x="338" y="218" class="card">1 → many</text>

  <path d="M830 290 H898" class="edge" marker-end="url(#a)"/>
  <text x="836" y="282" class="lbl">contents[]</text>

  <path d="M615 352 V378" class="edge" marker-end="url(#a)"/>
  <text x="624" y="370" class="lbl">deployments[] (a field)</text>

  <path d="M860 430 H880 V160 H898" class="soft" marker-end="url(#a)"/>
  <text x="866" y="448" class="lbl">.target</text>

  <path d="M182 90 C182 70 1000 66 1074 88" class="soft" marker-end="url(#a)"/>
  <text x="560" y="85" class="lbl">declares (release_targets)</text>

  <path d="M32 300 H14 V740 H30" class="edge" marker-end="url(#a)"/>
  <text x="28" y="660" class="lbl" transform="rotate(-90 28 660)">parent (plan in project)</text>

  <path d="M332 740 H398" class="edge" marker-end="url(#a)"/>
  <text x="338" y="732" class="lbl">parent</text>

  <path d="M830 730 H898" class="edge" marker-end="url(#a)"/>
  <text x="840" y="722" class="lbl">produces</text>
  <path d="M898 760 H830" class="soft" marker-end="url(#a)"/>
  <text x="836" y="776" class="lbl">triggered-by</text>

  <path d="M1074 352 V678" class="soft" marker-end="url(#a)"/>
  <text x="1082" y="520" class="lbl">.mr_bead</text>
  <path d="M940 352 V662 H760 V678" class="soft" marker-end="url(#a)"/>
  <text x="948" y="600" class="lbl">.task, .step</text>
  <path d="M920 352 V650 H300 V678" class="soft" marker-end="url(#a)"/>
  <text x="560" y="644" class="lbl">contents[].plan</text>

  <!-- Footer -->
  <rect x="32" y="824" width="1216" height="48" rx="8" fill="#fafafa" stroke="#ddd"/>
  <text x="48" y="844" class="lbl">contents[] joins a PR to its MR bead, task, step and plan by reference, so the release needs no new edge type. Readers group the rows by plan, unplanned last.</text>
  <text x="48" y="862" class="lbl">A deployment is a row on the release, not a bead: one read answers "where does it run". Status is a function of built_at and the rows, so a replay cannot leave it wrong.</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #555; }
      .lane { font-size: 12px; font-weight: bold; fill: #555; }
      .n { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .h { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
      .t { font-size: 11px; fill: #333; }
      .m { font-size: 11px; fill: #333; font-family: Menlo, Consolas, monospace; }
      .note { font-size: 11px; fill: #666; font-style: italic; }
      .box { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.2; }
      .edge { stroke: #444; stroke-width: 1.6; fill: none; }
    </style>
  </defs>
  <rect x="0" y="0" width="1280" height="640" fill="#ffffff"/>
  <text x="32" y="40" class="title">A tenant's first release</text>
  <text x="32" y="62" class="sub">A land provisioned by gb lands provision has release_tag_pattern = semver and one prod target. No other setup.</text>

  <!-- lanes -->
  <rect x="32" y="84" width="1216" height="150" rx="6" fill="#f4f7fb"/>
  <text x="44" y="104" class="lane">TENANT</text>
  <rect x="32" y="246" width="1216" height="150" rx="6" fill="#fdf8ef"/>
  <text x="44" y="266" class="lane">GARDENIO</text>
  <rect x="32" y="408" width="1216" height="150" rx="6" fill="#f2f8f1"/>
  <text x="44" y="428" class="lane">WHAT THEY SEE</text>

  <!-- 1 tag push -->
  <g transform="translate(60,116)">
    <rect width="200" height="100" rx="8" class="box"/>
    <circle cx="20" cy="20" r="13" fill="#2f6db5"/><text x="15" y="25" class="n">1</text>
    <text x="42" y="25" class="h">Tag push</text>
    <text x="14" y="52" class="m">git tag v1.0.0</text>
    <text x="14" y="68" class="m">git push --tags</text>
    <text x="14" y="88" class="t">on the land's one repo</text>
  </g>

  <!-- 2 bridge -->
  <g transform="translate(300,278)">
    <rect width="220" height="100" rx="8" class="box"/>
    <circle cx="20" cy="20" r="13" fill="#2f6db5"/><text x="15" y="25" class="n">2</text>
    <text x="42" y="25" class="h">github-bridge</text>
    <text x="14" y="50" class="t">the 5-min tag poll (v1)</text>
    <text x="14" y="66" class="t">repo → project by git_url;</text>
    <text x="14" y="82" class="t">v1.0.0 matches ^v\d+\.\d+\.\d+$</text>
  </g>

  <!-- 3 release bead -->
  <g transform="translate(560,278)">
    <rect width="220" height="100" rx="8" fill="#fffaf0" stroke="#b45309" stroke-width="1.6"/>
    <circle cx="20" cy="20" r="13" fill="#b45309"/><text x="15" y="25" class="n">3</text>
    <text x="42" y="25" class="h">Release bead</text>
    <text x="14" y="50" class="m">tag v1.0.0, status cut</text>
    <text x="14" y="66" class="t">no previous: contents = every merged</text>
    <text x="14" y="82" class="t">PR up to the tag, grouped by plan</text>
  </g>

  <!-- 4 truck loaded -->
  <g transform="translate(560,440)">
    <rect width="220" height="100" rx="8" class="box"/>
    <circle cx="20" cy="20" r="13" fill="#2e7d32"/><text x="15" y="25" class="n">4</text>
    <text x="42" y="25" class="h">Truck loaded</text>
    <text x="14" y="50" class="t">/garden: the land's truck by the barn,</text>
    <text x="14" y="66" class="t">one crate per PR, from the bins;</text>
    <text x="14" y="82" class="t">the bins' crates are marked v1.0.0</text>
  </g>

  <!-- 5 deployed -->
  <g transform="translate(820,116)">
    <rect width="220" height="100" rx="8" class="box"/>
    <circle cx="20" cy="20" r="13" fill="#2f6db5"/><text x="15" y="25" class="n">5</text>
    <text x="42" y="25" class="h">Deployed</text>
    <text x="14" y="50" class="m">gl release deployed v1.0.0</text>
    <text x="14" y="66" class="m">  --target prod</text>
    <text x="14" y="86" class="t">or a GitHub Deployment to env prod</text>
  </g>

  <!-- 6 deployment row -->
  <g transform="translate(820,278)">
    <rect width="220" height="100" rx="8" fill="#fffaf0" stroke="#b45309" stroke-width="1.6"/>
    <circle cx="20" cy="20" r="13" fill="#b45309"/><text x="15" y="25" class="n">6</text>
    <text x="42" y="25" class="h">Deployment row</text>
    <text x="14" y="50" class="m">target prod, since now,</text>
    <text x="14" y="66" class="m">via contract, by owner</text>
    <text x="14" y="86" class="t">status cut → live</text>
  </g>

  <!-- 7 truck drives out -->
  <g transform="translate(820,440)">
    <rect width="200" height="100" rx="8" class="box"/>
    <circle cx="20" cy="20" r="13" fill="#2e7d32"/><text x="15" y="25" class="n">7</text>
    <text x="42" y="25" class="h">Truck drives out</text>
    <text x="14" y="50" class="t">down the Yard road and out of</text>
    <text x="14" y="66" class="t">the farm; v1.0.0 on its door</text>
    <text x="14" y="86" class="t">and on prod's sign</text>
  </g>

  <!-- 8 Release page -->
  <g transform="translate(1060,440)">
    <rect width="176" height="100" rx="8" class="box"/>
    <circle cx="20" cy="20" r="13" fill="#2e7d32"/><text x="15" y="25" class="n">8</text>
    <text x="42" y="25" class="h">Release page</text>
    <text x="14" y="50" class="t">v1.0.0 · live on prod</text>
    <text x="14" y="66" class="t">since 14:02Z</text>
    <text x="14" y="86" class="t">PRs by plan; gl too</text>
  </g>

  <!-- edges -->
  <path d="M260 166 C290 166 300 230 330 276" class="edge" marker-end="url(#a)"/>
  <path d="M520 328 H558" class="edge" marker-end="url(#a)"/>
  <path d="M670 378 V438" class="edge" marker-end="url(#a)"/>
  <path d="M780 476 C800 476 800 220 818 180" class="edge" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="788" y="236" class="note" transform="rotate(-90 788 236)">later</text>
  <path d="M930 216 V276" class="edge" marker-end="url(#a)"/>
  <path d="M930 378 V438" class="edge" marker-end="url(#a)"/>
  <path d="M1020 490 H1058" class="edge" marker-end="url(#a)"/>

  <text x="32" y="584" class="t">A project with no release_tag_pattern sees none of this: no truck, no Release page, no work in github-bridge for its tags.</text>
  <text x="32" y="602" class="t">The land owner may report a deployment of their own project only; a tag that does not match the pattern is ignored with a debug log.</text>
  <text x="32" y="620" class="note">In v1 step 2 is the 5-minute tag poll (owner decision Q1 in releases-design.md); a webhook may come later.</text>
</svg>

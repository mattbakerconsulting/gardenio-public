<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 920" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Releases: data flow, as shipped</title>
  <desc>Who writes a release bead and its deployment rows, and who reads them: the farm document, the truck, the shipped stamp, the release face and panel, the beads-viewer Release pages, the Lands contract and kd. Plan gd-UZKZ9H25UD, step 10 gd-HHMReWCHUi.</desc>
  <defs>
    <marker id="a-cut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f6db5"/></marker>
    <marker id="a-build" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b7791f"/></marker>
    <marker id="a-dep" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="a-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b4fa0"/></marker>
    <marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
      .sub { font-size: 12px; fill: #555; }
      .col { font-size: 12px; font-weight: bold; fill: #777; letter-spacing: 1px; }
      .h { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
      .t { font-size: 11px; fill: #333; }
      .m { font-size: 11px; fill: #333; font-family: Menlo, Consolas, monospace; }
      .off { font-size: 11px; fill: #9a3412; font-style: italic; }
      .note { font-size: 11px; fill: #666; font-style: italic; }
      .box { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.2; }
      .idle { fill: #f6f6f6; stroke: #9aa5b1; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .rel { fill: #fffaf0; stroke: #c98a1a; stroke-width: 1.4; }
      .cut { stroke: #2f6db5; stroke-width: 1.8; fill: none; }
      .build { stroke: #b7791f; stroke-width: 1.8; fill: none; }
      .dep { stroke: #2e7d32; stroke-width: 1.8; fill: none; }
      .merge { stroke: #7b4fa0; stroke-width: 1.8; fill: none; }
      .read { stroke: #555; stroke-width: 1.6; fill: none; }
      .hop { stroke: #555; stroke-width: 1.4; fill: none; stroke-dasharray: 2 3; }
      .dash { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1320" height="920" fill="#ffffff"/>
  <text x="32" y="40" class="title">Releases: data flow, as shipped</text>
  <text x="32" y="62" class="sub">gardenio/docs/releases-design.md §3 to §4 · plan gd-UZKZ9H25UD · solid box = runs on prod · dashed grey box = built, not running on prod (bead named)</text>

  <text x="32" y="98" class="col">WHO WRITES (WHAT TRIGGERS IT)</text>
  <text x="600" y="98" class="col">KBEADS DAEMON (THE RECORD)</text>
  <text x="950" y="98" class="col">WHO READS IT</text>

  <!-- ===== Writers ===== -->
  <rect x="32" y="110" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="130" class="h">release-cut.sh, after the tag push (captain or operator)</text>
  <text x="46" y="146" class="m">gb release record &lt;tag&gt;  ·  gb release backfill --last 8</text>
  <text x="46" y="161" class="t">source=script / backfill; the release, its contents, previous_tag; "Shipped in" plan comments</text>

  <rect x="32" y="176" width="520" height="58" rx="8" class="idle"/>
  <text x="46" y="196" class="h">github-bridge tag recorder (create / push webhook, 5-min tag poll)</text>
  <text x="46" y="212" class="t">source=webhook; same recorder code, idempotent on (project, tag)</text>
  <text x="46" y="227" class="off">not running on prod: github-bridge is not enabled on k3s (gd-AUdgkFSB1f)</text>

  <rect x="32" y="242" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="262" class="h">Operator or captain, by hand</text>
  <text x="46" y="278" class="m">gb release built &lt;tag&gt;  ·  gb release backfill --since &lt;tag&gt;</text>
  <text x="46" y="293" class="t">built_at (cut → built); nothing runs built at cut time (§7)</text>

  <rect x="32" y="308" width="520" height="58" rx="8" class="idle"/>
  <text x="46" y="328" class="h">release-deployer CronJob: release-deploy.sh rule 9</text>
  <text x="46" y="344" class="t">verified roll → tag at the new revision, via=script; after a rollback, by=rollback</text>
  <text x="46" y="359" class="off">paused (release-deployer-pause) until P-R4 gd-iK8RnuLG3W</text>

  <rect x="32" y="374" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="394" class="h">Controller release reconciler (leader, once a minute)</text>
  <text x="46" y="410" class="t">Helm release Secrets: a new revision, settled 10 min → a row</text>
  <text x="46" y="425" class="m">via=reconciler by=observed   (prod's rows today)</text>

  <rect x="32" y="440" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="460" class="h">A box's reporter, to the home daemon</text>
  <text x="46" y="476" class="t">same passes, target box-&lt;name&gt;, by=box:&lt;name&gt;, as a home-realm machine client</text>
  <text x="46" y="491" class="note">needs a declared box-&lt;name&gt; target; gardenio declares none yet</text>

  <rect x="32" y="506" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="526" class="h">History and repair (captain or operator)</text>
  <text x="46" y="542" class="m">gb release backfill-deployments  ·  kd release repair-deployments</text>
  <text x="46" y="557" class="t">event beads → rows, by=backfill; collapse rows to one per (target, revision)</text>

  <rect x="32" y="572" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="592" class="h">helm_deploy escalation closed success · kd release deploy</text>
  <text x="46" y="608" class="m">gb escalation close --deployed-tag &lt;tag&gt; --revision &lt;n&gt;</text>
  <text x="46" y="623" class="t">via=escalation, by the executor  ·  kd: via=script by default</text>

  <rect x="32" y="638" width="520" height="58" rx="8" class="box"/>
  <text x="46" y="658" class="h">A land's CD: gl release deployed &lt;tag&gt; --target prod</text>
  <text x="46" y="674" class="m">POST /lands/v1/lands/{land}/releases/{release}/deployments</text>
  <text x="46" y="689" class="t">via=contract; the land's owner, for its own project only</text>

  <rect x="32" y="704" width="520" height="58" rx="8" class="idle"/>
  <text x="46" y="724" class="h">github-bridge: deployment_status success · PR merged</text>
  <text x="46" y="740" class="t">a row via=github, by=github:&lt;login&gt;  ·  merge_sha, merged_at on the MR bead</text>
  <text x="46" y="755" class="off">not running: bridge off on k3s (gd-AUdgkFSB1f); App lacks Deployments (gd-ShFmcrAXy5)</text>

  <!-- writer → daemon -->
  <path d="M552 139 H598" class="cut" marker-end="url(#a-cut)"/>
  <path d="M552 205 H598" class="cut dash" marker-end="url(#a-cut)"/>
  <path d="M552 271 H598" class="build" marker-end="url(#a-build)"/>
  <path d="M552 337 H598" class="dep dash" marker-end="url(#a-dep)"/>
  <path d="M552 403 H598" class="dep" marker-end="url(#a-dep)"/>
  <path d="M552 469 H598" class="dep" marker-end="url(#a-dep)"/>
  <path d="M552 535 H598" class="dep" marker-end="url(#a-dep)"/>
  <path d="M552 601 H598" class="dep" marker-end="url(#a-dep)"/>
  <path d="M552 667 H598" class="dep" marker-end="url(#a-dep)"/>
  <path d="M552 733 H598" class="merge dash" marker-end="url(#a-merge)"/>

  <!-- ===== Daemon ===== -->
  <rect x="600" y="110" width="310" height="652" rx="10" fill="#f4f7fb" stroke="#5b7aa0" stroke-width="1.6"/>
  <rect x="614" y="124" width="282" height="300" rx="8" class="rel"/>
  <text x="628" y="146" class="h">release bead (type=release, data)</text>
  <text x="628" y="163" class="t">child of the project bead · closed</text>
  <text x="628" y="178" class="t">unique (project, tag)</text>
  <text x="628" y="200" class="m">tag, sha, previous, previous_tag</text>
  <text x="628" y="216" class="m">cut_at, cut_by, source</text>
  <text x="628" y="232" class="m">built_at, images[]</text>
  <text x="628" y="248" class="m">contents[], contents_complete</text>
  <text x="628" y="264" class="m">deployments[]: target, kind,</text>
  <text x="628" y="280" class="m">  since, until, revision,</text>
  <text x="628" y="296" class="m">  via, by, image_tag</text>
  <text x="628" y="320" class="h">one row per Helm revision</text>
  <text x="628" y="336" class="h">per target</text>
  <text x="628" y="354" class="t">one open row per (project, target)</text>
  <text x="628" y="378" class="h">status, derived</text>
  <text x="628" y="396" class="m">cut · built · live · superseded</text>
  <text x="628" y="412" class="t">never written by a client</text>

  <rect x="614" y="436" width="282" height="200" rx="8" class="box"/>
  <text x="628" y="456" class="h">Routes</text>
  <text x="628" y="474" class="m">POST /v1/releases</text>
  <text x="628" y="490" class="m">POST /v1/releases/{id}/deployments</text>
  <text x="628" y="505" class="t">closes the holder's row on the target,</text>
  <text x="628" y="519" class="t">a repeat revision changes nothing, a</text>
  <text x="628" y="533" class="t">revision on another release is 409; then</text>
  <text x="628" y="547" class="t">closes the awaits_release work it carries</text>
  <text x="628" y="565" class="m">POST /v1/releases/repair-deployments</text>
  <text x="628" y="585" class="m">GET  /v1/releases?project=</text>
  <text x="628" y="601" class="m">GET  /v1/releases/{id|tag}</text>
  <text x="628" y="622" class="note">writes: releaseWriterDenial (§3.3)</text>

  <rect x="614" y="648" width="282" height="48" rx="8" class="box"/>
  <text x="628" y="668" class="h">project bead</text>
  <text x="628" y="685" class="m">release_tag_pattern, _targets</text>

  <rect x="614" y="704" width="282" height="46" rx="8" class="box"/>
  <text x="628" y="723" class="h">plan → step → merge-request bead</text>
  <text x="628" y="740" class="t">contents rows name mr_bead, task, step, plan</text>

  <!-- ===== Readers ===== -->
  <rect x="950" y="110" width="338" height="60" rx="8" class="box"/>
  <text x="964" y="130" class="h">Farm document (gardenhub, farm_releases.go)</text>
  <text x="964" y="146" class="t">releases blob: latest, deployments, recent, shipping;</text>
  <text x="964" y="161" class="t">FarmPlan.shipped · 12 per project, every 60 s</text>

  <rect x="980" y="182" width="308" height="62" rx="8" class="box"/>
  <text x="994" y="201" class="h">Release truck on /garden (truck.js)</text>
  <text x="994" y="217" class="t">in the Barn cell's bay: a crate per plan, tag plate,</text>
  <text x="994" y="232" class="t">PR count on the door, board over the cab; drives out</text>

  <rect x="980" y="254" width="308" height="48" rx="8" class="box"/>
  <text x="994" y="273" class="h">A plot's shipped stamp and sign line</text>
  <text x="994" y="291" class="m">shipped in 2026.306.3 · prod</text>

  <rect x="950" y="330" width="338" height="56" rx="8" class="box"/>
  <text x="964" y="350" class="h">Viewer JSON (releases_api.go)</text>
  <text x="964" y="367" class="m">GET /api/releases?project=</text>
  <text x="964" y="381" class="m">GET /api/releases/{id}</text>

  <rect x="980" y="398" width="308" height="50" rx="8" class="box"/>
  <text x="994" y="417" class="h">beads-viewer Release pages</text>
  <text x="994" y="435" class="m">/releases  ·  /release/{id}</text>

  <rect x="980" y="458" width="308" height="50" rx="8" class="box"/>
  <text x="994" y="477" class="h">/garden release panel (release.js)</text>
  <text x="994" y="495" class="m">/garden?release=&lt;id&gt;</text><text x="1170" y="495" class="note">truck click / Enter</text>

  <rect x="950" y="534" width="338" height="56" rx="8" class="box"/>
  <text x="964" y="554" class="h">/garden bead view: the release face</text>
  <text x="964" y="571" class="t">relface.js: status, where it runs and ran,</text>
  <text x="964" y="585" class="t">contents by plan, "Open the changelog"</text>

  <rect x="950" y="600" width="338" height="56" rx="8" class="box"/>
  <text x="964" y="620" class="h">Viewer pages, per request</text>
  <text x="964" y="637" class="t">"Shipped in" on a bead or plan page, the index's</text>
  <text x="964" y="651" class="t">"Latest release" tile, /health Build &amp; release</text>

  <rect x="950" y="666" width="338" height="44" rx="8" class="box"/>
  <text x="964" y="685" class="h">Lands contract → gl release list, show</text>
  <text x="964" y="701" class="m">GET /lands/v1/lands/{land}/releases</text>

  <rect x="950" y="718" width="338" height="44" rx="8" class="box"/>
  <text x="964" y="737" class="h">kd release list, show</text>
  <text x="964" y="753" class="t">the CLI, straight from the daemon</text>

  <!-- daemon → readers -->
  <path d="M910 140 H948" class="read" marker-end="url(#a-read)"/>
  <path d="M966 170 V212 H978" class="read" marker-end="url(#a-read)"/>
  <path d="M966 212 V278 H978" class="read" marker-end="url(#a-read)"/>
  <path d="M910 358 H948" class="read" marker-end="url(#a-read)"/>
  <path d="M966 386 V423 H978" class="read" marker-end="url(#a-read)"/>
  <path d="M966 423 V483 H978" class="read" marker-end="url(#a-read)"/>
  <path d="M910 562 H948" class="read" marker-end="url(#a-read)"/>
  <path d="M910 628 H948" class="read" marker-end="url(#a-read)"/>
  <path d="M910 688 H948" class="read" marker-end="url(#a-read)"/>
  <path d="M910 740 H948" class="read" marker-end="url(#a-read)"/>

  <!-- links between surfaces -->
  <path d="M1288 222 C1312 222 1312 483 1290 483" class="hop" marker-end="url(#a-read)"/>
  <path d="M1288 560 C1306 560 1306 500 1290 496" class="hop" marker-end="url(#a-read)"/>

  <!-- Legend -->
  <g transform="translate(32,790)">
    <rect x="0" y="0" width="1256" height="110" rx="8" fill="#fafafa" stroke="#ddd"/>
    <path d="M16 24 H56" class="cut" marker-end="url(#a-cut)"/><text x="64" y="28" class="t">cut: the release and its contents, status = cut</text>
    <path d="M330 24 H370" class="build" marker-end="url(#a-build)"/><text x="378" y="28" class="t">build: built_at, status = built</text>
    <path d="M590 24 H630" class="dep" marker-end="url(#a-dep)"/><text x="638" y="28" class="t">deploy: a deployments[] row, status = live</text>
    <path d="M920 24 H960" class="merge" marker-end="url(#a-merge)"/><text x="968" y="28" class="t">merge: what the contents join on</text>
    <path d="M16 50 H56" class="read" marker-end="url(#a-read)"/><text x="64" y="54" class="t">read</text>
    <path d="M120 50 H160" class="hop" marker-end="url(#a-read)"/><text x="168" y="54" class="t">a link between surfaces (truck → panel; face → panel)</text>
    <path d="M520 50 H560" class="dep dash" marker-end="url(#a-dep)"/><text x="568" y="54" class="t">a writer that is built and not running on prod</text>
    <text x="16" y="80" class="t">Every writer ends in the one release bead, and every surface reads only it, so a project's releases look the same whoever wrote them.</text>
    <text x="16" y="98" class="note">On /garden a link never leaves /garden: the truck, the face and the panel link each other; the viewer's Release page is a separate page.</text>
  </g>
</svg>

  <g>
    <text class="num" x="56" y="98">6</text><text class="lbl" x="56" y="112">agents live</text>
    <text class="num" x="168" y="98">14</text><text class="lbl" x="168" y="112">ready</text>
    <text class="num" x="262" y="98">3</text><text class="lbl" x="262" y="112">decisions</text>
    <text class="num" x="348" y="98">2</text><text class="lbl" x="348" y="112">P0 open</text>
    <text class="num" x="438" y="98">49</text><text class="lbl" x="438" y="112">closed / 2h</text>
    <text class="num" x="560" y="98">7</text><text class="lbl" x="560" y="112">MRs open</text>

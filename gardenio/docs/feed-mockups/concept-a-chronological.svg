<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg{fill:#0f1117}
      .panel{fill:#171a23;stroke:#262b38;stroke-width:1}
      .h1{fill:#e8eaf0;font-size:22px;font-weight:700}
      .h2{fill:#c7ccd9;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
      .muted{fill:#7d8597;font-size:12px}
      .txt{fill:#d4d8e2;font-size:13px}
      .ttl{fill:#e8eaf0;font-size:13.5px;font-weight:600}
      .strong{fill:#e8eaf0;font-size:13px;font-weight:600}
      .num{fill:#e8eaf0;font-size:18px;font-weight:700}
      .lbl{fill:#7d8597;font-size:10px;letter-spacing:.03em}
      .tick{fill:#5b6273;font-size:11px}
      .kd{fill:#8b93a7;font-size:11px;font-family:ui-monospace,Menlo,monospace}
    </style>
  </defs>

  <rect class="bg" width="1200" height="940"/>


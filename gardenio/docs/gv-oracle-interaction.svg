<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1000" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e7c47"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="bold">GV Oracle — interaction sequence</text>
  <text x="550" y="50" text-anchor="middle" font-size="12" fill="#555">operator opens view → 5 items → dispatch → urgent push-front → chatbox nudge → reply</text>

  <!-- Lifelines: 4 columns -->
  <!-- column centers: 140, 400, 700, 980 -->
  <g font-weight="bold" text-anchor="middle">
    <rect x="60" y="70" width="160" height="36" rx="6" fill="#fdecea" stroke="#c0392b"/>
    <text x="140" y="93">Operator</text>

    <rect x="320" y="70" width="160" height="36" rx="6" fill="#eaf3fd" stroke="#2c5aa0"/>
    <text x="400" y="93">beads-viewer (WS)</text>

    <rect x="620" y="70" width="160" height="36" rx="6" fill="#eef7ee" stroke="#1e7c47"/>
    <text x="700" y="93">Stack service</text>

    <rect x="900" y="70" width="160" height="36" rx="6" fill="#fff4e0" stroke="#b8860b"/>
    <text x="980" y="93">Oracle</text>
  </g>

  <!-- Lifelines vertical -->
  <g stroke="#bbb" stroke-dasharray="4 4">
    <line x1="140" y1="106" x2="140" y2="970"/>
    <line x1="400" y1="106" x2="400" y2="970"/>
    <line x1="700" y1="106" x2="700" y2="970"/>
    <line x1="980" y1="106" x2="980" y2="970"/>
  </g>

  <!-- =========================================== -->
  <!-- Phase 1: open + snapshot -->
  <!-- =========================================== -->
  <text x="20" y="135" font-weight="bold" fill="#555">T0</text>
  <text x="20" y="150" fill="#555" font-size="11">open</text>

  <!-- operator -> viewer -->
  <line x1="140" y1="140" x2="395" y2="140" stroke="#c0392b" marker-end="url(#arrow-red)"/>
  <text x="270" y="134" text-anchor="middle" fill="#c0392b">open /next-up</text>

  <!-- viewer -> stack: WS connect + snapshot -->
  <line x1="400" y1="170" x2="695" y2="170" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="548" y="164" text-anchor="middle" fill="#2c5aa0">WS connect (subscribe operator=U12345)</text>

  <!-- stack -> viewer: snapshot 5 items, seq=42 -->
  <line x1="700" y1="200" x2="405" y2="200" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="552" y="194" text-anchor="middle" fill="#1e7c47">init: 5 items, last_seq=42</text>

  <!-- viewer -> operator: renders card 1 -->
  <line x1="395" y1="230" x2="145" y2="230" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="270" y="224" text-anchor="middle" fill="#2c5aa0">renders card #1 (ka-DEC1)</text>

  <!-- separator -->
  <line x1="60" y1="260" x2="1060" y2="260" stroke="#ddd"/>

  <!-- =========================================== -->
  <!-- Phase 2: dispatch + drain -->
  <!-- =========================================== -->
  <text x="20" y="285" font-weight="bold" fill="#555">T0+12s</text>
  <text x="20" y="300" fill="#555" font-size="11">dispatch</text>

  <!-- operator -> viewer: presses resolve -->
  <line x1="140" y1="290" x2="395" y2="290" stroke="#c0392b" marker-end="url(#arrow-red)"/>
  <text x="270" y="284" text-anchor="middle" fill="#c0392b">presses [resolve] on ka-DEC1</text>

  <!-- viewer -> stack: pop + dispatched -->
  <line x1="400" y1="320" x2="695" y2="320" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="548" y="314" text-anchor="middle" fill="#2c5aa0">POST /pop?action=resolve&amp;item=ka-DEC1</text>

  <!-- stack -> oracle: emit pop_dispatched -->
  <line x1="705" y1="350" x2="975" y2="350" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="840" y="344" text-anchor="middle" fill="#1e7c47">pop_dispatched(ka-DEC1)  seq=43</text>

  <!-- stack: len(4) < N, emit stack_drained -->
  <line x1="705" y1="380" x2="975" y2="380" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="840" y="374" text-anchor="middle" fill="#1e7c47">stack_drained (len=4 &lt; refill_low=3?)  wake!</text>

  <!-- oracle re-ranks and pushes new top -->
  <line x1="975" y1="410" x2="705" y2="410" stroke="#b8860b" marker-end="url(#arrow)"/>
  <text x="840" y="404" text-anchor="middle" fill="#b8860b">push(ka-006) with why={…}  seq=44</text>

  <!-- stack -> viewer: WS push -->
  <line x1="700" y1="440" x2="405" y2="440" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="552" y="434" text-anchor="middle" fill="#1e7c47">WS push(seq=44)</text>

  <!-- viewer renders card 2 (client already cached) -->
  <line x1="395" y1="470" x2="145" y2="470" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="270" y="464" text-anchor="middle" fill="#2c5aa0">renders card #2 (was already cached)</text>

  <line x1="60" y1="500" x2="1060" y2="500" stroke="#ddd"/>

  <!-- =========================================== -->
  <!-- Phase 3: urgent push-front (P0 escalation arrives) -->
  <!-- =========================================== -->
  <text x="20" y="525" font-weight="bold" fill="#555">T0+40s</text>
  <text x="20" y="540" fill="#555" font-size="11">urgent</text>

  <!-- ambient: P0 escalation bead created somewhere — show as oracle-side trigger -->
  <line x1="975" y1="530" x2="975" y2="530"/>
  <rect x="855" y="515" width="250" height="22" rx="3" fill="#fff7e8" stroke="#b8860b" stroke-dasharray="2 2"/>
  <text x="980" y="531" text-anchor="middle" fill="#b8860b" font-size="11">bead_event: P0 escalation ka-ESC1 created</text>

  <!-- oracle re-ranks; push_front -->
  <line x1="975" y1="565" x2="705" y2="565" stroke="#b8860b" marker-end="url(#arrow)"/>
  <text x="840" y="559" text-anchor="middle" fill="#b8860b">push_front(ka-ESC1)  seq=45  why="P0 esc., assigned to you 8s ago"</text>

  <!-- stack -> viewer WS push_front -->
  <line x1="700" y1="595" x2="405" y2="595" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="552" y="589" text-anchor="middle" fill="#1e7c47">WS push_front(seq=45)</text>

  <!-- viewer -> operator: toast -->
  <line x1="395" y1="625" x2="145" y2="625" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="270" y="619" text-anchor="middle" fill="#2c5aa0">toast: "P0 escalation — switch?"</text>

  <!-- operator accepts -->
  <line x1="140" y1="655" x2="395" y2="655" stroke="#c0392b" marker-end="url(#arrow-red)"/>
  <text x="270" y="649" text-anchor="middle" fill="#c0392b">accepts (or auto-swap)</text>

  <!-- viewer renders ESC1 card -->
  <line x1="395" y1="685" x2="145" y2="685" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="270" y="679" text-anchor="middle" fill="#2c5aa0">renders ka-ESC1 card</text>

  <line x1="60" y1="715" x2="1060" y2="715" stroke="#ddd"/>

  <!-- =========================================== -->
  <!-- Phase 4: operator nudge via chatbox -->
  <!-- =========================================== -->
  <text x="20" y="740" font-weight="bold" fill="#555">T1+0s</text>
  <text x="20" y="755" fill="#555" font-size="11">nudge</text>

  <!-- operator types -->
  <line x1="140" y1="745" x2="395" y2="745" stroke="#c0392b" marker-end="url(#arrow-red)"/>
  <text x="270" y="739" text-anchor="middle" fill="#c0392b">chatbox: "no MR reviews today"</text>

  <!-- viewer -> stack (or directly to a nudge bus) -->
  <line x1="400" y1="775" x2="695" y2="775" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="548" y="769" text-anchor="middle" fill="#2c5aa0">POST /nudge (envelope)</text>

  <!-- stack/proxy -> oracle: operator_nudge -->
  <line x1="705" y1="805" x2="975" y2="805" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="840" y="799" text-anchor="middle" fill="#1e7c47">operator_nudge (free_text)</text>

  <!-- oracle parses, applies soft_filter, removes MR items -->
  <line x1="975" y1="835" x2="705" y2="835" stroke="#b8860b" marker-end="url(#arrow)"/>
  <text x="840" y="829" text-anchor="middle" fill="#b8860b">remove(ka-MR1, ka-MR2)  seq=46,47</text>

  <!-- oracle reply -->
  <line x1="975" y1="865" x2="705" y2="865" stroke="#b8860b" marker-end="url(#arrow)"/>
  <text x="840" y="859" text-anchor="middle" fill="#b8860b">reply: "Filter applied until tomorrow."</text>

  <!-- stack -> viewer WS remove + reply forward -->
  <line x1="700" y1="895" x2="405" y2="895" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="552" y="889" text-anchor="middle" fill="#1e7c47">WS remove×2 (seq=46,47) + reply</text>

  <!-- viewer renders chatbox reply + refreshes next card -->
  <line x1="395" y1="925" x2="145" y2="925" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="270" y="919" text-anchor="middle" fill="#2c5aa0">chatbox reply inline; next card refreshes</text>

  <!-- =========================================== -->
  <!-- Footer legend -->
  <!-- =========================================== -->
  <g font-size="11">
    <rect x="60" y="945" width="14" height="10" fill="#fdecea" stroke="#c0392b"/>
    <text x="80" y="954">Operator</text>
    <rect x="160" y="945" width="14" height="10" fill="#eaf3fd" stroke="#2c5aa0"/>
    <text x="180" y="954">Viewer (WS)</text>
    <rect x="290" y="945" width="14" height="10" fill="#eef7ee" stroke="#1e7c47"/>
    <text x="310" y="954">Stack service</text>
    <rect x="420" y="945" width="14" height="10" fill="#fff4e0" stroke="#b8860b"/>
    <text x="440" y="954">Oracle</text>
    <text x="560" y="954" fill="#666">seq numbers monotone per-operator · oracle yields between wakes</text>
  </g>
</svg>

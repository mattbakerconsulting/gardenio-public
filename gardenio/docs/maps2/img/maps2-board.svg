<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <style>
      .bg{fill:#0d1117}
      .panel{fill:#161b22;stroke:#30363d;stroke-width:1;rx:10}
      .title{fill:#e6edf3;font-weight:700}
      .sub{fill:#8b949e}
      .muted{fill:#6e7681}
      .name{fill:#e6edf3;font-weight:600}
      .trig{fill:#1f2937;stroke:#3b82f6;stroke-width:1.2;rx:8}
      .trigtxt{fill:#93c5fd;font-weight:600}
      .edge{stroke:#3b82f6;stroke-width:1.6;fill:none;opacity:.7}
      .pillP{fill:#1c2b22;stroke:#2ea043;stroke-width:1}
      .pillS{fill:#332701;stroke:#d29922;stroke-width:1}
      .pillX{fill:#3a1d1d;stroke:#f85149;stroke-width:1}
      .pillN{fill:#21262d;stroke:#484f58;stroke-width:1}
      .runtxt{font-size:11px;font-weight:600}
      .disk{stroke-width:0}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>

  <!-- header -->
  <text x="40" y="48" class="title" font-size="26">maps2 — the gardener fleet</text>
  <text x="40" y="74" class="sub" font-size="14">Every gardener as a connected card · trigger → gardener → recent runs · 14 gardeners, 3 need attention</text>
  <rect x="950" y="30" width="210" height="34" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="966" y="52" class="muted" font-size="13">⌕  filter gardeners…</text>

  <!-- ============ CARD TEMPLATE (repeated). One card unit = trigger node + card + run strip ============ -->

  <!-- Card 1 : healthy / making progress -->
  <g transform="translate(40,110)">
    <rect class="trig" x="0" y="34" width="120" height="44"/>
    <text x="60" y="52" text-anchor="middle" class="trigtxt" font-size="11">⏱ cron</text>
    <text x="60" y="68" text-anchor="middle" class="sub" font-size="10">*/30 · in 12m</text>
    <path class="edge" d="M120 56 H150"/>
    <rect class="panel" x="150" y="0" width="300" height="112" rx="10"/>
    <circle cx="182" cy="34" r="15" class="disk" fill="#2ea043"/>
    <text x="182" y="39" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">RD</text>
    <text x="208" y="30" class="name" font-size="15">ready-queue-drainer</text>
    <text x="208" y="48" class="sub" font-size="11">drain gardenio ready queue → 0</text>
    <text x="208" y="66" class="muted" font-size="10.5">owner: matt · 42 spawned / 39 done</text>
    <!-- run strip -->
    <text x="166" y="92" class="muted" font-size="10">runs</text>
    <g transform="translate(196,82)">
      <rect class="pillP" x="0"  y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="26" y="0" width="22" height="16" rx="4"/>
      <rect class="pillS" x="52" y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="78" y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="104" y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="130" y="0" width="22" height="16" rx="4"/>
    </g>
  </g>

  <!-- Card 2 : stuck / needs attention (emphasized) -->
  <g transform="translate(620,110)">
    <rect class="trig" x="0" y="34" width="120" height="44" stroke="#f85149"/>
    <text x="60" y="52" text-anchor="middle" class="trigtxt" font-size="11" fill="#ff7b72">◆ bead-query</text>
    <text x="60" y="68" text-anchor="middle" class="sub" font-size="10">open bugs &gt; 0</text>
    <path class="edge" d="M120 56 H150" stroke="#f85149"/>
    <rect class="panel" x="150" y="0" width="300" height="112" rx="10" stroke="#f85149" stroke-width="1.6"/>
    <circle cx="182" cy="34" r="15" class="disk" fill="#f85149"/>
    <text x="182" y="39" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">BT</text>
    <text x="208" y="30" class="name" font-size="15">bug-triage</text>
    <text x="208" y="48" class="sub" font-size="11">keep open bugs triaged</text>
    <text x="208" y="66" fill="#ff7b72" font-size="10.5" font-weight="600">⚠ stuck · resume budget spent</text>
    <text x="166" y="92" class="muted" font-size="10">runs</text>
    <g transform="translate(196,82)">
      <rect class="pillP" x="0"  y="0" width="22" height="16" rx="4"/>
      <rect class="pillS" x="26" y="0" width="22" height="16" rx="4"/>
      <rect class="pillS" x="52" y="0" width="22" height="16" rx="4"/>
      <rect class="pillX" x="78" y="0" width="22" height="16" rx="4"/>
      <rect class="pillX" x="104" y="0" width="22" height="16" rx="4"/>
      <rect class="pillX" x="130" y="0" width="22" height="16" rx="4"/>
    </g>
  </g>

  <!-- Card 3 : event trigger / neutral -->
  <g transform="translate(40,260)">
    <rect class="trig" x="0" y="34" width="120" height="44" stroke="#a371f7"/>
    <text x="60" y="52" text-anchor="middle" class="trigtxt" font-size="11" fill="#d2a8ff">⚡ on-event</text>
    <text x="60" y="68" text-anchor="middle" class="sub" font-size="10">MR merged</text>
    <path class="edge" d="M120 56 H150" stroke="#a371f7"/>
    <rect class="panel" x="150" y="0" width="300" height="112" rx="10"/>
    <circle cx="182" cy="34" r="15" class="disk" fill="#6e7681"/>
    <text x="182" y="39" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">RL</text>
    <text x="208" y="30" class="name" font-size="15">release-cutter</text>
    <text x="208" y="48" class="sub" font-size="11">cut release on main merge</text>
    <text x="208" y="66" class="muted" font-size="10.5">owner: ops · 8 spawned / 8 done</text>
    <text x="166" y="92" class="muted" font-size="10">runs</text>
    <g transform="translate(196,82)">
      <rect class="pillP" x="0"  y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="26" y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="52" y="0" width="22" height="16" rx="4"/>
      <rect class="pillN" x="78" y="0" width="22" height="16" rx="4"/>
      <rect class="pillN" x="104" y="0" width="22" height="16" rx="4"/>
      <rect class="pillN" x="130" y="0" width="22" height="16" rx="4"/>
    </g>
  </g>

  <!-- Card 4 : disabled -->
  <g transform="translate(620,260)" opacity="0.6">
    <rect class="trig" x="0" y="34" width="120" height="44" stroke="#484f58" stroke-dasharray="4 3"/>
    <text x="60" y="52" text-anchor="middle" class="trigtxt" font-size="11" fill="#8b949e">⏸ paused</text>
    <text x="60" y="68" text-anchor="middle" class="sub" font-size="10">disabled</text>
    <path class="edge" d="M120 56 H150" stroke="#484f58" stroke-dasharray="4 3"/>
    <rect class="panel" x="150" y="0" width="300" height="112" rx="10" stroke-dasharray="4 3"/>
    <circle cx="182" cy="34" r="15" class="disk" fill="#484f58"/>
    <text x="182" y="39" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">DT</text>
    <text x="208" y="30" class="name" font-size="15">docs-tidy</text>
    <text x="208" y="48" class="sub" font-size="11">tidy stale docs nightly</text>
    <text x="208" y="66" class="muted" font-size="10.5">disabled by operator</text>
    <text x="166" y="92" class="muted" font-size="10">runs</text>
    <g transform="translate(196,82)">
      <rect class="pillP" x="0"  y="0" width="22" height="16" rx="4"/>
      <rect class="pillP" x="26" y="0" width="22" height="16" rx="4"/>
      <rect class="pillN" x="52" y="0" width="22" height="16" rx="4"/>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(40,440)">
    <rect class="panel" x="0" y="0" width="1120" height="120" rx="10"/>
    <text x="20" y="30" class="title" font-size="15">card anatomy &amp; legend</text>
    <!-- trigger swatches -->
    <text x="20" y="58" class="sub" font-size="12">trigger node (left, color = kind):</text>
    <rect class="trig" x="260" y="46" width="70" height="20"/><text x="295" y="60" text-anchor="middle" class="trigtxt" font-size="10">cron</text>
    <rect class="trig" x="340" y="46" width="90" height="20" stroke="#f85149"/><text x="385" y="60" text-anchor="middle" font-size="10" fill="#ff7b72">bead-query</text>
    <rect class="trig" x="440" y="46" width="80" height="20" stroke="#a371f7"/><text x="480" y="60" text-anchor="middle" font-size="10" fill="#d2a8ff">on-event</text>
    <rect class="trig" x="530" y="46" width="70" height="20" stroke="#484f58" stroke-dasharray="4 3"/><text x="565" y="60" text-anchor="middle" font-size="10" fill="#8b949e">paused</text>
    <!-- run pills -->
    <text x="20" y="92" class="sub" font-size="12">recent-run verdicts (right, newest →):</text>
    <rect class="pillP" x="260" y="80" width="26" height="16" rx="4"/><text x="292" y="92" class="sub" font-size="11">progress</text>
    <rect class="pillS" x="360" y="80" width="26" height="16" rx="4"/><text x="392" y="92" class="sub" font-size="11">stalled</text>
    <rect class="pillX" x="450" y="80" width="26" height="16" rx="4"/><text x="482" y="92" class="sub" font-size="11">stuck/fail</text>
    <rect class="pillN" x="560" y="80" width="26" height="16" rx="4"/><text x="592" y="92" class="sub" font-size="11">neutral / never-ran</text>
    <text x="760" y="92" class="muted" font-size="11">red card ring = needs attention · dashed = disabled · hover a card for counters &amp; next-fire</text>
  </g>

  <text x="40" y="600" class="muted" font-size="12">click any card → /gardener/{id} life-thread · click trigger node → /triggers · click a run pill → that iteration's agent bead</text>
  <text x="40" y="624" class="muted" font-size="12">grows later: live-agent overlay · owned-epic rollup · cost/context chips · grouping by owner</text>
</svg>

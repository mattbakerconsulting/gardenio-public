<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <style>
      .bg{fill:#0d1117}
      .panel{fill:#161b22;stroke:#30363d;stroke-width:1}
      .ann{fill:#58a6ff;font-weight:600}
      .annline{stroke:#58a6ff;stroke-width:1;stroke-dasharray:3 3;fill:none}
      .field{fill:#7d8590;font-style:italic}
      .sub{fill:#8b949e}
      .muted{fill:#6e7681}
      .name{fill:#e6edf3;font-weight:700}
      .trigtxt{fill:#93c5fd;font-weight:600}
    </style>
  </defs>
  <rect class="bg" width="1100" height="560"/>
  <text x="40" y="46" fill="#e6edf3" font-weight="700" font-size="24">one connected gardener card — anatomy</text>
  <text x="40" y="72" class="sub" font-size="14">each region is fed by an EXISTING gardener data field; maps2 is a new view, not new data</text>

  <!-- the card unit, large -->
  <g transform="translate(250,150)">
    <!-- trigger node -->
    <rect x="0" y="50" width="150" height="60" rx="10" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="75" y="76" text-anchor="middle" class="trigtxt" font-size="14">⏱ cron</text>
    <text x="75" y="96" text-anchor="middle" class="sub" font-size="12">*/30 · fires in 12m</text>
    <!-- edge -->
    <path d="M150 80 H195" stroke="#3b82f6" stroke-width="2" fill="none"/>
    <circle cx="172" cy="80" r="2.5" fill="#3b82f6"/>
    <!-- card -->
    <rect x="195" y="0" width="420" height="160" rx="12" fill="#161b22" stroke="#2ea043" stroke-width="1.5"/>
    <circle cx="235" cy="44" r="20" fill="#2ea043"/>
    <text x="235" y="50" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">RD</text>
    <text x="270" y="38" class="name" font-size="18">ready-queue-drainer</text>
    <text x="270" y="60" class="sub" font-size="13">drain gardenio ready queue → 0</text>
    <text x="270" y="84" class="muted" font-size="12">owner: matt · 42 spawned / 39 completed</text>
    <line x1="215" y1="104" x2="595" y2="104" stroke="#30363d"/>
    <text x="215" y="128" class="muted" font-size="11">RECENT RUNS</text>
    <g transform="translate(300,116)">
      <rect x="0"   y="0" width="28" height="20" rx="5" fill="#1c2b22" stroke="#2ea043"/>
      <rect x="34"  y="0" width="28" height="20" rx="5" fill="#1c2b22" stroke="#2ea043"/>
      <rect x="68"  y="0" width="28" height="20" rx="5" fill="#332701" stroke="#d29922"/>
      <rect x="102" y="0" width="28" height="20" rx="5" fill="#1c2b22" stroke="#2ea043"/>
      <rect x="136" y="0" width="28" height="20" rx="5" fill="#1c2b22" stroke="#2ea043"/>
      <rect x="170" y="0" width="28" height="20" rx="5" fill="#1c2b22" stroke="#2ea043"/>
    </g>
    <text x="215" y="150" class="muted" font-size="10">← older            newer →</text>
  </g>

  <!-- annotations -->
  <!-- trigger -->
  <text x="250" y="340" class="ann" font-size="13">① TRIGGER NODE</text>
  <text x="250" y="358" class="field" font-size="11.5">gardenerViewFromBead.Cron / NextFireRelative</text>
  <text x="250" y="374" class="field" font-size="11.5">or bead_query / on-event kind</text>
  <path class="annline" d="M300 300 L310 260"/>

  <!-- identity -->
  <text x="560" y="408" class="ann" font-size="13">② IDENTITY</text>
  <text x="560" y="426" class="field" font-size="11.5">gardenerRowView: Name, TerminalGoal,</text>
  <text x="560" y="442" class="field" font-size="11.5">OwnerDisplay, Initials, verdict color</text>
  <path class="annline" d="M620 188 L640 400"/>

  <!-- counters -->
  <text x="560" y="478" class="ann" font-size="13">③ COUNTERS</text>
  <text x="560" y="496" class="field" font-size="11.5">RunsSpawned / RunsCompleted (engine snapshot</text>
  <text x="560" y="512" class="field" font-size="11.5">or derived from iteration beads)</text>
  <path class="annline" d="M640 234 L660 470"/>

  <!-- runs -->
  <text x="250" y="430" class="ann" font-size="13">④ RECENT-RUN STRIP</text>
  <text x="250" y="448" class="field" font-size="11.5">gardener_timeline.go: schedule_prior_agent_id</text>
  <text x="250" y="464" class="field" font-size="11.5">chain → last N iterations + VerdictKind</text>
  <text x="250" y="480" class="field" font-size="11.5">(progress / stalled / stuck)</text>
  <path class="annline" d="M360 290 L330 420"/>
</svg>

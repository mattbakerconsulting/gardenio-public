<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs><style>
    .bg{fill:#0d1117}
    .h{fill:#e6edf3;font-weight:700}
    .sub{fill:#8b949e}
    .bad{fill:#f85149;font-weight:600}
    .good{fill:#3fb950;font-weight:600}
    .panel{fill:#161b22;stroke:#30363d}
  </style></defs>
  <rect class="bg" width="1100" height="520"/>
  <text x="40" y="44" class="h" font-size="22">old /maps  →  maps2</text>

  <!-- OLD -->
  <text x="40" y="84" class="bad" font-size="16">✗ old /maps (good name, garbage page)</text>
  <rect class="panel" x="40" y="100" width="490" height="360" rx="10"/>
  <!-- undifferentiated dot grid -->
  <text x="60" y="128" class="sub" font-size="12">a grid of undifferentiated dots + a radial constellation</text>
  <g fill="#484f58">
    <circle cx="90"  cy="170" r="16"/><circle cx="160" cy="170" r="16"/><circle cx="230" cy="170" r="16"/><circle cx="300" cy="170" r="16"/><circle cx="370" cy="170" r="16"/><circle cx="440" cy="170" r="16"/>
    <circle cx="90"  cy="230" r="16"/><circle cx="160" cy="230" r="16"/><circle cx="230" cy="230" r="16"/><circle cx="300" cy="230" r="16"/><circle cx="370" cy="230" r="16"/><circle cx="440" cy="230" r="16"/>
    <circle cx="90"  cy="290" r="16"/><circle cx="160" cy="290" r="16"/><circle cx="230" cy="290" r="16"/><circle cx="300" cy="290" r="16"/>
  </g>
  <text x="60" y="350" class="sub" font-size="12">✗ no trigger condition shown</text>
  <text x="60" y="372" class="sub" font-size="12">✗ no run outcomes — just hover tooltips</text>
  <text x="60" y="394" class="sub" font-size="12">✗ three bolted-together modes (picker / radial / grid)</text>
  <text x="60" y="416" class="sub" font-size="12">✗ answers no real operator question at a glance</text>

  <!-- arrow -->
  <path d="M548 280 H572" stroke="#8b949e" stroke-width="2"/>
  <path d="M566 274 L574 280 L566 286 Z" fill="#8b949e"/>

  <!-- NEW -->
  <text x="590" y="84" class="good" font-size="16">✓ maps2 (connected cards)</text>
  <rect class="panel" x="590" y="100" width="470" height="360" rx="10"/>
  <text x="610" y="128" class="sub" font-size="12">trigger → gardener → recent runs, one unit per gardener</text>
  <!-- three mini cards -->
  <g>
    <rect x="610" y="150" width="56" height="34" rx="6" fill="#1f2937" stroke="#3b82f6"/><text x="638" y="171" text-anchor="middle" fill="#93c5fd" font-size="10">cron</text>
    <path d="M666 167 H686" stroke="#3b82f6"/>
    <rect x="686" y="146" width="350" height="42" rx="8" fill="#161b22" stroke="#2ea043"/>
    <circle cx="708" cy="167" r="12" fill="#2ea043"/><text x="730" y="164" fill="#e6edf3" font-size="12" font-weight="600">ready-queue-drainer</text><text x="730" y="180" fill="#8b949e" font-size="10">42/39</text>
    <g transform="translate(900,159)"><rect x="0" y="0" width="16" height="12" rx="3" fill="#1c2b22" stroke="#2ea043"/><rect x="20" y="0" width="16" height="12" rx="3" fill="#1c2b22" stroke="#2ea043"/><rect x="40" y="0" width="16" height="12" rx="3" fill="#332701" stroke="#d29922"/><rect x="60" y="0" width="16" height="12" rx="3" fill="#1c2b22" stroke="#2ea043"/></g>
  </g>
  <g>
    <rect x="610" y="208" width="56" height="34" rx="6" fill="#1f2937" stroke="#f85149"/><text x="638" y="229" text-anchor="middle" fill="#ff7b72" font-size="9">bead-q</text>
    <path d="M666 225 H686" stroke="#f85149"/>
    <rect x="686" y="204" width="350" height="42" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <circle cx="708" cy="225" r="12" fill="#f85149"/><text x="730" y="222" fill="#e6edf3" font-size="12" font-weight="600">bug-triage</text><text x="730" y="238" fill="#ff7b72" font-size="10">⚠ stuck</text>
    <g transform="translate(900,217)"><rect x="0" y="0" width="16" height="12" rx="3" fill="#1c2b22" stroke="#2ea043"/><rect x="20" y="0" width="16" height="12" rx="3" fill="#332701" stroke="#d29922"/><rect x="40" y="0" width="16" height="12" rx="3" fill="#3a1d1d" stroke="#f85149"/><rect x="60" y="0" width="16" height="12" rx="3" fill="#3a1d1d" stroke="#f85149"/></g>
  </g>
  <g>
    <rect x="610" y="266" width="56" height="34" rx="6" fill="#1f2937" stroke="#a371f7"/><text x="638" y="287" text-anchor="middle" fill="#d2a8ff" font-size="9">event</text>
    <path d="M666 283 H686" stroke="#a371f7"/>
    <rect x="686" y="262" width="350" height="42" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="708" cy="283" r="12" fill="#6e7681"/><text x="730" y="280" fill="#e6edf3" font-size="12" font-weight="600">release-cutter</text><text x="730" y="296" fill="#8b949e" font-size="10">8/8</text>
    <g transform="translate(900,275)"><rect x="0" y="0" width="16" height="12" rx="3" fill="#1c2b22" stroke="#2ea043"/><rect x="20" y="0" width="16" height="12" rx="3" fill="#1c2b22" stroke="#2ea043"/><rect x="40" y="0" width="16" height="12" rx="3" fill="#21262d" stroke="#484f58"/></g>
  </g>
  <text x="610" y="350" class="good" font-size="12">✓ trigger condition is a wired node</text>
  <text x="610" y="372" class="good" font-size="12">✓ recent run verdicts inline (newest →)</text>
  <text x="610" y="394" class="good" font-size="12">✓ needs-attention gardeners pull the eye</text>
  <text x="610" y="416" class="good" font-size="12">✓ one card = one gardener's whole story</text>
  <text x="610" y="438" class="sub" font-size="11">…room to grow: live agents, owned epics, cost</text>
</svg>

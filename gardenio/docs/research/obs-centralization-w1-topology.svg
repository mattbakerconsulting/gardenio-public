<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <style>
      .producer { fill:#eaf3ff; stroke:#1f6feb; }
      .producer-text { fill:#0b2a55; font-weight:600; }
      .channel { fill:#fff4d6; stroke:#b87a00; }
      .channel-text { fill:#5a3a00; font-weight:600; }
      .pii { fill:#ffe6e6; stroke:#c0392b; }
      .pii-text { fill:#6b1a14; font-weight:700; }
      .core { fill:#e9ffe6; stroke:#1f9b3a; }
      .core-text { fill:#0d4a17; font-weight:600; }
      .store { fill:#f0e6ff; stroke:#6f42c1; }
      .store-text { fill:#3a1d6e; font-weight:600; }
      .ui { fill:#e6f6ff; stroke:#0a8aad; }
      .ui-text { fill:#013a4d; font-weight:600; }
      .group { fill:none; stroke:#888; stroke-dasharray:6 4; }
      .group-label { fill:#444; font-weight:700; font-size:12px; }
      .edge { stroke:#444; stroke-width:1.5; fill:none; }
      .edge-label { fill:#222; font-size:11px; }
      .note { fill:#666; font-size:11px; font-style:italic; }
      .title { font-weight:700; font-size:18px; fill:#111; }
      .legend-box { fill:#fff; stroke:#888; }
    </style>
  </defs>

  <text x="20" y="28" class="title">Centralized observability backplane — W1 topology (initial target: devops EKS; portable to ECS-provisioned)</text>

  <!-- Producer column (left) -->
  <rect x="20" y="60" width="280" height="600" class="group"/>
  <text x="30" y="78" class="group-label">Producers (tenant clusters &amp; ACME internal)</text>

  <rect x="40" y="100" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="125" text-anchor="middle" class="producer-text">site-api  (ECS, dev/qa/prod tenants)</text>
  <text x="160" y="145" text-anchor="middle">OTEL SDK / collector sidecar</text>

  <rect x="40" y="170" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="195" text-anchor="middle" class="producer-text">study-web  (ECS)</text>
  <text x="160" y="215" text-anchor="middle">OTEL SDK / browser RUM</text>

  <rect x="40" y="240" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="265" text-anchor="middle" class="producer-text">sponsor-api  (ECS)</text>
  <text x="160" y="285" text-anchor="middle">OTEL SDK</text>

  <rect x="40" y="310" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="335" text-anchor="middle" class="producer-text">ACME internal services  (EKS)</text>
  <text x="160" y="355" text-anchor="middle">gardenio, keycloak, ava-edge…</text>

  <rect x="40" y="380" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="405" text-anchor="middle" class="producer-text">RDS / Aurora exporters (ECS)</text>
  <text x="160" y="425" text-anchor="middle">postgres_exporter → Prom remote_write</text>

  <rect x="40" y="450" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="475" text-anchor="middle" class="producer-text">Keycloak  (ECS task)</text>
  <text x="160" y="495" text-anchor="middle">OTEL Java agent (agroal, JVM)</text>

  <rect x="40" y="520" width="240" height="60" rx="6" class="producer"/>
  <text x="160" y="545" text-anchor="middle" class="producer-text">k6-perf / load gen</text>
  <text x="160" y="565" text-anchor="middle">OTEL exporter (perf bake-ins)</text>

  <text x="40" y="615" class="note">Each producer declares observability_channel = "central"</text>
  <text x="40" y="630" class="note">(see W3). No URL/secret literals in producer config.</text>
  <text x="40" y="645" class="note">Discovery resolves name → endpoint + auth secret.</text>

  <!-- Channel resolver -->
  <rect x="330" y="220" width="180" height="140" rx="8" class="channel"/>
  <text x="420" y="245" text-anchor="middle" class="channel-text">Channel resolver</text>
  <text x="420" y="265" text-anchor="middle">terraform module +</text>
  <text x="420" y="282" text-anchor="middle">Helm values lookup:</text>
  <text x="420" y="305" text-anchor="middle" font-family="monospace" font-size="11">central → URL + secretRef</text>
  <text x="420" y="322" text-anchor="middle" font-family="monospace" font-size="11">local   → URL + secretRef</text>
  <text x="420" y="345" text-anchor="middle" class="note">(W3 owns wire shape)</text>

  <!-- PII stage -->
  <rect x="540" y="60" width="280" height="600" class="group"/>
  <text x="550" y="78" class="group-label">Central observability backplane</text>

  <rect x="560" y="110" width="240" height="100" rx="8" class="pii"/>
  <text x="680" y="138" text-anchor="middle" class="pii-text">PII redaction stage</text>
  <text x="680" y="158" text-anchor="middle">OTEL collector w/</text>
  <text x="680" y="174" text-anchor="middle" font-family="monospace" font-size="11">transform + redaction</text>
  <text x="680" y="194" text-anchor="middle" class="note">W2 owns rule catalog</text>

  <!-- Core collector -->
  <rect x="560" y="240" width="240" height="140" rx="8" class="core"/>
  <text x="680" y="268" text-anchor="middle" class="core-text">Central OTEL Collector</text>
  <text x="680" y="290" text-anchor="middle">Receivers:</text>
  <text x="680" y="308" text-anchor="middle" font-family="monospace" font-size="11">otlp/http, otlp/grpc,</text>
  <text x="680" y="324" text-anchor="middle" font-family="monospace" font-size="11">prometheus_remote_write</text>
  <text x="680" y="345" text-anchor="middle">Processors: batch, attrs,</text>
  <text x="680" y="361" text-anchor="middle">resource, tail-sampling</text>

  <!-- Auth gateway -->
  <rect x="560" y="410" width="240" height="80" rx="8" class="core"/>
  <text x="680" y="437" text-anchor="middle" class="core-text">Auth front-door</text>
  <text x="680" y="457" text-anchor="middle">Bearer token (HMAC),</text>
  <text x="680" y="473" text-anchor="middle">issued via AWS Secrets Mgr</text>

  <text x="560" y="525" class="note">Runs in devops EKS today.</text>
  <text x="560" y="540" class="note">Producers reference by channel name,</text>
  <text x="560" y="555" class="note">so a future ECS-provisioned target is a</text>
  <text x="560" y="570" class="note">config flip — not a producer rewrite.</text>
  <text x="560" y="595" class="note">Cross-ref ACME obs bundle ka-0000003601;</text>
  <text x="560" y="610" class="note">in-flight gap work tracked under</text>
  <text x="560" y="625" class="note">ka-0000004697 (link, don't duplicate).</text>

  <!-- Storage column -->
  <rect x="850" y="60" width="310" height="600" class="group"/>
  <text x="860" y="78" class="group-label">Storage + visualization</text>

  <rect x="870" y="110" width="270" height="70" rx="8" class="store"/>
  <text x="1005" y="138" text-anchor="middle" class="store-text">VictoriaMetrics (central)</text>
  <text x="1005" y="158" text-anchor="middle">metrics TSDB — Prom-compatible</text>
  <text x="1005" y="174" text-anchor="middle" class="note">already operated; one Grafana datasource</text>

  <rect x="870" y="200" width="270" height="70" rx="8" class="store"/>
  <text x="1005" y="228" text-anchor="middle" class="store-text">VictoriaTraces (central)</text>
  <text x="1005" y="248" text-anchor="middle">trace store — OTLP ingest</text>
  <text x="1005" y="264" text-anchor="middle" class="note">supersedes per-tenant VT fan-outs (MR !879)</text>

  <rect x="870" y="290" width="270" height="60" rx="8" class="store"/>
  <text x="1005" y="316" text-anchor="middle" class="store-text">(Future) VictoriaLogs link</text>
  <text x="1005" y="334" text-anchor="middle" class="note">out-of-scope for this epic; cross-pane only</text>

  <rect x="870" y="380" width="270" height="80" rx="8" class="ui"/>
  <text x="1005" y="408" text-anchor="middle" class="ui-text">Grafana (devops)</text>
  <text x="1005" y="428" text-anchor="middle">single pane — metrics + traces</text>
  <text x="1005" y="444" text-anchor="middle" class="note">differential analysis across tenants</text>

  <rect x="870" y="480" width="270" height="80" rx="8" class="ui"/>
  <text x="1005" y="508" text-anchor="middle" class="ui-text">Per-tenant local stacks</text>
  <text x="1005" y="528" text-anchor="middle">stay as fallback during migration</text>
  <text x="1005" y="544" text-anchor="middle" class="note">producers dual-ship until W4 cutover</text>

  <!-- Edges: producers -> channel resolver -->
  <path d="M 280 130 C 305 130, 310 240, 330 260" class="edge" marker-end="url(#arrow)"/>
  <path d="M 280 200 C 305 200, 310 260, 330 275" class="edge" marker-end="url(#arrow)"/>
  <path d="M 280 270 C 305 270, 310 290, 330 290" class="edge" marker-end="url(#arrow)"/>
  <path d="M 280 340 C 305 340, 310 310, 330 305" class="edge" marker-end="url(#arrow)"/>
  <path d="M 280 410 C 305 410, 310 330, 330 320" class="edge" marker-end="url(#arrow)"/>
  <path d="M 280 480 C 305 480, 310 340, 330 335" class="edge" marker-end="url(#arrow)"/>
  <path d="M 280 550 C 305 550, 310 350, 330 350" class="edge" marker-end="url(#arrow)"/>

  <!-- Channel resolver -> PII stage -->
  <path d="M 510 250 C 530 250, 545 175, 560 160" class="edge" marker-end="url(#arrow)"/>
  <text x="515" y="200" class="edge-label">resolved endpoint</text>
  <text x="515" y="215" class="edge-label">+ bearer ref</text>

  <!-- PII -> core -->
  <path d="M 680 210 L 680 240" class="edge" marker-end="url(#arrow)"/>
  <text x="690" y="228" class="edge-label">redacted spans + samples</text>

  <!-- Auth gateway: producer auth in -->
  <path d="M 510 320 C 540 360, 545 450, 560 450" class="edge" marker-end="url(#arrow)"/>
  <text x="510" y="395" class="edge-label">verify bearer</text>

  <!-- Core -> storage -->
  <path d="M 800 280 C 830 200, 850 150, 870 140" class="edge" marker-end="url(#arrow)"/>
  <text x="810" y="200" class="edge-label">metrics</text>
  <path d="M 800 320 L 870 230" class="edge" marker-end="url(#arrow)"/>
  <text x="810" y="285" class="edge-label">traces</text>

  <!-- Storage -> Grafana -->
  <path d="M 1005 180 C 1005 220, 1005 340, 1005 380" class="edge" marker-end="url(#arrow)"/>
  <path d="M 1005 270 C 1005 300, 1005 360, 1005 380" class="edge" marker-end="url(#arrow)"/>

  <!-- Tenant-local dual-ship -->
  <path d="M 160 580 C 600 670, 870 600, 870 520" class="edge" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="540" y="688" class="edge-label">dual-ship until W4 cutover (dashed = legacy local exporter)</text>

  <!-- Legend -->
  <rect x="20" y="680" width="280" height="30" class="legend-box"/>
  <rect x="30" y="688" width="14" height="14" class="producer"/>
  <text x="50" y="700">producer</text>
  <rect x="105" y="688" width="14" height="14" class="pii"/>
  <text x="125" y="700">PII stage</text>
  <rect x="180" y="688" width="14" height="14" class="core"/>
  <text x="200" y="700">collector</text>
  <rect x="250" y="688" width="14" height="14" class="store"/>
  <text x="270" y="700">store</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2c5aa0"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1e7c47"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#b8860b"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="940" fill="#ffffff"/>

  <!-- Title -->
  <text x="640" y="30" text-anchor="middle" font-size="18" font-weight="bold">GV Operator → Oracle chatbox — round-trip of a single nudge</text>
  <text x="640" y="50" text-anchor="middle" font-size="12" fill="#555">type "no more MR reviews today" → commit comment (durable) + publish NATS (fast) → oracle acts on stack + replies → stream + toast</text>

  <!-- Lifelines: 5 columns. centers: 120, 360, 620, 850, 1130 -->
  <g font-weight="bold" text-anchor="middle">
    <rect x="40" y="70" width="160" height="40" rx="6" fill="#fdecea" stroke="#c0392b"/>
    <text x="120" y="88">Operator</text>
    <text x="120" y="103" font-size="10" font-weight="normal" fill="#555">chatbox / Slack</text>

    <rect x="280" y="70" width="160" height="40" rx="6" fill="#eaf3fd" stroke="#2c5aa0"/>
    <text x="360" y="88">beads-viewer</text>
    <text x="360" y="103" font-size="10" font-weight="normal" fill="#555">chatbox proxy</text>

    <rect x="540" y="70" width="160" height="40" rx="6" fill="#eef7ee" stroke="#1e7c47"/>
    <text x="620" y="88">oracle-thread bead</text>
    <text x="620" y="103" font-size="10" font-weight="normal" fill="#555">comment log = truth</text>

    <rect x="770" y="70" width="160" height="40" rx="6" fill="#f3eafd" stroke="#7b4ea0"/>
    <text x="850" y="88">NATS</text>
    <text x="850" y="103" font-size="10" font-weight="normal" fill="#555">oracle.nudge/reply</text>

    <rect x="1050" y="70" width="160" height="40" rx="6" fill="#fff4e0" stroke="#b8860b"/>
    <text x="1130" y="88">Oracle agent</text>
    <text x="1130" y="103" font-size="10" font-weight="normal" fill="#555">per operator</text>
  </g>

  <!-- Lifelines vertical -->
  <g stroke="#bbb" stroke-dasharray="4 4">
    <line x1="120" y1="110" x2="120" y2="900"/>
    <line x1="360" y1="110" x2="360" y2="900"/>
    <line x1="620" y1="110" x2="620" y2="900"/>
    <line x1="850" y1="110" x2="850" y2="900"/>
    <line x1="1130" y1="110" x2="1130" y2="900"/>
  </g>

  <!-- =========================================== -->
  <!-- Phase 1: operator types -->
  <!-- =========================================== -->
  <text x="15" y="150" font-weight="bold" fill="#555">T0</text>
  <line x1="120" y1="155" x2="355" y2="155" stroke="#c0392b" marker-end="url(#arrow-red)"/>
  <text x="238" y="149" text-anchor="middle" fill="#c0392b">{nudge, "no more MR reviews today", client_msg_id}</text>

  <!-- proxy normalises (self note) -->
  <rect x="270" y="168" width="180" height="34" rx="4" fill="#eaf3fd" stroke="#2c5aa0"/>
  <text x="360" y="182" text-anchor="middle" font-size="11" fill="#2c5aa0">normalise → soft_filter</text>
  <text x="360" y="195" text-anchor="middle" font-size="11" fill="#2c5aa0">exclude mr-review · today</text>

  <!-- =========================================== -->
  <!-- Phase 2: DURABLE path — commit comment -->
  <!-- =========================================== -->
  <text x="15" y="235" font-weight="bold" fill="#1e7c47">1 · durable</text>
  <line x1="360" y1="240" x2="615" y2="240" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="488" y="234" text-anchor="middle" fill="#1e7c47">commit comment "operator: no more MR reviews…"</text>
  <line x1="615" y1="262" x2="360" y2="262" stroke="#1e7c47" stroke-dasharray="3 3" marker-end="url(#arrow-green)"/>
  <text x="488" y="278" text-anchor="middle" fill="#1e7c47" font-size="11">comment_id = cmt-8842  (Slack-mirrored by bridge)</text>

  <!-- ack back to operator -->
  <line x1="355" y1="298" x2="122" y2="298" stroke="#2c5aa0" stroke-dasharray="3 3" marker-end="url(#arrow-blue)"/>
  <text x="238" y="292" text-anchor="middle" fill="#2c5aa0" font-size="11">nudge_ack {comment_id}</text>

  <!-- =========================================== -->
  <!-- Phase 3: FAST path — publish NATS -->
  <!-- =========================================== -->
  <text x="15" y="345" font-weight="bold" fill="#7b4ea0">2 · fast</text>
  <line x1="360" y1="350" x2="845" y2="350" stroke="#7b4ea0" marker-end="url(#arrow-gold)"/>
  <text x="600" y="344" text-anchor="middle" fill="#7b4ea0">publish envelope → oracle.nudge.&lt;op-hash&gt;</text>
  <line x1="850" y1="372" x2="1125" y2="372" stroke="#7b4ea0" marker-end="url(#arrow-gold)"/>
  <text x="988" y="366" text-anchor="middle" fill="#7b4ea0" font-size="11">operator_nudge trigger — wakes yielded oracle ≈0.8s</text>

  <!-- fallback note -->
  <rect x="470" y="392" width="470" height="30" rx="4" fill="#f7f7f7" stroke="#aaa" stroke-dasharray="3 3"/>
  <text x="705" y="411" text-anchor="middle" font-size="11" fill="#666">fallback: if the NATS frame drops, a bead_event on cmt-8842 still wakes the oracle</text>

  <!-- oracle acts (self note) -->
  <rect x="1040" y="432" width="180" height="34" rx="4" fill="#fff4e0" stroke="#b8860b"/>
  <text x="1130" y="446" text-anchor="middle" font-size="11" fill="#b8860b">apply filter, re-rank</text>
  <text x="1130" y="459" text-anchor="middle" font-size="11" fill="#b8860b">read comments &gt; last_seq</text>

  <!-- =========================================== -->
  <!-- Phase 4: stack removes stream back over WS -->
  <!-- =========================================== -->
  <text x="15" y="505" font-weight="bold" fill="#555">3 · enact</text>
  <line x1="1125" y1="510" x2="365" y2="510" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="740" y="504" text-anchor="middle" fill="#1e7c47">stack: remove ka-MR1 (seq=51), remove ka-MR2 (seq=52)</text>
  <line x1="355" y1="532" x2="122" y2="532" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="238" y="526" text-anchor="middle" fill="#2c5aa0" font-size="11">WS remove seq=51,52</text>

  <!-- =========================================== -->
  <!-- Phase 5: reply — durable comment + fast stream -->
  <!-- =========================================== -->
  <text x="15" y="580" font-weight="bold" fill="#1e7c47">3a · reply</text>
  <line x1="1125" y1="585" x2="625" y2="585" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
  <text x="875" y="579" text-anchor="middle" fill="#1e7c47">reply comment "OK — no MR reviews until tomorrow" (durable + Slack)</text>

  <text x="15" y="625" font-weight="bold" fill="#7b4ea0">3b · stream</text>
  <line x1="1125" y1="630" x2="855" y2="630" stroke="#7b4ea0" marker-end="url(#arrow-gold)"/>
  <text x="990" y="624" text-anchor="middle" fill="#7b4ea0" font-size="11">oracle.reply.&lt;op-hash&gt; (token stream)</text>
  <line x1="845" y1="652" x2="365" y2="652" stroke="#7b4ea0" marker-end="url(#arrow-gold)"/>
  <text x="605" y="646" text-anchor="middle" fill="#7b4ea0" font-size="11">viewer hub fans out over stack WS</text>
  <line x1="355" y1="674" x2="122" y2="674" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
  <text x="238" y="668" text-anchor="middle" fill="#2c5aa0" font-size="11">oracle_reply_chunk … + effects</text>

  <!-- operator sees result (self note) -->
  <rect x="30" y="690" width="180" height="48" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="120" y="706" text-anchor="middle" font-size="11" fill="#c0392b">chatbox: streamed reply</text>
  <text x="120" y="720" text-anchor="middle" font-size="11" fill="#c0392b">toast: "cleared 2 MRs</text>
  <text x="120" y="733" text-anchor="middle" font-size="11" fill="#c0392b">— up next ka-BUG9"</text>

  <!-- =========================================== -->
  <!-- Legend -->
  <!-- =========================================== -->
  <g font-size="11">
    <rect x="40" y="796" width="1200" height="104" rx="6" fill="#fafafa" stroke="#ccc"/>
    <text x="55" y="818" font-weight="bold">Two paths, one conversation:</text>
    <line x1="55" y1="839" x2="95" y2="839" stroke="#1e7c47" marker-end="url(#arrow-green)"/>
    <text x="105" y="843" fill="#333"><tspan font-weight="bold" fill="#1e7c47">Durable</tspan> — bead comment is the source of truth: survives restart, mirrors to Slack, is the fallback wake.</text>
    <line x1="55" y1="862" x2="95" y2="862" stroke="#7b4ea0" marker-end="url(#arrow-gold)"/>
    <text x="105" y="866" fill="#333"><tspan font-weight="bold" fill="#7b4ea0">Fast</tspan> — NATS envelope wakes the oracle in ~1s and streams the reply; ephemeral, never load-bearing for durability.</text>
    <line x1="55" y1="885" x2="95" y2="885" stroke="#2c5aa0" marker-end="url(#arrow-blue)"/>
    <text x="105" y="889" fill="#333"><tspan font-weight="bold" fill="#2c5aa0">Blue</tspan> = viewer ↔ browser (stack WS).</text>
    <line x1="470" y1="885" x2="510" y2="885" stroke="#c0392b" marker-end="url(#arrow-red)"/>
    <text x="520" y="889" fill="#333"><tspan font-weight="bold" fill="#c0392b">Red</tspan> = operator input.</text>
  </g>
</svg>

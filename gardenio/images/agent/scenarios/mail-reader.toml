# mail-reader.toml
#
# Claudeless scenario: a pod agent that reads its mail (local-agents spec
# §11 a; plan gd-fwFefkDP4H Task 18, gd-jW7KJ7ZdNy).
#
# Set mock_scenario=mail-reader on an agent bead to boot it.
# gardenio/tests/e2e/scripts/test-local-runner-mail.sh does, then sends the pod
# nudge, decision and kill as mail. The pod's mail subscriber (no inbound dial)
# nudges coop with interrupt mail as
# "Mail from <sender> [<id>]: <subject>\n\n<body>"; any mail carrying E2E-READ
# makes this scenario read and close every open, non-control mail in its
# inbox. Closing is the agent's ack and the script's proof that the nudge
# reached the session. control:kill never reaches the model.

[claude]
session_id = "00000000-0000-4000-a000-000000000007"
username = "mock-agent"
permission_mode = "accept-edits"
trusted = true
logged_in = true

[[responses]]
on = { contains = "E2E-READ" }
say = "I have mail. Reading it."
tools = [
  { call = "Bash", input = { command = """set -u
for id in $(gb mail inbox --json 2>/dev/null | jq -r '.[] | select([.labels[]? | startswith("control:")] | any | not) | .id'); do
  gb mail read "$id" >/dev/null && kd close "$id" >/dev/null && echo "MAIL-READ-OK $id"
done""" } }
]

[default]
say = "Mock agent standing by for mail."

[tools]
mode = "live"

[tools.Bash]
approve = true

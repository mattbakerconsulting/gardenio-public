apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-agent-registries
  annotations:
    policies.kyverno.io/title: Restrict agent pod images to the gardenio registry allow-list
    policies.kyverno.io/category: gardenio-admission-starter
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Agent pods run UNTRUSTED, LLM-generated workloads. Their pod specs are
      assembled by the controller but seeded from bead fields an agent (or a
      malicious teammate/bead) can influence, so nothing structurally prevents a
      crafted spec from pulling an arbitrary image from an arbitrary registry —
      the base for a supply-chain or data-exfil payload (attacker paths A3/A5,
      audit finding F5, ka-0000002606). This ClusterPolicy denies admission of
      any agent pod (selected by the gardenio.io/agent label every spawned agent
      pod carries) whose container/initContainer images do not come from the
      gardenio registry allow-list (the ECR gardenio/* repositories). It is scoped
      to agent pods ONLY — the gardenio-system spine (postgres, nats, kyverno,
      grafana, third-party mirror images) is deliberately NOT constrained, so a
      cluster-wide registry lockdown does not take the platform down.
      Part of the admission starter set: default OFF, roll out Audit -> Enforce.
      The Helm chart renders a values-parameterized copy at
      templates/kyverno/restrict-agent-registries.yaml (gated behind
      global.admissionPolicies.restrictRegistries.enabled). See
      gardenio/docs/admission-policies.md.
spec:
  # Audit = report-only (starter posture). Flip to Enforce after reviewing the
  # PolicyReport for any legitimate off-allow-list image an agent pod pulls.
  validationFailureAction: Audit
  background: true
  rules:
    - name: agent-images-from-allowlist
      match:
        any:
          - resources:
              kinds:
                - Pod
              # Scope to agent pods only — the gardenio.io/agent label is present
              # on every spawned agent pod (podmanager.LabelAgent) and on no
              # spine workload.
              selector:
                matchExpressions:
                  - key: gardenio.io/agent
                    operator: Exists
      validate:
        message: >-
          Agent pod images must come from the gardenio registry allow-list
          (the ECR gardenio/* repositories). See
          policy/kyverno/restrict-agent-registries.yaml.
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^[0-9]+[.]dkr[.]ecr[.][a-z0-9-]+[.]amazonaws[.]com/gardenio/.*', '{{ element.image }}') }}"
                    operator: Equals
                    value: false
          - list: request.object.spec.initContainers || []
            deny:
              conditions:
                all:
                  - key: "{{ regex_match('^[0-9]+[.]dkr[.]ecr[.][a-z0-9-]+[.]amazonaws[.]com/gardenio/.*', '{{ element.image }}') }}"
                    operator: Equals
                    value: false

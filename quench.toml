# Quench configuration for gardenio monorepo
# Run `quench config` for reference documentation
version = 1

[git]
# Ratchet baseline is a COMMITTED FILE, not git notes (ka-0000002621).
# Why file, not notes: `quench check --ci` resolves the ratchet base to the
# exact base-branch commit SHA and looks up the baseline for THAT sha with no
# ancestor walk. A git note on one main tip therefore goes stale the instant
# main advances, and a default `git clone` does not fetch refs/notes/quench at
# all (the CI `code` task clones a single commit). A committed file travels
# with the tree, so it is valid at every commit and every fresh clone with no
# per-commit note maintenance and no CI write-back. It is also reviewable in
# the diff.
#
# Regenerating after an intentional ceiling change: the baseline was seeded
# from a git-LESS tree (the pre-Actions CI exported one), so quench could not
# diff-scope and the escapes ratchet counts WHOLE-REPO occurrences. checks.yml
# now runs `quench check --ci` in a shallow actions/checkout; keep seeding with
# the recipe below unless you have checked that quench scopes the same way
# there. From the repo root:
#   D=$(mktemp -d); git archive HEAD | tar -x -C "$D"; rm -rf "$D/.quench"
#   (cd "$D" && quench check --ci --fix --no-cache --no-docs --no-cloc)
#   cp "$D/.quench/baseline.json" .quench/baseline.json
# Do NOT run `quench check --ci --fix` inside the working tree — with .git
# present it diff-scopes to changed files and writes an all-zero baseline that
# fails CI (whole-repo count > 0).
baseline = ".quench/baseline.json"

[git.commit]
check = "error"
# Pin the conventional-commit type set (documented in coop/CLAUDE.md:163 and
# the root "Commits" convention). Include the extended types — perf/ci/build/
# style/revert are legitimate here — or `[git.commit] types` would newly reject
# them. An empty array would accept ANY type (structure-only); this allowlist is
# the intentional, closed set. (Phase 3.4, ka-0000003893.)
types = ["feat", "fix", "chore", "docs", "test", "refactor", "perf", "ci", "build", "style", "revert"]

# Ratchet: freeze the current whole-repo escape-hatch counts as a CEILING so no
# MR may push them higher. Escape hatches counted at repo root (Shell-only
# detection): shell `set +e`/`eval` and Go `panic(`. The frozen ceiling in
# .quench/baseline.json is source {eval:20, panic:10, set_plus_e:8},
# test {eval:54, panic:16, set_plus_e:14} — the total occurrences on green main
# aa38bbb (the metric counts ALL occurrences, justified or not; the separate
# absolute [check.escapes] gate is what flags UNJUSTIFIED ones). Add one and CI
# fails; removing them is always allowed and should be paired with a re-seed to
# tighten the ceiling. Activated only under `quench check --ci` (see the `quench
# quality gate` job in .github/workflows/checks.yml). NOTE: the baseline stores escapes only — cloc is NOT
# ratcheted by quench 0.4.3, and `coverage` has no data source here (the go
# test-suite runner was removed in ka-0000003622 because go.work has no root
# go.mod). `coverage` is left declared for when a runner is wired up; inert
# until then.
[ratchet]
check = "error"
coverage = true
escapes = true

# --- Checks ---

[check.cloc]
# Phase 2.1 (ka-0000002511): cloc was doubly-off — `--no-cloc` in the CI
# invocation AND severity=warn. This block turns it into a real repo-wide
# ERROR gate at a REALISTIC ceiling for this codebase (bridge / podmanager /
# beads-viewer units legitimately run 1000-1500 lines). Removing --no-cloc
# from the CI invocation (checks.yml) + Makefile is what actually arms it.
#
# GRANDFATHERING MECHANISM — read before touching the exclude list:
# quench 0.4.3 offers exactly ONE lever for pre-existing large files: flat
# max_lines + `exclude` globs. It does NOT ratchet cloc (the [ratchet]
# baseline stores ESCAPE counts only — verified twice, see ka-0000002621 and
# this task's bead comment), it does NOT diff-scope cloc (`--base`/`--ci`
# leave cloc whole-repo), and it REJECTS [check.cloc.package.*] per-package
# overrides (unknown-field error). So the ONLY way to arm the gate without a
# (deliberately out-of-scope) cleanup sprint is to grandfather today's
# offenders by explicit path. The gate still fires on every NEW file over the
# ceiling; cleaning up a grandfathered file lets you delete its line here.
# Cleanup of the grandfathered debt is tracked under epic ka-0000005566.
#
# Token-count sizing (max_tokens) is a SEPARATE axis with its own offender
# set and is intentionally deferred out of Phase 2.1 (line-count only) —
# hence max_tokens = false.
#
# Regenerate the grandfather list after an intentional cleanup or a ceiling
# change (run from repo root, mirrors the git-less whole-repo CI scan):
#   quench check --cloc --no-limit 2>&1 | grep "file_too_large (lines"
check = "error"
max_lines = 1500
max_lines_test = 1200
max_tokens = false
exclude = [
  "docs/archive/**",     # archived pipeline specs and docs: reference copies, not code
  # Non-source / vendored / out-of-scope trees.
  "gardenio/helm/**",
  "gardenio/images/**",
  "gardenio/tests/e2e/**",
  "coop/target/**",
  "**/gen/**",           # generated protobuf (kbeads/gen)
  "kbeads/internal/heraldry/library.go", # generated heraldry library table (genlibrary); grows with each Noto Emoji re-pin
  "kbeads/internal/heraldry/tones.go", # generated heraldry charge tones (gentones); one row per library charge
  "lands/contract/landsv1/*.gen.go", # generated Lands contract Go binding (oapi-codegen)
  "lands/contract/ts/*.ts", # generated Lands contract TS binding + fixture check (openapi-typescript)
  "usr/**",              # Swift/Xcode apps (Gardenio/Gasvoice/Porthole) — separate products
  "**/*.min.js",         # vendored minified JS (e.g. mermaid.min.js)


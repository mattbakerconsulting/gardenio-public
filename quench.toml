[check.escapes]
check = "error"
# Users-FLAT (and any future viewer) audit runs commit Playwright-captured DOM
# snapshots under docs/**/captures/ as evidence. Those files inline the rendered
# page's own JS and, worse, arbitrary bead *display text* — so quench's Shell
# escape-hatch detector matches things like the word "re-eval" inside a bead
# title and counts a phantom `eval`, pushing the whole-repo escapes ratchet over
# its ceiling and reding EVERY MR branched off that main (ka-0000004491, and the
# concrete break introduced by the 2026-07-03 users-flat audit merge d240aa648:
# a "re-eval complete" bead title in xop-user-home.html). These captures are
# third-party page dumps, not code we author — exclude them from the escapes
# scan.
exclude = ["docs/**/captures/**"]

[[check.escapes.patterns]]
name = "panic"
pattern = "\\bpanic\\("
action = "comment"
comment = "// PANIC:"
in_tests = "allow"
advice = "Add a // PANIC: comment explaining why panic is acceptable here."

[check.agents]
check = "warn"
files = ["CLAUDE.md"]
required = ["CLAUDE.md"]
max_lines = false
max_tokens = false
sync = false
# Lock in the two structural sections every top-level CLAUDE.md already carries
# (all 4 satisfy this today — 0 cleanup, this just freezes the structure so a
# future edit can't silently drop them). Matched case-insensitively. NOTE: the
# agents check is root-scoped in quench 0.4.3, so this guards the ROOT CLAUDE.md
# only; per-package size caps / tables=forbid would need real work and are
# deferred (audit §3.4, ka-0000003893).
sections.required = ["Directory Structure", "Landing the Plane"]

[check.docs]
check = "warn"

# TOC check runs repo-wide at error (ka-0000006098, Phase 2.2). The Phase-2.2
# fence-tagging sweep (decision ka-0000006728 -> "sweep") tagged every
# illustrative ASCII-diagram / path-map / prompt / code fence with an explicit
# language (```text etc.) so quench no longer reads them as directory trees.
# With those fences tagged, no diagram-heavy dir-excludes are needed — the check
# guards real directory trees / TOCs across the whole repo.
[check.docs.toc]
check = "error"
include = ["**/*.md"]
exclude = [
  "gardenio/helm/**",
]

[check.docs.links]
check = "error"
include = ["**/*.md"]
# Generated snapshot report trees (dated CDQR / gardeners-camp / maps-beauty /
# grade / density report dirs) are auto-captured agent-run artifacts, not
# maintained docs: each REPORT.md links to per-run `captures/…` screenshots that
# are never committed. Validating those links is pure noise, so the generated
# trees are scoped out of the link check (ka-0000006098, Phase 2.2). Real docs
# stay in scope — their genuine broken links were fixed in the sweep.
exclude = [
  "gardenio/helm/**",
  "docs/gardener-cdqr/**",
  "docs/gardeners-camp/**",
  "docs/people-cdqr/**",
  "docs/users-cdqr/**",
  "docs/users-flat/**",
  "docs/formula-ux/**",
  "docs/grafana-grade/**",
  "docs/maps-beauty/**",
  "docs/info-density/**",
  # This doc is the DESIGN SPEC for the typed-mention `[label](ka-X)` markdown-link
  # syntax, so its worked examples (`[parent](ka-123)`, `[parent](ka-X)`) are
  # deliberate illustrations of the link FORM, not real links to files — and they
  # already sit inside inline code spans. quench's link detector flags them anyway
  # (ka-0000006098, Phase 2.2). Excluding the one syntax-reference doc keeps the
  # lesson intact rather than corrupting the examples it exists to teach.
  "kbeads/docs/research-typed-mention-syntax.md",
  # The beads viewer embeds a byte-for-byte copy of gardenio/docs/lands/legal/
  # (TestLandsLegalMirrorsDocs, Lands step 7.5). Its relative links resolve next
  # to the originals, which this check covers; the served pages rewrite or drop
  # them (lands.go landsLinkRewriter).
  "gardenio/controller/cmd/beads-viewer/lands/legal/**",
]

# Area mappings: when source in a high-churn subsystem changes, require its docs
# to be touched in the same commit. Forward-looking gate — surfaces 0 violations
# today. Only fires under `--ci` mode once [check.docs] is enabled at error
# (Phase 2.2); inert while docs runs at warn / behind `--no-docs`. Keep the doc
# globs generous so refactor-only commits aren't over-constrained (audit §3.5,
# ka-0000003893).
[check.docs.area.bridge]
source = "gardenio/controller/internal/bridge/**"
docs = "gardenio/docs/*bridge*.md"

[check.tests]
check = "warn"
auto = true

[check.tests.commit]
check = "warn"
scope = "branch"
exclude = ["**/main.go", "gardenio/helm/**", "gardenio/images/**"]

# NOTE: no [[check.tests.suite]] runner. This is a go.work workspace with no
# root go.mod, so quench's `go` runner probes for a root module, finds none,
# and reports "runner not available" -> test_count=0, passed=true (a false
# green) even under --ci. Real Go/Rust tests run in dedicated CI tasks
# (make test / test-gardenio / test-kbeads), not via quench. The commit check
# above still enforces tests-with-code and works without a runner (ka-0000003622).

[check.tests.time]
check = "warn"

[check.license]
check = "off"

# --- Languages ---

[golang]
source = ["**/*.go"]
tests = ["**/*_test.go"]
ignore = ["vendor/"]

[golang.cloc]
check = "error"

[golang.suppress]
check = "comment"

[golang.suppress.test]
check = "allow"

[rust]
source = ["**/*.rs"]
tests = ["**/*_test.rs", "**/tests/**/*.rs"]
ignore = ["target/"]

[shell]
cloc.check = "error"

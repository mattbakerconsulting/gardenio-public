apiVersion: v1
kind: Pod
metadata:
  name: coop-standalone
spec:
  containers:
    - name: coop
      image: coop:latest
      args:
        - "--agent=claude"
        - "--port=8080"
        - "--health-port=9090"
        - "--cols=200"
        - "--rows=50"
        - "--auth-token=$(COOP_AUTH_TOKEN)"
        - "--"
        - "claude"
        - "--dangerously-skip-permissions"
      env:
        - name: COOP_AUTH_TOKEN
          valueFrom:
            secretKeyRef: { name: coop-auth, key: token }
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef: { name: anthropic-credentials, key: api-key, optional: true }
        - name: CLAUDE_CODE_OAUTH_TOKEN
          valueFrom:
            secretKeyRef: { name: anthropic-credentials, key: oauth-token, optional: true }
      ports:
        - { containerPort: 8080, name: api }
        - { containerPort: 9090, name: health }
      livenessProbe:
        httpGet: { path: /api/v1/livez, port: health }
        initialDelaySeconds: 5
        periodSeconds: 10
      readinessProbe:
        httpGet: { path: /api/v1/agent, port: health }
        initialDelaySeconds: 3
        periodSeconds: 5
      startupProbe:
        httpGet: { path: /api/v1/health, port: health }
        failureThreshold: 30
        periodSeconds: 2
      resources:
        requests: { cpu: "500m", memory: "1Gi" }
        limits:   { cpu: "2",    memory: "4Gi" }
  restartPolicy: Never

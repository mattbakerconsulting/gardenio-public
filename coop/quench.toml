# Quench configuration
# Run `quench config` for reference documentation
version = 1

[git]
baseline = "notes"    # e.g.  ".quench/baseline.json"
commit = { check = "warn" }

[rust]
cfg_test_split = "require"

[check]
cloc = { check = "error" }
docs = { check = "error" }
agents = { check = "error" }
tests = { check = "off" }

# Escapes promoted from the inline `escapes = { check = "error" }` above to a
# full section so it can carry patterns. Encodes coop's Cargo.toml deny-lints
# (unwrap_used/expect_used/panic/unsafe_code) as a quench escape for
# defense-in-depth: catches anyone softening the clippy lints. Passes today —
# coop has 0 `.unwrap()` in source (all 25 live in *_tests.rs), and unwrap is
# always allowed in tests via in_tests="allow".
#
# Deliberately NO expect/unsafe patterns (audit §3.2, ka-0000003893): a measured
# `expect=forbid` reds 5 legitimate sites, and all unsafe blocks already carry
# `// SAFETY:` comments so a comment-rule would flag nothing. This section only
# runs in coop's local `make check`, not root CI (which is Go-focused).
[check.escapes]
check = "error"

[[check.escapes.patterns]]
name = "unwrap"
pattern = "\\.unwrap\\(\\)"
action = "forbid"
in_tests = "allow"
advice = "Use `?`, `anyhow::bail!`, or `.ok()` — coop denies unwrap_used in source."

[check.license]
check = "error"
license = "BUSL-1.1"
copyright = "Matt Baker <fimbaz@gmail.com>"

[ratchet]
check = "off"

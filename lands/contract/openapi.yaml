    Plan:
      description: A plan.
      headers:
        X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Plan'}
    PlanPage:
      description: A page of plans.
      headers:

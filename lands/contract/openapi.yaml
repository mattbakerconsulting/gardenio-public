openapi: 3.1.0
info:
  title: Lands contract
  version: 1.0.0-beta.5
  summary: The vocabulary a tenant's CLI (gl) and the web UI speak to a land, and nothing else.
  description: |
    The Lands contract v1 (v1-beta). It is a thin, closed projection: a
    handful of fields per noun, no raw backing records, no identity assertion.

    Rules every change to this file must keep (spec_test.go enforces the
    mechanical ones):

    * Paths live under /lands/v1/. Every response carries X-Lands-Contract with
      this document's info.version. Clients warn once on skew and never refuse.
    * Never remove or rename a field. New fields and new enum values are minor
      changes. New REQUIRED request fields only under /lands/v2/.
    * Enums are closed for a given contract version (the server emits only the
      listed values) and open across versions: clients treat an unknown value
      as "other" and an unknown response field as absent.
    * Request bodies are closed (additionalProperties: false); the server
      rejects unknown request fields with invalid_request.
    * Absent means none. Optional fields are omitted, never null.
    * Ids are opaque strings (max 64), with no structure guaranteed. In v1 they
      are the backing record ids, which carry the land's own prefix; that is the
      one deliberate leak, so a tenant can quote an id to support. Option ids,
      cursors and correlation ids are opaque too.
    * Every list is cursor-paginated: {items, next_cursor}, limit 1-200.
    * Every POST accepts Idempotency-Key.
    * Errors are application/problem+json (RFC 9457) with a closed code enum.
      detail is filled only by the server's own request validator, never from
      upstream error text.
    * No field anywhere names the caller's identity, a token, an upstream
      address, a project, labels, or a free-form fields map. The server derives
      the actor from the bearer. The one credential the contract hands out is
      AgentGrant's: the bearer a member's own agent runs under, answered only
      to the member who started it (or to the agent refreshing it), never
      listed or read back.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: /

security:
  - bearer: []

tags:
  - name: land
  - name: plot
  - name: crew
  - name: ticket
  - name: decision
  - name: escalation
  - name: plan
  - name: thread
  - name: budget
  - name: release
  - name: event
  - name: agent

paths:
  /lands/v1/lands/{land}:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: getLand
      tags: [land]
      summary: The land itself (read-only).
      responses:
        '200': {$ref: '#/components/responses/Land'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/plots:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listPlots
      tags: [plot]
      summary: The repositories this land works in.
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/PlotPage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/plots/{plot}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {name: plot, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getPlot
      tags: [plot]
      responses:
        '200': {$ref: '#/components/responses/Plot'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/crew:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listCrew
      tags: [crew]
      summary: Members of the land, people and agents.
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/MemberPage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/crew/{member}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {name: member, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getMember
      tags: [crew]
      responses:
        '200': {$ref: '#/components/responses/Member'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/whoami:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: whoami
      tags: [crew]
      summary: The caller, as a member of this land.
      responses:
        '200': {$ref: '#/components/responses/Member'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/tickets:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listTickets
      tags: [ticket]
      parameters:
        - name: status
          in: query
          description: Only tickets in this status.
          schema: {$ref: '#/components/schemas/TicketStatus'}
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/TicketPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createTicket
      tags: [ticket]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketCreate'}
      responses:
        '201': {$ref: '#/components/responses/Ticket'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/tickets/{ticket}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/TicketPath'}
    get:
      operationId: getTicket
      tags: [ticket]
      responses:
        '200': {$ref: '#/components/responses/Ticket'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateTicket
      tags: [ticket]
      summary: Change a ticket's title, body or priority. Status moves only through close and reopen.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketUpdate'}
      responses:
        '200': {$ref: '#/components/responses/Ticket'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/tickets/{ticket}/comments:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/TicketPath'}
    post:
      operationId: commentTicket
      tags: [ticket]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentCreate'}
      responses:
        '201': {$ref: '#/components/responses/Comment'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/tickets/{ticket}/close:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/TicketPath'}
    post:
      operationId: closeTicket
      tags: [ticket]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TicketClose'}
      responses:
        '200': {$ref: '#/components/responses/Ticket'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/tickets/{ticket}/reopen:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/TicketPath'}
    post:
      operationId: reopenTicket
      tags: [ticket]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      responses:
        '200': {$ref: '#/components/responses/Ticket'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/search/tickets:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: searchTickets
      tags: [ticket]
      summary: Free-text search over this land's tickets. Free text only; no scores, no type filters.
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/TicketPage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/decisions:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listDecisions
      tags: [decision]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/DecisionStatus'}
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/DecisionPage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/decisions/{decision}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/DecisionPath'}
    get:
      operationId: getDecision
      tags: [decision]
      responses:
        '200': {$ref: '#/components/responses/Decision'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/decisions/{decision}/resolve:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/DecisionPath'}
    post:
      operationId: resolveDecision
      tags: [decision]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionResolve'}
      responses:
        '200': {$ref: '#/components/responses/Decision'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/decisions/{decision}/cancel:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/DecisionPath'}
    post:
      operationId: cancelDecision
      tags: [decision]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionCancel'}
      responses:
        '200': {$ref: '#/components/responses/Decision'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/decisions/{decision}/comments:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/DecisionPath'}
    post:
      operationId: commentDecision
      tags: [decision]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommentCreate'}
      responses:
        '201': {$ref: '#/components/responses/Comment'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/decisions/{decision}/evidence/{image}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/DecisionPath'}
      - {$ref: '#/components/parameters/EvidenceImagePath'}
    get:
      operationId: getDecisionEvidence
      tags: [decision]
      summary: One picture of a decision's evidence; the url a DecisionEvidence names.
      description: |
        Served only while the picture is one of the decision's evidence as
        getDecision shows it: on a ticket of this land the caller can read.
        Anything else is not_found. upstream_unavailable means the land
        cannot serve pictures at all, and getDecision then shows no evidence.
        Only PNG, JPEG, GIF and WebP are ever served.
      responses:
        '200':
          description: The picture.
          headers:
            X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
            image/gif:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/escalations:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listEscalations
      tags: [escalation]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/EscalationStatus'}
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/EscalationPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createEscalation
      tags: [escalation]
      summary: Ask the land's operator for something the land cannot do itself. Approve and reject are not tenant verbs in v1.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EscalationCreate'}
      responses:
        '201': {$ref: '#/components/responses/Escalation'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/escalations/{escalation}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {name: escalation, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getEscalation
      tags: [escalation]
      responses:
        '200': {$ref: '#/components/responses/Escalation'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/plans:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listPlans
      tags: [plan]
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/PlanPage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/plans/{plan}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/PlanPath'}
    get:
      operationId: getPlan
      tags: [plan]
      responses:
        '200': {$ref: '#/components/responses/Plan'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/plans/{plan}/answer:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/PlanPath'}
    post:
      operationId: answerPlan
      tags: [plan]
      summary: Answer one of the plan's open questions. The decision must belong to this plan.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanAnswer'}
      responses:
        '200': {$ref: '#/components/responses/Decision'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/threads:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listThreads
      tags: [thread]
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/ThreadPage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/threads/{thread}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/ThreadPath'}
    get:
      operationId: getThread
      tags: [thread]
      responses:
        '200': {$ref: '#/components/responses/Thread'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/threads/{thread}/messages:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/ThreadPath'}
    get:
      operationId: listMessages
      tags: [thread]
      summary: Messages in a thread, oldest first.
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/MessagePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: postMessage
      tags: [thread]
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '201': {$ref: '#/components/responses/Message'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/budget:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: getBudget
      tags: [budget]
      summary: What the land may spend and has spent (read-only).
      responses:
        '200': {$ref: '#/components/responses/Budget'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/budget/history:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: getBudgetHistory
      tags: [budget]
      summary: Credits spent and remaining, one point per UTC day (read-only).
      description: |
        Points are oldest first and end today; today's point is today so far. A day
        with nothing recorded has no point, so a new land has few.
      parameters:
        - name: days
          in: query
          description: How many UTC days back, today included.
          schema: {type: integer, minimum: 1, maximum: 30, default: 30}
      responses:
        '200': {$ref: '#/components/responses/BudgetHistory'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/releases:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listReleases
      tags: [release]
      summary: What the land has released, newest cut first (read-only).
      description: |
        A release is one tag of the land's repository: what it carries and
        where it runs. Releases are recorded when a tag is pushed; a tenant
        reads them and reports where one runs (reportDeployment), but never
        writes one.
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/ReleasePage'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/releases/{release}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/ReleasePath'}
    get:
      operationId: getRelease
      tags: [release]
      responses:
        '200': {$ref: '#/components/responses/Release'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/releases/{release}/deployments:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/ReleasePath'}
    post:
      operationId: reportDeployment
      tags: [release]
      summary: Report that the release now runs on one of the land's targets.
      description: |
        Only the land's owner may report a deployment; anyone else is refused
        with forbidden. A target the land does not declare is refused with
        conflict. The release that ran on the target before is closed there
        (its row gains until). Reporting the row that is already open again
        changes nothing. A revision is one roll of one release on a target:
        reporting a revision this release already records there changes
        nothing, and one another release records there is refused with
        conflict.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeploymentReport'}
      responses:
        '200': {$ref: '#/components/responses/Release'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/events:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: streamEvents
      tags: [event]
      summary: The land's live feed (server-sent events).
      description: |
        Each SSE frame is one Event: the frame's `id:` is Event.id (the
        per-land cursor), `event:` is Event.type, and `data:` is Event.object
        as JSON. Only the EventType values are ever sent; anything else
        upstream is dropped. Resume with the Last-Event-ID header, or with
        `since` when the client cannot set headers (EventSource on a fresh
        page). An unknown or expired cursor resumes from now.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {$ref: '#/components/schemas/Cursor'}
        - name: since
          in: query
          schema: {$ref: '#/components/schemas/Cursor'}
      responses:
        '200':
          description: An open event stream.
          headers:
            X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/agents:
    parameters: [{$ref: '#/components/parameters/LandPath'}]
    get:
      operationId: listAgents
      tags: [agent]
      summary: The agents members started on their own machines, newest first. Agents the land runs itself are crew, not listed here.
      parameters:
        - {$ref: '#/components/parameters/CursorQuery'}
        - {$ref: '#/components/parameters/LimitQuery'}
      responses:
        '200': {$ref: '#/components/responses/AgentPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAgent
      tags: [agent]
      summary: Start an agent on your own machine. Answers the credential it runs under, once.
      description: |
        Owners and members may, on their own sign-in; guests, and agents, may
        not (forbidden). The agent joins the land's crew and holds one of the
        land's live agent slots until it stops or is revoked; a land already
        running as many agents as it may answers conflict. Whatever the
        member's own role, the agent acts as a land agent at the restricted
        agent tier: it cannot answer decisions, approve escalations or start
        other agents. It pays for its own model use: no budget credential is
        answered and the land's budget is not spent. A retry with the same
        Idempotency-Key answers for the same agent with a new bearer and
        refresh.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentCreate'}
      responses:
        '201': {$ref: '#/components/responses/AgentGrant'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/agents/{agent}:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/AgentPath'}
    get:
      operationId: getAgent
      tags: [agent]
      responses:
        '200': {$ref: '#/components/responses/Agent'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/agents/{agent}/refresh:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/AgentPath'}
    post:
      operationId: refreshAgent
      tags: [agent]
      summary: Exchange the agent's refresh for a new bearer, before the old one expires.
      description: |
        The caller is the agent itself, on its bearer, or a member who may
        start agents. The refresh given is spent: use the one answered next
        time. A stopped agent is not refreshed (conflict).
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentRefresh'}
      responses:
        '200': {$ref: '#/components/responses/AgentGrant'}
        default: {$ref: '#/components/responses/Problem'}

  /lands/v1/lands/{land}/agents/{agent}/revoke:
    parameters:
      - {$ref: '#/components/parameters/LandPath'}
      - {$ref: '#/components/parameters/AgentPath'}
    post:
      operationId: revokeAgent
      tags: [agent]
      summary: Stop an agent. Its bearer and refresh stop working at once.
      description: The member who started it, or the land's owner, may. Revoking a stopped agent answers it as it is.
      parameters: [{$ref: '#/components/parameters/IdempotencyKeyHeader'}]
      responses:
        '200': {$ref: '#/components/responses/Agent'}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The caller's own session bearer for this land. The server derives who is acting from it.

  headers:
    LandsContract:
      description: The contract version (info.version) the server implements.
      required: true
      schema: {type: string}

  parameters:
    LandPath:
      name: land
      in: path
      required: true
      description: The land's name.
      schema: {$ref: '#/components/schemas/LandName'}
    TicketPath:
      name: ticket
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    DecisionPath:
      name: decision
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    EvidenceImagePath:
      name: image
      in: path
      required: true
      description: The picture's opaque id, as the DecisionEvidence url carries it.
      schema: {type: string, pattern: '^[0-9a-f]{32}$', minLength: 32, maxLength: 32}
    PlanPath:
      name: plan
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    AgentPath:
      name: agent
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ThreadPath:
      name: thread
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ReleasePath:
      name: release
      in: path
      required: true
      description: The release's tag, or its id.
      schema: {$ref: '#/components/schemas/Id'}
    CursorQuery:
      name: cursor
      in: query
      description: next_cursor from the previous page. Omit for the first page.
      schema: {$ref: '#/components/schemas/Cursor'}
    LimitQuery:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: A retry with the same key returns the first result instead of acting twice.
      schema: {type: string, minLength: 1, maxLength: 128}

  responses:
    Problem:
      description: An error.
      headers:
        X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Land:

        application/json:
          schema: {$ref: '#/components/schemas/Land'}
    Plot:
      description: A plot.
      headers:
        X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Plot'}
    PlotPage:
      description: A page of plots.
      headers:
        X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PlotPage'}
    Member:
      description: A member.
      headers:
        X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}

      headers:
        X-Lands-Contract: {$ref: '#/components/headers/LandsContract'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReleasePage'}

  schemas:
    # ── scalars ─────────────────────────────────────────────────────────────
    Id:
      description: Opaque id, no structure guaranteed.
      type: string
      minLength: 1
      maxLength: 64
    LandName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,62}$'
    Cursor:
      description: Opaque position in a list or the event feed.
      type: string
      minLength: 1
      maxLength: 512
    Timestamp:
      description: RFC 3339, UTC, whole seconds.
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
    Text:
      description: Prose. Ids of records outside this land are replaced with [ref].
      type: string
      maxLength: 65536
    Heraldry:
      description: >-
        Arms: a record's mark, three to five emoji in a row (🔥🧭📦), unique
        in the land. Opaque: show it or send it back as it came; beyond being
        at least three characters, its form is not part of the contract. Absent
        when the record bears none. For now only plans bear arms; tickets and
        plan steps may later.
      type: string
      minLength: 3
      maxLength: 200

    # ── land ────────────────────────────────────────────────────────────────
    LandStatus:
      type: string
      enum: [active, paused]
    Land:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/LandName'}
        status: {$ref: '#/components/schemas/LandStatus'}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    # ── plot ────────────────────────────────────────────────────────────────
    Plot:
      description: A repository the land works in. v1-beta; a land may have exactly one.
      type: object
      additionalProperties: false
      required: [id, name, default_branch]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1, maxLength: 200}
        default_branch: {type: string, minLength: 1, maxLength: 255}
    PlotPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Plot'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}

    # ── crew ────────────────────────────────────────────────────────────────
    MemberRole:
      type: string
      enum: [owner, gardener, steward, member, guest, other]
    MemberStatus:
      type: string
      enum: [active, idle, away]
    Member:
      type: object
      additionalProperties: false
      required: [id, name, role, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1, maxLength: 200}
        role: {$ref: '#/components/schemas/MemberRole'}
        status: {$ref: '#/components/schemas/MemberStatus'}
    MemberPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Member'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}

    # ── ticket ──────────────────────────────────────────────────────────────
    TicketKind:
      type: string
      enum: [task, bug, feature]
    TicketStatus:
      description: waiting means blocked on something the land can see; a ticket blocked on anything else reads open.
      type: string
      enum: [open, in_progress, waiting, done]
    Priority:
      description: 1 is most urgent.
      type: integer
      minimum: 1
      maximum: 4
    Ticket:
      type: object
      additionalProperties: false
      required: [id, kind, title, status, priority, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        kind: {$ref: '#/components/schemas/TicketKind'}
        title: {type: string, minLength: 1, maxLength: 500}
        body: {$ref: '#/components/schemas/Text'}
        status: {$ref: '#/components/schemas/TicketStatus'}
        priority: {$ref: '#/components/schemas/Priority'}
        assignee: {description: Display name of whoever holds it. Absent when unassigned., type: string, maxLength: 200}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        heraldry: {$ref: '#/components/schemas/Heraldry'}
    TicketPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Ticket'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    TicketCreate:
      type: object
      additionalProperties: false
      required: [kind, title]
      properties:
        kind: {$ref: '#/components/schemas/TicketKind'}
        title: {type: string, minLength: 1, maxLength: 500}
        body: {$ref: '#/components/schemas/Text'}
        priority: {$ref: '#/components/schemas/Priority'}
        heraldry:
          description: Arms, as a record carries them (Heraldry). Tickets bear no arms yet, so a ticket given any is refused with invalid_request.
          type: string
          minLength: 3
          maxLength: 200
    TicketUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        body: {$ref: '#/components/schemas/Text'}
        priority: {$ref: '#/components/schemas/Priority'}
        heraldry:
          description: Arms, as a record carries them (Heraldry); the empty string removes them. Tickets bear no arms yet, so any other value is refused with invalid_request.
          type: string
          maxLength: 200
    TicketClose:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 2000}

    # ── comment (on a ticket or a decision) ─────────────────────────────────
    Comment:
      type: object
      additionalProperties: false
      required: [id, author, text, posted_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        author: {type: string, minLength: 1, maxLength: 200}
        text: {$ref: '#/components/schemas/Text'}
        posted_at: {$ref: '#/components/schemas/Timestamp'}
    CommentCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 65536}

    # ── decision ────────────────────────────────────────────────────────────
    DecisionStatus:
      type: string
      enum: [open, resolved, cancelled]
    DecisionArtifactType:
      description: >-
        What answering with an option produces: report (a single report),
        plan, checklist, diff-summary (a summary of a change), epic (a
        breakdown into tasks), bug (a filed bug), tldr (a one-paragraph
        summary) or bundle (several documents).
      type: string
      enum: [report, plan, checklist, diff-summary, epic, bug, tldr, bundle]
      # Go constant names, so they cannot collide with TicketKind's Bug.
      x-enum-varnames: [ArtifactReport, ArtifactPlan, ArtifactChecklist, ArtifactDiffSummary, ArtifactEpic, ArtifactBug, ArtifactTldr, ArtifactBundle]
    DecisionOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        label: {type: string, minLength: 1, maxLength: 500}
        short: {description: 'A few words for a button. Absent when the option has only its label.', type: string, minLength: 1, maxLength: 200}
        description: {$ref: '#/components/schemas/Text'}
        artifact_type: {$ref: '#/components/schemas/DecisionArtifactType'}
    DecisionEvidence:
      description: >-
        One picture a decision shows from the record it is about (the ticket
        that asked it, or one the asker named), so the decision links the
        screenshots instead of carrying copies.
      type: object
      additionalProperties: false
      required: [source_id, url]
      properties:
        source_id: {$ref: '#/components/schemas/Id'}
        source_title: {description: Title of the record the picture is on., type: string, maxLength: 500}
        url: {description: 'Absolute https link to the picture on the land''s own door: the getDecisionEvidence route, called with the same bearer as any other call. Never another host.', type: string, minLength: 1, maxLength: 2048}
        alt: {description: 'Alt text: the Markdown alt text, else the file name.', type: string, maxLength: 500}
    Decision:
      type: object
      additionalProperties: false
      required: [id, question, options, status, opened_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        question: {type: string, minLength: 1, maxLength: 2000}
        context: {$ref: '#/components/schemas/Text'}
        options: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/DecisionOption'}}
        evidence:
          description: >-
            Newest first within each record, at most 20. Absent when there are
            none, on a page of decisions (listDecisions reads no linked
            records), and when the land cannot serve pictures.
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/DecisionEvidence'}
        status: {$ref: '#/components/schemas/DecisionStatus'}
        # The chosen option id. Present only when resolved.
        chosen: {$ref: '#/components/schemas/Id'}
        opened_at: {$ref: '#/components/schemas/Timestamp'}
    DecisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Decision'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    DecisionResolve:
      type: object
      additionalProperties: false
      required: [option_id]
      properties:
        option_id: {$ref: '#/components/schemas/Id'}
        note: {type: string, maxLength: 2000}
    DecisionCancel:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}

    # ── escalation ──────────────────────────────────────────────────────────
    EscalationStatus:
      type: string
      enum: [open, approved, rejected]
    Escalation:
      type: object
      additionalProperties: false
      required: [id, title, reason, status, requested_by]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string, minLength: 1, maxLength: 500}
        reason: {$ref: '#/components/schemas/Text'}
        status: {$ref: '#/components/schemas/EscalationStatus'}
        requested_by: {description: Display name., type: string, minLength: 1, maxLength: 200}
    EscalationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Escalation'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    EscalationCreate:
      type: object
      additionalProperties: false
      required: [title, reason]
      properties:
        title: {type: string, minLength: 1, maxLength: 500}
        reason: {type: string, minLength: 1, maxLength: 65536}

    # ── plan ────────────────────────────────────────────────────────────────
    PlanState:
      type: string
      enum: [draft, ready, building, complete, abandoned]
    PlanStep:
      type: object
      additionalProperties: false
      required: [id, title, status]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string, minLength: 1, maxLength: 500}
        status: {$ref: '#/components/schemas/TicketStatus'}
        heraldry: {$ref: '#/components/schemas/Heraldry'}
    Plan:
      type: object
      additionalProperties: false
      required: [id, title, state, steps]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string, minLength: 1, maxLength: 500}
        phase: {description: Title of the phase now being worked. Absent for a plan without phases., type: string, maxLength: 500}
        state: {$ref: '#/components/schemas/PlanState'}
        steps: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/PlanStep'}}
        heraldry: {$ref: '#/components/schemas/Heraldry'}
    PlanPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Plan'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    PlanAnswer:
      type: object
      additionalProperties: false
      required: [decision_id, option_id]
      properties:
        decision_id: {$ref: '#/components/schemas/Id'}
        option_id: {$ref: '#/components/schemas/Id'}
        note: {type: string, maxLength: 2000}

    # ── thread / message ────────────────────────────────────────────────────
    Thread:
      type: object
      additionalProperties: false
      required: [id, title, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        title: {type: string, minLength: 1, maxLength: 500}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    ThreadPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Thread'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    Message:
      type: object
      additionalProperties: false
      required: [id, thread_id, author, text, posted_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        thread_id: {$ref: '#/components/schemas/Id'}
        author: {description: Display name., type: string, minLength: 1, maxLength: 200}
        text: {$ref: '#/components/schemas/Text'}
        posted_at: {$ref: '#/components/schemas/Timestamp'}
    MessagePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Message'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    MessageCreate:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 65536}

    # ── budget ──────────────────────────────────────────────────────────────
    BudgetUnit:
      type: string
      enum: [credits]
    BudgetStatus:
      type: string
      enum: [ok, exhausted]
    Budget:
      type: object
      additionalProperties: false
      required: [limit, spent, unit, status]
      properties:
        limit: {type: number, minimum: 0}
        spent: {type: number, minimum: 0}
        unit: {$ref: '#/components/schemas/BudgetUnit'}
        status: {$ref: '#/components/schemas/BudgetStatus'}
    BudgetDay:
      type: object
      additionalProperties: false
      required: [day, spent, remaining]
      properties:
        day: {description: 'The UTC day, YYYY-MM-DD.', type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        spent: {description: 'Credits spent that day.', type: number, minimum: 0}
        remaining: {description: 'Credits remaining at the end of that day, or now for today.', type: number, minimum: 0}
    BudgetHistory:
      type: object
      additionalProperties: false
      required: [unit, points]
      properties:
        unit: {$ref: '#/components/schemas/BudgetUnit'}
        points: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/BudgetDay'}}
        stale:
          description: |
            true when the credit series could not be read and the points come
            from the purse's own recorded snapshots instead: coarser, and a day
            the purse was not read on has no point. Absent means the series
            answered.
          type: boolean

    # ── agent (one a member runs on their own machine) ─────────────────────
    AgentStatus:
      description: active until the agent is revoked or stops; a stopped agent's bearer is not refreshed.
      type: string
      enum: [active, stopped]
    Agent:
      description: An agent a member started on their own machine (createAgent).
      type: object
      additionalProperties: false
      required: [id, name, status, started_by, started_at]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        name: {type: string, minLength: 1, maxLength: 64}
        status: {$ref: '#/components/schemas/AgentStatus'}
        started_by: {description: Display name of the member who started it., type: string, minLength: 1, maxLength: 200}
        started_at: {$ref: '#/components/schemas/Timestamp'}
    AgentPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Agent'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    AgentCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          description: What to call the agent. The land adds a short suffix so names stay distinct; laptop when absent.
          type: string
          pattern: '^[a-z][a-z0-9-]{0,31}$'
    AgentGrant:
      description: |
        The credential an agent runs under, answered once (createAgent,
        refreshAgent) and never read back. bearer is sent as the agent's
        Authorization bearer at door_url and nowhere else. Exchange refresh
        with refreshAgent before expires_at.
      type: object
      additionalProperties: false
      required: [agent_id, bearer, refresh, expires_at, door_url]
      properties:
        agent_id: {$ref: '#/components/schemas/Id'}
        bearer: {description: Opaque., type: string, minLength: 1, maxLength: 512}
        refresh: {description: Opaque; spent by refreshAgent., type: string, minLength: 1, maxLength: 512}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        door_url: {description: 'The land''s public door, the base URL the agent''s own clients use.', type: string, format: uri, maxLength: 2048}
    AgentRefresh:
      type: object
      additionalProperties: false
      required: [refresh]
      properties:
        refresh: {type: string, minLength: 1, maxLength: 512}
    # ── release ─────────────────────────────────────────────────────────────
    ReleaseStatus:
      description: |
        cut: recorded, not built or deployed. built: every artifact exists,
        deployed nowhere yet. live: runs on at least one target. superseded:
        has run, and every target now runs another release.
      type: string
      enum: [cut, built, live, superseded]
    ReleaseItem:
      description: One merged pull request the release carries.
      type: object
      additionalProperties: false
      required: [pr, title, url]
      properties:
        pr: {description: The pull request's number., type: integer, minimum: 1}
        title: {type: string, minLength: 1, maxLength: 500}
        url: {type: string, format: uri, maxLength: 2048}
        # The plan step that produced it, and that step's plan. Absent when none.
        step: {$ref: '#/components/schemas/Id'}
        plan: {$ref: '#/components/schemas/Id'}
    Deployment:
      description: One period the release ran on one target.
      type: object
      additionalProperties: false
      required: [target, since]
      properties:
        target: {description: "The target's name, as the land declares it (prod).", type: string, minLength: 1, maxLength: 64}
        kind: {description: 'What the target is (k3s, land). Opaque.', type: string, minLength: 1, maxLength: 64}
        since: {$ref: '#/components/schemas/Timestamp'}
        # When another release took the target. Absent while it runs there.
        until: {$ref: '#/components/schemas/Timestamp'}
        by: {description: Display name of who or what reported it., type: string, minLength: 1, maxLength: 200}
        revision: {description: "The target's own revision of the rollout (a Helm revision, a deployment id).", type: string, minLength: 1, maxLength: 200}
    Release:
      type: object
      additionalProperties: false
      required: [id, tag, status, contents, deployments]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        tag: {type: string, minLength: 1, maxLength: 64}
        status: {$ref: '#/components/schemas/ReleaseStatus'}
        sha: {description: The commit the tag names., type: string, pattern: '^[0-9a-f]{7,64}$'}
        cut_at: {$ref: '#/components/schemas/Timestamp'}
        contents: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/ReleaseItem'}}
        deployments: {description: Oldest first., type: array, maxItems: 500, items: {$ref: '#/components/schemas/Deployment'}}
    ReleasePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Release'}}
        next_cursor: {$ref: '#/components/schemas/Cursor'}
    DeploymentReport:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: {description: One of the land's declared targets., type: string, minLength: 1, maxLength: 64}
        revision: {type: string, minLength: 1, maxLength: 200}
        by: {description: Who or what rolled it out (a CI job's name). Absent means the caller., type: string, minLength: 1, maxLength: 200}

    # ── event (one SSE frame) ───────────────────────────────────────────────
    EventType:
      description: |
        The only event types ever streamed. The object each carries:
        ticket.updated Ticket; decision.opened and decision.resolved Decision;
        escalation.opened Escalation; message.posted Message; plan.updated
        Plan; budget.updated Budget; release.cut (a release was recorded)
        and release.deployed (its deployments changed) Release.
      type: string
      enum:
        - ticket.updated
        - decision.opened
        - decision.resolved
        - escalation.opened
        - message.posted
        - plan.updated
        - budget.updated
        - release.cut
        - release.deployed
    Event:
      type: object
      additionalProperties: false
      required: [id, type, object]
      properties:
        id: {$ref: '#/components/schemas/Cursor'}
        type: {$ref: '#/components/schemas/EventType'}
        object:
          oneOf:
            - {$ref: '#/components/schemas/Ticket'}
            - {$ref: '#/components/schemas/Decision'}
            - {$ref: '#/components/schemas/Escalation'}
            - {$ref: '#/components/schemas/Message'}
            - {$ref: '#/components/schemas/Plan'}
            - {$ref: '#/components/schemas/Budget'}
            - {$ref: '#/components/schemas/Release'}

    # ── errors ──────────────────────────────────────────────────────────────
    ProblemCode:
      type: string
      enum:
        - unauthenticated
        - not_found
        - forbidden
        - invalid_request
        - conflict
        - budget_exhausted
        - land_paused
        - rate_limited
        - upstream_unavailable
    Problem:
      description: RFC 9457 problem details. Upstream error text never appears here.
      type: object
      additionalProperties: false
      required: [type, title, status, code, correlation_id]
      properties:
        type: {description: 'urn:lands:problem:<code>', type: string, pattern: '^urn:lands:problem:[a-z_]+$'}
        title: {description: Fixed per code., type: string, minLength: 1, maxLength: 200}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {$ref: '#/components/schemas/ProblemCode'}
        detail: {description: Only the server's own request validator fills this in., type: string, maxLength: 2000}
        correlation_id: {description: Quote this to support., type: string, minLength: 1, maxLength: 64}

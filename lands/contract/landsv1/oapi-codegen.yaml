# oapi-codegen config for the Lands contract Go binding. Regenerate with
# `make generate-lands-contract` (repo root); CI fails if the committed output
# drifts from openapi.yaml.
package: landsv1
output: landsv1.gen.go
generate:
  models: true
  client: true
  std-http-server: true
output-options:
  skip-prune: true

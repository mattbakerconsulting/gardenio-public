syntax = "proto3";
package beads.v1;
option go_package = "gardenio/kbeads/gen/beads/v1;beadsv1";

import "google/protobuf/timestamp.proto";

// Bead is the core work-item record.
message Bead {
  string id = 1;
  string slug = 2;
  string kind = 3;
  string type = 4;
  string title = 5;
  string description = 6;
  string notes = 7;
  string status = 8;
  int32 priority = 9;
  string assignee = 10;
  string owner = 11;
  google.protobuf.Timestamp created_at = 12;
  string created_by = 13;
  google.protobuf.Timestamp updated_at = 14;
  optional google.protobuf.Timestamp closed_at = 15;
  optional google.protobuf.Timestamp due_at = 16;
  optional google.protobuf.Timestamp defer_until = 17;
  bytes fields = 18;
  repeated string labels = 19;
  repeated Dependency dependencies = 20;
  repeated Comment comments = 21;
  // operated_by is the human (Slack U-id, OIDC subject, etc.) on whose behalf
  // this bead was created. Empty for autonomous / scheduled beads. Set
  // server-side by operatedByFromContext (kbeads/internal/server/audit.go).
  string operated_by = 22;
  // operated_by_display is an optional human-readable label resolved server-side
  // from operated_by (e.g. "Matt Baker" for "slack:U0OPERATOR2"). Empty when
  // unresolved. Read-only from clients.
  string operated_by_display = 23;
  // operated_by_email is the canonical email resolved server-side from
  // operated_by (e.g. "matt@example.com"). Empty when unresolved.
  // Read-only from clients.
  string operated_by_email = 24;
  // has_report is true when this bead has a direct (depth-1) parent-child
  // child whose type ∈ {report, rich-report, bundle} and whose
  // deleted_at IS NULL. Populated by ListBeads SELECT projection;
  // GetBead and other read paths leave it as false. See R1 spec at
  // gardenio/docs/research/sequencer-report-decision-visibility.md.
  bool has_report = 25;
  // relevance_score is the text-search relevance of this bead for the query
  // that produced it (ka-0000003832 / ka-search relevance Option 2): the
  // Option-1 title-match tier (0–3) plus a Postgres FTS ts_rank_cd component.
  // Populated by the ListBeads SELECT projection ONLY when a text search is
  // active; 0 on non-search listings and other read paths. Read-only from
  // clients.
  double relevance_score = 26;
  // short_title is the <=40-rune human name for the bead (Slack prose,
  // beads-viewer lists, agent cards). Empty when unset. See
  // model.ShortTitleHelp and plan gd-YZATAIOhfW.
  string short_title = 27;
  // heraldry is the bead's arms, the run of three to five emoji ("🔥🧭📦";
  // heraldry spec gardenio/docs/superpowers/specs/2026-10-25-heraldry-design.md).
  // A bead not yet rewritten may still carry the old shield form ("blue 🔥 .
  // 🧭 . 📦"), whose emoji read in order are its run. Empty when the bead
  // bears none.
  string heraldry = 28;
}

// Dependency represents a directional relationship between two beads.
message Dependency {
  string bead_id = 1;
  string depends_on_id = 2;
  string type = 3;
  google.protobuf.Timestamp created_at = 4;
  string created_by = 5;
  string metadata = 6;
  // operated_by mirrors Bead.operated_by for the dep edge.
  string operated_by = 7;
}

// Comment represents a comment on a bead.
message Comment {
  int64 id = 1;
  string bead_id = 2;
  string author = 3;
  string text = 4;
  google.protobuf.Timestamp created_at = 5;
  // operated_by — see Bead.operated_by.
  string operated_by = 6;
  // operated_by_display — see Bead.operated_by_display.
  string operated_by_display = 7;
  // operated_by_email — see Bead.operated_by_email.
  string operated_by_email = 8;
}

// Event is a persisted event record.
message Event {
  int64 id = 1;
  string topic = 2;
  string bead_id = 3;
  string actor = 4;
  bytes payload = 5;
  google.protobuf.Timestamp created_at = 6;
  // operated_by — see Bead.operated_by. actor is the agent that performed
  // the mutation; operated_by is the human they acted for.
  string operated_by = 7;
}

// Config is a key-value configuration record.
message Config {
  string key = 1;
  bytes value = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

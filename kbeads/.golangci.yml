        text: '^Function ''runAdminBackfillCloseOrphanSessions'' is too long \((?:[0-9]{1,2}|1[0-3][0-9]|14[0-2]|143) > '
      # funlen cmd/kd/admin_backfill_mr_beads.go runAdminBackfillMRBeads 140 154

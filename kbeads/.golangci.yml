version: "2"

linters:
  disable:
    - errcheck
  enable:
    - depguard
    - funlen
    - gocyclo
  settings:
    # Function caps (gd-d29n0m678l), the "long" and "complex" of
    # gardenio/docs/code-reduction-targets.md. funlen counts body lines, two
    # fewer than code-size.sh's `func` line to closing brace, so 98 here is
    # "over 100 lines" there. Comments count, as they do there.
    funlen:
      lines: 98
      statements: -1
      ignore-comments: false
    gocyclo:
      min-complexity: 30
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST*"
    # The Lands map's dependency guard (Door D.6 gd-yKOBNCMyNk, contract
    # design gd-EWSKPH7pa5 §3). internal/landmap is the only package that
    # imports the Lands contract, and it reaches the daemon only through its
    # routes, never the server, store or protobuf types. The go list half of
    # the guard is TestOnlyLandmapImportsTheContract.
    depguard:
      rules:
        lands-contract:
          files:
            - "$all"
            - "!**/internal/landmap/**"
          deny:
            - pkg: gardenio/lands
              desc: only internal/landmap may import the Lands contract
        landmap:
          files:
            - "**/internal/landmap/**"
          deny:
            - pkg: gardenio/kbeads/internal/server
              desc: the map calls the daemon's routes, not its handlers
            - pkg: gardenio/kbeads/internal/store
              desc: the map never reads the store; every read goes through a daemon route
            - pkg: gardenio/kbeads/gen
              desc: never marshal beads.v1 into a contract response
            - pkg: gardenio/kbeads/internal/client
              desc: the map calls the daemon in-process, not over a client
  # The funcs already over a cap when the ratchet landed, each held to its
  # own cap instead. scripts/ratchets/func-baseline.py writes the block and it
  # may only shrink: run it after cutting a listed func; never add a rule by
  # hand. See "Ratchets" in gardenio/docs/code-reduction-targets.md.
  exclusions:
    rules:
      # BEGIN func-baseline (scripts/ratchets/func-baseline.py writes this block; it may only shrink)
